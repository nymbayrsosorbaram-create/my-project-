<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цэцэрлэгийн төлөвлөгөө</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2b2140; --paper: #fffaf0; --sky: #bfe6ff; --muted: #6b5f80;
    --pink: #ff8fab; --yellow: #ffd23f; --mint: #7ee0b5; --lilac: #c3a6ff; --orange: #ffa45c; --sea: #5cc8ff;
    --blue: #B4C6E7; --green: #C5E0B3;           /* хэвлэх/Word-ийн албан өнгө */
    --u-ui: #9cc8ff; --d-ui: #b5eb8f;            /* дэлгэцийн cartoon өнгө */
    --line: #2b2140; --accent: #6c4cf5;
    --warn: #b54708; --warn-soft: #fff1d6;
    --r: 18px; --sh: 4px 4px 0 var(--ink); --sh-sm: 2px 2px 0 var(--ink);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink);
    font: 600 14px/1.5 "Nunito", "Comic Sans MS", "Segoe UI", system-ui, sans-serif;
    background-color: var(--sky);
    background-image:
      radial-gradient(circle at 20px 20px, rgba(255,255,255,.55) 3px, transparent 4px),
      radial-gradient(circle at 60px 50px, rgba(255,255,255,.35) 2px, transparent 3px);
    background-size: 80px 80px;
    min-height: 100vh;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  .btn {
    border: 2.5px solid var(--ink); background: #fff; border-radius: 999px; padding: 7px 16px;
    cursor: pointer; white-space: nowrap; box-shadow: var(--sh-sm); font-weight: 800;
    transition: transform .08s, box-shadow .08s;
  }
  .btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
  .btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  .btn.primary { background: var(--yellow); }
  .btn.pink { background: var(--pink); }
  .btn.mint { background: var(--mint); }
  .btn.lilac { background: var(--lilac); }
  .btn.danger { background: #ffd6d6; color: #a1121a; }
  .btn.small { padding: 2px 10px; font-size: 12px; }
  input, select, textarea { border: 2.5px solid var(--ink); border-radius: 12px; padding: 7px 10px; background: #fff; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: 3px solid var(--yellow); outline-offset: 1px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink); font-weight: 800; }

  /* Толгой: үүл, нар */
  header {
    position: relative; overflow: hidden;
    background: linear-gradient(180deg, #8fd3ff, var(--sky));
    border-bottom: 3px solid var(--ink); padding: 18px 16px 26px;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-right: 130px;
  }
  header::before { /* нар */
    content: ""; position: absolute; right: -30px; top: -40px; width: 130px; height: 130px; border-radius: 50%;
    background: var(--yellow); border: 3px solid var(--ink);
    box-shadow: 0 0 0 14px rgba(255,210,63,.35), 0 0 0 28px rgba(255,210,63,.18);
  }
  header::after { /* өвс */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 12px;
    background: radial-gradient(circle at 10px 12px, var(--mint) 9px, transparent 10px) 0 0 / 20px 12px repeat-x;
  }
  header > * { position: relative; z-index: 1; }
  header h1 { font-size: 24px; font-weight: 900; margin: 0 auto 0 0; letter-spacing: .2px; text-shadow: 2px 2px 0 #fff; display: flex; align-items: center; gap: 10px; }
  header h1 .logo { font-size: 38px; filter: drop-shadow(2px 2px 0 var(--ink)); animation: bob 3s ease-in-out infinite; }
  header .sub { font-size: 12px; color: var(--muted); font-weight: 700; display: block; text-shadow: none; }
  @keyframes bob { 50% { transform: translateY(-4px) rotate(-6deg); } }
  @media (prefers-reduced-motion: reduce) { header h1 .logo { animation: none; } .btn { transition: none; } }

  /* Бүлгийн таб */
  .groups { display: flex; gap: 12px; padding: 18px 16px 0; flex-wrap: wrap; }
  .groups button {
    display: flex; align-items: center; gap: 10px; text-align: left;
    border: 3px solid var(--ink); border-radius: 22px 22px 0 0; border-bottom: none;
    padding: 10px 18px 10px 12px; cursor: pointer; background: #fff; transform: translateY(6px);
    transition: transform .12s;
  }
  .groups button:hover { transform: translateY(2px); }
  .groups button .em { font-size: 30px; line-height: 1; filter: drop-shadow(1px 1px 0 var(--ink)); }
  .groups button b { display: block; font-size: 16px; font-weight: 900; }
  .groups button span.lv { font-size: 11px; color: var(--muted); }
  .groups button[data-g="0"] { background: #fff3b0; }
  .groups button[data-g="1"] { background: #ffd6e0; }
  .groups button[data-g="2"] { background: #d4f5e5; }
  .groups button[data-g="3"] { background: #e3d7ff; }
  .groups button.active { transform: translateY(0); padding-bottom: 16px; }

  .shell {
    background: var(--paper); border: 3px solid var(--ink); border-radius: 0 var(--r) var(--r) var(--r);
    margin: 0 16px 24px; display: grid; grid-template-columns: 240px 1fr; min-height: 72vh; box-shadow: var(--sh);
  }
  aside { border-right: 3px dashed #d9cfe8; padding: 14px 10px; display: flex; flex-direction: column; gap: 6px; }
  aside button {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    border: 2.5px solid transparent; background: none; padding: 8px 10px; border-radius: 14px; cursor: pointer; font-weight: 800;
  }
  aside button .ic { font-size: 20px; width: 26px; text-align: center; }
  aside button .nm { flex: 1; }
  aside button small { background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 0 7px; font-size: 11px; font-weight: 900; }
  aside button:hover { background: #fff; border-color: var(--ink); }
  aside button.active { background: var(--yellow); border-color: var(--ink); box-shadow: var(--sh-sm); }
  aside hr { border: none; border-top: 3px dotted #d9cfe8; margin: 6px 0; width: 100%; }
  .content { padding: 20px; min-width: 0; }
  .content h2 { font-size: 22px; font-weight: 900; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  .content h2 .ic { font-size: 30px; filter: drop-shadow(2px 2px 0 var(--ink)); }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 10px 0 14px; }
  .toolbar .grow { margin-right: auto; }
  .muted { color: var(--muted); font-size: 13px; font-weight: 700; }
  .scroll { overflow-x: auto; padding: 2px 6px 8px 2px; }
  a { color: var(--accent); font-weight: 900; }

  /* Төлөвлөгөөний хүснэгт — суурь (хэвлэхэд ашиглана) */
  table.plan { border-collapse: collapse; width: 100%; min-width: 980px; font-size: 13px; }
  .plan th, .plan td { border: 1px solid #9aa3b2; padding: 4px 6px; vertical-align: top; }
  .plan th { background: #eef1f6; text-align: center; font-weight: 700; }
  .plan td.m { text-align: center; vertical-align: middle; width: 58px; font-size: 12px; }
  .plan td.u { background: var(--blue); }
  .plan td.d { background: var(--green); }
  .plan td.num { text-align: center; vertical-align: middle; width: 56px; font-weight: 700; }
  .plan td.out { min-width: 300px; }
  .plan td.out .code { font-weight: 800; }
  .plan td.out ul { margin: 4px 0 0; padding-left: 16px; font-size: 12px; }
  .plan td.out .lnk-h { font-size: 12px; font-style: italic; margin-top: 4px; }
  .plan tfoot td { font-weight: 800; }

  /* Дэлгэц дээрх cartoon хүснэгт */
  .content table.plan { border-collapse: separate; border-spacing: 0; border: 3px solid var(--ink); border-radius: var(--r); overflow: hidden; background: #fff; box-shadow: var(--sh); font-weight: 600; }
  .content .plan th, .content .plan td { border: 0; border-right: 1.5px solid #cfc4e2; border-bottom: 1.5px solid #cfc4e2; }
  .content .plan th { background: var(--lilac); color: var(--ink); font-weight: 900; border-color: var(--ink); border-bottom-width: 2.5px; }
  .content .plan thead tr:first-child th:nth-child(4) { background: #ffe58a; }
  .content .plan thead tr:first-child th:nth-child(5) { background: #ffc2d1; }
  .content .plan thead tr:first-child th:nth-child(6) { background: #a8ecc9; }
  .content .plan td.m { cursor: pointer; transition: transform .1s; }
  .content .plan td.m:hover { box-shadow: inset 0 0 0 3px var(--ink); }
  .content .plan td.u { background: var(--u-ui); font-weight: 900; }
  .content .plan td.d { background: var(--d-ui); }
  .content .plan td.d::after { content: "★"; color: #4f9a2b; font-size: 13px; }
  .content .plan td.num { font-size: 16px; font-weight: 900; }
  .content .plan td.out { cursor: pointer; }
  .content .plan td.out .code { background: var(--yellow); border: 2px solid var(--ink); border-radius: 8px; padding: 0 5px; font-weight: 900; }
  .content .plan td.out .lnk-h { color: var(--muted); }
  .content .plan tr.row:hover td.out { background: #fff8db; }
  .content .plan tfoot td { background: #fff3b0; font-weight: 900; font-size: 15px; }
  .content .plan td.ar { background: #fff6e8; font-weight: 900; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; font-weight: 800; align-items: center; }
  .sw { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--ink); border-radius: 6px; vertical-align: -4px; margin-right: 5px; }
  .warn-box { background: var(--warn-soft); color: var(--warn); border: 3px solid var(--ink); border-radius: var(--r); padding: 10px 14px; margin: 12px 0; font-size: 13px; box-shadow: var(--sh-sm); }
  .warn-box ul { margin: 4px 0 0; padding-left: 18px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; margin: 14px 0 20px; }
  .card { border: 3px solid var(--ink); border-radius: var(--r); padding: 12px 14px; box-shadow: var(--sh); position: relative; }
  .card:nth-child(1) { background: #fff3b0; } .card:nth-child(2) { background: #ffd6e0; }
  .card:nth-child(3) { background: #d6e9ff; } .card:nth-child(4) { background: #dcf7c8; }
  .card .em { position: absolute; right: 10px; top: 8px; font-size: 30px; }
  .card .v { font-size: 34px; font-weight: 900; line-height: 1.1; }
  .card .l { font-size: 13px; font-weight: 800; }
  table.sum { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; border: 3px solid var(--ink); border-radius: var(--r); overflow: hidden; background: #fff; box-shadow: var(--sh); }
  .sum th, .sum td { border-bottom: 1.5px solid #e2d9f0; padding: 7px 8px; text-align: center; }
  .sum th { background: var(--lilac); font-weight: 900; border-bottom: 2.5px solid var(--ink); }
  .sum td:first-child, .sum th:first-child { text-align: left; }
  .sum tbody tr:nth-child(even) td { background: #fbf7ff; }
  .sum tfoot td { border-top: 2.5px solid var(--ink); border-bottom: 0; }
  .bar { display: inline-block; height: 10px; border: 2px solid var(--ink); border-radius: 999px; background: var(--pink); vertical-align: middle; }
  .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; max-width: 900px; margin-top: 12px; }

  dialog { border: 3px solid var(--ink); border-radius: 24px; padding: 0; width: min(580px, 94vw); box-shadow: 6px 6px 0 var(--ink); background: var(--paper); color: var(--ink); }
  dialog::backdrop { background: rgba(43, 33, 64, .45); }
  dialog form { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  dialog h3 { margin: 0; font-size: 18px; font-weight: 900; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg label { flex-direction: row; align-items: center; gap: 6px; border: 2.5px solid var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; background: #fff; }
  .seg label:has(input:checked) { background: var(--yellow); box-shadow: var(--sh-sm); }
  .seg input { width: auto; accent-color: var(--accent); }
  .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .dlg-actions .left { margin-right: auto; }
  .hint { font-size: 13px; background: #fff; border: 2px dashed var(--ink); border-radius: 12px; padding: 8px 10px; min-height: 34px; }

  #print-root { display: none; }
  @media (max-width: 760px) {
    header { padding-right: 16px; }
    header::before { width: 90px; height: 90px; right: -35px; top: -45px; }
    header h1 { font-size: 19px; width: 100%; padding-right: 50px; }
    .shell { grid-template-columns: 1fr; margin: 0 8px 16px; border-radius: 0 var(--r) var(--r) var(--r); }
    aside { border-right: none; border-bottom: 3px dashed #d9cfe8; flex-direction: row; overflow-x: auto; }
    aside button { width: auto; white-space: nowrap; }
    aside hr { display: none; }
    .groups { padding: 12px 8px 0; gap: 6px; }
    .groups button { padding: 8px 10px; }
    .groups button .lv { display: none; }
  }
  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    body { background: #fff; font-weight: 400; }
    header, .groups, .shell, dialog { display: none !important; }
    #print-root { display: block; }
    .pdoc { page-break-after: always; font-family: "Times New Roman", serif; font-size: 11pt; }
    .pdoc:last-child { page-break-after: auto; }
    .plan { min-width: 0; font-size: 9.5pt; }
    .plan th, .plan td { border: 1px solid #000; }
    .plan td.m { width: 34px; font-size: 8pt; padding: 2px; }
    .plan td.num { width: 40px; }
    .plan tfoot { display: table-row-group; }
    .plan td.u { background: var(--blue) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .plan td.d { background: var(--green) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    thead { display: table-header-group; }
  }
</style>
</head>
<body>
<header>
  <h1><span class="logo" aria-hidden="true">🧸</span><span>Цэцэрлэгийн жилийн төлөвлөгөө <span class="sub" id="hdr-sub"></span></span></h1>
  <button class="btn mint" id="btn-print">🖨️ Хэвлэх / PDF</button>
  <button class="btn primary" id="btn-word">📄 Word татах</button>
  <button class="btn pink" id="btn-json">💾 JSON хадгалах</button>
  <label class="btn lilac" style="flex-direction:row;color:inherit;font-size:14px">📂 JSON нээх<input type="file" id="file-json" accept=".json" hidden></label>
</header>

<div class="groups" id="groups"></div>

<div class="shell">
  <aside id="nav"></aside>
  <div class="content" id="content"></div>
</div>

<div id="print-root"></div>

<!-- Сарын нүд засах -->
<dialog id="dlg-cell">
  <form method="dialog">
    <h3 id="cell-title"></h3>
    <div class="seg">
      <label><input type="radio" name="t" value=""> Хэрэгжүүлэхгүй</label>
      <label><input type="radio" name="t" value="d"><span class="sw" style="background:var(--d-ui)"></span>Давтамж</label>
      <label><input type="radio" name="t" value="u"><span class="sw" style="background:var(--u-ui)"></span>Уялдаа</label>
    </div>
    <div id="cell-link">
      <label>Уялдах суралцахуйн үр дүн (бусад чиглэлээс)
        <select id="cell-code"></select>
      </label>
      <div class="hint" id="cell-hint"></div>
    </div>
    <div class="dlg-actions">
      <button class="btn" value="cancel" formnovalidate>Болих</button>
      <button class="btn primary" value="ok">Хадгалах</button>
    </div>
  </form>
</dialog>

<!-- Мөр засах -->
<dialog id="dlg-row">
  <form method="dialog">
    <h3 id="row-title">Суралцахуйн үр дүн</h3>
    <label>Ай<input id="row-area" list="dl-areas" required></label>
    <label>Дэд ай<input id="row-sub" list="dl-subs" required></label>
    <label>Код<input id="row-code" placeholder="ж: НСХ1.1а" required></label>
    <label>Суралцахуйн үр дүн<textarea id="row-text" rows="3" required></textarea></label>
    <datalist id="dl-areas"></datalist><datalist id="dl-subs"></datalist>
    <div class="dlg-actions">
      <button class="btn danger left" value="delete" id="row-del" formnovalidate>Устгах</button>
      <button class="btn" value="up" id="row-up" formnovalidate>↑</button>
      <button class="btn" value="down" id="row-down" formnovalidate>↓</button>
      <button class="btn" value="cancel" formnovalidate>Болих</button>
      <button class="btn primary" value="ok">Хадгалах</button>
    </div>
  </form>
</dialog>

<script>
const ORIGINAL = /*__PLAN_DATA__*/null;
(() => {
  const KEY = 'kg-annual-plan-v1';
  const MONTHS = ORIGINAL.months;               // ['09',...,'05']
  const TERMS = [['1 улирал', 3], ['2 улирал', 3], ['3 улирал', 3]];
  const GROUP_EM = { 'БАГА': '🐣', 'ДУНД': '🐰', 'АХЛАХ': '🦁', 'БЭЛТГЭЛ': '🎒' };
  const DIR_EM = { 'НИЙГЭМ-СЭТГЭЛ ХӨДЛӨЛ': '💛', 'ХӨДӨЛГӨӨН, ЭРҮҮЛ МЭНД': '🤸', 'ХЭЛ ЯРИА': '💬',
                   'БАЙГАЛЬ, НИЙГМИЙН ОРЧИН': '🌳', 'МАТЕМАТИК': '🔢', 'ЗУРАГ, УРЛАЛ': '🎨', 'ХӨГЖИМ': '🎵' };
  const gem = g => GROUP_EM[g.name] || '🌈', dem = d => DIR_EM[d.name] || '⭐';
  const ABBR = { 'НИЙГЭМ-СЭТГЭЛ ХӨДЛӨЛ': 'НСХ', 'ХӨДӨЛГӨӨН, ЭРҮҮЛ МЭНД': 'ХЭМ', 'ХЭЛ ЯРИА': 'ХЯ',
                 'БАЙГАЛЬ, НИЙГМИЙН ОРЧИН': 'БНО', 'МАТЕМАТИК': 'МАТ', 'ЗУРАГ, УРЛАЛ': 'ЗУ', 'ХӨГЖИМ': 'ХӨГ' };
  const clone = o => JSON.parse(JSON.stringify(o));
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = s => document.querySelector(s);

  let data;
  try { data = JSON.parse(localStorage.getItem(KEY)) || clone(ORIGINAL); } catch { data = clone(ORIGINAL); }
  const ui = { g: 0, view: 'overview' };   // view: 'overview' | 'info' | direction index
  try { Object.assign(ui, JSON.parse(localStorage.getItem(KEY + ':ui')) || {}); } catch {}
  if (!data.groups[ui.g]) ui.g = 0;

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} };
  const saveUi = () => { try { localStorage.setItem(KEY + ':ui', JSON.stringify(ui)); } catch {} };

  const G = () => data.groups[ui.g];
  const title = s => s ? s.charAt(0) + s.slice(1).toLowerCase() : s;
  const count = (rows, t) => rows.reduce((s, r) => s + r.months.filter(m => m.t === t).length, 0);

  // Бүлгийн бүх үр дүнгийн индекс (уялдаа сонгох, шалгахад)
  function outcomeIndex(g) {
    const map = new Map();
    g.directions.forEach((d, di) => d.rows.forEach(r => r.code && map.set(r.code, { text: r.text, dir: d.name, di })));
    return map;
  }

  function issues(g, di) {
    const idx = outcomeIndex(g), out = [];
    g.directions[di].rows.forEach(r => {
      if (!r.months.some(m => m.t)) out.push(`${r.code} — аль ч сард төлөвлөгдөөгүй байна.`);
      r.months.forEach((m, i) => {
        if (m.t === 'u' && !m.code) out.push(`${r.code} — ${MONTHS[i]} сарын уялдаанд код сонгоогүй.`);
        else if (m.t === 'u' && !idx.has(m.code)) out.push(`${r.code} — ${MONTHS[i]} сарын уялдаа “${m.code}” энэ бүлгийн төлөвлөгөөнд олдсонгүй.`);
      });
    });
    return out;
  }

  // ---------- рендер ----------
  function render() {
    saveUi();
    const g = G();
    $('#hdr-sub').textContent = `${title(g.school)} · ${g.year} оны хичээлийн жил`;
    $('#groups').innerHTML = data.groups.map((x, i) =>
      `<button data-g="${i}" class="${i === ui.g ? 'active' : ''}"><span class="em" aria-hidden="true">${gem(x)}</span><span><b>${title(x.name)} бүлэг</b><span class="lv">${esc(x.level)}</span></span></button>`).join('');
    $('#groups').querySelectorAll('button').forEach(b => b.onclick = () => { ui.g = +b.dataset.g; render(); });

    $('#nav').innerHTML = `
      <button data-v="overview" class="${ui.view === 'overview' ? 'active' : ''}"><span class="ic">🏠</span><span class="nm">Тойм</span></button>
      <button data-v="info" class="${ui.view === 'info' ? 'active' : ''}"><span class="ic">📝</span><span class="nm">Ерөнхий мэдээлэл</span></button><hr>` +
      g.directions.map((d, i) => `<button data-v="${i}" class="${ui.view === i ? 'active' : ''}"><span class="ic">${dem(d)}</span><span class="nm">${esc(title(d.name))}</span><small>${d.rows.length}</small></button>`).join('');
    $('#nav').querySelectorAll('button').forEach(b => b.onclick = () => {
      ui.view = /^\d+$/.test(b.dataset.v) ? +b.dataset.v : b.dataset.v; render();
    });

    if (ui.view === 'overview') renderOverview();
    else if (ui.view === 'info') renderInfo();
    else renderDirection(ui.view);
  }

  function renderOverview() {
    const g = G();
    const allRows = g.directions.flatMap(d => d.rows);
    const monthLoad = MONTHS.map((_, i) => allRows.filter(r => r.months[i].t).length);
    const maxLoad = Math.max(1, ...monthLoad);
    $('#content').innerHTML = `
      <h2><span class="ic">${gem(g)}</span>${title(g.name)} бүлэг — тойм</h2>
      <p class="muted">${esc(g.level)} · Багш: ${esc(g.teacher)}</p>
      <div class="cards">
        <div class="card"><span class="em">🧩</span><div class="v">${g.directions.length}</div><div class="l">Чиглэл</div></div>
        <div class="card"><span class="em">🎯</span><div class="v">${allRows.length}</div><div class="l">Суралцахуйн үр дүн</div></div>
        <div class="card"><span class="em">🔗</span><div class="v">${count(allRows, 'u')}</div><div class="l"><span class="sw" style="background:var(--u-ui)"></span>Уялдаа</div></div>
        <div class="card"><span class="em">⭐</span><div class="v">${count(allRows, 'd')}</div><div class="l"><span class="sw" style="background:var(--d-ui)"></span>Давтамж</div></div>
      </div>
      <div class="scroll"><table class="sum">
        <thead><tr><th>Чиглэл</th><th>Үр дүн</th>${MONTHS.map(m => `<th>${m} сар</th>`).join('')}<th>Уялдаа</th><th>Давтамж</th><th>Анхааруулга</th></tr></thead>
        <tbody>${g.directions.map((d, di) => {
          const iss = issues(g, di).length;
          return `<tr><td><a href="#" data-open="${di}">${esc(title(d.name))}</a></td><td>${d.rows.length}</td>${
            MONTHS.map((_, i) => `<td>${d.rows.filter(r => r.months[i].t).length || ''}</td>`).join('')
          }<td>${count(d.rows, 'u')}</td><td>${count(d.rows, 'd')}</td><td style="color:${iss ? 'var(--warn)' : 'inherit'}">${iss || '—'}</td></tr>`;
        }).join('')}</tbody>
        <tfoot><tr><td><b>Сарын ачаалал</b></td><td><b>${allRows.length}</b></td>${monthLoad.map(n =>
          `<td style="background:rgba(255,143,171,${(0.12 + 0.6 * n / maxLoad).toFixed(2)})"><b>${n}</b></td>`).join('')}<td><b>${count(allRows, 'u')}</b></td><td><b>${count(allRows, 'd')}</b></td><td></td></tr></tfoot>
      </table></div>
      <p class="muted">Сарын ачаалал = тухайн сард хэрэгжүүлэх (уялдаа эсвэл давтамжтай) суралцахуйн үр дүнгийн тоо.</p>`;
    $('#content').querySelectorAll('[data-open]').forEach(a => a.onclick = e => { e.preventDefault(); ui.view = +a.dataset.open; render(); });
  }

  function renderInfo() {
    const g = G();
    const fields = [['school', 'Байгууллагын нэр (томоор)'], ['year', 'Хичээлийн жил'], ['name', 'Бүлэг'], ['level', 'Хөтөлбөрийн түвшин'],
      ['teacher', 'Боловсруулсан багш'], ['approver', 'Баталсан (эрхлэгч / орлон гүйцэтгэгч)'], ['date', 'Огноо'], ['place', 'Газар']];
    $('#content').innerHTML = `
      <h2><span class="ic">📝</span>${title(g.name)} бүлэг — ерөнхий мэдээлэл</h2>
      <p class="muted">Эдгээр нь хэвлэх болон Word файлын толгой, гарын үсгийн хэсэгт гарна.</p>
      <div class="info-grid">${fields.map(([k, l]) => `<label>${l}<input data-k="${k}" value="${esc(g[k])}"></label>`).join('')}</div>
      <div class="toolbar" style="margin-top:16px">
        <button class="btn" id="apply-all">Байгууллага, он, батлагчийг бүх бүлэгт хэрэглэх</button>
        <button class="btn danger" id="reset-group">Энэ бүлгийг анхны файлын хувилбар руу буцаах</button>
      </div>`;
    $('#content').querySelectorAll('[data-k]').forEach(el => el.oninput = () => { g[el.dataset.k] = el.value; save(); });
    $('#apply-all').onclick = () => {
      data.groups.forEach(x => ['school', 'year', 'approver', 'date', 'place'].forEach(k => x[k] = g[k])); save(); render();
    };
    $('#reset-group').onclick = () => {
      const orig = ORIGINAL.groups.find(x => x.name === g.name);
      if (orig && confirm(`${title(g.name)} бүлгийн бүх өөрчлөлтийг устгах уу?`)) { data.groups[ui.g] = clone(orig); save(); render(); }
    };
  }

  function planTable(g, d, editable) {
    // Ай, Дэд айн rowspan
    const rows = d.rows;
    const span = (key, i) => {
      if (i > 0 && rows[i - 1][key] === rows[i][key] && (key === 'area' || rows[i - 1].area === rows[i].area)) return 0;
      let n = 1; while (i + n < rows.length && rows[i + n][key] === rows[i][key] && (key === 'area' || rows[i + n].area === rows[i].area)) n++;
      return n;
    };
    const body = rows.map((r, ri) => {
      const sa = span('area', ri), ss = span('sub', ri);
      const links = r.months.map((m, i) => m.t === 'u' && m.code ? `<li>${MONTHS[i]} сар – ${esc(m.code)}. ${esc(m.text)}</li>` : '').join('');
      return `<tr class="row">
        ${sa ? `<td class="ar" rowspan="${sa}">${esc(r.area)}</td>` : ''}
        ${ss ? `<td rowspan="${ss}">${esc(r.sub)}</td>` : ''}
        <td class="out" ${editable ? `data-row="${ri}" title="Засах"` : ''}><span class="code">${esc(r.code)}.</span> ${esc(r.text)}
          ${links ? `<div class="lnk-h">Уялдах суралцахуйн үр дүн:</div><ul>${links}</ul>` : ''}</td>
        ${r.months.map((m, i) => `<td class="m ${m.t}" ${editable ? `data-cell="${ri}:${i}"` : ''}>${m.t === 'u' ? esc(m.code) : ''}</td>`).join('')}
        <td class="num">${r.months.filter(m => m.t === 'u').length}</td>
        <td class="num">${r.months.filter(m => m.t === 'd').length}</td></tr>`;
    }).join('');
    return `<table class="plan">
      <thead>
        <tr><th rowspan="2" style="width:110px">Ай</th><th rowspan="2" style="width:120px">Дэд ай</th><th rowspan="2">Суралцахуйн үр дүн</th>
          ${TERMS.map(([n, c]) => `<th colspan="${c}">${n}</th>`).join('')}<th rowspan="2">Уялдаа</th><th rowspan="2">Давтамж</th></tr>
        <tr>${MONTHS.map(m => `<th>${m}<br>сар</th>`).join('')}</tr>
      </thead>
      <tbody>${body}</tbody>
      <tfoot>
        <tr><td colspan="${3 + MONTHS.length}" style="text-align:right">Уялдаа</td><td class="num" colspan="2">${count(rows, 'u')}</td></tr>
        <tr><td colspan="${3 + MONTHS.length}" style="text-align:right">Давтамж</td><td class="num" colspan="2">${count(rows, 'd')}</td></tr>
      </tfoot></table>`;
  }

  const LEGEND = `<div class="legend"><span><span class="sw" style="background:var(--u-ui)"></span>Уялдаа — бусад чиглэлийн суралцахуйн үр дүнтэй уялдуулах сар</span>
    <span><span class="sw" style="background:var(--d-ui)"></span>Давтамж — давтан хэрэгжүүлэх сар</span></div>`;

  function renderDirection(di) {
    const g = G(), d = g.directions[di];
    if (!d) { ui.view = 'overview'; return render(); }
    const iss = issues(g, di);
    $('#content').innerHTML = `
      <h2><span class="ic">${dem(d)}</span>“${esc(title(d.name))}” чиглэл</h2>
      <p class="muted">${title(g.name)} бүлэг · ${esc(g.level)}. Сарын нүдэн дээр дарж уялдаа/давтамж тохируулна, үр дүнгийн текст дээр дарж засна.</p>
      <div class="toolbar"><span class="grow">${LEGEND}</span>
        <button class="btn primary" id="add-row">➕ Үр дүн нэмэх</button>
        <button class="btn mint" id="print-one">🖨️ Энэ чиглэлийг хэвлэх</button></div>
      ${iss.length ? `<div class="warn-box"><b>Анхааруулга (${iss.length})</b><ul>${iss.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
      <div class="scroll">${planTable(g, d, true)}</div>`;
    $('#content').querySelectorAll('[data-cell]').forEach(td => td.onclick = () => {
      const [ri, mi] = td.dataset.cell.split(':').map(Number); editCell(di, ri, mi);
    });
    $('#content').querySelectorAll('[data-row]').forEach(td => td.onclick = () => editRow(di, +td.dataset.row));
    $('#add-row').onclick = () => editRow(di, -1);
    $('#print-one').onclick = () => doPrint([di]);
  }

  // ---------- засварлах ----------
  function editCell(di, ri, mi) {
    const g = G(), d = g.directions[di], r = d.rows[ri], m = r.months[mi];
    const dlg = $('#dlg-cell'), form = dlg.querySelector('form');
    $('#cell-title').textContent = `${r.code} · ${MONTHS[mi]} сар`;
    form.t.value = m.t;
    const idx = outcomeIndex(g);
    const opts = g.directions.map((x, xi) => xi === di ? '' :
      `<optgroup label="${esc(title(x.name))}">${x.rows.map(o => `<option value="${esc(o.code)}">${esc(o.code)}. ${esc(o.text.slice(0, 80))}</option>`).join('')}</optgroup>`).join('');
    const sel = $('#cell-code');
    sel.innerHTML = `<option value="">— сонгох —</option>` + opts +
      (m.code && !idx.has(m.code) ? `<option value="${esc(m.code)}">${esc(m.code)} (жагсаалтад байхгүй)</option>` : '');
    sel.value = m.code || '';
    const sync = () => {
      $('#cell-link').style.display = form.t.value === 'u' ? '' : 'none';
      const o = idx.get(sel.value);
      $('#cell-hint').textContent = o ? `${title(o.dir)}: ${o.text}` : (sel.value ? m.text : 'Уялдуулах үр дүнгээ сонгоно уу.');
    };
    form.querySelectorAll('input[name=t]').forEach(x => x.onchange = sync);
    sel.onchange = sync; sync();
    dlg.onclose = () => {
      if (dlg.returnValue !== 'ok') return;
      const t = form.t.value;
      if (t === 'u') {
        const o = idx.get(sel.value);
        r.months[mi] = { t: 'u', code: sel.value, text: o ? o.text : (sel.value === m.code ? m.text : '') };
      } else r.months[mi] = { t };
      save(); render();
    };
    dlg.returnValue = ''; dlg.showModal();
  }

  function editRow(di, ri) {
    const g = G(), d = g.directions[di], isNew = ri < 0;
    const r = isNew ? { area: d.rows.at(-1)?.area || '', sub: '', code: '', text: '', months: MONTHS.map(() => ({ t: '' })) } : d.rows[ri];
    const dlg = $('#dlg-row');
    $('#row-title').textContent = isNew ? 'Шинэ суралцахуйн үр дүн' : `${r.code} засах`;
    $('#row-area').value = r.area; $('#row-sub').value = r.sub; $('#row-code').value = r.code; $('#row-text').value = r.text;
    if (isNew) $('#row-code').placeholder = `ж: ${ABBR[d.name] || ''}1.1а`;
    $('#dl-areas').innerHTML = [...new Set(d.rows.map(x => x.area))].map(a => `<option value="${esc(a)}">`).join('');
    $('#dl-subs').innerHTML = [...new Set(d.rows.map(x => x.sub))].map(a => `<option value="${esc(a)}">`).join('');
    ['row-del', 'row-up', 'row-down'].forEach(id => $('#' + id).style.display = isNew ? 'none' : '');
    dlg.onclose = () => {
      const v = dlg.returnValue;
      if (v === 'ok') {
        const oldCode = r.code;
        Object.assign(r, { area: $('#row-area').value.trim(), sub: $('#row-sub').value.trim(), code: $('#row-code').value.trim(), text: $('#row-text').value.trim() });
        if (isNew) d.rows.push(r);
        // Код/текст өөрчлөгдвөл бусад чиглэлийн уялдааг шинэчилнэ
        g.directions.forEach(x => x.rows.forEach(y => y.months.forEach(m => {
          if (m.t === 'u' && m.code === oldCode && oldCode) { m.code = r.code; m.text = r.text; }
        })));
      } else if (v === 'delete') {
        if (!confirm(`${r.code} үр дүнг устгах уу?`)) return;
        d.rows.splice(ri, 1);
      } else if (v === 'up' || v === 'down') {
        const j = ri + (v === 'up' ? -1 : 1);
        if (j >= 0 && j < d.rows.length) [d.rows[ri], d.rows[j]] = [d.rows[j], d.rows[ri]];
      } else return;
      save(); render();
    };
    dlg.returnValue = ''; dlg.showModal();
  }

  // ---------- хэвлэх / Word ----------
  function docHtml(g, dirIdx) {
    return dirIdx.map(di => {
      const d = g.directions[di];
      return `<div class="pdoc">
        <table style="width:100%;border:none;margin-bottom:6pt"><tr>
          <td style="border:none"></td>
          <td style="border:none;width:45%;font-weight:bold">БАТЛАВ<br>ЦЭЦЭРЛЭГИЙН ЭРХЛЭГЧИЙГ<br>ОРЛОН ГҮЙЦЭТГЭГЧ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ${esc(g.approver)}<br>${esc((g.year || '').slice(0, 4))} оны ..... сарын ..... өдөр</td></tr></table>
        <p style="text-align:center;font-weight:bold;margin:6pt 0">${esc(g.school)} ${esc(g.year)} ОНЫ ХИЧЭЭЛИЙН ЖИЛИЙН ${esc(g.name)} БҮЛГИЙН “${esc(d.name)}” ЧИГЛЭЛИЙН СУРГАЛТЫН ҮЙЛ АЖИЛЛАГААНЫ ТӨЛӨВЛӨГӨӨ</p>
        <table style="width:100%;border:none"><tr><td style="border:none">${esc(g.date)}</td><td style="border:none;text-align:right">${esc(g.place)}</td></tr></table>
        ${planTable(g, d, false)}
        <p style="font-size:9pt">Тайлбар: Уялдаа – цэнхэр (бусад чиглэлийн суралцахуйн үр дүнтэй уялдуулах сар; уялдах үр дүнгийн агуулгыг тухайн мөрийн доор бичив); Давтамж – ногоон (давтан хэрэгжүүлэх сар).</p>
        <p style="font-size:9pt">Суралцахуйн үр дүнг "Сургуулийн өмнөх боловсролын сургалтын хөтөлбөр" (2025)-ийн ${esc(g.level)}-ээс авав.</p>
        <p style="font-weight:bold;margin-top:14pt">БОЛОВСРУУЛСАН<br>БАГШ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ${esc(g.teacher)}</p>
      </div>`;
    }).join('');
  }

  function doPrint(dirIdx) {
    const g = G();
    $('#print-root').innerHTML = docHtml(g, dirIdx || g.directions.map((_, i) => i));
    window.print();
  }

  function exportWord() {
    const g = G();
    const css = `@page WordSection1 { size: 841.9pt 595.3pt; mso-page-orientation: landscape; margin: 36pt 36pt 36pt 36pt; }
      div.WordSection1 { page: WordSection1; }
      body { font-family: "Times New Roman", serif; font-size: 11pt; }
      table.plan { border-collapse: collapse; width: 100%; font-size: 9.5pt; }
      .plan th, .plan td { border: 1px solid #000; padding: 2pt 4pt; vertical-align: top; }
      .plan th { background: #F2F2F2; text-align: center; }
      .plan td.m, .plan td.num { text-align: center; vertical-align: middle; }
      .plan td.u { background: #B4C6E7; } .plan td.d { background: #C5E0B3; }
      .plan ul { margin: 0; } .lnk-h { font-style: italic; }`;
    const body = g.directions.map((_, i) => docHtml(g, [i])).join('<br clear=all style="page-break-before:always">');
    // Word-д class-аар background ажиллахгүй тохиолдолд inline өнгө нэмэх
    const html = body.replace(/<td class="m u"/g, '<td class="m u" style="background:#B4C6E7"')
                     .replace(/<td class="m d"/g, '<td class="m d" style="background:#C5E0B3"');
    const doc = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
      <head><meta charset="utf-8"><title>${esc(g.name)} бүлэг</title><style>${css}</style></head>
      <body><div class="WordSection1">${html}</div></body></html>`;
    download('﻿' + doc, `${title(g.name)}_булэг_${g.year}_төлөвлөгөө.doc`, 'application/msword');
  }

  function download(text, name, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }

  $('#btn-print').onclick = () => doPrint();
  $('#btn-word').onclick = exportWord;
  $('#btn-json').onclick = () => download(JSON.stringify(data, null, 1), `tsetserleg_tolovlogoo_${G().year}.json`, 'application/json');
  $('#file-json').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const x = JSON.parse(await f.text());
      if (!Array.isArray(x.groups) || !x.groups.every(g => Array.isArray(g.directions))) throw 0;
      data = Object.assign({ months: MONTHS }, x); ui.g = 0; ui.view = 'overview'; save(); render();
    } catch { alert('JSON файл буруу байна.'); }
    e.target.value = '';
  };

  render();
})();
</script>
</body>
</html>
