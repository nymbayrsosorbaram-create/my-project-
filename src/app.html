<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цэцэрлэгийн төлөвлөгөө</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2b2140; --paper: #fffaf0; --sky: #bfe6ff; --muted: #6b5f80;
    --pink: #ff8fab; --yellow: #ffd23f; --mint: #7ee0b5; --lilac: #c3a6ff; --orange: #ffa45c; --sea: #5cc8ff;
    --blue: #B4C6E7; --green: #C5E0B3;           /* хэвлэх/Word-ийн албан өнгө */
    --u-ui: #9cc8ff; --d-ui: #b5eb8f;            /* дэлгэцийн cartoon өнгө */
    --line: #2b2140; --accent: #6c4cf5;
    --warn: #b54708; --warn-soft: #fff1d6;
    --r: 18px; --sh: 4px 4px 0 var(--ink); --sh-sm: 2px 2px 0 var(--ink);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink);
    font: 600 14px/1.5 "Nunito", "Comic Sans MS", "Segoe UI", system-ui, sans-serif;
    background-color: var(--sky);
    background-image:
      radial-gradient(circle at 20px 20px, rgba(255,255,255,.55) 3px, transparent 4px),
      radial-gradient(circle at 60px 50px, rgba(255,255,255,.35) 2px, transparent 3px);
    background-size: 80px 80px;
    min-height: 100vh;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  .btn {
    border: 2.5px solid var(--ink); background: #fff; border-radius: 999px; padding: 7px 16px;
    cursor: pointer; white-space: nowrap; box-shadow: var(--sh-sm); font-weight: 800;
    transition: transform .08s, box-shadow .08s;
  }
  .btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
  .btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  .btn.primary { background: var(--yellow); }
  .btn.pink { background: var(--pink); }
  .btn.mint { background: var(--mint); }
  .btn.lilac { background: var(--lilac); }
  .btn.danger { background: #ffd6d6; color: #a1121a; }
  .btn.small { padding: 2px 10px; font-size: 12px; }
  input, select, textarea { border: 2.5px solid var(--ink); border-radius: 12px; padding: 7px 10px; background: #fff; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: 3px solid var(--yellow); outline-offset: 1px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink); font-weight: 800; }

  /* Толгой: үүл, нар */
  header {
    position: relative; overflow: hidden;
    background: linear-gradient(180deg, #8fd3ff, var(--sky));
    border-bottom: 3px solid var(--ink); padding: 18px 16px 26px;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-right: 130px;
  }
  header::before { /* нар */
    content: ""; position: absolute; right: -30px; top: -40px; width: 130px; height: 130px; border-radius: 50%;
    background: var(--yellow); border: 3px solid var(--ink);
    box-shadow: 0 0 0 14px rgba(255,210,63,.35), 0 0 0 28px rgba(255,210,63,.18);
  }
  header::after { /* өвс */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 12px;
    background: radial-gradient(circle at 10px 12px, var(--mint) 9px, transparent 10px) 0 0 / 20px 12px repeat-x;
  }
  header > * { position: relative; z-index: 1; }
  header h1 { font-size: 24px; font-weight: 900; margin: 0 auto 0 0; letter-spacing: .2px; text-shadow: 2px 2px 0 #fff; display: flex; align-items: center; gap: 10px; }
  header h1 .logo { font-size: 38px; filter: drop-shadow(2px 2px 0 var(--ink)); animation: bob 3s ease-in-out infinite; }
  header .sub { font-size: 12px; color: var(--muted); font-weight: 700; display: block; text-shadow: none; }
  @keyframes bob { 50% { transform: translateY(-4px) rotate(-6deg); } }
  @media (prefers-reduced-motion: reduce) { header h1 .logo { animation: none; } .btn { transition: none; } }

  /* Бүлгийн таб */
  .groups { display: flex; gap: 12px; padding: 18px 16px 0; flex-wrap: wrap; }
  .groups button {
    display: flex; align-items: center; gap: 10px; text-align: left;
    border: 3px solid var(--ink); border-radius: 22px 22px 0 0; border-bottom: none;
    padding: 10px 18px 10px 12px; cursor: pointer; background: #fff; transform: translateY(6px);
    transition: transform .12s;
  }
  .groups button:hover { transform: translateY(2px); }
  .groups button .em { font-size: 30px; line-height: 1; filter: drop-shadow(1px 1px 0 var(--ink)); }
  .groups button b { display: block; font-size: 16px; font-weight: 900; }
  .groups button span.lv { font-size: 11px; color: var(--muted); }
  .groups button[data-g="0"] { background: #fff3b0; }
  .groups button[data-g="1"] { background: #ffd6e0; }
  .groups button[data-g="2"] { background: #d4f5e5; }
  .groups button[data-g="3"] { background: #e3d7ff; }
  .groups button.active { transform: translateY(0); padding-bottom: 16px; }

  .shell {
    background: var(--paper); border: 3px solid var(--ink); border-radius: 0 var(--r) var(--r) var(--r);
    margin: 0 16px 24px; display: grid; grid-template-columns: 240px 1fr; min-height: 72vh; box-shadow: var(--sh);
  }
  aside { border-right: 3px dashed #d9cfe8; padding: 14px 10px; display: flex; flex-direction: column; gap: 6px; }
  aside button {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    border: 2.5px solid transparent; background: none; padding: 8px 10px; border-radius: 14px; cursor: pointer; font-weight: 800;
  }
  aside button .ic { font-size: 20px; width: 26px; text-align: center; }
  aside button .nm { flex: 1; }
  aside button small { background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 0 7px; font-size: 11px; font-weight: 900; }
  aside button:hover { background: #fff; border-color: var(--ink); }
  aside button.active { background: var(--yellow); border-color: var(--ink); box-shadow: var(--sh-sm); }
  aside hr { border: none; border-top: 3px dotted #d9cfe8; margin: 6px 0; width: 100%; }
  .content { padding: 20px; min-width: 0; }
  .content h2 { font-size: 22px; font-weight: 900; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  .content h2 .ic { font-size: 30px; filter: drop-shadow(2px 2px 0 var(--ink)); }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 10px 0 14px; }
  .toolbar .grow { margin-right: auto; }
  .muted { color: var(--muted); font-size: 13px; font-weight: 700; }
  .scroll { overflow-x: auto; padding: 2px 6px 8px 2px; }
  a { color: var(--accent); font-weight: 900; }

  /* Төлөвлөгөөний хүснэгт — суурь (хэвлэхэд ашиглана) */
  table.plan { border-collapse: collapse; width: 100%; min-width: 980px; font-size: 13px; }
  .plan th, .plan td { border: 1px solid #9aa3b2; padding: 4px 6px; vertical-align: top; }
  .plan th { background: #eef1f6; text-align: center; font-weight: 700; }
  .plan td.m { text-align: center; vertical-align: middle; width: 58px; font-size: 12px; }
  .plan td.u { background: var(--blue); }
  .plan td.d { background: var(--green); }
  .plan td.num { text-align: center; vertical-align: middle; width: 56px; font-weight: 700; }
  .plan td.out { min-width: 300px; }
  .plan td.out .code { font-weight: 800; }
  .plan td.out ul { margin: 4px 0 0; padding-left: 16px; font-size: 12px; }
  .plan td.out .lnk-h { font-size: 12px; font-style: italic; margin-top: 4px; }
  .plan tfoot td { font-weight: 800; }

  /* Дэлгэц дээрх cartoon хүснэгт */
  .content table.plan { border-collapse: separate; border-spacing: 0; border: 3px solid var(--ink); border-radius: var(--r); overflow: hidden; background: #fff; box-shadow: var(--sh); font-weight: 600; }
  .content .plan th, .content .plan td { border: 0; border-right: 1.5px solid #cfc4e2; border-bottom: 1.5px solid #cfc4e2; }
  .content .plan th { background: var(--lilac); color: var(--ink); font-weight: 900; border-color: var(--ink); border-bottom-width: 2.5px; }
  .content .plan thead tr:first-child th:nth-child(4) { background: #ffe58a; }
  .content .plan thead tr:first-child th:nth-child(5) { background: #ffc2d1; }
  .content .plan thead tr:first-child th:nth-child(6) { background: #a8ecc9; }
  .content .plan td.m { cursor: pointer; transition: transform .1s; }
  .content .plan td.m:hover { box-shadow: inset 0 0 0 3px var(--ink); }
  .content .plan td.u { background: var(--u-ui); font-weight: 900; }
  .content .plan td.d { background: var(--d-ui); }
  .content .plan td.d::after { content: "★"; color: #4f9a2b; font-size: 13px; }
  .content .plan td.num { font-size: 16px; font-weight: 900; }
  .content .plan td.out { cursor: pointer; }
  .content .plan td.out .code { background: var(--yellow); border: 2px solid var(--ink); border-radius: 8px; padding: 0 5px; font-weight: 900; }
  .content .plan td.out .lnk-h { color: var(--muted); }
  .content .plan tr.row:hover td.out { background: #fff8db; }
  .content .plan tfoot td { background: #fff3b0; font-weight: 900; font-size: 15px; }
  .content .plan td.ar { background: #fff6e8; font-weight: 900; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; font-weight: 800; align-items: center; }
  .sw { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--ink); border-radius: 6px; vertical-align: -4px; margin-right: 5px; }
  .warn-box { background: var(--warn-soft); color: var(--warn); border: 3px solid var(--ink); border-radius: var(--r); padding: 10px 14px; margin: 12px 0; font-size: 13px; box-shadow: var(--sh-sm); }
  .warn-box ul { margin: 4px 0 0; padding-left: 18px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; margin: 14px 0 20px; }
  .card { border: 3px solid var(--ink); border-radius: var(--r); padding: 12px 14px; box-shadow: var(--sh); position: relative; }
  .card:nth-child(1) { background: #fff3b0; } .card:nth-child(2) { background: #ffd6e0; }
  .card:nth-child(3) { background: #d6e9ff; } .card:nth-child(4) { background: #dcf7c8; }
  .card .em { position: absolute; right: 10px; top: 8px; font-size: 30px; }
  .card .v { font-size: 34px; font-weight: 900; line-height: 1.1; }
  .card .l { font-size: 13px; font-weight: 800; }
  table.sum { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; border: 3px solid var(--ink); border-radius: var(--r); overflow: hidden; background: #fff; box-shadow: var(--sh); }
  .sum th, .sum td { border-bottom: 1.5px solid #e2d9f0; padding: 7px 8px; text-align: center; }
  .sum th { background: var(--lilac); font-weight: 900; border-bottom: 2.5px solid var(--ink); }
  .sum td:first-child, .sum th:first-child { text-align: left; }
  .sum tbody tr:nth-child(even) td { background: #fbf7ff; }
  .sum tfoot td { border-top: 2.5px solid var(--ink); border-bottom: 0; }
  .bar { display: inline-block; height: 10px; border: 2px solid var(--ink); border-radius: 999px; background: var(--pink); vertical-align: middle; }
  .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; max-width: 900px; margin-top: 12px; }

  dialog { border: 3px solid var(--ink); border-radius: 24px; padding: 0; width: min(580px, 94vw); box-shadow: 6px 6px 0 var(--ink); background: var(--paper); color: var(--ink); }
  dialog::backdrop { background: rgba(43, 33, 64, .45); }
  dialog form { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  dialog h3 { margin: 0; font-size: 18px; font-weight: 900; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg label { flex-direction: row; align-items: center; gap: 6px; border: 2.5px solid var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; background: #fff; }
  .seg label:has(input:checked) { background: var(--yellow); box-shadow: var(--sh-sm); }
  .seg input { width: auto; accent-color: var(--accent); }
  .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .dlg-actions .left { margin-right: auto; }
  .hint { font-size: 13px; background: #fff; border: 2px dashed var(--ink); border-radius: 12px; padding: 8px 10px; min-height: 34px; }

  /* Сарын төлөвлөлт */
  aside button.month-nav { background: #ffe0ec; border-color: var(--ink); }
  aside button.month-nav.active { background: var(--pink); }
  .mchips { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .mchips button { position: relative; width: 62px; border: 2.5px solid var(--ink); border-radius: 16px; background: #fff; padding: 6px 0; cursor: pointer; box-shadow: var(--sh-sm); line-height: 1.1; }
  .mchips button b { display: block; font-size: 18px; font-weight: 900; }
  .mchips button span { font-size: 11px; color: var(--muted); }
  .mchips button i { position: absolute; top: -9px; right: -8px; background: var(--pink); border: 2px solid var(--ink); border-radius: 999px; font-style: normal; font-size: 11px; font-weight: 900; padding: 0 6px; }
  .mchips button.active { background: var(--yellow); transform: translateY(-2px); }
  .subtabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; border-bottom: 3px solid var(--ink); padding-bottom: 8px; margin-bottom: 14px; }
  .subtabs button[data-t] { border: 2.5px solid var(--ink); background: #fff; border-radius: 14px; padding: 7px 14px; cursor: pointer; font-weight: 800; }
  .subtabs button[data-t] small { background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 0 6px; font-size: 11px; margin-left: 2px; }
  .subtabs button.active { background: var(--lilac); box-shadow: var(--sh-sm); }
  .subtabs .grow { flex: 1; }
  .mcard { border: 3px solid var(--ink); border-radius: var(--r); background: #fff; padding: 14px; box-shadow: var(--sh); margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
  .formgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-bottom: 4px; }
  .chk { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 800; font-size: 13px; }
  .chk label { flex-direction: row; align-items: center; gap: 5px; border: 2px solid var(--ink); border-radius: 999px; padding: 3px 10px; background: var(--paper); font-size: 12px; }
  .chk input { width: auto; }
  table.mt { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 760px; border: 3px solid var(--ink); border-radius: var(--r); overflow: hidden; background: #fff; box-shadow: var(--sh); font-size: 13px; }
  .mt th { background: var(--lilac); font-weight: 900; padding: 8px; border-bottom: 2.5px solid var(--ink); text-align: left; }
  .mt td { padding: 6px 8px; border-bottom: 1.5px solid #e2d9f0; vertical-align: top; }
  .mt td.c { text-align: center; vertical-align: middle; }
  .mt tbody tr:nth-child(even) td { background: #fbf7ff; }
  .mt td input, .mt td select, .mt td textarea { padding: 5px 7px; border-width: 2px; border-radius: 10px; font-size: 13px; }
  .mt .code { background: var(--yellow); border: 2px solid var(--ink); border-radius: 8px; padding: 0 5px; font-weight: 900; }
  .badge { display: inline-block; border: 2px solid var(--ink); border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 900; }
  .badge.u { background: var(--u-ui); } .badge.d { background: var(--d-ui); }
  .dates { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 4px; font-size: 12px; }
  .dates span { background: var(--sky); border: 2px solid var(--ink); border-radius: 8px; padding: 0 5px; font-weight: 900; }
  .dates em { color: var(--muted); }
  .act-layout { display: grid; grid-template-columns: 170px 1fr; gap: 16px; align-items: start; }
  .act-list { display: flex; flex-direction: column; gap: 5px; position: sticky; top: 8px; max-height: 80vh; overflow: auto; padding: 2px 6px 6px 2px; }
  .act-list button { display: grid; grid-template-columns: 22px 44px 1fr; grid-template-rows: auto auto; align-items: center; text-align: left; border: 2.5px solid var(--ink); border-radius: 14px; background: #fff; padding: 5px 8px; cursor: pointer; }
  .act-list button b { font-size: 15px; font-weight: 900; } .act-list button small { color: var(--muted); }
  .act-list button em { grid-column: 2 / 4; font-style: normal; font-size: 11px; color: var(--muted); font-weight: 800; }
  .act-list button.active { background: var(--yellow); box-shadow: var(--sh-sm); }
  .act-edit { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .act-head { display: flex; gap: 10px; flex-wrap: wrap; }
  .act-head > div { flex: 1; min-width: 140px; border: 3px solid var(--ink); border-radius: 16px; background: #fff3b0; padding: 8px 12px; box-shadow: var(--sh-sm); }
  .act-head > div:nth-child(2) { background: #d6e9ff; } .act-head > div:nth-child(3) { background: #ffd6e0; }
  .act-head small { display: block; font-size: 11px; color: var(--muted); font-weight: 800; }
  .ro { border: 2.5px dashed var(--ink); border-radius: 12px; padding: 7px 10px; background: #fff; font-weight: 700; color: var(--ink); font-size: 13px; }
  h3.sec { font-size: 16px; font-weight: 900; margin: 12px 0 4px; }
  textarea.ag { resize: vertical; overflow: hidden; min-height: 38px; }
  .mt.steps td { background: #fff !important; }
  #print-root { display: none; }
  @media (max-width: 760px) {
    .act-layout { grid-template-columns: 1fr; }
    .act-list { flex-direction: row; position: static; overflow-x: auto; max-height: none; }
    .act-list button { min-width: 120px; }
    header { padding-right: 16px; }
    header::before { width: 90px; height: 90px; right: -35px; top: -45px; }
    header h1 { font-size: 19px; width: 100%; padding-right: 50px; }
    .shell { grid-template-columns: 1fr; margin: 0 8px 16px; border-radius: 0 var(--r) var(--r) var(--r); }
    aside { border-right: none; border-bottom: 3px dashed #d9cfe8; flex-direction: row; overflow-x: auto; }
    aside button { width: auto; white-space: nowrap; }
    aside hr { display: none; }
    .groups { padding: 12px 8px 0; gap: 6px; }
    .groups button { padding: 8px 10px; }
    .groups button .lv { display: none; }
  }
  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    body { background: #fff; font-weight: 400; }
    header, .groups, .shell, dialog { display: none !important; }
    #print-root { display: block; }
    .pdoc { page-break-after: always; font-family: "Times New Roman", serif; font-size: 11pt; }
    .pdoc:last-child { page-break-after: auto; }
    .plan { min-width: 0; font-size: 9.5pt; }
    .plan th, .plan td { border: 1px solid #000; }
    .plan td.m { width: 34px; font-size: 8pt; padding: 2px; }
    .plan td.num { width: 40px; }
    .plan tfoot { display: table-row-group; }
    .plan td.u { background: var(--blue) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .plan td.d { background: var(--green) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    thead { display: table-header-group; }
  }
</style>
</head>
<body>
<header>
  <h1><span class="logo" aria-hidden="true">🧸</span><span>Цэцэрлэгийн жилийн төлөвлөгөө <span class="sub" id="hdr-sub"></span></span></h1>
  <button class="btn mint" id="btn-print">🖨️ Хэвлэх / PDF</button>
  <button class="btn primary" id="btn-word">📄 Word татах</button>
  <button class="btn pink" id="btn-json">💾 JSON хадгалах</button>
  <label class="btn lilac" style="flex-direction:row;color:inherit;font-size:14px">📂 JSON нээх<input type="file" id="file-json" accept=".json" hidden></label>
</header>

<div class="groups" id="groups"></div>

<div class="shell">
  <aside id="nav"></aside>
  <div class="content" id="content"></div>
</div>

<div id="print-root"></div>

<!-- Сарын нүд засах -->
<dialog id="dlg-cell">
  <form method="dialog">
    <h3 id="cell-title"></h3>
    <div class="seg">
      <label><input type="radio" name="t" value=""> Хэрэгжүүлэхгүй</label>
      <label><input type="radio" name="t" value="d"><span class="sw" style="background:var(--d-ui)"></span>Давтамж</label>
      <label><input type="radio" name="t" value="u"><span class="sw" style="background:var(--u-ui)"></span>Уялдаа</label>
    </div>
    <div id="cell-link">
      <label>Уялдах суралцахуйн үр дүн (бусад чиглэлээс)
        <select id="cell-code"></select>
      </label>
      <div class="hint" id="cell-hint"></div>
    </div>
    <div class="dlg-actions">
      <button class="btn" value="cancel" formnovalidate>Болих</button>
      <button class="btn primary" value="ok">Хадгалах</button>
    </div>
  </form>
</dialog>

<!-- Мөр засах -->
<dialog id="dlg-row">
  <form method="dialog">
    <h3 id="row-title">Суралцахуйн үр дүн</h3>
    <label>Ай<input id="row-area" list="dl-areas" required></label>
    <label>Дэд ай<input id="row-sub" list="dl-subs" required></label>
    <label>Код<input id="row-code" placeholder="ж: НСХ1.1а" required></label>
    <label>Суралцахуйн үр дүн<textarea id="row-text" rows="3" required></textarea></label>
    <datalist id="dl-areas"></datalist><datalist id="dl-subs"></datalist>
    <div class="dlg-actions">
      <button class="btn danger left" value="delete" id="row-del" formnovalidate>Устгах</button>
      <button class="btn" value="up" id="row-up" formnovalidate>↑</button>
      <button class="btn" value="down" id="row-down" formnovalidate>↓</button>
      <button class="btn" value="cancel" formnovalidate>Болих</button>
      <button class="btn primary" value="ok">Хадгалах</button>
    </div>
  </form>
</dialog>

<script>
const ORIGINAL = /*__PLAN_DATA__*/null;
(() => {
  const KEY = 'kg-annual-plan-v1';
  const MONTHS = ORIGINAL.months;               // ['09',...,'05']
  const TERMS = [['1 улирал', 3], ['2 улирал', 3], ['3 улирал', 3]];
  const GROUP_EM = { 'БАГА': '🐣', 'ДУНД': '🐰', 'АХЛАХ': '🦁', 'БЭЛТГЭЛ': '🎒' };
  const DIR_EM = { 'НИЙГЭМ-СЭТГЭЛ ХӨДЛӨЛ': '💛', 'ХӨДӨЛГӨӨН, ЭРҮҮЛ МЭНД': '🤸', 'ХЭЛ ЯРИА': '💬',
                   'БАЙГАЛЬ, НИЙГМИЙН ОРЧИН': '🌳', 'МАТЕМАТИК': '🔢', 'ЗУРАГ, УРЛАЛ': '🎨', 'ХӨГЖИМ': '🎵' };
  const gem = g => GROUP_EM[g.name] || '🌈', dem = d => DIR_EM[d.name] || '⭐';
  const ABBR = { 'НИЙГЭМ-СЭТГЭЛ ХӨДЛӨЛ': 'НСХ', 'ХӨДӨЛГӨӨН, ЭРҮҮЛ МЭНД': 'ХЭМ', 'ХЭЛ ЯРИА': 'ХЯ',
                 'БАЙГАЛЬ, НИЙГМИЙН ОРЧИН': 'БНО', 'МАТЕМАТИК': 'МАТ', 'ЗУРАГ, УРЛАЛ': 'ЗУ', 'ХӨГЖИМ': 'ХӨГ' };
  const clone = o => JSON.parse(JSON.stringify(o));
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = s => document.querySelector(s);

  let data;
  try { data = JSON.parse(localStorage.getItem(KEY)) || clone(ORIGINAL); } catch { data = clone(ORIGINAL); }
  const ui = { g: 0, view: 'overview' };   // view: 'overview' | 'info' | direction index
  try { Object.assign(ui, JSON.parse(localStorage.getItem(KEY + ':ui')) || {}); } catch {}
  if (!data.groups[ui.g]) ui.g = 0;
  // Өмнөх хувилбарын өгөгдөлд сарын төлөвлөлт байхгүй бол нэмнэ
  data.groups.forEach(g => {
    g.monthly = g.monthly || {};
    const om = ORIGINAL.groups.find(o => o.name === g.name)?.monthly || {};
    // Өмнөх хувилбарын номын бичвэрийн алдааг засна ("Хэсэг\nБичвэр\nХуудас 1." → "Хэсэг 1.")
    Object.values(g.monthly).forEach(mo => (mo.readings || []).forEach(r => {
      if (/^Хэсэг\nБичвэр\n/.test(r.text || '')) r.text = r.text.replace(/^Хэсэг\nБичвэр\n/, '').replace(/^Хуудас (\d+)\./gm, 'Хэсэг $1.');
    }));
    // Шинээр нэмэгдсэн сарыг нэмнэ (хэрэглэгчийн бичсэн сарыг дарахгүй)
    Object.keys(om).forEach(k => {
      const cur = g.monthly[k];
      // Өмнө түгээсэн хувилбар (ноорог) хэвээрээ байвал шинэ хувилбараар солино
      if (cur && om[k].supersedes?.includes(fnv(JSON.stringify(cur)))) { g.monthly[k] = clone(om[k]); return; }
      const written = cur && Object.values(cur.acts || {}).some(a => a && (a.method || a.competence || a.criteria || (a.steps || []).some(x => x.teacher || x.learner)));
      // Хоосон сар, эсвэл үйл ажиллагаа бичээгүй ноорог сарыг шинэ өгөгдлөөр солино
      if (!cur || (!cur.schedule?.length && !cur.readings?.length) || (cur.draft && !om[k].draft && !written)) g.monthly[k] = clone(om[k]);
    });
  });
  if (!MONTHS.includes(ui.month)) {
    const cm = String(new Date().getMonth() + 1).padStart(2, '0');
    ui.month = MONTHS.includes(cm) ? cm : '09';
  }
  ui.mtab = ui.mtab || 'filter';

  // FNV-1a (UTF-16) – build.py-тэй ижил
  function fnv(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} };
  const saveUi = () => { try { localStorage.setItem(KEY + ':ui', JSON.stringify(ui)); } catch {} };

  const G = () => data.groups[ui.g];
  const title = s => s ? s.charAt(0) + s.slice(1).toLowerCase() : s;
  const count = (rows, t) => rows.reduce((s, r) => s + r.months.filter(m => m.t === t).length, 0);

  // Бүлгийн бүх үр дүнгийн индекс (уялдаа сонгох, шалгахад)
  function outcomeIndex(g) {
    const map = new Map();
    g.directions.forEach((d, di) => d.rows.forEach(r => r.code && map.set(r.code, { text: r.text, dir: d.name, di })));
    return map;
  }

  function issues(g, di) {
    const idx = outcomeIndex(g), out = [];
    g.directions[di].rows.forEach(r => {
      if (!r.months.some(m => m.t)) out.push(`${r.code} — аль ч сард төлөвлөгдөөгүй байна.`);
      r.months.forEach((m, i) => {
        if (m.t === 'u' && !m.code) out.push(`${r.code} — ${MONTHS[i]} сарын уялдаанд код сонгоогүй.`);
        else if (m.t === 'u' && !idx.has(m.code)) out.push(`${r.code} — ${MONTHS[i]} сарын уялдаа “${m.code}” энэ бүлгийн төлөвлөгөөнд олдсонгүй.`);
      });
    });
    return out;
  }

  // ---------- рендер ----------
  function render() {
    saveUi();
    const g = G();
    $('#hdr-sub').textContent = `${title(g.school)} · ${g.year} оны хичээлийн жил`;
    $('#groups').innerHTML = data.groups.map((x, i) =>
      `<button data-g="${i}" class="${i === ui.g ? 'active' : ''}"><span class="em" aria-hidden="true">${gem(x)}</span><span><b>${title(x.name)} бүлэг</b><span class="lv">${esc(x.level)}</span></span></button>`).join('');
    $('#groups').querySelectorAll('button').forEach(b => b.onclick = () => { ui.g = +b.dataset.g; render(); });

    $('#nav').innerHTML = `
      <button data-v="overview" class="${ui.view === 'overview' ? 'active' : ''}"><span class="ic">🏠</span><span class="nm">Тойм</span></button>
      <button data-v="info" class="${ui.view === 'info' ? 'active' : ''}"><span class="ic">📝</span><span class="nm">Ерөнхий мэдээлэл</span></button><hr>` +
      g.directions.map((d, i) => `<button data-v="${i}" class="${ui.view === i ? 'active' : ''}"><span class="ic">${dem(d)}</span><span class="nm">${esc(title(d.name))}</span><small>${d.rows.length}</small></button>`).join('') +
      `<hr><button data-v="month" class="month-nav ${ui.view === 'month' ? 'active' : ''}"><span class="ic">✏️</span><span class="nm">Сарын төлөвлөлт, үйл ажиллагаа</span></button>`;
    $('#nav').querySelectorAll('button').forEach(b => b.onclick = () => {
      ui.view = /^\d+$/.test(b.dataset.v) ? +b.dataset.v : b.dataset.v; render();
    });

    if (ui.view === 'overview') renderOverview();
    else if (ui.view === 'info') renderInfo();
    else if (ui.view === 'month') renderMonth();
    else renderDirection(ui.view);
  }

  function renderOverview() {
    const g = G();
    const allRows = g.directions.flatMap(d => d.rows);
    const monthLoad = MONTHS.map((_, i) => allRows.filter(r => r.months[i].t).length);
    const maxLoad = Math.max(1, ...monthLoad);
    $('#content').innerHTML = `
      <h2><span class="ic">${gem(g)}</span>${title(g.name)} бүлэг — тойм</h2>
      <p class="muted">${esc(g.level)} · Багш: ${esc(g.teacher)}</p>
      <div class="cards">
        <div class="card"><span class="em">🧩</span><div class="v">${g.directions.length}</div><div class="l">Чиглэл</div></div>
        <div class="card"><span class="em">🎯</span><div class="v">${allRows.length}</div><div class="l">Суралцахуйн үр дүн</div></div>
        <div class="card"><span class="em">🔗</span><div class="v">${count(allRows, 'u')}</div><div class="l"><span class="sw" style="background:var(--u-ui)"></span>Уялдаа</div></div>
        <div class="card"><span class="em">⭐</span><div class="v">${count(allRows, 'd')}</div><div class="l"><span class="sw" style="background:var(--d-ui)"></span>Давтамж</div></div>
      </div>
      <div class="scroll"><table class="sum">
        <thead><tr><th>Чиглэл</th><th>Үр дүн</th>${MONTHS.map(m => `<th>${m} сар</th>`).join('')}<th>Уялдаа</th><th>Давтамж</th><th>Анхааруулга</th></tr></thead>
        <tbody>${g.directions.map((d, di) => {
          const iss = issues(g, di).length;
          return `<tr><td><a href="#" data-open="${di}">${esc(title(d.name))}</a></td><td>${d.rows.length}</td>${
            MONTHS.map((_, i) => `<td>${d.rows.filter(r => r.months[i].t).length || ''}</td>`).join('')
          }<td>${count(d.rows, 'u')}</td><td>${count(d.rows, 'd')}</td><td style="color:${iss ? 'var(--warn)' : 'inherit'}">${iss || '—'}</td></tr>`;
        }).join('')}</tbody>
        <tfoot><tr><td><b>Сарын ачаалал</b></td><td><b>${allRows.length}</b></td>${monthLoad.map(n =>
          `<td style="background:rgba(255,143,171,${(0.12 + 0.6 * n / maxLoad).toFixed(2)})"><b>${n}</b></td>`).join('')}<td><b>${count(allRows, 'u')}</b></td><td><b>${count(allRows, 'd')}</b></td><td></td></tr></tfoot>
      </table></div>
      <p class="muted">Сарын ачаалал = тухайн сард хэрэгжүүлэх (уялдаа эсвэл давтамжтай) суралцахуйн үр дүнгийн тоо.</p>`;
    $('#content').querySelectorAll('[data-open]').forEach(a => a.onclick = e => { e.preventDefault(); ui.view = +a.dataset.open; render(); });
  }

  function renderInfo() {
    const g = G();
    const fields = [['school', 'Байгууллагын нэр (томоор)'], ['year', 'Хичээлийн жил'], ['name', 'Бүлэг'], ['level', 'Хөтөлбөрийн түвшин'],
      ['teacher', 'Боловсруулсан багш'], ['approver', 'Баталсан (эрхлэгч / орлон гүйцэтгэгч)'], ['date', 'Огноо'], ['place', 'Газар']];
    $('#content').innerHTML = `
      <h2><span class="ic">📝</span>${title(g.name)} бүлэг — ерөнхий мэдээлэл</h2>
      <p class="muted">Эдгээр нь хэвлэх болон Word файлын толгой, гарын үсгийн хэсэгт гарна.</p>
      <div class="info-grid">${fields.map(([k, l]) => `<label>${l}<input data-k="${k}" value="${esc(g[k])}"></label>`).join('')}</div>
      <div class="toolbar" style="margin-top:16px">
        <button class="btn" id="apply-all">Байгууллага, он, батлагчийг бүх бүлэгт хэрэглэх</button>
        <button class="btn danger" id="reset-group">Энэ бүлгийг анхны файлын хувилбар руу буцаах</button>
      </div>`;
    $('#content').querySelectorAll('[data-k]').forEach(el => el.oninput = () => { g[el.dataset.k] = el.value; save(); });
    $('#apply-all').onclick = () => {
      data.groups.forEach(x => ['school', 'year', 'approver', 'date', 'place'].forEach(k => x[k] = g[k])); save(); render();
    };
    $('#reset-group').onclick = () => {
      const orig = ORIGINAL.groups.find(x => x.name === g.name);
      if (orig && confirm(`${title(g.name)} бүлгийн бүх өөрчлөлтийг устгах уу?`)) { data.groups[ui.g] = clone(orig); save(); render(); }
    };
  }

  function planTable(g, d, editable) {
    // Ай, Дэд айн rowspan
    const rows = d.rows;
    const span = (key, i) => {
      if (i > 0 && rows[i - 1][key] === rows[i][key] && (key === 'area' || rows[i - 1].area === rows[i].area)) return 0;
      let n = 1; while (i + n < rows.length && rows[i + n][key] === rows[i][key] && (key === 'area' || rows[i + n].area === rows[i].area)) n++;
      return n;
    };
    const body = rows.map((r, ri) => {
      const sa = span('area', ri), ss = span('sub', ri);
      const links = r.months.map((m, i) => m.t === 'u' && m.code ? `<li>${MONTHS[i]} сар – ${esc(m.code)}. ${esc(m.text)}</li>` : '').join('');
      return `<tr class="row">
        ${sa ? `<td class="ar" rowspan="${sa}">${esc(r.area)}</td>` : ''}
        ${ss ? `<td rowspan="${ss}">${esc(r.sub)}</td>` : ''}
        <td class="out" ${editable ? `data-row="${ri}" title="Засах"` : ''}><span class="code">${esc(r.code)}.</span> ${esc(r.text)}
          ${links ? `<div class="lnk-h">Уялдах суралцахуйн үр дүн:</div><ul>${links}</ul>` : ''}</td>
        ${r.months.map((m, i) => `<td class="m ${m.t}" ${editable ? `data-cell="${ri}:${i}"` : ''}>${m.t === 'u' ? esc(m.code) : ''}</td>`).join('')}
        <td class="num">${r.months.filter(m => m.t === 'u').length}</td>
        <td class="num">${r.months.filter(m => m.t === 'd').length}</td></tr>`;
    }).join('');
    return `<table class="plan">
      <thead>
        <tr><th rowspan="2" style="width:110px">Ай</th><th rowspan="2" style="width:120px">Дэд ай</th><th rowspan="2">Суралцахуйн үр дүн</th>
          ${TERMS.map(([n, c]) => `<th colspan="${c}">${n}</th>`).join('')}<th rowspan="2">Уялдаа</th><th rowspan="2">Давтамж</th></tr>
        <tr>${MONTHS.map(m => `<th>${m}<br>сар</th>`).join('')}</tr>
      </thead>
      <tbody>${body}</tbody>
      <tfoot>
        <tr><td colspan="${3 + MONTHS.length}" style="text-align:right">Уялдаа</td><td class="num" colspan="2">${count(rows, 'u')}</td></tr>
        <tr><td colspan="${3 + MONTHS.length}" style="text-align:right">Давтамж</td><td class="num" colspan="2">${count(rows, 'd')}</td></tr>
      </tfoot></table>`;
  }

  const LEGEND = `<div class="legend"><span><span class="sw" style="background:var(--u-ui)"></span>Уялдаа — бусад чиглэлийн суралцахуйн үр дүнтэй уялдуулах сар</span>
    <span><span class="sw" style="background:var(--d-ui)"></span>Давтамж — давтан хэрэгжүүлэх сар</span></div>`;

  function renderDirection(di) {
    const g = G(), d = g.directions[di];
    if (!d) { ui.view = 'overview'; return render(); }
    const iss = issues(g, di);
    $('#content').innerHTML = `
      <h2><span class="ic">${dem(d)}</span>“${esc(title(d.name))}” чиглэл</h2>
      <p class="muted">${title(g.name)} бүлэг · ${esc(g.level)}. Сарын нүдэн дээр дарж уялдаа/давтамж тохируулна, үр дүнгийн текст дээр дарж засна.</p>
      <div class="toolbar"><span class="grow">${LEGEND}</span>
        <button class="btn primary" id="add-row">➕ Үр дүн нэмэх</button>
        <button class="btn mint" id="print-one">🖨️ Энэ чиглэлийг хэвлэх</button></div>
      ${iss.length ? `<div class="warn-box"><b>Анхааруулга (${iss.length})</b><ul>${iss.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
      <div class="scroll">${planTable(g, d, true)}</div>`;
    $('#content').querySelectorAll('[data-cell]').forEach(td => td.onclick = () => {
      const [ri, mi] = td.dataset.cell.split(':').map(Number); editCell(di, ri, mi);
    });
    $('#content').querySelectorAll('[data-row]').forEach(td => td.onclick = () => editRow(di, +td.dataset.row));
    $('#add-row').onclick = () => editRow(di, -1);
    $('#print-one').onclick = () => doPrint([di]);
  }

  // ---------- засварлах ----------
  function editCell(di, ri, mi) {
    const g = G(), d = g.directions[di], r = d.rows[ri], m = r.months[mi];
    const dlg = $('#dlg-cell'), form = dlg.querySelector('form');
    $('#cell-title').textContent = `${r.code} · ${MONTHS[mi]} сар`;
    form.t.value = m.t;
    const idx = outcomeIndex(g);
    const opts = g.directions.map((x, xi) => xi === di ? '' :
      `<optgroup label="${esc(title(x.name))}">${x.rows.map(o => `<option value="${esc(o.code)}">${esc(o.code)}. ${esc(o.text.slice(0, 80))}</option>`).join('')}</optgroup>`).join('');
    const sel = $('#cell-code');
    sel.innerHTML = `<option value="">— сонгох —</option>` + opts +
      (m.code && !idx.has(m.code) ? `<option value="${esc(m.code)}">${esc(m.code)} (жагсаалтад байхгүй)</option>` : '');
    sel.value = m.code || '';
    const sync = () => {
      $('#cell-link').style.display = form.t.value === 'u' ? '' : 'none';
      const o = idx.get(sel.value);
      $('#cell-hint').textContent = o ? `${title(o.dir)}: ${o.text}` : (sel.value ? m.text : 'Уялдуулах үр дүнгээ сонгоно уу.');
    };
    form.querySelectorAll('input[name=t]').forEach(x => x.onchange = sync);
    sel.onchange = sync; sync();
    dlg.onclose = () => {
      if (dlg.returnValue !== 'ok') return;
      const t = form.t.value;
      if (t === 'u') {
        const o = idx.get(sel.value);
        r.months[mi] = { t: 'u', code: sel.value, text: o ? o.text : (sel.value === m.code ? m.text : '') };
      } else r.months[mi] = { t };
      save(); render();
    };
    dlg.returnValue = ''; dlg.showModal();
  }

  function editRow(di, ri) {
    const g = G(), d = g.directions[di], isNew = ri < 0;
    const r = isNew ? { area: d.rows.at(-1)?.area || '', sub: '', code: '', text: '', months: MONTHS.map(() => ({ t: '' })) } : d.rows[ri];
    const dlg = $('#dlg-row');
    $('#row-title').textContent = isNew ? 'Шинэ суралцахуйн үр дүн' : `${r.code} засах`;
    $('#row-area').value = r.area; $('#row-sub').value = r.sub; $('#row-code').value = r.code; $('#row-text').value = r.text;
    if (isNew) $('#row-code').placeholder = `ж: ${ABBR[d.name] || ''}1.1а`;
    $('#dl-areas').innerHTML = [...new Set(d.rows.map(x => x.area))].map(a => `<option value="${esc(a)}">`).join('');
    $('#dl-subs').innerHTML = [...new Set(d.rows.map(x => x.sub))].map(a => `<option value="${esc(a)}">`).join('');
    ['row-del', 'row-up', 'row-down'].forEach(id => $('#' + id).style.display = isNew ? 'none' : '');
    dlg.onclose = () => {
      const v = dlg.returnValue;
      if (v === 'ok') {
        const oldCode = r.code;
        Object.assign(r, { area: $('#row-area').value.trim(), sub: $('#row-sub').value.trim(), code: $('#row-code').value.trim(), text: $('#row-text').value.trim() });
        if (isNew) d.rows.push(r);
        // Код/текст өөрчлөгдвөл бусад чиглэлийн уялдааг шинэчилнэ
        g.directions.forEach(x => x.rows.forEach(y => y.months.forEach(m => {
          if (m.t === 'u' && m.code === oldCode && oldCode) { m.code = r.code; m.text = r.text; }
        })));
      } else if (v === 'delete') {
        if (!confirm(`${r.code} үр дүнг устгах уу?`)) return;
        d.rows.splice(ri, 1);
      } else if (v === 'up' || v === 'down') {
        const j = ri + (v === 'up' ? -1 : 1);
        if (j >= 0 && j < d.rows.length) [d.rows[ri], d.rows[j]] = [d.rows[j], d.rows[ri]];
      } else return;
      save(); render();
    };
    dlg.returnValue = ''; dlg.showModal();
  }

  // ---------- хэвлэх / Word ----------
  function docHtml(g, dirIdx) {
    return dirIdx.map(di => {
      const d = g.directions[di];
      return `<div class="pdoc">
        <table style="width:100%;border:none;margin-bottom:6pt"><tr>
          <td style="border:none"></td>

  function exportWord() {

      <head><meta charset="utf-8"><title>${esc(g.name)} бүлэг</title><style>${css}</style></head>

  }

  // Кирилл нэртэй файлыг зарим хөтөч "download" болгодог тул латинаар бичнэ
  const TR = { а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'yo',ж:'j',з:'z',и:'i',й:'i',к:'k',л:'l',м:'m',н:'n',о:'o',ө:'u',п:'p',р:'r',с:'s',т:'t',у:'u',ү:'u',ф:'f',х:'h',ц:'ts',ч:'ch',ш:'sh',щ:'sh',ъ:'',ы:'i',ь:'',э:'e',ю:'yu',я:'ya' };
  const latin = s => s.split('').map(c => { const l = c.toLowerCase(), t = TR[l]; return t == null ? c : (c !== l ? t.charAt(0).toUpperCase() + t.slice(1) : t); }).join('').replace(/[^\w.\-]+/g, '_');
  function download(text, name, type) {
    name = latin(name);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }

    'Тухайн номын агуулга, үйл явдлын талаарх ойлголтыг нэмэгдүүлж хүүхдийн бодож сэтгэх үйлийг дэмжих зорилгоор нээлттэй, бататгах асуултууд илүү ойр ойр асууна. Түүнчлэн шинэ үгсийг давтан тайлбарлахын зэрэгцээ эхний уншлагаар хараахан танилцуулаагүй үгсийг энэ удаагийн уншлагаар нэмж танилцуулна.',
    'Хүүхдийн хүүрнэн ярих чадварыг дэмжихийн зэрэгцээ номд гарсан шинэ үгсийг бататгах, хэрэглээг нь дэмжих зорилгоор багшийн чиглүүлэг дор номын үйл явдлыг хүүхдээр түлхүү яриулна.'];
  const RNAMES = ['Эхний уншлага (1)', 'Хоёр дахь уншлага (2)', 'Гурав дахь уншлага (3)'];

  const nl = s => esc(s).replace(/\n/g, '<br>');
  const yearOf = (g, m) => { const y = parseInt(g.year, 10) || new Date().getFullYear(); return m >= '09' ? y : y + 1; };
  const wdOf = iso => { const [y, mo, d] = iso.split('-').map(Number); return WD[new Date(y, mo - 1, d).getDay()]; };
  const mmdd = iso => iso.slice(5).replace('-', '.');

  const origMonth = (g, m) => { const o = ORIGINAL.groups.find(x => x.name === g.name)?.monthly?.[m]; return o && !o.draft ? o : null; };
  function monthObj(g, m) {
    g.monthly = g.monthly || {};
    return g.monthly[m] = g.monthly[m] || { approveWord: 'БАТЛАВ', approverTitle: 'АРГАЗҮЙЧ', approver: '', exclude: ['ХӨГЖИМ'],
      links: {}, notes: {}, remark: '', schedule: [], acts: {}, readings: [] };

  // Жилийн төлөвлөгөөнөөс тухайн сарын шүүлт (уялдаа эхэнд, дараа нь давтамж)
  function filterRows(g, m) {
    const mo = monthObj(g, m), mi = MONTHS.indexOf(m), out = { u: [], d: [] };
    g.directions.forEach(d => {
      if (mo.exclude.includes(d.name)) return;
      d.rows.forEach(r => {
        const c = r.months[mi];
        if (!c || !c.t) return;
        const dates = mo.schedule.filter(s => s.date && (s.code === r.code || s.link === r.code)).map(s => mmdd(s.date));
        out[c.t].push({ code: r.code, text: r.text, t: c.t, dir: d.name,
          link: mo.links[r.code] ?? (c.t === 'u' ? c.code : ''),
          dates: [...new Set(dates)].sort(), note: mo.notes[r.code] || '' });
      });
    });
    return [...out.u, ...out.d];
  }
  // Хуваариас гарсан өдөр + гараар нэмсэн өдөр (эрэмбэлж) + бусад тэмдэглэл (ж: Өдөр бүр)
  function daysText(f) {
    const toks = (f.note || '').split(',').map(t => t.trim()).filter(Boolean), isD = t => /^\d\d\.\d\d$/.test(t);
    return [...[...new Set([...f.dates, ...toks.filter(isD)])].sort(), ...toks.filter(t => !isD(t))].join(', ');
  }

  function linkOptions(g, sel, exclude) {
    return `<option value="">—</option>` + g.directions.map(d =>
      `<optgroup label="${esc(title(d.name))}">${d.rows.filter(o => o.code !== exclude).map(o =>
        `<option value="${esc(o.code)}" ${o.code === sel ? 'selected' : ''}>${esc(o.code)}. ${esc(o.text.slice(0, 70))}</option>`).join('')}</optgroup>`).join('');
  }

  function autoGrow(root) {

        ${origMonth(g, m) ? `<br>📥 Энэ сарын Word файлын хувилбар системд ирсэн байна. <button class="btn small primary" id="m-useorig">Ирсэн хувилбараар солих</button>` : ''}</div>` : ''}

        <button class="btn primary" id="s-gen">📆 Ажлын өдрүүдийг үүсгэх (Да–Ба)</button>
        <button class="btn lilac" id="s-auto">🪄 Хоосон өдрүүдэд автоматаар хуваарилах</button>
        <button class="btn" id="s-add">➕ Өдөр нэмэх</button>
      </div>
      ${notUsedU.length ? `<div class="warn-box">Хуваарьт ороогүй уялдаатай үр дүн (${notUsedU.length}): ${notUsedU.map(x => esc(x.code)).join(', ')}</div>` : ''}
      <div class="scroll"><table class="mt">
        <thead><tr><th style="width:150px">Огноо</th><th>Гараг</th><th>Үндсэн суралцахуйн үр дүн</th><th style="width:200px">Уялдаа</th><th>Үйл ажиллагаа</th><th></th></tr></thead>
        <tbody>${mo.schedule.map((s, i) => `<tr>
          <td><input type="date" data-sd="${i}" value="${esc(s.date)}"></td>
          <td class="c">${s.date ? wdOf(s.date) : ''}</td>
          <td><select data-sc="${i}"><option value="">— сонгох —</option>${['u', 'd'].map(t => `<optgroup label="${t === 'u' ? 'Уялдаа' : 'Давтамж'}">${
              f.filter(x => x.t === t).map(x => `<option value="${esc(x.code)}" ${x.code === s.code ? 'selected' : ''}>${used.has(x.code) && x.code !== s.code ? '✓ ' : ''}${esc(x.code)}. ${esc(x.text.slice(0, 80))}</option>`).join('')}</optgroup>`).join('')}
              ${s.code && !fl.has(s.code) ? `<option value="${esc(s.code)}" selected>${esc(s.code)} (шүүлтэд алга)</option>` : ''}</select></td>
          <td><select data-sl="${i}">${linkOptions(g, s.link, s.code)}</select></td>
          <td class="c">${s.date ? `<button class="btn small ${actFilled(mo.acts[s.date]) ? 'mint' : 'primary'}" data-go="${esc(s.date)}">${actFilled(mo.acts[s.date]) ? '✅ Харах' : '✏️ Бичих'}</button>` : ''}</td>
          <td><button class="btn small danger" data-sdel="${i}">✕</button></td></tr>`).join('') ||
          `<tr><td colspan="6" class="c muted">Хуваарь хоосон. “Ажлын өдрүүдийг үүсгэх” товчийг дарна уу.</td></tr>`}</tbody></table></div>
      <p class="muted">Амралт, баярын өдрийг ✕ товчоор хасна. Үндсэн үр дүнг сонгоход уялдаа нь шүүлтээс автоматаар орно.</p>
      <label style="margin-top:10px">Тайлбар (хуваарийн доор гарна)<textarea class="ag" id="s-remark" rows="1" placeholder="ж: 12.29 – Үндэсний эрх чөлөө, тусгаар тогтнолоо сэргээсэн өдөр (амралтын өдөр).">${esc(mo.remark || '')}</textarea></label>`;
    $('#s-remark').oninput = e => { mo.remark = e.target.value; save(); };
    const sortSave = () => { mo.schedule.sort((a, b) => (a.date || '9').localeCompare(b.date || '9')); save(); render(); };
    $('#s-gen').onclick = () => {
      const y = yearOf(g, m), mon = +m, have = new Set(mo.schedule.map(s => s.date));
      for (let d = new Date(y, mon - 1, 1); d.getMonth() === mon - 1; d.setDate(d.getDate() + 1)) {
        const iso = `${y}-${m}-${String(d.getDate()).padStart(2, '0')}`;
        if (d.getDay() >= 1 && d.getDay() <= 5 && !have.has(iso)) mo.schedule.push({ date: iso, code: '', link: '' });
      }
      sortSave();
    };
    $('#s-add').onclick = () => { mo.schedule.push({ date: '', code: '', link: '' }); save(); render(); };
    $('#s-auto').onclick = () => {
      const queue = [...f.filter(x => x.t === 'u'), ...f.filter(x => x.t === 'd')].filter(x => !used.has(x.code));
      mo.schedule.forEach(s => { if (!s.code && queue.length) { const x = queue.shift(); s.code = x.code; s.link = x.link; } });
      save(); render();
    };
    box.querySelectorAll('[data-sd]').forEach(el => el.onchange = () => {
      const s = mo.schedule[el.dataset.sd], old = s.date; s.date = el.value;
      if (old && mo.acts[old] && !mo.acts[el.value]) { mo.acts[el.value] = mo.acts[old]; delete mo.acts[old]; }
      sortSave();
    });
    box.querySelectorAll('[data-sc]').forEach(el => el.onchange = () => {
      const s = mo.schedule[el.dataset.sc]; s.code = el.value; s.link = fl.get(el.value)?.link || ''; save(); render();
    });
    box.querySelectorAll('[data-sl]').forEach(el => el.onchange = () => { mo.schedule[el.dataset.sl].link = el.value; save(); });
    box.querySelectorAll('[data-sdel]').forEach(el => el.onclick = () => {
      const s = mo.schedule[el.dataset.sdel];
      if (actFilled(mo.acts[s.date]) && !confirm(`${s.date} өдрийн бичсэн үйл ажиллагаа хамт устна. Үргэлжлүүлэх үү?`)) return;
      delete mo.acts[s.date]; mo.schedule.splice(+el.dataset.sdel, 1); save(); render();
    });
    box.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { ui.mtab = 'acts'; ui.act = b.dataset.go; render(); });
  }

  // ---------- 3. Үйл ажиллагааны төлөвлөлт ----------
  const actFilled = a => !!a && !!(a.method || a.competence || a.criteria || (a.steps || []).some(s => s.teacher || s.learner));
  const newAct = () => ({ method: '', competence: '', materials: '', criteria: '',
    steps: DEFAULT_STEPS.map(([time, name]) => ({ time, name, teacher: '', learner: '' })) });

  function mActs(g, m, mo) {
    const box = $('#mbody'), idx = outcomeIndex(g);
    const days = mo.schedule.filter(s => s.date);
    if (!days.length) { box.innerHTML = `<p class="muted">Эхлээд “Хуваарь” хэсэгт өдрүүдээ үүсгэнэ үү.</p>`; return; }
    if (!days.some(s => s.date === ui.act)) ui.act = (days.find(s => !actFilled(mo.acts[s.date])) || days[0]).date;
    const s = days.find(x => x.date === ui.act);
    const a = mo.acts[s.date] = mo.acts[s.date] || newAct();
    const main = idx.get(s.code), link = idx.get(s.link);
    const prev = days[days.findIndex(x => x.date === s.date) - 1];
    box.innerHTML = `
      <div class="act-layout">
        <div class="act-list">${days.map(x => `<button data-day="${esc(x.date)}" class="${x.date === s.date ? 'active' : ''}">
            <span>${actFilled(mo.acts[x.date]) ? '✅' : '⬜'}</span><b>${mmdd(x.date)}</b><small>${wdOf(x.date).slice(0, 2)}</small><em>${esc(x.code || '—')}</em></button>`).join('')}</div>
        <div class="act-edit">
          <div class="act-head">
            <div><small>Бүлэг</small><b>${gem(g)} ${title(g.name)} бүлэг</b></div>
            <div style="flex:3"><small>Суралцахуйн үр дүн</small><b>${s.code ? `${esc(s.code)}. ${esc(main?.text || '')}` : '<em>Хуваарьт үндсэн үр дүн сонгоогүй</em>'}</b></div>
            <div><small>Хугацаа</small><b>${dotted(s.date)}<br>${wdOf(s.date)}</b></div>
          </div>
          <div class="formgrid">
            <label>Суралцахуйн арга<input data-f="method" list="dl-methods" value="${esc(a.method)}" placeholder="сонгох эсвэл бичих"></label>
            <label>Суралцахуйн үр дүн уялдаа<div class="ro">${s.link ? `${esc(s.link)}. ${esc(link?.text || '')}` : '— (хуваарьт сонгоно)'}</div></label>
          </div>
          <datalist id="dl-methods">${METHODS.map(x => `<option value="${esc(x)}">`).join('')}</datalist>
          <label>Чадамж<textarea class="ag" data-f="competence" rows="2">${esc(a.competence)}</textarea></label>
          <label>Хэрэглэгдэхүүн<textarea class="ag" data-f="materials" rows="2">${esc(a.materials)}</textarea></label>
          <label>Үнэлгээний шалгуур<textarea class="ag" data-f="criteria" rows="2">${esc(a.criteria)}</textarea></label>
          <h3 class="sec">🕒 Өдрийн үйл ажиллагааны явц</h3>
          <div class="scroll"><table class="mt steps">
            <thead><tr><th style="width:96px">Хугацаа</th><th style="width:150px">Сургалт үйл ажиллагаа</th><th>Багшлахуйн үйл ажиллагаа</th><th>Суралцахуйн үйл ажиллагаа</th><th style="width:70px"></th></tr></thead>
            <tbody>${a.steps.map((st, i) => `<tr>
              <td><input data-st="${i}:time" value="${esc(st.time)}"></td>
              <td><textarea class="ag" data-st="${i}:name" rows="2">${esc(st.name)}</textarea></td>
              <td><textarea class="ag" data-st="${i}:teacher" rows="3" placeholder="Багш юу хийх вэ…">${esc(st.teacher)}</textarea></td>
              <td><textarea class="ag" data-st="${i}:learner" rows="3" placeholder="Хүүхдүүд юу хийх вэ…">${esc(st.learner)}</textarea></td>
              <td class="c"><button class="btn small" data-mv="${i}:-1">↑</button><button class="btn small" data-mv="${i}:1">↓</button><button class="btn small danger" data-del="${i}">✕</button></td></tr>`).join('')}</tbody></table></div>
          <div class="toolbar">
            <button class="btn" id="a-add">➕ Мөр нэмэх</button>
            ${prev ? `<button class="btn lilac" id="a-copy">📋 Өмнөх өдрийн (${mmdd(prev.date)}) хугацаа, бүтцийг хуулах</button>` : ''}
            <span class="grow"></span>
            <button class="btn mint" id="a-print">🖨️ Энэ өдрийг хэвлэх</button>
            <button class="btn primary" id="a-word">📄 Энэ өдрийг Word-оор</button>
          </div>
        </div>
      </div>`;
    box.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { ui.act = b.dataset.day; render(); });
    box.querySelectorAll('[data-f]').forEach(el => el.oninput = () => { a[el.dataset.f] = el.value; save(); markDay(); });
    box.querySelectorAll('[data-st]').forEach(el => el.oninput = () => {
      const [i, k] = el.dataset.st.split(':'); a.steps[i][k] = el.value; save(); markDay();
    });
    const markDay = () => { const b = box.querySelector(`[data-day="${s.date}"] span`); if (b) b.textContent = actFilled(a) ? '✅' : '⬜'; };
    box.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => {
      const [i, d] = b.dataset.mv.split(':').map(Number), j = i + d;
      if (j >= 0 && j < a.steps.length) { [a.steps[i], a.steps[j]] = [a.steps[j], a.steps[i]]; save(); render(); }
    });
    box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { a.steps.splice(+b.dataset.del, 1); save(); render(); });
    $('#a-add').onclick = () => { a.steps.push({ time: '', name: '', teacher: '', learner: '' }); save(); render(); };
    if (prev) $('#a-copy').onclick = () => {
      const p = mo.acts[prev.date];
      if (!p) return;
      if (a.steps.some(x => x.teacher || x.learner) && !confirm('Одоогийн явцын мөрүүдийг солих уу? (Бичсэн агуулга устна)')) return;
      a.steps = p.steps.map(x => ({ time: x.time, name: x.name, teacher: '', learner: '' })); save(); render();
    };
    $('#a-print').onclick = () => printDocs(actDoc(g, mo, s) + mo.readings.filter(r => readingFirst(g, m, r) === s.date).map(r => readingDoc(r)).join(''));
    $('#a-word').onclick = () => wordDownload(actDoc(g, mo, s), `${title(g.name)}_${s.date}_үйл_ажиллагаа.doc`);
  }

  // ---------- 4. Чанга уншлага ----------
  function mReadings(g, m, mo) {
    const box = $('#mbody');
    if (ui.read == null || !mo.readings[ui.read]) ui.read = mo.readings.length ? 0 : -1;
    const r = mo.readings[ui.read];
    box.innerHTML = `
      <div class="toolbar">
        ${mo.readings.map((x, i) => `<button class="btn small ${i === ui.read ? 'primary' : ''}" data-r="${i}">📖 ${esc(x.book || 'Нэргүй ном')}</button>`).join('')}
        <button class="btn mint small" id="r-new">➕ Шинэ ном</button>
      </div>
      ${!r ? '<p class="muted">Энэ сард чанга уншлагын төлөвлөгөө алга. “Шинэ ном” товчоор нэмнэ үү.</p>' : `
      <div class="mcard">
        <div class="formgrid">
          <label>Номын нэр<input data-rf="book" value="${esc(r.book)}"></label>
          <label>Зохиолч, зураач<input data-rf="author" value="${esc(r.author)}"></label>
        </div>
        <label>Уншлагын өдрүүд<input data-rf="days" value="${esc(r.days)}" placeholder="11.02 (1-р уншлага), 11.04 (2-р уншлага), 11.06 (3-р уншлага)"></label>
        <label>Уншлагын зорилго <span class="muted">(бусад суралцахуйн чиглэлтэй холбоотой зорилгыг нэмэлтээр тусгах)</span><textarea class="ag" data-rf="goals" rows="3">${esc(r.goals)}</textarea></label>
        <label>Номын товч танилцуулга<textarea class="ag" data-rf="summary" rows="3">${esc(r.summary)}</textarea></label>
      </div>
      <h3 class="sec">🔤 Шинээр танилцуулах үгс</h3>
      <div class="scroll"><table class="mt">
        <thead><tr><th>Ном уншихын өмнө заах үг</th><th>Уншиж байхдаа утгачлан тайлбарлах үг</th><th>Үйл хөдлөл, номын зураг зэргийг ашиглан танилцуулах үг</th><th style="width:40px"></th></tr></thead>
        <tbody>${r.words.map((w, i) => `<tr>${[0, 1, 2].map(k => `<td><textarea class="ag" rows="1" data-w="${i}:${k}">${esc(w[k])}</textarea></td>`).join('')}
          <td><button class="btn small danger" data-wdel="${i}">✕</button></td></tr>`).join('')}</tbody></table></div>
      <div class="toolbar"><button class="btn small" id="w-add">➕ Үг нэмэх</button></div>
      ${[['r1', R1], ['r2', R2], ['r3', R3]].map(([k, labels], ri) => `
        <h3 class="sec">${['1️⃣', '2️⃣', '3️⃣'][ri]} ${RNAMES[ri]}</h3>
        <p class="muted">${RINTRO[ri]}</p>
        ${labels.map(l => `<label>${esc(l)}<textarea class="ag" rows="2" data-rr="${k}" data-rl="${esc(l)}">${esc(r[k][l] || '')}</textarea></label>`).join('')}`).join('')}
      <h3 class="sec">📜 Номын бичвэр</h3>
      <textarea class="ag" rows="6" data-rf="text" placeholder="Хуудас 1. …&#10;Хуудас 2. …">${esc(r.text)}</textarea>
      <div class="toolbar"><span class="grow"></span>
        <button class="btn danger" id="r-del">🗑️ Энэ номыг устгах</button>
        <button class="btn mint" id="r-print">🖨️ Хэвлэх</button>
        <button class="btn primary" id="r-word">📄 Word-оор</button></div>`}`;
    box.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { ui.read = +b.dataset.r; render(); });
    $('#r-new').onclick = () => {
      mo.readings.push({ days: '', book: '', author: '', goals: '', summary: '', words: [['', '', '']], r1: {}, r2: {}, r3: {}, text: '' });
      ui.read = mo.readings.length - 1; save(); render();
    };
    if (!r) return;
    box.querySelectorAll('[data-rf]').forEach(el => el.oninput = () => { r[el.dataset.rf] = el.value; save(); });
    box.querySelectorAll('[data-rr]').forEach(el => el.oninput = () => { r[el.dataset.rr][el.dataset.rl] = el.value; save(); });
    box.querySelectorAll('[data-w]').forEach(el => el.oninput = () => { const [i, k] = el.dataset.w.split(':'); r.words[i][k] = el.value; save(); });
    box.querySelectorAll('[data-wdel]').forEach(b => b.onclick = () => { r.words.splice(+b.dataset.wdel, 1); save(); render(); });
    $('#w-add').onclick = () => { r.words.push(['', '', '']); save(); render(); };
    $('#r-del').onclick = () => { if (confirm(`“${r.book}” номын төлөвлөгөөг устгах уу?`)) { mo.readings.splice(ui.read, 1); ui.read = 0; save(); render(); } };
    $('#r-print').onclick = () => printDocs(readingDoc(r));
    $('#r-word').onclick = () => wordDownload(readingDoc(r), `Чанга_уншлага_${r.book || 'ном'}.doc`);
  }

  function readingFirst(g, m, r) {
    const mm = (r.days || '').match(/(\d\d)\.(\d\d)/);
    if (!mm) return '';
    return `${yearOf(g, mm[1])}-${mm[1]}-${mm[2]}`;
  }

  // ---------- Баримт бичиг (хэвлэх / Word) ----------
  const sign = g => `<p class="sig">БОЛОВСРУУЛСАН<br>БАГШ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ${esc(g.teacher)}</p>`;
  const page = html => `<div class="pdoc">${html}</div>`;

  function filterDoc(g, m, mo) {
    const f = filterRows(g, m), y = yearOf(g, m);
    return page(`
      <table class="nob"><tr><td></td><td class="appr">${esc(mo.approveWord || 'БАТЛАВ')}<br>${esc(mo.approverTitle)} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ${esc(mo.approver)}<br>${y} оны ..... сарын ..... өдөр</td></tr></table>
      <p class="ttl">${esc(g.school)} ${esc(g.name)} БҮЛГИЙН ${y} ОНЫ ${+m} ${(ORD[m] || '').toUpperCase()} САРЫН СУРАЛЦАХУЙН ҮР ДҮН, УЯЛДААНЫ ШҮҮЛТ</p>
      <p class="ctr">(${esc(g.year)} оны хичээлийн жилийн сургалтын үйл ажиллагааны төлөвлөгөөнөөс)</p>
      <table class="dt"><thead><tr><th>№</th><th>Суралцахуйн үр дүн</th><th>Уялдаа</th><th>Хэлбэр</th><th>Хэрэгжүүлэх өдөр</th><th>Чиглэл</th></tr></thead>
      <tbody>${f.map((x, i) => `<tr><td class="c">${i + 1}</td><td>${esc(x.code)}. ${esc(x.text)}</td><td class="c">${esc(x.link || '—')}</td>
        <td class="c">${x.t === 'u' ? 'Уялдаа' : 'Давтамж'}</td><td class="c">${esc(daysText(x))}</td><td>${esc(title(x.dir))}</td></tr>`).join('')}</tbody></table>
      ${sign(g)}`);
  }

  function scheduleDoc(g, m, mo) {
    const idx = outcomeIndex(g), y = yearOf(g, m);
    return page(`
      <p class="ttl">${y} ОНЫ ${+m} ${(ORD[m] || '').toUpperCase()} САРЫН ЧИГЛҮҮЛЭГТЭЙ ҮЙЛ АЖИЛЛАГААНЫ ХУВААРЬ</p>
      <table class="dt"><thead><tr><th>Огноо</th><th>Гараг</th><th>Үндсэн суралцахуйн үр дүн</th><th>Уялдаа</th></tr></thead>
      <tbody>${mo.schedule.filter(s => s.date).map(s => `<tr><td class="c">${dotted(s.date)}</td><td class="c">${wdOf(s.date)}</td>
        <td>${s.code ? `${esc(s.code)}. ${esc(idx.get(s.code)?.text || '')}` : ''}</td><td class="c">${esc(s.link || '—')}</td></tr>`).join('')}</tbody></table>
      ${mo.remark ? `<p>Тайлбар: ${nl(mo.remark)}</p>` : ''}
      ${sign(g)}`);
  }

  function actDoc(g, mo, s) {
    const idx = outcomeIndex(g), a = mo.acts[s.date] || newAct(), link = idx.get(s.link);
    return page(`
      <p class="ttl">ЧИГЛҮҮЛЭГТЭЙ ҮЙЛ АЖИЛЛАГААНЫ ТӨЛӨВЛӨЛТ</p>
      <table class="dt"><tr><th>Бүлэг</th><th>Суралцахуйн үр дүн</th><th>Хугацаа</th><th>${esc(mo.approveWord || 'БАТЛАВ')}<br>${esc(title(mo.approverTitle))}<br>${esc(mo.approver)}</th></tr>
        <tr><td class="c">${title(g.name)} бүлэг</td><td>${s.code ? `${esc(s.code)}. ${esc(idx.get(s.code)?.text || '')}` : ''}</td><td class="c">${dotted(s.date)}</td><td></td></tr></table>
      <p><b>Суралцахуйн арга:</b> &nbsp; ${esc(a.method)}</p>
      <p><b>Суралцахуйн үр дүн уялдаа:</b> &nbsp; ${s.link ? `${esc(s.link)}. ${esc(link?.text || '')}` : ''}</p>
      <p><b>Чадамж:</b> &nbsp; ${nl(a.competence)}</p>
      <p><b>Хэрэглэгдэхүүн:</b> &nbsp; ${nl(a.materials)}</p>
      <p><b>Үнэлгээний шалгуур:</b> &nbsp; ${nl(a.criteria)}</p>
      <table class="dt"><thead><tr><th style="width:12%">Хугацаа</th><th style="width:16%">Сургалт үйл ажиллагаа</th><th>Багшлахуйн үйл ажиллагаа</th><th>Суралцахуйн үйл ажиллагаа</th></tr></thead>
      <tbody>${a.steps.map(x => `<tr><td class="c">${esc(x.time)}</td><td>${nl(x.name)}</td><td>${nl(x.teacher)}</td><td>${nl(x.learner)}</td></tr>`).join('')}</tbody></table>
      ${sign(g)}`);
  }

  function readingDoc(r) {
    const rt = (k, labels, i) => `<table class="dt"><tr><th colspan="2">${RNAMES[i]}</th></tr><tr><td colspan="2"><i>${RINTRO[i]}</i></td></tr>
      ${labels.map(l => `<tr><td style="width:32%"><b>${esc(l)}</b></td><td>${nl(r[k][l] || '')}</td></tr>`).join('')}</table>`;
    return page(`
      <p class="ttl">ЧАНГА УНШЛАГЫН АРГА ЗҮЙ<br>ТӨЛӨВЛӨГӨӨНИЙ ХУУДАС</p>
      <p>Уншлагын өдрүүд: ${esc(r.days)}</p>
      <table class="dt"><tr><td style="width:32%"><b>Номын нэр:</b></td><td>«${esc(r.book)}»</td></tr>
        <tr><td><b>Зохиолч, зураач:</b></td><td>${esc(r.author)}</td></tr>
        <tr><td><b>Уншлагын зорилго:</b> (Бусад суралцахуйн чиглэлүүдтэй холбоотой зорилгыг нэмэлтээр тусгах)</td><td>${nl(r.goals)}</td></tr></table>
      <table class="dt"><tr><th>Номын товч танилцуулга:</th></tr><tr><td>${nl(r.summary)}</td></tr></table>
      <table class="dt"><tr><th colspan="3">Шинээр танилцуулах үгс:</th></tr>
        <tr><th>Ном уншихын өмнө заах үг</th><th>Уншиж байхдаа утгачлан тайлбарлах үг</th><th>Үйл хөдлөл, номын зураг зэргийг ашиглан танилцуулах үг</th></tr>
        ${r.words.map(w => `<tr>${w.map(x => `<td>${nl(x)}</td>`).join('')}</tr>`).join('')}</table>
      ${rt('r1', R1, 0)}${rt('r2', R2, 1)}${rt('r3', R3, 2)}
      ${r.text ? `<table class="dt"><tr><th>Номын бичвэр: «${esc(r.book)}»</th></tr><tr><td>${nl(r.text)}</td></tr></table>` : ''}`);
  }

  function monthDocs(g, m) {
    const mo = monthObj(g, m), placed = new Set();
    let html = filterDoc(g, m, mo) + scheduleDoc(g, m, mo);
    mo.schedule.filter(s => s.date).forEach(s => {
      html += actDoc(g, mo, s);
      mo.readings.forEach((r, i) => { if (!placed.has(i) && readingFirst(g, m, r) === s.date) { placed.add(i); html += readingDoc(r); } });
    });
    mo.readings.forEach((r, i) => { if (!placed.has(i)) html += readingDoc(r); });
    return html;
  }

  function printDocs(html) { $('#print-root').innerHTML = `<div class="mdocs">${html}</div>`; window.print(); }
  function printMonth() { printDocs(monthDocs(G(), ui.month)); }

  const DOC_CSS = `
    .pdoc { font-family: "Times New Roman", serif; font-size: 11pt; }
    .mdocs p { margin: 4pt 0; }
    .mdocs .ttl { text-align: center; font-weight: bold; margin: 8pt 0; }
    .mdocs .ctr { text-align: center; }
    .mdocs .sig { font-weight: bold; margin-top: 14pt; }
    .mdocs table.nob { width: 100%; border: none; } .mdocs table.nob td { border: none; }
    .mdocs td.appr { width: 42%; font-weight: bold; }
    .mdocs table.dt { border-collapse: collapse; width: 100%; margin: 6pt 0; font-size: 10pt; }
    .mdocs .dt th, .mdocs .dt td { border: 1px solid #000; padding: 3pt 5pt; vertical-align: top; text-align: left; }
    .mdocs .dt th { background: #F2F2F2; text-align: center; }
    .mdocs .dt td.c { text-align: center; }`;

  function wordDownload(html, name) {
    const parts = html.split('<div class="pdoc">').filter(Boolean).map(x => '<div class="pdoc">' + x);
    const doc = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
      <head><meta charset="utf-8"><style>@page WordSection1 { size: 595.3pt 841.9pt; margin: 56.7pt 42.5pt 56.7pt 85pt; }
      div.WordSection1 { page: WordSection1; } body { font-family: "Times New Roman", serif; font-size: 11pt; }
      ${DOC_CSS.replace(/\.mdocs /g, '')}</style></head>
      <body><div class="WordSection1 mdocs">${parts.join('<br clear=all style="page-break-before:always">')}</div></body></html>`;
    download('﻿' + doc, name, 'application/msword');
  }

  function exportMonthWord() {
    const g = G();
    wordDownload(monthDocs(g, ui.month), `${title(g.name)}_бүлэг_${yearOf(g, ui.month)}_${ui.month}_сарын_төлөвлөлт.doc`);
  }
  document.head.insertAdjacentHTML('beforeend', `<style>@page monthly { size: A4 portrait; margin: 20mm 15mm 20mm 30mm; } @media print { ${DOC_CSS} .mdocs .pdoc { page: monthly; page-break-after: always; } .mdocs .pdoc:last-child { page-break-after: auto; } }</style>`);


  render();
})();
</script>
</body>
</html>
