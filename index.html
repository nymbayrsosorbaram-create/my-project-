эрэглэх вэ?»\n- Шинэ сурсан үгсээр өгүүлбэр зохиолгох: дэлгэц, ядрах, зөвлөх, унтраах, хуваарь\n- Бүтээл: «Миний өдрийн хуваарь» – тоглох, унших, гадаа гарах, дэлгэцийн цагийг зургаар тэмдэглэх"},"text":"Хуудас 1. Дөлгөөн таблетаар тоглох маш дуртай. Таблетын дэлгэц дээр өнгө өнгийн тоглоом, хүүхэлдэйн кино байдаг. Тэр өглөө ч, өдөр ч, орой ч таблетаа тавьдаггүй байв.\nХуудас 2. Нэг орой Дөлгөөний нүд нь хорсож, тэр нүдээ нухлав. Толгой нь ч бас эргэлээ.\nХуудас 3. Ээж нь «Чи их ядарчээ. Маргааш эмчид үзүүлье» гэв. Дөлгөөн тэр шөнө сайн унтаж чадсангүй.\nХуудас 4. Эмч «Дэлгэц удаан харвал нүд ядардаг, бие хөдөлгөөнгүй болдог. Өдөрт богино хугацаанд ашиглаж, гадаа тоглоорой» гэж зөвлөв. Дөлгөөн «Хэдэн минут тоглож болох вэ?» гэж асуужээ.\nХуудас 5. Гэртээ ирээд Дөлгөөн таблетаа унтраав. Ээжтэйгээ хамт «Өдрийн хуваарь» зурж, таблетын цагийг 15 минут гэж тэмдэглэлээ.\nХуудас 6. Одоо Дөлгөөн найзуудтайгаа гадаа тоглож, ном уншиж, таблетаар богино хугацаанд тоглодог болжээ. Тоглож дуусаад тэр биеэ сунгаж сунгаа хийдэг."}]},"11":{"approverTitle":"АРГАЗҮЙЧ","approver":"Ц.ОДОНЧИМЭГ","exclude":["ХӨГЖИМ"],"links":{"НСХ3.1б":"ХЭМ3.2в","НСХ3.2б":"БНО3.1а","ХЭМ3.1ж":"ХЯ3.1а","ХЭМ3.2д":"НСХ3.1а","ХЭМ3.2ж":"БНО3.1г","ХЯ3.2г":"ЗУ3.1а","БНО3.2б":"НСХ3.3в","МАТ3.1б":"ЗУ3.2в","ЗУ3.2а":"БНО3.1г","ЗУ3.2в":"МАТ3.1б","ЗУ3.2г":"БНО3.1а","НСХ3.1а":"ХӨГ3.1г","НСХ3.1в":"ХЯ3.2а","НСХ3.2а":"ХЯ3.3а","НСХ3.2в":"ХЭМ3.2г","НСХ3.3б":"БНО3.2а","НСХ3.3в":"БНО3.2б","ХЭМ3.1а":"ХӨГ3.1в","ХЭМ3.1в":"МАТ3.1а","ХЭМ3.1г":"МАТ3.3в","ХЭМ3.1д":"НСХ3.2в","ХЭМ3.1е":"МАТ3.3в","ХЭМ3.1м":"МАТ3.3б","ХЭМ3.2а":"МАТ3.2б","ХЭМ3.2б":"БНО3.1г","ХЭМ3.2в":"МАТ3.3а","ХЭМ3.2г":"НСХ3.2в","ХЯ3.1а":"НСХ3.1а","ХЯ3.1б":"ХӨГ3.1а","ХЯ3.2а":"НСХ3.1б","ХЯ3.2б":"БНО3.1а","ХЯ3.2в":"БНО3.1в","ХЯ3.3а":"НСХ3.2а","ХЯ3.3в":"ЗУ3.2а","БНО3.1а":"НСХ3.2б","БНО3.1б":"НСХ3.3в","БНО3.1в":"МАТ3.3а","БНО3.1г":"ХЭМ3.2ж","БНО3.2а":"ХЯ3.1а","БНО3.2г":"НСХ3.3а","МАТ3.1а":"БНО3.1а","МАТ3.2б":"ХЭМ3.2а","МАТ3.3а":"БНО3.1в","МАТ3.3б":"ЗУ3.2д","МАТ3.3в":"ХЭМ3.1г","ЗУ3.1а":"НСХ3.1а","ЗУ3.2б":"БНО3.1б","ЗУ3.2д":"МАТ3.3б"},"notes":{"НСХ3.3б":"Өдөр бүр","ХЭМ3.1а":"Өдөр бүр","ХЭМ3.1в":"Өдөр бүр","ХЭМ3.1е":"Өдөр бүр","ХЭМ3.1м":"Өдөр бүр","ХЭМ3.2а":"Өдөр бүр","ХЯ3.1б":"Өдөр бүр","ХЯ3.2б":"Өдөр бүр","ХЯ3.2в":"Өдөр бүр","БНО3.1б":"Өдөр бүр","БНО3.2а":"Өдөр бүр","БНО3.2г":"Өдөр бүр","МАТ3.2б":"Өдөр бүр","МАТ3.3б":"Өдөр бүр","ЗУ3.2б":"Өдөр бүр","ЗУ3.2д":"Өдөр бүр"},"schedule":[{"date":"2026-11-02","code":"НСХ3.1б","link":"ХЭМ3.2в"},{"date":"2026-11-03","code":"ХЯ3.2г","link":"ЗУ3.1а"},{"date":"2026-11-04","code":"БНО3.2б","link":"НСХ3.3в"},{"date":"2026-11-05","code":"МАТ3.1б","link":"ЗУ3.2в"},{"date":"2026-11-06","code":"ЗУ3.2а","link":"БНО3.1г"},{"date":"2026-11-09","code":"НСХ3.2б","link":"БНО3.1а"},{"date":"2026-11-10","code":"ХЯ3.2а","link":"НСХ3.1б"},{"date":"2026-11-11","code":"ХЭМ3.2ж","link":"БНО3.1г"},{"date":"2026-11-12","code":"МАТ3.3в","link":"ХЭМ3.1г"},{"date":"2026-11-13","code":"ЗУ3.2г","link":"БНО3.1а"},{"date":"2026-11-16","code":"ХЭМ3.2д","link":"НСХ3.1а"},{"date":"2026-11-17","code":"ХЯ3.3а","link":"НСХ3.2а"},{"date":"2026-11-18","code":"БНО3.1в","link":"МАТ3.3а"},{"date":"2026-11-19","code":"ХЭМ3.1ж","link":"ХЯ3.1а"},{"date":"2026-11-20","code":"ХЯ3.3в","link":"ЗУ3.2а"},{"date":"2026-11-23","code":"НСХ3.2в","link":"ХЭМ3.2г"},{"date":"2026-11-24","code":"ХЭМ3.2б","link":"БНО3.1г"},{"date":"2026-11-25","code":"ХЭМ3.1д","link":"НСХ3.2в"},{"date":"2026-11-27","code":"МАТ3.1а","link":"БНО3.1а"},{"date":"2026-11-30","code":"НСХ3.1в","link":"ХЯ3.2а"}],"acts":{"2026-11-02":{"method":"Зохиолд суурилсан арга","link":"ХЭМ3.2в. Хоол, хүнсний бүтээгдэхүүнээс эрүүл мэндэд тустай хүнсийг ялгаж, хэрэглэнэ.","competence":"Шүүн тунгаах (өөрийн чадах, чадахгүй зүйлсээ илэрхийлэх, чадахгүй зүйлээ чаддаг болох оролдлого хийх), нийгэм, сэтгэл хөдлөлийн хөгжил, эрүүл хүнс сонгох","materials":"Зурган карт, зурагт үзүүлэн (\"Бяцхан баавгай\" үйл явдал), хүнсний бүтээгдэхүүний загвар/зурагт карт, \"Дуртай – Дургүй\" гэсэн 2 сагс, \"Би чадна – Надад тусламж хэрэгтэй\" карт, таваг, халбага, жимс (алим, лууван)","criteria":"Юунд яагаад дуртай, дургүй вэ гэдгээ ярьдаг. Өдөр тутмын өөртөө үйлчлэх үйлүүдийг бие даан гүйцэтгэж чадах, чадахгүйгээ хэлдэг. Өөрт нь ямар хэрэгцээ үүссэн, яавал дээр вэ гэдгийг тайлбарлаж ярина.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Чи өнөөдөр өглөөний цайндаа юу уусан бэ? Танд таалагдсан уу?\" гэж асууна.","learner":"- Багш, найзуудтайгаа мэндчилж, тойрогт сууна.\n- Өглөөний цайндаа юу уусан, идсэнээ нэрлэнэ.\n- \"Надад ... таалагдсан / таалагдаагүй, учир нь ...\" гэж шалтгаантай нь хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Зурагт карт, үлгэр: \"Бяцхан баавгай өглөөний цайгаа бэлддэг\" зурагт картаар үйл явдлыг үзүүлж, баавгайн чадах, чадахгүй зүйлсийг ярилцуулна. \n- Дуртай, дургүйгээ ялгах: Хүнсний картуудыг \"Дуртай\", \"Дургүй\" сагсанд хийлгэж, \"Яагаад?\" гэж асууна. Дургүй хүнс нь биед тустай эсэхийг хамтдаа ярилцана.\n- \"Чадахгүй ч гэсэн би хичээнэ\" ярилцлага: Алим хальслах, халбагаар хутгах, таваг зөөх зэргийг оролдуулж, чадахгүй зүйлээ чаддаг болохын тулд яаж хичээх, хэнээс тусламж хүсэхийг ярилцана.\nБагшийн чиглүүлэх асуулт:\n1. Чи ямар хоолонд дуртай вэ? Яагаад?\n2. Ямар хоолонд дургүй вэ? Тэр хоол биед тустай юу?\n3. Чи өөрөө юу хийж чаддаг вэ? Юуг хараахан чадахгүй байна вэ?\n4. Чадахгүй зүйлээ чаддаг болохын тулд яах вэ? Тусламж хэрэгтэй бол яаж хэлэх вэ?","learner":"- Зурагт картын үйл явдлыг харж, баавгайн чадах, чадахгүй зүйлийг нэрлэнэ.\n- Хүнсний картыг \"Дуртай\", \"Дургүй\" сагсанд өөрөө сонгон хийж, \"Би ...-д дуртай, учир нь ...\" гэж шалтгаанаа хэлнэ.\n- Багшийн тусламжтай биед тустай хүнсийг ялгаж, тусад нь тавина.\n- Алим хальслах, халбагаар хутгахыг оролдож, \"Би чадаж байна\" эсвэл \"Надад тусламж хэрэгтэй, ... туслаач\" гэж хэрэгцээгээ хэлнэ.\n- \"Чадахгүй ч гэсэн би хичээнэ\" гэж хамтдаа уриа хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Дүрт тоглоомын буланд \"Гал тогоо\" орчин бүрдүүлж ажиглана.","learner":"- \"Гал тогоо\" буланд тогооч, зочин болж дүрээ хуваарилна.\n- Найзаасаа \"Чи ямар хоолонд дуртай вэ?\" гэж асууж, хоолыг нь бэлтгэх дүр үзүүлнэ.\n- Хоолоо тавагт зохион тавьж, найздаа санал болгоно."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – эхний уншлага (1): «Бяцхан туслагч Сараа» (Чанга уншлагын төлөвлөгөөний хуудсыг үзнэ үү.)\n- Номын нэр, хавтас, зохиолч, зураачийг танилцуулж, хэмнэлийг алдагдуулахгүй уншина.\n- Түр зогсож асуух: «Бүгд ядарч ирэхэд Сараа юу хийх бол?»\n- Шинэ үг: «Тэтгэвэр – насаар ажлаасаа гарч амрах»\n- Уншсаны дараа: «Сараагийнх хэдэн хүнтэй гэр бүл вэ? Хуруугаараа тоолоорой.»","learner":"- Номын нэр, хавтасны зургийг харж, ном юуны тухай байхыг таамаглаж хэлнэ.\n- Багшийн уншихыг анхааралтай, тайван сонсоно.\n- Түр зогсох үед \"Дараа нь юу болох бол?\" гэсэн асуултад өөрийн таамаглалыг хэлнэ.\n- Шинэ үгийн утгыг сонсож, багштай хамт давтан хэлнэ.\n- Уншсаны дараа номын гол дүрүүдийг нэрлэж, хуруугаараа тоолно."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: \"Миний дуртай эрүүл хоол\" сэдвээр зураг зурах. Цаас, өнгийн харандаа, лав өнгө бэлтгэнэ.\n- Хүүхэд бүрээс \"Юу зурж байна? Яагаад дуртай вэ?\" гэж асууна.\nМатематикийн төв: Хүнсний картыг \"жимс\", \"ногоо\" гэсэн хоёр сагсанд ангилуулна.\n- \"Аль сагсанд олон байна вэ?\" гэж тоолуулна.\nДүрт тоглоомын төв: \"Гал тогоо\": тогоо, таваг, хүнсний загвар байрлуулж, тогооч, зочны дүрийг санал болгоно.\nХэл ярианы төв: \"Би чадна / Надад тусламж хэрэгтэй\" карт байрлуулж, хүүхдийг өөрийн чадах зүйлийг ярихад урина.","learner":"Урлагийн төв: Дуртай эрүүл хоолоо зурж, тохирох өнгөөр будна.\n- Зурсан хоолныхоо нэр, яагаад дуртайгаа найздаа хэлнэ.\nМатематикийн төв: Картыг жимс, ногоо гэж ангилж сагсанд хийнэ.\n- Сагс бүрийн картыг тоолж, олон, цөөнийг жишнэ.\nДүрт тоглоомын төв: Тогооч болж найзаасаа дуртай хоолыг нь асууна.\n- \"Би ... -д дургүй, ... -г авъя\" гэж сонголтоо хэлнэ.\nХэл ярианы төв: Картаас сонгож \"Би ... хийж чадна\" гэж бүтэн өгүүлбэрээр хэлнэ.\n- Чадахгүй зүйлдээ хэрхэн тусламж хүсэхээ хэлнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 1 (1). Ажиглалт: «Түргэн тусламж» машин ажиглах\nЗорилго: Түргэний машины жолоочийн ажил үүргийн тухай ойлголттой болох; түргэний машины дуут дохиог бусад машины дуут дохионоос ялгаж сонсох, дуурайн дуугарах; 103 тусгай дугаарыг тогтоох; түргэний машинд яагаад зам тавьж өгөх ёстойг ойлгох.\nЯвц:\n- Зам дээр дуугарч, яарч яваа машиныг ажиглуулна.\n- Багшийн мэдээлэл: «Түргэн тусламж» машин өвчтэй, бэртсэн хүмүүст туслах гэж яарч явдаг. Дотор нь эмч нар байдаг. Тэд хүмүүсийг эмнэлэгт хурдан хүргэдэг. Дохио дуугаргаж явахад бусад машин зам тавьж өгдөг.\n- Асуулт: «Зам дээр дуугарч, яарч яваа энэ ямар машин бэ?», «Яагаад яарч явж байна вэ?», «Хэн дууддаг вэ?», «Энэ машин хаашаа явж байна вэ?»","learner":"- Зам дээр явж буй машинуудыг ажиглаж, түргэний машиныг өнгө, тэмдэг, дохиогоор нь ялгаж нэрлэнэ.\n- Түргэний машины дууг сонсож, бусад машины дуунаас ялгаад дуурайн дуугарна.\n- «103» дугаарыг багштай хамт давтаж тогтооно.\n- Түргэний машинд яагаад зам тавьж өгдгийг «Өвчтэй хүн хүлээж байгаа учраас» гэж тайлбарлана."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Би дуртай...»\nЗорилго: Өөрийн дуртай, дургүй зүйлээ бүтэн өгүүлбэрээр илэрхийлэх, бусдыг сонсох.\nХэрэглэгдэхүүн: Зөөлөн бөмбөг, хүнсний зурагт карт.\nЯвц:\n1. Хүүхдүүдийг тойрог болгон суулгана.\n2. Багш бөмбөг барьж «Би алимд дуртай, учир нь амттай» гэж үлгэрчилнэ.\n3. Бөмбөгийг хажуугийн хүүхдэд дамжуулахад тэр хүүхэд дуртай зүйлээ шалтгаантай нь хэлнэ.\n4. Хоёр дахь тойрогт «Би ... -д дургүй» гэж хэлүүлнэ.\n5. «Хэн Болдтой адилхан зүйлд дуртай вэ?» гэж асууж гар өргүүлнэ.\nДүрэм: Бөмбөг барьсан хүн ярина; бусад нь чимээгүй сонсоно; хэнийг ч шоолохгүй.\nДүгнэлт: Өнөөдөр хэн юунд дуртай байсныг хамтдаа санаж, өдрийг дүгнэнэ.","learner":"- Тойрогт сууж, бөмбөгийг ээлжээр дамжуулна.\n- Бөмбөг ирэхэд «Би ... -д дуртай, учир нь ...» гэж бүтэн өгүүлбэрээр хэлнэ.\n- Дургүй зүйлээ эелдэгээр хэлнэ.\n- Найзтайгаа ижил зүйлд дуртай бол гараа өргөнө.\n- Өнөөдөр юу сурснаа хуваалцана."}]},"2026-11-03":{"method":"Зохиолд суурилсан арга","link":"ЗУ3.1а. Уран зураг, баримлын бүтээлийг ажиглаж өөрт төрсөн сэтгэгдлээ илэрхийлнэ.","competence":"Харилцах (санаа бодол, мэдрэмжээ дэлгэрэнгүй, утгын холбоотой илэрхийлэх), бүтээлчээр сэтгэх (үзсэн зүйлээр түүх зохиож ярих), урлагийн бүтээл ажиглах","materials":"Монгол зураачдын уран зургийн хуулбар (\"Нэг өдөр Монголд\" зэрэг), жижиг баримал, шинж чанарын үгийн карт (том, жижиг, хөгжилтэй, тайван), өгүүлбэрийн бүдүүвч, микрофон тоглоом","criteria":"Өөрийн бодол санаагаа 3-4 үгтэй дэлгэрэнгүй өгүүлбэрээр илэрхийлж ярьдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Зураг\" гэдэг үгнээс эхэлсэн өгүүлбэр зохиох тоглоом тоглоно.","learner":"- Багшийн \"Зураг дээр...\" гэж эхлүүлсэн өгүүлбэрийг өөрийн санаагаар үргэлжлүүлнэ.\n- Найзынхаа өгүүлбэрийг сонсож, нэг үг нэмж дэлгэрүүлэхийг оролдоно."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Чиглүүлсэн асуулт, зураг: Уран зургийг үзүүлж, \"Хэн? Юу хийж байна? Хаана? Ямар?\"\nХэн харагдаж байна вэ? гэсэн асуултаар үгийг идэвхжүүлнэ.\n- Өгүүлбэр дэлгэрүүлэх: Өгүүлбэрийн бүдүүвч ашиглан \"Морь байна\" гэснийг \"Хүрэн морь ногоон тал дээр давхиж байна\" болгон дэлгэрүүлж үзүүлнэ.\n- Үг сонгох: Шинж чанарын үгийн картаас тохирохыг сонгож өгүүлбэрт оруулахыг дэмжинэ.\n- Бодит үйл явдлыг ярих: \"Өчигдөр гэртээ юу хийсэн бэ?\" гэж асууж, бүтэн өгүүлбэрээр хүүрнэн яриулна.\nБагшийн чиглүүлэх асуулт:\n1. Энэ зураг дээр юу харагдаж байна? Бүтэн өгүүлбэрээр хэлээрэй.\n2. Морь ямар өнгөтэй, юу хийж байна вэ?\n3. Энэ зургийг хараад чамд ямар санагдаж байна? Яагаад?\n4. Өчигдөр гэртээ юу хийснээ дэлгэрэнгүй ярьж өгөөч.","learner":"- Уран зургийг ажиглаж, \"Энэ зурагт ... байна\" гэж бүтэн өгүүлбэрээр хэлнэ.\n- Шинж чанарын үгийн картаас сонгож, 3-4 үгтэй өгүүлбэр зохионо.\n- Өгүүлбэрийн бүдүүвчийг дагаж өгүүлбэрээ дэлгэрүүлнэ.\n- Микрофон тоглоом барьж, өчигдөр болсон үйл явдлаа найзууддаа ярина."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Урлагийн буланд баримлуудыг байрлуулж ажиглана.","learner":"- Урлагийн буланд баримлуудыг эргүүлж харж, юуг дүрсэлснийг нэрлэнэ.\n- Найздаа баримлын хэлбэр, өнгө, хэмжээг 2-3 өгүүлбэрээр тайлбарлана."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Зурагт ном уншиж, хүүхдүүдээр зургийг дэлгэрэнгүй тайлбарлуулна.","learner":"- Номын зургийг анхааралтай харж, юу болж байгааг ярина.\n- Багшийн асуултад \"Энд ... байна, тэр ... хийж байна\" гэж дэлгэрэнгүй хариулна.\n- Хамгийн их таалагдсан зургаа сонгож, яагаад таалагдсанаа хэлнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Хэл ярианы төв: \"Сурвалжлагч\": тоглоомон микрофон, уран зургийн хуулбар бэлтгэнэ.\n- Хосоороо ярилцлага хийх дарааллыг үзүүлнэ.\nУрлагийн төв: Уран зургийг харж өөрийн зургийг зурах. Будаг, бийр, цаас бэлтгэнэ.\nНомын төв: Уран зурагт зурагт номуудыг дэлгэж тавина.\n- \"Хамгийн гоё зургаа сонгоод найздаа тайлбарлаарай\" гэж урина.\nБарилгын төв: Зургийн дагуу \"Монгол гэр\", \"хот\" барих загвар зураг байрлуулна.","learner":"Хэл ярианы төв: Микрофон барьж найзаасаа \"Энэ зураг дээр юу байна?\" гэж асууна.\n- Найзынхаа асуултад шинж чанарын үг ашиглан дэлгэрэнгүй хариулна.\nУрлагийн төв: Зураг зурж, түүнд юу дүрсэлснээ 2-3 өгүүлбэрээр тайлбарлана.\nНомын төв: Дуртай зургаа сонгож, юу харагдаж байгааг дэлгэрэнгүй ярина.\nБарилгын төв: Блокоор барилга барьж, \"Миний гэр том, цагаан, дугуй хэлбэртэй\" гэх мэтээр тодорхойлж ярина."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 1 (2). Хөдөлмөрийн үйл ажиллагаа: Цэцэрлэгийн талбай дахь том хог, хаягдлыг цэвэрлэх\nЗорилго: Хамтран ажиллах, бие биедээ туслах чадварыг хөгжүүлэх.\nЯвц:\n- Хүүхдүүдэд бээлий, хогийн уут өгнө.\n- Талбайд байгаа том хог, хаягдлыг харах үед авч цуглуулж, саванд хийхийг зааж өгнө.\n- Талбайг цэвэрхэн байлгах, бие биедээ тусалж хамтран ажиллахыг чиглүүлнэ.","learner":"- Бээлийгээ өмсөж, талбайгаас том хог, хаягдлыг цуглуулна.\n- Цуглуулсан хогоо уутанд, саванд хийнэ.\n- Найзтайгаа хамтран уутаа барьж, бие биедээ тусална.\n- Цэвэрхэн болсон талбайг харж, сэтгэгдлээ хэлнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Өгүүлбэрийг уртасгая»\nЗорилго: Үгийг оновчтой сонгож, дэлгэрэнгүй өгүүлбэр зохиох.\nХэрэглэгдэхүүн: Зургийн карт (морь, гэр, нар), шинж чанарын үгийн карт.\nЯвц:\n1. Багш зургийн карт үзүүлж «Морь байна» гэж богино өгүүлбэр хэлнэ.\n2. Эхний хүүхэд нэг үг нэмнэ: «Хүрэн морь байна».\n3. Дараагийн хүүхэд дахин нэг үг нэмнэ: «Хүрэн морь тал дээр байна».\n4. Өгүүлбэр 6–7 үгтэй болтол үргэлжлүүлнэ.\n5. Эцэст нь бүгд хамтдаа урт өгүүлбэрийг давтана.\nДүрэм: Өмнөх хүүхдийн хэлснийг давтаад, нэг л үг нэмнэ; ээлжээ хүлээнэ.\nДүгнэлт: «Хамгийн урт өгүүлбэр ямар болов?» гэж давтаж, шинэ үгсийг сануулна.","learner":"- Найзынхаа хэлсэн өгүүлбэрийг анхааралтай сонсоно.\n- Өгүүлбэрийг давтаж, өнгө, хэмжээ, үйлдлийн нэг үг нэмнэ.\n- Шинж чанарын үгийн картаас тохирох үг сонгоно.\n- Урт өгүүлбэрийг бүгдтэй хамт давтан хэлнэ."}]},"2026-11-04":{"method":"Төсөлд суурилсан арга","link":"НСХ3.3в. Үйл ажиллагаанд тодорхой үүрэг хүлээж оролцдог болно.","competence":"Харилцах (мэдсэн зүйлээ бусадтай ярилцах), хамтран ажиллах (үүргээ ойлгон биелүүлэх), ажил мэргэжлийн чиг баримжаа","materials":"Гэр бүлийн зураг (гэрээс авчирсан), ажил мэргэжлийн зурагт карт (эмч, багш, гал сөнөөгч, жолооч, тогооч), дүрд тоглох багц (эмчийн цүнх, багшийн самбар, тогоочийн малгай), \"Гэрийн ажил\" үүргийн самбар, шүүр, тоосны алчуур","criteria":"Өөрийн гэр бүлээ танилцуулдаг. Ойр орчны хүмүүсийн ажил, мэргэжлийн нэр, хийдэг зүйлийг ялгадаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, гэр бүлийнхээ зургийг үзүүлэхийг урина.","learner":"- Гэрээс авчирсан гэр бүлийн зургаа үзүүлнэ.\n- Зураг дээрх гишүүдээ \"Энэ миний аав, энэ миний эмээ\" гэж нэрлэнэ.\n- Гэр бүлийн гишүүдээ хуруугаараа тоолж хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Гэр бүлээ танилцуулах: Гэр бүлийн зургаа үзүүлж, \"Танай гэрт хэн хэн байдаг вэ? Гэртээ хэн юу хийдэг вэ?\" гэж ярилцуулна.\n- Ажил мэргэжил ялгах: Мэргэжлийн карт, багаж хэрэгслийг үзүүлж, \"Үүнийг хэн хэрэглэдэг вэ? Тэр хүн юу хийдэг вэ?\" гэж асууна.\n- Мэргэжлийн дүрд тоглох: Эмч, багш, тогоочийн дүрд тоглох багцыг санал болгоно.\n- Гэрийн ажилд оролцох: Тоглоом хураах, тоос арчих, хувцас эвхэх үүргийг самбарт тэмдэглэж хуваарилна.\nБагшийн чиглүүлэх асуулт:\n1. Танай гэрт хэн хэн байдаг вэ?\n2. Аав, ээж чинь ямар ажил хийдэг вэ? Ямар багаж хэрэглэдэг вэ?\n3. Чагнуурыг хэн хэрэглэдэг вэ? Тогоочийн малгайг хэн өмсдөг вэ?\n4. Чи гэртээ ямар ажилд тусалдаг вэ?","learner":"- Гэр бүлийн зургаа үзүүлж, \"Манай гэрт ... байдаг. Ээж маань ... ажил хийдэг\" гэж танилцуулна.\n- Багаж хэрэгслийг мэргэжлийн карттай нь тааруулж, тухайн хүн юу хийдгийг хэлнэ.\n- Сонгосон мэргэжлийн дүрд орж тоглоно.\n- Гэртээ тусалдаг ажлаа нэрлэж, ангидаа тоглоом хураах, тоос арчих үүрэг хүлээж гүйцэтгэнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Дүрт тоглоомын буланд мэргэжлийн хувцас, хэрэгсэл байрлуулна.","learner":"- Мэргэжлийн хувцас өмсөж, эмч, тогооч, барилгачны дүрд тоглоно.\n- Дүрийнхээ ажлыг үйлдлээр үзүүлж, найзтайгаа харилцана."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – хоёр дахь уншлага (2): «Бяцхан туслагч Сараа» (Төлөвлөгөөний хуудсыг 11.02-ны төлөвлөлтийн дараа үзнэ үү.)\n- Эргэн санах: «Номд Сараагийн гэр бүлийн тухай гардгийг санаж байгаа биз. Түүний гэрт хэн хэн байдаг вэ?»\n- Түр зогсож асуух: «Эмээ нь гэртээ юу хийдэг вэ?»\n- Уншсаны дараа: «Хэрвээ чи Сараа байсан бол юугаар туслах байсан бэ?»\n- Дүрд тоглох: нэг хүүхэд Сараа болж ширээ засах, бусад нь гэр бүлийн гишүүд болох.","learner":"- Номын эхлэл, өрнөл, төгсгөлд юу болсныг санаж хариулна.\n- Түр зогсох үед нээлттэй асуултад \"Би ... гэж бодож байна, учир нь ...\" гэж санал бодлоо илэрхийлнэ.\n- Шинэ үгсийг биеэрээ, үйлдлээр үзүүлнэ.\n- Номын дүрд тоглож, дүрийнхээ хэлсэн үгийг давтана.\n- Номын зургаас амьтан, хүн, эд зүйлсийг тоолж хэлнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: \"Миний гэр бүл\" зураг. Хүн бүрийг зурж, хажууд нь ажлынх нь тэмдэг зурахыг санал болгоно.\nДүрт тоглоомын төв: Эмч, тогооч, барилгачин, жолоочийн хувцас, хэрэгсэл байрлуулна.\n- Хүүхдүүд мэргэжлээ сонгож, ажлаа үзүүлэхийг чиглүүлнэ.\nМатематикийн төв: Гэр бүлийн гишүүдийн дүрс (2-5) ба тооны картыг тааруулах даалгавар.\nХэл ярианы төв: \"Мэргэжлийн хэрэгсэл\" карт: хэрэгслийг мэргэжилтэй нь тааруулах.","learner":"Урлагийн төв: Гэр бүлийн гишүүдээ зурж, нэрлэнэ.\n- Хүн бүрийн хажууд ажлынх нь тэмдгийг (машин, чагнуур) зурна.\nДүрт тоглоомын төв: Мэргэжлээ сонгож хувцаслана.\n- Мэргэжлийнхээ ажлыг үйлдлээр үзүүлж, найзтайгаа харилцана.\nМатематикийн төв: Гэр бүлийн дүрсийг тоолж, тохирох тооны картыг тавина.\nХэл ярианы төв: Хэрэгсэл ба мэргэжлийг тааруулж, \"Чагнуурыг эмч хэрэглэдэг\" гэж хэлнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 1 (3). Хөдөлгөөнт тоглоом: «Түргэн тусламж ирлээ»\nЗорилго: Хүүхдэд түргэн тусламжийн үүргийг ойлгуулах, анхаарал, хурд, хамтын ажиллагааг хөгжүүлэх.\nЯвц:\n- Хүүхдүүдийг 2 багт хуваана. Нэг баг нь түргэний машин, нөгөө хэсэг нь энгийн суудлын машин болно.\n- 2 баг талбайн 2 хэсэгт эгнээ болон зогсоно.\n- Багшийн дохиогоор эсрэг талын зогсоол руу гүйнэ. Энэ явцад өмнөөс ирэх хүүхдүүдтэй мөргөлдөхгүй зөрөн гүйж, бараа ээлжинэ.\n- Болгоомжтой гүйхийг сануулна.\nДүрэм: мөргөлдөхгүй, болгоомжтой гүйх; замын заагч шугам, конусны дагуу гүйх; багшийн дохиог анхааралтай сонсож, дагаж мөрдөх.","learner":"- Багтаа хуваагдаж, түргэний машин эсвэл энгийн машины дүрд орно.\n- Багшийн дохиог анхааралтай сонсоод эсрэг талын зогсоол руу гүйнэ.\n- Мөргөлдөхгүй, болгоомжтой, замын заагч шугам, конусны дагуу гүйнэ.\n- Багийнхаа тэмдэглэсэн зогсоолд хамгийн түрүүлж очихыг хичээнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Мэргэжлээ таа»\nЗорилго: Ажил мэргэжлийг үйлдлээр дүрслэх, таньж нэрлэх.\nХэрэглэгдэхүүн: Мэргэжлийн зурагт карт (эмч, тогооч, жолооч, багш, барилгачин), малгай.\nЯвц:\n1. Нэг хүүхэд нүүрээ харуулалгүй картаас сугална.\n2. Тухайн мэргэжлийн хүний ажлыг үг хэлэлгүйгээр дүрсэлнэ (жолооч жолоо барих гэх мэт).\n3. Бусад хүүхдүүд тааж, «Чи эмч үү?» гэж асууна.\n4. Зөв таасан хүүхэд дараагийн удаа дүрсэлнэ.\n5. Тоглоомын төгсгөлд «Энэ мэргэжилтэн бидэнд яаж тусалдаг вэ?» гэж ярилцана.\nДүрэм: Дүрсэлж байхдаа ярихгүй; таахдаа гараа өргөнө.\nДүгнэлт: Таасан мэргэжлүүдээ дахин нэрлэж, гэртээ хүлээсэн үүргээ сануулна.","learner":"- Картаас мэргэжил сугалж, үг хэлэлгүй үйлдлээр дүрсэлнэ.\n- Найзынхаа дүрсэлсэн мэргэжлийг ажиглаж, гараа өргөөд таана.\n- Таасан мэргэжлийн хүн юу хийдгийг тайлбарлана.\n- Ээлжээ хүлээж, найзуудаа урамшуулна."}]},"2026-11-05":{"method":"Тоглоомонд суурилсан арга","link":"ЗУ3.2в. Бүтээлээ толбо, дардсаар чимэглэнэ.","competence":"Шүүн тунгаах (аливаа зүйлийг олон талаас нь харж тунгаах), бүтээлчээр сэтгэх, зүй тогтол үүсгэх, дардсаар чимэглэх","materials":"Өнгө, дүрсний давтамжийн загвар бүхий карт, өнгийн шоо, сувс, хөөсөн дардас (дугуй, гурвалжин), будаг, цаасан зургийн жааз","criteria":"Өнгө, хэлбэр, хэмжээгээр (улаан улаан-шар шар; улаан дугуй, хөх дөрвөлжин, улаан дугуй) зүй тогтлыг үргэлжлүүлдэг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Алга ташаад – өвдгөө цохино\" хэмнэлийн зүй тогтлыг дуурайлгана.","learner":"- \"Алга таш – өвдгөө цохи\" хөдөлгөөнийг багшийг дагаж давтана.\n- Хөдөлгөөний дарааллыг санаж, өөрөө үргэлжлүүлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Ажиглах: \"Улаан улаан-шар шар-улаан улаан\" шоог дараалан тавьж, \"Дараа нь аль нь ирэх вэ?\" гэж асууна.\n- Картаар үргэлжлүүлэх: Улаан дугуй, шар гурвалжин, хөх дөрвөлжин картын дарааллыг гүйцээлгэнэ.\n- Хөдөлгөөний зүй тогтол: \"Үсрэх – алга таших – үсрэх...\" дарааллыг хүүхдүүдээр ээлжлэн давтуулна.\n- Жааз чимэглэх: Цаасан жааз дээр хоёр өнгийн дардсаар зүй тогтолтой хээ гаргуулна.\nБагшийн чиглүүлэх асуулт:\n1. Улаан, улаан, шар, шар... дараа нь аль нь ирэх вэ?\n2. Энэ эгнээнд юу давтагдаж байна вэ?\n3. Найз чинь үсэрсэн, чи алга ташсан бол дараагийн хүүхэд юу хийх вэ?\n4. Жаазаа ямар дарааллаар чимэглэх вэ?","learner":"- Шоо, дүрсний дарааллыг ажиглаж, дараагийнхыг нэрлэж тавина.\n- Өнгө, хэлбэрийн картаар зүй тогтлыг үргэлжлүүлнэ.\n- Хөдөлгөөний зүй тогтлыг дарааллаар нь давтан гүйцэтгэнэ.\n- Хоёр өнгийн дардсаар жаазаа зүй тогтолтой чимэглэж, дарааллаа найздаа тайлбарлана."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Сувсны буланд хэлхээ хийх орчин бүрдүүлнэ.","learner":"- Сувсны буланд өнгөт сувсыг зүй тогтолтойгоор хэлхэж бугуйвч хийнэ.\n- Хэлхсэн бугуйвчныхаа зүй тогтлыг найздаа тайлбарлана."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Давталттай үлгэр (\"Манжин\") уншиж, давтагдах хэсгийг олуулна.","learner":"- \"Манжин\" үлгэрийг сонсож, давтагдах хэсгийг багштай хамт хэлнэ.\n- Үлгэрт хэн хэн дараалан ирснийг дарааллаар нь нэрлэнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Математикийн төв: Зүй тогтлын карт (өнгө, дүрс), шоо, дүрс бэлтгэнэ.\n- Эхлээд энгийн (АБАБ), дараа нь нийлмэл (ААББ) зүй тогтол санал болгоно.\nУрлагийн төв: Цаасан тууз, хөвөн, хөөсөн дардас, будаг бэлтгэж, зүй тогтолтой бүс чимэглэхийг үзүүлнэ.\nСувс, гарын нарийн хөдөлгөөний төв: Өнгөт сувс, утас бэлтгэж, бугуйвч хэлхэхийг санал болгоно.\nХөгжмийн төв: Бөмбөр, хонхоор \"тог-тог-дин\" гэх мэт хэмнэлийн зүй тогтол тоглуулна.","learner":"Математикийн төв: Карт дээрх зүй тогтлыг шоогоор үргэлжлүүлнэ.\n- Өөрөө шинэ зүй тогтол зохиож, найздаа үргэлжлүүлүүлнэ.\nУрлагийн төв: Дардсаар зүй тогтолтой хээ дарж, бүсээ чимэглэнэ.\n- Хэрэглэсэн дарааллаа найздаа тайлбарлана.\nСувс, гарын нарийн хөдөлгөөний төв: Сувсыг зүй тогтолтойгоор хэлхэж бугуйвч хийнэ.\nХөгжмийн төв: Багшийн хэмнэлийг давтаж, өөрөө шинэ хэмнэл зохионо."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 2 (1). Ажиглалт: Улирлын өөрчлөлтийг ажиглах\nЗорилго: Өвлийн эхэн үеийн байгалийн өөрчлөлтийг ажиглаж харьцуулах, цаг агаарын өөрчлөлт нь ургамалд нөлөөлдөг талаар ойлголттой болох.\nЯвц:\n- Гадаа гарч орчны өөрчлөлтийг ажиглана.\n- Цас, мөс, хяруу, хүйтэн агаарын тухай ярилцана.\n- Өдөр богиносож, шөнө уртасч байгааг ойлгуулна.\n- Цас модны үндсийг хамгаалдаг тухай тайлбарлана.\n- Оньсого: «Гэргүй, хөлгүй мэртлээ цонхон дээр зураг зурна» (Хяруу).","learner":"- Орчноо ажиглаж, намраас юу өөрчлөгдсөнийг (цас, мөс, нүцгэн мод) нэрлэнэ.\n- Цас, хяруу, мөсийг ажиглаж, ялгааг нь хэлнэ.\n- Өдөр богиносож байгааг «Орой эрт харанхуй болдог» гэж өөрийн туршлагаар тайлбарлана.\n- Оньсогыг сонсож тааварлана."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Хүний гинж»\nЗорилго: Зүй тогтлыг ажиглаж, биеэрээ үргэлжлүүлэх.\nХэрэглэгдэхүүн: Өнгөт малгай эсвэл тууз (2 өнгө).\nЯвц:\n1. Багш эхний 4 хүүхдийг «зогсох – суух – зогсох – суух» байрлалд оруулна.\n2. «Дараагийн хүн ямар байрлалд орох вэ?» гэж асууж, хүүхдүүдээр гинжийг үргэлжлүүлүүлнэ.\n3. Дараа нь «улаан тууз – цэнхэр тууз» өнгөний зүй тогтол гаргуулна.\n4. Нийлмэл зүй тогтол (зогсох – зогсох – суух) санал болгоно.\n5. Сүүлд хүүхдүүд өөрсдөө зүй тогтол зохиож, бусад нь таана.\nДүрэм: Байраа сонгохоосоо өмнө эгнээг харж бодно; түлхэлцэхгүй.\nДүгнэлт: «Бид юу давтсан бэ?» гэж асууж, долоо хоногийг дүгнэнэ.","learner":"- Эгнээг ажиглаж, давтагдаж буй зүйлийг нэрлэнэ.\n- Дараалалдаа тохирох байрлалыг (зогсох, суух) сонгож орно.\n- Найзуудтайгаа хамт шинэ зүй тогтол зохионо.\n- Найзынхаа гаргасан зүй тогтлыг тааж хэлнэ."}]},"2026-11-06":{"method":"Шинжлэн судлах арга","link":"БНО3.1г. Цаг агаарын байдлыг зураг, тэмдэг ашиглан илэрхийлж, тохирсон хувцас болон хийх үйл ажиллагаагаа сонгож тайлбарлана.","competence":"Бүтээлчээр сэтгэх (төсөөллөөрөө зурах, санаа бодлоо илэрхийлэх), цаг агаар ажиглах, тэмдгээр илэрхийлэх","materials":"Цаг агаарын тэмдгийн карт (нар, үүл, цас, салхи), \"Цаг агаарын хуанли\", зургийн цаас, өнгийн харандаа, лав өнгө, усан будаг, бийр, цагаан гуаш","criteria":"Хүн, амьтны дүр, эд юмсын хэлбэрийг зөв илэрхийлдэг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, цонхоор харж өнөөдрийн цаг агаарыг ажиглуулна.\n- Цаг агаарын хуанлид тохирох тэмдгийг байрлуулна.","learner":"- Цонхоор харж өнөөдрийн цаг агаарыг (нартай, үүлтэй, цастай) хэлнэ.\n- Цаг агаарын хуанлид тохирох тэмдгийг өөрөө сонгож байрлуулна."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Ажиглаж ярилцах: Цонхоор гадаа ажиглуулж, цаг агаарын тэмдгийг хуанлид тэмдэглээд \"Цас ороход манай гудамж ямар болдог вэ?\" гэж ярилцана.\n- Зураасаар зохиомжлох: Шулуун, муруй, тахир, долгион зураасаар байшин, гудамж, цасан ширхэгийг хэрхэн зурж болохыг үзүүлнэ.\n- Хэрэгслээ сонгох: Харандаа, лав өнгө, будгаас өөрт тохирохыг бие даан сонгуулна.\n- Зурах: \"Миний цастай өдөр\" сэдвээр гэр, гудамж, хүмүүсийг өөрийн төсөөллөөр зохиомжлон зуруулна.\nБагшийн чиглүүлэх асуулт:\n1. Өнөөдөр гадаа ямар цаг агаартай байна вэ? Аль тэмдгийг сонгох вэ?\n2. Цас ороход манай гудамж ямар болдог вэ?\n3. Нүдээ аниад цастай өдрийг төсөөлөхөд юу харагдаж байна?\n4. Чиний зурагт юу байгаа вэ? Яагаад ингэж зурсан бэ?","learner":"- Гадаа ажиглаж, өнөөдрийн цаг агаарын тэмдгийг хуанлид наана.\n- Зурах хэрэгслээ өөрөө сонгоно.\n- Зураасны төрлүүдийг ашиглан гэр, гудамж, цастай өдрийг төсөөллөөрөө зохиомжлон зурна.\n- Зурагтаа хүн, амьтан, эд юмсын хэлбэрийг тодорхой гаргаж, зургаа найздаа тайлбарлана."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Дүрт тоглоомын буланд улирлын хувцас байрлуулна.","learner":"- Дүрт тоглоомын буланд цаг агаарт тохирох хувцас сонгож өмсөнө.\n- \"Өнөөдөр хүйтэн учраас би малгай өмсөнө\" гэж тайлбарлана."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – гурав дахь уншлага (3): «Бяцхан туслагч Сараа» (Төлөвлөгөөний хуудсыг 11.02-ны төлөвлөлтийн дараа үзнэ үү.)\n- Уншихын өмнө: номын нэрийг хүүхдүүдээр хэлүүлж, зургийг заан ярилцана.\n- Уншиж байхдаа: зургийг заан хүүхдүүдээр үйл явдлыг яриулна.\n- Уншсаны дараа: шинэ үгсээр өгүүлбэр зохиолгож, номтой холбоотой бүтээл хийнэ.","learner":"- Номын нэр, зураачийг өөрөө хэлнэ.\n- Зургийг харж, номын үйл явдлыг дарааллаар нь өөрийн үгээр ярина.\n- \"Яагаад?\" гэсэн асуултад учир шалтгааныг холбон тайлбарлана.\n- Номд гарсан шинэ үгсээр өгүүлбэр зохиож хэлнэ.\n- Номтой холбоотой зураг зурах, бүтээл хийж, найздаа танилцуулна."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: Хөх цаас, цагаан гуаш, хөвөн бэлтгэнэ.\n- \"Цастай өдөр\" зургийг өөрийн төсөөллөөр зурахыг дэмжинэ.\nБайгаль шинжлэлийн төв: Цаг агаарын тэмдгийн карт ба хувцасны зургийг тааруулах даалгавар.\nДүрт тоглоомын төв: \"Цаг агаарын мэдээ\": хөтлөгчийн ширээ, тэмдгийн карт, газрын зураг байрлуулна.\nХэл ярианы төв: Улирлын зурагт карт: намар, өвлийг харьцуулах.","learner":"Урлагийн төв: Хөх цаасан дээр цагаан гуашаар цас, цасан хүн зурна.\n- Зургаа найздаа тайлбарлана.\nБайгаль шинжлэлийн төв: Цаг агаарын тэмдэг бүрт тохирох хувцасны зургийг тааруулж, шалтгааныг хэлнэ.\nДүрт тоглоомын төв: Хөтлөгч болж \"Маргааш цас орно, дулаан хувцаслаарай\" гэж мэдээ уншина.\nХэл ярианы төв: Намар, өвлийн ялгааг \"Намар навч унадаг, өвөл цас ордог\" гэж хэлнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 2 (2). Хөдөлмөрийн үйл ажиллагаа: Модны ёроолыг цасаар манах\nЗорилго: Амьд байгаль, мод, ургамлыг хайрлах, хамтран ажиллах дадалтай болох.\nЯвц:\n- Модны үндэс орчмын цасыг ажиглана.\n- Ойр орчмын цасыг бөөгнүүлж модны ёроолыг манана.\n- Хэрэглэсэн багажаа цэвэрлэж байранд нь хураана.\n- «Цас бол модны үндсийг дулаалах хөнжил юм» гэж тайлбарлана.","learner":"- Модны ёроол орчмын цасыг ажиглана.\n- Жижиг хүрзээр ойр орчмын цасыг цуглуулж модны ёроолд овоолно.\n- Найзуудтайгаа хамтран ажиллаж, хүрзээ ээлжилж хэрэглэнэ.\n- Ажлын дараа багажаа цэвэрлэж байранд нь хураана."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Цаг агаар таа»\nЗорилго: Цаг агаарын үзэгдлийг хөдөлгөөнөөр дүрслэх, таньж нэрлэх, тохирох хувцсаа хэлэх.\nХэрэглэгдэхүүн: Цаг агаарын тэмдгийн карт (нар, үүл, цас, салхи, бороо), хөгжим.\nЯвц:\n1. Багш цаг агаарын нэг үзэгдлийг хөдөлгөөнөөр үзүүлнэ (цас – гараа зөөлөн доош буулгах).\n2. Хүүхдүүд тааж нэрлээд, тэмдгийн картыг олж өргөнө.\n3. Хүүхдүүд ээлжээр дүрсэлж, бусад нь таана.\n4. Багш картыг өргөхөд бүгд тэр үзэгдлийг хөдөлгөөнөөр дүрсэлнэ (салхи – эргэлдэх).\n5. «Ийм цаг агаартай үед юу өмсөх вэ?» гэж асууна.\nДүрэм: Хөдөлгөөнөө зайтай хийнэ; таахдаа гар өргөнө.\nДүгнэлт: Долоо хоногийн бүтээлийг үзэж, хүүхэд бүр нэг сэтгэгдэл хэлж дүгнэнэ.","learner":"- Багшийн хөдөлгөөнийг ажиглаж, цаг агаарыг тааж нэрлэнэ.\n- Тохирох тэмдгийн картыг олж өргөнө.\n- Өөрөө нэг үзэгдлийг хөдөлгөөнөөр дүрсэлнэ.\n- Тухайн цаг агаарт тохирох хувцсаа хэлнэ."}]},"2026-11-09":{"method":"Зохиолд суурилсан арга","link":"БНО3.1а. Амьтдын амьдрах орчныг ялган таньж, тэднийг хамгаалах аргыг нэрлэнэ.","competence":"Нийгэм, сэтгэл хөдлөлийн хөгжил (бусдын таагүй сэтгэл хөдлөлийг ойлгох), энэрэх, хамтран ажиллах, амьтдыг хамгаалах","materials":"\"Гэргүй болсон шувуу\" өгүүлэг (эсвэл тохирох зурагт ном), нөхцөл байдлын зурагт карт, эелдэг үгийн карт (найзлах, нөхөрлөх, эелдэг байх, хуваалцах, хамтрах), амьтдын зурагт карт, хуванцар сав, үр тариа","criteria":"Алга болгосон тоглоомоо олсон учраас баярласан, гэрээ санасан учраас гунигласан гэх зэргээр бусдын сэтгэл хөдлөлийг үйл явдал, нөхцөл байдалтай холбож тайлбарлаж энэрдэг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Хүйтэн болоход амьтдад юу хэцүү байдаг вэ?\" гэж асууна.","learner":"- Хүйтэн болоход амьтдад юу хэцүү байдгийг өөрийн бодлоор хэлнэ.\n- Мэддэг өвөлждөг амьтдаа нэрлэнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Өгүүлэг ба түлхүүр асуулт: \"Гэргүй болсон шувуу\" өгүүлгийг уншиж, \"Сайхан сэтгэл гэж юу вэ?\", \"Хайр гэж юу вэ?\" гэсэн түлхүүр асуултаар ярилцана.\n- Шалтгааныг холбох: \"Тоглоомоо гээсэн найз\", \"Гэрээ санасан найз\", \"Унасан найз\" гэсэн нөхцөл байдлын картыг үзүүлж, сэтгэл хөдлөлийг шалтгаантай нь холбуулна.\n- Эелдэг үгийн карт: Найзлах, нөхөрлөх, эелдэг байх, хуваалцах, хамтрах гэсэн картуудын утгыг танилцуулна.\n- Энэрэх үйлдэл: \"Бид шувуунд яаж туслах вэ?\" гэж ярилцаж, шувууны тэжээлийн сав хамтдаа хийнэ.\nБагшийн чиглүүлэх асуулт:\n1. Шувуу яагаад гунигтай байна вэ?\n2. Найз чинь тоглоомоо гээвэл ямар санагдах вэ? Олчихвол ямар санагдах вэ?\n3. Сайхан сэтгэлтэй хүн юу хийдэг вэ?\n4. Бид шувуунд, гунигтай найздаа яаж тусалж болох вэ?","learner":"- Өгүүлгийг анхааралтай сонсож, шувуу яагаад гунигтай байгааг \"... учраас гунигтай байна\" гэж тайлбарлана.\n- Нөхцөл байдлын картаас найзын сэтгэл хөдлөлийг нэрлэж, шалтгааныг нь хэлнэ.\n- Эелдэг үгийн картыг таньж, \"Би найздаа ... гэж хэлнэ\" гэж хэрэглэнэ.\n- \"Би шувуунд ... хийж тусална\" гэж санаа гаргаж, тэжээлийн сав хийх ажилд найзуудтайгаа хамт оролцоно."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Тоглох үед найз нь гунигтай байвал хүүхдүүд хэрхэн хандаж буйг ажиглана.","learner":"- Тоглох үед гунигтай найзаа анзаарч, \"Чамд юу болсон бэ?\" гэж асууна.\n- Найзаа тайтгаруулах үг хэлж, хамт тоглохыг урина."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – эхний уншлага (1): «Заан оготно хоёр» (Чанга уншлагын төлөвлөгөөний хуудсыг үзнэ үү.)\n- Номын нэр, хавтас, зохиолч, зураачийг танилцуулж, хэмнэлийг алдагдуулахгүй уншина.\n- Түр зогсож асуух: «Заан нүхийг нь усаар шүршихэд оготны гэрт юу болсон бэ? Оготно ямар санагдсан бол?»\n- Шинэ үг: «Шүршиж – хоншоороор ус цацах»\n- Уншсаны дараа: «Оготно зааныг юу гэж гуйсан бэ? Заан түүний гуйлтыг сонссон уу?»","learner":"- Номын нэр, хавтасны зургийг харж, ном юуны тухай байхыг таамаглаж хэлнэ.\n- Багшийн уншихыг анхааралтай, тайван сонсоно.\n- Түр зогсох үед \"Дараа нь юу болох бол?\" гэсэн асуултад өөрийн таамаглалыг хэлнэ.\n- Шинэ үгийн утгыг сонсож, багштай хамт давтан хэлнэ.\n- Уншсаны дараа номын гол дүрүүдийг нэрлэж, хуруугаараа тоолно."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: Шувууны үүр зурах, будах. Хүрэн, шар өнгийн харандаа, цаас бэлтгэнэ.\nБайгаль шинжлэлийн төв: Амьтдын зургийг ой, нуур, тал гэсэн дэвсгэрт ангилуулна.\n- \"Энэ амьтан өвөл хаана байдаг вэ?\" гэж асууна.\nДүрт тоглоомын төв: \"Амьтны эмнэлэг\": тоглоомон амьтад, боолт, чагнуур байрлуулна.\nБарилгын төв: Блокоор шувууны байшин барих загвар үзүүлнэ.","learner":"Урлагийн төв: Шувууны үүр, түүнд байгаа шувууг зурж будна.\nБайгаль шинжлэлийн төв: Амьтдыг амьдрах орчинд нь байрлуулна.\n- Өвөл тэд хэрхэн амьдардгийг ярина.\nДүрт тоглоомын төв: Мал эмч болж өвдсөн амьтныг эмчилж, \"Чи удахгүй эдгэрнэ\" гэж тайтгаруулна.\nБарилгын төв: Блокоор шувууны байшин барьж, найздаа танилцуулна."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 2 (3). Хөдөлгөөнт тоглоом: «Богжинд орлоо»\nЗорилго: Хамтран тоглох, хөдөлгөөний чиглэлээ өөрчлөх, бөмбөг шидэх чадвараа нэмэгдүүлэх.\nЯвц:\n- Хоорондоо зайтай хэд хэдэн цагиргийг босоогоор байрлуулна.\n- Цагираг бүрийн харалдаа сагстай бөмбөг (цасан бөмбөг) байрлуулна.\n- Хүүхдүүд цагиргуудыг тойрч гүйнэ.\n- Багш «Богжинд орлоо» гэж хэлэхэд бөмбөгийг авч цагирагт оруулахаар шиднэ.\nДүрэм: хамт гүйх; түлхэхгүй; байр руу гишгэхгүй; аюулгүй зай барина.","learner":"- Цагиргуудыг тойрч гүйнэ.\n- Дохиогоор чиглэлээ өөрчилж, сагснаас бөмбөг авна.\n- Бөмбөгийг цагираг руу онилж шиднэ.\n- Найзтайгаа хамт гүйж, түлхэлгүй, аюулгүй зай барина."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Би танд туслая»\nЗорилго: Бусдын таагүй сэтгэл хөдлөлийн шалтгааныг тайлбарлаж, энэрэх үйлдэл үзүүлэх.\nХэрэглэгдэхүүн: Нөхцөл байдлын зурагт карт (унасан, тоглоом нь эвдэрсэн, даарсан, ганцаараа), хүүхэлдэй.\nЯвц:\n1. Багш картаас нөхцөл байдлыг хүүхэлдэйгээр үзүүлнэ: «Бяцхан баавгай унаад уйлж байна».\n2. «Баавгай яагаад гунигтай байна вэ?» гэж асууна.\n3. Нэг хүүхэд туслагч болж очиж, тайтгаруулах үг хэлж, тусламж үзүүлнэ.\n4. Хүүхдүүд хос болж нэг нь тусламж хэрэгтэй, нөгөө нь туслагч болж дүрд тоглоно.\n5. Дүрээ сольж давтана.\nДүрэм: Найзаа шоолохгүй; эелдэг үг хэрэглэнэ.\nДүгнэлт: Өнөөдөр хэнд, яаж тусалснаа хуваалцаж, шувууны тэжээлийн сав руу харж дүгнэнэ.","learner":"- Хүүхэлдэйн нөхцөл байдлыг ажиглаж, яагаад гунигтайг тайлбарлана.\n- Туслагчийн дүрд «Чамд юу болсон бэ? Би туслах уу?» гэж асууна.\n- Тайтгаруулах үг хэлж, тусламж үзүүлэх үйлдэл хийнэ.\n- Дүрээ сольж, тусламж авахад ямар санагдсанаа хэлнэ."}]},"2026-11-10":{"method":"Шинжлэн судлах арга (давтамж)","link":"НСХ3.1б. Өөрийн дуртай дургүй, чадах чадахгүй зүйлсээ илэрхийлж хэрэгцээгээ тайлбарладаг болно.","competence":"Харилцах (санал бодлоо илэрхийлэх, бусдын санааг ойлгох), хамтран ажиллах (ээлжээ хүлээх), нийгэм, сэтгэл хөдлөлийн хөгжил","materials":"\"Ярианы чулуу\", сэдэвт зурагт карт (тоглоом, хоол, амьтан), \"Би дуртай / Би дургүй\" карт, энгийн туршилтын хэрэгсэл (аяга, цас эсвэл мөс)","criteria":"Ярилцлага, туршилт, дүрд тоглох зэрэгт идэвхтэй оролцож, санаа бодлоо хуваалцдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Ярианы чулуу\"-г барьсан хүүхэд ярих дүрмийг танилцуулна.","learner":"- \"Ярианы чулуу\"-ны дүрмийг сонсож, чулуу барьсан үедээ л ярина.\n- Найзыгаа ярьж байхад сонсож, ээлжээ хүлээнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Тойргийн ярилцлага: \"Ярианы чулуу\" дамжуулан \"Чи юу хийх дуртай вэ? Юунд дургүй вэ?\" сэдвээр ярилцуулна.\n- Энгийн туршилт: Аяганд хийсэн цас (мөс) дулаан өрөөнд юу болохыг таамаглуулж, ажиглан ярилцуулна.\n- Санал бодол: \"Найз чинь ингэж бодож байна, чи юу гэж бодож байна?\" гэж санаачилга гаргахыг дэмжинэ.\n- Эргүүлэн ярих: «Заан оготно хоёр» үлгэрийг өөрийн үгээр ярьж, асуудлыг хэрхэн шийдсэнийг хэлүүлнэ.\nБагшийн чиглүүлэх асуулт:\n1. Чи юу хийх дуртай вэ? Яагаад?\n2. Цас дулаан өрөөнд юу болно гэж бодож байна?\n3. Найзын чинь санал чинийхтэй адилхан уу, өөр үү?\n4. Үлгэрийн баатар асуудлаа яаж шийдсэн бэ? Чи бол яах байсан бэ?","learner":"- Ярианы чулууг барьж, дуртай, дургүй зүйлээ шалтгаантай нь хэлнэ.\n- Туршилтын үр дүнг таамаглаж, ажигласнаа ярина.\n- Найзынхаа санааг сонсож, \"Би ч гэсэн ...\", \"Би өөрөөр бодож байна, учир нь ...\" гэж санал бодлоо илэрхийлнэ.\n- «Заан оготно хоёр» үлгэрийг өөрийн үгээр ярьж, асуудлыг хэрхэн шийдсэнийг хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Тоглох үед хүүхдүүдийн харилцан яриаг ажиглана.","learner":"- Тоглох үедээ найзтайгаа юу тоглохоо ярилцаж тохиролцоно."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Ном уншиж, \"Чи баатрын оронд байсан бол яах байсан бэ?\" гэж асууна.","learner":"- Номын баатрын оронд байвал юу хийхээ өөрийн бодлоор ярина.\n- Найзуудынхаа санааг сонсож, санал нийлж байгаа эсэхээ хэлнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Хэл ярианы төв: Сэдэвт карт (тоглоом, хоол, амьтан) сугалж хосоороо ярилцах.\n- Найзаасаа асуулт асууж, санал бодлоо хэлэхийг чиглүүлнэ.\nДүрт тоглоомын төв: Тоглоомон утас байрлуулж, найзтайгаа \"утсаар\" ярих тоглоом.\nУрлагийн төв: \"Миний дуртай тоглоом\" зураг.\nНомын төв: Хүүхдүүд дуртай номоо сонгож, найздаа санал болгох.","learner":"Хэл ярианы төв: Карт сугалж найзтайгаа тухайн сэдвээр ярилцана.\n- \"Чи юу гэж бодож байна?\" гэж найзаасаа асууна.\nДүрт тоглоомын төв: Утсаар найзтайгаа мэндчилж, юу хийж байгаагаа ярилцана.\nУрлагийн төв: Дуртай тоглоомоо зурж, яагаад дуртайгаа хэлнэ.\nНомын төв: Дуртай номоо найздаа үзүүлж, \"Энэ ном ... учраас таалагддаг\" гэж хэлнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 2 (4). Ганцаарчилсан үйл ажиллагаа: Нэмэлт дэмжлэг шаардлагатай хүүхэдтэй ажиллах\nЗорилго: Хөдөлгөөнд болгоомжтой оролцож, тэнцвэр сул, заавар ойлгоход нэмэлт дэмжлэг хэрэгтэй хүүхдэд тайван орчинд туслах.\nЯвц:\n- Зааврыг богино, ойлгомжтой өгнө.\n- Багаар тайван ажиллуулж, хэсэг тайван хүлээлттэй хөдөлгөөнд оролцуулна.\n- Бөмбөгийг ойр зайнаас шидүүлнэ.\n- Гүйж буй үедээ алхахад оролцуулж болно.\n- Амжилт бүрийг урамшуулна: «Чи маш болгоомжтой алхлаа», «Бөмбөгөө зөөлөн шидэж чадлаа».","learner":"- Багшийн богино зааврыг сонсож, алхам алхмаар гүйцэтгэнэ.\n- Ойр зайнаас бөмбөгийг зөөлөн шидэж, барьж авна.\n- Тэнцвэрээ хадгалан болгоомжтой алхана.\n- Амжилтдаа баярлаж, дахин оролдоно."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Санал хураалт»\nЗорилго: Санал бодлоо илэрхийлэх, бусдыг сонсох, олонхийн сонголтыг хүлээн зөвшөөрөх.\nХэрэглэгдэхүүн: 3 тоглоомын зурагт карт, наалт эсвэл товч (санал өгөх).\nЯвц:\n1. Багш 3 тоглоомын картыг ханан дээр наана.\n2. Хүүхэд бүр аль тоглоомд дуртайгаа, яагаад гэдгийг хэлнэ.\n3. Хүүхэд бүр нэг наалтаар дуртай тоглоомынхоо картанд санал өгнө.\n4. Санал бүрийг хамтдаа тоолж, аль нь олон санал авсныг жишнэ.\n5. Ялсан тоглоомыг бүгдээрээ тоглоно.\nДүрэм: Нэг хүн нэг санал; бусдын сонголтыг шүүмжлэхгүй.\nДүгнэлт: «Санал хураах нь яагаад шударга вэ?» гэж ярилцаж дүгнэнэ.","learner":"- Дуртай тоглоомоо сонгож, шалтгаанаа хэлнэ.\n- Нэг наалтаар санал өгнө.\n- Саналыг тоолж, олон, цөөнийг жишнэ.\n- Олонхийн сонгосон тоглоомыг баяртайгаар тоглоно."}]},"2026-11-11":{"method":"Шинжлэн судлах арга","link":"БНО3.1г. Цаг агаарын байдлыг зураг, тэмдэг ашиглан илэрхийлж, тохирсон хувцас болон хийх үйл ажиллагаагаа сонгож тайлбарлана.","competence":"Шүүн тунгаах (шалтгаан, үр дагаврыг тайлбарлах), өөрийгөө хамгаалах, дүрэм мөрдөх","materials":"Цаг агаарын аюултай үзэгдлийн зурагт карт (цасан шуурга, мөндөр, хүчтэй салхи, мөс), \"Цугларах цэг\" тэмдэг, дуут дохио (хонх/шүгэл), \"Аюултай – Аюулгүй\" карт, өвлийн хувцас","criteria":"Цаг агаарын аюулт үзэгдэл тохиолдсон үед насанд хүрэгчдийн зөвлөгөөг дагаж, өөрийгөө хамгаалдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, цаг агаарын хуанлид өнөөдрийн тэмдгийг байрлуулна.","learner":"- Цонхоор харж өнөөдрийн цаг агаарыг хэлнэ.\n- Цаг агаарын хуанлид тэмдэг байрлуулна."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Тайлбарлах: Цасан шуурга, мөс, хүчтэй салхины зургийг үзүүлж, ямар аюултай болохыг ярилцана.\n- Болгоомжлох дүрэм: Мөсөн дээр гүйхгүй, шуургатай үед томчуудгүй гадаа гарахгүй, хөлдсөн гол, нуурын мөсөн дээр гарахгүй байх дүрмийг зурагт үзүүлэн дээр тохиролцоно.\n- Дохионы дадлага: Дуут дохио дуугарахад \"Гүйхгүй, түлхэхгүй, ярихгүй, эргэж буцахгүй\" дүрмээр ширээн доогуур орж, хөлөөс нь барьж тайван хүлээх дадлага хийлгэнэ.\n- \"Цуглараарай\" тоглоом: \"Цугларах цэг\" тэмдгийг таниулж, дохиогоор тэнд цугларах хөдөлгөөнт тоглоом тоглуулна.\nБагшийн чиглүүлэх асуулт:\n1. Гадаа мөс хөлдсөн бол бид яах вэ?\n2. Шуурга шуурахад томчуудгүй гадаа гарвал юу болох вэ?\n3. Дохио дуугарахад бид юу хийх вэ?\n4. \"Цугларах цэг\" тэмдэг юуг заадаг вэ?","learner":"- Цаг агаарын үзэгдлийн зургийг нэрлэж, ямар аюултайг энгийнээр тайлбарлана.\n- Зургийг \"Аюултай\", \"Аюулгүй\" гэж ангилж, учрыг нь хэлнэ.\n- Дохио дуугарахад багшийн зааврыг дагаж ширээн доогуур орж, тайван хүлээнэ.\n- \"Цугларах цэг\" тэмдгийг таньж, дохиогоор тийшээ эгнээгээрээ очно."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Дүрт тоглоомын буланд өвлийн хувцас байрлуулна.","learner":"- Дүрт тоглоомын буланд өвлийн хувцсыг дарааллаар нь өмсөнө.\n- Цаг агаарт тохирох хувцас сонгосноо тайлбарлана."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – хоёр дахь уншлага (2): «Заан оготно хоёр» (Төлөвлөгөөний хуудсыг 11.09-ны төлөвлөлтийн дараа үзнэ үү.)\n- Эргэн санах: (Эхлэл) «Үлгэрийн эхэнд заан өдөр бүр юу хийдэг байсан бэ?» Түр зогсож асуух: «Оготно „Миний орон байрыг битгий сүйтгээч“ гэж гуйсан. Хэн- нэгэн чиний барьсан байшинг нураавал чи түүнд юу гэж хэлэх вэ?»\nУншсаны дараа: «Хэрвээ заан оготны гуйлтыг анх удаа","learner":"Номын эхлэл, өрнөл, төгсгөлд юу болсныг санаж хариулна.\n- Түр зогсох үед нээлттэй асуултад \"Би ... гэж бодож байна, учир нь ...\" гэж санал бодлоо илэрхийлнэ.\n- Шинэ үгсийг биеэрээ, үйлдлээр үзүүлнэ.\nНомын дүрд тоглож, дүрийнхээ хэлсэн үгийг давтана"},{"time":"","name":"","teacher":"- сонссон бол үлгэр яаж төгсөх байсан бэ?»\n- Дүрд тоглох: нэг хүүхэд заан, нөгөө нь оготно болж, заан оготны гуйлтыг сонсож, уучлалт гуйн найзууд болох шинэ төгсгөлийг тоглох.","learner":"- Номын зургаас амьтан, хүн, эд зүйлсийг тоолж хэлнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Байгаль шинжлэлийн төв: Мөс, давс, бүлээн ус бэлтгэнэ.\n- \"Мөсийг юу хурдан хайлуулах вэ?\" туршилтыг чиглүүлнэ.\nУрлагийн төв: Цаг агаарын тэмдэг (нар, үүл, цас, салхи) зурах загвар.\nДүрт тоглоомын төв: Өвлийн хувцас (малгай, ороолт, бээлий) байрлуулна.\nХэл ярианы төв: \"Аюултай – аюулгүй\" зурагт карт ялгах.","learner":"Байгаль шинжлэлийн төв: Мөсөн дээр давс цацаж, бүлээн ус хийж, аль нь хурдан хайлахыг ажиглана.\n- Ажигласнаа найздаа ярина.\nУрлагийн төв: Цаг агаарын тэмдгүүдийг зурж нэрлэнэ.\nДүрт тоглоомын төв: Цаг агаарын картын дагуу хүүхэлдэйг хувцаслана.\nХэл ярианы төв: Картыг ялгаж, \"Мөсөн дээр гүйх нь аюултай\" гэж тайлбарлана."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 3 (1). Ажиглалт: Улиас модыг ажиглах\nЗорилго: Хүүхдүүдийг улиас мод, түүний бүтэц, навчтай танилцуулах.\nЯвц:\n- Улиас модны навч, мөчир, их биеийг ажиглуулна.\n- Багшийн мэдээлэл: Улиас модны их бие нь гөлгөр, саарал ногоон өнгөтэй байдаг. Намар навчнууд ягаан, улаан, шар өнгөөр будагддаг. Навч нь уян хатан, хавтгай ишин дээр тогтдог тул салхи гарахад шуугилдан исгэрэх мэт чимээ гаргадаг.\n- Асуулт: «Улиас модны их бие болон навч нь ямар вэ?», «Модны навч яагаад чичирдэг вэ?»","learner":"- Улиас модны их биеийг гараараа хүрч, гөлгөр эсэхийг мэдэрнэ.\n- Унасан навчийг түүж, өнгө, хэлбэрийг нь ажиглан нэрлэнэ.\n- Мөчир, их бие, навчийг заан нэрлэнэ.\n- Салхинд навч хэрхэн хөдөлж байгааг сонсож, «шуугиж байна» гэж тайлбарлана."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Аюултай юу, аюулгүй юу?»\nЗорилго: Өвлийн аюултай, аюулгүй үйлдлийг ялгах, болгоомжлох дүрмийг бататгах.\nХэрэглэгдэхүүн: Ногоон, улаан тойрог карт (хүүхэд бүрт), нөхцөл байдлын зураг.\nЯвц:\n1. Хүүхэд бүрт ногоон (аюулгүй), улаан (аюултай) карт өгнө.\n2. Багш нөхцөл байдлыг хэлнэ: «Мөсөн дээр гүйх», «Бээлий өмсөх», «Шуурганд гадаа гарах».\n3. Хүүхдүүд тохирох картаа өргөнө.\n4. Улаан карт өргөсөн бол «Юу хийх ёстой вэ?» гэж зөв үйлдлийг хэлүүлнэ.\n5. Сүүлд хүүхдүүд өөрсдөө нөхцөл байдал зохиож асууна.\nДүрэм: Картаа өргөөд хариугаа тайлбарлана; бусдыг сонсоно.\nДүгнэлт: Өвлийн аюулгүй байдлын 3 дүрмийг хамтдаа давтаж дүгнэнэ.","learner":"- Нөхцөл байдлыг сонсож, аюултай, аюулгүйг ялгана.\n- Ногоон эсвэл улаан картаа өргөнө.\n- Аюултай үйлдлийн оронд хийх зөв үйлдлийг хэлнэ.\n- Өөрөө нэг нөхцөл байдал зохиож найздаа асууна."}]},"2026-11-12":{"method":"Тоглоомонд суурилсан арга (давтамж)","link":"ХЭМ3.1г. Алхалт гүйлтийг чиглэл, хурдаа өөрчлөн гүйцэтгэнэ.","competence":"Харилцах (зааврыг сонсож ойлгох), хамтран ажиллах (дүрэм баримтлах), чиглэл, хурдаа өөрчлөн хөдлөх","materials":"Улаан, ногоон бөмбөг, том бөмбөг, хайрцаг, сумтай чиглэлийн карт, туузаар хийсэн зам, конус, бөмбөр (хурдан/удаан хэмнэл)","criteria":"Тоглоом, юмсын өмнө хойно, дээшээ, доошоо хөдөлгөж чиглэл байршлыг хэлдэг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Өмнө, хойно, дээшээ, доошоо\" дасгал хийлгэнэ.","learner":"- \"Өмнө, хойно, дээшээ, доошоо\" гэх үгийн дагуу биеэрээ хөдөлнө.\n- Багшийн хэлсэн чиглэлийг гараараа зааж үзүүлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Байршуулах: \"Улаан бөмбөгийг ширээний өмнө, ногоон бөмбөгийг хайрцгийн хойно тавиарай\" гэх даалгавар өгнө.\n- Чиглэлийн үйлдэл: \"Том бөмбөгийг дээшээ өргөөрэй, доошоо буулгаарай\" гэж чиглэлээ сольж тоглуулна.\n- Чиглэлийн карт ба хурд: Сумтай картын дагуу өмнө, хойш алхуулж, бөмбөрийн хэмнэлээр хурдаа өөрчлүүлнэ.\n- Байршлаа хэлэх: \"Чиний өмнө хэн байна? Хойно чинь хэн байна?\" гэж асууна.\nБагшийн чиглүүлэх асуулт:\n1. Улаан бөмбөг хаана байна вэ?\n2. Бөмбөгөө дээшээ өргөөд, доошоо буулгаарай. Одоо хаана байна?\n3. Чиний өмнө хэн, хойно хэн зогсож байна вэ?\n4. Бөмбөр хурдан цохиход яаж алхах вэ? Удаан цохиход?","learner":"- Бөмбөгийг заасан байршилд тавьж, \"Улаан бөмбөг ширээний өмнө байна\" гэж хэлнэ.\n- Бөмбөгийг дээш өргөж, доош буулгаж, чиглэлээ нэрлэнэ.\n- Сумтай картын дагуу өмнө, хойш алхаж, бөмбөрийн хэмнэлээр хурдаа өөрчилнө.\n- Өөрийн өмнө, хойно хэн зогсож байгааг хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Машины замын тоглоомыг ажиглана.","learner":"- Тоглоомон машиныг замын дагуу заасан чиглэлд явуулна.\n- Машин хаашаа эргэж байгааг тайлбарлана."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Зам заасан ном уншиж, \"Баатар хаашаа эргэсэн бэ?\" гэж асууна.","learner":"- Номын баатар хаашаа явсныг чиглэлийн үгээр хэлнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Математикийн төв: Тоглоом, ширээ, хайрцаг бэлтгэнэ.\n- \"Баавгайг хайрцгийн дээр, туулайг доор тавь\" гэх зааварчилгаа өгнө.\nХөдөлгөөний төв: Туузан зам, сумтай карт, конус байрлуулна.\nБарилгын төв: Тоглоомон машин, замын тэмдэг бэлтгэнэ.\nУрлагийн төв: \"Миний гэрээс цэцэрлэг хүртэлх зам\" зураг.","learner":"Математикийн төв: Зааврын дагуу тоглоомыг дээр, доор, өмнө, хойно байрлуулна.\n- Байршлыг өөрөө хэлж, найздаа заавар өгнө.\nХөдөлгөөний төв: Сумны дагуу туузан замаар алхаж, конусыг тойрно.\nБарилгын төв: Зам барьж, машинаа зүүн, баруун тийш эргүүлэн явуулна.\nУрлагийн төв: Замаа зурж, хаана эргэдгийг ярина."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 3 (2). Хөдөлмөрийн үйл ажиллагаа: Навч шүүрдэх, элс сийрэгжүүлэх\nЗорилго: Хөдөлмөрч зан чанар, хамтарч ажиллах чадварыг төлөвшүүлэх.\nЯвц:\n- Хүүхдүүдийн нэг хэсэг нь талбайн зам дээрх унасан навчийг шүүрдэж цуглуулна.\n- Нөгөө хэсэг нь элсний хайрцгийн элсийг тармуураар сийрэгжүүлнэ.\n- Ажлын дараа багажаа хураалгана.","learner":"- Бүлэгтээ хуваагдаж, нэг хэсэг нь шүүрээр навч цуглуулна.\n- Нөгөө хэсэг нь тармуураар элсийг сийрэгжүүлнэ.\n- Найзтайгаа хамтран ажиллаж, ажлаа дуустал хийнэ.\n- Багажаа цэвэрлэж байранд нь хураана."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Багш юу хэлэв?»\nЗорилго: Чиглэл, байршлын зааврыг анхааралтай сонсож гүйцэтгэх.\nХэрэглэгдэхүүн: Конус, цагираг, зөөлөн тоглоом.\nЯвц:\n1. Багш «Багш хэлэв: гараа дээш өргө!» гэж заавар өгнө.\n2. Хүүхдүүд «Багш хэлэв» гэж эхэлсэн зааврыг л гүйцэтгэнө.\n3. «Цагирагийн өмнө зогс», «Конусын хойно оч», «Тоглоомоо доош тавь» зэрэг байршлын заавар өгнө.\n4. «Багш хэлэв» гэлгүй заавар өгвөл хүүхдүүд хөдлөхгүй.\n5. Сүүлд хүүхэд «багш» болж заавар өгнө.\nДүрэм: Зөвхөн «Багш хэлэв» гэсэн зааврыг гүйцэтгэнэ; алдсан хүн тоглоомоос гарахгүй, дахин оролдоно.\nДүгнэлт: Өнөөдөр сурсан чиглэлийн үгсийг (өмнө, хойно, дээшээ, доошоо) давтаж дүгнэнэ.","learner":"- Зааврыг анхааралтай сонсоно.\n- «Багш хэлэв» гэсэн үед л хөдөлнө.\n- Байршлын дагуу зөв газар очиж зогсоно.\n- «Багш»-ийн дүрд заавар өгч, найзуудаа шалгана."}]},"2026-11-13":{"method":"Төсөлд суурилсан арга","link":"БНО3.1а. Амьтдын амьдрах орчныг ялган таньж, тэднийг хамгаалах аргыг нэрлэнэ.","competence":"Бүтээлчээр сэтгэх (энгийн зүйлсийг хувирган ашиглаж бүтээх), баримал барих, амьдрах орчныг таних","materials":"Баримлын шавар, гурилан зуурмаг (гурил, давс, ус), шүдний чигчлүүр, байгалийн материал (жижиг чулуу, үр, мөчир), амьтдын зураг, амьдрах орчны дэвсгэр (ой, нуур, тал)","criteria":"Хүн, амьтан, эд юмсыг баримлын шавар, элс, гурилан зуурмагаар зохиомжлон барина.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, амьтдын зургийг үзүүлж \"Энэ амьтан хэдэн хэсгээс бүтсэн бэ? (толгой, бие, хөл)\" гэж асууна.","learner":"- Амьтдын зургийг харж толгой, бие, хөл зэрэг хэсгийг нэрлэнэ.\n- Амьтан хэдэн хэсгээс бүтсэнийг тоолно."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Зуурмаг бэлтгэх: Гурил, давс, ус хольж гурилан зуурмагийг хүүхдүүдтэй хамтдаа зуурна.\n- Үзүүлэх: Бөмбөлөг (толгой), зууван (бие), саваа (хөл) хийж нийлүүлэхийг үзүүлнэ.\n- Барих, чимэглэх: Хүүхэд багаж хэрэгслээ бие даан сонгож, дуртай амьтнаа 3 ба түүнээс дээш хэсгээс барьж, байгалийн материалаар чимэглэнэ.\n- Орчинд нь: Бүтээсэн амьтнаа амьдрах орчны дэвсгэрт байрлуулна.\nБагшийн чиглүүлэх асуулт:\n1. Чиний амьтан хэдэн хэсгээс бүтэх вэ?\n2. Толгойг ямар хэлбэртэй хийх вэ? Хөлийг нь?\n3. Энэ амьтан хаана амьдардаг вэ? Аль дэвсгэрт тавих вэ?\n4. Энэ амьтныг яаж хамгаалах вэ?","learner":"- Гурилан зуурмаг бэлтгэхэд оролцож, зуурмагийн шинжийг (зөөлөн, наалдамхай) хэлнэ.\n- Багаж хэрэгслээ өөрөө сонгож, амьтнаа 3 ба түүнээс дээш хэсгээс барина.\n- Үр, мөчир, жижиг чулуугаар амьтнаа чимэглэнэ.\n- Бүтээсэн амьтнаа амьдрах орчинд нь байрлуулж, хэрхэн хамгаалахыг хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Барилгын буланд \"Амьтны хүрээлэн\" байгуулах орчин бүрдүүлнэ.","learner":"- Барилгын буланд блокоор \"Амьтны хүрээлэн\" барина.\n- Баримал амьтдаа хашаанд байрлуулж, найзтайгаа тоглоно."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – гурав дахь уншлага (3): «Заан оготно хоёр» (Төлөвлөгөөний хуудсыг 11.09-ны төлөвлөлтийн дараа үзнэ үү.)\n- Уншихын өмнө: номын нэрийг хүүхдүүдээр хэлүүлж, зургийг заан ярилцана.\n- Уншиж байхдаа: зургийг заан хүүхдүүдээр үйл явдлыг яриулна.\n- Уншсаны дараа: шинэ үгсээр өгүүлбэр зохиолгож, номтой холбоотой бүтээл хийнэ.","learner":"- Номын нэр, зураачийг өөрөө хэлнэ.\n- Зургийг харж, номын үйл явдлыг дарааллаар нь өөрийн үгээр ярина.\n- \"Яагаад?\" гэсэн асуултад учир шалтгааныг холбон тайлбарлана.\n- Номд гарсан шинэ үгсээр өгүүлбэр зохиож хэлнэ.\n- Номтой холбоотой зураг зурах, бүтээл хийж, найздаа танилцуулна."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: Гурилан зуурмаг, шавар, хуванцар хутга бэлтгэнэ.\n- Хүн, эд юмсыг 3-аас дээш хэсгээс барихыг үзүүлнэ.\nБайгаль шинжлэлийн төв: Амьтдын зургийг амьдрах орчноор нь ангилах дэвсгэр.\nБарилгын төв: \"Амьтны хүрээлэн\": блок, хашаа, амьтдын тоглоом.\nМатематикийн төв: Амьтдын баримлыг тоолж, тооны картанд тааруулах.","learner":"Урлагийн төв: Зуурмагаар хүн, эд юмс барина.\n- Бүтээлийнхээ хэсгүүдийг нэрлэнэ.\nБайгаль шинжлэлийн төв: Амьтдыг орчинд нь байрлуулж, хэрхэн хамгаалахыг хэлнэ.\nБарилгын төв: Хүрээлэн барьж, амьтан бүрт тусдаа хашаа хийнэ.\nМатематикийн төв: Амьтдыг тоолж, тохирох тоог тавина."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 3 (3). Хөдөлгөөнт тоглоом: «Бүү унага»\nЗорилго: Бөмбөгийг шулуун гараар арагш болон урагш дамжуулах чадварыг бататгах.\nЯвц:\n- Хүүхдүүдийг 2–3 баг болгон цуваагаар зогсооно. Баг бүрт бөмбөг өгнө.\n- Эхний дохиогоор бөмбөгийг толгой дээгүүрээ арагш нь дамжуулна. Цуваан ард зогссон хүүхэд буцааж урагш нь дамжуулна.\n- Дараагийн удаа хоёр хөлний дундуур урагш, арагш дамжуулна.","learner":"- Багтаа цуваа болж зогсоно.\n- Бөмбөгийг хоёр гараар толгой дээгүүрээ ард байгаа найздаа дамжуулна.\n- Дараа нь хөлнийхөө дундуур бөхийж дамжуулна.\n- Бөмбөгөө унагахгүй байхыг хичээж, багаараа хамтран тоглоно."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Ямар амьтан бэ?»\nЗорилго: Амьтныг шинж, дуу, хөдөлгөөнөөр таних, амьдрах орчныг нэрлэх.\nХэрэглэгдэхүүн: Амьтдын зурагт карт, хүүхдүүдийн хийсэн баримлууд.\nЯвц:\n1. Нэг хүүхэд картаас амьтан сугалж, түүний дуу эсвэл хөдөлгөөнийг дүрсэлнэ.\n2. Бусад нь тааж нэрлэнэ.\n3. Таасан хүүхэд «Энэ амьтан хаана амьдардаг вэ?» гэсэн асуултад хариулна.\n4. Хэдэн тойргийн дараа хүүхдүүд өдөр барьсан баримлаа үзүүлж, тааж нэрлүүлнэ.\n5. «Энэ амьтныг яаж хамгаалах вэ?» гэж асууна.\nДүрэм: Дүрсэлж байгаа хүүхдийг бүү таслан ярь; таахдаа гараа өргө.\nДүгнэлт: Баримлын үзэсгэлэнг үзэж, долоо хоногийг дүгнэнэ.","learner":"- Амьтны дуу, хөдөлгөөнийг дүрсэлнэ.\n- Найзынхаа дүрсэлсэн амьтныг тааж нэрлэнэ.\n- Амьтны амьдрах орчныг хэлнэ.\n- Өөрийн баримлыг үзүүлж, хэдэн хэсгээс бүтсэнийг ярина."}]},"2026-11-16":{"method":"Тоглоомонд суурилсан арга","link":"НСХ3.1а. Сэтгэл хөдлөлөө таатай, таагүй байгааг илэрхийлдэг болно.","competence":"Өөрийгөө хамгаалах, \"Үгүй\", \"Боль\" гэж хэлэх, сэтгэл хөдлөлөө илэрхийлэх","materials":"Биеийн хэсгүүдийн зурагт үзүүлэн (усны хувцастай хүүхдийн дүрс), \"Аюулгүй хүрэлт – Тааламжгүй хүрэлт\" зурагт карт, сэтгэл хөдлөлийн карт, \"Миний итгэлтэй хүмүүс\" гарын хээ хуудас, наалт","criteria":"Бусдын биеийн хүрч болох, болохгүй хэсгийг ялгадаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Миний бие минийх\" сэдвийг танилцуулна.\n- \"Ээж тэвэрэхэд чамд ямар санагддаг вэ?\" гэж асууна.","learner":"- Ээж, аав тэврэхэд ямар таатай санагддагаа хэлнэ.\n- \"Миний бие минийх\" гэдгийг багштай хамт давтана."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Зурагт үзүүлэн дээр тэмдэглэх: Усны хувцсаар халхлагддаг хэсгийг зурагт үзүүлэн дээр наалтаар тэмдэглэж, тэнд бусдад хүргэхгүй, өөрөө ч бусдынхад хүрэхгүй гэдгийг тайлбарлана.\n- Сэтгэл хөдлөл: \"Хэн нэгэн чамд таагүй хүрвэл ямар санагдах вэ?\" гэж сэтгэл хөдлөлийн картаар ярилцана.\n- \"Боль!\" тоглоом: Гараа урагш сунгаж \"Үгүй! Боль!\" гэж чанга хэлэх, холдох, итгэлтэй томд хэлэх дадлага хийлгэнэ.\n- Танихгүй хүн: \"Танихгүй хүн чихэр өгвөл яах вэ?\" нөхцөл байдлаар авахгүй байх дүрд тоглуулж, \"Миний итгэлтэй хүмүүс\" гарын хээг бөглүүлнэ.\nБагшийн чиглүүлэх асуулт:\n1. Биеийн аль хэсэгт бусдад хүргэж болохгүй вэ?\n2. Хэн нэгэн таагүй хүрвэл юу гэж хэлэх вэ?\n3. Танихгүй хүн юм өгвөл яах вэ?\n4. Ийм зүйл болвол хэнд хэлэх вэ?","learner":"- Зурагт үзүүлэн дээр биеийн хүрч болохгүй хэсгийг тэмдэглэнэ.\n- Таагүй хүрэлтийн үед төрөх мэдрэмжээ сэтгэл хөдлөлийн картаар илэрхийлнэ.\n- Дүрд тоглохдоо \"Үгүй! Боль!\" гэж чанга хэлж, холдож, итгэлтэй томд хэлнэ.\n- Танихгүй хүний өгсөн зүйлийг авахгүй гэдгээ хэлж, гарын хээн дээрээ итгэлтэй 5 хүнээ нэрлэнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Тоглох үед бие биеийнхээ хүсэлтийг хүндэтгэж буйг ажиглана.","learner":"- Тоглох үед найз нь \"Үгүй\" гэвэл түүний хүсэлтийг хүндэтгэнэ.\n- Өөрт таагүй санагдвал \"Надад таалагдахгүй байна\" гэж хэлнэ."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – эхний уншлага (1): «Таван найз» (Чанга уншлагын төлөвлөгөөний хуудсыг үзнэ үү.)\n- Номын нэр, хавтас, зохиолч, зураачийг танилцуулж, хэмнэлийг алдагдуулахгүй уншина.\n- Түр зогсож асуух: «Нүдээрээ бид юу хардаг бол?»\n- Шинэ үг: «Мэдрэхүй»\n- Уншсаны дараа: «Бидэнд хэдэн найз байдаг вэ? Тоолоорой.»","learner":"- Номын нэр, хавтасны зургийг харж, ном юуны тухай байхыг таамаглаж хэлнэ.\n- Багшийн уншихыг анхааралтай, тайван сонсоно.\n- Түр зогсох үед \"Дараа нь юу болох бол?\" гэсэн асуултад өөрийн таамаглалыг хэлнэ.\n- Шинэ үгийн утгыг сонсож, багштай хамт давтан хэлнэ.\n- Уншсаны дараа номын гол дүрүүдийг нэрлэж, хуруугаараа тоолно."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: Цаас, харандаа бэлтгэж, гарынхаа хүрээг зурахыг үзүүлнэ.\n- Хуруу бүрт итгэлтэй нэг хүнээ зурах эсвэл нэрлэхийг дэмжинэ.\nХэл ярианы төв: Нөхцөл байдлын карт: таатай (тэврэх, гар барих) ба таагүй мэдрэмж.\nДүрт тоглоомын төв: \"Үгүй гэж хэлье\" дүрд тоглох нөхцөл (тоглоомоо авах гэх, түлхэх).\nНомын төв: Сэтгэл хөдлөлийн зурагт номууд байрлуулна.","learner":"Урлагийн төв: Гарынхаа хүрээг зурж, хуруу бүрт итгэлтэй хүнээ зурна.\n- Итгэлтэй 5 хүнээ нэрлэж тоолно.\nХэл ярианы төв: Картыг \"таатай\", \"таагүй\" гэж ялгаж, мэдрэмжээ хэлнэ.\nДүрт тоглоомын төв: \"Үгүй, надад таалагдахгүй байна\" гэж итгэлтэй хэлэх дадлага хийнэ.\nНомын төв: Номын баатрын сэтгэл хөдлөлийг нэрлэнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 3 (4). Ганцаарчилсан ажил: «Бөмбөгөнд хүр»\nЗорилго: Бөмбөгийг шидэх, барьж авах чадварыг бататгах.\nЯвц:\n- Хүүхэд заасан шугамны ард зогсоно.\n- Бөмбөгийг хоёр гараараа сагс руу шиднэ.\n- Бөмбөг сагсанд орвол оноо авна. Алдаатай бол дахин оролдож болно.\n- Өөр хоорондоо ээлжлэн хийнэ.","learner":"- Шугамны ард зогсож, сагсыг онилно.\n- Бөмбөгийг хоёр гараараа шиднэ.\n- Онож чадвал оноогоо тоолж, алдвал дахин оролдоно.\n- Найзтайгаа ээлжээ хүлээж, найзыгаа урамшуулна."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Миний бие минийх»\nЗорилго: Өөрийн биеийг хайрлах, итгэлтэй \"Үгүй\" гэж хэлэх, итгэлтэй томоо нэрлэх дадлыг бататгах.\nХэрэглэгдэхүүн: \"Миний бие минийх\" дууны бичлэг, итгэлтэй хүмүүсийн гарын хээн зураг.\nЯвц:\n1. Хүүхдүүд дугуйлан зогсож дууг дуулна. Дууны үгэнд биеийн хэсгийг (толгой, мөр, өвдөг, хөл) заан хөдөлнө.\n2. Багш «Хэн нэгэн таагүй хүрвэл бид юу гэж хэлэх вэ?» гэхэд бүгд гараа урагш сунгаж «Үгүй! Битгий хүр!» гэж итгэлтэй хэлнэ.\n3. «Дараа нь хэнд хэлэх вэ?» гэхэд хүүхдүүд гарын хээгээ үзүүлж итгэлтэй хүмүүсээ нэрлэнэ.\n4. Дууг дахин дуулж, хөгжилтэйгээр төгсгөнө.\nДүрэм: Бие биедээ хүрэхгүй, зайтай зогсоно; хүн бүрийн хариултыг хүндэтгэнэ.\nДүгнэлт: «Чи юу ч болсон итгэлтэй томдоо хэлж болно» гэдгийг сануулж дүгнэнэ.","learner":"- Дуунд нэгдэж, биеийн хэсгүүдийг заан хөдөлнө.\n- Гараа сунгаж «Үгүй! Битгий хүр!» гэж итгэлтэй хэлнэ.\n- Итгэлтэй хүмүүсээ гарын хээгээрээ тоолж нэрлэнэ.\n- Өнөөдөр сурсан дүрмээ давтана."}]},"2026-11-17":{"method":"Зохиолд суурилсан арга (давтамж)","link":"НСХ3.2а. Бусдын сэтгэл хөдлөлийн таатай, таагүй байгааг тайлбарладаг болно.","competence":"Харилцах, бүтээлчээр сэтгэх (үзсэн зүйлээр түүх зохиож ярих), бусдын сэтгэл хөдлөлийг тайлбарлах","materials":"Амьтан, байгалийн сэдэвтэй үггүй зурагт ном, дараалсан зурагт карт, сэтгэл хөдлөлийн карт, бяцхан ном хийх цаас, өнгийн харандаа","criteria":"Сонирхсон номоо сонгон үзэж, номын зургийг тайлбарлан ярьдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, номын нүүрийг үзүүлж \"Энэ ном юуны тухай байх бол?\" гэж таалгана.","learner":"- Номын нүүрний зургийг харж ном юуны тухай байхыг таамаглана."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Зураг унших: Үггүй номын хуудсыг нэг нэгээр үзүүлж, хүүхдүүдээр үйл явдлыг ярилцуулна.\n- Сэтгэл хөдлөл, дуу хоолой: \"Энэ баатар ямар сэтгэлтэй байна? Яаж мэдэв?\" гэж асууж, баатрын дуу хоолойг дуурайлгана.\n- Таамаглах: \"Дараа нь юу болох бол?\" гэж асууна.\n- Бяцхан ном: Дараалсан зурагт картыг зөв дараалалд оруулж, нугалсан цаасан дээр бяцхан ном хийлгэнэ.\nБагшийн чиглүүлэх асуулт:\n1. Энэ зураг дээр юу болж байна вэ?\n2. Баатар ямар сэтгэлтэй байна? Яаж мэдсэн бэ?\n3. Яагаад ингэж санагдсан байж магадгүй вэ?\n4. Дараагийн хуудсанд юу болох бол?","learner":"- Номын зургийг ажиглаж, юу болж байгааг өөрийн үгээр ярина.\n- Баатрын сэтгэл хөдлөлийг нүүрний хувирлаар нь тайлбарлаж, дуу хоолойг нь дуурайна.\n- Дараагийн хуудсанд юу болохыг таамаглана.\n- Зурагт картаар бяцхан ном хийж, найздаа зургийг тайлбарлан ярина."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Номын буланд хүүхдүүд бие даан ном үзэхийг ажиглана.","learner":"- Номын буланд бие даан ном үзэж, найздаа зургийг тайлбарлана."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Өглөөний номыг хүүхдүүдээр дахин ярилцуулна.","learner":"- Өглөө үзсэн номын үйл явдлыг өөрийн үгээр дарааллаар нь ярина."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Хэл ярианы төв: 4 дараалсан зурагт карт бэлтгэж, түүх зохиохыг санал болгоно.\n- \"Эхлээд, дараа нь, эцэст нь\" гэх үг хэрэглэхийг дэмжинэ.\nУрлагийн төв: Түүхийн өөр төгсгөлийг зурах.\nНомын төв: Үггүй зурагт номууд.\nДүрт тоглоомын төв: Хүүхэлдэйн театр, дүрүүд.","learner":"Хэл ярианы төв: Зургийг дарааллаар нь байрлуулж, түүх ярина.\n- Баатрын сэтгэл хөдлөлийг тайлбарлана.\nУрлагийн төв: Өөрийн төсөөллөөр төгсгөл зурж ярина.\nНомын төв: Номын зургаас үйл явдлыг өөрөө ярина.\nДүрт тоглоомын төв: Түүхийн дүрүүдээр жүжиг тоглож, дүрийн сэтгэлийг дуу хоолойгоор илэрхийлнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 4 (1). Ажиглалт: Голын захын хөлдсөн мөсийг ажиглах\nЗорилго: Голын зах хэсэг түрүүлж хөлдөж эхэлдгийг ажиглуулж, мөсөн дээр гарахгүй байх аюулгүй байдлын ойлголт өгөх.\nЯвц:\n- Багш хүүхдүүдийг аюулгүй зайд зогсоож, голын зах орчмыг ажиглуулна.\n- Ус ямар болж өөрчлөгдсөн, мөс хаана тогтсон, голын бүх хэсэг хөлдсөн эсэхийг ярилцана.\n- Багшийн мэдээлэл: Хүйтэн болоход ус хөлдөж мөс болно. Голын зах ус багатай, урсгал сул тул түрүүлж хөлдөнө. Голын дунд хэсэг бүрэн хөлдөөгүй байж болно. Нимгэн мөс цөмрөх аюултай. Гол, нуурын мөсөн дээр зөвхөн том хүний зөвшөөрөлтэй ойртоно.\n- Богино шүлэг «Мөс»: Голын захад мөс тогтож, гялалзан цайрч харагдана. Мөс нимгэн бол аюултай, дээр нь гарч болохгүй ээ. Холоос харж ажиглаад, болгоомжтой байцгаая.\n- Асуулт: «Голын захад юу тогтсон байна вэ?», «Ус ямар болсон байна вэ?», «Голын бүх хэсэг хөлдсөн байна уу?», «Мөсөн дээр гарч болох уу?», «Яагаад голын зах түрүүлж хөлддөг вэ?», «Гол, нуурын дэргэд яаж болгоомжлох вэ?»","learner":"- Багшийн заасан аюулгүй зайд зогсож, голын захыг ажиглана.\n- Мөс хаана тогтсон, ус хаана хөлдөөгүйг заан хэлнэ.\n- Мөсөн дээр яагаад гарч болохгүйг «Нимгэн мөс цөмрөнө» гэж тайлбарлана.\n- «Мөс» шүлгийг багштай хамт давтана."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Би ямар байна?»\nЗорилго: Нүүрний хувирлаас бусдын сэтгэл хөдлөлийг таньж тайлбарлах.\nХэрэглэгдэхүүн: Сэтгэл хөдлөлийн карт, жижиг толь.\nЯвц:\n1. Нэг хүүхэд картаас сэтгэл хөдлөл сугалж, зөвхөн нүүрний хувирлаар үзүүлнэ.\n2. Бусад нь «Чи гунигтай байна уу?» гэж таана.\n3. Таасан хүүхэд «Тэр яагаад ингэж санагдсан бол?» гэсэн асуултад шалтгаан зохиож хэлнэ.\n4. Хос болж толинд хараад сэтгэл хөдлөл гаргаж, нөгөө нь таана.\n5. Сүүлд бүгд «баяртай» нүүрээр инээлдэнэ.\nДүрэм: Ярихгүйгээр зөвхөн нүүрээрээ үзүүлнэ; найзынхаа хувирлыг шоолохгүй.\nДүгнэлт: «Найзынхаа сэтгэлийг яаж мэдэх вэ?» гэж асууж дүгнэнэ.","learner":"- Картын сэтгэл хөдлөлийг нүүрний хувирлаар үзүүлнэ.\n- Найзынхаа хувирлыг ажиглаж тааж нэрлэнэ.\n- Тэр сэтгэл хөдлөлийн шалтгааныг зохиож тайлбарлана.\n- Хосоороо толинд хувирал гаргаж тоглоно."}]},"2026-11-18":{"method":"Шинжлэн судлах арга (давтамж)","link":"МАТ3.3а. Тоглоом юмсаас нэг шинжээр 4 хүртэлх хэсэгт ангилж, байрлуулна.","competence":"Шүүн тунгаах (шалтгаан, холбоо хамаарлын талаар асуух, тайлбарлах), суралцахуйд суралцах (таамаглах, туршиж үзэх), ангилах","materials":"Хатуу, зөөлөн; дулаан, хүйтэн; хөвдөг, живдэг эд зүйлс (мөс, ноос, чулуу, хөвөн, төмөр болон модон халбага), ус хийсэн сав, хатуу ба зөөлөн ааруул, 4 хайрцаг","criteria":"Орчны бодит юмсын 2-3 шинжийг ялгаж, оновчтой үгээр тайлбарладаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, мөс, ноос хоёрыг барьж мэдрүүлнэ.","learner":"- Мөс, ноос хоёрыг гартаа барьж хүйтэн, дулааныг ялгаж хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Мэдрэх: Эд зүйлсийг барьж, үнэрлэж, хатуу, зөөлөн ааруул амталж \"Дулаан уу, хүйтэн үү? Хатуу юу, зөөлөн үү?\" гэж асууна.\n- Таамаглаж туршах: \"Аль нь хөвөх, аль нь живэх вэ?\" гэж таамаглуулаад усанд хийж шалгуулна.\n- Ангилах: Нэг шинжээр (хатуу/зөөлөн, хөвдөг/живдэг) 4 хүртэлх хайрцагт ангилуулна.\n- Тайлбарлах: \"Чулууг өргөхөд ямар байсан бэ?\" гэж асууж, 2-3 шинжийг хамт хэлүүлнэ.\nБагшийн чиглүүлэх асуулт:\n1. Энэ дулаан уу, хүйтэн үү? Хатуу юу, зөөлөн үү?\n2. Аль нь хөвнө, аль нь живнэ гэж бодож байна? Яагаад?\n3. Төмөр, модон халбага хоёр юугаараа ялгаатай вэ?\n4. Аль мэдрэхүйгээрээ үүнийг мэдсэн бэ?","learner":"- Эд зүйлсийг гараар барьж, үнэрлэж, амталж шинжийг нь хэлнэ.\n- Хөвөх, живэхийг таамаглаж, туршиж шалгаад үр дүнгээ хэлнэ.\n- Эд зүйлсийг нэг шинжээр хайрцагт ангилна.\n- \"Чулуу хүнд, бас хатуу, хүйтэн байна\" гэх мэтээр 2-3 шинжийг оновчтой үгээр тайлбарлана."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Байгаль шинжлэлийн буланд эд зүйлсийг байрлуулна.","learner":"- Байгаль шинжлэлийн буланд эд зүйлсийг тэмтэрч, найздаа шинжийг нь хэлнэ."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – хоёр дахь уншлага (2): «Таван найз» (Төлөвлөгөөний хуудсыг 11.16-ны төлөвлөлтийн дараа үзнэ үү.)\n- Эргэн санах: «Номд бидний биеийн таван найзын тухай гардгийг санаж байгаа биз. Тэд хэн хэн бэ?»\n- Түр зогсож асуух: «Цас ямар өнгөтэй вэ? Аль найз хэлж өгдөг вэ?»\n- Уншсаны дараа: «Хэрвээ нэг найз маань ажиллахгүй бол бусад нь яаж туслах вэ?»\n- «Ид шидийн уут»: нүдээ аниад эд зүйл тэмтэрч, шинжийг нь хэлэх.","learner":"- Номын эхлэл, өрнөл, төгсгөлд юу болсныг санаж хариулна.\n- Түр зогсох үед нээлттэй асуултад \"Би ... гэж бодож байна, учир нь ...\" гэж санал бодлоо илэрхийлнэ.\n- Шинэ үгсийг биеэрээ, үйлдлээр үзүүлнэ.\n- Номын дүрд тоглож, дүрийнхээ хэлсэн үгийг давтана.\n- Номын зургаас амьтан, хүн, эд зүйлсийг тоолж хэлнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Математикийн төв: Өнгөт товч, 4 аяга бэлтгэнэ.\n- \"Товчийг өнгөөр нь ангил\" гэж даалгана.\nБайгаль шинжлэлийн төв: Мөс, хөвөн, чулуу, ноос, төмөр, мод зэрэг эд зүйлс бэлтгэнэ.\nХэл ярианы төв: \"Энэ юу вэ?\" – шинжээр таалгах тоглоом.\nУрлагийн төв: Барзгар цаас, хөвөн, ноос наах наамал.","learner":"Математикийн төв: Товчийг 4 өнгөөр ангилж аяганд хийнэ.\n- Аяга бүрийн товчийг тоолж хэлнэ.\nБайгаль шинжлэлийн төв: Эд зүйлсийг тэмтэрч, хатуу/зөөлөн, хүйтэн/дулаан гэж ангилна.\nХэл ярианы төв: Эд зүйлийн шинжийг хэлж, найздаа таалгана.\nУрлагийн төв: Янз бүрийн материал наан, мэдрэмжийг нь хэлнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 4 (2). Хөдөлмөрийн үйл ажиллагаа: Эрэг, талбайг цэвэр байлгах\nЗорилго: Орчноо цэвэр байлгах, аюултай газрыг таних, хамтран ажиллах дадал төлөвшүүлэх.\nЯвц:\n- Хэрэглэгдэхүүн: жижиг бээлий, хувин, хогийн уут, аюулгүй талбайн тэмдэг.\n- Хүүхдүүд аюулгүй хэсэгт байгаа жижиг хогийг түүж саванд хийнэ. Голын мөс, усанд ойртохгүй. Мөс рүү чулуу, мод шидэхгүй.\n- Хөдөлмөрийн дараах ярилцлага: «Голын эргийг яаж цэвэр байлгах вэ?», «Яагаад хог хаяж болохгүй вэ?», «Бид өнөөдөр ямар ажил хийсэн бэ?»\n- Багшийн анхаарах зүйл: хүүхдийг ус, мөсөнд ойртуулахгүй; хүнд зүйл өргүүлэхгүй; хамтран ажилласанд нь магтана.","learner":"- Бээлийгээ өмсөж, аюулгүй хэсэгт байгаа жижиг хогийг түүнэ.\n- Хогоо хувин, уутанд хийнэ.\n- Мөс, ус руу ойртохгүй, юм шидэхгүй байх дүрмийг мөрдөнө.\n- Ажлын дараа өнөөдөр юу хийснээ, яагаад хог хаяж болохгүйг ярина."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Ид шидийн уут»\nЗорилго: Мэдрэхүйгээр (тэмтрэх) юмсын шинж чанарыг ялгаж, шинжийн үгээр тодорхойлох.\nХэрэглэгдэхүүн: Даавуун уут, эд зүйлс (хөвөн, чулуу, ноос, халбага, самар, мөсөн шоо), нүдний боолт.\nЯвц:\n1. Багш уутанд 6–8 эд зүйл хийнэ.\n2. Нэг хүүхэд нүдээ анин уутанд гараа хийж нэг зүйлийг тэмтэрнэ.\n3. «Энэ хатуу, хүйтэн, гөлгөр байна» гэж шинжийг нь хэлнэ.\n4. Бусад нь шинжийг сонсоод юу болохыг таана; дараа нь гаргаж шалгана.\n5. Хоёр зүйлийг харьцуулж «Аль нь илүү зөөлөн бэ?» гэж асууна.\nДүрэм: Уутанд шагайхгүй; эхлээд шинжийг хэлж, дараа нь нэрлэнэ.\nДүгнэлт: Аль мэдрэхүйгээрээ мэдсэнээ нэрлэж дүгнэнэ.","learner":"- Нүдээ аниад уутнаас нэг зүйл тэмтэрнэ.\n- Шинжийг нь «хатуу, зөөлөн, хүйтэн, барзгар» гэж тодорхойлно.\n- Найзынхаа тайлбараар тааж нэрлэнэ.\n- Хоёр зүйлийг харьцуулж ялгааг хэлнэ."}]},"2026-11-19":{"method":"Тоглоомонд суурилсан арга","link":"ХЯ3.1а. Асуултыг ойлгож хариулт өгнө.","competence":"Хөдөлгөөнөө удирдах, зааврыг сонсож гүйцэтгэх, асуултад хариулах, аюулгүй байдал","materials":"Зөөлөн дэвсгэр, туулайн чихтэй малгай, асуулттай карт, бөмбөр","criteria":"Туулай мөлхөлтийн байрлалыг зөв авдаг, зааврын дагуу гүйцэтгэдэг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, биеэ халаах дасгал хийлгэнэ.\n- \"Туулай яаж хөдөлдөг вэ?\" гэж асууна.","learner":"- Биеэ халаах дасгалыг багшийг дагаж хийнэ.\n- Туулай хэрхэн хөдөлдгийг дуурайж үзүүлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Зааж үзүүлэх: Доош харж өвдөг, тохойгоо нийлүүлэн (туулай шиг) суугаад хажуу тийш 1 удаа өнхрөхийг үзүүлнэ.\n- Зааврын дагуу дадлага: \"Туулай суулаа – өнхөр!\" гэх зааврыг дагуулан дэвсгэр дээр ээлжээр өнхрүүлнэ.\n- Хосоороо өнхрөх: Дээш харж хэвтэн, гар гараасаа барьж хамтдаа хажуу тийш өнхрүүлнэ.\n- Зай барих, асуулт: Хоорондын зайгаа барихыг сануулж, өнхрөхийн өмнө асуулттай карт сугалж хариулуулна.\nБагшийн чиглүүлэх асуулт:\n1. Туулай мөлхөлтийн байрлалд гар, өвдөг хаана байх вэ?\n2. Аль тийшээ өнхрөх вэ?\n3. Өнхрөхдөө толгойгоо яах вэ?\n4. Аюулгүй өнхрөхийн тулд юуг анхаарах вэ?","learner":"- Туулай мөлхөлтийн байрлалыг зөв авна.\n- Багшийн зааврыг сонсож, хажуу тийш 1 удаа өнхөрнө.\n- Найзтайгаа гар гараасаа барьж хамтдаа өнхөрнө.\n- Хоорондын зайгаа барьж, асуултад бүтэн өгүүлбэрээр хариулна."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Хөдөлгөөний буланд дэвсгэр байрлуулж ажиглана.","learner":"- Дэвсгэр дээр аюулгүйгээр өнхрөх, мөлхөх тоглоом тоглоно."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Туулайн тухай үлгэр уншиж асуулт тавина.","learner":"- Туулайн тухай үлгэрийг сонсож, багшийн асуултад хариулна."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Хэл ярианы төв: Асуулт-хариулт карт (Хэн? Юу? Хаана?) бэлтгэнэ.\nХөдөлгөөний төв: Зөөлөн дэвсгэр, хонгил, саадтай зам байрлуулна.\n- Аюулгүй өнхрөх дүрмийг сануулна.\nУрлагийн төв: Цаасан туулайн маск хийх.\nНомын төв: Туулайн тухай зурагт номууд.","learner":"Хэл ярианы төв: Карт сугалж найздаа асуулт тавьж, хариултыг сонсоно.\nХөдөлгөөний төв: Туулай мөлхөлтөөр явж, дэвсгэр дээр хажуу тийш өнхөрнө.\n- Ээлжээ хүлээнэ.\nУрлагийн төв: Маскаа хайчилж, будаж, чих наана.\nНомын төв: Номыг үзэж, туулай юу хийснийг ярина."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 4 (3). Хөдөлгөөнт тоглоом: «Мөсөн дээр бүү гар»\nЗорилго: Дохио сонсож хөдөлгөөн хийх, аюултай ба аюулгүй орчныг ялгах, болгоомжтой алхах чадварыг хөгжүүлэх.\nЯвц:\n- Хэрэглэгдэхүүн: тэмдэглэгээ (конус), цагираг, аюулгүй тоглох талбайн туг.\n- Талбайн нэг хэсгийг «Аюулгүй эрэг», нөгөө хэсгийг «Мөстэй гол» гэж тэмдэглэнэ.\n- «Эргээр алхъя» гэхэд хүүхдүүд аажуухан алхана. «Мөс байна» гэхэд зогсоно. «Буцаарай» гэхэд аюулгүй тал руу очно.\nДүрэм: мөстэй хэсэг рүү орохгүй; найзаа түлхэхгүй; багшийн дохиог анхааралтай сонсоно; жижиг алхмаар болгоомжтой хөдөлнө. Халтиргаатай бол гүйхийг алхалтаар орлуулна.","learner":"- Дохиог анхааралтай сонсож, «Эргээр алхъя» гэхэд аажуухан алхана.\n- «Мөс байна» гэхэд шууд зогсоно.\n- «Буцаарай» гэхэд аюулгүй тал руу жижиг алхмаар болгоомжтой очно.\n- Мөстэй хэсэг рүү орохгүй, найзаа түлхэхгүй."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Туулай юу хийв?»\nЗорилго: Асуултыг ойлгож хариулах, хөдөлгөөнөөр үзүүлэх.\nХэрэглэгдэхүүн: Туулайн чихтэй малгай, зөөлөн дэвсгэр.\nЯвц:\n1. Нэг хүүхэд туулайн малгай өмсөж, нэг хөдөлгөөн хийнэ (үсрэх, өнхрөх, мөлхөх).\n2. Багш бусдаас «Туулай юу хийв?» гэж асууна.\n3. Хүүхдүүд «Туулай хажуу тийш өнхөрлөө» гэж бүтэн өгүүлбэрээр хариулна.\n4. Дараа нь багш «Туулай хаашаа үсэрсэн бэ?», «Хэдэн удаа үсэрсэн бэ?» гэх тодруулах асуулт тавина.\n5. Зөв хариулсан хүүхэд дараагийн туулай болно.\nДүрэм: Хариулахдаа бүтэн өгүүлбэр хэрэглэнэ; дэвсгэр дээр л өнхөрнө.\nДүгнэлт: «Өнөөдөр бид ямар хөдөлгөөн хийсэн бэ?» гэж давтаж дүгнэнэ.","learner":"- Туулайн дүрд хөдөлгөөн (үсрэх, өнхрөх) хийнэ.\n- Найзынхаа хөдөлгөөнийг ажиглаж, асуултад бүтэн өгүүлбэрээр хариулна.\n- Тодруулах асуулт (хаашаа, хэдэн удаа)-д хариулна.\n- Ээлжээ хүлээж, дэвсгэр дээр аюулгүй тоглоно."}]},"2026-11-20":{"method":"Тоглоомонд суурилсан арга (давтамж)","link":"ЗУ3.2а. Өөрийн бодол төсөөллөөр зохиомжлон зурна.","competence":"Гарын нарийн хөдөлгөөн, зураас дуурайх, бүтээлчээр сэтгэх","materials":"Цэгэн зурлагатай ажлын хуудас (шулуун, тахир, долгион зураас, тойрог, дөрвөлжин, гурвалжин), элс эсвэл будаа хийсэн хайрцаг, олс, савх, өнгийн харандаа, лав өнгө","criteria":"Энгийн дүрс, зураасыг дуурайж зурж бичдэг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, хуруугаараа агаарт шулуун, долгионт зураас зуруулна.","learner":"- Хуруугаараа агаарт шулуун, долгионт, хугарсан зураас зурна."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Элс, будаан дээр: Элсэн (будаан) хайрцагт хуруугаараа шулуун, долгион зураас, тойрог зуруулна.\n- Олс, савхаар: Олс, савх ашиглан зураас, дүрс үүсгэж бүтээлгэнэ.\n- Дагуулах: Цэгэн зурлагыг харандаагаар дагуулж, зураасаар амьтныг эд зүйлтэй холбуулна (туулайг лууван руу хөтлөх г.м.).\n- Цэг холбох, гүйцээх: Цэгүүдийг холбон дүрс үүсгэж, амьтны зургийг гүйцээн зуруулна.\nБагшийн чиглүүлэх асуулт:\n1. Энэ зураас ямар хэлбэртэй вэ? Шулуун уу, долгион уу?\n2. Цэгүүдийг дагаж зурахдаа харандаагаа яаж барих вэ?\n3. Цэгүүдийг холбоход ямар дүрс гарч ирэв?\n4. Зураасаа ашиглаж ямар зураг болгох вэ?","learner":"- Элс, будаан дээр хуруугаараа зураас, дүрс зурна.\n- Олс, савхаар шулуун, тахир зураас, дүрс бүтээнэ.\n- Цэгэн зурлагыг харандаагаа зөв барьж дагуулан зурна.\n- Цэгүүдийг холбон дүрс үүсгэж, зургаа гүйцээн зурж юу болсныг хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Урлагийн буланд будаг, бийр байрлуулна.","learner":"- Урлагийн буланд будаг, бийрээр чөлөөтэй зурна."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – гурав дахь уншлага (3): «Таван найз» (Төлөвлөгөөний хуудсыг 11.16-ны төлөвлөлтийн дараа үзнэ үү.)\n- Уншихын өмнө: номын нэрийг хүүхдүүдээр хэлүүлж, зургийг заан ярилцана.\n- Уншиж байхдаа: зургийг заан хүүхдүүдээр үйл явдлыг яриулна.\n- Уншсаны дараа: шинэ үгсээр өгүүлбэр зохиолгож, номтой холбоотой бүтээл хийнэ.","learner":"- Номын нэр, зураачийг өөрөө хэлнэ.\n- Зургийг харж, номын үйл явдлыг дарааллаар нь өөрийн үгээр ярина.\n- \"Яагаад?\" гэсэн асуултад учир шалтгааныг холбон тайлбарлана.\n- Номд гарсан шинэ үгсээр өгүүлбэр зохиож хэлнэ.\n- Номтой холбоотой зураг зурах, бүтээл хийж, найздаа танилцуулна."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Бичих бэлтгэлийн төв: Цэгэн зураастай ажлын хуудас (шулуун, долгионт, хугарсан) бэлтгэнэ.\n- Харандааг зөв барихыг үзүүлнэ.\nУрлагийн төв: Будаг, бийрээр зураасан хээ зурах.\nЭлсэн хайрцгийн төв: Элсэн хайрцаг, саваа.\nУтас, наамлын төв: Өнгөт утас, цавуу, цаас.","learner":"Бичих бэлтгэлийн төв: Цэгэн зураасыг эхнээс төгсгөл хүртэл дагуулж зурна.\n- Зураасаас гарахгүй байхыг анхаарна.\nУрлагийн төв: Шулуун, долгионт зураасаар хээ гаргана.\nЭлсэн хайрцгийн төв: Элсэн дээр хуруу, саваагаар зураас зурж нэрлэнэ.\nУтас, наамлын төв: Утсаар зураас гаргаж наан, зураг бүтээнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажил
