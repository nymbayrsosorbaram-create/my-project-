рлах.\nУрлагийн төв: \"Миний өвөл\" сэдвээр зураг зурж үзэсгэлэнд нэмэх.\nБарилгын төв: \"Үзэсгэлэнгийн танхим\" барих.","learner":"Хэл ярианы төв:\n- Үзэсгэлэнгийн хөтөч болж зургийг заан бусдад дэлгэрэнгүй тайлбарлана.\nУрлагийн төв:\n- \"Миний өвөл\" сэдвээр зураг зурж үзэсгэлэнд байрлуулна.\nБарилгын төв:\n- \"Үзэсгэлэнгийн танхим\" барьж, зураг өлгөх газрыг тохируулна."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 5 (1). Ажиглалт: Өвлийн улиралд гэрийн тэжээвэр амьтдыг ажиглах\nЗорилго:\n- Өвлийн улиралд гэрийн тэжээвэр амьтдын амьдралын талаарх мэдлэгийг бататгах\n- Гэрийн тэжээвэр амьтдад хүн хэрхэн анхаарал халамж тавьдгийг ойлгуулах (тэжээл бэлтгэх, услах, байр савыг цэвэрлэх)\nОньсого:\n1. Хон хон дуутай, Хонлой дээрээ дэгээтэй, тэр юу вэ? /нохой/\n2. Миау миау дуутай, Сэм сэм явдалтай, тэр юу вэ? /муур/\nБагш хүүхдүүдэд асуулт тавина:\n- «Та нар ямар гэрийн тэжээвэр амьтдыг мэдэх вэ?»\n- «Өвөл болоход гэрийн тэжээвэр амьтдын амьдрал хэрхэн өөрчлөгддөг вэ?»\n- «Хүмүүс гэрийн тэжээвэр амьтдыг хэрхэн арчилдаг вэ?»\n- «Өвөл гэрийн тэжээвэр болон зэрлэг амьтдын амьдралыг харьцуулаарай.»","learner":"- Оньсогыг (\"Хон хон дуутай...\", \"Миау миау дуутай...\") сонсоод хариуг таана.\n- Нохой, муурыг ажиглаж, өвлийн байр, хоол, усыг нь харна.\n- Мэддэг гэрийн тэжээвэр амьтдаа нэрлэнэ.\n- Гэрийн тэжээвэр ба зэрлэг амьтдын өвлийн амьдралыг харьцуулна.\n- \"Хүмүүс тэдэнд тэжээл өгч, услаж, байрыг нь цэвэрлэдэг\" гэж хэлнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Хөшөө»\nЗорилго: Баримлын дүрийг биеэрээ илэрхийлэх.\nЯвц:\n1. Хөгжим эгшиглэхэд хүүхдүүд хөдөлнө.\n2. Хөгжим зогсоход багшийн хэлсэн дүрийн (цасан хүн, тэшүүрчин, хэрээ) хөшөө болно.\n3. \"Үзэсгэлэнгийн хөтөч\" хүүхэд хөшөөнүүдийг тайлбарлана.\nДүрэм: Хөшөө хөдлөхгүй.\nДүгнэлт: \"Ямар хөшөө хамгийн гоё байсан бэ? Яагаад?\" гэж ярилцана.","learner":"- Хөгжим эгшиглэхэд чөлөөтэй хөдөлнө.\n- Хөгжим зогсоход багшийн хэлсэн дүрийн (цасан хүн, тэшүүрчин, хэрээ) хөшөө болно.\n- Хөтөч болсон хүүхэд найзуудынхаа хөшөөг тайлбарлана.\n- \"Ямар хөшөө гоё байсан бэ?\" асуултад шалтгаантай хариулна."}]},"2026-12-24":{"method":"Төсөлд суурилсан арга","link":"ХЯ3.2г. Үгийг оновчтой сонгож, дэлгэрэнгүй өгүүлбэрээр ярина.","competence":"Харилцах (гэр бүлийн уламжлалаа өөрийн үгээр тайлбарлах), соёлын мэдлэг (ардын тоглоом, наадгай)","materials":"Гэр бүлийн баярын зураг (гэрээс авчирсан), шагай, ардын тоглоомын зурагт карт, шинэ жилийн чимэглэлийн зураг, «Манай гэрийн баяр» номын хуудас","criteria":"Гэр бүлийн орчинд уламжлалт баярыг (шинэ жил, цагаан сар) хэрхэн тэмдэглэдэг талаар өөрийн үгээр тайлбарлаж, ардын тоглоом, наадгайгаар наадна.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, гэрээс авчирсан баярын зургаа үзүүлэхийг урина.","learner":"- Мэндчилж тойрогт сууна.\n- Гэрээс авчирсан баярын зургаа үзүүлнэ.\n- Зурган дээр хэн байгааг, юу хийж байгааг нэрлэнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Ярилцлага: \"Танайх шинэ жилийг яаж тэмдэглэдэг вэ?\" гэж асууж, хүүхэд бүрээр гэр бүлийн уламжлалаа яриулна.\n- Харьцуулах: Шинэ жил ба цагаан сарын ялгааг зурагт картаар ярилцана (гацуур – ширээ засах, ерөөл – золгох).\n- Ардын тоглоом: Шагайгаар \"Морь уралдуулах\" тоглоомыг зааж, хамтдаа наадна.\nБагшийн чиглүүлэх асуулт:\n1. Танайх шинэ жилээр юу хийдэг вэ?\n2. Баярын өдөр хэн хэн цуглардаг вэ?\n3. Эмээ, өвөө чинь ямар тоглоом тоглодог вэ?","learner":"Ярилцлага:\n- \"Манайх шинэ жилээр ... хийдэг\" гэж гэр бүлийнхээ уламжлалыг өөрийн үгээр дэлгэрэнгүй ярина.\n- Баярын өдөр хэн хэн цуглардгийг нэрлэнэ.\nХарьцуулах:\n- Шинэ жил ба цагаан сарын зургийг харьцуулна.\n- \"Шинэ жилээр гацуур чимэглэдэг, цагаан сараар золгодог\" гэж ялгааг тайлбарлана.\nАрдын тоглоом:\n- Шагайн нэрийг (морь, тэмээ, хонь, ямаа) хэлнэ.\n- Шагай харваж \"Морь уралдуулах\" тоглоомоор наадна.\n- Найзынхаа уламжлалыг сонсож адил, ялгаатайг хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Дүрт тоглоомын буланд \"Баярын ширээ\" орчин бүрдүүлж, хүүхдүүдийн дүрд тоглохыг ажиглана.","learner":"- \"Баярын ширээ\" буланд гэр бүлийн гишүүдийн дүрийг хуваарилна.\n- Ширээ засаж, бие биедээ ерөөл хэлнэ."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Шинэ жилийн баярын тухай шүлэг, ерөөл уншиж цээжлүүлнэ.\n- \"Ерөөлд ямар сайхан үг байна вэ?\" гэж асууна.","learner":"- Шинэ жилийн шүлэг, ерөөлийг сонсоно.\n- Мөр мөрөөр давтан хэлж цээжлэхийг оролдоно.\n- Ерөөлд гарсан сайхан үгсийг (аз жаргал, эрүүл энх) нэрлэнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Ардын тоглоомын төв: Шагайгаар \"Дөрвөн бэрх\", \"Морь уралдуулах\" тоглох.\nУрлагийн төв: \"Манай гэрийн баяр\" зураг зурж, гэр бүлийн номын хуудас хийх.\nХэл ярианы төв: Тоглоомон утсаар эмээ, өвөөдөө шинэ жилийн мэнд хүргэх.","learner":"Ардын тоглоомын төв:\n- Шагайгаар \"Дөрвөн бэрх\", \"Морь уралдуулах\" тоглоно.\n- Буусан шагайны нэрийг хэлнэ.\nУрлагийн төв:\n- \"Манай гэрийн баяр\" зураг зурж, гэр бүлийнхээ баярыг тайлбарлана.\nХэл ярианы төв:\n- Тоглоомон утсаар эмээ, өвөөдөө ерөөлийн үгээр шинэ жилийн мэнд хүргэнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 5 (2). Хөдөлмөрийн үйл ажиллагаа: Хашаа, тэжээлийн газар хүрэх замыг цаснаас цэвэрлэх\nЗорилго: Хүрз ашиглах чадварыг сайжруулах, гэрийн тэжээвэр амьтдад анхаарал халамж тавих хүсэл эрмэлзлийг төлөвшүүлэх, хамтран ажиллах, бие биедээ туслах чадварыг хөгжүүлэх.\nЗохион байгуулах хэлбэр: Багаар\nХэрэглэгдэхүүн: Хүүхдийн хэмжээнд тохирсон хүрз (хүүхэд тус бүрт 1), цас хураах том сав эсвэл тэрэг, хүүхдийн гар бээлий, гутал\nУрьдчилсан бэлтгэл: «Өвлийн улиралд гэрийн тэжээвэр амьтдад хүнс, ус хүргэхэд зам цастай байвал юу болох вэ?», «Бид тэдэнд хэрхэн туслах вэ?» гэж ярилцана.\nЗаавар:\n1. Хүүхдүүдийг 3–4 хүний багт хувааж, тус бүрд гүйцэтгэх хэсгийг хуваарилна.\n2. Хүрзийг хэрхэн зөв барьж ашиглахыг багш өөрөө үзүүлж тайлбарлана.\n3. Хүүхдүүд хүрзээр цас авч, овоолох газарт хүргэнэ.\n4. Багш үйл явцыг хянаж, шаардлагатай үед зөвлөгөө өгч урамшуулна.\n5. Цэвэрлэж дууссан хэсгийг хүүхдүүдтэй хамт шалгаж, үр дүнг үнэлнэ.\n6. Хүрзийг цэвэрлэж, тогтоосон газарт буцааж тавина.\n7. Хүүхдүүдийн гар, хувцсыг шалган, дотогш орохын өмнө цасыг сэгсэрнэ.\nАюулгүй байдлын дүрэм: Хүрзийг найз руугаа чиглүүлж болохгүй; гулгамтгай газар болгоомжтой алхах; багш үргэлж хяналт тавьж байна.\nДүгнэлтийн асуулт: «Бид өнөөдөр ямар ажил хийсэн бэ?», «Энэ ажил гэрийн тэжээвэр амьтдад хэрхэн тусалсан бэ?», «Ажлаа хийж дуусахад ямар мэдрэмж төрж байна вэ?»","learner":"- 3-4 хүний багт нэгдэж, өөрт оногдсон хэсгийг сонсоно.\n- Багшийн үзүүлснээр хүрзийг зөв барьж үзнэ.\n- Хашаа, тэжээлийн газар хүрэх замын цасыг хүрзээр авч овоолох газарт хүргэнэ.\n- Хүрзийг найз руугаа чиглүүлэхгүй, гулгамтгай газар болгоомжтой алхана.\n- Цэвэрлэсэн замаа багштай хамт шалгаж, хүрзээ цэвэрлэн байранд нь тавина.\n- Дотогш орохын өмнө хувцаснаасаа цасыг сэгсэрнэ.\n- \"Энэ ажил амьтдад хоол, ус хүргэхэд тусална\" гэж мэдрэмжээ хуваалцана."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Цагаан ястай мэлхий»\nЗорилго: Монгол ардын тоглоомоор хамтран наадах.\nЯвц:\n1. Хүүхдүүд тойрог үүсгэн гар гараасаа барина.\n2. Голд нь нэг хүүхэд \"мэлхий\" болж суугаад, бусад нь дуулж эргэнэ.\n3. Дуу дуусахад \"мэлхий\" нэг хүүхдийг сонгож солигдоно.\nДүрэм: Ээлжээ хүлээнэ; хамтдаа дуулна.\nДүгнэлт: \"Ардын ямар тоглоом тоглосон бэ?\" гэж ярилцана.","learner":"- Тойрог үүсгэн гар гараасаа барина.\n- \"Цагаан ястай мэлхий\" дууг хамтдаа дуулж эргэнэ.\n- Голд суусан \"мэлхий\" дуу дуусахад шинэ хүүхэд сонгоно.\n- Ээлжээ хүлээж, хамтдаа дуулна.\n- Тоглосон ардын тоглоомынхоо нэрийг хэлнэ."}]},"2026-12-25":{"method":"Тоглоомонд суурилсан арга (давтамж)","link":"ЗУ3.2б. Өөрийн бүтээлдээ тохирох өнгийг сонгож будна.","competence":"Бичих бэлтгэл (энгийн зураасыг дагуулах), бүтээлчээр сэтгэх (тохирох өнгө сонгох)","materials":"Шинэ жилийн ил захидлын загвар (цэгэн зураастай гацуур, од, цасан ширхэг), өнгөт харандаа, лав өнгө, элсэн хайрцаг, туузан зам","criteria":"Энгийн (шулуун, тахир, долгионт, хугарсан) зураасыг дагуулж зурдаг. Бүтээлдээ тохирох өнгийг сонгож буддаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, хуруугаараа агаарт шулуун, тахир, долгионт зураас зуруулна.","learner":"- Мэндчилж тойрогт сууна.\n- Багшийг дуурайн хуруугаараа агаарт шулуун, тахир, долгионт зураас зурна.\n- Зураас бүрийн нэрийг хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Элсэн дээр: Элсэн хайрцагт хуруугаараа гацуурын хугарсан зураас, цасан ширхгийн шулуун зураас зуруулна.\n- Цэгэн зураас дагуулах: Ил захидлын загвар дээрх цэгэн зураасыг харандаагаар дагуулан зурна.\n- Өнгө сонгох: \"Гацуур ямар өнгөтэй вэ? Од ямар өнгөтэй байвал гоё вэ?\" гэж асууж будуулна.\nБагшийн чиглүүлэх асуулт:\n1. Энэ зураас ямар хэлбэртэй вэ?\n2. Харандаагаа хэрхэн барих вэ?\n3. Ил захидлаа хэнд өгөх вэ?","learner":"Элсэн дээр:\n- Элсэн хайрцагт хуруугаараа гацуурын хугарсан зураас, цасан ширхгийн шулуун зураас зурна.\nЦэгэн зураас дагуулах:\n- Харандаагаа гурван хуруугаараа зөв барина.\n- Ил захидлын загвар дээрх цэгэн зураасыг тасралтгүй дагуулж зурна.\nӨнгө сонгох:\n- Гацуур, од, цасан ширхэгт тохирох өнгөө сонгож будна.\n- \"Гацуурыг ногоон, одыг шар өнгөөр будсан\" гэж сонголтоо хэлнэ.\n- Ил захидлаа хэнд өгөхөө хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Урлагийн буланд будаг, бийр, өнгийн цаас байрлуулж, хүүхдүүдийн бие даасан бүтээлийг ажиглана.","learner":"- Урлагийн буланд будаг, бийрээр өөрийн санаагаар зурна.\n- Өнгөө сонгосон шалтгаанаа хэлнэ."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – гурав дахь уншлага (3): «Ус, цэцэг хоёр» (Төлөвлөгөөний хуудсыг 12.21-ний төлөвлөлтийн дараа үзнэ үү.)\n- Номын үйл явдлыг хүүхдүүдээр түлхүү яриулна.\n- Дүгнэн ярилцах: «Найзыгаа хайрладгаа юугаар харуулж болох вэ?»\n- Шинэ үгсээр өгүүлбэр зохиох: халамжлах, гундах, тэвчээртэй, услах\n- Бүтээл: ус, цэцгийн хуруун хүүхэлдэй хийх","learner":"- Номын нэр, зохиолч, зураачийг санаж хэлнэ.\n- Номын зургийг харж ус, цэцэг хоёрын түүхийг өөрийн үгээр ярина.\n- \"Найзыгаа хайрладгаа ... гэж харуулж болно\" гэж хариулна.\n- Халамжлах, гундах, тэвчээртэй, услах үгсээр өгүүлбэр зохионо.\n- Ус, цэцгийн хуруун хүүхэлдэй хийж, тэдгээрээр ярилцлага тоглоно."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Бичих бэлтгэлийн төв: Цэгэн зураастай ажлын хуудас (шулуун, долгионт, хугарсан).\nУрлагийн төв: Шинэ жилийн ил захидлыг будаж, гялтгануураар чимэглэх.\nХөдөлгөөний төв: Шалан дээрх туузан замаар (тахир, долгионт) алхах.","learner":"Бичих бэлтгэлийн төв:\n- Ажлын хуудсан дээрх шулуун, долгионт, хугарсан цэгэн зураасыг дагуулж зурна.\nУрлагийн төв:\n- Шинэ жилийн ил захидлаа будаж, гялтгануураар чимэглэнэ.\nХөдөлгөөний төв:\n- Шалан дээрх тахир, долгионт туузан замаар тэнцвэрээ хадгалан алхана."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 5 (3). Хөдөлгөөнт тоглоом: «Муур, хулгана»\nЗорилго: Дохиогоор хурдаа өөрчлөн гүйх, бултах, хамтран тоглох; гэрийн тэжээвэр амьтдын тухай мэдлэгийг тоглоомоор бататгах.\nЯвц:\n- Нэг хүүхэд «муур», бусад нь «хулгана» болно. Хулганууд тойргоос гадна «нүх»-тэй.\n- Багш «Муур унтаж байна» гэхэд хулганууд талбайгаар чөлөөтэй гүйнэ.\n- «Муур сэрлээ!» гэхэд хулганууд нүх рүүгээ гүйж, муур тэднийг барихыг оролдоно.\n- Баригдсан хулгана дараагийн муур болно.\nДүрэм: Түлхэлцэхгүй, мөргөлдөхгүй; гулгамтгай газар болгоомжтой гүйнэ.\nДүгнэлт: «Муур хаана амьдардаг вэ? Өвөл түүнд юу хэрэгтэй вэ?» гэж ярилцана.","learner":"- \"Муур\" эсвэл \"хулгана\"-ын дүрээ сонгоно.\n- \"Муур унтаж байна\" гэхэд хулганууд талбайгаар чөлөөтэй гүйнэ.\n- \"Муур сэрлээ!\" гэхэд нүх рүүгээ хурдан гүйж бултана.\n- Баригдвал дараагийн муур болно.\n- Түлхэлцэхгүй, мөргөлдөхгүй тоглоод \"Муурыг өвөл ... арчилна\" гэж хэлнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Замаа ол»\nЗорилго: Зураасыг дагаж хөдлөх, анхаарал төвлөрүүлэх.\nЯвц:\n1. Шалан дээр туузаар шулуун, долгионт, тахир зам гаргана.\n2. Хүүхдүүд аль замаар явахаа сонгож, туузаас гарахгүй алхана.\n3. Багш \"Долгионт зам!\" гэхэд тухайн замын хүүхдүүд хөдөлнө.\nДүрэм: Туузаас гарвал эхнээс нь эхэлнэ.\nДүгнэлт: Өнөөдөр хийсэн ил захидлаа хэнд өгөхөө ярилцана.","learner":"- Шулуун, долгионт, тахир туузан замын хэлбэрийг нэрлэнэ.\n- Аль замаар явахаа сонгож, туузаас гарахгүй алхана.\n- Багшийн \"Долгионт зам!\" гэсэн тушаалыг сонсоод тухайн замаар хөдөлнө.\n- Туузаас гарвал эхнээс нь дахин эхэлнэ.\n- Ил захидлаа хэнд өгөхөө хэлнэ."}]},"2026-12-28":{"method":"Төсөлд суурилсан арга (давтамж)","link":"ХӨГ3.1б. Богино үгтэй дууг бусадтай хамтран дуулна.","competence":"Хамтран ажиллах (баярын бэлтгэлд үүрэг хүлээх), хөгжмийн чадвар (хамтран дуулах)","materials":"Шинэ жилийн баярын бэлтгэлийн үүргийн карт (чимэглэгч, дуучин, урилга хийгч, ширээ засагч), өнгийн цаас, хайч, цавуу, шинэ жилийн дуу","criteria":"Баярын бэлтгэлд тодорхой үүрэг хүлээж, эхлүүлсэн ажлаа дуусгадаг. Богино үгтэй дууг бусадтай хамтран дуулдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Шинэ жил хэдэн хоногийн дараа ирэх вэ?\" гэж хуанлиар тоолуулна.","learner":"- Мэндчилж тойрогт сууна.\n- Хуанлиар шинэ жил хүртэлх өдрүүдийг хуруугаараа тоолно.\n- Баярын тухай мэдрэмжээ (\"Би баярлаж байна\") хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Баярын төлөвлөгөө: \"Манай бүлгийн шинэ жилийн баяр\" төслийг танилцуулж, юу юу хийх хэрэгтэйг хүүхдүүдээр санал болгуулна.\n- Үүрэг хуваарилах: Үүргийн картаас хүүхэд бүр сонгож, багаараа нэгдэнэ (чимэглэгчид, дуучид, урилга хийгчид).\n- Баг бүрийн ажил: Чимэглэгчид цаасан гинж, дуучид дуу давтах, урилга хийгчид эцэг эхдээ урилга будна.\nБагшийн чиглүүлэх асуулт:\n1. Баярт бэлтгэхэд юу юу хийх хэрэгтэй вэ?\n2. Чи ямар үүрэг хүлээх вэ? Яагаад?\n3. Хүн бүр үүргээ гүйцэтгэвэл баяр маань ямар болох вэ?","learner":"Баярын төлөвлөгөө:\n- \"Манай бүлгийн шинэ жилийн баяр\"-т юу юу хийх хэрэгтэйг санал болгоно (чимэглэх, дуулах, урилга хийх).\nҮүрэг хуваарилах:\n- Үүргийн картаас өөрт таалагдсаныг сонгож, \"Би ... хийнэ, учир нь ...\" гэж хэлнэ.\n- Сонгосон багтаа нэгдэнэ.\nБаг бүрийн ажил:\n- Чимэглэгчид цаасан гинж хийнэ.\n- Дуучид шинэ жилийн дууг давтана.\n- Урилга хийгчид эцэг эхдээ урилга будна.\n- Хийж дуусгасан ажлаа бусад багт танилцуулна."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Дүрт тоглоомын буланд баярын хувцас, малгай байрлуулж, хүүхдүүдийн тоглоомыг ажиглана.","learner":"- Баярын хувцас, малгай өмсөж дүрд тоглоно.\n- Найздаа хувцаслахад тусална."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – эхний уншлага (1): «Нянгуудаас салсан нь» (Чанга уншлагын төлөвлөгөөний хуудсыг үзнэ үү.)\n- Номын нэр, хавтас, зохиолч, зураачийг танилцуулж, хэмнэлийг алдагдуулахгүй уншина.\n- Түр зогсож асуух: «Түвшин яагаад гэнэт зогссон бэ? Одоо юу хийх бол?»\n- Шинэ үг: «Нян – нүдэнд харагддаггүй жижиг өвчин үүсгэгч»\n- Уншсаны дараа: «Бид гараа хэзээ хэзээ угаах ёстой вэ?»","learner":"- Номын нэр, хавтасны зургийг харж \"Энэ ном ... тухай байх\" гэж таамаглана.\n- Багшийн уншихыг анхааралтай, тайван сонсоно.\n- Түр зогсох үед \"Түвшин гараа угаана\" гэж таамаглана.\n- «Нян» гэдэг шинэ үгийг давтан хэлж, утгыг нь хэлнэ.\n- \"Бид гадаа тоглосны дараа, хоол идэхийн өмнө, бие зассаны дараа гараа угаана\" гэж хариулна."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: Улаан, шар цаасаар ээлжлүүлэн гинж хийх.\nХөгжмийн төв: Шинэ жилийн дууг хонх, шажигнуураар дагуулан дуулах.\nХэл ярианы төв: Эцэг эхдээ хэлэх урилгын үгийг зохиох.","learner":"Урлагийн төв:\n- Улаан, шар цаасаар ээлжлүүлэн гинж хийнэ.\n- \"Улаан, шар, улаан, шар\" гэж зүй тогтлыг хэлнэ.\nХөгжмийн төв:\n- Шинэ жилийн дууг хонх, шажигнуураар дагуулан найзуудтайгаа хамтран дуулна.\nХэл ярианы төв:\n- \"Манай баярт ирээрэй\" гэж эцэг эхдээ хэлэх урилгын үг зохионо."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 5 (4). Ганцаарчилсан үйл ажиллагаа: Хоёр хөлөөр урагш үсрэх\nЗорилго: Үсрэх хөдөлгөөн сул хүүхдүүдтэй ганцаарчлан ажиллах.\nЯвц:\n- Цасан дээр зурсан зураасуудын дээгүүр хоёр хөлөө нийлүүлэн үсрүүлнэ.\n- Газардахдаа өвдгөө нугалахыг сануулна.\n- Бусад хүүхдүүд цэвэрлэсэн зам дагуу чөлөөтэй тоглоно.","learner":"- Цасан дээр зурсан зураасуудын өмнө зогсоно.\n- Хоёр хөлөө нийлүүлэн зураас дээгүүр урагш үсэрнэ.\n- Газардахдаа өвдгөө нугалж зөөлөн буна.\n- Үсэрсэн тоогоо тоолно.\n- Бусад хүүхдүүд цэвэрлэсэн зам дагуу чөлөөтэй тоглоно."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Цасан бөмбөг дамжуулах»\nЗорилго: Хамтран дуулж, тоглоомын дүрмийг баримтлах.\nЯвц:\n1. Хүүхдүүд тойрог үүсгэж, шинэ жилийн дуу дуулангаа цаасан \"цасан бөмбөг\" дамжуулна.\n2. Дуу зогсоход бөмбөг барьсан хүүхэд баярт ямар үүрэг хүлээснээ хэлнэ.\nДүрэм: Бөмбөгийг шидэхгүй, гараас гарт дамжуулна.\nДүгнэлт: Өнөөдөр хийсэн бэлтгэл ажлаа хамтдаа дүгнэнэ.","learner":"- Тойрог үүсгэн зогсоно.\n- Шинэ жилийн дуу дуулангаа цаасан \"цасан бөмбөг\"-ийг гараас гарт дамжуулна.\n- Дуу зогсоход бөмбөг барьсан бол баярт ямар үүрэг хүлээснээ хэлнэ.\n- Өнөөдрийн бэлтгэл ажлаа хамтдаа дүгнэнэ."}]},"2026-12-30":{"method":"Шинжлэн судлах арга (давтамж)","link":"БНО3.1г. Цаг агаарын байдлыг зураг, тэмдэг ашиглан илэрхийлж, тохирсон хувцас болон хийх үйл ажиллагаагаа сонгож тайлбарлана.","competence":"Өөрийгөө хамгаалах (цаг агаарын аюултай үзэгдлээс болгоомжлох), шүүн тунгаах (шалтгаан, үр дагаврыг тайлбарлах)","materials":"Цасан шуурга, мөстөлт, их хүйтний зурагт карт, цаг агаарын тэмдгийн карт, хүүхэлдэй ба өвлийн хувцас, дэвсгэр","criteria":"Цаг агаарын үзэгдлийг (цасан шуурга, мөстөлт, их хүйтэн) тайлбарлан, насанд хүрэгчийн сануулгатайгаар болгоомжлох үйлдэл хийдэг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, цаг агаарын хуанлид өнөөдрийн тэмдгийг байрлуулна.","learner":"- Мэндчилж тойрогт сууна.\n- Цонхоор харж өнөөдрийн цаг агаарыг ажиглана.\n- Тохирох тэмдгийг сонгож хуанлид байрлуулна."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Зурагт карт: Цасан шуурга, мөстөлт, их хүйтний зургийг үзүүлж \"Энэ үед гадаа юу болох вэ?\" гэж ярилцана.\n- Болгоомжлох арга: Нүүрээ ороолтоор хамгаалах, мөсөн дээр жижиг алхмаар алхах, шуургатай үед томчуудаас холдохгүй байхыг дүрд тоглож үзүүлнэ.\n- Хувцаслах: Хүүхэлдэйг их хүйтэнд тохирох (малгай, ороолт, бээлий, гутал) хувцсаар хувцаслана.\nБагшийн чиглүүлэх асуулт:\n1. Цасан шуурга болбол яах вэ?\n2. Мөсөн дээр яаж алхах вэ? Яагаад?\n3. Их хүйтэнд биеийн аль хэсгийг хамгаалах вэ?","learner":"Зурагт карт:\n- Цасан шуурга, мөстөлт, их хүйтний зургийг харж нэрлэнэ.\n- \"Шуурга болбол юу ч харагдахгүй\", \"Мөсөн дээр халтирна\" гэж юу болохыг тайлбарлана.\nБолгоомжлох арга:\n- Нүүрээ ороолтоор хамгаалах, мөсөн дээр жижиг алхмаар алхах, томчуудаас холдохгүй байхыг дүрд тоглож үзүүлнэ.\nХувцаслах:\n- Хүүхэлдэйг малгай, ороолт, бээлий, гуталтай дулаан хувцаслана.\n- \"Шуургатай үед би томчуудтайгаа гэртээ байна\" гэж хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Дүрт тоглоомын буланд өвлийн хувцас байрлуулж, хүүхдүүд дулаан хувцаслахыг ажиглана.","learner":"- Өвлийн хувцсаа зөв дарааллаар өмсөж дадлага хийнэ.\n- Найздаа ороолтоо ороохад тусална."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – хоёр дахь уншлага (2): «Нянгуудаас салсан нь» (Төлөвлөгөөний хуудсыг 12.28-ны төлөвлөлтийн дараа үзнэ үү.)\n- Номын тухай эргэн сануулах асуулт асууна: «Ээж нь дуудахад Түвшин эхлээд юу хийх гэсэн бэ?»\n- Түр зогсож асуух: «Гар угаах алхмуудыг дугаараар нь тоолж хэлээрэй.», «Нянгууд хаашаа явсан бэ?»\n- Шинэ үг: «Хурууны завсар, эрхий хуруу» – өөрийн гар дээр заах\n- Уншсаны дараа: «Бөмбөлөгтэй саван...» дуугаар гараа дарааллын дагуу угаах дадлага","learner":"- Номын тухай эргэн сануулах асуултад \"Түвшин эхлээд гараа угаалгүй талх авах гэсэн\" гэж хариулна.\n- Номын зургаас машин, нянгуудыг тоолно.\n- Гар угаах алхмуудыг дугаараар нь тоолж хэлнэ.\n- «Хурууны завсар, эрхий хуруу»-г өөрийн гар дээр заана.\n- «Бөмбөлөгтэй саван...» дууг дуулангаа гараа дарааллын дагуу угаах дадлага хийнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Байгаль шинжлэлийн төв: Цаг агаарын тэмдгийг тохирох хувцастай тааруулах.\nУрлагийн төв: \"Цасан шуурга\" – хөх цаасан дээр цагаан будгаар үлээж зурах.\nХөдөлгөөний төв: Дэвсгэр дээр туулай мөлхөлтийн байрлалаас хажуу тийш өнхрөх.","learner":"Байгаль шинжлэлийн төв:\n- Цаг агаарын тэмдгийг тохирох хувцастай тааруулж тайлбарлана.\nУрлагийн төв:\n- Хөх цаасан дээр цагаан будгийг соруулаар үлээж \"Цасан шуурга\" зураг бүтээнэ.\nХөдөлгөөний төв:\n- Дэвсгэр дээр туулай мөлхөлтийн байрлалаас хажуу тийш өнхөрнө."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалгын давтлага (1): Сарын ажиглалтууд\nЗорилго: Сарын турш ажигласан зүйлсээ (өвлийн байгаль, цас, цонхны цан, улиас мод, гэрийн тэжээвэр амьтад) эргэн санаж, ажиглалтаа нэгтгэн дүгнэх.\nЯвц:\n- Талбайг тойрон алхаж, өмнө нь цасаар хучсан модны үндэс, чимэглэсэн мод, цэвэрлэсэн замыг эргэн харна.\n- «Цагаан цасхан», «Гайхамшигт зураач» шүлгийг хамтдаа уншина.\n- Асуулт: «Энэ сард бид юу юу ажигласан бэ?», «Аль ажиглалт хамгийн их таалагдсан бэ? Яагаад?», «Бид мод, амьтдад яаж тусалсан бэ?»","learner":"- Талбайг тойрон алхаж, өмнө нь цасаар хучсан модны үндэс, чимэглэсэн мод, цэвэрлэсэн замыг эргэн харна.\n- «Цагаан цасхан», «Гайхамшигт зураач» шүлгийг цээжээр хэлнэ.\n- Энэ сард ажигласан зүйлсээ (цас, цан, улиас, амьтад) нэрлэнэ.\n- Хамгийн таалагдсан ажиглалтаа шалтгаантай нь ярина.\n- Мод, амьтдад яаж тусалснаа хэлнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Шуурга, нар»\nЗорилго: Цаг агаарын өөрчлөлтөд хурдан хариу үйлдэл хийх.\nЯвц:\n1. Багш \"Нар!\" гэхэд хүүхдүүд чөлөөтэй алхана.\n2. \"Шуурга!\" гэхэд бүгд \"гэр\" (цагираг) рүү орж бие биенээ тэврэнэ.\n3. \"Мөстөлт!\" гэхэд жижиг алхмаар болгоомжтой алхана.\nДүрэм: Гүйхдээ түлхэлцэхгүй.\nДүгнэлт: Аюултай цаг агаарт юу хийхээ давтана.","learner":"- \"Нар!\" гэхэд чөлөөтэй алхана.\n- \"Шуурга!\" гэхэд цагираг-гэр рүүгээ орж найзуудаа тэврэнэ.\n- \"Мөстөлт!\" гэхэд жижиг алхмаар болгоомжтой алхана.\n- Түлхэлцэхгүй гүйнэ.\n- Аюултай цаг агаарт юу хийхээ давтан хэлнэ."}]},"2026-12-31":{"method":"Тоглоомонд суурилсан арга (давтамж)","link":"БНО3.2а. Өөрийн хүйс, төрсөн жилээ хэлж, ангидаа болон гэртээ хийх дуртай зүйлээ тайлбарлана.","competence":"Нийгэм, сэтгэл хөдлөлийн хөгжил (бусадтай ижил төстэйгөө мэдэх), өөрийгөө таних (хүйс, нас, дуртай зүйлээ хэлэх)","materials":"Шинэ жилийн гацуур, хүүхдүүдийн зураг, «Бидний адилхан зүйлс» самбар, наалт, шинэ жилийн ил захидал","criteria":"Бусадтай сэтгэл хөдлөл, сонирхлоороо ижил төстэйгөө мэддэг. Өөрийн хүйс, төрсөн жилээ хэлж, дуртай зүйлээ тайлбарладаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Ирэх жил чи хэдэн настай болох вэ?\" гэж асууж хуруугаараа үзүүлүүлнэ.","learner":"- Мэндчилж тойрогт сууна.\n- Өөрийн нас, төрсөн жил, хүйсээ хэлнэ.\n- Ирэх жил хэдэн настай болохоо хуруугаараа үзүүлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"\"Бидний адилхан зүйлс\": Хүүхэд бүр \"Би ...-д дуртай\" гэж хэлэхэд ижил зүйлд дуртай хүүхдүүд босож, самбарт наалт наана.\n- Харьцуулах: \"Хэн нь бас зураг зурах дуртай вэ?\", \"Хэн нь бууз идэх дуртай вэ?\" гэж ижил сонирхолтой хүүхдүүдийг бүлэглүүлнэ.\n- Ерөөл: Хүүхэд бүр найздаа шинэ жилийн ерөөл хэлж, ил захидлаа солилцоно.\nБагшийн чиглүүлэх асуулт:\n1. Чи найзтайгаа юугаараа адилхан бэ?\n2. Хэн чамтай адилхан зүйлд дуртай вэ?\n3. Шинэ жилээр найздаа юу хүсэх вэ?","learner":"\"Бидний адилхан зүйлс\":\n- \"Би ... -д дуртай\" гэж хэлнэ.\n- Ижил зүйлд дуртай бол босож, самбарт наалт наана.\nХарьцуулах:\n- Ижил сонирхолтой найзуудтайгаа бүлэглэнэ.\n- \"Бид хоёр хоёулаа ... -д дуртай\" гэж хэлнэ.\nЕрөөл:\n- Найздаа шинэ жилийн ерөөл хэлнэ.\n- Ил захидлаа солилцож, \"Баярлалаа\" гэж хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Чөлөөт тоглоомын үеэр ижил сонирхолтой хүүхдүүд хамтран тоглож буйг ажиглана.","learner":"- Ижил сонирхолтой найзтайгаа хамтран тоглоно.\n- Шинэ найзаа тоглоомдоо урина."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – гурав дахь уншлага (3): «Нянгуудаас салсан нь» (Төлөвлөгөөний хуудсыг 12.28-ны төлөвлөлтийн дараа үзнэ үү.)\n- Номын үйл явдлыг хүүхдүүдээр түлхүү яриулна.\n- Дүгнэн ярилцах: «Чи гараа хэзээ угаадаг вэ?», «Гараа угаахгүй бол юу болдог вэ?»\n- Шинэ үгсээр өгүүлбэр зохиох: нян, савандах, угаалтуур, бахархах\n- Бүтээл: гар угаах алхмын зурагт хуудас хийж угаалтуурын дэргэд наах","learner":"- Номын нэр, зохиолч, зураачийг санаж хэлнэ.\n- Номын зургийг харж Түвшингийн түүхийг өөрийн үгээр ярина.\n- \"Би гараа ... үед угаадаг\" гэж хариулна.\n- Нян, савандах, угаалтуур, бахархах үгсээр өгүүлбэр зохионо.\n- Гар угаах алхмын зурагт хуудас хийж, угаалтуурын дэргэд наана."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: \"Миний хөрөг\" – өөрийгөө зурж, дуртай зүйлээ хажууд нь зурах.\nХэл ярианы төв: \"Миний тухай\" – тоглоомон микрофоноор нэр, нас, дуртай зүйлээ танилцуулах.\nХөгжмийн төв: Шинэ жилийн дууг хамтран дуулах.","learner":"Урлагийн төв:\n- Өөрийн хөргийг зурж, хажууд нь дуртай зүйлээ зурна.\nХэл ярианы төв:\n- Тоглоомон микрофоноор нэр, нас, дуртай зүйлээ танилцуулна.\n- Найзынхаа танилцуулгыг сонсоно.\nХөгжмийн төв:\n- Шинэ жилийн дууг найзуудтайгаа хамтран дуулна."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалгын давтлага (2): Сарын хөдөлгөөнт тоглоомууд\nЗорилго: Сарын турш тоглосон хөдөлгөөнт тоглоомуудыг давтах, хүүхдүүдийн сонголтыг хүндэтгэх.\nЯвц:\n- Хүүхдүүдээр «Бөгжинд орлоо», «Галуу-хун», «Бөмбөг дамжуулаарай», «Муур, хулгана» тоглоомоос сонгуулна.\n- Хамгийн олон санал авсан 2 тоглоомыг тоглоно.\n- Асуулт: «Аль тоглоом хамгийн их таалагдсан бэ? Яагаад?»","learner":"- «Бөгжинд орлоо», «Галуу-хун», «Бөмбөг дамжуулаарай», «Муур, хулгана» тоглоомоос дуртайгаа сонгож санал өгнө.\n- Хамгийн олон санал авсан 2 тоглоомыг дүрмийг нь санаж тоглоно.\n- Таалагдсан тоглоомоо шалтгаантай нь хэлнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Надтай адилхан хэн бэ?»\nЗорилго: Бусадтай ижил төстэйгөө мэдэх, баярын уур амьсгалыг мэдрэх.\nЯвц:\n1. Багш \"Цэнхэр өнгөд дуртай хүүхдүүд гацуурыг тойроод алхаарай\" гэх мэт тушаал өгнө.\n2. Тухайн шинжтэй хүүхдүүд хөдөлж, бусад нь алга ташина.\n3. Эцэст нь бүгдээрээ гацуурыг тойрон \"Шинэ жилийн мэнд хүргэе!\" гэж хэлнэ.\nДүрэм: Ээлжээ хүлээж, найзуудаа урамшуулна.\nДүгнэлт: Сарын турш юу сурснаа хамтдаа санаж, шинэ жилийн мэнд хүргэнэ.","learner":"- Багшийн тушаалыг (\"Цэнхэр өнгөд дуртай хүүхдүүд...\") сонсоно.\n- Өөрт тохирох бол гацуурыг тойроод алхана, бусад нь алга ташина.\n- Найзуудтайгаа ижил зүйлээ олж баярлана.\n- Бүгдээрээ гацуурыг тойрон \"Шинэ жилийн мэнд хүргэе!\" гэж хэлнэ."}]}},"readings":[{"days":"12.07 (1-р уншлага), 12.09 (2-р уншлага), 12.11 (3-р уншлага)","book":"Маша ба баавгай","author":"Орос ардын үлгэр. Зураач: ……………………………","goals":"Үгсийн сан болон ерөнхий мэдлэгийг тэлэх\nХарилцан ярилцах, хүүрнэн өгүүлэх чадварыг хөгжүүлэх\nСонсож ойлгох чадварыг хөгжүүлэх\nСэтгэн бодох үйлийг чиглүүлэн дэмжих\nНасанд хүрэгчдийн захиасыг сонсох, ойд төөрөхгүй байх аюулгүй байдлын дүрмийг ойлгох (Байгаль, нийгмийн орчин)\nТом, жижиг (баавгай, Маша, торх) гэж харьцуулах; ойн мөөг, жимсийг тоолох (Математик)","summary":"Маша охин найзуудтайгаа ойд мөөг жимс түүхээр явахад эмээ өвөө нь бие биенээсээ холдохгүй байхыг захина. Маша төөрч, ойн гүнд баавгайн байшинд очно. Баавгай түүнийг үлдээж гэрийн ажил хийлгэнэ. Ухаантай Маша бялуу жигнээд, эмээ өвөөдөө хүргэж өгөхийг баавгайгаас гуйж, өөрөө торхонд нуугдана. Баавгай замдаа амрах гэх бүрт Маша «Би харж байна» гэж хэлнэ. Тосгонд хүрэхэд нохой хуцаж, баавгай айгаад торхоо орхин зугтана. Маша эрүүл саруул гарч ирж, эмээ өвөө нь баярлан магтана. Ном нь 14 нүүртэй.","words":[["Ой, мөөг, жимс – ойд байдаг зүйлс","Төөрөх – замаа олохгүй болох (х. 2–3)","Торх – модон сав (х. 8–9, зураг дээр заах)"],["Баавгай – ойн том амьтан","Пийшин – гэрийн зуух (х. 5)","Хожуул – огтолсон модны үлдэгдэл (х. 10, зураг дээр заах)"],["Тосгон – жижиг суурин","Жигнэх – зууханд бялуу болгох (х. 7)","Үүрэх – нуруундаа авч явах (х. 10, үйлдлээр үзүүлэх)"],["","Захих – юу хийхийг хэлж үлдээх (х. 2)","Тогших, хуцах (х. 12, дуу, үйлдлээр үзүүлэх)"]],"r1":{"Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Эмээ өвөө нь Машад юу гэж захисан бэ? Яагаад?» (хуудас 2)\n«Маша баавгайгаас яаж зугтах бол?» (хуудас 6)\n«Баавгай торхны дотор хэн байгааг мэдэх болов уу?» (хуудас 11)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Төөрөх – замаа олохгүй болох» (хуудас 3)\n«Пийшин – гэрийн зуух» (хуудас 5) зураг дээр заах\n«Торх – модон сав» (хуудас 8) зураг дээр заах","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Маша яаж гэртээ буцаж ирсэн бэ?»\n«Маша ухаантай байсан уу? Яагаад?»\nБаавгай, Маша, торх гурвыг зураг дээр «том – жижиг» гэж харьцуулах."},"r2":{"Номын тухай эргэн санах: Эхлэл, өрнөл, төгсгөл хэсгүүдтэй холбоотой энгийн асуултууд асуух":"«Номд Маша охин ойд мөөг жимс түүхээр явсан тухай гардгийг санаж байгаа биз. Тэр хаана очсон бэ?»\n«Маша яаж зугтахаар шийдсэн бэ?»\n«Үлгэр хэрхэн төгссөн бэ?»","Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Сагсанд хэдэн мөөг байна вэ? Тав хүртэл тоолоорой.» (хуудас 3)\n«Маша баавгайд юу гэж захисан бэ?» (хуудас 8)\n«Маша торхонд яагаад нуугдсан бэ?» (хуудас 9)\n«Баавгай яагаад айгаад зугтсан бэ?» (хуудас 12)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Хожуул – огтолсон модны үлдэгдэл» (хуудас 10) зураг дээр заах\n«Үүрэх – нуруундаа авч явах» (хуудас 10) үйлдлээр үзүүлэх\n«Тогших, хуцах» (хуудас 12) дуу гарган үзүүлэх","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Хэрвээ чи ойд төөрвөл юу хийх вэ?»\nДүрд тоглох: Маша «Би харж байна!», баавгай «Намайг харчихаж» гэх хэсгийг тоглох.\nОйд байдаг зүйлсийн (мөөг, жимс, мод) зургийг ангилж тоолох."},"r3":{"Уншихын өмнө":"Энэ номыг бид хамтдаа 2 удаа уншчихсан учраас номын нэрийг та нар мэдэж байгаа шүү дээ. Энэ номын нэр юу билээ? гэх зэргээр хүүхдийг эхнээс нь татан оролцуулна.\nЭнэ удаа номын хавтас, ард талыг тогтон харуулж, зургийг заан ярилцана. Түүнчлэн ийм сонирхолтой номыг ……………… гэдэг зохиолч, ……………… гэдэг зураач нар бүтээсэн юм байна хэмээн зохиолч, зураачийг танилцуулна.\nНомын зохиолч гэж юу хийдэг хүнийг хэлдэг вэ?\nНомын зураач юу хийдэг вэ?","Уншиж байхдаа":"Зургийг заан юу болж байгаа тухай асууна: «Энд Маша юу хийж байна?», «Баавгай ямар байна?», «Дараа нь юу болох вэ?» Хүүхдийн оролцоо, ойлголт хэр байгаагаас шалтгаалан хэр их хэсгийг өөрөө унших, хэчнээнийг нь хүүхдүүдээр яриулахыг шийднэ. Зөвхөн болсон үйл явдлыг давтан яриулахаас илүүтэйгээр учир шалтгааныг нь холбон тайлбарлах («Маша яагаад төөрсөн бэ?», «Баавгай яагаад хожуул дээр суусангүй вэ?»), сэтгэн бодох үйлийг дэмжинэ.","Уншиж дуусаад":"Дүгнэн ярилцаж ойлголтыг бататгах үүднээс нээлттэй асуулт асуух: «Эмээ өвөөгийнхөө захиасыг сонсох нь яагаад чухал вэ?», «Ойд төөрөхгүйн тулд юу хийх вэ?»\nШинэ сурсан үгсийн хэрэглээг дэмжих: төөрөх, жигнэх, торх, хожуул, үүрэх үгсээр өгүүлбэр зохиолгох\nНомтой холбоотой зураг зурах, бүтээл хийх: цаасан сагс хийж, мөөг жимсний зураг будаж хийх; Маша, баавгайн баг хийх"},"text":"Хуудас 1. Эрт урьдын цагт өвгөн эмгэн хоёр охин Машатайгаа амьдардаг байжээ. Нэгэн удаа Маша охин найзуудтайгаа мөөг жимс түүхээр ой руу явах болжээ.\nХуудас 2. Эмээ өвөө хоёр нь: – Маша охин минь ойд төөрчихөв өө. Нэг нэгнээсээ холдож болохгүй шүү! гэж захив.\nХуудас 3. Охид мөөг жимс түүсээр нэг нэгнээсээ төөрчихөж гэнэ. Тэгээд Маша охин ойн гүнд нэгэн модон байшин байхыг олж харав.\nХуудас 4. Байшинд баавгай амьдардаг юмсанжээ. Баавгай Маша охиныг хараад маш их баярлаж гэнэ.\nХуудас 5. Тэгээд баавгай: – Манайд надтай амьдарч түлээг минь хагалан, пийшинг галлаж хоол хийж өгөх болж дээ. Харин зугтаах гэвэл би чамайг бариад л авна шүү гэлээ.\nХуудас 6. Тэгээд Маша охин яаж зугтаах вэ гээд бодоод л байж, бодоод л байж гэнэ.\nХуудас 7. Нэгэн өдөр баавгай ойгоос буцаж ирэхэд нь Маша охин: – Би амтат халуун бялуу жигнэсэн. Тосгонд байгаа эмээ өвөө хоёрт минь аваачаад өгөөч гэж гуйв.\nХуудас 8. – Замдаа торхыг битгий нээгээрэй. Амтат бялуунаас битгий идээрэй. Би өндөр нарс модон дээр авирч гараад харах болно шүү гэжээ.\nХуудас 9. Маша охин: – Гадаа бороо орж байгаа эсэхийг хараад ирээч гэлээ. Баавгайг гарсан хойгуур Маша охин торхонд ороод толгойгоо бялуугаар хучиж амжив.\nХуудас 10. Баавгай орж ирээд торх бэлэн болсныг хараад нуруундаа үүрээд тосгон руу явжээ. Баавгай алхсаар байгаад ядарсан тул хожуул дээр амраад халуун бялуу идье гэж бодоод суув.\nХуудас 11. Гэтэл ч Маша охин торхон дотроос: – Би харж байна. Хожуул дээр битгий суу. Халуун бялуу битгий ид гэв. – Намайг харчихаж шүү гээд баавгай торхоо үүрээд цааш явав. Баавгай явсаар тосгонд ирж гэнэ.\nХуудас 12. Тэгээд эмээ өвөө хоёрын байшинг олж очоод хаалгыг нь тогштол нохой нь баавгай руу дайран хуцав. Баавгай ч айсандаа торхоо орхиод эргэж ч харалгүй ой руугаа зугтав.\nХуудас 13. Маша охин торхноос амьд мэнд эрүүл саруул гарч ирэв.\nХуудас 14. Эмээ өвөө нь ч баярлан хөөрөн Маша охиноо тэврэн ухаантай шүү хэмээн магтаж хацар дээр нь үнсэв гэнэ. Үлгэр ийнхүү амар сайхандаа жаргажээ."},{"days":"12.14 (1-р уншлага), 12.16 (2-р уншлага), 12.18 (3-р уншлага)","book":"Нугасны муухай дэгдээхэй","author":"Зохиолч: Ханс Кристиан Андерсен. Зураач: ……………………………","goals":"Үгсийн сан болон ерөнхий мэдлэгийг тэлэх\nХарилцан ярилцах, хүүрнэн өгүүлэх чадварыг хөгжүүлэх\nСонсож ойлгох чадварыг хөгжүүлэх\nСэтгэн бодох үйлийг чиглүүлэн дэмжих\nБусдыг гадаад төрхөөр нь шүүхгүй байх, өрөвч сэтгэлтэй байх, улирлын өөрчлөлтийг таних (Байгаль, нийгмийн орчин)\nЗурган дээрх шувуудыг тав хүртэл тоолох; том, жижиг гэж харьцуулах (Математик)","summary":"Нугасны сүүлчийн дэгдээхэй бусдаасаа өөр, царай муутай төржээ. Шувууны хашааныхан түүнийг шоолж дайрахад тэвчиж ядан зугтана. Тэр намаг, хөгшин эмэгтэйн овоохой, тариачны гэр гээд олон газар тэнүүчилж, хаана ч орон гэргүй, ганцаардана. Хүйтэн өвөл нуурын эрэгт өнгөрөөж, хавар болоход нисэж сурна. Хунгуудтай найзлахаар шийдэн тэдэн дээр газардахдаа усан дахь тусгалаа хараад өөрөө үзэсгэлэнтэй хун болсноо мэднэ. Хунгууд түүнийг сүрэгтээ баяртайгаар хүлээн авна. Ном нь 15 нүүртэй.","words":[["Нугас, дэгдээхэй, хун – номын шувууд","Доромжлол – муу үг хэлж, гомдоох (х. 4)","Хун – цагаан урт хүзүүтэй шувуу (х. 8, зураг дээр заах)"],["Ферм, хашаа – тэжээвэр амьтдын газар","Тэнүүчлэх – гэр оронгүй хэсэх (х. 6)","Мөсөнд хөлдөх (х. 10, зураг дээр заах)"],["Өвөл, хавар – улирлууд","Гологдох – бусдад хүлээн авагдахгүй байх (х. 9)","Нисэх, газардах (х. 12–14, гараараа далавч дэвэх)"],["","Сүрэг – олон шувуу хамт (х. 15)","Тусгал – усанд харагдах дүрс (х. 14, толинд харуулах)"]],"r1":{"Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Бусад шувууд яагаад дэгдээхэйд дургүй байсан бэ? Дэгдээхэй ямар санагдаж байгаа бол?» (хуудас 2)\n«Дэгдээхэй хаашаа явах бол?» (хуудас 7)\n«Усанд харагдаж байгаа нь хэн бэ?» (хуудас 14)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Доромжлол – муу үг хэлж, гомдоох» (хуудас 4)\n«Тэнүүчлэх – гэр оронгүй хэсэх» (хуудас 6)\n«Тусгал – усанд харагдах дүрс» (хуудас 14) толинд харуулж тайлбарлах","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Муухай дэгдээхэй эцэст нь хэн болсон бэ?»\n«Хашааны шувууд дэгдээхэйтэй зөв харьцсан уу?»\nНугасны дэгдээхэй ба хуны зургийг харьцуулж, юугаараа ялгаатайг ярилцах."},"r2":{"Номын тухай эргэн санах: Эхлэл, өрнөл, төгсгөл хэсгүүдтэй холбоотой энгийн асуултууд асуух":"«Номд бусдаасаа өөр төрсөн дэгдээхэйн тухай гардгийг санаж байгаа биз. Түүнийг яагаад муухай гэж дуудсан бэ?»\n«Дэгдээхэй хаа хаана очсон бэ?»\n«Үлгэр хэрхэн төгссөн бэ?»","Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Шар дэгдээхэйнүүдийг тоолоорой. Хэд байна вэ?» (хуудас 1)\n«Хун шувуудыг тоолоорой. Тэд ямар өнгөтэй вэ?» (хуудас 8)\n«Өвөл болоход юу болсон бэ? Хэн тусалсан бэ?» (хуудас 10)\n«Дэгдээхэй яагаад хүүхдүүдээс айсан бэ?» (хуудас 11)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Гологдох – хүлээн авагдахгүй байх» (хуудас 9)\n«Мөсөнд хөлдөх» (хуудас 10) зураг дээр заах\n«Сүрэг – олон шувуу хамт» (хуудас 15)","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Хэрвээ чи тэр хашаанд байсан бол дэгдээхэйтэй яаж харьцах байсан бэ?»\nУлирлын зургуудыг (өвөл, хавар) номын үйл явдалтай холбож ярилцах.\nХөдөлгөөнт тоглоом: «дэгдээхэй» далавчаа дэвж нисэж сурах."},"r3":{"Уншихын өмнө":"Энэ номыг бид хамтдаа 2 удаа уншчихсан учраас номын нэрийг та нар мэдэж байгаа шүү дээ. Энэ номын нэр юу билээ? гэх зэргээр хүүхдийг эхнээс нь татан оролцуулна.\nЭнэ удаа номын хавтас, ард талыг тогтон харуулж, зургийг заан ярилцана. Түүнчлэн ийм сонирхолтой номыг ……………… гэдэг зохиолч, ……………… гэдэг зураач нар бүтээсэн юм байна хэмээн зохиолч, зураачийг танилцуулна.\nНомын зохиолч гэж юу хийдэг хүнийг хэлдэг вэ?\nНомын зураач юу хийдэг вэ?","Уншиж байхдаа":"Зургийг заан юу болж байгаа тухай асууна: «Энд дэгдээхэй юу хийж байна?», «Тэр ямар санагдаж байна?», «Дараа нь юу болох вэ?» Хүүхдийн оролцоо, ойлголт хэр байгаагаас шалтгаалан хэр их хэсгийг өөрөө унших, хэчнээнийг нь хүүхдүүдээр яриулахыг шийднэ. Зөвхөн болсон үйл явдлыг давтан яриулахаас илүүтэйгээр учир шалтгааныг нь холбон тайлбарлах («Дэгдээхэй яагаад гэрээсээ зугтсан бэ?», «Тэр яагаад бусдаас өөр харагдаж байсан бэ?»), сэтгэн бодох үйлийг дэмжинэ.","Уншиж дуусаад":"Дүгнэн ярилцаж ойлголтыг бататгах үүднээс нээлттэй асуулт асуух: «Бусдыг гадаад төрхөөр нь шүүж болох уу?», «Найз нь ганцаардаж байвал чи яах вэ?»\nШинэ сурсан үгсийн хэрэглээг дэмжих: доромжлол, тэнүүчлэх, тусгал, сүрэг үгсээр өгүүлбэр зохиолгох\nНомтой холбоотой зураг зурах, бүтээл хийх: цаасан хун хийх; «Миний найз» сэдвээр зураг зурах"},"text":"Хуудас 1. Хуучин фермийн ойролцоох шугуйд нэгэн нугас дэгдээхэй гаргасан боловч түүний сүүлчийн дэгдээхэй нь бусадтай адилгүй, маш царай муутай харагдаж байв.\nХуудас 2. Шувууны хашаанд оршин суугчид муухай дэгдээхэйнд тэр даруй дургүйцсэн тул дэгдээхэй рүү байнга дайрч довтолдог байжээ.\nХуудас 3. Эхэндээ дэгдээхэйгээ хамгаалж байсан эхийнх нь хүртэл хандах байдал сүүлдээ хүйтрэв.\nХуудас 4. Дэгдээхэй энэ доромжлолыг тэвчиж чадалгүй хашаанаасаа намаг руу зугтаж, гадаад төрхөө үл харгалзан зэрлэг галуунуудтай нөхөрлөх болжээ.\nХуудас 5. Гэтэл удалгүй галуунуудыг анчид алахад ганцаараа хоцров.\nХуудас 6. Үүний дараа дэгдээхэй намгаас явж тэнүүчлэхдээ хөгшин эмэгтэй, муур, тахиа амьдардаг овоохойг олжээ. Хөгшин эмэгтэй дэгдээхэйг өндөглөнө гэж найдаж, дэргэдээ байлгадаг байв.\nХуудас 7. Гэрт амьдардаг муур, тахиа хоёр дэгдээхэйг шоолж эхэлсэн бөгөөд гэнэт тэрээр усанд сэлэхийг хүсээд тэднээс явж нуур орчим амьдрахаар болжээ.\nХуудас 8. Нэгэн удаа муухай дэгдээхэй нууран дээр хун шувуудыг хараад урьд өмнө нь хэнийг ч хайрлаж байгаагүй шигээ дурлажээ.\nХуудас 9. Гэвч өмнөх шигээ гологдох вий гэж эмээж тэдэнд ойртож зүрхлэхгүй далдаас хардаг байжээ.\nХуудас 10. Ийнхүү цаг хугацаа өнгөрсөөр өвөл болоход дэгдээхэй мөсөнд хөлдсөн байсан тул хажуугаар нь өнгөрч байсан нэгэн тариачин түүнийг аваад гэртээ авчирчээ.\nХуудас 11. Нугасны дэгдээхэй шинэ байрандаа удаан байсангүй. Түүнтэй тоглохыг хүссэн хүүхдүүдээс айж, зугтаажээ.\nХуудас 12. Дэгдээхэй нуурын эрэг дээрх бутанд өвөлжөөд, хавар ирэхэд нисэж сурсан юм.\nХуудас 13. Нэгэн өдөр тэр нуурын дээгүүр нисэж явахдаа хунгууд сэлж байхыг хараад тэд түүнийг хөөхөөр байсан ч тэдэнтэй найзлахаар хатуу шийджээ.\nХуудас 14. Гэвч усан дээр дэргэд нь газардах үедээ дэгдээхэй санамсаргүйгээр өөрийн тусгалыг хараад өөрийгөө тэдэнтэй адилхан үзэсгэлэнтэй залуу хун байгаагаа олж харсан байна.\nХуудас 15. Ийнхүү нөгөө хунгууд түүнийг сүрэгтээ баяртайгаар хүлээн авсан байна. Дөнгөж саяхан муухай дэгдээхэй ийм аз жаргалыг мөрөөдөж ч байгаагүй ажээ..."},{"days":"12.21 (1-р уншлага), 12.23 (2-р уншлага), 12.25 (3-р уншлага)","book":"Ус, цэцэг хоёр","author":"Зохиолч: ……………………………   Зураач: ……………………………","goals":"Үгсийн сан болон ерөнхий мэдлэгийг тэлэх\nХарилцан ярилцах, хүүрнэн өгүүлэх чадварыг хөгжүүлэх\nСонсож ойлгох чадварыг хөгжүүлэх\nСэтгэн бодох үйлийг чиглүүлэн дэмжих\nУргамал ургахад ус хэрэгтэйг ойлгох; хайраа үгээр биш үйлдлээр илэрхийлэх, бусдад халамж тавих (Байгаль, нийгмийн орчин)\nЦаг хугацааны дараалал (өдөр, шөнө; эхлээд, дараа нь) ойлгох (Математик)","summary":"Нэгэн өдөр ус цэцэг хоёр тааралдаж найзууд болно. Цэцэг усанд хайртай болж, сайхан үнэрээ зөвхөн түүнд зориулна. Ус ч цэцэгт хайртай болно. Гэвч ус зөвхөн «Би чамд хайртай» гэж хэлэхээс өөр юу ч хийдэггүй, цэцгийг огт халамжилдаггүй. Цэцэг улам гундаж, өнгө нь бүдгэрч, хэвтэрт орно. Сэтгэл зовсон ус эмч дуудахад эмч «Түүнд өвчин байхгүй, түүнийг огт услаагүй байна» гэнэ. Ус хайрыг зөвхөн үгээр биш үйлдлээр илэрхийлэх ёстойг ойлгоно. Ном нь 15 нүүртэй.","words":[["Ус, цэцэг – номын гол дүрүүд","Халамжлах – анхаарч, тусалж байх (х. 5)","Услах (х. 14, савтай усаар үзүүлэх)"],["Найз, хайр","Гундах – цэцэг хатаж бүдгэрэх (х. 10)","Шарлах, хатах (х. 10, зураг дээр заах)"],["Эмч","Тэвчээртэй – удаан хүлээж чаддаг (х. 8)","Үнэр цацах (х. 3, үнэрлэж үзүүлэх)"],["","Нухацтай – ноцтой, анхааралтай (х. 14)","Толгойгоо өндийлгөх (х. 12, биеэр үзүүлэх)"]],"r1":{"Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Цэцэг ус хоёр хэрхэн найзууд болсон бэ?» (хуудас 1)\n«Цэцэг яагаад «Ус надад хайртай болов уу?» гэж бодсон бэ?» (хуудас 5)\n«Цэцэг яагаад өвдөөд байна вэ?» (хуудас 10)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Халамжлах – анхаарч, тусалж байх» (хуудас 5)\n«Гундах – хатаж бүдгэрэх» (хуудас 10) зураг дээр заах\n«Тэвчээртэй» (хуудас 8)","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Цэцэг яагаад өвдсөн бэ?»\n«Ус юуг ойлгосон бэ?»\nЦэцэг ургахад юу хэрэгтэй вэ (ус, нар, хөрс) гэж ярилцах."},"r2":{"Номын тухай эргэн санах: Эхлэл, өрнөл, төгсгөл хэсгүүдтэй холбоотой энгийн асуултууд асуух":"«Номд ус цэцэг хоёр найзууд болсон тухай гардгийг санаж байгаа биз. Цэцэг усанд юу бэлэглэсэн бэ?»\n«Ус цэцэгт юу гэж хэлдэг байсан бэ?»\n«Үлгэр хэрхэн төгссөн бэ?»","Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Цэцэг хэдэн дэлбээтэй вэ? Тоолоорой.» (хуудас 1)\n«Өдөр, шөнийн зургийг заагаарай.» (хуудас 7)\n«Эмч юу гэж хэлсэн бэ?» (хуудас 14)\n«Ус юу хийх ёстой байсан бэ?» (хуудас 15)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Шарлах, хатах» (хуудас 10) зураг дээр заах\n«Нухацтай» (хуудас 14)\n«Услах» (хуудас 15) усалгуураар үзүүлэх","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Чи хайртай хүндээ хайраа юугаар харуулдаг вэ?»\nАнги дахь цэцгийг хамтдаа услах, өдөр бүр хэн услахыг хуваарилах.\nХатсан ба эрүүл цэцгийн зургийг харьцуулах."},"r3":{"Уншихын өмнө":"Энэ номыг бид хамтдаа 2 удаа уншчихсан учраас номын нэрийг та нар мэдэж байгаа шүү дээ. Энэ номын нэр юу билээ? гэх зэргээр хүүхдийг эхнээс нь татан оролцуулна.\nЭнэ удаа номын хавтас, ард талыг тогтон харуулж, зургийг заан ярилцана. Түүнчлэн ийм сонирхолтой номыг ……………… гэдэг зохиолч, ……………… гэдэг зураач нар бүтээсэн юм байна хэмээн зохиолч, зураачийг танилцуулна.\nНомын зохиолч гэж юу хийдэг хүнийг хэлдэг вэ?\nНомын зураач юу хийдэг вэ?","Уншиж байхдаа":"Зургийг заан юу болж байгаа тухай асууна: «Энд цэцэг ямар байна?», «Ус юу хийж байна?», «Дараа нь юу болох вэ?» Хүүхдийн оролцоо, ойлголт хэр байгаагаас шалтгаалан хэр их хэсгийг өөрөө унших, хэчнээнийг нь хүүхдүүдээр яриулахыг шийднэ. Зөвхөн болсон үйл явдлыг давтан яриулахаас илүүтэйгээр учир шалтгааныг нь холбон тайлбарлах («Цэцэг яагаад гундсан бэ?», «Ус яагаад цэцгийг услаагүй бэ?»), сэтгэн бодох үйлийг дэмжинэ.","Уншиж дуусаад":"Дүгнэн ярилцаж ойлголтыг бататгах үүднээс нээлттэй асуулт асуух: «Найзыгаа хайрладгаа юугаар харуулж болох вэ?», «Ургамлыг яаж арчлах вэ?»\nШинэ сурсан үгсийн хэрэглээг дэмжих: халамжлах, гундах, тэвчээртэй, услах үгсээр өгүүлбэр зохиолгох\nНомтой холбоотой зураг зурах, бүтээл хийх: үр суулгаж, өдөр бүр услан ургахыг ажиглах; ус, цэцгийн хуруун хүүхэлдэй хийх"},"text":"Хуудас 1. Нэг өдөр ус цэцэг хоёр тааралдаж найзууд болцгоожээ. Эхний үед сайхан найзууд шиг үерхэж байлаа. Мэдээж бие биеэ танихын тулд цаг хугацаа хэрэгтэй байлаа.\nХуудас 2. Цаг хугацаа улиран өнгөрсөөр, цэцэг маш их аз жаргалтай болжээ. Аз жаргалдаа умбасан тэрээр усанд хайртай болсноо ойлгожээ.\nХуудас 3. Анхны хайртайгаа учирсан цэцэг тансаг сайхан үнэрээ тал бүр лүү цацан «Энэ сайхан үнэрийг зөвхөн ус чамдаа л зориулъя» гэж байв.\nХуудас 4. Хэсэг хугацааны дараа ус ч гэсэн цэцгэнд хайртай болсноо ойлгожээ. Цэцгэнд өгсөн усны хайр нь ч гэсэн анхных нь байлаа.\nХуудас 5. Өдөр хоног ээлжлэн өнгөрсөөр цэцэг, «Ус надад хайртай болов уу?» гэж бодож эхлэв. Яагаад гэвэл ус цэцгийг нэг их анхааран халамжилдаггүй байв. Гэтэл цэцэг иймэрхүү байдалд огтхон ч дасаагүй байлаа.\nХуудас 6. Цэцэг усанд: – Би чамд хайртай гэхэд ус: – Би ч гэсэн чамд хайртай гэв.\nХуудас 7. Цаг хугацаа өнгөрсөөр л... Цэцэг дахиад л: – Би чамд хайртай гэв. Ус: – Би ч бас гэлээ.\nХуудас 8. Цэцэг тэвчээртэй хүлээсээр л байлаа. Гэвч цэцгийн сайхан үнэр алга болсоор өөрт байсан эцсийн сайхан үнэрээ усанд зориулж хайртай гэдгээ дахин хэлэв.\nХуудас 9. Ус: – Би чамд хайртай гэдгээ хэлсэн л биз дээ гэв.\nХуудас 10. Цэцэг улам л гундсаар хэвтэрт оржээ. Хөөрхий цэцэг хүндээр өвдсөн байв. Өнгө нь гундаж, үзүүр нь шарлаж эхлэв.\nХуудас 11. Ус хайртынхаа толгойг нь түшин хажууд нь суудаг байлаа. Цэцэг үхэж байлаа.\nХуудас 12. Гэвч тэр эцсийн удаа хамаг хүчээ шавхан толгойгоо өндийлгөн усанд: – Би чамд үнэн сэтгэлээсээ хайртай гэв.\nХуудас 13. Энэ байдалд сэтгэл нь шаналсан ус эцсийн арга болох эмч дуудав. Эмч цэцгийг үзээд: – Биеийн байдал найдваргүй. Түүний төлөө одоо юу ч хийж чадахаасаа өнгөрсөн гэв.\nХуудас 14. Ус эмчээс хайртыгаа ямар өвчнөөр өвдсөнийг нь асуув. Эмч ус руу их л нухацтай харснаа: – Түүнд ямар ч өвчин байхгүй. Түүнийг огтхон ч услаагүй байна гэв.\nХуудас 15. Ус «Зөвхөн би чамд хайртай гэдэг үгээр хайраа илэрхийлж болдоггүй» ойлгожээ."},{"days":"12.28 (1-р уншлага), 12.30 (2-р уншлага), 12.31 (3-р уншлага)","book":"Нянгуудаас салсан нь","author":"Зохиолч: ……………………………   Зураач: ……………………………","goals":"Үгсийн сан болон ерөнхий мэдлэгийг тэлэх\nХарилцан ярилцах, хүүрнэн өгүүлэх чадварыг хөгжүүлэх\nСонсож ойлгох чадварыг хөгжүүлэх\nСэтгэн бодох үйлийг чиглүүлэн дэмжих\nГараа хэзээ, хэрхэн угаах ёстойг мэдэж, эрүүл ахуйн дадалд суралцах (Байгаль, нийгмийн орчин)\nГар угаах дарааллыг 1-4 гэж тоолж, дарааллаар нь хэлэх (Математик)","summary":"Түвшин гадаа элсэн дээр тоглох дуртай. Түүний хурууны завсарт нүдэнд харагддаггүй нянгууд нуугдаж, гэдсэнд нь орохыг хүлээнэ. Ээж нь хоолонд дуудахад Түвшин гараа угаалгүй талх руу сунгах гэснээ шороотой гараа хараад зогсоно. Тэр савангаа аван дуулж, алга, хурууны завсар, эрхий хуруугаа сайтар угааж, нянгуудыг цэвэр усаар урсгана. Цэвэр гараар идсэн хоол нь илүү амттай болж, Түвшин өөрөөрөө бахархана. Ном нь 9 нүүртэй бөгөөд гадаа тоглосны дараа, хоол идэхийн өмнө, бие зассаны дараа гараа савандаж угаахыг сургадаг.","words":[["Нян – нүдэнд харагддаггүй жижигхэн өвчин үүсгэгч","Шивнэлдэх – чимээ аалиханаар ярих (х. 2)","Савандах – гараа савандаж хөөсрүүлэх (х. 5–6, гараараа үзүүлэх)"],["Угаалтуур – гар угаадаг газар","Бахархах – өөрөөрөө баярлан омогших (х. 8)","Хурууны завсар, эрхий хуруу (х. 6, өөрийн гар дээр заах)"],["Саван, хөөс – гар угаахад хэрэглэдэг","Дэвхцэх – баярлан үсрэх (х. 3)","Урсгах – ус аваад явах (х. 7, зураг дээр заах)"]],"r1":{"Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Нянгууд яагаад Түвшинд хоол идээрэй гэж хүсч байна вэ?» (хуудас 2)\n«Түвшин яагаад гэнэт зогссон бэ? Одоо юу хийх бол?» (хуудас 4)\n«Нянгууд яагаад айгаад байна вэ?» (хуудас 6)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Нян – нүдэнд харагддаггүй жижиг өвчин үүсгэгч» (хуудас 2) томруулдаг шилтэй зургийг заах\n«Шивнэлдэх – аалиханаар ярих» (хуудас 2) шивнэж үзүүлэх\n«Савандах – гараа хөөсрүүлэх» (хуудас 5) гараараа үзүүлэх","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Түвшин гараа хэзээ угаасан бэ?»\n«Бид гараа хэзээ хэзээ угаах ёстой вэ?»\nНомын 6-р хуудасны 1–4 зургийг харж, гар угаах дарааллыг хамтдаа хэлэх."},"r2":{"Номын тухай эргэн санах: Эхлэл, өрнөл, төгсгөл хэсгүүдтэй холбоотой энгийн асуултууд асуух":"«Номд Түвшин гэдэг хүү гадаа тоглох дуртай тухай гардгийг санаж байгаа биз. Түүний гарт хэн нуугдаж байсан бэ?»\n«Ээж нь дуудахад Түвшин эхлээд юу хийх гэсэн бэ?»\n«Төгсгөлд нь Түвшин юу гэж хэлсэн бэ?»","Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Түвшин юугаар тоглож байна? Зурагт хэдэн машин байна вэ? Тоолоорой.» (хуудас 1)\n«Нянгуудыг тоолоорой. Хэдэн нян байна вэ?» (хуудас 2)\n«Гар угаах алхмуудыг дугаараар нь тоолж хэлээрэй.» (хуудас 6)\n«Нянгууд хаашаа явсан бэ?» (хуудас 7)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Угаалтуур – гар угаадаг газар» (хуудас 5) зураг дээр заах\n«Хурууны завсар, эрхий хуруу» (хуудас 6) өөрийн гар дээр заах\n«Урсгах – ус аваад явах» (хуудас 7) гараараа үзүүлэх","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Хэрвээ Түвшин гараа угаагаагүй бол юу болох байсан бэ?»\nДадлага: хүүхэд бүр «Бөмбөлөгтэй саван, хөөстэй саван, анхилуун саван!» гэж дуулангаа гараа дарааллын дагуу угаах.\nГар угаах 4 алхмын зургийг дараалалд нь тавих."},"r3":{"Уншихын өмнө":"Энэ номыг бид хамтдаа 2 удаа уншчихсан учраас номын нэрийг та нар мэдэж байгаа шүү дээ. Энэ номын нэр юу билээ? гэх зэргээр хүүхдийг эхнээс нь татан оролцуулна.\nЭнэ удаа номын хавтас, ард талыг тогтон харуулж, зургийг заан ярилцана. Түүнчлэн ийм сонирхолтой номыг ……………… гэдэг зохиолч, ……………… гэдэг зураач нар бүтээсэн юм байна хэмээн зохиолч, зураачийг танилцуулна.\nНомын зохиолч гэж юу хийдэг хүнийг хэлдэг вэ?\nНомын зураач юу хийдэг вэ?","Уншиж байхдаа":"Зургийг заан юу болж байгаа тухай асууна: «Энд Түвшин юу хийж байна?», «Түүний гар ямар байна?», «Дараа нь юу болох вэ?» Хүүхдийн оролцоо, ойлголт хэр байгаагаас шалтгаалан хэр их хэсгийг өөрөө унших, хэчнээнийг нь хүүхдүүдээр яриулахыг шийднэ. Зөвхөн болсон үйл явдлыг давтан яриулахаас илүүтэйгээр учир шалтгааныг нь холбон тайлбарлах («Түвшин яагаад гараа угаах болсон бэ?», «Цэвэр гараар идсэн хоол яагаад илүү амттай болсон бэ?»), сэтгэн бодох үйлийг дэмжинэ.","Уншиж дуусаад":"Дүгнэн ярилцаж ойлголтыг бататгах үүднээс нээлттэй асуулт асуух: «Чи гараа хэзээ угаадаг вэ?», «Гараа угаахгүй бол юу болдог вэ?»\nШинэ сурсан үгсийн хэрэглээг дэмжих: нян, савандах, угаалтуур, бахархах үгсээр өгүүлбэр зохиолгох\nНомтой холбоотой зураг зурах, бүтээл хийх: нян гэдэг жижигхэн амьтдыг зурах; гар угаах алхмын зурагт хуудас хийж угаалтуурын дэргэд наах"},"text":"Хуудас 1. Түвшин гадаа тоглох дуртай. Тэр өдөржингөө элсэн дээр цамхаг барьж, машин уралдуулж тоглодог.\nХуудас 2. Гэтэл Түвшингийн хурууны завсарт нүдэнд харагддаггүй «Нянгууд» нуугдаж байлаа. Тэд: «Хурдан хоол идээрэй, бид чиний гэдэс рүү орж тогломоор байна!» гэж шивнэлдэнэ.\nХуудас 3. «Миний хүү, хоол бэлэн боллоо!» гэж ээж нь дуудав. Түвшин гараа угаалгүй шууд талх руу гараа сунгалаа. Нянгууд баярлан дэвхцэж эхлэв.\nХуудас 4. Гэтэл Түвшин гэнэт зогсов. «Байзаарай! Миний гар шороо болчихож. Ийм гараар хоол идвэл нянгууд миний гэдсийг өвтгөнө шүү дээ» гэж бодлоо.\nХуудас 5. Тэр угаалтуур руу гүйж очоод савангаа авлаа. «Бөмбөлөгтэй саван, хөөстэй саван, анхилуун саван!» гэж дуулна.\nХуудас 6. Тэр гараа угаахдаа алгаа үрлээ, хурууны завсраа сайтар угаалаа, мөн эрхий хуруугаа ч мартсангүй. Нянгууд савангийн хөөснөөс айж: «Өө үгүй ээ, бид устаж байна!» гэлээ.\nХуудас 7. Цэвэрхэн ус нянгуудыг урсгаад аваад явчихав. Баяртай, муухай нянгууд аа! Түвшингийн гар одоо цэвэрхэн боллоо.\nХуудас 8. Одоо л хоол илүү амттай боллоо! «Би өөрөө гараа угаасан, би нянгуудыг бүгдийг нь байхгүй болгосон» гэж Түвшин бахархалтай хэлэв.\nХуудас 9. Гадаа тоглосны дараа, хоол идэхийн өмнө, бие зассаны дараа гараа заавал савандаж угааж байгаарай."}]}}},{"name":"БЭЛТГЭЛ","level":"IV түвшин (бэлтгэл бүлэг)","teacher":"Б. ЗОЛЦЭЦЭГ","school":"ЗҮҮНБАЯН-УЛААН СУМЫН ХҮҮХДИЙН ЦЭЦЭРЛЭГИЙН","year":"2026-2027","approver":"Ц. ОДОНЧИМЭГ","date":"2026.08.31","place":"БАЯН-УЛААН","directions":[{"name":"НИЙГЭМ-СЭТГЭЛ ХӨДЛӨЛ","rows":[{"area":"Өөрийгөө таних","sub":"Өөрийгөө ойлгож мэдрэх","code":"НСХ4.1а","text":"Сэтгэлийн мэдрэмжээ таатай, таагүй байгааг илэрхийлдэг болно.","months":[{"t":"u","code":"ХЯ4.2а","text":"Тодорхой сэдвээр санаа бодлоо илэрхийлж, идэвхтэй ярилцана."},{"t":"u","code":"ХӨГ4.1б","text":"Дуу, аялгууг гарын дохиогоор дуулж, аялна."},{"t":"d"},{"t":"d"},{"t":"d"},{"t":"u","code":"ЗУ4.1а","text":"Уран зургийн үйл явдал, баримлын дүрийн талаарх ойлголтоо бусдад тайлбарлана."},{"t":"d"},{"t":""},{"t":""}]},{"area":"Өөрийгөө таних","sub":"Өөрийгөө энэрэн хайрлах","code":"НСХ4.1б","text":"Өөрийн дуртай дургүй, чадах чадахгүй зүйлсийг тайлбарлаж сонголт хийдэг болно.","months":[{"t":"u","code":"БНО4.2а","text":"Өөрийнхөө тухай танилцуулж, бусдын сонирхол, ялгаатай байдалд хүндэтгэлтэй хандана."},{"t":"d"},{"t":"u","code":"ХЭМ4.2в","text":"Хүнсний бүтээгдэхүүний төрлийг мэдэж, насанд хүрэгчтэй хамтран хялбар зууш бэлтгэнэ."},{"t":"d"},{"t":"d"},{"t":""},{"t":""},{"t":""},{"t":""}]},{"area":"Өөрийгөө таних","sub":"Өөрийгөө удирдах","code":"НСХ4.1в","text":"Тайвшрах аргаас насанд хүрэгчийн тусламжтай хэрэглэдэг болно.","months":[{"t":""},{"t":"u","code":"ХЯ4. (() => {
  const KEY = 'kg-annual-plan-v1';
  const MONTHS = ORIGINAL.months;               // ['09',...,'05']
  const TERMS = [['1 улирал', 3], ['2 улирал', 3], ['3 улирал', 3]];
  const GROUP_EM = { 'БАГА': '🐣', 'ДУНД': '🐰', 'АХЛАХ': '🦁', 'БЭЛТГЭЛ': '🎒' };
  const DIR_EM = { 'НИЙГЭМ-СЭТГЭЛ ХӨДЛӨЛ': '💛', 'ХӨДӨЛГӨӨН, ЭРҮҮЛ МЭНД': '🤸', 'ХЭЛ ЯРИА': '💬',
                   'БАЙГАЛЬ, НИЙГМИЙН ОРЧИН': '🌳', 'МАТЕМАТИК': '🔢', 'ЗУРАГ, УРЛАЛ': '🎨', 'ХӨГЖИМ': '🎵' };
  const gem = g => GROUP_EM[g.name] || '🌈', dem = d => DIR_EM[d.name] || '⭐';
  const ABBR = { 'НИЙГЭМ-СЭТГЭЛ ХӨДЛӨЛ': 'НСХ', 'ХӨДӨЛГӨӨН, ЭРҮҮЛ МЭНД': 'ХЭМ', 'ХЭЛ ЯРИА': 'ХЯ',
                 'БАЙГАЛЬ, НИЙГМИЙН ОРЧИН': 'БНО', 'МАТЕМАТИК': 'МАТ', 'ЗУРАГ, УРЛАЛ': 'ЗУ', 'ХӨГЖИМ': 'ХӨГ' };
  const clone = o => JSON.parse(JSON.stringify(o));
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = s => document.querySelector(s);

  let data;
  try { data = JSON.parse(localStorage.getItem(KEY)) || clone(ORIGINAL); } catch { data = clone(ORIGINAL); }
  const ui = { g: 0, view: 'overview' };   // view: 'overview' | 'info' | direction index
  try { Object.assign(ui, JSON.parse(localStorage.getItem(KEY + ':ui')) || {}); } catch {}
  if (!data.groups[ui.g]) ui.g = 0;
  // Өмнөх хувилбарын өгөгдөлд сарын төлөвлөлт байхгүй бол нэмнэ
  data.groups.forEach(g => {
    g.monthly = g.monthly || {};
    const om = ORIGINAL.groups.find(o => o.name === g.name)?.monthly || {};
    // Шинээр нэмэгдсэн сарыг нэмнэ (хэрэглэгчийн бичсэн сарыг дарахгүй)
    Object.keys(om).forEach(k => {
      const cur = g.monthly[k];
      if (!cur || (!cur.schedule?.length && !cur.readings?.length)) g.monthly[k] = clone(om[k]);
    });
  });
  if (!MONTHS.includes(ui.month)) {
    const cm = String(new Date().getMonth() + 1).padStart(2, '0');
    ui.month = MONTHS.includes(cm) ? cm : '09';
  }
  ui.mtab = ui.mtab || 'filter';

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} };
  const saveUi = () => { try { localStorage.setItem(KEY + ':ui', JSON.stringify(ui)); } catch {} };

  const G = () => data.groups[ui.g];
  const title = s => s ? s.charAt(0) + s.slice(1).toLowerCase() : s;
  const count = (rows, t) => rows.reduce((s, r) => s + r.months.filter(m => m.t === t).length, 0);

  // Бүлгийн бүх үр дүнгийн индекс (уялдаа сонгох, шалгахад)
  function outcomeIndex(g) {
    const map = new Map();
    g.directions.forEach((d, di) => d.rows.forEach(r => r.code && map.set(r.code, { text: r.text, dir: d.name, di })));
    return map;
  }

  function issues(g, di) {
    const idx = outcomeIndex(g), out = [];
    g.directions[di].rows.forEach(r => {
      if (!r.months.some(m => m.t)) out.push(`${r.code} — аль ч сард төлөвлөгдөөгүй байна.`);
      r.months.forEach((m, i) => {
        if (m.t === 'u' && !m.code) out.push(`${r.code} — ${MONTHS[i]} сарын уялдаанд код сонгоогүй.`);
        else if (m.t === 'u' && !idx.has(m.code)) out.push(`${r.code} — ${MONTHS[i]} сарын уялдаа “${m.code}” энэ бүлгийн төлөвлөгөөнд олдсонгүй.`);
      });
    });
    return out;
  }

  // ---------- рендер ----------
  function render() {
    saveUi();
    const g = G();
    $('#hdr-sub').textContent = `${title(g.school)} · ${g.year} оны хичээлийн жил`;
    $('#groups').innerHTML = data.groups.map((x, i) =>
      `<button data-g="${i}" class="${i === ui.g ? 'active' : ''}"><span class="em" aria-hidden="true">${gem(x)}</span><span><b>${title(x.name)} бүлэг</b><span class="lv">${esc(x.level)}</span></span></button>`).join('');
    $('#groups').querySelectorAll('button').forEach(b => b.onclick = () => { ui.g = +b.dataset.g; render(); });

    $('#nav').innerHTML = `
      <button data-v="overview" class="${ui.view === 'overview' ? 'active' : ''}"><span class="ic">🏠</span><span class="nm">Тойм</span></button>
      <button data-v="info" class="${ui.view === 'info' ? 'active' : ''}"><span class="ic">📝</span><span class="nm">Ерөнхий мэдээлэл</span></button><hr>` +
      g.directions.map((d, i) => `<button data-v="${i}" class="${ui.view === i ? 'active' : ''}"><span class="ic">${dem(d)}</span><span class="nm">${esc(title(d.name))}</span><small>${d.rows.length}</small></button>`).join('') +
      `<hr><button data-v="month" class="month-nav ${ui.view === 'month' ? 'active' : ''}"><span class="ic">✏️</span><span class="nm">Сарын төлөвлөлт, үйл ажиллагаа</span></button>`;
    $('#nav').querySelectorAll('button').forEach(b => b.onclick = () => {
      ui.view = /^\d+$/.test(b.dataset.v) ? +b.dataset.v : b.dataset.v; render();
    });

    if (ui.view === 'overview') renderOverview();
    else if (ui.view === 'info') renderInfo();
    else if (ui.view === 'month') renderMonth();
    else renderDirection(ui.view);
  }

  function renderOverview() {
    const g = G();
    const allRows = g.directions.flatMap(d => d.rows);
    const monthLoad = MONTHS.map((_, i) => allRows.filter(r => r.months[i].t).length);
    const maxLoad = Math.max(1, ...monthLoad);
    $('#content').innerHTML = `
      <h2><span class="ic">${gem(g)}</span>${title(g.name)} бүлэг — тойм</h2>
      <p class="muted">${esc(g.level)} · Багш: ${esc(g.teacher)}</p>
      <div class="cards">
        <div class="card"><span class="em">🧩</span><div class="v">${g.directions.length}</div><div class="l">Чиглэл</div></div>

        <div class="card"><span class="em">🔗</span><div class="v">${count(allRows, 'u')}</div><div class="l"><span class="sw" style="background:var(--u-ui)"></span>Уялдаа</div></div>
        <div class="card"><span class="em">⭐</span><div class="v">${count(allRows, 'd')}</div><div class="l"><span class="sw" style="background:var(--d-ui)"></span>Давтамж</div></div>
      </div>
      <div class="scroll"><table class="sum">
        <thead><tr><th>Чиглэл</th><th>Үр дүн</th>${MONTHS.map(m => `<th>${m} сар</th>`).join('')}<th>Уялдаа</th><th>Давтамж</th><th>Анхааруулга</th></tr></thead>
        <tbody>${g.directions.map((d, di) => {
          const iss = issues(g, di).length;
          return `<tr><td><a href="#" data-open="${di}">${esc(title(d.name))}</a></td><td>${d.rows.length}</td>${
            MONTHS.map((_, i) => `<td>${d.rows.filter(r => r.months[i].t).length || ''}</td>`).join('')
          }<td>${count(d.rows, 'u')}</td><td>${count(d.rows, 'd')}</td><td style="color:${iss ? 'var(--warn)' : 'inherit'}">${iss || '—'}</td></tr>`;
        }).join('')}</tbody>
        <tfoot><tr><td><b>Сарын ачаалал</b></td><td><b>${allRows.length}</b></td>${monthLoad.map(n =>
          `<td style="background:rgba(255,143,171,${(0.12 + 0.6 * n / maxLoad).toFixed(2)})"><b>${n}</b></td>`).join('')}<td><b>${count(allRows, 'u')}</b></td><td><b>${count(allRows, 'd')}</b></td><td></td></tr></tfoot>
      </table></div>
      <p class="muted">Сарын ачаалал = тухайн сард хэрэгжүүлэх (уялдаа эсвэл давтамжтай) суралцахуйн үр дүнгийн тоо.</p>`;
    $('#content').querySelectorAll('[data-open]').forEach(a => a.onclick = e => { e.preventDefault(); ui.view = +a.dataset.open; render(); });
  }

  function renderInfo() {
    const g = G();
    const fields = [['school', 'Байгууллагын нэр (томоор)'], ['year', 'Хичээлийн жил'], ['name', 'Бүлэг'], ['level', 'Хөтөлбөрийн түвшин'],
      ['teacher', 'Боловсруулсан багш'], ['approver', 'Баталсан (эрхлэгч / орлон гүйцэтгэгч)'], ['date', 'Огноо'], ['place', 'Газар']];
    $('#content').innerHTML = `

    $('#content').querySelectorAll('[data-k]').forEach(el => el.oninput = () => { g[el.dataset.k] = el.value; save(); });
    $('#apply-all').onclick = () => {

  function planTable(g, d, editable) {
    // Ай, Дэд айн rowspan
    const rows = d.rows;
    const span = (key, i) => {
      if (i > 0 && rows[i - 1][key] === rows[i][key] && (key === 'area' || rows[i - 1].area === rows[i].area)) return 0;
      let n = 1; while (i + n < rows.length && rows[i + n][key] === rows[i][key] && (key === 'area' || rows[i + n].area === rows[i].area)) n++;
      return n;
    };
    const body = rows.map((r, ri) => {
      const sa = span('area', ri), ss = span('sub', ri);
      const links = r.months.map((m, i) => m.t === 'u' && m.code ? `<li>${MONTHS[i]} сар – ${esc(m.code)}. ${esc(m.text)}</li>` : '').join('');
      return `<tr class="row">
        ${sa ? `<td class="ar" rowspan="${sa}">${esc(r.area)}</td>` : ''}
        ${ss ? `<td rowspan="${ss}">${esc(r.sub)}</td>` : ''}
        <td class="out" ${editable ? `data-row="${ri}" title="Засах"` : ''}><span class="code">${esc(r.code)}.</span> ${esc(r.text)}

        ${r.months.map((m, i) => `<td class="m ${m.t}" ${editable ? `data-cell="${ri}:${i}"` : ''}>${m.t === 'u' ? esc(m.code) : ''}</td>`).join('')}
        <td class="num">${r.months.filter(m => m.t === 'u').length}</td>
        <td class="num">${r.months.filter(m => m.t === 'd').length}</td></tr>`;
    }).join('');
    return `<table class="plan">
      <thead>
        <tr><th rowspan="2" style="width:110px">Ай</th><th rowspan="2" style="width:120px">Дэд ай</th><th rowspan="2">Суралцахуйн үр дүн</th>
          ${TERMS.map(([n, c]) => `<th colspan="${c}">${n}</th>`).join('')}<th rowspan="2">Уялдаа</th><th rowspan="2">Давтамж</th></tr>
        <tr>${MONTHS.map(m => `<th>${m}<br>сар</th>`).join('')}</tr>

      <tbody>${body}</tbody>
      <tfoot>

        <tr><td colspan="${3 + MONTHS.length}" style="text-align:right">Давтамж</td><td class="num" colspan="2">${count(rows, 'd')}</td></tr>
      </tfoot></table>`;

  function editRow(di, ri) {
    const g = G(), d = g.directions[di], isNew = ri < 0;
    const r = isNew ? { area: d.rows.at(-1)?.area || '', sub: '', code: '', text: '', months: MONTHS.map(() => ({ t: '' })) } : d.rows[ri];
    const dlg = $('#dlg-row');

    if (isNew) $('#row-code').placeholder = `ж: ${ABBR[d.name] || ''}1.1а`;
    $('#dl-areas').innerHTML = [...new Set(d.rows.map(x => x.area))].map(a => `<option value="${esc(a)}">`).join('');
    $('#dl-subs').innerHTML = [...new Set(d.rows.map(x => x.sub))].map(a => `<option value="${esc(a)}">`).join('');

        g.directions.forEach(x => x.rows.forEach(y => y.months.forEach(m => {

  // Кирилл нэртэй файлыг зарим хөтөч "download" болгодог тул латинаар бичнэ
  const TR = { а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'yo',ж:'j',з:'z',и:'i',й:'i',к:'k',л:'l',м:'m',н:'n',о:'o',ө:'u',п:'p',р:'r',с:'s',т:'t',у:'u',ү:'u',ф:'f',х:'h',ц:'ts',ч:'ch',ш:'sh',щ:'sh',ъ:'',ы:'i',ь:'',э:'e',ю:'yu',я:'ya' };
  const latin = s => s.split('').map(c => { const l = c.toLowerCase(), t = TR[l]; return t == null ? c : (c !== l ? t.charAt(0).toUpperCase() + t.slice(1) : t); }).join('').replace(/[^\w.\-]+/g, '_');
  function download(text, name, type) {
    name = latin(name);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }

  const mmdd = iso => iso.slice(5).replace('-', '.');

  function monthObj(g, m) {
    g.monthly = g.monthly || {};
    return g.monthly[m] = g.monthly[m] || { approverTitle: 'АРГАЗҮЙЧ', approver: '', exclude: ['ХӨГЖИМ'],

  // Жилийн төлөвлөгөөнөөс тухайн сарын шүүлт (уялдаа эхэнд, дараа нь давтамж)
  function filterRows(g, m) {
    const mo = monthObj(g, m), mi = MONTHS.indexOf(m), out = { u: [], d: [] };
    g.directions.forEach(d => {
      if (mo.exclude.includes(d.name)) return;
      d.rows.forEach(r => {
        const c = r.months[mi];
        if (!c || !c.t) return;
        const dates = mo.schedule.filter(s => s.date && (s.code === r.code || s.link === r.code)).map(s => mmdd(s.date));
        out[c.t].push({ code: r.code, text: r.text, t: c.t, dir: d.name,
          link: mo.links[r.code] ?? (c.t === 'u' ? c.code : ''),
          dates: [...new Set(dates)].sort(), note: mo.notes[r.code] || '' });
      });
    });
    return [...out.u, ...out.d];
  }

  function daysText(f) {
    const toks = (f.note || '').split(',').map(t => t.trim()).filter(Boolean), isD = t => /^\d\d\.\d\d$/.test(t);
    return [...[...new Set([...f.dates, ...toks.filter(isD)])].sort(), ...toks.filter(t => !isD(t))].join(', ');
  }
