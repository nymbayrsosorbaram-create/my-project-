эд юу хийсэн бэ?\n2. Хурдан бөмбөгнөөс бултахад хэцүү байсан уу?\n3. Найзуудтайгаа мөргөлдөхгүйн тулд яах вэ?","learner":"Зааж үзүүлэх:\n- Багшийг ажиглаад бултах хоёр аргыг дуурайна.\nБултах дасгал:\n- Аажуухан өнхөрсөн бөмбөгнөөс хажуу тийш алхаж бултана.\n- Хурдан өнхөрсөн бөмбөгнөөс үсэрч эсвэл гүйж зугтана.\nЦагирагнаас бултах:\n- Өнхөрч ирсэн цагиргийг харж, хажуу тийш зайлна.\nАюулгүй дүрэм:\n- \"Найзаа түлхвэл унаж өвдөнө, тиймээс тусгүй\" гэж тайлбарлана."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Хөдөлгөөний буланд бөмбөг, цагираг байрлуулж, хүүхдүүд хосоороо бие биедээ бөмбөг өнхрүүлэхийг ажиглана.","learner":"- Найзтайгаа хос болж бөмбөг өнхрүүлэлцэнэ.\n- Нэг нь өнхрүүлж, нөгөө нь бултана; дараа нь солигдоно."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Хөдөлгөөнтэй шүлэг (\"Бөмбөг минь өнхөрлөө\") уншиж, хөдөлгөөнөөр дагуулна.","learner":"- Шүлгийг сонсож давтана.\n- Шүлгийн дагуу бөмбөг шиг өнхөрч, үсэрч хөдөлнө."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Хөдөлгөөний төв: Конусын хооронд бөмбөг өнхрүүлэх зам.\nУрлагийн төв: \"Миний бөмбөг\" – дугуйг хээгээр чимэглэх.\nХэл ярианы төв: Дүрмийн карт харж, \"Яагаад энэ дүрэм хэрэгтэй вэ?\" гэж ярилцах.","learner":"Хөдөлгөөний төв:\n- Бөмбөгийг конусын хооронд мөргөхгүй өнхрүүлнэ.\nУрлагийн төв:\n- Дугуйг хээгээр чимэглэж бөмбөг болгоно.\nХэл ярианы төв:\n- Дүрэм бүр яагаад хэрэгтэйг найздаа тайлбарлана."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 4 (2). Хөдөлмөрийн үйл ажиллагаа: Мөсөн баримал хийх газар бэлдэхийн тулд цасыг цэвэрлэх\nЗорилго: Хамтран ажиллах, нийтлэг нэг зорилгод хүрэхийг сургах.\nХийгдэх ажил:\n- Мөсөн баримал хийх талбайг тэгшилнэ.\n- Хашаа, саад ихтэй газрыг цэвэрлэж, аюулгүй болгоно.\n- Эрүүл, цэвэр орчинд ажиллахыг дэмжинэ.","learner":"- Хүрзээ авч, талбайн өөрт оногдсон хэсгийг сонсоно.\n- Цасыг хүрзээр түрж, талбайг тэгшилнэ.\n- Хашааны дэргэдэх саадыг цэвэрлэж, аюулгүй болгоно.\n- Найзуудтайгаа хамтран ажиллаж, нийтлэг зорилгоо (\"баримлын талбай бэлдэх\") хэлнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Хөлдсөн найзаа аврах»\nЗорилго: Хамтран тоглох, найздаа туслах.\nЯвц:\n1. Нэг хүүхэд \"жавар\" болж бусдыг хөөнө.\n2. Жаварт хүрэгдсэн хүүхэд \"хөлдөж\" зогсоно.\n3. Бусад хүүхэд хүрч \"гэсгээвэл\" дахин гүйнэ.\nДүрэм: Түлхэхгүй, зөөлөн хүрнэ.\nДүгнэлт: \"Хэн хэнийг аварсан бэ? Ямар санагдсан бэ?\" гэж ярилцана.","learner":"- Жавараас зугтаж гүйнэ.\n- Хүрэгдвэл хөлдөж зогсоно.\n- Хөлдсөн найздаа зөөлөн хүрч аварна.\n- Найзаа аврахад ямар санагдсанаа хэлнэ."}]},"2028-01-20":{"method":"Зохиолд суурилсан арга","link":"ХЯ3.2д. Үйл явдлын эхлэл, өрнөл, төгсгөлийг дарааллын дагуу ярина.","competence":"Шүүн тунгаах (өдөр тутмын үйлийг дараалуулах), харилцах (үйл явдлыг дарааллаар ярих)","materials":"Өдрийн дэглэмийн зурагт карт (босох, угаах, цай уух, цэцэрлэгт ирэх, тоглох, хооллох, унтах), «Гурван торой» зурагт карт, «Өглөө – өдөр – орой» самбар","criteria":"Өдөр тутмын хийдэг үйлийг зөв дараалуулдаг. Үйл явдлын эхлэл, өрнөл, төгсгөлийг дарааллын дагуу ярьдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Өнөө өглөө босоод хамгийн түрүүнд юу хийсэн бэ?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Өглөө хийсэн үйлээ \"Эхлээд ..., дараа нь ..., эцэст нь ...\" гэж ярина."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Дэглэмийн карт: Өдрийн дэглэмийн картуудыг холиод хүүхдүүдээр зөв дараалуулна.\n- Өглөө, өдөр, орой: Картуудыг \"Өглөө – өдөр – орой\" самбарт ангилуулна.\n- \"Юу дутуу байна?\": Дараалсан картаас нэгийг нууж, хүүхдүүдээр таалгана.\nБагшийн чиглүүлэх асуулт:\n1. Хоол идэхийн өмнө юу хийдэг вэ?\n2. Орой унтахын өмнө юу хийдэг вэ?\n3. Энэ картууд буруу дараалалтай байвал юу болох вэ?","learner":"Дэглэмийн карт:\n- Холилдсон картуудыг харж зөв дарааллаар өрнө.\n- Дарааллаа \"Эхлээд босно, дараа нь нүүрээ угаана...\" гэж ярина.\nӨглөө, өдөр, орой:\n- Картыг өглөө, өдөр, оройн үйлээр ангилна.\n\"Юу дутуу байна?\":\n- Дарааллыг харж нуусан картыг таана.\nАсуултад хариулах:\n- \"Хоол идэхийн өмнө гараа угаана\" гэж хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Номын буланд дараалсан зурагт картууд байрлуулж, бие даан түүх зохиохыг ажиглана.","learner":"- Зурагт картыг дараалуулж найздаа түүх ярина.\n- Найзынхаа түүхийг сонсоно."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – хоёр дахь уншлага (2): «Гурван торой» (Төлөвлөгөөний хуудсыг 01.18-ны төлөвлөлтийн дараа үзнэ үү.)\n- Номын тухай эргэн сануулах асуулт асууна: «Номын эхэнд, дараа нь, эцэст нь юу болсон бэ?»\n- Түр зогсож асуух: «Залхуу байх нь тустай юу, тусгүй юу?», «Ах нь дүү нараа яаж хамгаалсан бэ?»\n- Шинэ үг: «Үлээх», «Нураах», «Тогших» – үйлдлээр үзүүлэх\n- Уншсаны дараа: Үлгэрийн 4 зургийг эхлэл, өрнөл, төгсгөлөөр дараалуулах","learner":"- Үлгэрийн эхлэл, өрнөл, төгсгөлийг дарааллаар нь ярина.\n- Залхуу байх нь яагаад тусгүйг тайлбарлана.\n- «Үлээх», «Нураах», «Тогших» үгийг үйлдлээр үзүүлнэ.\n- Үлгэрийн 4 зургийг зөв дараалуулна."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Математикийн төв: \"Миний өдөр\" – дэглэмийн картыг дараалуулах.\nХэл ярианы төв: Дараалсан 4 зургаар түүх зохиох.\nУрлагийн төв: 3 хэсэгт хуваасан цаасан дээр \"Өглөө – өдөр – орой\" зурах.","learner":"Математикийн төв:\n- Өөрийн өдрийн дэглэмийг картаар дараалуулна.\nХэл ярианы төв:\n- Дараалсан зургаар түүх зохиож, \"Эхлээд..., дараа нь..., эцэст нь...\" гэж ярина.\nУрлагийн төв:\n- Өглөө, өдөр, оройн үйлээ зурж тайлбарлана."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 4 (3). Хөдөлгөөнт тоглоом: «Хоосон байр»\nЗорилго: Дохиогоор үйлдэл хийх, хөдөлгөөнөө удирдан зохицуулах чадварыг хөгжүүлэх.\nТоглоомын бэлтгэл үе шат: Багш талбайг аюулгүй, хангалттай зайтай байхаар зохион байгуулна. Байруудыг (сандал, цагираг) хоорондоо зайтай байрлуулж, хүүхдүүд мөргөлдөх эрсдэлийг багасгана. Тоглоом эхлэхээс өмнө дүрмийг ойлгомжтой, товч тайлбарлаж, өөрөө нэг удаа үзүүлнэ.\nТоглоомын үйл явц:\n- Эхлээд хүүхдүүд өөрийн \"байр\"-даа зогсоно.\n- Багш \"Явлаа!\" гэх дохио өгөхөд хүүхдүүд байрнаасаа гарч чөлөөтэй алхах, гүйх, эсвэл багшийн зааснаар хөдөлгөөн (үсрэх, мөлхөх гэх мэт) хийнэ.\n- \"Байр!\" гэх дохио өгөх эсвэл хөгжим гэнэт зогсоход хүүхдүүд хамгийн ойр байгаа сул байрыг хурдан эзлэхийг хичээнэ.\n- Нэг хүүхэд байргүй үлдэх бөгөөд түүнийг \"хожигдсон\" гэж ойлгуулахгүй, харин дараагийн удаа дохио өгөх, тоолох зэргээр багшид туслах байдлаар идэвхтэй оролцуулна.\nАнхаарах зүйлс: Бага насныханд эхлээд удаан хэмнэлээр тоглуулна; талбай хангалттай зайтай байх; унахаас сэргийлэх; бүх хүүхдийг оролцуулах.","learner":"- Өөрийн \"байр\" дээр зогсоно.\n- \"Явлаа!\" дохиогоор байрнаасаа гарч алхах, гүйх, үсрэх хөдөлгөөн хийнэ.\n- \"Байр!\" дохиогоор хамгийн ойр сул байрыг хурдан эзэлнэ.\n- Байргүй үлдвэл багшид тусалж, дараагийн дохиог өгнө.\n- Бусадтай мөргөлдөхгүй, түлхэлцэхгүй тоглоно."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Түүх үргэлжлүүлье»\nЗорилго: Түүхийг дараалан зохиож ярих.\nЯвц:\n1. Багш \"Нэг өглөө торой эрт босоод...\" гэж эхлүүлнэ.\n2. Бөмбөг дамжуулахад хүүхэд бүр нэг өгүүлбэр нэмнэ.\n3. Сүүлийн хүүхэд түүхийг төгсгөнө.\nДүрэм: Бөмбөг барьсан хүн ярина.\nДүгнэлт: Хамтдаа зохиосон түүхийг багш дахин ярьж өгнө.","learner":"- Өмнөх найзынхаа өгүүлбэрийг сонсоно.\n- Бөмбөг ирэхэд түүхэнд нэг өгүүлбэр нэмнэ.\n- Түүхийн төгсгөлийг санаачилгатай зохионо.\n- Хамтын түүхээ эргэн ярина."}]},"2028-01-21":{"method":"Шинжлэн судлах арга","link":"ЗУ3.2д. Нугалах, эвхэх, хайчлах аргаар хавтгай болон биет наамлын бүтээл урлана.","competence":"Шүүн тунгаах (зурган зааварчилгааг ажиглан дарааллын дагуу дуурайх), бүтээлчээр сэтгэх (нугалах, эвхэх аргаар бүтээл хийх)","materials":"Цаасан эвхмэлийн зурган зааварчилгаа (нохой, муур, гацуур – 3-4 алхамтай), дөрвөлжин өнгийн цаас, харандаа, «Шоон байшин» зурган заавар, шоо","criteria":"Зурган зааварчилгааг ажиглаж, алхам бүрийг дарааллын дагуу дуурайж хийдэг. Нугалах, эвхэх аргаар хавтгай бүтээл урладаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Гараа угаах дарааллыг зургаар үзье\" гэж гар угаах 4 алхмын зургийг үзүүлнэ.","learner":"- Мэндчилж тойрогт сууна.\n- Гар угаах 4 алхмын зургийг харж, алхам бүрийг дарааллаар нь хэлж, гараараа үзүүлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Зурган зааварчилгаа ажиглах: \"Нохойн толгой\" эвхмэлийн 4 алхамтай зааврыг үзүүлж, алхам бүрийг тоолуулна.\n- Дуурайж хийх: Алхам бүрийг хамтдаа хийнэ: 1) гурвалжин болгон нугална 2) хоёр чихийг доош эвхэнэ 3) хамрыг дээш эвхэнэ 4) нүд, хамар зурна.\n- Шоон байшин: Шоогоор барих зурган заавраар байшин барина.\nБагшийн чиглүүлэх асуулт:\n1. Эхний алхамд юу хийх вэ?\n2. Аль алхамыг алгасвал юу болох вэ?\n3. Зурагтай чинь адилхан болсон уу?","learner":"Зурган зааварчилгаа ажиглах:\n- Заавар дахь алхмуудыг дугаараар нь тоолж, юу хийхийг хэлнэ.\nДуурайж хийх:\n- 1-р алхам: цаасаа гурвалжин болгон нугална.\n- 2-р алхам: хоёр булангаа доош эвхэж чих хийнэ.\n- 3-р алхам: доод булангаа дээш эвхэж хамар хийнэ.\n- 4-р алхам: нүд, хамар зурж нохойгоо дуусгана.\nШоон байшин:\n- Зурган заавраас харж шоог ижил байрлалаар өрнө.\n- Өөрийн байшинг зурагтай харьцуулж шалгана."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Урлагийн буланд өнгийн цаас, эвхмэлийн зааврууд байрлуулж, хүүхдүүд бие даан заавар дагаж буйг ажиглана.","learner":"- Өөрт таалагдсан эвхмэлийн зааврыг сонгож дагаж хийнэ.\n- Бүтээгээгүй алхамдаа найзаасаа тусламж хүснэ."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Зурган зааварчилгаатай ном (\"Цаасаар юу хийх вэ?\") үзүүлж, хуудас бүрийн алхмыг хүүхдүүдээр тайлбарлуулна.","learner":"- Номын зурагнаас алхам бүрийг дарааллаар нь тайлбарлана.\n- \"Эхлээд нугална, дараа нь эвхэнэ\" гэж хэлнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: Муур, гацуурын эвхмэлийн зааврууд.\nБарилгын төв: Шоогоор барих 3 янзын зурган заавар.\nМатематикийн төв: Зурган заавраар сувс хэлхэх (улаан-цагаан-улаан...).","learner":"Урлагийн төв:\n- Зааврын дагуу муур эсвэл гацуур эвхэнэ.\nБарилгын төв:\n- Сонгосон зааврын дагуу шоогоор барилга барина.\nМатематикийн төв:\n- Зааврын дарааллаар сувс хэлхэнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 5 (1). Ажиглалт: Хэрээг ажиглах\nАжиглалтын зорилго: Хүүхдэд хэрээний гадаад төрх, амьдрах орчин, хооллолт, өвлийн улиралд хэрхэн амьдардаг тухай ойлголт өгөх.\nОньсого: «\"Гаа, гаа\" гэж дуугараад, Гадаа өвөлжиж үлдэнэ. Хүйтэн цасанд даарсан ч Хоолоо хайж явна. Тэр юу вэ?» /Хэрээ/\nБагш хүүхдүүдтэй хамт хэрээг ажиглаж, дараах асуултаар ярилцана:\n- «Энэ ямар шувуу вэ?», «Хэрээ ямар өнгөтэй байна вэ?», «Хэрээний бие том уу, жижиг үү?», «Хэрээ яаж алхаж байна вэ?», «Хэрээ хаана амьдардаг вэ?»\n- «Хэрээ юугаар хооллодог вэ?», «Хэрээнд ямар амьтад аюултай байж болох вэ?», «Өвлийн улиралд шувуудад хоол олоход амархан уу?», «Бид өвөлждөг шувуудад яаж тусалж болох вэ?»\nБагшийн тайлбар: Хэрээ бол өвөлждөг шувуу. Өвөл дулаан орон руу нисэхгүй, бидний ойр орчимд амьдардаг. Хэрээ хар, саарал өнгийн өдтэй, том биетэй, хүчтэй хушуутай. Тэр хоолны үлдэгдэл, үр тариа, жижиг шавж зэрэг олон зүйлээр хооллодог. Хүйтэн үед шувуудад хоол олоход хэцүү байдаг тул бид тэднийг үргээхгүй, тэжээлүүрт тохирох хоол тавьж тусалж болно.","learner":"- Оньсогыг сонсоод \"Хэрээ\" гэж таана.\n- Хэрээг алсаас ажиглаж, өнгө, биеийн хэмжээг (\"хар саарал, том\") хэлнэ.\n- Хэрээ хэрхэн алхаж, хоол хайж байгааг ажиглаж ярина.\n- Хэрээг бор шувуутай харьцуулж \"Хэрээ том, бор шувуу жижиг\" гэж хэлнэ.\n- Хэрээг үргээхгүй, тэжээлүүрт хоол тавьж туслахаа хэлнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Надтай адилхан хийгээрэй»\nЗорилго: Ажигласан хөдөлгөөнийг дарааллаар нь дуурайх.\nЯвц:\n1. Багш 3 хөдөлгөөнийг дараалан үзүүлнэ (алга ташина – үсэрнэ – эргэнэ).\n2. Хүүхдүүд яг ижил дарааллаар давтана.\n3. Дараа нь хүүхэд өөрөө дараалал зохиож үзүүлнэ.\nДүрэм: Дарааллыг алдагдуулахгүй.\nДүгнэлт: Өнөөдөр юу эвхсэнээ ярилцана.","learner":"- Багшийн 3 хөдөлгөөнийг анхааралтай ажиглана.\n- Ижил дарааллаар давтана.\n- Өөрөө дараалал зохиож найзууддаа үзүүлнэ.\n- Өнөөдөр эвхсэн бүтээлээ хэлнэ."}]},"2028-01-22":{"method":"Шинжлэн судлах арга (давтамж)","link":"ЗУ3.2а. Өөрийн бодол төсөөллөөр зохиомжлон зурна.","competence":"Шүүн тунгаах (цаг агаарыг тэмдгээр илэрхийлэх, тохирох хувцас сонгох), бүтээлчээр сэтгэх","materials":"Цаг агаарын хуанли (1 дүгээр сар), тэмдгийн карт, хүүхэлдэй ба хувцас, термометрийн зураг, цаас, өнгийн харандаа","criteria":"Цаг агаарын байдлыг зураг, тэмдэг ашиглан илэрхийлж, тохирсон хувцас, хийх үйл ажиллагаагаа сонгон тайлбарладаг. Өвлийн өдрийг өөрийн төсөөллөөр зохиомжлон зурдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, цонхоор харуулан өнөөдрийн цаг агаарын тэмдгийг хуанлид байрлуулна.","learner":"- Мэндчилж тойрогт сууна.\n- Цонхоор харж цаг агаарыг ажиглана.\n- Тохирох тэмдгийг сонгож хуанлид байрлуулна."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Хуанли дүгнэх: 1 дүгээр сарын хуанлиас \"Хэдэн өдөр цас орсон бэ? Хэдэн өдөр нартай байсан бэ?\" гэж тоолуулна.\n- Хүйтэн, дулаан: Термометрийн зургаар \"Өнөөдөр маш хүйтэн\" гэдгийг тайлбарлана.\n- Хувцас ба үйл ажиллагаа: \"Ийм хүйтэнд ямар хувцас өмсөх вэ? Гадаа юу хийж болох вэ?\" гэж асууж, хүүхэлдэйг хувцаслуулна.\nБагшийн чиглүүлэх асуулт:\n1. Энэ сард ямар цаг агаар их байсан бэ?\n2. Маш хүйтэн өдөр гадаа удаан байвал юу болох вэ?\n3. Цастай өдөр ямар тоглоом тоглож болох вэ?","learner":"Хуанли дүгнэх:\n- Хуанлиас цастай, нартай өдрийг тоолж, \"Цастай өдөр олон байна\" гэж харьцуулна.\nХүйтэн, дулаан:\n- Термометрийн зургийг харж \"Өнөөдөр маш хүйтэн\" гэж хэлнэ.\nХувцас ба үйл ажиллагаа:\n- Хүүхэлдэйг малгай, ороолт, бээлий, гуталтай хувцаслана.\n- Цастай өдөр хийх тоглоомоо (чарга, цасан хүн) нэрлэж сонголтоо тайлбарлана."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Дүрт тоглоомын буланд улирлын хувцас байрлуулж, хүүхдүүдийн хувцаслалтыг ажиглана.","learner":"- Хүүхэлдэйг өвлийн хувцсаар хувцаслана.\n- Зуны хувцсыг ялгаж тусад нь тавина."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – гурав дахь уншлага (3): «Гурван торой» (Төлөвлөгөөний хуудсыг 01.18-ны төлөвлөлтийн дараа үзнэ үү.)\n- Номын үйл явдлыг хүүхдүүдээр түлхүү яриулна.\n- Дүгнэн ярилцах: «Гурав дахь торойгоос бид юу сурах вэ?»\n- Шинэ үгсээр өгүүлбэр зохиох: сүрэл, хичээнгүй, залхуу, нураах\n- Бүтээл: Шоо, хайрцгаар бат бөх байшин барьж, «чоно» болж үлээж шалгах","learner":"- Номын нэр, зохиолч, зураачийг санаж хэлнэ.\n- Номын зургийг харж үлгэрийг өөрийн үгээр ярина.\n- \"Хичээнгүй байх нь чухал\" гэж дүгнэнэ.\n- Шинэ үгсээр өгүүлбэр зохионо.\n- Байшин барьж, \"чоно\" болж үлээж шалгана."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: \"Миний өвлийн өдөр\" сэдвээр зураг зурах.\nБайгаль шинжлэлийн төв: Тэмдгийн картыг тохирох хувцастай тааруулах.\nХэл ярианы төв: \"Цаг агаарын мэдээ\" хөтлөх.","learner":"Урлагийн төв:\n- Өвлийн өдрөө өөрийн төсөөллөөр зохиомжлон зурж тайлбарлана.\nБайгаль шинжлэлийн төв:\n- Тэмдэг ба хувцсыг тааруулж, шалтгаанаа хэлнэ.\nХэл ярианы төв:\n- Хөтлөгч болж \"Маргааш хүйтэн, дулаан хувцаслаарай\" гэж мэдээ хэлнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 5 (2). Хөдөлмөрийн үйл ажиллагаа: Талбай болон замын цас, жижиг хогийг цэвэрлэх\nХөдөлмөрийн зорилго: Хүүхдэд хөдөлмөрч зан, эхэлсэн ажлаа дуусгах дадал, орчноо цэвэр байлгах хүсэл төлөвшүүлэх.\nЯвц: Багш хүүхдүүдэд цас ихтэй үед зам талбай халтиргаатай, явахад хүндрэлтэй болдгийг тайлбарлана. Дараа нь хүүхдүүдтэй хамт цэцэрлэгийн талбай болон явган замын зөөлөн цасыг цэвэрлэнэ.\nХүүхдүүд:\n- жижиг хүрзээр зөөлөн цасыг замын хажуу тийш түрнэ;\n- талбай дээрх жижиг хогийг түүж зориулалтын саванд хийнэ;\n- ажлаа дууссаны дараа «Өмнө нь ямар байсан, одоо ямар болсон бэ?» гэж ярилцана.\nАнхаарах зүйл: Хүүхдэд хүнд, мөстсөн цас өргүүлэхгүй. Халтиргаатай хэсэгт гүйлгэхгүй. Багш аюулгүй байдлыг байнга хянана.","learner":"- Цас ихтэй үед зам яагаад халтиргаатай болдгийг сонсож, давтан хэлнэ.\n- Жижиг хүрзээр зөөлөн цасыг замын хажуу тийш түрнэ.\n- Талбай дээрх жижиг хогийг түүж зориулалтын саванд хийнэ.\n- Ажлын өмнөх, дараах байдлыг харьцуулж \"Өмнө нь цастай байсан, одоо цэвэрхэн боллоо\" гэж хэлнэ.\n- Халтиргаатай хэсэгт гүйхгүй, мөстсөн цас өргөхгүй."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Цаг агаар таа»\nЗорилго: Цаг агаарын байдлыг хөдөлгөөнөөр илэрхийлэх.\nЯвц:\n1. Багш тэмдгийн карт үзүүлэхэд хүүхдүүд хөдөлгөөнөөр илэрхийлнэ.\n2. Нэг хүүхэд хөдөлгөөн хийж, бусад нь таана.\nДүрэм: Ээлжээ хүлээнэ.\nДүгнэлт: Энэ долоо хоногийн цаг агаарыг хамтдаа дүгнэнэ.","learner":"- Тэмдгийг харж хөдөлгөөнөөр илэрхийлнэ (цас – хуруугаа хөдөлгөн доош буулгах, салхи – ганхах).\n- Найзынхаа хөдөлгөөнийг харж цаг агаарыг таана.\n- Долоо хоногийн цаг агаарыг дүгнэж хэлнэ."}]},"2028-01-25":{"method":"Төсөлд суурилсан арга (давтамж)","link":"ХЯ3.2г. Үгийг оновчтой сонгож, дэлгэрэнгүй өгүүлбэрээр ярина.","competence":"Соёлын мэдлэг (Цагаан сарын уламжлалыг тайлбарлах), харилцах (дэлгэрэнгүй өгүүлбэрээр ярих)","materials":"«Номингийн анхны золголт» зурагт карт, Цагаан сарын зурагт үзүүлэн (ширээ засал, золголт, бууз, хадаг), хадаг, шагай, дээл өмссөн хүүхэлдэй","criteria":"Гэр бүлийн орчинд Цагаан сарыг хэрхэн тэмдэглэдэг талаар өөрийн үгээр тайлбарлаж, ардын тоглоом, наадгайгаар наадна. Үгийг оновчтой сонгож дэлгэрэнгүй өгүүлбэрээр ярьдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Удахгүй ямар баяр болох вэ?\" гэж асууж, Цагаан сарын зургийг үзүүлнэ.","learner":"- Мэндчилж тойрогт сууна.\n- Зургийг харж \"Цагаан сар\" гэж нэрлэнэ.\n- Цагаан сарын тухай мэддэг зүйлээ (бууз, золгох) хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Ярилцлага: \"Танайх Цагаан сараар юу хийдэг вэ?\" гэж асууж, хүүхэд бүрээр гэр бүлийн заншлаа яриулна.\n- Зурагт үзүүлэн: Битүүн, ширээ засал, золголт, бууз чимхэх зургийг дарааллаар нь үзүүлж ярилцана.\n- Золгох ёс: Хадаг барьж, ахмад хүний гарыг доороос нь өргөн \"Амар байна уу?\" гэж золгохыг үзүүлж, хосоороо дадлага хийлгэнэ.\nБагшийн чиглүүлэх асуулт:\n1. Цагаан сарын өмнө гэрээ яагаад цэвэрлэдэг вэ?\n2. Хэн хэнтэй хамгийн түрүүнд золгодог вэ?\n3. Золгохдоо юу гэж хэлдэг вэ?","learner":"Ярилцлага:\n- \"Манайх Цагаан сараар ... хийдэг\" гэж гэр бүлийнхээ заншлыг дэлгэрэнгүй ярина.\nЗурагт үзүүлэн:\n- Зураг бүрийг харж юу болж байгааг нэрлэнэ.\n- Битүүн, шинийн нэгний үйлийг дарааллаар нь хэлнэ.\nЗолгох ёс:\n- Хадгаа хоёр гараараа барина.\n- Багш (ахмад)-ийн гарыг доороос нь өргөн \"Амар байна уу?\" гэж золгоно.\n- Хосоороо ээлжлэн золгох дадлага хийнэ.\nАсуултад хариулах:\n- \"Шинэ жилийг цэвэрхэн угтахын тулд гэрээ цэвэрлэдэг\" гэж тайлбарлана."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Дүрт тоглоомын буланд \"Цагаан сарын ширээ\" орчин бүрдүүлж (таваг, бууз, хадаг), хүүхдүүдийн тоглохыг ажиглана.","learner":"- Эмээ, өвөө, ач нарын дүрийг хуваарилна.\n- Ширээ засаж, ээлжлэн золгож, мэндэлнэ."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – эхний уншлага (1): «Номингийн анхны золголт» (Чанга уншлагын төлөвлөгөөний хуудсыг үзнэ үү.)\n- Номын нэр, хавтас, зохиолч, зураачийг танилцуулж, хэмнэлийг алдагдуулахгүй уншина.\n- Түр зогсож асуух: «Номин бууз чимхэж чадахгүй үедээ юу хийх бол?»\n- Шинэ үг: «Ерөөл – сайн сайхныг хүсэх үг»\n- Уншсаны дараа: «Цагаан сарын өмнө Номингийнх юу юу хийсэн бэ?»","learner":"- Номын хавтсыг харж \"Энэ ном ... тухай байх\" гэж таамаглана.\n- Багшийн уншихыг анхааралтай сонсоно.\n- Түр зогсох үед Номин юу хийхийг таамаглана.\n- «Ерөөл» үгийг давтан хэлж, утгыг нь хэлнэ.\n- Номингийнхны бэлтгэлийг дарааллаар нь ярина."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Ардын тоглоомын төв: Шагай байрлуулж, \"Морь уралдуулах\" тоглоом.\nУрлагийн төв: Цаасан хадгийг хээгээр чимэглэх.\nХэл ярианы төв: \"Золгоё\" – хүүхэлдэйгээр золгож, мэндлэх үг хэлэх.","learner":"Ардын тоглоомын төв:\n- Шагай харваж, буусан шагайны нэрийг хэлж морио уралдуулна.\nУрлагийн төв:\n- Цаасан хадгийг хөх өнгөөр будаж, хээгээр чимэглэнэ.\nХэл ярианы төв:\n- Хүүхэлдэйгээр золгож, \"Амар байна уу? Сайхан шинэлж байна уу?\" гэж мэндэлнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 5 (3). Хөдөлгөөнт тоглоом: «Өөд өөдөөсөө гүйцгээе»\nТоглоомын зорилго: Хурд, авхаалж самбаа, орон зайд баримжаалах чадвар, хөдөлгөөний идэвхийг нэмэгдүүлэх.\nТоглоомын аргачлал:\n- Багш хүүхдүүдийг хоёр эгнээнд, хооронд нь тодорхой зайтай өөд өөдөөс нь харуулан зогсооно.\n- Багшийн дохиогоор хоёр талаас хүүхдүүд зөөлөн гүйж, талбайн дунд хэсэгт уулзаад, хоорондоо мөргөлдөхгүйгээр зөрж өнгөрөөд эсрэг талын шугамд очно.\n- Дараагийн дохиогоор буцаж гүйнэ. Тоглоомыг 3–4 удаа давтаж болно.\nДүрэм:\n- Өөдөөсөө гүйхдээ мөргөлдөхгүй.\n- Зөвхөн багшийн дохиогоор хөдөлнө.\n- Найзыгаа түлхэхгүй.\n- Гүйх чиглэлээ баримтална.\n- Халтиргаатай бол гүйхийн оронд хурдан алхана.","learner":"- Эгнээндээ зогсож, өөдөөс харсан найзаа харна.\n- Багшийн дохиогоор зөөлөн гүйж, дунд хэсэгт найзтайгаа мөргөлдөхгүй зөрж өнгөрнө.\n- Эсрэг талын шугамд хүрч зогсоно.\n- Дараагийн дохиогоор буцаж гүйнэ.\n- Халтиргаатай газар хурдан алхана."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Цагаан ястай мэлхий»\nЗорилго: Монгол ардын тоглоомоор хамтран наадах.\nЯвц:\n1. Хүүхдүүд тойрог үүсгэн гар гараасаа барина.\n2. Голд нь нэг хүүхэд \"мэлхий\" болж суугаад, бусад нь дуулж эргэнэ.\n3. Дуу дуусахад \"мэлхий\" нэг хүүхдийг сонгож солигдоно.\nДүрэм: Ээлжээ хүлээнэ; хамтдаа дуулна.\nДүгнэлт: Ардын ямар тоглоом мэдэх вэ гэж ярилцана.","learner":"- Тойрог үүсгэн дуулж эргэнэ.\n- Голд \"мэлхий\" болж суугаад дараагийн хүүхдээ сонгоно.\n- Мэддэг ардын тоглоомоо нэрлэнэ."}]},"2028-01-26":{"method":"Шинжлэн судлах арга (давтамж)","link":"БНО3.1г. Цаг агаарын байдлыг зураг, тэмдэг ашиглан илэрхийлж, тохирсон хувцас болон хийх үйл ажиллагаагаа сонгож тайлбарлана.","competence":"Өөрийгөө хамгаалах (их хүйтэн, хүйтэн жавраас болгоомжлох), шүүн тунгаах","materials":"Их хүйтэн, цасан шуурга, мөстөлтийн зурагт карт, хүүхэлдэй ба хувцас, ороолт, термометрийн зураг, мөс","criteria":"Их хүйтэн, цасан шуурга, мөстөлт зэрэг цаг агаарын үзэгдлийг тайлбарлан, насанд хүрэгчийн сануулгатайгаар болгоомжлох үйлдэл хийдэг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, термометрийн зургийг үзүүлэн \"Өнөөдөр хүйтэн үү, дулаан уу?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Термометрийн зургийг харж \"Маш хүйтэн байна\" гэж хэлнэ.\n- Хүйтэнд ямар мэдрэмж төрдгийг хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Зурагт карт: Их хүйтэн, цасан шуурга, мөстөлтийн зургийг үзүүлж \"Энэ үед юу болох вэ?\" гэж ярилцана.\n- Хамгаалах арга: Хамар, хацар, хуруугаа хамгаалах (ороолт ороох, бээлий өмсөх), мөсөн дээр жижиг алхмаар алхах, шуургатай үед гадуур гарахгүй байхыг дүрд тоглуулна.\n- Мөс мэдрэх: Мөсийг бээлийтэй болон бээлийгүй гараар барьж ялгааг мэдрүүлнэ.\nБагшийн чиглүүлэх асуулт:\n1. Их хүйтэнд биеийн аль хэсэг хамгийн түрүүнд даардаг вэ?\n2. Хамар, хацар чинь хөлдөж байвал юу хийх вэ?\n3. Шуургатай үед хэнтэй байх ёстой вэ?","learner":"Зурагт карт:\n- Зураг бүрийг нэрлэж, юу болохыг (\"Мөс гулгамтгай, халтирна\") тайлбарлана.\nХамгаалах арга:\n- Ороолтоо хамар, амаа хучиж ороож үзүүлнэ.\n- Мөсөн дээр \"оцон шувуу\" шиг жижиг алхмаар алхаж үзүүлнэ.\n- \"Шуургатай үед томчуудтайгаа гэртээ байна\" гэж хэлнэ.\nМөс мэдрэх:\n- Мөсийг бээлийтэй, бээлийгүй гараар барьж, \"Бээлийгүй бол маш хүйтэн\" гэж харьцуулна.\nАсуултад хариулах:\n- Хамар, хацар даарвал томчуудад хэлж, дотогш орно гэж хариулна."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Дүрт тоглоомын буланд өвлийн хувцас байрлуулж, хүүхдүүд хүүхэлдэйгээ дулаан хувцаслаж буйг ажиглана.","learner":"- Хүүхэлдэйгээ дулаан хувцаслаж, ороолтыг нь ороож өгнө.\n- Найздаа хувцаслахад тусална."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Их хүйтний тухай шүлэг (\"Жавар өвгөн\") уншиж, цээжлүүлнэ.","learner":"- Шүлгийг сонсож мөр мөрөөр давтана.\n- Шүлэгт гарсан \"жавар\", \"хүйтэн\" гэх үгсийг нэрлэнэ.\n- Шүлгийг хөдөлгөөнөөр (чичрэх, гараа үлээх) дагуулна."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Байгаль шинжлэлийн төв: Цаг агаарын тэмдгийг тохирох хувцастай тааруулах.\nУрлагийн төв: \"Жавар өвгөн\" – цагаан будгаар хөх цаасан дээр хээ зурах.\nХэл ярианы төв: Аюултай нөхцөлийн зургаар \"Юу хийх вэ?\" ярилцах.","learner":"Байгаль шинжлэлийн төв:\n- Тэмдэг ба хувцсыг тааруулж тайлбарлана.\nУрлагийн төв:\n- Хөх цаасан дээр цагаан будгаар цан мэт хээ зурна.\nХэл ярианы төв:\n- Аюултай нөхцөлд юу хийхээ \"Би ... хийнэ\" гэж хэлнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 6 (1). Ажиглалт: Тагтаа ажиглах\nАжиглалтын зорилго: Тагтаа шувууны гадаад төрх, хөдөлгөөн, хооллох байдлыг ажиглаж, ажигласан зүйл болон өөрт төрсөн сэтгэгдлээ чөлөөтэй илэрхийлэх.\nАжиглалтын явц: Багш хүүхдүүдийг талбайд гаргаж, тагтаа нисэж ирэх, алхах, тоншиж, сүргээрээ байх байдлыг ажиглуулна.\nХүүхдээс асуух асуулт: «Тагтаа ямар өнгөтэй байна вэ?», «Тагтааны хушуу ямар харагдаж байна вэ?», «Тагтаа яаж алхаж байна вэ?», «Тагтаа нисэхдээ далавчаа яаж хөдөлгөж байна вэ?», «Тагтаа хоолоо яаж идэж байна вэ?», «Тагтаанд ямар хоол тохиромжтой гэж чи бодож байна вэ?», «Тагтаа бусад шувуудаас юугаараа өөр вэ?»\nБагшийн тайлбар: Тагтаа бол хүний ойр орчимд амьдардаг өвөлждөг шувуу. Тэд байшингийн дээвэр, хонгил, тусгай тагтааны байр, модны ойролцоо амьдардаг. Тагтаа үр тариа, үйрмэг, жижиг үр зэргийг тоншиж иддэг. Өвөл газар цас, мөсөөр хучигддаг тул шувуудад хоол олоход хэцүү байдаг. Тиймээс хүмүүс тэжээлүүрт үр, үйрмэг хийдэг.\nХүүхдэд зориулсан богино шүлэг «Тагтаа»: «Тагтаа дуугүй дүүлэн нисэв, Талбай дээр сүрэглэн буув. Жижиг үрээ тоншин идээд, Жиргүүрээ дахин нисэв.»","learner":"- Тагтааг үргээхгүй, чимээгүй ажиглана.\n- Тагтааны өнгө, хушуу, хөлийг ажиглан нэрлэнэ.\n- Тагтаа хэрхэн алхаж, тоншиж, сүргээрээ нисч байгааг ярина.\n- Тагтааг хэрээтэй харьцуулж \"Тагтаа саарал, хэрээнээс жижиг\" гэж хэлнэ.\n- «Тагтаа» шүлгийг багштай хамт давтан хэлнэ.\n- Тагтаанд ямар хоол өгч болохыг хэлнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Шуурга, нар»\nЗорилго: Цаг агаарын өөрчлөлтөд хурдан хариу үйлдэл хийх.\nЯвц:\n1. Багш \"Нар!\" гэхэд хүүхдүүд чөлөөтэй алхана.\n2. \"Шуурга!\" гэхэд бүгд \"гэр\" (цагираг) рүү орж бие биенээ тэврэнэ.\n3. \"Мөстөлт!\" гэхэд жижиг алхмаар болгоомжтой алхана.\nДүрэм: Гүйхдээ түлхэлцэхгүй.\nДүгнэлт: Их хүйтэнд юу хийхээ давтана.","learner":"- Тушаалыг сонсож зөв хөдөлгөөн хийнэ.\n- Шуургын үед \"гэр\" рүүгээ орно.\n- Их хүйтнээс хамгаалах аргаа давтан хэлнэ."}]},"2028-01-27":{"method":"Зохиолд суурилсан арга (давтамж)","link":"ХЯ3.2а. Харилцан ярианд өөрийн санаачилгаар оролцож, санал бодлоо илэрхийлнэ.","competence":"Нийгэм, сэтгэл хөдлөлийн хөгжил (бусдын таагүй сэтгэлийн шалтгааныг ойлгож энэрэх), харилцах (санаачилгатай ярих)","materials":"«Номингийн анхны золголт» зурагт карт, сэтгэл хөдлөлийн нүүрний карт, нөхцөл байдлын зурагт карт, «Энэрлийн зүрх»","criteria":"Бусдын таагүй сэтгэл хөдлөлийн шалтгааныг энгийнээр тайлбарлаж, тайвшруулах, туслах зэрэг энэрэх үйлдэл үзүүлдэг. Харилцан ярианд өөрийн санаачилгаар оролцож санал бодлоо илэрхийлдэг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Чи бухимдсан үедээ хэн чамд тусалдаг вэ?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Бухимдсан үедээ хэн тусалдгийг (\"Ээж минь тэвэрдэг\") хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Нөхцөл байдлын карт: \"Найз нь зургаа урчихсан\", \"Тоглоомд ороогүй үлдсэн\", \"Бууз чимхэж чадахгүй байгаа\" зургийг үзүүлж дүрийн сэтгэл, шалтгааныг ярилцуулна.\n- \"Би яаж туслах вэ?\": Хүүхдүүд нөхцөл бүрт туслах үйлдлийг санаачилгаараа санал болгож, дүрд тоглоно.\n- Номинд туслах: Номын эмээ шиг \"Тэвчээртэй байгаарай, хамтдаа оролдоё\" гэж найздаа хэлэх дадлага хийнэ.\nБагшийн чиглүүлэх асуулт:\n1. Энэ хүүхэд яагаад гунигтай байна вэ?\n2. Чи түүнд юу гэж хэлэх вэ?\n3. Тусламж авахад ямар санагддаг вэ?","learner":"Нөхцөл байдлын карт:\n- Зураг бүрийн дүрийн сэтгэлийг нэрлэж, \"Тэр ... болохоор гунигтай байна\" гэж шалтгааныг тайлбарлана.\n\"Би яаж туслах вэ?\":\n- Нөхцөл бүрт туслах аргаа санаачилгаараа санал болгоно.\n- Найзтайгаа дүрд тоглож, тэврэх, хамтдаа хийх зэрэг үйлдэл үзүүлнэ.\nНоминд туслах:\n- \"Тэвчээртэй байгаарай, хамтдаа оролдоё\" гэж найздаа хэлнэ.\nАсуултад хариулах:\n- Тусламж авахад \"баярласан, амар болсон\" гэж мэдрэмжээ хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Тоглох үед найздаа тусалж буй хүүхдүүдийг ажиглаж \"Энэрлийн зүрх\" өгнө.","learner":"- Тусламж хэрэгтэй найзаа анзаарч тусална.\n- Тусалсныхаа төлөө \"Энэрлийн зүрх\" авна."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – хоёр дахь уншлага (2): «Номингийн анхны золголт» (Төлөвлөгөөний хуудсыг 01.25-ны төлөвлөлтийн дараа үзнэ үү.)\n- Номын тухай эргэн сануулах асуулт асууна: «Буузаа чимхэхэд юу болсон бэ?»\n- Түр зогсож асуух: «Номин яагаад бухимдсан бэ? Эмээ нь яаж тусалсан бэ?»\n- Шинэ үг: «Золгох», «Хадаг барих», «Мэндлэх» – үйлдлээр үзүүлэх\n- Уншсаны дараа: Дүрд тоглох – эмээ, өвөө, ач нар болж золгох","learner":"- Номын үйл явдлыг эргэн санаж ярина.\n- Номин бухимдсан шалтгаан, эмээгийн тусламжийг тайлбарлана.\n- «Золгох», «Хадаг барих», «Мэндлэх» үгийг үйлдлээр үзүүлнэ.\n- Эмээ, өвөө, ач нарын дүрд тоглож золгоно."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: \"Найздаа зориулсан зүрх\" – цаасан зүрх чимэглэж бэлэглэх.\nХэл ярианы төв: Сэтгэл хөдлөл ба шалтгааны картыг тааруулах.\nДүрт тоглоомын төв: \"Цагаан сарын ширээ\" – гурилан зуурмагаар бууз чимхэх.","learner":"Урлагийн төв:\n- Зүрхээ чимэглэж, найздаа \"Чамдаа зориулав\" гэж бэлэглэнэ.\nХэл ярианы төв:\n- Сэтгэл хөдлөл ба шалтгааныг тааруулж тайлбарлана.\nДүрт тоглоомын төв:\n- Зуурмагаар бууз чимхэж, чадахгүй байгаа найздаа тусална."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 6 (2). Хөдөлмөрийн үйл ажиллагаа: Хүүхэлдэйнд цасан гулгуур хийх\nХөдөлмөрийн зорилго: Хамтран ажиллах, хийсэн ажлынхаа үр дүнг хараад баярлах, жижиг бүтээл хийх сонирхол төлөвшүүлэх.\nЯвц: Багш хүүхдүүдэд хүүхэлдэйнд зориулж жижиг цасан гулгуур хийх санааг гаргана.\nХүүхдүүд:\n- цасыг нэг газар зөөлөн овоолно;\n- багшийн тусламжтайгаар жижиг налуу гулгуур хэлбэр гаргана;\n- цасыг гараараа эсвэл жижиг хүрзээр тэгшилнэ;\n- хийсэн гулгуураа хүүхэлдэйгээр туршиж үзнэ.\nБагш асууна: «Бид юу хийсэн бэ?», «Хамтдаа хийхэд ямар байсан бэ?», «Хүүхэлдэй гулгаж чадсан уу?»","learner":"- Найзуудтайгаа хамтран цасыг нэг газар зөөлөн овооно.\n- Багшийн тусламжтайгаар налуу гулгуурын хэлбэр гаргана.\n- Гулгуурын гадаргууг гараараа, жижиг хүрзээр тэгшилнэ.\n- Хүүхэлдэйгээ гулгуулж туршаад үр дүндээ баярлана.\n- \"Бид хамтдаа гулгуур хийсэн, хүүхэлдэй гулгалаа\" гэж ярина."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Найзаа баярлуул»\nЗорилго: Бусдын сэтгэлийг ойлгож, энэрэх үйлдэл хийх.\nЯвц:\n1. Нэг хүүхэд гунигтай дүр үзүүлж тойргийн голд сууна.\n2. Бусад хүүхдүүд ээлжлэн баярлуулах үг хэлж, үйлдэл хийнэ.\n3. \"Гунигтай\" хүүхэд инээмсэглэвэл дараагийн хүүхэд солигдоно.\nДүрэм: Эелдэг үг хэлнэ; шоолохгүй.\nДүгнэлт: \"Хүнийг юу баярлуулдаг вэ?\" гэж ярилцана.","learner":"- Ээлжээр \"гунигтай\" дүр үзүүлнэ.\n- Найзаа баярлуулах эелдэг үг хэлж, үйлдэл хийнэ.\n- \"Хүнийг ... баярлуулдаг\" гэж дүгнэнэ."}]},"2028-01-28":{"method":"Шинжлэн судлах арга (давтамж)","link":"ХЯ3.2в. Юмсын шинж чанар, онцлог илэрхийлсэн үгийг яриандаа ашиглана.","competence":"Шүүн тунгаах (мэдрэхүйгээр харьцуулах), харилцах (шинж чанарын үг хэрэглэх)","materials":"Мөс, цас, бүлээн ус, давс, ноос, торго, чулуу, «Ид шидийн уут», томруулдаг шил, гурван аяга","criteria":"Мэдрэхүйн тусламжтайгаар юмсын шинж чанарыг ялгаж харьцуулдаг. Шинж чанарыг илэрхийлсэн үгийг яриандаа ашигладаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, мөс, ноос хоёрыг барьж мэдрүүлнэ.","learner":"- Мэндчилж тойрогт сууна.\n- Мөс, ноосыг барьж \"Мөс хүйтэн, гөлгөр; ноос дулаан, зөөлөн\" гэж харьцуулна."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Туршилт: Гурван аяганд мөс хийж, нэгд нь бүлээн ус, нэгд нь давс цацаж, нэгийг нь хэвээр үлдээгээд аль нь хурдан хайлахыг ажиглуулна.\n- Мэдрэх: Ноос, торго, чулууг нүдээ аниад тэмтэрч ялгуулна.\n- Үгээр илэрхийлэх: Хүүхдүүдийн хэлсэн шинж чанарын үгсийг самбарт зургаар тэмдэглэнэ.\nБагшийн чиглүүлэх асуулт:\n1. Аль аяганы мөс хамгийн хурдан хайлсан бэ? Яагаад?\n2. Торго, ноос хоёр юугаараа ялгаатай вэ?\n3. Энэ чулууг өөр ямар үгээр дүрслэх вэ?","learner":"Туршилт:\n- Гурван аяганы мөсийг ажиглаж, аль нь хурдан хайлж байгааг хэлнэ.\n- \"Бүлээн усанд хурдан хайлсан, учир нь дулаан\" гэж таамаглалаа хэлнэ.\nМэдрэх:\n- Нүдээ аниад ноос, торго, чулууг тэмтэрч нэрийг нь таана.\n- \"Торго гөлгөр, ноос сэвсгэр, чулуу хатуу, хүнд\" гэж ялгааг хэлнэ.\nҮгээр илэрхийлэх:\n- Шинж чанарын үгсийг давтан хэлж, самбарт тэмдэглэхэд оролцоно."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Байгаль шинжлэлийн буланд томруулдаг шил, мөс, цас байрлуулж ажиглана.","learner":"- Томруулдаг шилээр мөс, цасыг ажиглана.\n- Ажигласнаа найздаа ярина."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Мэдрэхүйн тухай ном (\"Миний таван мэдрэхүй\") уншиж, мэдрэхүй бүрийг биеийн хэсэгтэй холбуулна.","learner":"- Номыг сонсож мэдрэхүй бүрийг нэрлэнэ.\n- Нүд – харах, чих – сонсох, хамар – үнэрлэх гэж биеийн хэсгийг заана."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Байгаль шинжлэлийн төв: \"Ид шидийн уут\" – эд зүйлийг тэмтэрч таах.\nУрлагийн төв: Ноос, торго, цаасаар \"Мэдрэхүйн самбар\" наах.\nХэл ярианы төв: Шинж чанарын карт сугалж эд зүйл дүрслэх.","learner":"Байгаль шинжлэлийн төв:\n- Уутанд гараа хийж тэмтэрч, шинжийг нь хэлээд нэрийг нь таана.\nУрлагийн төв:\n- Янз бүрийн материалыг нааж мэдрэхүйн самбар хийнэ.\nХэл ярианы төв:\n- Картын шинжийг хэлж, тэр шинжтэй эд зүйлийг өрөөнөөс олно."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 6 (3). Хөдөлгөөнт тоглоом: «Бид хөгжилтэй хүүхдүүд»\nТоглоомын зорилго: Багшийн дохио, зааврыг анхааралтай сонсох, өгсөн даалгаврыг зөв гүйцэтгэх, анхаарал төвлөрөл, хөдөлгөөний зохицуулалтыг хөгжүүлэх.\nТоглоомын аргачлал: Хүүхдүүд талбайд зайтай зогсоно. Багш хөдөлгөөний нэр хэлж өгнө. Хүүхдүүд багшийн хэлсэн хөдөлгөөнийг зөв дагаж хийнэ:\n- «Тагтаа шиг нисээрэй» – гараа дэлгэн зөөлөн гүйнэ.\n- «Үр тоншоорой» – бөхийж, тоншиж байгаа мэт хөдөлгөөн хийнэ.\n- «Цас орлоо» – гараа дээш өргөн эргэлдэнэ.\n- «Цагирагт ороорой» – багшийн заасан тойрогт очиж зогсоно.\nДүрэм:\n- Багшийн үгийг анхааралтай сонсоно.\n- Найзыгаа түлхэхгүй, мөргөхгүй.\n- Дохиогоор хөдөлж, дохиогоор зогсоно.\n- Хөдөлгөөнийг тайван, аюулгүй хийнэ.","learner":"- Талбайд найзуудаасаа зайтай зогсоно.\n- «Тагтаа шиг нисээрэй» гэхэд гараа дэлгэн зөөлөн гүйнэ.\n- «Үр тоншоорой» гэхэд бөхийж тоншиж буй мэт хөдөлнө.\n- «Цас орлоо» гэхэд гараа дээш өргөн эргэлдэнэ.\n- «Цагирагт ороорой» гэхэд заасан тойрогт очиж зогсоно.\n- Найзаа түлхэхгүй, дохиогоор зогсоно."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Би юу бодов?»\nЗорилго: Шинж чанарын үгээр юмыг дүрслэх, таах.\nЯвц:\n1. Багш \"Би хүйтэн, гөлгөр, тунгалаг юм бодлоо\" гэж дүрсэлнэ (мөс).\n2. Хүүхдүүд таана.\n3. Хүүхэд өөрөө юм бодож, 3 шинжээр дүрсэлнэ.\nДүрэм: Нэрийг нь хэлэхгүй.\nДүгнэлт: Өнөөдөр сурсан шинж чанарын үгсээ давтана.","learner":"- Багшийн дүрслэлийг сонсож юуг бодсоныг таана.\n- Өөрөө юм бодож 3 шинжээр дүрсэлнэ.\n- Шинж чанарын үгсээ давтана."}]},"2028-01-29":{"method":"Төсөлд суурилсан арга (давтамж)","link":"БНО3.2д. Гэр бүлийн орчинд уламжлалт баярыг хэрхэн тэмдэглэдэг талаар өөрийн үгээр тайлбарлаж, ардын тоглоом, наадгайгаар наадна.","competence":"Бүтээлчээр сэтгэх (байгалийн болон дахин ашиглах материалаар бүтээл хийх), соёлын мэдлэг","materials":"Нарсны боргоцой, мөчир, хайрцаг, хуванцар таг, өнгийн цаас, цавуу, хадаг хэлбэрийн цаас, Цагаан сарын чимэглэлийн жишээ зураг","criteria":"Тоглоом болон байгалийн материал, дахин ашиглах материалаас сонгож Цагаан сарын чимэглэл, бүтээл урладаг. Баярын заншлаа бүтээлээрээ илэрхийлж тайлбарладаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, гэрээс авчирсан байгалийн болон хаягдал материалаа үзүүлэхийг урина.","learner":"- Мэндчилж тойрогт сууна.\n- Авчирсан материалаа нэрлэнэ.\n- \"Үүгээр ... хийж болно\" гэж санаагаа хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Санаа олох: Цагаан сарын ширээний чимэглэл (боов, ул боов, хадаг)-ийн зургийг үзүүлж, \"Юугаар хийж болох вэ?\" гэж асууна.\n- Төлөвлөх: Хүүхэд бүр юу хийхээ сонгож, материалаа цуглуулна.\n- Бүтээх: Хайрцгаар \"ул боов\", тагаар \"чихэр\", цаасаар \"хадаг\" хийж, бүлгийн \"Цагаан сарын ширээ\"-г бүрдүүлнэ.\nБагшийн чиглүүлэх асуулт:\n1. Чи юу хийхээр шийдсэн бэ?\n2. Ямар материал хэрэгтэй вэ?\n3. Хаягдал материалыг дахин ашиглавал ямар сайн бэ?","learner":"Санаа олох:\n- Зургийг харж Цагаан сарын ширээний зүйлсийг нэрлэнэ.\nТөлөвлөх:\n- \"Би ... хийнэ, ... материал хэрэгтэй\" гэж төлөвлөгөөгөө хэлнэ.\n- Материалаа цуглуулна.\nБүтээх:\n- Хайрцаг, таг, цаасыг хайчилж, нааж, будаж бүтээлээ хийнэ.\n- Бүтээлээ бүлгийн \"Цагаан сарын ширээ\" дээр байрлуулна.\n- \"Хаягдлыг дахин ашиглавал байгаль цэвэр байна\" гэж хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Барилгын буланд хайрцаг, цилиндр байрлуулж, \"Монгол гэр\" барих хүүхдүүдийг ажиглана.","learner":"- Хайрцаг, цаасаар Монгол гэр барина.\n- Найзтайгаа хамтран гэрээ чимэглэнэ."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – гурав дахь уншлага (3): «Номингийн анхны золголт» (Төлөвлөгөөний хуудсыг 01.25-ны төлөвлөлтийн дараа үзнэ үү.)\n- Номын үйл явдлыг хүүхдүүдээр түлхүү яриулна.\n- Дүгнэн ярилцах: «Цагаан сарын ямар заншил чамд таалагдсан бэ? Яагаад?»\n- Шинэ үгсээр өгүүлбэр зохиох: золгох, хадаг, чимхэх, ерөөл, тэвчээртэй\n- Бүтээл: Цаасан хадаг будаж, хээгээр чимэглэх","learner":"- Номын нэр, зохиолч, зураачийг санаж хэлнэ.\n- Номын зургийг харж Номингийн түүхийг өөрийн үгээр ярина.\n- Таалагдсан заншлаа шалтгаантай нь хэлнэ.\n- Шинэ үгсээр өгүүлбэр зохионо.\n- Цаасан хадгаа будаж чимэглээд, найздаа барьж золгоно."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: Боргоцой, мөчрөөр \"Өвлийн цэцэг\" хийх.\nАрдын тоглоомын төв: Шагай, хүүхэлдэйгээр золгох тоглоом.\nХэл ярианы төв: \"Миний ерөөл\" – гэр бүлдээ хэлэх ерөөлийн үг зохиох.","learner":"Урлагийн төв:\n- Боргоцой, мөчрийг будаж, нааж \"Өвлийн цэцэг\" бүтээнэ.\nАрдын тоглоомын төв:\n- Хүүхэлдэйгээр золгож, шагайгаар тоглоно.\nХэл ярианы төв:\n- Гэр бүлдээ хэлэх ерөөлөө зохиож хэлнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 6 (4). Ганцаарчилсан үйл ажиллагаа: Нэмэлт дэмжлэг шаардлагатай хүүхэдтэй ажиллах\nСэдэв: «Туг унагахгүй алхъя»\nЗорилго: Юмсын хооронд сүлжиж алхах, тэнцвэрээ хадгалах, орон зайд баримжаалах чадварыг дэмжих.\nЯвц: Багш талбайд жижиг туг, конус эсвэл тоглоомыг зайтай байрлуулна. Хүүхэд тэдгээрийн хооронд сүлжиж алхана.\nЗөвлөмж (багшид):\n- Алхмыг тайван, жигд хийлгэнэ.\n- Хүүхдийг урамшуулж, магтана.\n- Хэрэв тэнцвэр алдагдвал дэмжиж үргэлжлүүлнэ.","learner":"- Туг, конусын хооронд сүлжиж алхана.\n- Тугийг мөргөж унагахгүй байхыг хичээнэ.\n- Гараа дэлгэж тэнцвэрээ хадгална.\n- Багшийн дэмжлэгтэйгээр замаа дахин туулж, амжилтаа хэлнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Золгоё»\nЗорилго: Цагаан сарын золгох ёсыг тоглоомоор бататгах.\nЯвц:\n1. Хүүхдүүд хоёр эгнээ болж нүүр нүүрээ харж зогсоно.\n2. Багшийн дохиогоор урд талын найзтайгаа \"Амар байна уу?\" гэж золгоно.\n3. Нэг эгнээ нэг алхам шилжиж, шинэ найзтайгаа золгоно.\nДүрэм: Эелдэг мэндэлнэ; түлхэхгүй.\nДүгнэлт: Сарын турш юу сурснаа хамтдаа санана.","learner":"- Эгнээнд зогсож, урд талын найзтайгаа золгоно.\n- \"Амар байна уу? Сайхан шинэлж байна уу?\" гэж мэндэлнэ.\n- Шилжиж шинэ найзтайгаа золгоно.\n- Сарын турш сурсан зүйлээ хуваалцана."}]}},"readings":[{"days":"01.04 (1-р уншлага), 01.06 (2-р уншлага), 01.08 (3-р уншлага)","book":"Бээлий","author":"Украин ардын үлгэр (багшийн найруулга). Зураг: багшийн бэлтгэсэн зурагт карт (6 хуудас)","goals":"- Үгсийн сан болон ерөнхий мэдлэгийг тэлэх\n- Харилцан ярилцах, хүүрнэн өгүүлэх чадварыг хөгжүүлэх\n- Сонсож ойлгох чадварыг хөгжүүлэх\n- Сэтгэн бодох үйлийг чиглүүлэн дэмжих\n- Амьтдын хэмжээ, шинж чанарыг илэрхийлсэн үгийг (жижиг, том, сэвсгэр, хүнд) яриандаа ашиглах (Хэл яриа)\n- Амьтдыг том, жижгээр нь жишиж, 5 хүртэл тоолох (Математик)\n- Найзуудтайгаа хуваалцах, бусдад байр тавьж өгөх (Нийгэм-сэтгэл хөдлөл)","summary":"Өвгөн ойгоор явахдаа бээлийгээ гээжээ. Хүйтэнд даарсан хулгана бээлийнд орж байрлана. Араас нь мэлхий, туулай, үнэг, чоно ирж «Би орж болох уу?» гэж асуухад бүгд байр тавьж өгнө. Эцэст нь том баавгай ирж шахаж ороход бээлий тэсэхгүй урагдаж, амьтад бүгд гүйлдэн гарна. Өвгөний нохой бээлийг олж эзэндээ авчирна.","words":[["Бээлий – гарт өмсдөг дулаан хувцас","Гээх – юмаа санамсаргүй унагаж орхих (х. 1)","Шахах – хүчээр багтах гэж оролдох (х. 5, биеэр үзүүлэх)"],["Ой – олон модтой газар","Сэвсгэр – зөөлөн, үстэй (х. 3)","Даарах – хүйтэнд чичрэх (х. 2, биеэр үзүүлэх)"],["Амьтдын нэр – хулгана, мэлхий, туулай, үнэг, чоно, баавгай","Багтах – зай хүрэлцэх (х. 4)","Урагдах – задарч салах (х. 6, зураг дээр заах)"]],"r1":{"Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Бээлийд хэн орох бол?» (хуудас 2)\n«Ийм олон амьтан багтах болов уу?» (хуудас 4)\n«Баавгай орвол юу болох бол?» (хуудас 5)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Гээх – юмаа санамсаргүй унагаж орхих» (хуудас 1)\n«Сэвсгэр – зөөлөн, үстэй» (хуудас 3)\n«Багтах – зай хүрэлцэх» (хуудас 4)","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Бээлийд ямар ямар амьтан орсон бэ? Дарааллаар нь хэлээрэй.»\n«Хамгийн жижиг нь хэн бэ? Хамгийн том нь хэн бэ?»\nАмьтдыг хуруугаараа тоолох."},"r2":{"Номын тухай эргэн санах: Эхлэл, өрнөл, төгсгөл хэсгүүдтэй холбоотой энгийн асуултууд асуух":"«Номд өвгөн юугаа гээсэн бэ?»\n«Амьтад бээлийд орохдоо юу гэж асуусан бэ?»\n«Үлгэр хэрхэн төгссөн бэ?»","Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Хулгана яагаад бээлийд орсон бэ?» (хуудас 2)\n«Туулай ямар үстэй вэ? Ямар үгээр хэлэх вэ?» (хуудас 3)\n«Чоно, үнэг хоёрын аль нь том бэ?» (хуудас 4)\n«Бээлий яагаад урагдсан бэ?» (хуудас 6)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Даарах» (хуудас 2) биеэр үзүүлэх\n«Шахах» (хуудас 5) хүүхдүүд жижиг тойрогт шахалдан үзүүлэх\n«Урагдах» (хуудас 6) зураг дээр заах","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Хэрвээ чи бээлийн дотор байсан бол баавгайд юу гэж хэлэх байсан бэ?»\nДүрд тоглох: амьтдын баг зүүж «Би орж болох уу?» гэж асуух.\nАмьтдын зургийг жижгээс том руу дараалуулах."},"r3":{"Уншихын өмнө":"Энэ номыг бид хамтдаа 2 удаа уншчихсан учраас номын нэрийг та нар мэдэж байгаа шүү дээ. Энэ номын нэр юу билээ? гэх зэргээр хүүхдийг эхнээс нь татан оролцуулна.\nНомын зургуудыг тогтон харуулж ярилцана.\n- Бээлий ямар хэрэгтэй вэ?\n- Найзууддаа байр тавьж өгөх нь яагаад сайн бэ?","Уншиж байхдаа":"Зургийг заан юу болж байгаа тухай асууна: «Энд хэн ирж байна?», «Тэр юу гэж асууж байна?», «Дараа нь юу болох вэ?» Учир шалтгааныг холбон тайлбарлахыг дэмжинэ: «Амьтад яагаад бүгд гүйлдэн гарсан бэ?»","Уншиж дуусаад":"- Дүгнэн ярилцах: «Амьтад бие биедээ байр тавьж өгсөн нь зөв үү? Яагаад?»\n- Шинэ сурсан үгсээр өгүүлбэр зохиолгох: гээх, сэвсгэр, багтах, шахах, урагдах\n- Бүтээл: Цаасан бээлий будаж, дотор нь амьтдын зургийг нааж тоолох"},"text":"Хуудас 1. Нэгэн хүйтэн өглөө өвгөн нохойтойгоо ойгоор явж байгаад бээлийгээ гээжээ.\nХуудас 2. Хүйтэнд даарсан жижигхэн хулгана бээлийг олж хараад «Энд дулаахан юм байна» гээд орж байрлав. Удалгүй мэлхий ирж «Би орж болох уу?» гэхэд хулгана «Ороорой» гэлээ.\nХуудас 3. Дараа нь сэвсгэр цагаан туулай ирлээ. «Би ч бас орж болох уу?» Хулгана, мэлхий хоёр «Ороорой, хамтдаа дулаахан байя» гэв.\nХуудас 4. Тэгтэл улаан үнэг, саарал чоно хоёр ирэв. Бүгд бага зэрэг шахалдаж, тэднийг ч бас багтаажээ.\nХуудас 5. Хамгийн сүүлд том бор баавгай ирээд «Би ч орно!» гэж шахаж орох гэв. Бээлий улам чангарсаар...\nХуудас 6. Пүд! Бээлий урагдаж, амьтад бүгд гүйлдэн гарчээ. Өвгөний нохой урагдсан бээлийг олж, эзэндээ хуцан авчирсан гэнэ."},{"days":"01.11 (1-р уншлага), 01.13 (2-р уншлага), 01.15 (3-р уншлага)","book":"Хүчтэй болохыг хүссэн Бат","author":"Багшийн бэлтгэсэн өгүүлэг. Зураг: багшийн бэлтгэсэн зурагт карт (6 хуудас)","goals":"- Үгсийн сан болон ерөнхий мэдлэгийг тэлэх\n- Харилцан ярилцах, хүүрнэн өгүүлэх чадварыг хөгжүүлэх\n- Сонсож ойлгох чадварыг хөгжүүлэх\n- Сэтгэн бодох үйлийг чиглүүлэн дэмжих\n- Эрүүл мэндэд тустай хүнсийг ялгаж нэрлэх (Хөдөлгөөн, эрүүл мэнд)\n- Бухимдсан үедээ тайвшрах аргыг сонгох (Нийгэм-сэтгэл хөдлөл)\n- Хүнсийг дүрс, өнгөөр нь ялгах (Математик)","summary":"Бат найзуудтайгаа чарга чирэх тоглоомд ялагдаад уурлаж, бухимдана. Тэр гүнзгий амьсгаа аваад тайвширсны дараа ээжээсээ «Яаж хүчтэй болох вэ?» гэж асууна. Ээж нь чихэр, ундаа биш харин сүү, мах, ногоо, жимс идэж, гадаа тоглож, эрт унтвал хүчтэй болно гэж зөвлөнө. Бат өдөр бүр эрүүл хоол идэж, хэдэн долоо хоногийн дараа чаргаа ганцаараа чирж чаддаг болно.","words":[["Хүнс – идэж уудаг зүйл","Ялагдах – тоглоомд түрүүлж чадахгүй байх (х. 1)","Чирэх – араасаа татаж явах (х. 1, үйлдлээр үзүүлэх)"],["Эрүүл – өвчингүй, хүчтэй","Бухимдах – сэтгэл нь тавгүйтэх (х. 2)","Гүнзгий амьсгаа авах (х. 2, хамтдаа хийх)"],["Чарга – цасан дээр гулгадаг хэрэгсэл (зураг дээр заах)","Тустай – биед сайн (х. 4)","Булчин чангалах (х. 6, гараа нугалан үзүүлэх)"]],"r1":{"Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Бат яагаад уурласан бэ?» (хуудас 1)\n«Бат тайвшрахын тулд юу хийх бол?» (хуудас 2)\n«Ээж нь ямар хоол санал болгох бол?» (хуудас 4)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Ялагдах – тоглоомд түрүүлж чадахгүй байх» (хуудас 1)\n«Бухимдах – сэтгэл нь тавгүйтэх» (хуудас 2)\n«Тустай – биед сайн» (хуудас 4)","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Бат яаж хүчтэй болсон бэ?»\n«Ямар хүнс биед тустай вэ?»\nХүүхэд бүр өөрийн дуртай эрүүл хоолоо нэрлэх."},"r2":{"Номын тухай эргэн санах: Эхлэл, өрнөл, төгсгөл хэсгүүдтэй холбоотой энгийн асуултууд асуух":"«Номд Бат юунд ялагдсан бэ?»\n«Ээж нь Батад юу гэж зөвлөсөн бэ?»\n«Ном хэрхэн төгссөн бэ?»","Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Бат уурласан үедээ биед нь юу болсон бэ?» (хуудас 1)\n«Гүнзгий амьсгаа авахад Батын сэтгэл ямар болсон бэ?» (хуудас 2)\n«Таваг дээр ямар ямар хүнс байна вэ? Тоолоорой.» (хуудас 4)\n«Бат яагаад чаргаа ганцаараа чирч чадсан бэ?» (хуудас 6)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Чирэх» (хуудас 1) хүүхдээр үзүүлүүлэх\n«Гүнзгий амьсгаа авах» (хуудас 2) хамтдаа хийх\n«Булчин чангалах» (хуудас 6) гараа нугалан үзүүлэх","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Чи уурласан үедээ юу хийдэг вэ?»\nДүрд тоглох: Бат болон ээжийн яриаг тоглох.\nХүнсний картыг «тустай – тусгүй» гэж хоёр бүлэгт ангилах."},"r3":{"Уншихын өмнө":"Энэ номыг бид хамтдаа 2 удаа уншчихсан учраас номын нэрийг та нар мэдэж байгаа шүү дээ. Энэ номын нэр юу билээ? гэх зэргээр хүүхдийг эхнээс нь татан оролцуулна.\nНомын зургуудыг тогтон харуулж ярилцана.\n- Хүчтэй болохын тулд юу хийх вэ?\n- Уурласан үедээ яаж тайвшрах вэ?","Уншиж байхдаа":"Зургийг заан юу болж байгаа тухай асууна: «Энд Бат юу хийж байна?», «Ээж нь юу гэж хэлж байна?», «Дараа нь юу болох вэ?» Учир шалтгааныг холбон тайлбарлахыг дэмжинэ: «Бат яагаад чихэр биш алим сонгосон бэ?»","Уншиж дуусаад":"- Дүгнэн ярилцах: «Батын хийсэн зүйлээс юу нь таалагдсан бэ? Яагаад?»\n- Шинэ сурсан үгсээр өгүүлбэр зохиолгох: ялагдах, бухимдах, тустай, чирэх\n- Бүтээл: Гурилан зуурмагаар «Батын эрүүл таваг» барих"},"text":"Хуудас 1. Бат найзуудтайгаа хэн нь чаргаа хурдан чирэх вэ гэж тоглов. Бат хамгийн сүүлд ирж ялагдлаа. Нүүр нь улайж, гараа зангидан уурлажээ.\nХуудас 2. Бат бухимдсандаа чаргаа өшиглөх гэснээ зогсов. «Эхлээд тайвширъя» гээд гүнзгий амьсгаа аваад тав хүртэл тоолов. Сэтгэл нь бага зэрэг уужрав.\nХуудас 3. Гэртээ ирээд Бат ээжээсээ «Би яаж хүчтэй болох вэ?» гэж асуужээ.\nХуудас 4. Ээж нь ширээн дээр сүү, мах, лууван, алим тавиад «Эдгээр нь биед тустай. Чихэр, ундаа их уувал шүд өвдөж, хүч орохгүй» гэв.\nХуудас 5. Тэр өдрөөс хойш Бат өдөр бүр эрүүл хоол идэж, гадаа тоглож, эрт унтдаг болов.\nХуудас 6. Хэдэн долоо хоногийн дараа Бат чаргаа ганцаараа уул руу чирч гарав. Тэр гараа нугалж булчингаа үзүүлээд «Би хүчтэй боллоо!» гэж баярлажээ."},{"days":"01.18 (1-р уншлага), 01.20 (2-р уншлага), 01.22 (3-р уншлага)","book":"Гурван торой","author":"Англи ардын үлгэр «Гурван гахай» (багшийн найруулга). Зураг: багшийн бэлтгэсэн зурагт карт (6 хуудас)","goals":"- Үгсийн сан болон ерөнхий мэдлэгийг тэлэх\n- Харилцан ярилцах, хүүрнэн өгүүлэх чадварыг хөгжүүлэх\n- Сонсож ойлгох чадварыг хөгжүүлэх\n- Сэтгэн бодох үйлийг чиглүүлэн дэмжих\n- Хүмүүсийн зан үйл яагаад тустай, тусгүй болохыг тайлбарлах (Нийгэм-сэтгэл хөдлөл)\n- Үйл явдлын эхлэл, өрнөл, төгсгөлийг дарааллын дагуу ярих (Хэл яриа)\n- Үйлийн дарааллыг (эхлээд, дараа нь, эцэст нь) тогтоох (Математик)","summary":"Гурван торой ээжээсээ салж өөр өөрийн байшин барина. Эхний торой сүрлээр, хоёр дахь нь модоор хурдан барьж тоглоход гарна. Гурав дахь нь удаан хичээж тоосгон байшин барина. Чоно ирж сүрэл, модон байшинг үлээж нураахад тэр хоёр ахындаа зугтана. Тоосгон байшинг чоно нурааж чадахгүй, бүтэлгүйтээд зугтана. Торойнууд хичээнгүй байх нь чухал гэдгийг ойлгоно.","words":[["Байшин – хүн амьдардаг барилга","Сүрэл – хатсан өвсний иш (х. 2)","Үлээх – амаараа хүчтэй салхи гаргах (х. 4, үйлдлээр үзүүлэх)"],["Тоосго – байшин барьдаг хатуу шоо (зураг дээр заах)","Хичээнгүй – ажлаа сайн, удаан хийдэг (х. 3)","Нураах – унагаж эвдэх (х. 4, шоогоор үзүүлэх)"],["Торой – гахайн зулзага","Залхуу – ажил хийх дургүй (х. 2)","Тогших – хаалгыг цохих (х. 5, үйлдлээр үзүүлэх)"]],"r1":{"Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Аль торойн байшин бат бөх байх бол?» (хуудас 3)\n«Чоно ирээд юу хийх бол?» (хуудас 4)\n«Торойнууд хаашаа зугтах бол?» (хуудас 5)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Сүрэл – хатсан өвсний иш» (хуудас 2)\n«Хичээнгүй – ажлаа сайн хийдэг» (хуудас 3)\n«Нураах – унагаж эвдэх» (хуудас 4)","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Торойнууд ямар ямар байшин барьсан бэ? Дарааллаар нь хэлээрэй.»\n«Аль торой зөв хийсэн бэ? Яагаад?»\nБайшингуудыг бат бөхөөр нь харьцуулах."},"r2":{"Номын тухай эргэн санах: Эхлэл, өрнөл, төгсгөл хэсгүүдтэй холбоотой энгийн асуултууд асуух":"«Номын эхэнд торойнууд юу хийсэн бэ?»\n«Дараа нь хэн ирсэн бэ?»\n«Эцэст нь юу болсон бэ?»","Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Эхний хоёр торой яагаад хурдан барьсан бэ?» (хуудас 2)\n«Гурав дахь торой яагаад тоглохгүй ажилласан бэ?» (хуудас 3)\n«Залхуу байх нь тустай юу, тусгүй юу?» (хуудас 4)\n«Ах нь дүү нараа яаж хамгаалсан бэ?» (хуудас 5)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Үлээх» (хуудас 4) хүүхдээр үзүүлүүлэх\n«Нураах» (хуудас 4) шоон байшингаар үзүүлэх\n«Тогших» (хуудас 5) ширээ тогшиж үзүүлэх","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Хэрвээ чи торой байсан бол ямар байшин барих байсан бэ?»\nДүрд тоглох: гурван торой ба чоно.\nҮлгэрийн 4 зургийг эхлэл, өрнөл, төгсгөлөөр дараалуулах."},"r3":{"Уншихын өмнө":"Энэ номыг бид хамтдаа 2 удаа уншчихсан учраас номын нэрийг та нар мэдэж байгаа шүү дээ. Энэ номын нэр юу билээ? гэх зэргээр хүүхдийг эхнээс нь татан оролцуулна.\nНомын зургуудыг тогтон харуулж ярилцана.\n- Хичээнгүй гэж ямар байхыг хэлэх вэ?\n- Залхуу байвал юу болдог вэ?","Уншиж байхдаа":"Зургийг заан юу болж байгаа тухай асууна: «Энд аль торой юу хийж байна?», «Чоно юу хийж байна?», «Дараа нь юу болох вэ?» Учир шалтгааныг холбон тайлбарлахыг дэмжинэ: «Чоно яагаад тоосгон байшинг нурааж чадаагүй бэ?»","Уншиж дуусаад":"- Дүгнэн ярилцах: «Гурав дахь торойгоос бид юу сурах вэ?»\n- Шинэ сурсан үгсээр өгүүлбэр зохиолгох: сүрэл, хичээнгүй, залхуу, нураах\n- Бүтээл: Шоо, хайрцгаар бат бөх байшин барьж, «чоно» болж үлээж шалгах"},"text":"Хуудас 1. Эрт урьдын цагт гурван торой ээжтэйгээ амьдардаг байжээ. Нэг өдөр ээж нь «Та нар томорлоо, өөрсдийн байшингаа бариарай» гэв.\nХуудас 2. Эхний торой сүрлээр, хоёр дахь торой модоор байшингаа маш хурдан бариад «Одоо тоглоё!» гэж залхуурчээ.\nХуудас 3. Гурав дахь торой тоосгыг нэг нэгээр нь өрж, өдөржин хичээнгүйлэн ажиллав. Ах нар нь түүнийг шоолж инээлдэв.\nХуудас 4. Нэгэн өдөр чоно ирж «Үф!» гэж үлээгээд сүрэн байшинг, дараа нь модон байшинг нураажээ. Хоёр торой айж гүйсээр ахындаа очив.\nХуудас 5. Чоно тоосгон байшингийн хаалгыг тогшиж, хүчлэн үлээв. Үлээсээр, үлээсээр ядарсан ч байшин нурсангүй. Чоно бүтэлгүйтээд ой руугаа зугтжээ.\nХуудас 6. Хоёр торой ахдаа «Уучлаарай, бид чамайг шоолсон. Хичээнгүй байх нь зөв юм байна» гэв. Тэд хамтдаа бат бөх байшин барьжээ."},{"days":"01.25 (1-р уншлага), 01.27 (2-р уншлага), 01.29 (3-р уншлага)","book":"Номингийн анхны золголт","author":"Багшийн бэлтгэсэн өгүүлэг. Зураг: багшийн бэлтгэсэн зурагт карт (6 хуудас)","goals":"- Үгсийн сан болон ерөнхий мэдлэгийг тэлэх\n- Харилцан ярилцах, хүүрнэн өгүүлэх чадварыг хөгжүүлэх\n- Сонсож ойлгох чадварыг хөгжүүлэх\n- Сэтгэн бодох үйлийг чиглүүлэн дэмжих\n- Гэр бүлийн орчинд уламжлалт баяр (Цагаан сар)-ыг хэрхэн тэмдэглэдгийг өөрийн үгээр тайлбарлах (Байгаль, нийгмийн орчин)\n- Бусдын сэтгэлийг ойлгож, энэрэх үйлдэл үзүүлэх (Нийгэм-сэтгэл хөдлөл)\n- Үгийг оновчтой сонгож дэлгэрэнгүй өгүүлбэрээр ярих (Хэл яриа)","summary":"Цагаан сар ойртож, Номин эмээ, өвөөгийндөө баярын бэлтгэл хийнэ. Тэд гэрээ цэвэрлэж, бууз чимхэнэ. Номин бууз чимхэж чадахгүй бухимдахад эмээ нь тэвчээртэй зааж өгнө. Шинийн нэгний өглөө Номин ах дүүсийнхээ хамт эмээ, өвөөдөө хадаг барин золгож, «Амар байна уу?» гэж мэндэлнэ. Өвөө нь Номинд ерөөл хэлж, Номин анхны золголтдоо баярлана.","words":[["Цагаан сар – монголчуудын уламжлалт баяр","Чимхэх – буузны амсрыг хуруугаар хавчих (х. 3)","Золгох – ахмад хүний гарыг доороос нь өргөн мэндлэх (х. 5, хосоороо үзүүлэх)"],["Хадаг – хүндэтгэлийн цэнхэр бүс даавуу (зураг дээр заах)","Тэвчээртэй – удаан хүлээж, дахин оролддог (х. 3)","Хадаг барих (х. 5, үйлдлээр үзүүлэх)"],["Битүүн – цагаан сарын өмнөх орой","Ерөөл – сайн сайхныг хүсэх үг (х. 6)","Мэндлэх – «Амар байна уу?» гэх (х. 5, хэлж үзүүлэх)"]],"r1":{"Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Номин эмээдээ юугаар туслах бол?» (хуудас 2)\n«Номин бууз чимхэж чадахгүй үедээ юу хийх бол?» (хуудас 3)\n«Өвөө нь Номинд юу гэж хэлэх бол?» (хуудас 6)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Чимхэх – буузны амсрыг хуруугаар хавчих» (хуудас 3)\n«Тэвчээртэй – дахин оролддог» (хуудас 3)\n«Ерөөл – сайн сайхныг хүсэх үг» (хуудас 6)","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Цагаан сарын өмнө Номингийнх юу юу хийсэн бэ?»\n«Номин хэнтэй хэрхэн золгосон бэ?»\nХүүхэд бүр гэртээ цагаан сараар юу хийдгээ хэлэх."},"r2":{"Номын тухай эргэн санах: Эхлэл, өрнөл, төгсгөл хэсгүүдтэй холбоотой энгийн асуултууд асуух":"«Номд Номин хэнийд очсон бэ?»\n«Буузаа чимхэхэд юу болсон бэ?»\n«Шинийн нэгний өглөө юу болсон бэ?»","Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Гэрээ яагаад цэвэрлэдэг вэ?» (хуудас 2)\n«Номин яагаад бухимдсан бэ? Эмээ нь яаж тусалсан бэ?» (хуудас 3)\n«Хэн хэнтэй хамгийн түрүүнд золгодог вэ?» (хуудас 5)\n«Номин ямар сэтгэлтэй байсан бэ? Яагаад?» (хуудас 6)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Золгох» (хуудас 5) хосоороо үзүүлэх\n«Хадаг барих» (хуудас 5) хадгаар үзүүлэх\n«Мэндлэх» (хуудас 5) «Амар байна уу?» гэж хэлэх","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Чи цагаан сараар хэнтэй золгох вэ?»\nДүрд тоглох: эмээ, өвөө, ач нар болж золгох.\nГурилан зуурмагаар бууз чимхэх дадлага."},"r3":{"Уншихын өмнө":"Энэ номыг бид хамтдаа 2 удаа уншчихсан учраас номын нэрийг та нар мэдэж байгаа шүү дээ. Энэ номын нэр юу билээ? гэх зэргээр хүүхдийг эхнээс нь татан оролцуулна.\nНомын зургуудыг тогтон харуулж ярилцана.\n- Цагаан сар гэж ямар баяр вэ?\n- Золгохдоо юу гэж мэндэлдэг вэ?","Уншиж байхдаа":"Зургийг заан юу болж байгаа тухай асууна: «Энд Номин юу хийж байна?», «Эмээ нь юу зааж байна?», «Дараа нь юу болох вэ?» Учир шалтгааныг холбон тайлбарлахыг дэмжинэ: «Номин яагаад баярласан бэ?»","Уншиж дуусаад":"- Дүгнэн ярилцах: «Цагаан сарын ямар заншил чамд таалагдсан бэ? Яагаад?»\n- Шинэ сурсан үгсээр өгүүлбэр зохиолгох: золгох, хадаг, чимхэх, ерөөл, тэвчээртэй\n- Бүтээл: Цаасан хадаг будаж, хээгээр чимэглэх"},"text":"Хуудас 1. Цагаан сар ойртож байлаа. Номин ээж, аавтайгаа эмээ, өвөөгийндөө баярын бэлтгэл хийхээр очив.\nХуудас 2. Тэд гэрээ цэвэрлэж, тавилгаа арчив. Эмээ нь «Шинэ жилийг цэвэрхэн угтдаг юм» гэв. Номин аяга таваг арчиж туслав.\nХуудас 3. Дараа нь бүгд бууз чимхэв. Номингийн бууз задраад байхад тэр бухимдав. Эмээ нь «Тэвчээртэй байгаарай, дахиад оролдоё» гээд гараас нь барьж заажээ.\nХуудас 4. Битүүний орой бүгд хамтдаа бууз идэж, өвөө нь үлгэр ярив. Номин «Маргааш би анх удаа золгоно» гэж сэтгэл догдолжээ.\nХуудас 5. Шинийн нэгний өглөө Номин хадаг барьж, өвөөгийнхөө гарыг доороос нь өргөн «Амар байна уу?» гэж золгов.\nХуудас 6. Өвөө нь «Эрүүл энх, сайн сурч, том хүүхэн болоорой» гэж ерөөв. Номин маш их баярлаж, «Ирэх жил би өөрөө бууз чимхэнэ» гэжээ."}]},"02":{"approverTitle":"АРГАЗҮЙЧ","approver":"Ц.ОДОНЧИМЭГ","exclude":["ХӨГЖИМ"],"links":{"НСХ3.1а":"ЗУ3.1а","НСХ3.2а":"ХӨГ3.1д","НСХ3.2б":"ХЯ3.2д","НСХ3.3б":"МАТ3.3а","ХЭМ3.1а":"МАТ3.1б","ХЭМ3.1в":"НСХ3.1в","ХЭМ3.1к":"МАТ3.2а","ХЭМ3.2з":"МАТ3.4а","ХЯ3.1б":"ХӨГ3.1б","ХЯ3.2б":"БНО3.2в","ХЯ3.2г":"БНО3.2д","ХЯ3.3а":"ХӨГ3.1д","БНО3.1а":"ЗУ3.2г","БНО3.2г":"ЗУ3.2е","БНО3.2д":"ХЭМ3.1д","МАТ3.1б":"ХӨГ3.1в","МАТ3.3в":"ХЭМ3.1е","МАТ3.4а":"ХЭМ3.2з","ЗУ3.2г":"ХЭМ3.2в","ЗУ3.2д":"МАТ3.4б","НСХ3.1в":"ХЭМ3.1в","НСХ3.2в":"ХЭМ3.2г","НСХ3.3а":"БНО3.2г","НСХ3.3в":"БНО3.2б","ХЭМ3.1г":"ЗУ3.2г","ХЭМ3.1д":"БНО3.2д","ХЭМ3.1е":"МАТ3.1б","ХЭМ3.1з":"ХӨГ3.1г","ХЭМ3.1и":"ХЯ3.1б","ХЭМ3.1н":"НСХ3.2в","ХЭМ3.2а":"ЗУ3.2д","ХЭМ3.2в":"ЗУ3.2г","ХЭМ3.2е":"ХЯ3.2б","ХЭМ3.2ж":"МАТ3.3в","ХЯ3.2а":"БНО3.2д","ХЯ3.2в":"БНО3.1в","ХЯ3.2д":"ХӨГ3.1д","ХЯ3.3б":"БНО3.2в","ХЯ3.3в":"ЗУ3.2а","БНО3.1в":"МАТ3.1б","БНО3.1г":"МАТ3.3в","БНО3.2в":"ХЯ3.2б","МАТ3.1а":"ЗУ3.2г","МАТ3.2а":"ХЭМ3.1к","МАТ3.2б":"ХЭМ3.2а","МАТ3.3а":"НСХ3.3б","МАТ3.3б":"ХЭМ3.2з","МАТ3.4б":"ЗУ3.2д","ЗУ3.1а":"НСХ3.1а","ЗУ3.2а":"НСХ3.2б","ЗУ3.2б":"МАТ3.1б","ЗУ3.2е":"БНО3.2г"},"notes":{"МАТ3.1б":"02.25","НСХ3.2в":"Өдөр бүр","НСХ3.3а":"02.26","НСХ3.3в":"Өдөр бүр","ХЭМ3.1г":"02.03, 02.19, 02.22","ХЭМ3.1д":"02.10","ХЭМ3.1е":"02.16, 02.17","ХЭМ3.1з":"Өдөр бүр","ХЭМ3.1и":"02.04","ХЭМ3.1н":"Өдөр бүр","ХЭМ e":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Энэ долоо хоногийн сүүлээр ямар баяр болох вэ?\" гэж асууж, Цагаан сарын зургийг үзүүлнэ.","learner":"- Багш, найзуудтайгаа мэндчилж тойрогт сууна.\n- Зургийг харж \"Цагаан сар\" гэж нэрлэнэ.\n- Гэртээ Цагаан сарт хэрхэн бэлтгэж байгаагаа (\"Ээж бууз чимхэж байна\") ярина."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Ярилцлага: \"Танайх Цагаан сараар юу хийдэг вэ? Хэнийд золгоход очдог вэ?\" гэж асууж, хүүхэд бүрээр гэр бүлийн заншлыг яриулна.\n- Зурагт үзүүлэн: Битүүн, шинийн нэгэн, золголт, шагай наадах зургийг дарааллаар нь үзүүлж ярилцана.\n- Ардын тоглоом: Шагайн 4 тал (морь, тэмээ, хонь, ямаа)-ыг танилцуулж, \"Морь уралдуулах\" тоглоомыг заана.\nБагшийн чиглүүлэх асуулт:\n1. Битүүний орой юу хийдэг вэ?\n2. Цагаан сараар ямар тоглоом тоглодог вэ?\n3. Шагайн аль тал нь хамгийн олон буусан бэ?","learner":"Ярилцлага:\n- \"Манайх Цагаан сараар ... -ийнд золгохоор очдог\" гэж гэр бүлийнхээ заншлыг дэлгэрэнгүй ярина.\n- Найзынхаа ярианаас адил заншлыг олж хэлнэ.\nЗурагт үзүүлэн:\n- Битүүн, шинийн нэгний зургийг харж юу болж байгааг нэрлэнэ.\n- Зургуудыг үйл явдлын дарааллаар өрнө.\nАрдын тоглоом:\n- Шагайг хаяж, буусан талыг \"морь, тэмээ, хонь, ямаа\" гэж нэрлэнэ.\n- Морио харваж, уралдуулж наадна.\n- Тал бүрийг тоолж, аль нь олон буусныг хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Дүрт тоглоомын буланд \"Цагаан сарын ширээ\" орчин (таваг, бууз, ул боовны загвар, хадаг) бүрдүүлж, хүүхдүүдийн тоглохыг ажиглана.","learner":"- Эмээ, өвөө, ач нарын дүрийг хуваарилна.\n- Ширээ засаж, хадаг барин золгож тоглоно.\n- \"Амар байна уу? Сайхан шинэлж байна уу?\" гэж мэндэлнэ."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – эхний уншлага (1): «Өвөөгийн шагай» (Чанга уншлагын төлөвлөгөөний хуудсыг үзнэ үү.)\n- Номын нэр, хавтас, зохиолч, зураачийг танилцуулж, хэмнэлийг алдагдуулахгүй уншина.\n- Түр зогсож асуух: «Өвөө нь уутнаас юу гаргах бол?»\n- Шинэ үг: «Түрүүлэх – хамгийн түрүүнд хүрэх»\n- Уншсаны дараа: «Шагай хэдэн талтай вэ? Нэрлэж тоолоорой.»","learner":"- Номын хавтсыг харж \"Энэ ном ... тухай байх\" гэж таамаглана.\n- Багшийн уншихыг анхааралтай, тайван сонсоно.\n- Түр зогсох үед уутанд юу байхыг таамаглана.\n- «Түрүүлэх» үгийг давтан хэлж, утгыг нь хэлнэ.\n- Шагайн 4 талыг нэрлэж, хуруугаараа тоолно."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Ардын тоглоомын төв: Шагай, «Морь уралдуулах» зам бэлтгэнэ.\nУрлагийн төв: Цаасан хадгийг хээ угалзаар чимэглэх.\nДүрт тоглоомын төв: Дээл, малгай өмсгөсөн хүүхэлдэйгээр золгох.\nМатематикийн төв: Шагайг тал тус бүрээр нь 4 бүлэгт ангилж тоолох.","learner":"Ардын тоглоомын төв:\n- Шагайгаа харваж, морио замаар урагшлуулна.\nУрлагийн төв:\n- Цаасан хадгаа хөх өнгөөр будаж, хээгээр чимэглэнэ.\nДүрт тоглоомын төв:\n- Хүүхэлдэйг хадаг барьж золгуулна.\nМатематикийн төв:\n- Шагайг морь, тэмээ, хонь, ямаа гэж 4 бүлэгт ангилж, бүлэг бүрийг тоолно."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 1 (1). Ажиглалт: Өвлийн тэнгэр, үүл ажиглах\nЗорилго: Өвлийн тэнгэр, үүлний өнгө, хэлбэрийг ажиглаж, цаг агаартай холбох.\nЯвц:\n- Хүүхдүүдийг талбайд гаргаж, тэнгэр рүү (нар руу шууд биш) харуулна.\n- Багшийн мэдээлэл: Цас орохын өмнө тэнгэр саарал, бүрхэг болдог. Цэлмэг өдөр тэнгэр цэнхэр, хүйтэн жавартай байдаг. Үүл янз бүрийн хэлбэртэй хөвж явдаг.\n- Асуулт: «Өнөөдөр тэнгэр ямар өнгөтэй вэ?», «Үүл юутай адилхан харагдаж байна вэ?», «Өнөөдөр цас орох болов уу?»","learner":"- Тэнгэр рүү харж өнгийг нь (\"цэнхэр\", \"саарал\") нэрлэнэ.\n- Үүлний хэлбэрийг юмтай адилтгаж (\"хонь шиг\", \"морь шиг\") хэлнэ.\n- Цас орох эсэхийг таамаглаж шалтгаанаа хэлнэ.\n- Ажигласнаа цаг агаарын хуанлид тэмдэглэх тэмдгийг сонгоно."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Цагаан ястай мэлхий»\nЗорилго: Монгол ардын тоглоомоор хамтран наадах.\nЯвц:\n1. Хүүхдүүд тойрог үүсгэн гар гараасаа барина.\n2. Голд нь нэг хүүхэд \"мэлхий\" болж суугаад, бусад нь дуулж эргэнэ.\n3. Дуу дуусахад \"мэлхий\" нэг хүүхдийг сонгож солигдоно.\nДүрэм: Ээлжээ хүлээнэ; хамтдаа дуулна.\nДүгнэлт: Цагаан сараар гэртээ ямар тоглоом тоглохоо ярилцана.","learner":"- Тойрог үүсгэн дуулж эргэнэ.\n- Голд \"мэлхий\" болж суугаад дараагийн хүүхдээ сонгоно.\n- Цагаан сараар гэртээ тоглох тоглоомоо хэлнэ."}]},"2027-02-02":{"method":"Ярилцлагад суурилсан арга","link":"БНО3.2д. Гэр бүлийн орчинд уламжлалт баярыг хэрхэн тэмдэглэдэг талаар өөрийн үгээр тайлбарлаж, ардын тоглоом, наадгайгаар наадна.","competence":"Харилцах (үгийг оновчтой сонгож дэлгэрэнгүй өгүүлбэрээр ярих), соёлын мэдлэг","materials":"Цагаан сарын дараалсан зурагт карт (гэр цэвэрлэх, бууз чимхэх, битүүлэх, золгох), хадаг, «Ярианы чулуу», тоглоомон микрофон","criteria":"Үгийг оновчтой сонгож, 4-5 үгтэй дэлгэрэнгүй өгүүлбэрээр ярьдаг. Цагаан сарын заншлыг өөрийн үгээр тайлбарладаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Ярианы чулуу\" дамжуулан \"Чи Цагаан сарын юунд хамгийн их дуртай вэ?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Чулуу ирэхэд \"Би Цагаан сарын ... -д хамгийн их дуртай, учир нь ...\" гэж бүтэн өгүүлбэрээр хэлнэ.\n- Найзынхаа ярихыг сонсоно."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Дараалсан зураг: Гэр цэвэрлэх, бууз чимхэх, битүүлэх, золгох 4 зургийг дараалуулж, зураг бүрээр 2-3 өгүүлбэр яриулна.\n- Өгүүлбэр уртасгах: \"Бид бууз чимхлээ\" гэсэн өгүүлбэрт \"хэн? хэзээ? хаана? яаж?\" гэсэн асуултаар үг нэмүүлнэ.\n- Золгох яриа: Хадаг барьж золгохдоо хэлэх үгийг (\"Амар байна уу?\", \"Сайхан шинэлж байна уу?\") давтуулна.\nБагшийн чиглүүлэх асуулт:\n1. Энэ зурагт юу болж байна? Дэлгэрэнгүй ярина уу.\n2. Хэн, хэзээ, хаана хийж байна вэ?\n3. Золгохдоо юу гэж хэлдэг вэ?","learner":"Дараалсан зураг:\n- 4 зургийг зөв дарааллаар өрнө.\n- Зураг бүрээр \"Эмээ, ээж хоёр гал тогоонд олон бууз чимхэж байна\" гэх мэт дэлгэрэнгүй өгүүлбэр зохионо.\nӨгүүлбэр уртасгах:\n- Багшийн асуулт бүрт нэг үг нэмж, өгүүлбэрээ уртасгана.\nЗолгох яриа:\n- Хадаг барьж найздаа золгоод \"Амар байна уу? Сайхан шинэлж байна уу?\" гэж хэлнэ.\n- Найз нь \"Амар сайн байна\" гэж хариулна."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Тоглох үед хүүхдүүдийн харилцан яриаг ажиглаж, бүтэн өгүүлбэрээр ярьж буйг урамшуулна.","learner":"- Найзуудтайгаа тоглоомоо тохиролцохдоо бүтэн өгүүлбэрээр ярина.\n- Найзынхаа саналыг сонсож хариулна."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Цагаан сарын ерөөл, шүлэг уншиж, хүүхдүүдээр давтуулна.\n- \"Ерөөлд ямар сайхан үг байна вэ?\" гэж асууна.","learner":"- Ерөөлийг сонсож мөр мөрөөр давтана.\n- Ерөөлийн сайхан үгсийг (эрүүл энх, аз жаргал, сайн сайхан) нэрлэнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Хэл ярианы төв: \"Сурвалжлагч\" – микрофоноор \"Танайх Цагаан сараар юу хийдэг вэ?\" гэж ярилцлага авах.\nУрлагийн төв: \"Манай гэрийн Цагаан сар\" зураг зурах.\nДүрт тоглоомын төв: Гэр бүлийн гишүүд болж битүүлэх.","learner":"Хэл ярианы төв:\n- Сурвалжлагч болж асуулт асууна, ярилцлага өгөгч болж дэлгэрэнгүй хариулна.\nУрлагийн төв:\n- Гэр бүлийнхээ Цагаан сарыг зурж, 3-4 өгүүлбэрээр тайлбарлана.\nДүрт тоглоомын төв:\n- Битүүний ширээ засаж, гэр бүлийн гишүүдийн дүрд тоглоно."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 1 (2). Хөдөлмөрийн үйл ажиллагаа: Цэцэрлэгийн үүдний замыг цэвэрлэх\nЗорилго: Цагаан сарыг цэвэрхэн угтах заншилтай холбож, хамтран ажиллах дадлыг төлөвшүүлэх.\nХэрэглэгдэхүүн: Жижиг хүрз, шүүр, хувин, бээлий\nЯвц:\n- Хүүхдүүдийг 3-4 хүний багт хувааж, үүдний зам, шатны хэсгийг хуваарилна.\n- Хүрзээр цасыг хажуу тийш түрж, шүүрээр цэвэрлүүлнэ.\n- Асуулт: «Цагаан сарын өмнө яагаад цэвэрлэдэг вэ?», «Зам цэвэр болоход хэнд тустай вэ?»","learner":"- Багтаа нэгдэж өөрт оногдсон хэсгийг сонсоно.\n- Хүрзээр цасыг замын хажуу тийш түрнэ.\n- Шүүрээр үлдсэн цасыг цэвэрлэнэ.\n- \"Шинэ жилийг цэвэрхэн угтана\" гэж ажлын утгыг хэлнэ.\n- Ажлаа дуусгаад багажаа байранд нь тавина."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Өгүүлбэрийг уртасгая»\nЗорилго: Өгүүлбэрт үг нэмж дэлгэрэнгүй ярих.\nЯвц:\n1. Багш \"Бууз\" гэж эхэлнэ.\n2. Хүүхэд бүр нэг үг нэмнэ: \"Халуун бууз\" – \"Эмээгийн халуун бууз\" – \"Эмээгийн хийсэн халуун бууз...\"\n3. Өгүүлбэр хэт урт болоход бүгд хамтдаа давтана.\nДүрэм: Өмнөх үгсийг санаж давтана.\nДүгнэлт: Хамгийн урт өгүүлбэрийг хамтдаа хэлнэ.","learner":"- Өмнөх найзынхаа өгүүлбэрийг сонсож давтана.\n- Өөрийн нэг үгийг нэмнэ.\n- Хамгийн урт өгүүлбэрийг хамтдаа хэлнэ."}]},"2027-02-03":{"method":"Бүтээлч үйл ажиллагаанд суурилсан арга","link":"ХЭМ3.2в. Хоол, хүнсний бүтээгдэхүүнээс эрүүл мэндэд тустай хүнсийг ялгаж, хэрэглэнэ.","competence":"Бүтээлчээр сэтгэх (гурилан зуурмагаар зохиомжлон барих), эрүүл хооллолт","materials":"Гурилан зуурмаг (цагаан, шар), хуванцар хутга, таваг, Цагаан сарын ширээний зураг (ул боов, бууз, ааруул, жимс), «Өвөөгийн шагай» зурагт карт","criteria":"Гурилан зуурмагаар бууз, боов, жимс зэрэг эд юмсыг гурав ба түүнээс дээш хэсгээс зохиомжлон барьдаг. Цагаан сарын ширээн дээрх хүнсээс эрүүл мэндэд тустайг ялгаж нэрлэдэг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, Цагаан сарын ширээний зургийг үзүүлэн \"Ширээн дээр юу юу байна вэ?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Ширээн дээрх хүнсийг (ул боов, бууз, ааруул, жимс, сүүтэй цай) нэрлэнэ.\n- \"Би ... -д хамгийн их дуртай\" гэж хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Тустай хүнс: Ширээн дээрх хүнсийг \"өдөр бүр идэж болох\", \"бага идэх\" гэж ярилцана (ааруул, сүү – тустай; чихэр, боов – бага).\n- Зуурмагаар барих: Бууз (дугуй + хуниас), ул боов (давхарласан тэгш өнцөгт), жимс (бөмбөлөг + иш + навч) хийх аргыг үзүүлнэ.\n- Ширээ засах: Хүүхэд бүрийн хийсэн зүйлсийг нийлүүлж бүлгийн \"Цагаан сарын ширээ\" засна.\nБагшийн чиглүүлэх асуулт:\n1. Буузаа хэдэн хэсгээс бүтээсэн бэ?\n2. Ширээн дээрх аль хүнс биед тустай вэ?\n3. Чихэр их идвэл юу болох вэ?","learner":"Тустай хүнс:\n- Хүнсний зургийг \"тустай\", \"бага идэх\" гэж ангилж, шалтгааныг хэлнэ.\nЗуурмагаар барих:\n- Зуурмагийг өнхрүүлж бөмбөлөг болгоод хавтгайлна.\n- Буузны хуниасыг хуруугаараа чимхэж хийнэ.\n- Ул боовыг хэд хэдэн давхар өрж, жимсэнд иш, навч нэмнэ.\nШирээ засах:\n- Хийсэн бүтээлээ таваг дээр тавьж, бүлгийн ширээнд байрлуулна.\n- \"Би буузыг 3 хэсгээс хийсэн\" гэж тайлбарлана."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Урлагийн буланд шавар, зуурмаг байрлуулж, хүүхдүүдийн бие даасан бүтээлийг ажиглана.","learner":"- Өөрийн санаагаар зуурмагаар юм барина.\n- Бүтээлээ найздаа танилцуулна."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – хоёр дахь уншлага (2): «Өвөөгийн шагай» (Төлөвлөгөөний хуудсыг 02.01-ний төлөвлөлтийн дараа үзнэ үү.)\n- Номын тухай эргэн сануулах асуулт асууна: «Өвөө нь ямар тоглоом зааж өгсөн бэ?»\n- Түр зогсож асуух: «Тэмүүлэн ялагдахад юу хийсэн бэ?», «Өвөө нь яагаад шагайгаа бэлэглэсэн бэ?»\n- Шинэ үг: «Хаях», «Харвах» – шагайгаар үзүүлэх\n- Уншсаны дараа: Шагайн 4 талыг ангилж тоолох","learner":"- Номын үйл явдлыг эргэн санаж ярина.\n- Тэмүүлэн дахин оролдсоныг, өвөө нь шагайгаа яагаад бэлэглэснийг тайлбарлана.\n- «Хаях», «Харвах» үгийг шагайгаар үзүүлнэ.\n- Шагайг 4 талаар нь ангилж тоолно."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: Гурилан зуурмагаар ул боов, бууз, ааруул хийх.\nМатематикийн төв: Зуурмагаар хийсэн буузыг тавагт 5 хүртэл оноож тоолох.\nДүрт тоглоомын төв: \"Цагаан сарын ширээ\" – зочин угтах.","learner":"Урлагийн төв:\n- Зуурмагаар Цагаан сарын хүнсийг гурав ба түүнээс дээш хэсгээс барина.\nМатематикийн төв:\n- Таваг бүрт 1-5 бууз оноож тавьж тоолно.\nДүрт тоглоомын төв:\n- Зочин угтаж, \"Цайгаа уугаарай\" гэж цай аягалах дүр үзүүлнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 1 (3). Хөдөлгөөнт тоглоом: «Морь уралдаан»\nЗорилго: Ардын наадмын уламжлалтай холбож гүйх, хурдаа өөрчлөх, дохиогоор хөдлөх.\nЯвц:\n- Хүүхдүүд \"морь\" болж гарааны шугам дээр эгнэнэ (саваа \"морь\" унаж болно).\n- Багш \"Гингоо!\" гэхэд бариа руу гүйж, бариаг тойроод буцна.\n- Ирсэн дарааллаар нь \"түрүү\", \"айргийн тав\" гэж нэрлэж урамшуулна.\n- Асуулт: «Наадамд морь уралдаанд хэн оролцдог вэ?», «Хэн түрүүлсэн бэ?»","learner":"- \"Морь\" болж гарааны шугам дээр эгнэнэ.\n- \"Гингоо!\" гэхэд бариа руу гүйж, бариаг тойроод буцна.\n- Бусадтай мөргөлдөхгүй, өөрийн замаар гүйнэ.\n- Түрүүлсэн найзаа \"Айргийн тав\" гэж алга ташиж урамшуулна."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Ширээн дээр юу дутуу вэ?»\nЗорилго: Анхаарал, ой тогтоолт хөгжүүлэх.\nЯвц:\n1. Зуурмагаар хийсэн 5 хүнсийг тавиад хүүхдүүдэд харуулна.\n2. Хүүхдүүд нүдээ анихад нэгийг нь нууна.\n3. \"Юу дутуу байна?\" гэж таалгана.\nДүрэм: Харж болохгүй; гараа өргөж хариулна.\nДүгнэлт: Өнөөдөр хийсэн бүтээлээ дүгнэнэ.","learner":"- 5 хүнсийг анхааралтай харж тогтооно.\n- Нүдээ аниад, нээгээд юу дутуу байгааг таана.\n- Ээлжээр өөрөө нууж, найзуудаараа таалгана."}]},"2027-02-04":{"method":"Тоглоомонд суурилсан арга","link":"ХӨГ3.1б. Богино үгтэй дууг бусадтай хамтран дуулна.","competence":"Хэл яриа (урт, богино эгшигтэй үгийг сонсож ялгах), хөгжмийн чадвар (богино дууг хамтран дуулах)","materials":"Урт ба богино эгшигтэй үгийн зурагт карт (ном – ноос, ус – уут, хот – хоол, цас – цаас), урт ба богино тууз, хонх, «Шагай» дуу","criteria":"Урт, богино эгшигтэй үгийг сонсоод ялгаж, зөв хэлдэг. Богино үгтэй дууг бусадтай хамтран дуулдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Сайн уу\" гэдэг үгийг урт (\"Са-а-айн уу\"), богино хэлж \"Аль нь урт сонсогдож байна?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Багшийн урт, богино хэлсэн мэндчилгээг ялгаж хэлнэ.\n- Өөрөө урт, богино хэлж үзнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Сонсож ялгах: \"Цас – цаас\", \"Ус – уут\", \"Хот – хоол\" зэрэг хос үгийг зурагтай нь хэлж, урт эгшгийг сунгаж дуудна.\n- Туузаар үзүүлэх: Урт эгшигтэй үг сонсоход урт тууз, богино эгшигтэй үг сонсоход богино тууз өргүүлнэ.\n- Алга ташиж хэлэх: Үгийг хэлэхдээ урт эгшиг дээр гараа удаан дэлгэн, богино дээр нэг алга ташуулна.\nБагшийн чиглүүлэх асуулт:\n1. \"Цас\", \"цаас\" хоёр ижилхэн сонсогдож байна уу?\n2. Аль үгэнд дуу сунаж байна вэ?\n3. Өөр урт дуутай үг мэдэх үү?","learner":"Сонсож ялгах:\n- Хос үгийг сонсож, зургаас тохирохыг заана.\n- \"Цаас\" гэхэд эгшгийг сунган давтаж хэлнэ.\nТуузаар үзүүлэх:\n- Урт эгшигтэй үг сонсоход урт тууз, богинод богино тууз өргөнө.\nАлга ташиж хэлэх:\n- Урт эгшиг дээр гараа удаан дэлгэж, богино дээр алга ташина.\nАсуултад хариулах:\n- Урт эгшигтэй өөр үг (хоол, мөөг, ээж) олж хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Хэл ярианы буланд зурагт картууд байрлуулж, хүүхдүүд хосоороо үг ялгах тоглоом тоглохыг ажиглана.","learner":"- Найзтайгаа картаас үг сонгож хэлүүлнэ.\n- Урт эсвэл богино эсэхийг ялгаж хэлнэ."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Урт эгшигтэй үг олонтой шүлэг (\"Цагаан цаас\") уншиж, урт дуутай үгсийг олуулна.","learner":"- Шүлгийг сонсож давтана.\n- Шүлгээс урт эгшигтэй үгсийг олж, сунган хэлнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Хэл ярианы төв: Зурагт картыг \"урт\", \"богино\" гэсэн 2 сагсанд ангилах.\nХөгжмийн төв: \"Шагай\" дууг хонхоор дагуулан дуулах; урт авиаг хонхоор удаан, богиныг богино цохих.\nУрлагийн төв: Урт, богино тууз нааж хээ гаргах.","learner":"Хэл ярианы төв:\n- Картын үгийг хэлж, урт эсвэл богино сагсанд хийнэ.\nХөгжмийн төв:\n- Найзуудтайгаа \"Шагай\" дууг хамтран дуулна.\n- Урт авиаг хонхоор удаан, богиныг богино цохино.\nУрлагийн төв:\n- Урт, богино туузыг ээлжлүүлэн нааж хээ гаргана."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 1 (4). Ганцаарчилсан үйл ажиллагаа: Цасан дээрх зураас давж үсрэх\nЗорилго: Үсрэх хөдөлгөөн сул хүүхдүүдтэй ганцаарчлан ажиллах.\nЯвц:\n- Цасан дээр 5-10 зураас татаж, хүүхдийг хоёр хөлөөр давуулан үсрүүлнэ.\n- Гараа савлах, газардахдаа өвдгөө нугалахыг дэмжинэ.\n- Бусад хүүхдүүд цэвэрлэсэн зам дагуу чөлөөтэй тоглоно.","learner":"- Багшийн дэмжлэгтэйгээр зураас давж хоёр хөлөөр үсэрнэ.\n- Гараа савлаж, зөөлөн газардана.\n- Үсрэлт бүрээ тоолно."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Урт уу, богино уу?»\nЗорилго: Урт, богино эгшигтэй үгийг хөдөлгөөнөөр ялгах.\nЯвц:\n1. Багш үг хэлнэ.\n2. Урт эгшигтэй бол хүүхдүүд өндийж гараа дээш сунгана, богино бол суугаад авна.\n3. Хүүхдүүд ээлжлэн үг хэлж тоглоомыг удирдана.\nДүрэм: Анхааралтай сонсоно.\nДүгнэлт: Урт дуутай үгсээ давтана.","learner":"- Үгийг сонсоод урт бол өндийж гараа сунгана, богино бол сууна.\n- Ээлжээр үг хэлж тоглоомыг удирдана.\n- Урт дуутай үгсээ давтан хэлнэ."}]},"2027-02-05":{"method":"Тоглоомонд суурилсан арга","link":"ХӨГ3.1в. Дуу, аялгууны хэмнэлийг ялгаж, дагаж тоглоно.","competence":"Шүүн тунгаах (зүй тогтлыг ажиглаж үргэлжлүүлэх), хэмнэл мэдрэх","materials":"Хээ угалзын зүй тогтлын карт, өнгөт шоо, шагай, хонх, бөмбөр, хадаг хэлбэрийн цаас, өнгийн харандаа","criteria":"Дараалан байрлуулсан тоглоом, дүрс, хээний зүй тогтлыг ажиглаж үргэлжлүүлдэг. Дуу, аялгууны хэмнэлийг ялгаж, дагаж тоглодог.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Алга ташаад – өвдгөө цохино – алга ташаад – ...\" хэмнэлийн зүй тогтлыг дуурайлгана.","learner":"- Мэндчилж тойрогт сууна.\n- Багшийн хэмнэлийг ажиглаж дуурайна.\n- Хэмнэл дараа нь юу ирэхийг хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Хээний зүй тогтол: Хадаг, дээл дээрх хээ угалзын давталтыг үзүүлж, \"Ямар хээ давтагдаж байна?\" гэж асууна.\n- Үргэлжлүүлэх: \"Морь – тэмээ – морь – тэмээ – ?\" гэж шагайгаар, \"улаан – шар – шар – улаан – шар – шар – ?\" гэж шоогоор зүй тогтлыг үргэлжлүүлүүлнэ.\n- Хэмнэлийн зүй тогтол: Бөмбөрөөр \"удаан – хурдан – хурдан\" хэмнэлийг цохиж, хүүхдүүдээр дагуулна.\nБагшийн чиглүүлэх асуулт:\n1. Дараа нь юу ирэх вэ? Яаж мэдсэн бэ?\n2. Аль хэсэг нь давтагдаж байна вэ?\n3. Өөрөө зүй тогтол зохиож чадах уу?","learner":"Хээний зүй тогтол:\n- Хадаг, дээлийн хээг ажиглаж давтагдаж буй хэсгийг хуруугаараа заана.\nҮргэлжлүүлэх:\n- Шагайг \"морь – тэмээ\" гэж ээлжлүүлэн үргэлжлүүлж тавина.\n- Шоог \"улаан – шар – шар\" давталтаар үргэлжлүүлнэ.\n- \"Улаан, шар, шар дахин давтагдаж байна\" гэж тайлбарлана.\nХэмнэлийн зүй тогтол:\n- Бөмбөрийн хэмнэлийг сонсож, алга ташиж дагана.\n- Өөрөө хэмнэл зохиож найздаа дуурайлгана."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Математикийн буланд сувс, шоо байрлуулж, хүүхдүүд өөрсдөө зүй тогтол үүсгэхийг ажиглана.","learner":"- Сувсаар өөрийн зүй тогтлыг хэлхэнэ.\n- Найздаа зүй тогтлоо тайлбарлана."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – гурав дахь уншлага (3): «Өвөөгийн шагай» (Төлөвлөгөөний хуудсыг 02.01-ний төлөвлөлтийн дараа үзнэ үү.)\n- Номын үйл явдлыг хүүхдүүдээр түлхүү яриулна.\n- Дүгнэн ярилцах: «Ардын тоглоом яагаад сайхан бэ?»\n- Шинэ үгсээр өгүүлбэр зохиох: шагай, харвах, түрүүлэх, удам, бэлэглэх\n- Бүтээл: Шагайн 4 талыг зурж будах, «шагайн уут» хээгээр чимэглэх","learner":"- Номын нэр, зохиолч, зураачийг санаж хэлнэ.\n- Номын зургийг харж түүхийг өөрийн үгээр ярина.\n- Ардын тоглоомын сайхныг өөрийн үгээр хэлнэ.\n- Шинэ үгсээр өгүүлбэр зохионо.\n- Шагайн уутаа зүй тогтолтой хээгээр чимэглэнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: Цаасан хадаг дээр хээний зүй тогтол зурж үргэлжлүүлэх.\nХө
