эр. «Үгүй ээ, ээж ээ, үгүй, би юу ч хагалаагүй. Та л тэгж сонссон байх!» гээд Женя агшин зуур улаан дэлбээ таслан хийсгээд,\nХуудас 13. Нис нис дэлбээхэн, ... Хүслийг минь биелүүлээрэй, Ээжийн хайртай ваар бүтэн болтугай! хэмээн шившлээ.\nХуудас 14. Хэлж амжаагүй байтал л ваарны хэлтэрхийнүүд бие биетэйгээ нийлж бүтэн боллоо. Ээж нь галын өрөөнөөс гүйж иртэл хайртай ваар нь юу ч болоогүй мэт байрандаа л байж байв. Ямартаа ч ээж нь Женяг мэдээтэй байгаарай гэж хуруугаа занган зандраад гадаа гарч тогло гэв.\nХуудас 15. Гадагш гартал хөвгүүд элсэнд бургас хатгаж, хуучин банзан дээр суугаад тоглож байв. «Хөвгүүд ээ! Намайг тоглоомондоо оруулаач» гэтэл хөвгүүд «Чи яах гээв! Хойд туйл гэдгийг харахгүй байна уу? Хойд туйлд бид охидыг авахгүй ээ» гэцгээв.\nХуудас 16. «Ямар гээчийн хойд туйл вэ? Нэг муу банз л байна» гэж Женя хэлэв. Хөвгүүд «Банз бишээ, энэ чинь мөс байхгүй юу. Цаашаа яв, битгий саад болоод бай. Бид нар хүчтэй шахалтанд орчихоод байна!» гэлээ. «Тэгэхээр, авахгүй юм биз дээ?» гэхэд «Авахгүй ээ. Цаашаа яв!» гэв.\nХуудас 17. Женя «Тэгж л бай! Би та наргүйгээр яг одоо хойд туйл дээр очно доо. Харин та нарынх шиг ийм биш, яг жинхэнэ дээр нь очно. Таанусых чинь муурын сүүл, за юу.» гээд тэднээс бага зэрэг холдож хаалганы тэнд зогсоод ид шидийн долоон дэлбээт цэцгэнээсээ хөх дэлбээг таслан хийсгээд, шившлэгээ хийв.\nХуудас 18. Хэлж дуусаагүй байтал хаанаас ч юм бүү мэд хүй салхи гарч, нарыг халхлан шөнө болж, газар дэлхий хөл доор эргүүлэг мэт эргэлдэж гарав. Зуны даашинзтай хөл нүцгэн Женя хойд туйл дээр гав ганцаараа зогсож байв. Харин тэнд жавар тачигнаж 100 хэмийн хүйтэн байлаа. «Ээж ээ, хөлдөх нь ээ» гэж Женя хашгираад уйлж эхлэв, харин нулимс нь тэр дороо мөс болон хувирч цоргоноос гоожсон мэт хамарнаас нь унжин тогтжээ.\nХуудас 19. Ингэж байтал мөсөн уулнуудын цаанаас аймшигтай долоон цагаан баавгай гарч ирээд шууд охины чиглэн ирэв. Ухаан алдатлаа айсан Женя бээрсэн гараараа долоон дэлбээт цэцгээ авч ногоон дэлбээг таслан хийсгээд, Яг одоо хашаандаа эргэн очтугай хэмээн шившлэг хийв.\nХуудас 20. Яг тэр мөчид хашаандаа эргээд ирсэн байв. Гэтэл хөвгүүд түүнийг харж шоолон инээлдэж: – Чиний нөгөө хойд туйл чинь тэгээд хаана байна даа?\nХуудас 21. – Би тэнд байж байгаад ирлээ. – Бид нар хараагүй юм чинь батал л даа. – Хар л даа. Миний хамарнаас одоо хүртэл мөс унжиж байна. – Энэ чинь мөс биш гэхэд Женя гомдож хөвгүүдтэй тоглохоо болихоор шийдээд өөр хашаа уруу охидтой тоглохоор явлаа.\nХуудас 22. Тэнд ирээд хартал охид янз бүрийн тоглоомоор тоглож байв. Нэг нь хүүхэлдэйгээр, нөгөө нь бөмбөгөөр тоглоно. Женя атаархсандаа улбар шар дэлбээгээ таслан «Дэлхийн бүх тоглоом минийх болтугай» гэж хүсэв. Гэтэл асар олон тоглоом ирж хотыг дүүргэсэн тул Женя айж,\nХуудас 23. ягаан дэлбээгээ таслан «Тоглоомууд бушуухан дэлгүүртээ эргэн очтугай» хэмээн шившлээ. Тэр дариуд бүх тоглоом алга болов. Женя долоон дэлбээт цэцгээ хартал ердөө ганцхан дэлбээ үлдсэн байлаа. «Зургаан дэлбээгээ ямар ч хэрэггүй үржээ. Одоо болгоомжтойхон шиг байя даа» гээд алхаж явлаа.\nХуудас 24. Гэнэт нэг нүдэнд дулаахан хөвгүүн хаалганы дэргэд сандал дээр сууж харагдлаа. Женя түүнтэй танилцахаар дөхөж очлоо. – Чиний нэрийг хэн гэдэг вэ? – Витя. Харин чиний? – Женя. Хөөцөлдөж тоглох уу? – Чадахгүй нь ээ, би доголон шүү дээ.\nХуудас 25. Женя түүний хөл уруу хараад: «Би чамтай гүйж тогломоор байна» гэхэд Витя: «Би ч бас чамтай гүймээр байна, даан ч боломжгүй» гэв. Женя халааснаасаа хамгийн сүүлийн цэнхэр дэлбээг таслан хийсгээд: Витя эрүүл болох болтугай! хэмээн шившлэг хийв.\nХуудас 26. Яг тэр агшинд жаалхүү сандлаасаа үсрэн босож Женятай уралдан тоглож, охин хичнээн хичээгээд ч гүйцэхээргүй тийм сайн гүйж гарав."},{"days":"11.30 (1-р уншлага), 12.02 (2-р уншлага), 12.04 (3-р уншлага)","book":"Уурласан Тэргэл","author":"Багшийн бэлтгэсэн өгүүлэг. Зураг: багшийн бэлтгэсэн зурагт карт (6 хуудас)","goals":"- Үгсийн сан болон ерөнхий мэдлэгийг тэлэх\n- Харилцан ярилцах, хүүрнэн өгүүлэх чадварыг хөгжүүлэх\n- Сонсож ойлгох чадварыг хөгжүүлэх\n- Сэтгэн бодох үйлийг чиглүүлэн дэмжих\n- Уурласан үедээ тайвшрах аргуудыг нэрлэж хэрэглэх (Нийгэм-сэтгэл хөдлөл)\n- Харилцан ярианд санал бодлоо илэрхийлэх (Хэл яриа)\n- Тав хүртэл аажуухан тоолох (Математик)","summary":"Тэргэлийн барьсан цамхгийг Ганбаа санамсаргүй мөргөж нураана. Тэргэл уурлаж хашгирах гэснээ багшийн заасныг санаж, гүнзгий амьсгаа аваад тав хүртэл тоолж, «Тайвшрах булан»-д очно. Тайвширсны дараа Ганбаад сэтгэлээ хэлэхэд Ганбаа уучлалт гуйж, хоёулаа хамтдаа илүү өндөр цамхаг барина.","words":[["Уурлах – их дургүй болж, бухимдах","Нурах – унаж эвдрэх (х. 1)","Гараа зангидах – нударгаа чанга атгах (х. 2, үйлдлээр үзүүлэх)"],["Тайвшрах – сэтгэлээ намдаах","Санамсаргүй – санаатай биш (х. 1)","Гүнзгий амьсгаа – удаан, гүн амьсгалах (х. 3, хамт хийх)"],["","Уучлалт гуйх – буруугаа хүлээж, уучлаарай гэх (х. 5)","Сэгсрэх – хөдөлгөж доргиох (х. 3, лонхоор үзүүлэх)"]],"r1":{"Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Цамхгаа нураахад Тэргэл ямар болох бол?» (хуудас 2)\n«Тэргэл яаж тайвшрах бол?» (хуудас 3)\n«Ганбаа юу гэж хариулах бол?» (хуудас 5)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Нурах» (хуудас 1)\n«Санамсаргүй – санаатай биш» (хуудас 1)\n«Тайвшрах» (хуудас 3)","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Тэргэл яагаад уурласан бэ?»\n«Тэргэл ямар аргаар тайвширсан бэ?»\nХамтдаа гүнзгий амьсгаа аваад тав хүртэл аажуухан тоолох."},"r2":{"Номын тухай эргэн санах: Эхлэл, өрнөл, төгсгөл хэсгүүдтэй холбоотой энгийн асуултууд асуух":"«Номд Тэргэлийн цамхаг нурсан тухай гардгийг санаж байгаа биз. Хэн нураасан бэ?»\n«Тэргэл уурлахдаа юу хийх гэсэн бэ?»\n«Ном хэрхэн төгссөн бэ?»","Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Уурлахад бие ямар болдог вэ?» (хуудас 2)\n«Тайвшрах булан юунд хэрэгтэй вэ?» (хуудас 3)\n«Ганбаа санаатай нураасан уу?» (хуудас 5)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Гараа зангидах» (хуудас 2) үзүүлэх\n«Гүнзгий амьсгаа» (хуудас 3) хамт хийх\n«Уучлалт гуйх» (хуудас 5)","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Хэрвээ чи Тэргэл байсан бол яах байсан бэ?»\nДүрд тоглох: Тэргэл, Ганбаа болж ярилцах.\nТайвшруулах лонх сэгсэрч ажиглах."},"r3":{"Уншихын өмнө":"Энэ номыг бид хамтдаа 2 удаа уншчихсан учраас номын нэр юу билээ? гэх зэргээр хүүхдийг татан оролцуулна.","Уншиж байхдаа":"Зургийг заан хүүхдүүдээр яриулна: «Энд Тэргэл юу хийж байна?», «Дараа нь юу болох вэ?»","Уншиж дуусаад":"- Дүгнэн ярилцах: «Тэргэлийн хийсэн зүйлээс юу нь таалагдсан бэ?»\n- Шинэ үгсээр өгүүлбэр зохиох: тайвшрах, санамсаргүй, уучлалт гуйх\n- Бүтээл: «Миний тайвшрах арга» зураг"},"text":"Хуудас 1. Тэргэл блокоор өндөр цамхаг барьж байв. Тэгтэл Ганбаа гүйж ирээд санамсаргүй мөргөж, цамхаг нурчихжээ.\nХуудас 2. Тэргэлийн нүүр улайж, гараа зангидав. Тэр хашгирах гэж байснаа багшийн заасныг санав: \"Уурласан үедээ эхлээд тайвшир.\"\nХуудас 3. Тэргэл гүнзгий амьсгаа аваад \"Нэг, хоёр, гурав, дөрөв, тав\" гэж аажуухан тоолов. Дараа нь \"Тайвшрах булан\"-д очиж, тайвшруулах лонхоо сэгсрэн гялтганаа доош буухыг ажиглажээ.\nХуудас 4. Уур нь жаахан намдахад Тэргэл Ганбаа дээр очоод \"Чи миний цамхгийг нураахад би их уурласан\" гэж хэлэв.\nХуудас 5. Ганбаа \"Уучлаарай, би санаатай хийгээгүй. Хамтдаа дахиад барих уу?\" гэжээ.\nХуудас 6. Хоёр хүү хамтдаа бүр илүү өндөр цамхаг барьжээ. Тэргэл \"Уурласан үедээ тайвширч, ярилцвал бүх юм сайхан болдог юм байна\" гэж бодлоо."}]}}},{"name":"БЭЛТГЭЛ","level":"IV түвшин (бэлтгэл бүлэг)","teacher":"Б. ЗОЛЦЭЦЭГ","school":"ЗҮҮНБАЯН-УЛААН СУМЫН ХҮҮХДИЙН ЦЭЦЭРЛЭГИЙН","year":"2026-2027","approver":"Ц. ОДОНЧИМЭГ","date":"2026.08.31","place":"БАЯН-УЛААН","directions":[{"name":"НИЙГЭМ-СЭТГЭЛ ХӨДЛӨЛ","rows":[{"area":"Өөрийгөө таних","sub":"Өөрийгөө ойлгож мэдрэх","code":"НСХ4.1а","text":"Сэтгэлийн мэдрэмжээ таатай, таагүй байгааг илэрхийлдэг болно.","months":[{"t":"u","code":"ХЯ4.2а","text":"Тодорхой сэдвээр санаа бодлоо илэрхийлж, идэвхтэй ярилцана."},{"t":"u","code":"ХӨГ4.1б","text":"Дуу, аялгууг гар       `<hr><button data-v="month" class="month-nav ${ui.view === 'month' ? 'active' : ''}"><span class="ic">✏️</span><span class="nm">Сарын төлөвлөлт, үйл ажиллагаа</span></button>`;

    else if (ui.view === 'month') renderMonth();

  }

  function planTable(g, d, editable) {
    // Ай, Дэд айн rowspan
    const rows = d.rows;
    const span = (key, i) => {
      if (i > 0 && rows[i - 1][key] === rows[i][key] && (key === 'area' || rows[i - 1].area === rows[i].area)) return 0;
      let n = 1; while (i + n < rows.length && rows[i + n][key] === rows[i][key] && (key === 'area' || rows[i + n].area === rows[i].area)) n++;
      return n;
    };
    const body = rows.map((r, ri) => {
      const sa = span('area', ri), ss = span('sub', ri);
      const links = r.months.map((m, i) => m.t === 'u' && m.code ? `<li>${MONTHS[i]} сар – ${esc(m.code)}. ${esc(m.text)}</li>` : '').join('');
      return `<tr class="row">
        ${sa ? `<td class="ar" rowspan="${sa}">${esc(r.area)}</td>` : ''}
        ${ss ? `<td rowspan="${ss}">${esc(r.sub)}</td>` : ''}
        <td class="out" ${editable ? `data-row="${ri}" title="Засах"` : ''}><span class="code">${esc(r.code)}.</span> ${esc(r.text)}
          ${links ? `<div class="lnk-h">Уялдах суралцахуйн үр дүн:</div><ul>${links}</ul>` : ''}</td>
        ${r.months.map((m, i) => `<td class="m ${m.t}" ${editable ? `data-cell="${ri}:${i}"` : ''}>${m.t === 'u' ? esc(m.code) : ''}</td>`).join('')}
        <td class="num">${r.months.filter(m => m.t === 'u').length}</td>
        <td class="num">${r.months.filter(m => m.t === 'd').length}</td></tr>`;
    }).join('');
    return `<table class="plan">
      <thead>
        <tr><th rowspan="2" style="width:110px">Ай</th><th rowspan="2" style="width:120px">Дэд ай</th><th rowspan="2">Суралцахуйн үр дүн</th>
          ${TERMS.map(([n, c]) => `<th colspan="${c}">${n}</th>`).join('')}<th rowspan="2">Уялдаа</th><th rowspan="2">Давтамж</th></tr>
        <tr>${MONTHS.map(m => `<th>${m}<br>сар</th>`).join('')}</tr>
      </thead>
      <tbody>${body}</tbody>
      <tfoot>
        <tr><td colspan="${3 + MONTHS.length}" style="text-align:right">Уялдаа</td><td class="num" colspan="2">${count(rows, 'u')}</td></tr>
        <tr><td colspan="${3 + MONTHS.length}" style="text-align:right">Давтамж</td><td class="num" colspan="2">${count(rows, 'd')}</td></tr>
      </tfoot></table>`;
  }

  const LEGEND = `<div class="legend"><span><span class="sw" style="background:var(--u-ui)"></span>Уялдаа — бусад чиглэлийн суралцахуйн үр дүнтэй уялдуулах сар</span>
    <span><span class="sw" style="background:var(--d-ui)"></span>Давтамж — давтан хэрэгжүүлэх сар</span></div>`;

  function renderDirection(di) {

  // ---------- засварлах ----------
  function editCell(di, ri, mi) {
    const g = G(), d = g.directions[di], r = d.rows[ri], m = r.months[mi];
    const dlg = $('#dlg-cell'), form = dlg.querySelector('form');
    $('#cell-title').textContent = `${r.code} · ${MONTHS[mi]} сар`;
    form.t.value = m.t;
    const idx = outcomeIndex(g);
    const opts = g.directions.map((x, xi) => xi === di ? '' :
      `<optgroup label="${esc(title(x.name))}">${x.rows.map(o => `<option value="${esc(o.code)}">${esc(o.code)}. ${esc(o.text.slice(0, 80))}</option>`).join('')}</optgroup>`).join('');
    const sel = $('#cell-code');
    sel.innerHTML = `<option value="">— сонгох —</option>` + opts +
      (m.code && !idx.has(m.code) ? `<option value="${esc(m.code)}">${esc(m.code)} (жагсаалтад байхгүй)</option>` : '');
    sel.value = m.code || '';
    const sync = () => {
      $('#cell-link').style.display = form.t.value === 'u' ? '' : 'none';
      const o = idx.get(sel.value);
      $('#cell-hint').textContent = o ? `${title(o.dir)}: ${o.text}` : (sel.value ? m.text : 'Уялдуулах үр дүнгээ сонгоно уу.');
    };
    form.querySelectorAll('input[name=t]').forEach(x => x.onchange = sync);
    sel.onchange = sync; sync();
    dlg.onclose = () => {
      if (dlg.returnValue !== 'ok') return;
      const t = form.t.value;
      if (t === 'u') {
        const o = idx.get(sel.value);
        r.months[mi] = { t: 'u', code: sel.value, text: o ? o.text : (sel.value === m.code ? m.text : '') };
      } else r.months[mi] = { t };
      save(); render();
    };
    dlg.returnValue = ''; dlg.showModal();
  }

  function editRow(di, ri) {
    const g = G(), d = g.directions[di], isNew = ri < 0;
    const r = isNew ? { area: d.rows.at(-1)?.area || '', sub: '', code: '', text: '', months: MONTHS.map(() => ({ t: '' })) } : d.rows[ri];
    const dlg = $('#dlg-row');
    $('#row-title').textContent = isNew ? 'Шинэ суралцахуйн үр дүн' : `${r.code} засах`;
    $('#row-area').value = r.area; $('#row-sub').value = r.sub; $('#row-code').value = r.code; $('#row-text').value = r.text;
    if (isNew) $('#row-code').placeholder = `ж: ${ABBR[d.name] || ''}1.1а`;
    $('#dl-areas').innerHTML = [...new Set(d.rows.map(x => x.area))].map(a => `<option value="${esc(a)}">`).join('');
    $('#dl-subs').innerHTML = [...new Set(d.rows.map(x => x.sub))].map(a => `<option value="${esc(a)}">`).join('');
    ['row-del', 'row-up', 'row-down'].forEach(id => $('#' + id).style.display = isNew ? 'none' : '');
    dlg.onclose = () => {
      const v = dlg.returnValue;
      if (v === 'ok') {
        const oldCode = r.code;
        Object.assign(r, { area: $('#row-area').value.trim(), sub: $('#row-sub').value.trim(), code: $('#row-code').value.trim(), text: $('#row-text').value.trim() });
        if (isNew) d.rows.push(r);
        // Код/текст өөрчлөгдвөл бусад чиглэлийн уялдааг шинэчилнэ
        g.directions.forEach(x => x.rows.forEach(y => y.months.forEach(m => {
          if (m.t === 'u' && m.code === oldCode && oldCode) { m.code = r.code; m.text = r.text; }
        })));
      } else if (v === 'delete') {
        if (!confirm(`${r.code} үр дүнг устгах уу?`)) return;
        d.rows.splice(ri, 1);
      } else if (v === 'up' || v === 'down') {
        const j = ri + (v === 'up' ? -1 : 1);
        if (j >= 0 && j < d.rows.length) [d.rows[ri], d.rows[j]] = [d.rows[j], d.rows[ri]];
      } else return;
      save(); render();
    };
    dlg.returnValue = ''; dlg.showModal();
  }

  function exportWord() {
    const g = G();
    const css = `@page WordSection1 { size: 841.9pt 595.3pt; mso-page-orientation: landscape; margin: 36pt 36pt 36pt 36pt; }
      div.WordSection1 { page: WordSection1; }
      body { font-family: "Times New Roman", serif; font-size: 11pt; }

      .plan td.u { background: #B4C6E7; } .plan td.d { background: #C5E0B3; }
      .plan ul { margin: 0; } .lnk-h { font-style: italic; }`;
    const body = g.directions.map((_, i) => docHtml(g, [i])).join('<br clear=all style="page-break-before:always">');

                     .replace(/<td class="m d"/g, '<td class="m d" style="background:#C5E0B3"');

  }

  // Кирилл нэртэй файлыг зарим хөтөч "download" болгодог тул латинаар бичнэ
  const TR = { а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'yo',ж:'j',з:'z',и:'i',й:'i',к:'k',л:'l',м:'m',н:'n',о:'o',ө:'u',п:'p',р:'r',с:'s',т:'t',у:'u',ү:'u',ф:'f',х:'h',ц:'ts',ч:'ch',ш:'sh',щ:'sh',ъ:'',ы:'i',ь:'',э:'e',ю:'yu',я:'ya' };
  const latin = s => s.split('').map(c => { const l = c.toLowerCase(), t = TR[l]; return t == null ? c : (c !== l ? t.charAt(0).toUpperCase() + t.slice(1) : t); }).join('').replace(/[^\w.\-]+/g, '_');
  function download(text, name, type) {
    name = latin(name);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }

  $('#btn-word').onclick = () => ui.view === 'month' ? exportMonthWord() : exportWord();

    ['1700-1730', 'Хөгжөөн баясах\nҮйл ажиллагаа-7']];
  const R1 = ['Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих',
              'Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх',
              'Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл'];
  const R2 = ['Номын тухай эргэн санах: Эхлэл, өрнөл, төгсгөл хэсгүүдтэй холбоотой энгийн асуултууд асуух', ...R1];
  const R3 = ['Уншихын өмнө', 'Уншиж байхдаа', 'Уншиж дуусаад'];
  const RINTRO = [
    'Энэхүү уншлагын үндсэн зорилго нь тухайн номыг танилцуулж, утга агуулга, хэмнэлийг нь алдагдуулахгүйгээр хүүхдэд хүргэх юм. Тиймээс шинэ үгсийг танилцуулахдаа үүнийг харгалзан үзэхээс гадна ойлголтыг бататгах зорилгоор 3-аас ихгүй удаа зогсож асуулт асууж болно.',
    'Тухайн номын агуулга, үйл явдлын талаарх ойлголтыг нэмэгдүүлж хүүхдийн бодож сэтгэх үйлийг дэмжих зорилгоор нээлттэй, бататгах асуултууд илүү ойр ойр асууна. Түүнчлэн шинэ үгсийг давтан тайлбарлахын зэрэгцээ эхний уншлагаар хараахан танилцуулаагүй үгсийг энэ удаагийн уншлагаар нэмж танилцуулна.',
    'Хүүхдийн хүүрнэн ярих чадварыг дэмжихийн зэрэгцээ номд гарсан шинэ үгсийг бататгах, хэрэглээг нь дэмжих зорилгоор багшийн чиглүүлэг дор номын үйл явдлыг хүүхдээр түлхүү яриулна.'];
  const RNAMES = ['Эхний уншлага (1)', 'Хоёр дахь уншлага (2)', 'Гурав дахь уншлага (3)'];

  const nl = s => esc(s).replace(/\n/g, '<br>');
  const yearOf = (g, m) => { const y = parseInt(g.year, 10) || new Date().getFullYear(); return m >= '09' ? y : y + 1; };
  const wdOf = iso => { const [y, mo, d] = iso.split('-').map(Number); return WD[new Date(y, mo - 1, d).getDay()]; };
  const mmdd = iso => iso.slice(5).replace('-', '.');
  const dotted = iso => iso.replace(/-/g, '.');

  function monthObj(g, m) {
    g.monthly = g.monthly || {};
    return g.monthly[m] = g.monthly[m] || { approverTitle: 'АРГАЗҮЙЧ', approver: '', exclude: ['ХӨГЖИМ'],
      links: {}, notes: {}, schedule: [], acts: {}, readings: [] };
  }

  // Жилийн төлөвлөгөөнөөс тухайн сарын шүүлт (уялдаа эхэнд, дараа нь давтамж)
  function filterRows(g, m) {
    const mo = monthObj(g, m), mi = MONTHS.indexOf(m), out = { u: [], d: [] };
    g.directions.forEach(d => {
      if (mo.exclude.includes(d.name)) return;
      d.rows.forEach(r => {
        const c = r.months[mi];
        if (!c || !c.t) return;
        const dates = mo.schedule.filter(s => s.date && (s.code === r.code || s.link === r.code)).map(s => mmdd(s.date));
        out[c.t].push({ code: r.code, text: r.text, t: c.t, dir: d.name,
          link: mo.links[r.code] ?? (c.t === 'u' ? c.code : ''),
          dates: [...new Set(dates)].sort(), note: mo.notes[r.code] || '' });
      });
    });
    return [...out.u, ...out.d];
  }
  const daysText = f => [f.dates.join(', '), f.note].filter(Boolean).join(', ');

  function linkOptions(g, sel, exclude) {
    return `<option value="">—</option>` + g.directions.map(d =>
      `<optgroup label="${esc(title(d.name))}">${d.rows.filter(o => o.code !== exclude).map(o =>
        `<option value="${esc(o.code)}" ${o.code === sel ? 'selected' : ''}>${esc(o.code)}. ${esc(o.text.slice(0, 70))}</option>`).join('')}</optgroup>`).join('');
  }

  function autoGrow(root) {
    root.querySelectorAll('textarea.ag').forEach(t => {
      const fit = () => { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 4) + 'px'; };
      t.addEventListener('input', fit); requestAnimationFrame(fit);
    });
  }

  function renderMonth() {
    const g = G(), m = ui.month, mo = monthObj(g, m), f = filterRows(g, m);
    const written = mo.schedule.filter(s => actFilled(mo.acts[s.date])).length;
    const tabs = [['filter', '🔎', 'Үр дүнгийн шүүлт', f.length], ['schedule', '📅', 'Хуваарь', mo.schedule.length],
                  ['acts', '🧩', 'Үйл ажиллагаа', `${written}/${mo.schedule.length}`], ['readings', '📖', 'Чанга уншлага', mo.readings.length]];
    $('#content').innerHTML = `
      <h2><span class="ic">✏️</span>${title(g.name)} бүлэг — сарын төлөвлөлт</h2>
      <p class="muted">Жилийн төлөвлөгөөний тухайн сарын баганаас суралцахуйн үр дүнг автоматаар шүүж, өдөр бүрийн үйл ажиллагааг бичнэ.</p>
      <div class="mchips">${MONTHS.map(x => {
        const o = g.monthly?.[x], n = o ? o.schedule.length : 0;
        return `<button data-m="${x}" class="${x === m ? 'active' : ''}"><b>${x}</b><span>сар</span>${n ? `<i>${n}</i>` : ''}</button>`;
      }).join('')}</div>
      <div class="subtabs">${tabs.map(([k, ic, l, n]) => `<button data-t="${k}" class="${ui.mtab === k ? 'active' : ''}">${ic} ${l} <small>${n}</small></button>`).join('')}
        <span class="grow"></span>
        <button class="btn mint small" id="m-print">🖨️ Сарыг хэвлэх</button>
        <button class="btn primary small" id="m-word">📄 Сарыг Word-оор</button></div>
      <div id="mbody"></div>`;
    $('#content').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { ui.month = b.dataset.m; render(); });
    $('#content').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { ui.mtab = b.dataset.t; render(); });
    $('#m-print').onclick = printMonth; $('#m-word').onclick = exportMonthWord;
    ({ filter: mFilter, schedule: mSchedule, acts: mActs, readings: mReadings })[ui.mtab]?.(g, m, mo, f);
    autoGrow($('#mbody'));
  }

  // ---------- 1. Шүүлт ----------
  function mFilter(g, m, mo, f) {
    const box = $('#mbody');
    const missing = f.filter(x => !daysText(x));
    box.innerHTML = `
      <div class="mcard">
        <div class="formgrid">
          <label>Батлах албан тушаал<input id="m-apt" value="${esc(mo.approverTitle)}"></label>
          <label>Батлах хүн<input id="m-ap" value="${esc(mo.approver)}" placeholder="ж: Ц.ОДОНЧИМЭГ"></label>
        </div>
        <div class="chk">Шүүлтэд оруулах чиглэл:
          ${g.directions.map(d => `<label><input type="checkbox" data-ex="${esc(d.name)}" ${mo.exclude.includes(d.name) ? '' : 'checked'}> ${dem(d)} ${esc(title(d.name))}</label>`).join('')}</div>
      </div>
      ${missing.length ? `<div class="warn-box">⚠️ ${missing.length} үр дүнд хэрэгжүүлэх өдөр алга: ${missing.map(x => esc(x.code)).join(', ')}. Хуваарьт оруулах эсвэл “Өдөр бүр” гэх мэт тэмдэглэл бичнэ үү.</div>` : ''}
      <div class="scroll"><table class="mt">
        <thead><tr><th>№</th><th>Суралцахуйн үр дүн</th><th style="width:190px">Уялдаа</th><th>Хэлбэр</th><th style="width:200px">Хэрэгжүүлэх өдөр</th><th>Чиглэл</th></tr></thead>
        <tbody>${f.map((x, i) => `<tr>
          <td class="c">${i + 1}</td>
          <td><span class="code">${esc(x.code)}.</span> ${esc(x.text)}</td>
          <td><select data-link="${esc(x.code)}">${linkOptions(g, x.link, x.code)}</select></td>
          <td class="c"><span class="badge ${x.t}">${x.t === 'u' ? 'Уялдаа' : 'Давтамж'}</span></td>
          <td><div class="dates">${x.dates.map(d => `<span>${d}</span>`).join('') || '<em>хуваарьт алга</em>'}</div>
              <input data-note="${esc(x.code)}" value="${esc(x.note)}" placeholder="нэмэлт: Өдөр бүр"></td>
          <td>${dem(g.directions.find(d => d.name === x.dir) || {})} ${esc(title(x.dir))}</td></tr>`).join('')}</tbody></table></div>
      <p class="muted">Хэрэгжүүлэх өдрийг “Хуваарь”-аас автоматаар (үндсэн болон уялдаа байдлаар орсон өдрүүд) бөглөнө.</p>`;
    $('#m-apt').oninput = e => { mo.approverTitle = e.target.value; save(); };
    $('#m-ap').oninput = e => { mo.approver = e.target.value; save(); };
    box.querySelectorAll('[data-ex]').forEach(c => c.onchange = () => {
      const n = c.dataset.ex; mo.exclude = c.checked ? mo.exclude.filter(x => x !== n) : [...mo.exclude, n]; save(); render();
    });
    box.querySelectorAll('[data-link]').forEach(s => s.onchange = () => { mo.links[s.dataset.link] = s.value; save(); });
    box.querySelectorAll('[data-note]').forEach(s => s.oninput = () => { mo.notes[s.dataset.note] = s.value; save(); });
  }

  // ---------- 2. Хуваарь ----------
  function mSchedule(g, m, mo, f) {
    const box = $('#mbody'), fl = new Map(f.map(x => [x.code, x]));
    const used = new Set(mo.schedule.map(s => s.code));
    const notUsedU = f.filter(x => x.t === 'u' && !used.has(x.code));
    box.innerHTML = `
      <div class="toolbar">
        <button class="btn primary" id="s-gen">📆 Ажлын өдрүүдийг үүсгэх (Да–Ба)</button>
        <button class="btn lilac" id="s-auto">🪄 Хоосон өдрүүдэд автоматаар хуваарилах</button>
        <button class="btn" id="s-add">➕ Өдөр нэмэх</button>
      </div>
      ${notUsedU.length ? `<div class="warn-box">Хуваарьт ороогүй уялдаатай үр дүн (${notUsedU.length}): ${notUsedU.map(x => esc(x.code)).join(', ')}</div>` : ''}
      <div class="scroll"><table class="mt">
        <thead><tr><th style="width:150px">Огноо</th><th>Гараг</th><th>Үндсэн суралцахуйн үр дүн</th><th style="width:200px">Уялдаа</th><th>Үйл ажиллагаа</th><th></th></tr></thead>
        <tbody>${mo.schedule.map((s, i) => `<tr>
          <td><input type="date" data-sd="${i}" value="${esc(s.date)}"></td>
          <td class="c">${s.date ? wdOf(s.date) : ''}</td>
          <td><select data-sc="${i}"><option value="">— сонгох —</option>${['u', 'd'].map(t => `<optgroup label="${t === 'u' ? 'Уялдаа' : 'Давтамж'}">${
              f.filter(x => x.t === t).map(x => `<option value="${esc(x.code)}" ${x.code === s.code ? 'selected' : ''}>${used.has(x.code) && x.code !== s.code ? '✓ ' : ''}${esc(x.code)}. ${esc(x.text.slice(0, 80))}</option>`).join('')}</optgroup>`).join('')}
              ${s.code && !fl.has(s.code) ? `<option value="${esc(s.code)}" selected>${esc(s.code)} (шүүлтэд алга)</option>` : ''}</select></td>
          <td><select data-sl="${i}">${linkOptions(g, s.link, s.code)}</select></td>
          <td class="c">${s.date ? `<button class="btn small ${actFilled(mo.acts[s.date]) ? 'mint' : 'primary'}" data-go="${esc(s.date)}">${actFilled(mo.acts[s.date]) ? '✅ Харах' : '✏️ Бичих'}</button>` : ''}</td>
          <td><button class="btn small danger" data-sdel="${i}">✕</button></td></tr>`).join('') ||
          `<tr><td colspan="6" class="c muted">Хуваарь хоосон. “Ажлын өдрүүдийг үүсгэх” товчийг дарна уу.</td></tr>`}</tbody></table></div>
      <p class="muted">Амралт, баярын өдрийг ✕ товчоор хасна. Үндсэн үр дүнг сонгоход уялдаа нь шүүлтээс автоматаар орно.</p>`;
    const sortSave = () => { mo.schedule.sort((a, b) => (a.date || '9').localeCompare(b.date || '9')); save(); render(); };
    $('#s-gen').onclick = () => {
      const y = yearOf(g, m), mon = +m, have = new Set(mo.schedule.map(s => s.date));
      for (let d = new Date(y, mon - 1, 1); d.getMonth() === mon - 1; d.setDate(d.getDate() + 1)) {
        const iso = `${y}-${m}-${String(d.getDate()).padStart(2, '0')}`;
        if (d.getDay() >= 1 && d.getDay() <= 5 && !have.has(iso)) mo.schedule.push({ date: iso, code: '', link: '' });
      }
      sortSave();
    };
    $('#s-add').onclick = () => { mo.schedule.push({ date: '', code: '', link: '' }); save(); render(); };
    $('#s-auto').onclick = () => {
      const queue = [...f.filter(x => x.t === 'u'), ...f.filter(x => x.t === 'd')].filter(x => !used.has(x.code));
      mo.schedule.forEach(s => { if (!s.code && queue.length) { const x = queue.shift(); s.code = x.code; s.link = x.link; } });
      save(); render();
    };
    box.querySelectorAll('[data-sd]').forEach(el => el.onchange = () => {
      const s = mo.schedule[el.dataset.sd], old = s.date; s.date = el.value;
      if (old && mo.acts[old] && !mo.acts[el.value]) { mo.acts[el.value] = mo.acts[old]; delete mo.acts[old]; }
      sortSave();
    });
    box.querySelectorAll('[data-sc]').forEach(el => el.onchange = () => {
      const s = mo.schedule[el.dataset.sc]; s.code = el.value; s.link = fl.get(el.value)?.link || ''; save(); render();
    });
    box.querySelectorAll('[data-sl]').forEach(el => el.onchange = () => { mo.schedule[el.dataset.sl].link = el.value; save(); });
    box.querySelectorAll('[data-sdel]').forEach(el => el.onclick = () => {
      const s = mo.schedule[el.dataset.sdel];
      if (actFilled(mo.acts[s.date]) && !confirm(`${s.date} өдрийн бичсэн үйл ажиллагаа хамт устна. Үргэлжлүүлэх үү?`)) return;
      delete mo.acts[s.date]; mo.schedule.splice(+el.dataset.sdel, 1); save(); render();
    });
    box.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { ui.mtab = 'acts'; ui.act = b.dataset.go; render(); });
  }

  // ---------- 3. Үйл ажиллагааны төлөвлөлт ----------
  const actFilled = a => !!a && !!(a.method || a.competence || a.criteria || (a.steps || []).some(s => s.teacher || s.learner));
  const newAct = () => ({ method: '', competence: '', materials: '', criteria: '',
    steps: DEFAULT_STEPS.map(([time, name]) => ({ time, name, teacher: '', learner: '' })) });

  function mActs(g, m, mo) {
    const box = $('#mbody'), idx = outcomeIndex(g);
    const days = mo.schedule.filter(s => s.date);
    if (!days.length) { box.innerHTML = `<p class="muted">Эхлээд “Хуваарь” хэсэгт өдрүүдээ үүсгэнэ үү.</p>`; return; }
    if (!days.some(s => s.date === ui.act)) ui.act = (days.find(s => !actFilled(mo.acts[s.date])) || days[0]).date;
    const s = days.find(x => x.date === ui.act);
    const a = mo.acts[s.date] = mo.acts[s.date] || newAct();
    const main = idx.get(s.code), link = idx.get(s.link);
    const prev = days[days.findIndex(x => x.date === s.date) - 1];
    box.innerHTML = `
      <div class="act-layout">
        <div class="act-list">${days.map(x => `<button data-day="${esc(x.date)}" class="${x.date === s.date ? 'active' : ''}">
            <span>${actFilled(mo.acts[x.date]) ? '✅' : '⬜'}</span><b>${mmdd(x.date)}</b><small>${wdOf(x.date).slice(0, 2)}</small><em>${esc(x.code || '—')}</em></button>`).join('')}</div>
        <div class="act-edit">
          <div class="act-head">
            <div><small>Бүлэг</small><b>${gem(g)} ${title(g.name)} бүлэг</b></div>
            <div style="flex:3"><small>Суралцахуйн үр дүн</small><b>${s.code ? `${esc(s.code)}. ${esc(main?.text || '')}` : '<em>Хуваарьт үндсэн үр дүн сонгоогүй</em>'}</b></div>
            <div><small>Хугацаа</small><b>${dotted(s.date)}<br>${wdOf(s.date)}</b></div>
          </div>
          <div class="formgrid">
            <label>Суралцахуйн арга<input data-f="method" list="dl-methods" value="${esc(a.method)}" placeholder="сонгох эсвэл бичих"></label>
            <label>Суралцахуйн үр дүн уялдаа<div class="ro">${s.link ? `${esc(s.link)}. ${esc(link?.text || '')}` : '— (хуваарьт сонгоно)'}</div></label>
          </div>
          <datalist id="dl-methods">${METHODS.map(x => `<option value="${esc(x)}">`).join('')}</datalist>
          <label>Чадамж<textarea class="ag" data-f="competence" rows="2">${esc(a.competence)}</textarea></label>
          <label>Хэрэглэгдэхүүн<textarea class="ag" data-f="materials" rows="2">${esc(a.materials)}</textarea></label>
          <label>Үнэлгээний шалгуур<textarea class="ag" data-f="criteria" rows="2">${esc(a.criteria)}</textarea></label>
          <h3 class="sec">🕒 Өдрийн үйл ажиллагааны явц</h3>
          <div class="scroll"><table class="mt steps">
            <thead><tr><th style="width:96px">Хугацаа</th><th style="width:150px">Сургалт үйл ажиллагаа</th><th>Багшлахуйн үйл ажиллагаа</th><th>Суралцахуйн үйл ажиллагаа</th><th style="width:70px"></th></tr></thead>
            <tbody>${a.steps.map((st, i) => `<tr>
              <td><input data-st="${i}:time" value="${esc(st.time)}"></td>
              <td><textarea class="ag" data-st="${i}:name" rows="2">${esc(st.name)}</textarea></td>
              <td><textarea class="ag" data-st="${i}:teacher" rows="3" placeholder="Багш юу хийх вэ…">${esc(st.teacher)}</textarea></td>
              <td><textarea class="ag" data-st="${i}:learner" rows="3" placeholder="Хүүхдүүд юу хийх вэ…">${esc(st.learner)}</textarea></td>
              <td class="c"><button class="btn small" data-mv="${i}:-1">↑</button><button class="btn small" data-mv="${i}:1">↓</button><button class="btn small danger" data-del="${i}">✕</button></td></tr>`).join('')}</tbody></table></div>
          <div class="toolbar">
            <button class="btn" id="a-add">➕ Мөр нэмэх</button>
            ${prev ? `<button class="btn lilac" id="a-copy">📋 Өмнөх өдрийн (${mmdd(prev.date)}) хугацаа, бүтцийг хуулах</button>` : ''}
            <span class="grow"></span>
            <button class="btn mint" id="a-print">🖨️ Энэ өдрийг хэвлэх</button>
            <button class="btn primary" id="a-word">📄 Энэ өдрийг Word-оор</button>
          </div>
        </div>
      </div>`;
    box.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { ui.act = b.dataset.day; render(); });
    box.querySelectorAll('[data-f]').forEach(el => el.oninput = () => { a[el.dataset.f] = el.value; save(); markDay(); });
    box.querySelectorAll('[data-st]').forEach(el => el.oninput = () => {
      const [i, k] = el.dataset.st.split(':'); a.steps[i][k] = el.value; save(); markDay();
    });
    const markDay = () => { const b = box.querySelector(`[data-day="${s.date}"] span`); if (b) b.textContent = actFilled(a) ? '✅' : '⬜'; };
    box.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => {
      const [i, d] = b.dataset.mv.split(':').map(Number), j = i + d;
      if (j >= 0 && j < a.steps.length) { [a.steps[i], a.steps[j]] = [a.steps[j], a.steps[i]]; save(); render(); }
    });
    box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { a.steps.splice(+b.dataset.del, 1); save(); render(); });
    $('#a-add').onclick = () => { a.steps.push({ time: '', name: '', teacher: '', learner: '' }); save(); render(); };
    if (prev) $('#a-copy').onclick = () => {
      const p = mo.acts[prev.date];
      if (!p) return;
      if (a.steps.some(x => x.teacher || x.learner) && !confirm('Одоогийн явцын мөрүүдийг солих уу? (Бичсэн агуулга устна)')) return;
      a.steps = p.steps.map(x => ({ time: x.time, name: x.name, teacher: '', learner: '' })); save(); render();
    };
    $('#a-print').onclick = () => printDocs(actDoc(g, mo, s) + mo.readings.filter(r => readingFirst(g, m, r) === s.date).map(r => readingDoc(r)).join(''));
    $('#a-word').onclick = () => wordDownload(actDoc(g, mo, s), `${title(g.name)}_${s.date}_үйл_ажиллагаа.doc`);
  }

  // ---------- 4. Чанга уншлага ----------
  function mReadings(g, m, mo) {
    const box = $('#mbody');
    if (ui.read == null || !mo.readings[ui.read]) ui.read = mo.readings.length ? 0 : -1;
    const r = mo.readings[ui.read];
    box.innerHTML = `
      <div class="toolbar">
        ${mo.readings.map((x, i) => `<button class="btn small ${i === ui.read ? 'primary' : ''}" data-r="${i}">📖 ${esc(x.book || 'Нэргүй ном')}</button>`).join('')}
        <button class="btn mint small" id="r-new">➕ Шинэ ном</button>
      </div>
      ${!r ? '<p class="muted">Энэ сард чанга уншлагын төлөвлөгөө алга. “Шинэ ном” товчоор нэмнэ үү.</p>' : `
      <div class="mcard">
        <div class="formgrid">
          <label>Номын нэр<input data-rf="book" value="${esc(r.book)}"></label>
          <label>Зохиолч, зураач<input data-rf="author" value="${esc(r.author)}"></label>
        </div>
        <label>Уншлагын өдрүүд<input data-rf="days" value="${esc(r.days)}" placeholder="11.02 (1-р уншлага), 11.04 (2-р уншлага), 11.06 (3-р уншлага)"></label>
        <label>Уншлагын зорилго <span class="muted">(бусад суралцахуйн чиглэлтэй холбоотой зорилгыг нэмэлтээр тусгах)</span><textarea class="ag" data-rf="goals" rows="3">${esc(r.goals)}</textarea></label>
        <label>Номын товч танилцуулга<textarea class="ag" data-rf="summary" rows="3">${esc(r.summary)}</textarea></label>
      </div>
      <h3 class="sec">🔤 Шинээр танилцуулах үгс</h3>
      <div class="scroll"><table class="mt">
        <thead><tr><th>Ном уншихын өмнө заах үг</th><th>Уншиж байхдаа утгачлан тайлбарлах үг</th><th>Үйл хөдлөл, номын зураг зэргийг ашиглан танилцуулах үг</th><th style="width:40px"></th></tr></thead>
        <tbody>${r.words.map((w, i) => `<tr>${[0, 1, 2].map(k => `<td><textarea class="ag" rows="1" data-w="${i}:${k}">${esc(w[k])}</textarea></td>`).join('')}
          <td><button class="btn small danger" data-wdel="${i}">✕</button></td></tr>`).join('')}</tbody></table></div>
      <div class="toolbar"><button class="btn small" id="w-add">➕ Үг нэмэх</button></div>
      ${[['r1', R1], ['r2', R2], ['r3', R3]].map(([k, labels], ri) => `
        <h3 class="sec">${['1️⃣', '2️⃣', '3️⃣'][ri]} ${RNAMES[ri]}</h3>
        <p class="muted">${RINTRO[ri]}</p>
        ${labels.map(l => `<label>${esc(l)}<textarea class="ag" rows="2" data-rr="${k}" data-rl="${esc(l)}">${esc(r[k][l] || '')}</textarea></label>`).join('')}`).join('')}
      <h3 class="sec">📜 Номын бичвэр</h3>
      <textarea class="ag" rows="6" data-rf="text" placeholder="Хуудас 1. …&#10;Хуудас 2. …">${esc(r.text)}</textarea>
      <div class="toolbar"><span class="grow"></span>
        <button class="btn danger" id="r-del">🗑️ Энэ номыг устгах</button>
        <button class="btn mint" id="r-print">🖨️ Хэвлэх</button>
        <button class="btn primary" id="r-word">📄 Word-оор</button></div>`}`;
    box.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { ui.read = +b.dataset.r; render(); });
    $('#r-new').onclick = () => {
      mo.readings.push({ days: '', book: '', author: '', goals: '', summary: '', words: [['', '', '']], r1: {}, r2: {}, r3: {}, text: '' });
      ui.read = mo.readings.length - 1; save(); render();
    };
    if (!r) return;
    box.querySelectorAll('[data-rf]').forEach(el => el.oninput = () => { r[el.dataset.rf] = el.value; save(); });
    box.querySelectorAll('[data-rr]').forEach(el => el.oninput = () => { r[el.dataset.rr][el.dataset.rl] = el.value; save(); });
    box.querySelectorAll('[data-w]').forEach(el => el.oninput = () => { const [i, k] = el.dataset.w.split(':'); r.words[i][k] = el.value; save(); });
    box.querySelectorAll('[data-wdel]').forEach(b => b.onclick = () => { r.words.splice(+b.dataset.wdel, 1); save(); render(); });
    $('#w-add').onclick = () => { r.words.push(['', '', '']); save(); render(); };
    $('#r-del').onclick = () => { if (confirm(`“${r.book}” номын төлөвлөгөөг устгах уу?`)) { mo.readings.splice(ui.read, 1); ui.read = 0; save(); render(); } };
    $('#r-print').onclick = () => printDocs(readingDoc(r));
    $('#r-word').onclick = () => wordDownload(readingDoc(r), `Чанга_уншлага_${r.book || 'ном'}.doc`);
  }

  function readingFirst(g, m, r) {
    const mm = (r.days || '').match(/(\d\d)\.(\d\d)/);
    if (!mm) return '';
    return `${yearOf(g, mm[1])}-${mm[1]}-${mm[2]}`;
  }

  // ---------- Баримт бичиг (хэвлэх / Word) ----------
  const sign = g => `<p class="sig">БОЛОВСРУУЛСАН<br>БАГШ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ${esc(g.teacher)}</p>`;
  const page = html => `<div class="pdoc">${html}</div>`;

  function filterDoc(g, m, mo) {
    const f = filterRows(g, m), y = yearOf(g, m);
    return page(`
      <table class="nob"><tr><td></td><td class="appr">БАТЛАВ<br>${esc(mo.approverTitle)} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ${esc(mo.approver)}<br>${y} оны ..... сарын ..... өдөр</td></tr></table>
      <p class="ttl">${esc(g.school)} ${esc(g.name)} БҮЛГИЙН ${y} ОНЫ ${+m} ${(ORD[m] || '').toUpperCase()} САРЫН СУРАЛЦАХУЙН ҮР ДҮН, УЯЛДААНЫ ШҮҮЛТ</p>
      <p class="ctr">(${esc(g.year)} оны хичээлийн жилийн сургалтын үйл ажиллагааны төлөвлөгөөнөөс)</p>
      <table class="dt"><thead><tr><th>№</th><th>Суралцахуйн үр дүн</th><th>Уялдаа</th><th>Хэлбэр</th><th>Хэрэгжүүлэх өдөр</th><th>Чиглэл</th></tr></thead>
      <tbody>${f.map((x, i) => `<tr><td class="c">${i + 1}</td><td>${esc(x.code)}. ${esc(x.text)}</td><td class="c">${esc(x.link)}</td>
        <td class="c">${x.t === 'u' ? 'Уялдаа' : 'Давтамж'}</td><td class="c">${esc(daysText(x))}</td><td>${esc(title(x.dir))}</td></tr>`).join('')}</tbody></table>
      ${sign(g)}`);
  }

  function scheduleDoc(g, m, mo) {
    const idx = outcomeIndex(g), y = yearOf(g, m);
    return page(`
      <p class="ttl">${y} ОНЫ ${+m} ${(ORD[m] || '').toUpperCase()} САРЫН ЧИГЛҮҮЛЭГТЭЙ ҮЙЛ АЖИЛЛАГААНЫ ХУВААРЬ</p>
      <table class="dt"><thead><tr><th>Огноо</th><th>Гараг</th><th>Үндсэн суралцахуйн үр дүн</th><th>Уялдаа</th></tr></thead>
      <tbody>${mo.schedule.filter(s => s.date).map(s => `<tr><td class="c">${dotted(s.date)}</td><td class="c">${wdOf(s.date)}</td>
        <td>${s.code ? `${esc(s.code)}. ${esc(idx.get(s.code)?.text || '')}` : ''}</td><td class="c">${esc(s.link)}</td></tr>`).join('')}</tbody></table>
      ${sign(g)}`);
  }

  function actDoc(g, mo, s) {
    const idx = outcomeIndex(g), a = mo.acts[s.date] || newAct(), link = idx.get(s.link);
    return page(`
      <p class="ttl">ЧИГЛҮҮЛЭГТЭЙ ҮЙЛ АЖИЛЛАГААНЫ ТӨЛӨВЛӨЛТ</p>
      <table class="dt"><tr><th>Бүлэг</th><th>Суралцахуйн үр дүн</th><th>Хугацаа</th><th>БАТЛАВ<br>${esc(title(mo.approverTitle))}<br>${esc(mo.approver)}</th></tr>
        <tr><td class="c">${title(g.name)} бүлэг</td><td>${s.code ? `${esc(s.code)}. ${esc(idx.get(s.code)?.text || '')}` : ''}</td><td class="c">${dotted(s.date)}</td><td></td></tr></table>
      <p><b>Суралцахуйн арга:</b> &nbsp; ${esc(a.method)}</p>
      <p><b>Суралцахуйн үр дүн уялдаа:</b> &nbsp; ${s.link ? `${esc(s.link)}. ${esc(link?.text || '')}` : ''}</p>
      <p><b>Чадамж:</b> &nbsp; ${nl(a.competence)}</p>
      <p><b>Хэрэглэгдэхүүн:</b> &nbsp; ${nl(a.materials)}</p>
      <p><b>Үнэлгээний шалгуур:</b> &nbsp; ${nl(a.criteria)}</p>
      <table class="dt"><thead><tr><th style="width:12%">Хугацаа</th><th style="width:16%">Сургалт үйл ажиллагаа</th><th>Багшлахуйн үйл ажиллагаа</th><th>Суралцахуйн үйл ажиллагаа</th></tr></thead>
      <tbody>${a.steps.map(x => `<tr><td class="c">${esc(x.time)}</td><td>${nl(x.name)}</td><td>${nl(x.teacher)}</td><td>${nl(x.learner)}</td></tr>`).join('')}</tbody></table>
      ${sign(g)}`);
  }

  function readingDoc(r) {
    const rt = (k, labels, i) => `<table class="dt"><tr><th colspan="2">${RNAMES[i]}</th></tr><tr><td colspan="2"><i>${RINTRO[i]}</i></td></tr>
      ${labels.map(l => `<tr><td style="width:32%"><b>${esc(l)}</b></td><td>${nl(r[k][l] || '')}</td></tr>`).join('')}</table>`;
    return page(`
      <p class="ttl">ЧАНГА УНШЛАГЫН АРГА ЗҮЙ<br>ТӨЛӨВЛӨГӨӨНИЙ ХУУДАС</p>
      <p>Уншлагын өдрүүд: ${esc(r.days)}</p>
      <table class="dt"><tr><td style="width:32%"><b>Номын нэр:</b></td><td>«${esc(r.book)}»</td></tr>
        <tr><td><b>Зохиолч, зураач:</b></td><td>${esc(r.author)}</td></tr>
        <tr><td><b>Уншлагын зорилго:</b> (Бусад суралцахуйн чиглэлүүдтэй холбоотой зорилгыг нэмэлтээр тусгах)</td><td>${nl(r.goals)}</td></tr></table>
      <table class="dt"><tr><th>Номын товч танилцуулга:</th></tr><tr><td>${nl(r.summary)}</td></tr></table>
      <table class="dt"><tr><th colspan="3">Шинээр танилцуулах үгс:</th></tr>
        <tr><th>Ном уншихын өмнө заах үг</th><th>Уншиж байхдаа утгачлан тайлбарлах үг</th><th>Үйл хөдлөл, номын зураг зэргийг ашиглан танилцуулах үг</th></tr>
        ${r.words.map(w => `<tr>${w.map(x => `<td>${nl(x)}</td>`).join('')}</tr>`).join('')}</table>
      ${rt('r1', R1, 0)}${rt('r2', R2, 1)}${rt('r3', R3, 2)}
      ${r.text ? `<table class="dt"><tr><th>Номын бичвэр: «${esc(r.book)}»</th></tr><tr><td>${nl(r.text)}</td></tr></table>` : ''}`);
  }

  function monthDocs(g, m) {
    const mo = monthObj(g, m), placed = new Set();
    let html = filterDoc(g, m, mo) + scheduleDoc(g, m, mo);
    mo.schedule.filter(s => s.date).forEach(s => {
      html += actDoc(g, mo, s);
      mo.readings.forEach((r, i) => { if (!placed.has(i) && readingFirst(g, m, r) === s.date) { placed.add(i); html += readingDoc(r); } });
    });
    mo.readings.forEach((r, i) => { if (!placed.has(i)) html += readingDoc(r); });
    return html;
  }

  function printDocs(html) { $('#print-root').innerHTML = `<div class="mdocs">${html}</div>`; window.print(); }
  function printMonth() { printDocs(monthDocs(G(), ui.month)); }

  const DOC_CSS = `
    .pdoc { font-family: "Times New Roman", serif; font-size: 11pt; }
    .mdocs p { margin: 4pt 0; }
    .mdocs .ttl { text-align: center; font-weight: bold; margin: 8pt 0; }
    .mdocs .ctr { text-align: center; }
    .mdocs .sig { font-weight: bold; margin-top: 14pt; }
    .mdocs table.nob { width: 100%; border: none; } .mdocs table.nob td { border: none; }
    .mdocs td.appr { width: 42%; font-weight: bold; }
    .mdocs table.dt { border-collapse: collapse; width: 100%; margin: 6pt 0; font-size: 10pt; }
    .mdocs .dt th, .mdocs .dt td { border: 1px solid #000; padding: 3pt 5pt; vertical-align: top; text-align: left; }
    .mdocs .dt th { background: #F2F2F2; text-align: center; }
    .mdocs .dt td.c { text-align: center; }`;

  function wordDownload(html, name) {
    const parts = html.split('<div class="pdoc">').filter(Boolean).map(x => '<div class="pdoc">' + x);
    const doc = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
      <head><meta charset="utf-8"><style>@page WordSection1 { size: 595.3pt 841.9pt; margin: 56.7pt 42.5pt 56.7pt 85pt; }
      div.WordSection1 { page: WordSection1; } body { font-family: "Times New Roman", serif; font-size: 11pt; }
      ${DOC_CSS.replace(/\.mdocs /g, '')}</style></head>
      <body><div class="WordSection1 mdocs">${parts.join('<br clear=all style="page-break-before:always">')}</div></body></html>`;
    download('﻿' + doc, name, 'application/msword');
  }

  function exportMonthWord() {
    const g = G();
    wordDownload(monthDocs(g, ui.month), `${title(g.name)}_бүлэг_${yearOf(g, ui.month)}_${ui.month}_сарын_төлөвлөлт.doc`);
  }
  document.head.insertAdjacentHTML('beforeend', `<style>@page monthly { size: A4 portrait; margin: 20mm 15mm 20mm 30mm; } @media print { ${DOC_CSS} .mdocs .pdoc { page: monthly; page-break-after: always; } .mdocs .pdoc:last-child { page-break-after: auto; } }</style>`);


  render();
})();
</script>
</body>
</html>
