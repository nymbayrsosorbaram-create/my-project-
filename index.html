гжмийн төв: Хонх, бөмбөрөөр хэмнэлийн зүй тогтол цохих.\nМатематикийн төв: Зүй тогтлын карт дагуу шоо өрөх.","learner":"Урлагийн төв:\n- Хадаг дээр хээний зүй тогтлыг зурж үргэлжлүүлнэ.\nХөгжмийн төв:\n- Хонх, бөмбөрөөр \"удаан – хурдан – хурдан\" хэмнэлийг дагаж цохино.\nМатематикийн төв:\n- Картын зүй тогтлын дагуу шоо өрж, үргэлжлүүлнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 2 (1). Ажиглалт: Мөсөн баримал ажиглах\nЗорилго: Мөс, цасаар хийсэн баримлыг ажиглаж хэлбэр, шинж чанарыг ярилцах; баримлын урлагийн тухай ойлголт өгөх.\nЯвц:\n- Цэцэрлэгийн талбай дахь мөсөн/цасан баримлыг ойроос ажиглуулна.\n- Багшийн мэдээлэл: Мөс, цасаар хүн, амьтан, барилгын баримал хийдэг. Хүйтэнд удаан хадгалагддаг, дулаарахад хайлдаг.\n- Асуулт: «Энэ баримал юуг дүрсэлсэн бэ?», «Мөс ямар байна?», «Хавар болоход юу болох вэ?»","learner":"- Баримлыг ойроос ажиглаж юуг дүрсэлснийг хэлнэ.\n- Бээлийтэй гараар мөсийг мэдэрч \"хатуу, гөлгөр, тунгалаг\" гэж хэлнэ.\n- \"Хавар дулаарахад хайлна\" гэж таамаглана.\n- Өөрөө ямар баримал хийхийг хүсч байгаагаа хэлнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Хэмнэлийг дага»\nЗорилго: Хэмнэлийн зүй тогтлыг хөдөлгөөнөөр давтах.\nЯвц:\n1. Багш хэнгэрэгээр \"Тог – тог – тогтог\" цохино.\n2. Хүүхдүүд ижил хэмнэлээр алхаж, үсэрнэ.\n3. Хүүхэд ээлжлэн хэмнэл цохиж бусдыг удирдана.\nДүрэм: Хэмнэл зогсоход зогсоно.\nДүгнэлт: Цагаан сарын амралтад гэр бүлдээ ямар тоглоом заахаа ярилцана.","learner":"- Хэмнэлийг сонсоод ижил хэмнэлээр алхаж, үсэрнэ.\n- Хэмнэл зогсоход зогсоно.\n- Ээлжээр хэмнэл цохиж бусдыг удирдана.\n- Амралтаараа гэрийнхэндээ заах тоглоомоо хэлнэ."}]},"2027-02-09":{"method":"Зохиолд суурилсан арга","link":"ЗУ3.1а. Уран зураг, баримлын бүтээлийг ажиглаж өөрт төрсөн сэтгэгдлээ илэрхийлнэ.","competence":"Нийгэм, сэтгэл хөдлөлийн хөгжил (сэтгэл хөдлөлөө таатай, таагүй гэж илэрхийлэх), гоо зүйн мэдрэмж (уран зургийн сэтгэгдлээ хэлэх)","materials":"Сэтгэл хөдлөлийн нүүрний карт, «Сэтгэл хөдлөлийн цаг» самбар, янз бүрийн сэтгэл хөдлөлийг илэрхийлсэн уран зургийн хуулбар (баяр, гуниг, тайван), «Бамбаруушийн нулимс» зурагт карт, толь","criteria":"Сэтгэл хөдлөлөө таатай, таагүй байгааг үг, нүүрний хувирлаар илэрхийлдэг. Уран зургийг ажиглаж өөрт төрсөн сэтгэгдлээ илэрхийлдэг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Цагаан сарын амралт ямар өнгөрсөн бэ?\" гэж асууж, \"Сэтгэл хөдлөлийн цаг\" самбарт сэтгэлээ байрлуулахыг урина.","learner":"- Мэндчилж тойрогт сууна.\n- Цагаан сарын амралтаараа хийсэн зүйлээ ярина.\n- Өөрийн сэтгэлийг илэрхийлсэн картыг сонгож самбарт байрлуулна.\n- \"Би ... байна, учир нь ...\" гэж шалтгаантайгаар хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Сэтгэл хөдлөлөө нэрлэх: Баяртай, гунигтай, уурласан, айсан, гайхсан картуудыг үзүүлж \"Таатай уу, таагүй юу?\" гэж хоёр бүлэгт ангилуулна.\n- Толинд харах: Хүүхдүүд толинд харж сэтгэл хөдлөл бүрийн нүүрний хувирлыг үзүүлнэ.\n- Уран зураг ажиглах: 3 уран зургийг үзүүлж \"Энэ зургийг хараад ямар мэдрэмж төрж байна?\" гэж асууна.\nБагшийн чиглүүлэх асуулт:\n1. Чи ямар үед баярладаг вэ? Ямар үед гунигладаг вэ?\n2. Энэ зураг чамд ямар сэтгэгдэл төрүүлж байна вэ? Яагаад?\n3. Таагүй сэтгэлтэй үедээ хэнд хэлэх вэ?","learner":"Сэтгэл хөдлөлөө нэрлэх:\n- Картын сэтгэл хөдлөлийг нэрлэж, \"таатай\", \"таагүй\" гэж ангилна.\nТолинд харах:\n- Толинд харж баяртай, гунигтай, уурласан, гайхсан нүүр гаргана.\n- Найзынхаа нүүрийг харж ямар сэтгэл үзүүлснийг таана.\nУран зураг ажиглах:\n- Зураг бүрийг ажиглаж \"Энэ зураг надад баяр төрүүлж байна, учир нь өнгө нь тод\" гэж сэтгэгдлээ хэлнэ.\nАсуултад хариулах:\n- Өөрөө баярладаг, гунигладаг үеэ ярьж, таагүй үедээ ээж, багшдаа хэлнэ гэж хариулна."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Тоглох үед хүүхдүүд сэтгэлээ хэрхэн илэрхийлж буйг ажиглаж, үгээр хэлэхийг дэмжинэ.","learner":"- Тоглоомын явцад \"Би баяртай байна\", \"Надад таалагдсангүй\" гэж сэтгэлээ үгээр хэлнэ.\n- Найзтайгаа тоглоомоо хуваалцана."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – эхний уншлага (1): «Бамбаруушийн нулимс» (Чанга уншлагын төлөвлөгөөний хуудсыг үзнэ үү.)\n- Номын нэр, хавтас, зохиолч, зураачийг танилцуулж, хэмнэлийг алдагдуулахгүй уншина.\n- Түр зогсож асуух: «Бамбарууш ганцаараа ямар санагдаж байгаа бол?»\n- Шинэ үг: «Анзаарах – ажиглаж мэдэх»\n- Уншсаны дараа: «Бамбарууш яагаад гунигтай болсон бэ?»","learner":"- Номын хавтсыг харж \"Энэ ном ... тухай байх\" гэж таамаглана.\n- Багшийн уншихыг анхааралтай сонсоно.\n- Түр зогсох үед бамбаруушийн сэтгэлийг таамаглаж хэлнэ.\n- «Анзаарах» үгийг давтан хэлж, утгыг нь хэлнэ.\n- Бамбарууш гунигласан шалтгааныг тайлбарлана."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: \"Миний сэтгэл\" – баяртай, гунигтай үеийн өнгөөр зураг зурах.\nХэл ярианы төв: Сэтгэл хөдлөлийн карт сугалж, \"Би ... үед ... болдог\" өгүүлбэр зохиох.\nҮзэсгэлэнгийн булан: Уран зургийн хуулбаруудыг байрлуулж, дуртайгаа сонгох.","learner":"Урлагийн төв:\n- Сэтгэлдээ тохирох өнгөөр зураг зурж, тайлбарлана.\nХэл ярианы төв:\n- Карт сугалж \"Би бэлэг авахдаа баярладаг\" гэх мэт өгүүлбэр зохионо.\nҮзэсгэлэнгийн булан:\n- Дуртай зургаа сонгож, өөрт төрсөн сэтгэгдлээ найздаа хэлнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 2 (2). Хөдөлмөрийн үйл ажиллагаа: Шувууны тэжээлийн сав дүүргэх\nЗорилго: Эхэлсэн ажлаа үргэлжлүүлэх, шувуунд туслах хариуцлагатай байх.\nХэрэглэгдэхүүн: Будаа, үр, жижиг аяга, шүүр\nЯвц:\n- Тэжээлийн савнаас цас, хог цэвэрлэж, шинэ тэжээл хийлгэнэ.\n- Шувуу ирж байгаа эсэхийг алсаас ажиглуулна.\n- Асуулт: «Шувуу тэжээл идээд ямар сэтгэлтэй болох бол?», «Чамд туслахад ямар санагдаж байна?»","learner":"- Тэжээлийн савыг шүүрээр цэвэрлэнэ.\n- Жижиг аягаар тэжээл хийнэ.\n- Шувууг алсаас чимээгүй ажиглана.\n- Тусалсны дараах өөрийн сэтгэлийг (\"баяртай\") хэлнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Би ямар байна?»\nЗорилго: Сэтгэл хөдлөлийг нүүр, биеэр илэрхийлж таах.\nЯвц:\n1. Нэг хүүхэд сэтгэл хөдлөлийн карт сугалж, үг хэлэлгүй нүүр, биеэрээ үзүүлнэ.\n2. Бусад нь таана.\n3. Зөв таасан хүүхэд дараагийн ээлжийг авна.\nДүрэм: Зөвхөн үзүүлнэ, хэлэхгүй.\nДүгнэлт: Өнөөдөр ямар сэтгэл хөдлөлүүдийг сурснаа нэрлэнэ.","learner":"- Карт сугалж сэтгэл хөдлөлийг нүүр, биеэрээ үзүүлнэ.\n- Найзынхаа үзүүлснийг харж таана.\n- Сурсан сэтгэл хөдлөлүүдээ нэрлэнэ."}]},"2027-02-10":{"method":"Зохиолд суурилсан арга","link":"ХӨГ3.1д. Үлгэр зохиол, дуу, аялгууны дүрийн онцлогийг илэрхийлж тоглоно.","competence":"Нийгэм, сэтгэл хөдлөлийн хөгжил (бусдын сэтгэл хөдлөлийг тайлбарлах), хөгжим (дүрийн онцлогийг илэрхийлэх)","materials":"«Бамбаруушийн нулимс» зурагт карт, сэтгэл хөдлөлийн нүүрний карт, амьтдын баг (бамбарууш, туулай, хэрэм), хөгжим (баяртай, гунигтай аялгуу)","criteria":"Бусдын сэтгэл хөдлөлийн таатай, таагүй байгааг нүүр, үйлдлээр нь танин тайлбарладаг. Үлгэрийн дүрийн онцлогийг хөдөлгөөн, дуу хоолойгоор илэрхийлж тоглодог.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, хоёр хүүхдийн нүүрний хувирлыг үзүүлэн \"Найз чинь ямар сэтгэлтэй байна вэ?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Найзынхаа нүүрийг харж сэтгэлийг нь нэрлэнэ.\n- \"Тэр баяртай байна, учир нь инээмсэглэж байна\" гэж тайлбарлана."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Бусдын сэтгэлийг таних: Зурагт картын хүүхдүүдийн нүүр, биеийн байдлыг харж \"Энэ хүүхэд ямар сэтгэлтэй вэ? Яаж мэдсэн бэ?\" гэж асууна.\n- Хөгжим сонсох: Баяртай, гунигтай аялгуу сонсгож, \"Энэ аялгуу ямар дүрд тохирох вэ?\" гэж асууна.\n- Дүрийн хөдөлгөөн: Бамбарууш (хүнд алхаатай), туулай (хөнгөн үсрэлттэй), хэрэм (хурдан) дүрийг аялгуунд тохируулан үзүүлүүлнэ.\nБагшийн чиглүүлэх асуулт:\n1. Туулай баярлахдаа яаж хөдлөх вэ? Гуниглахдаа?\n2. Найзын чинь нүүр улайж, гараа зангидвал ямар сэтгэлтэй байна вэ?\n3. Гунигтай аялгуу сонсоход ямар дүр санаанд орж байна?","learner":"Бусдын сэтгэлийг таних:\n- Зургийн хүүхдийн нүүр, гар, биеийн байдлыг харж сэтгэлийг нь нэрлэнэ.\n- \"Нулимстай байгаа учраас гунигтай\" гэж шалтгааныг хэлнэ.\nХөгжим сонсох:\n- Аялгууг сонсоод баяртай эсвэл гунигтай гэж ялгана.\nДүрийн хөдөлгөөн:\n- Баг зүүж, бамбарууш шиг хүнд, туулай шиг хөнгөн, хэрэм шиг хурдан хөдөлнө.\n- Дүрийн дуу хоолойг дуурайн \"Уучлаарай\" гэх мэт үг хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Дүрт тоглоомын буланд амьтдын баг байрлуулж, хүүхдүүд дүрд тоглохыг ажиглана.","learner":"- Амьтдын баг зүүж дүрд тоглоно.\n- Дүрийнхээ сэтгэлийг нүүр, хөдөлгөөнөөр үзүүлнэ."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – хоёр дахь уншлага (2): «Бамбаруушийн нулимс» (Төлөвлөгөөний хуудсыг 02.09-ний төлөвлөлтийн дараа үзнэ үү.)\n- Номын тухай эргэн сануулах асуулт асууна: «Номын эхэнд амьтад юу хийхээр цугларсан бэ?»\n- Түр зогсож асуух: «Зураг дээр туулайн нүүр ямар байна вэ?», «Хэрэм юуг анзаарсан бэ?»\n- Шинэ үг: «Нулимс унагах», «Бөхийх», «Тэврэх» – үйлдлээр үзүүлэх\n- Уншсаны дараа: Дүрд тоглох – бамбарууш, туулай, хэрэм","learner":"- Номын үйл явдлыг эргэн санаж ярина.\n- Зургаас туулай, бамбаруушийн сэтгэлийг таньж тайлбарлана.\n- «Нулимс унагах», «Бөхийх», «Тэврэх» үгийг үйлдлээр үзүүлнэ.\n- Дүрийн хөдөлгөөн, дуу хоолойг дуурайн дүрд тоглоно."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Хөгжмийн төв: Баяртай, гунигтай аялгууг хонх, бөмбөрөөр гаргах.\nХэл ярианы төв: Сэтгэл хөдлөлийн карт ба шалтгааны зургийг тааруулах.\nУрлагийн төв: Бамбаруушийн \"баяртай\", \"гунигтай\" нүүрийг зурах.","learner":"Хөгжмийн төв:\n- Хонх, бөмбөрөөр баяртай (хурдан) ба гунигтай (удаан) аялгуу гаргана.\nХэл ярианы төв:\n- Сэтгэл хөдлөл ба шалтгааныг тааруулж, тайлбарлана.\nУрлагийн төв:\n- Бамбаруушийн хоёр нүүрийг зурж, ялгааг нь хэлнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 2 (3). Хөдөлгөөнт тоглоом: «Чоно ба ишиг»\nЗорилго: Дохиогоор гүйх, бултах, хамтран тоглох.\nЯвц:\n- Нэг хүүхэд \"чоно\", бусад нь \"ишиг\" болно. Ишигнүүд талбайд бэлчиж явна.\n- \"Чоно ирлээ!\" гэхэд ишигнүүд \"хашаа\" руу гүйнэ.\n- Баригдсан ишиг дараагийн чоно болно.\n- Асуулт: «Ишиг айхдаа юу хийсэн бэ?», «Найзаа яаж хамгаалсан бэ?»","learner":"- Ишиг болж талбайд бэлчих дүр үзүүлнэ.\n- \"Чоно ирлээ!\" гэхэд хашаа руугаа хурдан гүйнэ.\n- Мөргөлдөхгүй, түлхэлцэхгүй гүйнэ.\n- Айх, баярлах сэтгэлээ хэлнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Найз маань ямар байна?»\nЗорилго: Бусдын сэтгэлийг ойлгож, тайвшруулах.\nЯвц:\n1. Хүүхдүүд хос болно.\n2. Нэг нь сэтгэл хөдлөлийн карт харж, тэр сэтгэлийг үзүүлнэ.\n3. Нөгөө нь \"Чи ... байна уу? Яагаад?\" гэж асууж, гунигтай бол тайвшруулна.\nДүрэм: Эелдэг харьцана.\nДүгнэлт: Найзынхаа сэтгэлийг хэрхэн мэдсэнээ ярилцана.","learner":"- Найзтайгаа хос болно.\n- Найзынхаа үзүүлсэн сэтгэлийг таньж \"Чи гунигтай байна уу? Яагаад?\" гэж асууна.\n- Гунигтай бол тэвэрч, тайвшруулах үг хэлнэ.\n- Үүргээ сольж давтана."}]},"2027-02-11":{"method":"Тоглоомонд суурилсан арга","link":"НСХ3.1в. Уурлаж тавгүйтсэн үедээ бусадтай ярилцах, \"тайвшрах булан\"-д очих зэргээр тайвширдаг болно.","competence":"Биеийн хөдөлгөөний чадвар (тэнцвэр хадгалах – дэглий), нийгэм, сэтгэл хөдлөл (тайвшрах арга)","materials":"Дэвсгэр, тэнцвэрийн самбар, «Мод» иогийн зурагт карт, тайвшруулах хөгжим, «Тайвшрах булан»-ы карт","criteria":"Гарыг дээш өргөн алгаа хавсарч, нэг хөлөө тулалтын хөлийн өвдгөнд нааж тэнцвэр хадгалан (дэглий) зогсдог. Уурласан үедээ гүнзгий амьсгаа авах, тоолох зэргээр тайвширдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, тайвшруулах хөгжим тавьж, хамтдаа гүнзгий амьсгалын дасгал хийнэ.","learner":"- Мэндчилж тойрогт сууна.\n- Хамраараа гүнзгий амьсгаа аваад, амаараа аажуухан гаргана.\n- Дасгалын дараах мэдрэмжээ (\"тайван\", \"амар\") хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Зааж үзүүлэх: «Мод» байрлалыг үзүүлнэ: гараа дээш өргөн алгаа хавсарч, баруун хөлөө зүүн хөлийн өвдгөнд наан зогсох.\n- Дасгал: Эхлээд хананд түшиж, дараа нь бие даан 5 тоолох хугацаанд зогсуулна. Хөлөө сольж давтуулна.\n- Тайвшрал ба тэнцвэр: \"Бухимдсан үед тэнцвэр хадгалахад хэцүү, тайван үед амархан\" гэдгийг амьсгалын дасгалтай холбож туршуулна.\nБагшийн чиглүүлэх асуулт:\n1. Тэнцвэрээ хадгалахын тулд нүдээ хаашаа харах вэ?\n2. Амьсгаагаа тайвшруулахад ямар болсон бэ?\n3. Аль хөл дээр зогсоход амархан байсан бэ?","learner":"Зааж үзүүлэх:\n- Багшийг ажиглаж «Мод» байрлалыг дуурайна.\nДасгал:\n- Хананд түшиж нэг хөл дээр зогсоно.\n- Дараа нь бие даан гараа дээш өргөж, алгаа хавсран 5 хүртэл тоолох хугацаанд зогсоно.\n- Хөлөө сольж давтана.\nТайвшрал ба тэнцвэр:\n- Эхлээд гүнзгий амьсгаа аваад, дараа нь «Мод» байрлалд орж ялгааг мэдэрнэ.\n- \"Тайван үед унахгүй зогссон\" гэж хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Хөдөлгөөний буланд тэнцвэрийн самбар байрлуулж, хүүхдүүдийн бие даан дасгал хийхийг ажиглана.","learner":"- Тэнцвэрийн самбар дээр алхаж, нэг хөл дээр зогсоно.\n- Найзтайгаа хэн удаан зогсохыг тоолно."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Иогийн амьтдын байрлалтай зурагт ном (\"Амьтан шиг сунгаа\") үзүүлж, хуудас бүрийн байрлалыг хамтдаа хийнэ.","learner":"- Номын зургийг харж амьтны байрлалыг дуурайна.\n- Байрлал бүрийн нэрийг хэлнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Хөдөлгөөний төв: Иогийн карт (мод, муур, нохой) дагуу байрлал хийх.\nТайвшрах булан: Тайвшруулах лонх, амьсгалын карт.\nУрлагийн төв: «Мод» байрлалтай өөрийгөө зурах.","learner":"Хөдөлгөөний төв:\n- Картын дагуу иогийн байрлал хийж, тэнцвэрээ хадгална.\nТайвшрах булан:\n- Лонх сэгсрэн гялтгануур буухыг ажиглаж, амьсгаагаа тайвшруулна.\nУрлагийн төв:\n- «Мод» байрлалтай өөрийгөө зурна."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 2 (4). Ганцаарчилсан үйл ажиллагаа: Бөмбөг шидэж барих\nЗорилго: Бөмбөг барих чадвар сул хүүхдүүдтэй ганцаарчлан ажиллах.\nЯвц:\n- Хүүхэдтэй ойроос (1 м) бөмбөг шидэлцэж, барих арга (гараа дэлгэх, цээж рүүгээ татах)-ыг зааж өгнө.\n- Аажмаар зайг холдуулна.\n- Бусад хүүхдүүд цасан дээр чөлөөтэй тоглоно.","learner":"- Багштай бөмбөг шидэлцэж барина.\n- Гараа дэлгэж, бөмбөгийг цээж рүүгээ татан барина.\n- Барьсан тоогоо тоолж, амжилтандаа баярлана."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Хөгжим зогсвол мод бол»\nЗорилго: Хөдөлгөөнийг зогсоож тэнцвэр хадгалах, тайвшрах.\nЯвц:\n1. Хөгжмийн аянд хүүхдүүд чөлөөтэй бүжиглэнэ.\n2. Хөгжим зогсоход «Мод» байрлалд орж 5 тоолно.\n3. Унасан хүүхэд гүнзгий амьсгаа аваад дахин оролдоно.\nДүрэм: Бусдыг түлхэхгүй.\nДүгнэлт: Тайвшрахад ямар арга тусалснаа ярилцана.","learner":"- Хөгжмийн аянд бүжиглэнэ.\n- Хөгжим зогсоход «Мод» байрлалд орж 5 тоолно.\n- Тэнцвэрээ алдвал амьсгаа аваад дахин оролдоно.\n- Тайвшрахад тусалсан аргаа хэлнэ."}]},"2027-02-12":{"method":"Зохиолд суурилсан арга","link":"ХӨГ3.1д. Үлгэр зохиол, дуу, аялгууны дүрийн онцлогийг илэрхийлж тоглоно.","competence":"Хэл яриа (номын зургаас үйл явдлыг ойлгож ярих), хөгжим (дүрийн онцлогийг илэрхийлэх)","materials":"«Бамбаруушийн нулимс» зурагт карт, үггүй зурагт ном, амьтдын хуруун хүүхэлдэй, хөгжим","criteria":"Номын зургаас үйл явдлыг ойлгож дэлгэрэнгүй ярьдаг. Үлгэрийн дүрийн онцлогийг хөдөлгөөн, дуу хоолойгоор илэрхийлж тоглодог.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, номын нүүрийг үзүүлж \"Энэ ном юуны тухай байх бол?\" гэж таалгана.","learner":"- Мэндчилж тойрогт сууна.\n- Номын нүүрийн зургийг харж агуулгыг таамаглана.\n- Таамаглалаа бүтэн өгүүлбэрээр хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Зураг унших: Үггүй зурагт номын хуудсыг нэг нэгээр үзүүлж, хүүхдүүдээр \"Юу болж байна? Хэн юу хийж байна?\" гэж яриулна.\n- Үйл явдлыг холбох: \"Өмнөх хуудсанд юу болсон бэ? Дараа нь юу болох бол?\" гэж асууж, хуудсуудыг холбуулна.\n- Дүрийн дуу хоолой: Дүр бүрийн яриаг өөр дуу хоолойгоор (бамбарууш – бүдүүн, туулай – нарийн) хэлүүлнэ.\nБагшийн чиглүүлэх асуулт:\n1. Энэ зурагт юу болж байна вэ?\n2. Дүр ямар сэтгэлтэй байна? Яаж мэдсэн бэ?\n3. Дараа нь юу болох бол?","learner":"Зураг унших:\n- Хуудас бүрийн зургийг харж \"Энд бамбарууш гүйж байна, туулайн байшин нурлаа\" гэж үйл явдлыг ярина.\nҮйл явдлыг холбох:\n- Өмнөх хуудсыг санаж, дараагийн хуудсанд юу болохыг таамаглана.\nДүрийн дуу хоолой:\n- Бамбаруушийн бүдүүн, туулайн нарийн дуу хоолойг дуурайн дүрийн үгийг хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Номын буланд үггүй зурагт номууд байрлуулж, хүүхдүүд бие даан \"уншиж\" буйг ажиглана.","learner":"- Үггүй номыг сонгож, зургаар нь найздаа түүх ярина.\n- Найзынхаа ярихыг сонсоно."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – гурав дахь уншлага (3): «Бамбаруушийн нулимс» (Төлөвлөгөөний хуудсыг 02.09-ний төлөвлөлтийн дараа үзнэ үү.)\n- Номын үйл явдлыг хүүхдүүдээр түлхүү яриулна.\n- Дүгнэн ярилцах: «Уучлалт гуйх нь яагаад чухал вэ?»\n- Шинэ үгсээр өгүүлбэр зохиох: нураах, анзаарах, уучлалт гуйх, нулимс унагах\n- Бүтээл: Бамбарууш, туулай, хэрмийн хуруун хүүхэлдэй хийж, үлгэрийг тоглох","learner":"- Номын нэр, зохиолч, зураачийг санаж хэлнэ.\n- Номын зургийг харж үлгэрийг өөрийн үгээр ярина.\n- \"Уучлалт гуйвал найз дахин баярладаг\" гэж дүгнэнэ.\n- Шинэ үгсээр өгүүлбэр зохионо.\n- Хуруун хүүхэлдэй хийж, дүрийн дуу хоолойгоор үлгэрийг тоглоно."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Хэл ярианы төв: 4 дараалсан зурагт карт бэлтгэж, түүх зохиох.\nХүүхэлдэйн театр: Хуруун хүүхэлдэйгээр үлгэр тоглох.\nХөгжмийн төв: Дүр бүрт тохирох аялгуу сонгох.","learner":"Хэл ярианы төв:\n- Картуудыг дараалуулж, зургаар түүх зохиож ярина.\nХүүхэлдэйн театр:\n- Хүүхэлдэйгээр дүрийн онцлогийг (хурдан, удаан, баяртай) илэрхийлж тоглоно.\nХөгжмийн төв:\n- Дүрд тохирох аялгууг сонгож, шалтгаанаа хэлнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 3 (1). Ажиглалт: Цасан дээрх амьтдын мөр ажиглах\nЗорилго: Цасан дээрх нохой, муур, шувууны мөрийг ажиглаж ялгах, мөрөөр нь хэн явсныг таах.\nЯвц:\n- Талбайн цасан дээрх мөрүүдийг ажиглуулна.\n- Багшийн мэдээлэл: Нохойн мөр хумстай, муурынх дугуй, шувуунх салаа хэлбэртэй байдаг. Мөрийг хараад хэн явсныг мэдэж болно.\n- Асуулт: «Энэ хэний мөр вэ?», «Аль нь том, аль нь жижиг вэ?», «Мөр хаашаа чиглэсэн бэ?»","learner":"- Цасан дээрх мөрүүдийг ажиглаж хэлбэрийг нь дүрсэлнэ.\n- Мөрийг харж хэн явсныг таана.\n- Мөрүүдийг том, жижгээр харьцуулна.\n- Мөрийг дагаж алхаж, хаашаа чиглэснийг хэлнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Ямар амьтан бэ?»\nЗорилго: Амьтны дүрийн онцлогийг хөдөлгөөн, дуугаар илэрхийлэх.\nЯвц:\n1. Нэг хүүхэд амьтны карт сугалж, хөдөлгөөн, дуугаар үзүүлнэ.\n2. Бусад нь таана.\nДүрэм: Амьтны нэрийг хэлэхгүй.\nДүгнэлт: Өнөөдөр ямар дүрд тоглосноо хуваалцана.","learner":"- Карт сугалж амьтныг хөдөлгөөн, дуугаар үзүүлнэ.\n- Найзынхаа үзүүлсэн амьтныг таана.\n- Өнөөдөр тоглосон дүрээ хэлнэ."}]},"2027-02-15":{"method":"Зохиолд суурилсан арга","link":"ХЯ3.2д. Үйл явдлын эхлэл, өрнөл, төгсгөлийг дарааллын дагуу ярина.","competence":"Нийгэм, сэтгэл хөдлөлийн хөгжил (бусдын таагүй сэтгэлийн шалтгааныг ойлгож энэрэх), хэл яриа (үйл явдлыг дарааллаар ярих)","materials":"«Гэрээ хайсан бяцхан үнэг» зурагт карт, нөхцөл байдлын зурагт карт (төөрсөн, унасан, ганцаараа үлдсэн хүүхэд), сэтгэл хөдлөлийн карт, «Энэрлийн зүрх»","criteria":"Бусдын таагүй сэтгэл хөдлөлийн шалтгааныг энгийнээр тайлбарлаж, тайвшруулах, туслах зэрэг энэрэх үйлдэл үзүүлдэг. Үйл явдлын эхлэл, өрнөл, төгсгөлийг дарааллын дагуу ярьдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Чи хэзээ нэгэн цагт төөрч байсан уу? Тэр үед ямар санагдсан бэ?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Төөрч байсан эсвэл айж байсан туршлагаа ярина.\n- \"Би айсан, учир нь ээжийгээ олохгүй байсан\" гэж шалтгаантайгаар хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Нөхцөл байдлын карт: Төөрсөн, унасан, ганцаараа үлдсэн хүүхдийн зургийг үзүүлж \"Яагаад гунигтай байна? Түүнд юу хэрэгтэй вэ?\" гэж ярилцана.\n- Дүрд тоглох: Нөхцөл бүрт \"туслагч\" болж юу хэлж, юу хийхийг тоглуулна.\n- Дарааллаар ярих: \"Эхлээд юу болсон, дараа нь хэн тусалсан, эцэст нь юу болсон\" гэж нөхцөл бүрийг дарааллаар яриулна.\nБагшийн чиглүүлэх асуулт:\n1. Энэ хүүхэд яагаад уйлж байна вэ?\n2. Чи түүнд яаж туслах вэ?\n3. Түүх эхлээд, дараа нь, эцэст нь юу болсон бэ?","learner":"Нөхцөл байдлын карт:\n- Зургийн хүүхдийн сэтгэлийг нэрлэж, \"Ээжээсээ төөрсөн учраас айж байна\" гэж шалтгааныг тайлбарлана.\nДүрд тоглох:\n- Туслагч болж \"Битгий ай, бид хамт багшаас асууя\" гэж хэлж, гараас нь хөтөлнө.\nДарааллаар ярих:\n- \"Эхлээд ..., дараа нь ..., эцэст нь ...\" гэсэн үгээр нөхцөл бүрийг ярина."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Тоглох үед ганцаараа байгаа найзыг анзаарч урьж буй хүүхдүүдийг ажиглаж \"Энэрлийн зүрх\" өгнө.","learner":"- Ганцаараа байгаа найзаа тоглоомдоо урина.\n- Унасан найздаа тусалж босгоно."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – эхний уншлага (1): «Гэрээ хайсан бяцхан үнэг» (Чанга уншлагын төлөвлөгөөний хуудсыг үзнэ үү.)\n- Номын нэр, хавтас, зохиолч, зураачийг танилцуулж, хэмнэлийг алдагдуулахгүй уншина.\n- Түр зогсож асуух: «Хэн үнэгэнд туслах бол?»\n- Шинэ үг: «Төөрөх – замаа олохгүй болох»\n- Уншсаны дараа: «Бяцхан үнэг яагаад гунигтай байсан бэ?»","learner":"- Номын хавтсыг харж \"Энэ ном ... тухай байх\" гэж таамаглана.\n- Багшийн уншихыг анхааралтай сонсоно.\n- Түр зогсох үед хэн туслахыг таамаглана.\n- «Төөрөх» үгийг давтан хэлж, утгыг нь хэлнэ.\n- Үнэгний гунигласан шалтгааныг тайлбарлана."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Хэл ярианы төв: 4 дараалсан зургаар \"Төөрсөн муур\" түүх зохиох.\nУрлагийн төв: \"Найздаа тусалсан минь\" зураг зурах.\nДүрт тоглоомын төв: Амьтдын баг, \"ой\" орчин бүрдүүлж үлгэрийг тоглох.","learner":"Хэл ярианы төв:\n- Зургуудыг дараалуулж, \"Эхлээд ..., дараа нь ..., эцэст нь ...\" гэж түүх ярина.\nУрлагийн төв:\n- Найздаа тусалсан үеэ зурж тайлбарлана.\nДүрт тоглоомын төв:\n- Үнэг, хэрэм, тарвага, шаазгайн дүрд тоглож, туслах үг хэлнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 3 (2). Хөдөлмөрийн үйл ажиллагаа: Тоглоомын талбайн цасыг цэвэрлэх\nЗорилго: Хамтран ажиллах, тоглоомын талбайг аюулгүй болгох.\nХэрэглэгдэхүүн: Жижиг хүрз, шүүр, бээлий\nЯвц:\n- Гулгуур, савлуурын эргэн тойрны цасыг хүрзээр түрж, шүүрдүүлнэ.\n- Багш халтиргаатай хэсгийг тэмдэглэж, тэр хэсгээс хол байлгана.\n- Асуулт: «Талбай цэвэр болоход хэнд тустай вэ?», «Найзууддаа хэрхэн тусалсан бэ?»","learner":"- Багтаа нэгдэж өөрт оногдсон хэсгийг цэвэрлэнэ.\n- Хүрзээр цасыг түрж, шүүрээр шүүрдэнэ.\n- Хүнд үед найздаа \"Би тусалъя\" гэж хэлж хамтран ажиллана.\n- Халтиргаатай хэсгээс хол байна."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Найзаа аврах»\nЗорилго: Бусдад туслах, хамтран тоглох.\nЯвц:\n1. Нэг хүүхэд \"шуурга\" болж бусдыг хөөнө.\n2. Хүрэгдсэн хүүхэд \"төөрч\" зогсоно.\n3. Найз нь гараас нь хөтөлж \"гэрт нь\" хүргэвэл дахин тоглоно.\nДүрэм: Түлхэхгүй, зөөлөн хүрнэ.\nДүгнэлт: \"Найзаа аврахад ямар санагдсан бэ?\" гэж ярилцана.","learner":"- Шуурганаас зугтаж гүйнэ.\n- Хүрэгдвэл зогсоно.\n- Төөрсөн найзаа гараас нь хөтөлж гэрт нь хүргэнэ.\n- Тусалсны дараах мэдрэмжээ хэлнэ."}]},"2027-02-16":{"method":"Тоглоомонд суурилсан арга","link":"МАТ3.1б. Дараалан байрлуулсан тоглоом, дүрсүүдийн зүй тогтлыг ажиглаж үргэлжлүүлнэ.","competence":"Биеийн хөдөлгөөний чадвар (гар, хөлийн хөдөлгөөнийг зэрэг болон ээлжлэн хийх), зүй тогтол үргэлжлүүлэх","materials":"Хөдөлгөөний зурагт карт (алга ташина, хөл дэвсэнэ, гараа дэлгэнэ, хөлийн үзүүр дээр өндийнө), хэнгэрэг, өнгөт алга/хөлийн мөрийн тэмдэг","criteria":"Гарын сарвуу, хөлийн тавхайн хэсгээр хийх хөдөлгөөнийг зэрэг болон ээлжлэн гүйцэтгэдэг. Хөдөлгөөний зүй тогтлыг ажиглаж үргэлжлүүлдэг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, хуруугаараа \"хуруун дасгал\" (атгах – дэлгэх) хийлгэнэ.","learner":"- Мэндчилж тойрогт сууна.\n- Гараа атгаж, дэлгэж хуруугаа халаана.\n- Хуруугаа нэг нэгээр нь нугалж тоолно."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Зэрэг хөдөлгөөн: Хоёр гараа зэрэг атгаж-дэлгэх, хоёр хөлийн үзүүр дээр зэрэг өндийх дасгал хийлгэнэ.\n- Ээлжлэн хөдөлгөөн: Баруун гар – зүүн гар, баруун хөл – зүүн хөл ээлжлэн дэвсэх, алга ташихыг хэнгэрэгний хэмнэлээр хийлгэнэ.\n- Хөдөлгөөний зүй тогтол: \"Алга ташина – хөл дэвсэнэ – алга ташина – хөл дэвсэнэ – ?\" картын дарааллыг харж үргэлжлүүлүүлнэ.\nБагшийн чиглүүлэх асуулт:\n1. Хоёр гараа зэрэг хөдөлгөхөд хэцүү байсан уу, ээлжлэн хөдөлгөхөд үү?\n2. Дараа нь ямар хөдөлгөөн ирэх вэ?\n3. Өөрөө хөдөлгөөний зүй тогтол зохиож чадах уу?","learner":"Зэрэг хөдөлгөөн:\n- Хоёр гараа зэрэг атгаж, дэлгэнэ.\n- Хоёр хөлийн үзүүр дээр зэрэг өндийж, буунэ.\nЭэлжлэн хөдөлгөөн:\n- Хэнгэрэгний хэмнэлээр баруун, зүүн гараа ээлжлэн өргөнө.\n- Хөлөө ээлжлэн дэвсэж алхана.\nХөдөлгөөний зүй тогтол:\n- Картын дарааллыг харж дараагийн хөдөлгөөнийг хийнэ.\n- Өөрөө 2-3 хөдөлгөөнтэй зүй тогтол зохиож, найзууддаа дуурайлгана."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Хөдөлгөөний буланд алга, хөлийн мөрийн тэмдэг наасан зам байрлуулж, хүүхдүүдийн бие даасан тоглоомыг ажиглана.","learner":"- Шалан дээрх алга, хөлийн тэмдгийг дагаж, гараар эсвэл хөлөөр гишгэж явна.\n- Найзтайгаа ээлжлэн замаа туулна."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Хуруун тоглоомтой шүлэг (\"Таван хуруу\") уншиж, хуруугаараа дагуулан хөдөлгүүлнэ.","learner":"- Шүлгийг сонсож давтана.\n- Хуруугаа шүлгийн дагуу нэг нэгээр нь хөдөлгөнө."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Хөдөлгөөний төв: Алга, хөлийн мөрийн зам.\nМатематикийн төв: Алга (улаан) – хөл (цэнхэр) тэмдгийн зүй тогтлыг үргэлжлүүлэх.\nУрлагийн төв: Алгаа будаж дардас үлдээх, зүй тогтол гаргах.","learner":"Хөдөлгөөний төв:\n- Алга, хөлийн мөрийг дагаж туулна.\nМатематикийн төв:\n- Улаан алга, цэнхэр хөлийн тэмдгийг ээлжлүүлэн үргэлжлүүлнэ.\nУрлагийн төв:\n- Алгаа будаж цаасан дээр дардас үлдээн, өнгөний зүй тогтол гаргана."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 3 (3). Хөдөлгөөнт тоглоом: «Тарвага нүхэндээ»\nЗорилго: Дохиогоор хурдаа өөрчлөн гүйх, байраа олох.\nЯвц:\n- Талбайд цагираг (\"нүх\") тавина. Хүүхдүүд \"тарвага\" болно.\n- \"Нар гарлаа\" гэхэд тарвагууд нүхнээсээ гарч бэлчинэ (гар, хөлөө ээлжлэн хөдөлгөж мөлхөх, алхах).\n- \"Бүргэд ирлээ!\" гэхэд нүх рүүгээ орно.\n- Асуулт: «Тарвага өвөл юу хийдэг вэ?»","learner":"- Тарвага болж цагираг дотор сууна.\n- \"Нар гарлаа\" гэхэд нүхнээсээ гарч гар, хөлөө ээлжлэн хөдөлгөн мөлхөж, алхана.\n- \"Бүргэд ирлээ!\" гэхэд нүх рүүгээ хурдан орно.\n- \"Тарвага өвөл нүхэндээ унтдаг\" гэж хэлнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Надаас дуурай»\nЗорилго: Хөдөлгөөний дарааллыг ажиглаж давтах.\nЯвц:\n1. Багш 3 хөдөлгөөнийг дараалан үзүүлнэ (алга ташина – хөл дэвсэнэ – эргэнэ).\n2. Хүүхдүүд яг ижил дарааллаар давтана.\n3. Хүүхэд ээлжлэн дараалал зохиож үзүүлнэ.\nДүрэм: Дарааллыг алдагдуулахгүй.\nДүгнэлт: Өнөөдөр сурсан хөдөлгөөнүүдээ давтана.","learner":"- Багшийн 3 хөдөлгөөнийг ажиглана.\n- Ижил дарааллаар давтана.\n- Өөрөө дараалал зохиож найзууддаа үзүүлнэ."}]},"2027-02-17":{"method":"Шинжлэн судлах арга","link":"ЗУ3.2г. Баримлын шавар, элс, гурилан зуурмагаар хүн, амьтан, эд юмсыг зохиомжлон барина (гурав ба түүнээс дээш хэсгээс бүтсэн).","competence":"Байгалийн мэдлэг (амьтдын амьдрах орчныг ялгах, хамгаалах), бүтээлчээр сэтгэх (зуурмагаар амьтан барих)","materials":"Ой, гол, тал, газар доорх нүхний зурагт үзүүлэн, амьтдын зурагт карт (хэрэм, загас, тарвага, үнэг, шаазгай, баавгай), гурилан зуурмаг, «Гэрээ хайсан бяцхан үнэг» зурагт карт","criteria":"Амьтдын амьдрах орчныг ялган таньж, тэднийг хамгаалах аргыг нэрлэдэг. Гурилан зуурмагаар амьтныг гурав ба түүнээс дээш хэсгээс зохиомжлон барьдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Хэрэм хаана амьдардаг вэ? Загас хаана амьдардаг вэ?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Амьтан бүрийн амьдардаг газрыг нэрлэнэ.\n- \"Хэрэм модны хонгилд амьдардаг\" гэж бүтэн өгүүлбэрээр хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Амьдрах орчин: Ой, гол, тал, газар доорх нүхний үзүүлэнд амьтдын картыг тохирох газарт байрлуулна.\n- Хамгаалах: \"Амьтдын гэрийг эвдвэл юу болох вэ?\" гэж ярилцаж, хамгаалах аргыг (мод хугалахгүй, хог хаяхгүй, үүрэнд хүрэхгүй) нэрлүүлнэ.\n- Зуурмагаар барих: Сонгосон амьтнаа (толгой, бие, хөл, сүүл) зуурмагаар барьж, гэрт нь байрлуулна.\nБагшийн чиглүүлэх асуулт:\n1. Энэ амьтан хаана амьдардаг вэ? Яагаад?\n2. Бид амьтдыг яаж хамгаалах вэ?\n3. Чиний амьтан хэдэн хэсгээс бүтсэн бэ?","learner":"Амьдрах орчин:\n- Амьтны картыг харж нэрлэнэ.\n- Ой, гол, тал, газар доорх нүхний аль нь тохирохыг сонгож байрлуулна.\n- Сонголтоо тайлбарлана (\"Загас усанд амьсгалдаг\").\nХамгаалах:\n- Амьтдын гэрийг хамгаалах аргыг 2-3 нэрлэнэ.\nЗуурмагаар барих:\n- Амьтныхаа толгой, бие, хөл, сүүлийг тус тусад нь хийж нийлүүлнэ.\n- Барьсан амьтнаа гэрт нь байрлуулж, \"Миний үнэг ойн захын нүхэнд амьдардаг\" гэж танилцуулна."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Барилгын буланд \"Амьтны хүрээлэн\" байгуулах орчин бүрдүүлнэ.","learner":"- Шоогоор амьтдын гэр барина.\n- Тоглоомон амьтдыг гэрт нь байрлуулна."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – хоёр дахь уншлага (2): «Гэрээ хайсан бяцхан үнэг» (Төлөвлөгөөний хуудсыг 02.15-ны төлөвлөлтийн дараа үзнэ үү.)\n- Номын тухай эргэн сануулах асуулт асууна: «Үнэг хэнээс хэнээс асуусан бэ?»\n- Түр зогсож асуух: «Загас яагаад хөлддөггүй вэ?», «Шаазгай яагаад үнэгэнд тусалсан бэ?»\n- Шинэ үг: «Шуурах», «Ухах», «Дагуулах» – үйлдлээр үзүүлэх\n- Уншсаны дараа: Үлгэрийн зургийг эхлэл, өрнөл, төгсгөлөөр дараалуулах","learner":"- Номын үйл явдлыг эргэн санаж, үнэгний уулзсан амьтдыг дарааллаар нь нэрлэнэ.\n- Амьтан бүрийн гэрийг хэлнэ.\n- «Шуурах», «Ухах», «Дагуулах» үгийг үйлдлээр үзүүлнэ.\n- Зургуудыг эхлэл, өрнөл, төгсгөлөөр дараалуулна."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: Гурилан зуурмаг, шавраар амьтан барих.\nБайгаль шинжлэлийн төв: Амьтдын картыг амьдрах орчноор нь ангилах.\nХэл ярианы төв: \"Би хэн бэ?\" – амьтныг гэрээр нь таах оньсого.","learner":"Урлагийн төв:\n- Зуурмагаар амьтан барьж, хэсгүүдийг нь нэрлэнэ.\nБайгаль шинжлэлийн төв:\n- Картуудыг ой, гол, тал гэж ангилна.\nХэл ярианы төв:\n- \"Би модны хонгилд амьдардаг, самар иддэг. Би хэн бэ?\" гэх мэт оньсого зохиож, найзаараа таалгана."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 3 (4). Ганцаарчилсан үйл ажиллагаа: Мөлхөх дасгал\nЗорилго: Мөлхөх хөдөлгөөн сул хүүхдүүдтэй өвдөг, тохойны тусламжтай мөлхөх дасгал хийх.\nЯвц:\n- Цасан дээр дэвсгэр дэвсэж, нуман хаалга (\"үнэгний нүх\") доогуур мөлхүүлнэ.\n- Бөгсөөрөө гулсах дасгалыг налуу толгод дээр хийлгэнэ.\n- Бусад хүүхдүүд цасан дээр амьтдын мөр гаргаж тоглоно.","learner":"- Нуман хаалга доогуур өвдөг, тохойгоороо мөлхөнө.\n- Налуугаас бөгсөөрөө гулсана.\n- Багшийн дэмжлэгтэйгээр давтана."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Гэр рүүгээ!»\nЗорилго: Амьтдыг амьдрах орчинтой нь холбох, дохиогоор гүйх.\nЯвц:\n1. Өрөөний гурван буланд \"ой\", \"гол\", \"тал\" гэсэн тэмдэг тавина.\n2. Хүүхэд бүрт амьтны карт өгнө.\n3. \"Гэр рүүгээ!\" гэхэд амьтныхаа гэр рүү алхаж очно.\nДүрэм: Түлхэлцэхгүй.\nДүгнэлт: Амьтдыг хамгаалах аргаа давтана.","learner":"- Өөрийн амьтны картыг харж нэрлэнэ.\n- Дохиогоор амьтныхаа гэр рүү алхаж очно.\n- Амьтдыг хамгаалах аргаа давтан хэлнэ."}]},"2027-02-18":{"method":"Тоглоомонд суурилсан арга","link":"ХЭМ3.1е. Мөлхөлтийн төрлүүдийг (бөгсөөрөө гулсах, өвдөг тохойны тусламжтай мөлхөх) хэрэглэл ашиглан гүйцэтгэнэ.","competence":"Орон зайн баримжаа (өмнө, хойно, дээшээ, доошоо), биеийн хөдөлгөөн (мөлхөлтийн төрлүүд)","materials":"Ширээ, сандал, нуман хаалга, цагираг, дэвсгэр, тоглоомон амьтад, байршлын сумтай карт","criteria":"Чиглэл, байршлын дагуу (өмнө, хойно, дээшээ, доошоо, дотор, гадна) үйлдэл хийдэг. Мөлхөлтийн төрлүүдийг хэрэглэл ашиглан гүйцэтгэдэг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Гараа дээш өргө, доош буулга, урагш сунга, хойш ав\" дасгал хийлгэнэ.","learner":"- Мэндчилж тойрогт зогсоно.\n- Багшийн хэлсэн чиглэлд гараа хөдөлгөнө.\n- Чиглэлийн үгийг давтан хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Байршуулах: \"Баавгайг ширээн доор, туулайг сандлын өмнө, хэрмийг шүүгээн дээр тавиарай\" гэх даалгавар өгнө.\n- Саадтай зам: Ширээн доогуур мөлхөх, нуман хаалга доогуур мөлхөх, цагираг дундуур орох, дэвсгэр дээр бөгсөөрөө гулсах замыг туулуулна.\n- Хэлэх: Зам туулах бүрт \"Би ширээн доогуур мөлхлөө\" гэж байршлын үгээр хэлүүлнэ.\nБагшийн чиглүүлэх асуулт:\n1. Баавгай хаана байна вэ?\n2. Чи юуны доогуур, юуны дундуур явсан бэ?\n3. Таны өмнө хэн зогсож байна вэ?","learner":"Байршуулах:\n- Багшийн даалгаврыг сонсож тоглоомон амьтдыг ширээн доор, сандлын өмнө, шүүгээн дээр байрлуулна.\n- \"Баавгай ширээн доор байна\" гэж шалгана.\nСаадтай зам:\n- Ширээн доогуур өвдөг, тохойгоороо мөлхөнө.\n- Цагираг дундуур орж, дэвсгэр дээр бөгсөөрөө гулсана.\nХэлэх:\n- Саад бүрийг туулахдаа \"Би ... доогуур/дундуур/дээгүүр явлаа\" гэж хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Хөдөлгөөний буланд нуман хаалга, цагираг байрлуулж, бие даан саадтай зам туулахыг ажиглана.","learner":"- Саадтай замыг бие даан туулна.\n- Найздаа \"Чи ширээн доогуур мөлх\" гэж чиглэл өгнө."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Зам заасан ном (\"Баавгай хаашаа явав?\") уншиж, \"Баатар хаашаа эргэсэн бэ?\" гэж асууна.","learner":"- Номыг сонсож баатрын явсан замыг хуруугаараа дагана.\n- \"Баавгай модны хойно нуугдсан\" гэх мэт байршлын үгээр хэлнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Математикийн төв: Байршлын карт дагуу тоглоом байрлуулах.\nХөдөлгөөний төв: Саадтай зам.\nБарилгын төв: \"Амьтны хүрээлэн\" – амьтдыг бие биеийнхээ өмнө, хойно байрлуулах.","learner":"Математикийн төв:\n- Картын сумыг харж тоглоомыг заасан байрлалд тавина.\nХөдөлгөөний төв:\n- Саадтай замаар мөлхөж, гулсаж туулна.\nБарилгын төв:\n- Амьтдыг байрлуулж, \"Үнэг баавгайн хойно байна\" гэж тайлбарлана."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 4 (1). Ажиглалт: Дээврийн мөсөн унжлага, дусал ажиглах\nЗорилго: 2 дугаар сарын сүүлээр нар илчтэй болж, дээврээс дусал дусаж, мөсөн унжлага үүсдгийг ажиглах; аюулгүй байдлыг ойлгох.\nЯвц:\n- Хүүхдүүдийг аюулгүй зайнаас (дээврийн доор биш) мөсөн унжлагыг ажиглуулна.\n- Багшийн мэдээлэл: Өдөр нар илчтэй болоход дээврийн цас хайлж дусал болдог, шөнө хөлдөж мөсөн унжлага болдог. Унжлага унаж гэмтээж болзошгүй тул доор нь зогсохгүй.\n- Асуулт: «Мөсөн унжлага дээвэр дээр байна уу, доор нь байна уу?», «Яагаад дусал дусаж байна вэ?», «Яагаад доор нь зогсож болохгүй вэ?»","learner":"- Аюулгүй зайнаас мөсөн унжлагыг ажиглана.\n- \"Мөсөн унжлага дээврийн доод талд унжиж байна\" гэж байршлын үгээр хэлнэ.\n- Дусал дусахыг ажиглаж \"Нар цасыг хайлуулж байна\" гэж тайлбарлана.\n- \"Унжлагын доор зогсохгүй\" гэсэн дүрмийг давтана."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Багш юу хэлэв?»\nЗорилго: Байршлын үгийг сонсож зөв үйлдэл хийх.\nЯвц:\n1. Багш \"Сандлын ард зогс!\", \"Ширээн дээр гараа тавь!\", \"Найзынхаа өмнө суу!\" гэх мэт тушаал өгнө.\n2. Хүүхдүүд хурдан гүйцэтгэнэ.\n3. Хүүхэд ээлжлэн тушаал өгнө.\nДүрэм: Анхааралтай сонсоно.\nДүгнэлт: Байршлын үгсээ давтана.","learner":"- Тушаалыг сонсож заасан байрлалд хурдан очно.\n- Ээлжээр тушаал өгнө.\n- Байршлын үгсээ (өмнө, хойно, дээр, доор) давтана."}]},"2027-02-19":{"method":"Тоглоомонд суурилсан арга","link":"МАТ3.3а. Тоглоом юмсаас нэг шинжээр 4 хүртэлх хэсэгт ангилж, байрлуулна.","competence":"Нийгэм, сэтгэл хөдлөл (бусадтай ижил төстэйгөө мэдэх), шүүн тунгаах (нэг шинжээр ангилах)","materials":"Сонирхлын зурагт карт (зурах, бөмбөг, ном, дуу, амьтан), хүүхдүүдийн зураг, 4 цагираг, «Бидний адилхан зүйлс» самбар, өнгөт товч","criteria":"Бусадтай сэтгэл хөдлөл, сонирхлоороо ижил төстэйгөө мэддэг. Тоглоом, юмсыг нэг шинжээр 4 хүртэлх хэсэгт ангилж байрлуулдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Чи юу хийх дуртай вэ?\" гэж асууж, ижил хариулттай хүүхдүүдийг гар өргүүлнэ.","learner":"- Мэндчилж тойрогт сууна.\n- Дуртай зүйлээ хэлнэ.\n- Ижил зүйлд дуртай бол гараа өргөж, найзуудаа харна."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Сонирхлоор ангилах: Шалан дээр 4 цагираг тавьж, тус бүрд нэг сонирхлын карт (зурах, бөмбөг, ном, дуу) байрлуулна. Хүүхэд бүр дуртай цагирагтаа орно.\n- Ижил төстэй: \"Нэг цагираг дотор байгаа найзууд юугаараа адилхан бэ?\" гэж асууж, тоолуулна.\n- Ангилах: Өнгөт товчийг өнгөөр нь 4 бүлэгт ангилуулж, \"Хүмүүс ч гэсэн өөр өөр шинжээр ижил байдаг\" гэж холбоно.\nБагшийн чиглүүлэх асуулт:\n1. Чи хэнтэй адилхан зүйлд дуртай вэ?\n2. Аль цагирагт хамгийн олон хүүхэд байна вэ?\n3. Товчийг ямар шинжээр ангилсан бэ?","learner":"Сонирхлоор ангилах:\n- Дуртай сонирхлынхоо цагирагт орж зогсоно.\nИжил төстэй:\n- \"Бид хоёр хоёулаа зурах дуртай\" гэж цагирагтаа байгаа найзтайгаа ижил зүйлээ хэлнэ.\n- Цагираг бүрийн хүүхдүүдийг тоолж, олон, цөөнийг жишнэ.\nАнгилах:\n- Өнгөт товчийг өнгөөр нь 4 бүлэгт ангилж, бүлэг бүрийг тоолно.\n- Ангилсан шинжээ (\"өнгөөр нь\") хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Тоглох үед ижил сонирхолтой хүүхдүүд хамтран тоглож буйг ажиглаж, шинэ найз урихыг дэмжинэ.","learner":"- Ижил сонирхолтой найзтайгаа хамтран тоглоно.\n- Шинэ найзыгаа тоглоомдоо урина."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – гурав дахь уншлага (3): «Гэрээ хайсан бяцхан үнэг» (Төлөвлөгөөний хуудсыг 02.15-ны төлөвлөлтийн дараа үзнэ үү.)\n- Номын үйл явдлыг хүүхдүүдээр түлхүү яриулна.\n- Дүгнэн ярилцах: «Амьтдын гэрийг яагаад эвдэж болохгүй вэ?»\n- Шинэ үгсээр өгүүлбэр зохиох: төөрөх, хонгил, ухах, дагуулах\n- Бүтээл: Гурилан зуурмагаар амьтан барьж, гэрт нь байрлуулах","learner":"- Номын нэр, зохиолч, зураачийг санаж хэлнэ.\n- Номын зургийг харж үлгэрийг өөрийн үгээр ярина.\n- Амьтдын гэрийг хамгаалах шалтгааныг хэлнэ.\n- Шинэ үгсээр өгүүлбэр зохионо.\n- Зуурмагаар амьтан барьж, гэрт нь байрлуулна."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Математикийн төв: Тоглоомыг хэмжээ, өнгө, хэлбэрээр 4 хүртэлх бүлэгт ангилах.\nУрлагийн төв: \"Миний найз бид хоёр\" – адилхан зүйлээ зурах.\nХэл ярианы төв: \"Бид хоёр хоёулаа ...\" өгүүлбэр зохиох.","learner":"Математикийн төв:\n- Тоглоомыг нэг шинжээр ангилж, шинжээ тайлбарлана.\nУрлагийн төв:\n- Найзтайгаа хоёулаа дуртай зүйлээ зурж танилцуулна.\nХэл ярианы төв:\n- Найзтайгаа ижил зүйлээ олж \"Бид хоёр хоёулаа ... -д дуртай\" гэж хэлнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 4 (2). Хөдөлмөрийн үйл ажиллагаа: Цасаар лабиринт зам гаргах\nЗорилго: Хамтран ажиллах, хүрз ашиглах чадварыг сайжруулах.\nХэрэглэгдэхүүн: Жижиг хүрз, тууз, конус\nЯвц:\n- Багш цасан дээр туузаар лабиринтын зураг тэмдэглэнэ.\n- Хүүхдүүд хүрзээр цасыг түрж, тэмдэглэсэн дагуу зам гаргана.\n- Асуулт: «Зам хаана эргэж байна вэ?», «Бидний гаргасан замаар хэн алхах вэ?»","learner":"- Найзуудтайгаа хамтран туузны дагуу цасыг хүрзээр түрнэ.\n- Замын эргэлт, шулуун хэсгийг нэрлэнэ.\n- Гаргасан замаараа алхаж шалгана.\n- Багажаа цэвэрлэж байранд нь тавина."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Надтай адилхан хэн бэ?»\nЗорилго: Бусадтай ижил төстэйгөө мэдэх.\nЯвц:\n1. Багш \"Цэнхэр хувцастай хүүхдүүд үсэр\", \"Нохойд дуртай хүүхдүүд алга таш\" гэх мэт тушаал өгнө.\n2. Тухайн шинжтэй хүүхдүүд хөдөлгөөн хийнэ.\n3. \"Хэн хэнтэй адилхан байсан бэ?\" гэж асууна.\nДүрэм: Үнэнээр хариулна.\nДүгнэлт: Шинээр олсон ижил зүйлээ хуваалцана.","learner":"- Тушаалыг сонсож өөрт тохирох бол хөдөлгөөн хийнэ.\n- Ижил хөдөлгөөн хийсэн найзуудаа нэрлэнэ.\n- Найзтайгаа олсон ижил зүйлээ хэлнэ."}]},"2027-02-22":{"method":"Зохиолд суурилсан арга","link":"МАТ3.4а. Ухаалаг төхөөрөмжийг таньж, хэрэглээ зориулалтаар нь ялгаж нэрлэнэ.","competence":"Өөрийгөө хамгаалах (ухаалаг төхөөрөмжийн эерэг, сөрөг нөлөө), шүүн тунгаах (төхөөрөмжийг зориулалтаар нь ялгах)","materials":"Ухаалаг төхөөрөмжийн зурагт карт (утас, таблет, компьютер, зурагт, ухаалаг цаг), «Сайн – муу» гэсэн 2 самбар, элсэн цаг (15 минут), «Дөлгөөн ба шидэт таблет» зурагт карт","criteria":"Ухаалаг төхөөрөмжийг таньж, зориулалтаар нь ялгаж нэрлэдэг. Хэрэглээний эерэг, сөрөг нөлөөг мэдэж, дэлгэцийн цагийг хязгаарлах зэргээр өөрийгөө хамгаалдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Гэртээ ямар ухаалаг төхөөрөмж байдаг вэ? Чи түүгээр юу хийдэг вэ?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Гэртээ байдаг төхөөрөмжүүдийг нэрлэнэ.\n- \"Би таблетаар хүүхэлдэйн кино үздэг\" гэх мэтээр хэрэглээгээ хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Таних, нэрлэх: Утас, таблет, компьютер, зурагт, ухаалаг цагийн картыг үзүүлж нэрлүүлнэ.\n- Зориулалтаар ангилах: Картыг \"ярих\", \"сурах\", \"тоглох, үзэх\" гэсэн зориулалтаар ангилуулна.\n- Сайн ба муу нөлөө: \"Хүүхэлдэйн кино үзэх, ээжтэйгээ видео дуудлага хийх\" (сайн), \"Удаан харж нүд өвдөх, гадаа тоглохгүй байх\" (муу) гэх нөхцөлийн зургийг 2 самбарт ангилуулна.\n- Элсэн цаг: 15 минутын элсэн цагийг үзүүлж, \"дэлгэцийн цаг\" гэж танилцуулна.\nБагшийн чиглүүлэх асуулт:\n1. Утсаар юу хийж болох вэ?\n2. Таблетаар удаан тоглоход юу болдог вэ?\n3. Дэлгэцийн цаг дуусахад юу хийх вэ?","learner":"Таних, нэрлэх:\n- Карт бүрийн төхөөрөмжийг нэрлэнэ.\nЗориулалтаар ангилах:\n- Картыг \"ярих\", \"сурах\", \"тоглох\" бүлэгт ангилж, сонголтоо тайлбарлана.\nСайн ба муу нөлөө:\n- Нөхцөлийн зургийг харж \"сайн\" эсвэл \"муу\" самбарт байрлуулна.\n- \"Удаан харвал нүд ядардаг\" гэж шалтгааныг хэлнэ.\nЭлсэн цаг:\n- Элсэн цагийн элс урсахыг ажиглаж, \"Элс дуусахад таблетаа унтраана\" гэж хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Дүрт тоглоомын буланд тоглоомон утас, таблет байрлуулж, хүүхдүүд хэрхэн \"хэрэглэж\" буйг ажиглана.","learner":"- Тоглоомон утсаар ээж, аавтайгаа ярих дүр үзүүлнэ.\n- Таблетаар тоглох дүр үзүүлээд элсэн цаг дуусахад унтраана."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – эхний уншлага (1): «Дөлгөөн ба шидэт таблет» (Чанга уншлагын төлөвлөгөөний хуудсыг үзнэ үү.)\n- Номын нэр, хавтас, зохиолч, зураачийг танилцуулж, хэмнэлийг алдагдуулахгүй уншина.\n- Түр зогсож асуух: «Дөлгөөний нүдэнд юу болох бол?»\n- Шинэ үг: «Дэлгэц – гэрэлтдэг нүүр»\n- Уншсаны дараа: «Дөлгөөн яагаад өвдсөн бэ?»","learner":"- Номын хавтсыг харж \"Энэ ном ... тухай байх\" гэж таамаглана.\n- Багшийн уншихыг анхааралтай сонсоно.\n- Түр зогсох үед Дөлгөөнд юу болохыг таамаглана.\n- «Дэлгэц» үгийг давтан хэлж, утгыг нь хэлнэ.\n- \"Таблетаар удаан тоглосон учраас нүд нь өвдсөн\" гэж хариулна."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Математикийн төв: Ухаалаг төхөөрөмжийн картыг хэлбэрээр нь (дөрвөлжин, тэгш өнцөгт, дугуй) ангилах.\nУрлагийн төв: \"Миний дуртай дэлгэцгүй тоглоом\" зураг зурах.\nДүрт тоглоомын төв: \"Эмчийн өрөө\" – нүдний эмч болж зөвлөгөө өгөх.","learner":"Математикийн төв:\n- Төхөөрөмжийн хэлбэрийг нэрлэж ангилна.\nУрлагийн төв:\n- Дэлгэцгүй дуртай тоглоомоо зурж танилцуулна.\nДүрт тоглоомын төв:\n- Эмч болж \"Дэлгэц удаан бүү хар, гадаа тогло\" гэж зөвлөнө."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 4 (3). Хөдөлгөөнт тоглоом: «Лабиринтаар алхъя»\nЗорилго: Чиглэлээ өөрчлөн алхах, гүйх; дохиогоор зогсох.\nЯвц:\n- 02.19-нд гаргасан цасан лабиринтын замаар хүүхдүүдийг цуваа болгон алхуулна.\n- Багш \"Хурдан!\", \"Удаан!\", \"Зогс!\" дохио өгнө.\n- Лабиринтын төгсгөлд хүрсэн хүүхэд бариа дээр туг хатгана.\n- Асуулт: «Хэдэн удаа эргэсэн бэ?», «Замаа хэрхэн олсон бэ?»","learner":"- Цуваагаар лабиринтын замаар алхана.\n- Дохиогоор хурдаа өөрчилж, \"Зогс!\" гэхэд зогсоно.\n- Эргэлт бүрийг тоолж, бариа дээр туг хатгана.\n- Замаа хэрхэн олсноо ярина."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Дэлгэцгүй цаг»\nЗорилго: Дэлгэцгүйгээр хөгжилтэй тоглох аргуудыг олох.\nЯвц:\n1. Багш элсэн цагийг эргүүлнэ.\n2. Хүүхдүүд элс дуустал дэлгэцгүй тоглоом (бөмбөг, шоо, хүүхэлдэй) сонгож тоглоно.\n3. Элс дуусахад \"Ямар тоглоом тоглосон бэ? Хөгжилтэй байсан уу?\" гэж асууна.\nДүрэм: Тоглоомоо хуваалцана.\nДүгнэлт: Гэртээ дэлгэцгүй юу хийхээ хэлнэ.","learner":"- Дэлгэцгүй тоглоом сонгож найзуудтайгаа тоглоно.\n- Элс дуусахад тоглосон тоглоомоо хэлнэ.\n- Гэртээ дэлгэцгүй хийх 2 зүйлээ нэрлэнэ."}]},"2027-02-23":{"method":"Тоглоомонд суурилсан арга","link":"МАТ3.2а. Тоглоом юмсын урт, хүндийг харьцуулж, тайлбарлана.","competence":"Биеийн хөдөлгөөний чадвар (өргөсөн гараас дээш өндөрт үсэрч хүрэх), урт, өндрийг харьцуулах","materials":"Утсанд өлгөсөн хонх, тууз (хүүхэд бүрийн өргөсөн гараас 10-15 см дээш), урт ба богино тууз, хэмжих тууз, дэвсгэр","criteria":"Өргөсөн гараас дээш 10-15 см өндөр зүйлд хоёр хөлөөр түлхэн үсэрч хүрдэг. Тоглоом, юмсын урт, өндрийг харьцуулж тайлбарладаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, биеэ халаах дасгал (хөлийн үзүүр дээр өндийх, сунах, байрандаа үсрэх) хийлгэнэ.","learner":"- Мэндчилж тойрогт зогсоно.\n- Хөлийн үзүүр дээр өндийж гараа дээш сунгана.\n- Байрандаа 5 удаа үсэрч тоолно."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Зааж үзүүлэх: Өвдгөө нугалж, гараа хойш савлаад хоёр хөлөөр түлхэн дээш үсэрч, өлгөсөн хонхонд гараар хүрэхийг үзүүлнэ.\n- Дасгал: Хүүхэд бүрийн өндөрт тохируулж өлгөсөн туузанд 3-5 удаа үсэрч хүрүүлнэ.\n- Харьцуулах: Хүүхдүүдийг хоёр хоёроор зэрэгцүүлж \"Хэн нь өндөр вэ?\", урт, богино туузыг \"Аль нь урт вэ?\" гэж харьцуулуулна.\nБагшийн чиглүүлэх асуулт:\n1. Өндөр үсрэхийн тулд өвдгөө яах вэ?\n2. Хонх чамаас хэр өндөрт байна вэ?\n3. Хэний тууз урт байна вэ?","learner":"Зааж үзүүлэх:\n- Багшийг ажиглаж өвдгөө нугалан, гараа хойш савлана.\nДасгал:\n- Хоёр хөлөөр түлхэн дээш үсэрч, өлгөсөн хонхонд гараар хүрнэ.\n- 3-5 удаа давтаж, хүрсэн тоогоо тоолно.\n- Зөөлөн газардана.\nХарьцуулах:\n- Найзтайгаа нуруу нуруугаа нийлүүлэн зогсоод \"Би өндөр, найз маань намхан\" гэж харьцуулна.\n- Урт, богино туузыг нэг цэгээс эхлүүлэн тавьж харьцуулна."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Хөдөлгөөний буланд өлгөсөн хонх, тууз байрлуулж, бие даан үсэрч хүрэхийг ажиглана.","learner":"- Өлгөсөн туузанд үсэрч хүрэхийг оролдоно.\n- Найзынхаа хүрсэн удааг тоолж өгнө."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Өндөр, намхан амьтдын тухай ном (\"Анааш, хулгана хоёр\") уншиж, харьцуулуулна.","learner":"- Номын зургаас амьтдыг өндрөөр нь харьцуулна.\n- \"Анааш хулганаас өндөр\" гэж өгүүлбэр зохионо."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Математикийн төв: Хэмжих туузаар тоглоом, ширээ, найзынхаа өндрийг харьцуулах.\nХөдөлгөөний төв: Өөр өөр өндөрт өлгөсөн хонхонд үсрэх.\nУрлагийн төв: \"Хэн нь өндөр вэ?\" – өндөр, намхан мод зурах.","learner":"Математикийн төв:\n- Туузаар хэмжиж, урт/богино, өндөр/намхан гэж харьцуулна.\nХөдөлгөөний төв:\n- Намхан хонхноос эхэлж өндөр хонх руу үсрэх оролдлого хийнэ.\nУрлагийн төв:\n- Өндөр, намхан мод зурж ялгааг тайлбарлана."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 4 (4). Ганцаарчилсан үйл ажиллагаа: Өндөрт үсэрч хүрэх\nЗорилго: Дээш үсрэх хөдөлгөөн сул хүүхдүүдтэй ганцаарчлан ажиллах.\nЯвц:\n- Модны намхан мөчирт (эсвэл саваанд) тууз уяж, хүүхдийн гараас 10 см дээш байрлуулна.\n- Хүүхдийг өвдгөө нугалж, гараа савлаад үсэрч хүрэхийг дэмжинэ.\n- Бусад хүүхдүүд лабиринтаар чөлөөтэй тоглоно.","learner":"- Багшийн дэмжлэгтэйгээр туузанд үсэрч хүрнэ.\n- Гараа савлаж, өвдгөө нугалан түлхэнэ.\n- Хүрсэн тоогоо тоолж, амжилтаа хэлнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Хонхыг дуугаргая»\nЗорилго: Дээш үсрэх, ээлжээ хүлээх.\nЯвц:\n1. Өлгөсөн хонхны доор хүүхдүүд цуваа болно.\n2. Хүүхэд бүр үсэрч хонхонд хүрч дуугаргана.\n3. Дуугаргасан хүүхдийг бүгд алга ташина.\nДүрэм: Ээлжээ хүлээнэ; түлхэлцэхгүй.\nДүгнэлт: Хэн хэдэн удаа дуугаргасныг тоолно.","learner":"- Цуваанд ээлжээ хүлээнэ.\n- Үсэрч хонхонд хүрч дуугаргана.\n- Найзаа алга ташиж урамшуулна.\n- Дуугаргасан тоогоо хэлнэ."}]},"2027-02-24":{"method":"Төсөлд суурилсан арга","link":"БНО3.2в. Ойр орчны үйлчилгээний газар (дэлгүүр, эмийн сан, эмнэлэг, номын сан) хүмүүс юу хийдэг, ямар зориулалттайг ялгаж, тухайн газрын дүрмийг баримтална.","competence":"Харилцах (сонирхсон зүйлээ асууж тодруулах), нийгмийн орчны мэдлэг (үйлчилгээний газар)","materials":"Номын сан, эмнэлэг, дэлгүүр, эмийн сангийн зурагт үзүүлэн, мэргэжлийн хувцас, тоглоомон микрофон, асуултын карт (Хэн? Юу? Хаана? Яагаад? Яаж?)","criteria":"Харилцан ярианд сонирхсон зүйлийн талаар асуулт асууж тодруулдаг. Ойр орчны үйлчилгээний газарт хүмүүс юу хийдэг, ямар зориулалттайг ялгаж, тухайн газрын дүрмийг баримталдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Ярианы чулуу\" дамжуулан \"Чи ямар газарт очих дуртай вэ?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Очих дуртай газраа нэрлэнэ.\n- Найзаасаа \"Чи яагаад тэнд очих дуртай вэ?\" гэж асууж тодруулна."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Асуултын карт: Хэн? Юу? Хаана? Яагаад? Яаж? гэсэн картуудыг танилцуулж, асуулт зохиох жишээ үзүүлнэ.\n- \"Мэргэжилтэн зочин\": Багш номын санч, эмч, худалдагчийн дүрд орж, хүүхдүүд асуултын картаар түүнээс асууна.\n- Тодруулах: Хариултыг сонсоод \"Тэгээд ...?\", \"Яагаад ...?\" гэж нэмэлт асуулт асуухыг дэмжинэ.\nБагшийн чиглүүлэх асуулт:\n1. Номын санч юу хийдэг вэ? Түүнээс юу асуумаар байна?\n2. Эмнэлэгт ямар дүрэм баримтлах вэ?\n3. Хариултыг сонсоод өөр юу асууж болох вэ?","learner":"Асуултын карт:\n- Асуултын үгсийг давтан хэлж, карт бүрээр асуулт зохионо.\n\"Мэргэжилтэн зочин\":\n- \"Та номын санд юу хийдэг вэ?\", \"Ном хэрхэн зээлдэг вэ?\" гэх мэт асуулт асууна.\nТодруулах:\n- Хариултыг сонсоод \"Яагаад чимээгүй байх ёстой вэ?\" гэх мэт нэмэлт асуулт асууна.\nАсуултад хариулах:\n- Үйлчилгээний газар бүрийн зориулалт, дүрмийг хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Дүрт тоглоомын буланд \"Номын сан\" орчин бүрдүүлж, хүүхдүүд номын санч, уншигчийн дүрд тоглохыг ажиглана.","learner":"- Номын санч, уншигчийн дүрд тоглоно.\n- \"Энэ ном юуны тухай вэ?\" гэж асууж, номоо \"зээлнэ\".\n- Номын санд чимээгүй байх дүрмийг баримтална."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – хоёр дахь уншлага (2): «Дөлгөөн ба шидэт таблет» (Төлөвлөгөөний хуудсыг 02.22-ны төлөвлөлтийн дараа үзнэ үү.)\n- Номын тухай эргэн сануулах асуулт асууна: «Номын эхэнд Дөлгөөн юунд дуртай байсан бэ?»\n- Түр зогсож асуух: «Чи эмчээс юу асуух байсан бэ?», «Дөлгөөн хуваарьдаа юу бичсэн бэ?»\n- Шинэ үг: «Нүдээ нухлах», «Унтраах», «Сунгаа хийх» – үйлдлээр үзүүлэх\n- Уншсаны дараа: Дүрд тоглох – эмч, Дөлгөөн, ээж – эмчээс асуулт асуух","learner":"- Номын үйл явдлыг эргэн санаж ярина.\n- Эмчээс асуух асуултаа (\"Таблетаар хэдэн минут тоглох вэ?\") зохионо.\n- «Нүдээ нухлах», «Унтраах», «Сунгаа хийх» үгийг үйлдлээр үзүүлнэ.\n- Эмчийн дүрд тоглож асуултад хариулна, эсвэл Дөлгөөний дүрд асууна."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Хэл ярианы төв: \"Сурвалжлагч\" – микрофоноор найзаасаа сонирхсон зүйлээ асуух.\nДүрт тоглоомын төв: \"Эмийн сан\", \"Дэлгүүр\" – худалдагчаас асуулт асуух.\nУрлагийн төв: \"Миний очих дуртай газар\" зураг.","learner":"Хэл ярианы төв:\n- Сурвалжлагч болж 3-аас доошгүй асуулт асууж, хариултыг тодруулна.\nДүрт тоглоомын төв:\n- Худалдагч, эмзүйчээс \"Энэ юу вэ? Хэд вэ?\" гэж асуух дүрд тоглоно.\nУрлагийн төв:\n- Очих дуртай газраа зурж, тэнд хэн ажилладгийг тайлбарлана."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 5 (1). Ажиглалт: Явган хүний гарц, гэрлэн дохио ажиглах\nЗорилго: Цэцэрлэгийн ойролцоох зам, гарц, гэрлэн дохиог ажиглаж, замын хөдөлгөөний дүрмийг бататгах.\nЯвц:\n- Цэцэрлэгийн хашаанаас ойролцоох гэрлэн дохио, явган хүний гарцыг ажиглуулна.\n- Багшийн мэдээлэл: Ногоон гэрэлд явган хүн гардаг, улаан гэрэлд зогсдог. Гарцаар л замыг хөндлөн гарна. Өвөл зам гулгамтгай тул машин хурдан зогсож чаддаггүй.\n- Асуулт: «Гэрлэн дохио ямар өнгөтэй вэ?», «Хүмүүс замыг хаагуур гарч байна вэ?», «Өвөл яагаад илүү болгоомжтой байх ёстой вэ?»","learner":"- Гэрлэн дохионы өнгө солигдохыг ажиглаж нэрлэнэ.\n- Хүмүүс гарцаар гарч байгааг ажиглана.\n- Багшаас \"Гэрлэн дохиог хэн асаадаг вэ?\" гэх мэт сонирхсон зүйлээ асууна.\n- \"Улаан гэрэлд зогсоно, ногоонд гарна\" гэж дүрмийг давтана."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Асуулт асуу»\nЗорилго: Сонирхсон зүйлээ асууж тодруулах.\nЯвц:\n1. Багш уутанд нэг зүйл нууна.\n2. Хүүхдүүд \"Энэ ямар өнгөтэй вэ?\", \"Хэнд хэрэгтэй вэ?\" гэх мэт асуулт асууж таана.\n3. Багш зөвхөн \"Тийм\" эсвэл \"Үгүй\" гэж хариулна.\nДүрэм: Ээлжээр асууна.\nДүгнэлт: Ямар асуулт хамгийн их тусалсныг ярилцана.","learner":"- Уутанд юу байгааг тодруулах асуулт асууна.\n- Багшийн хариултыг сонсож дараагийн асуултаа зохионо.\n- Зүйлийг таана.\n- Хамгийн тус болсон асуултаа хэлнэ."}]},"2027-02-25":{"method":"Бүтээлч үйл ажиллагаанд суурилсан арга","link":"МАТ3.4б. Зурган зааварчилгааг ажиглан, дарааллын дагуу дуурайж хийнэ.","competence":"Бүтээлчээр сэтгэх (нугалах, эвхэх, хайчлах аргаар бүтээл хийх), зурган зааварчилгааг дагах","materials":"Цаасан эвхмэлийн зурган зааварчилгаа (гэр, үнэг, хун – 4-5 алхамтай), дөрвөлжин өнгийн цаас, хүүхдийн хайч, цавуу, картон","criteria":"Нугалах, эвхэх, хайчлах аргаар хавтгай болон биет наамлын бүтээл урладаг. Зурган зааварчилгааг ажиглан дарааллын дагуу дуурайж хийдэг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, урьд нь хийсэн эвхмэл бүтээлүүдийг үзүүлэн \"Эдгээрийг юугаар, яаж хийсэн бэ?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Бүтээлүүдийг харж \"цаасаар нугалж хийсэн\" гэж хэлнэ.\n- Өөрөө хийж байсан эвхмэлээ нэрлэнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Зурган зааварчилгаа: \"Монгол гэр\" эвхмэлийн 5 алхамтай зааврыг үзүүлж, алхам бүрийг дугаараар нь тоолуулна.\n- Дуурайж хийх: Алхам бүрийг хамтдаа хийнэ: 1) дөрвөлжинг хагаслан нугална 2) дээд хоёр буланг доош эвхэж дээвэр гаргана 3) доод хэсгийг дээш эвхэнэ 4) хаалганы хэсгийг хайчилна 5) хээгээр чимэглэнэ.\n- Биет бүтээл: Хийсэн гэрүүдээ картон дээр нааж \"Монгол гэрийн хороолол\" бүтээнэ.\nБагшийн чиглүүлэх асуулт:\n1. Аль алхамыг одоо хийх вэ?\n2. Хайчаа яаж барих вэ?\n3. Таны гэр зурагтай адилхан болсон уу?","learner":"Зурган зааварчилгаа:\n- Зааврын алхмуудыг тоолж, алхам бүрт юу хийхийг хэлнэ.\nДуурайж хийх:\n- 1-р алхам: цаасаа хагаслан нугална.\n- 2-р алхам: дээд булангуудыг эвхэж дээвэр гаргана.\n- 3-р алхам: доод хэсгийг дээш эвхэнэ.\n- 4-р алхам: хайчаар хаалга хайчилна.\n- 5-р алхам: хээгээр чимэглэнэ.\nБиет бүтээл:\n- Гэрээ картон дээр нааж, найзуудынхаа гэртэй хамт хороолол бүтээнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Урлагийн буланд өнгийн цаас, зааврууд байрлуулж, хүүхдүүд бие даан заавар дагаж буйг ажиглана.","learner":"- Сонгосон зааврын дагуу эвхмэл хийнэ.\n- Чадахгүй алхамдаа найзаасаа тусламж хүснэ."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Зурган зааварчилгаатай ном (\"Цаасан амьтад\") үзүүлж, хуудас бүрийн алхмыг хүүхдүүдээр тайлбарлуулна.","learner":"- Номын зургаас алхам бүрийг дарааллаар нь тайлбарлана.\n- \"Эхлээд нугална, дараа нь эвхэнэ, эцэст нь чимэглэнэ\" гэж хэлнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: Үнэг, хуны эвхмэлийн заавар.\nБарилгын төв: Зурган заавраар шоогоор гэр барих.\nМатематикийн төв: Зурган заавраар сувс хэлхэх.","learner":"Урлагийн төв:\n- Зааврын дагуу үнэг эсвэл хун эвхэнэ.\nБарилгын төв:\n- Зурган заавраас харж шоогоор гэр барина.\nМатематикийн төв:\n- Зааврын дарааллаар сувс хэлхэнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 5 (2). Хөдөлмөрийн үйл ажиллагаа: Талбайн хогийг ангилж цуглуулах\nЗорилго: Орчноо цэвэр байлгах, хогийг ангилах дадал төлөвшүүлэх.\nХэрэглэгдэхүүн: Бээлий, жижиг уут (цаас, хуванцар), хог түүгч хавчаар\nЯвц:\n- Хүүхдүүдэд бээлий, жижиг уут өгч, талбайн хогийг цуглуулна.\n- Цуглуулсан хогийг цаас, хуванцар гэж ангилна.\n- Асуулт: «Ямар хог хамгийн их байсан бэ?», «Талбай цэвэр болоход ямар санагдаж байна?»","learner":"- Бээлийгээ өмсөж талбайн хогийг хавчаараар түүнэ.\n- Хогийг цаас, хуванцар гэж ангилж тохирох уутанд хийнэ.\n- Аль төрлийн хог олон байсныг тоолж хэлнэ.\n- Ажлаа дуусгаад гараа угаана."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Надтай адилхан хийгээрэй»\nЗорилго: Ажигласан хөдөлгөөнийг дарааллаар нь дуурайх.\nЯвц:\n1. Багш 3 хөдөлгөөнийг дараалан үзүүлнэ.\n2. Хүүхдүүд яг ижил дарааллаар давтана.\n3. Хүүхэд ээлжлэн дараалал зохиож үзүүлнэ.\nДүрэм: Дарааллыг алдагдуулахгүй.\nДүгнэлт: Өнөөдөр эвхсэн бүтээлээ ярилцана.","learner":"- Багшийн 3 хөдөлгөөнийг ажиглана.\n- Ижил дарааллаар давтана.\n- Өөрөө дараалал зохиож үзүүлнэ.\n- Өнөөдөр эвхсэн бүтээлээ нэрлэнэ."}]},"2027-02-26":{"method":"Төсөлд суурилсан арга","link":"ЗУ3.2е. Тоглоом болон байгалийн материал, дахин ашиглах материалаас сонгож хүрээлэн буй орчноо бүтээнэ.","competence":"Байгаль орчинд ээлтэй дадал (хог ангилах, ус хэмнэх), бүтээлчээр сэтгэх (дахин ашиглах материалаар бүтээл хийх)","materials":"Цэнхэр, шар, ногоон хогийн сав, цэвэр хог хаягдал, хуванцар сав, тагнууд, картон хайрцаг, ороосон цаасны цилиндр, цавуу, будаг, «Дөлгөөн ба шидэт таблет» зурагт карт","criteria":"Орчны эд зүйлсийг зориулалтын дагуу ашиглаж, ус хэмнэх, хог хаягдлыг ялгаж хаях үйлийг бие даан хийдэг. Дахин ашиглах материалаас сонгож бүтээл урладаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, өчигдөр цуглуулсан хогоо үзүүлэн \"Үүнийг юу хийх вэ?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Цуглуулсан хогоо нэрлэнэ.\n- \"Ангилж хаяна\", \"Дахин ашиглана\" гэж санаагаа хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Хог ангилах: Гурван өнгийн савыг сануулж (цэнхэр – цаас, шар – хуванцар, ногоон – хүнсний хаягдал), хог хаягдлыг ангилуулна.\n- Ус хэмнэх: Гар угаахдаа цоргоо хааж саван түрхэх, аяганд ус авч шүдээ угаах дадлыг ярилцаж үзүүлнэ.\n- Дахин ашиглах: Хуванцар сав, хайрцаг, цилиндрээр \"Хаврын шувууны байшин\", \"Хотын машин\" зэрэг бүтээл хийх санааг гаргуулж бүтээлгэнэ.\nБагшийн чиглүүлэх асуулт:\n1. Хуванцар савыг аль саванд хийх вэ?\n2. Усаа хэмнэхийн тулд юу хийх вэ?\n3. Хаягдал материалаар юу хийж болох вэ?","learner":"Хог ангилах:\n- Хог бүрийг нэрлэж, тохирох өнгөтэй саванд хийнэ.\nУс хэмнэх:\n- Гар угаахдаа цоргоо хааж саван түрхэхийг үзүүлнэ.\n- \"Ус хэмнэвэл ... болно\" гэж хэлнэ.\nДахин ашиглах:\n- Бүтээх зүйлээ сонгож, материалаа цуглуулна.\n- Хайчилж, нааж, будаж бүтээлээ хийнэ.\n- Бүтээлээ найздаа танилцуулна."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Барилгын буланд хайрцаг, цилиндр байрлуулж, хүүхдүүдийн бүтээлч тоглоомыг ажиглана.","learner":"- Хайрцаг, цилиндрээр барилга барина.\n- Найзтайгаа хамтран санаагаа хэрэгжүүлнэ."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – гурав дахь уншлага (3): «Дөлгөөн ба шидэт таблет» (Төлөвлөгөөний хуудсыг 02.22-ны төлөвлөлтийн дараа үзнэ үү.)\n- Номын үйл явдлыг хүүхдүүдээр түлхүү яриулна.\n- Дүгнэн ярилцах: «Ухаалаг төхөөрөмжийг яаж зөв хэрэглэх вэ?»\n- Шинэ үгсээр өгүүлбэр зохиох: дэлгэц, ядрах, зөвлөх, унтраах, хуваарь\n- Бүтээл: «Миний өдрийн хуваарь» – дэлгэцийн цагийг зургаар тэмдэглэх","learner":"- Номын нэр, зохиолч, зураачийг санаж хэлнэ.\n- Номын зургийг харж Дөлгөөний түүхийг өөрийн үгээр ярина.\n- Ухаалаг төхөөрөмжийг зөв хэрэглэх 2 дүрмийг хэлнэ.\n- Шинэ үгсээр өгүүлбэр зохионо.\n- Өдрийн хуваарьдаа тоглох, унших, гадаа гарах, дэлгэцийн цагийг зурж тэмдэглэнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Байгаль шинжлэлийн төв: Хог хаягдлыг материалаар нь ангилах.\nУрлагийн төв: Хуванцар таг, савнаас хээ, тоглоом хийх.\nМатематикийн төв: Тагнуудыг өнгөөр нь 4 бүлэгт ангилж тоолох.","learner":"Байгаль шинжлэлийн төв:\n- Хогийг цаас, хуванцар, шил гэж ангилж нэрлэнэ.\nУрлагийн төв:\n- Тагнуудаар хээ, тоглоом бүтээнэ.\nМатематикийн төв:\n- Тагнуудыг өнгөөр нь ангилж, бүлэг бүрийг тоолно."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалгын давтлага: Сарын хөдөлгөөнт тоглоомууд\nЗорилго: Сарын турш тоглосон хөдөлгөөнт тоглоомуудыг давтах, хүүхдүүдийн сонголтыг хүндэтгэх.\nЯвц:\n- Хүүхдүүдээр «Морь уралдаан», «Чоно ба ишиг», «Тарвага нүхэндээ», «Лабиринтаар алхъя» тоглоомоос сонгуулна.\n- Хамгийн олон санал авсан 2 тоглоомыг тоглоно.\n- Асуулт: «Аль тоглоом хамгийн их таалагдсан бэ? Яагаад?»","learner":"- Дуртай тоглоомоо сонгож санал өгнө.\n- Тоглоомын дүрмийг санаж тоглоно.\n- Таалагдсан тоглоомоо шалтгаантай нь хэлнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Хог ангилагч баатрууд»\nЗорилго: Хог хаягдлыг хурдан ангилах, багаар ажиллах.\nЯвц:\n1. Хүүхдүүдийг 3 багт хуваана (цаас, хуванцар, хүнсний хаягдал).\n2. Шалан дээр тараасан хогийн загвараас баг бүр өөрийн төрлийг цуглуулна.\n3. Цуглуулсан хогоо тоолно.\nДүрэм: Зөвхөн өөрийн төрлийг цуглуулна; түлхэлцэхгүй.\nДүгнэлт: Сарын турш юу сурснаа хамтдаа санана.","learner":"- Багийнхаа төрлийн хогийг цуглуулна.\n- Цуглуулснаа тоолж харьцуулна.\n- Сарын турш сурсан зүйлээ хуваалцана."}]}},"readings":[{"days":"02.01 (1-р уншлага), 02.03 (2-р уншлага), 02.05 (3-р уншлага)","book":"Өвөөгийн шагай","author":"Багшийн бэлтгэсэн өгүүлэг. Зураг: багшийн бэлтгэсэн зурагт карт (6 хуудас)","goals":"- Үгсийн сан болон ерөнхий мэдлэгийг тэлэх\n- Харилцан ярилцах, хүүрнэн өгүүлэх чадварыг хөгжүүлэх\n- Сонсож ойлгох чадварыг хөгжүүлэх\n- Сэтгэн бодох үйлийг чиглүүлэн дэмжих\n- Гэр бүлийн орчинд Цагаан сарыг хэрхэн тэмдэглэдэг талаар өөрийн үгээр тайлбарлах (Байгаль, нийгмийн орчин)\n- Ардын тоглоом, наадгайгаар хамтран наадах (Хөдөлгөөн, эрүүл мэнд)\n- Шагайг морь, тэмээ, хонь, ямаа гэж ангилж тоолох (Математик)","summary":"Цагаан сарын шинийн нэгэнд Тэмүүлэн өвөө, эмээдээ золгохоор очно. Ах дүү нар нь утсаараа тоглоод сууж байхад өвөө нь улаан даавуун уутнаас шагай гаргаж ирнэ. Өвөө нь шагайн морь, тэмээ, хонь, ямаа гэсэн 4 талыг зааж, «Морь уралдуулах» тоглоомыг заана. Бүгд хамтдаа тоглож инээлдэнэ. Тэмүүлэн морио түрүүлүүлж чадахгүй ч дахин оролдоно. Өвөө нь шагайгаа Тэмүүлэнд бэлэглэж, «Энэ бол манай удмын тоглоом» гэнэ.","words":[["Шагай – хонины шилбэний яс, монгол тоглоом","Удам – өвөг дээдсээс уламжилсан гэр бүл (х. 6)","Харвах – шагайг хуруугаар цохиж явуулах (х. 4, үйлдлээр үзүүлэх)"],["Золгох – цагаан сараар ахмадтай мэндлэх","Уут – юм хийдэг даавуун сав (х. 2)","Хаях – шагайг гараас газарт шидэх (х. 3, үйлдлээр үзүүлэх)"],["Наадам, наадгай – ардын тоглоом","Түрүүлэх – хамгийн түрүүнд хүрэх (х. 4)","Бэлэглэх – юм өгч баярлуулах (х. 6, хосоороо үзүүлэх)"]],"r1":{"Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Өвөө нь уутнаас юу гаргах бол?» (хуудас 2)\n«Шагай хаяхад ямар тал буух бол?» (хуудас 3)\n«Тэмүүлэнгийн морь түрүүлэх болов уу?» (хуудас 4)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Уут – юм хийдэг даавуун сав» (хуудас 2)\n«Түрүүлэх – хамгийн түрүүнд хүрэх» (хуудас 4)\n«Удам – өвөг дээдсээс уламжилсан гэр бүл» (хуудас 6)","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Шагай хэдэн талтай вэ? Нэрлэж тоолоорой.»\n«Цагаан сараар Тэмүүлэнгийнх юу хийсэн бэ?»\nХүүхэд бүр шагайн аль талд дуртайгаа хэлэх."},"r2":{"Номын тухай эргэн санах: Эхлэл, өрнөл, төгсгөл хэсгүүдтэй холбоотой энгийн асуултууд асуух":"«Номд Тэмүүлэн хаашаа очсон бэ?»\n«Өвөө нь ямар тоглоом зааж өгсөн бэ?»\n«Ном хэрхэн төгссөн бэ?»","Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Ах дүү нар нь эхлээд юу хийж байсан бэ?» (хуудас 1)\n«Морь, тэмээ, хонь, ямаа – аль нь хамгийн олон буусан бэ? Тоолоорой.» (хуудас 3)\n«Тэмүүлэн ялагдахад юу хийсэн бэ?» (хуудас 5)\n«Өвөө нь яагаад шагайгаа бэлэглэсэн бэ?» (хуудас 6)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Хаях» (хуудас 3) шагайгаар үзүүлэх\n«Харвах» (хуудас 4) хуруугаар үзүүлэх\n«Бэлэглэх» (хуудас 6) хосоороо үзүүлэх","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Утсаар тоглох, шагай тоглох хоёрын аль нь илүү хөгжилтэй вэ? Яагаад?»\nШагайгаар «Морь уралдуулах» тоглох.\nШагайн 4 талыг ангилж тоолох."},"r3":{"Уншихын өмнө":"Энэ номыг бид хамтдаа 2 удаа уншчихсан учраас номын нэрийг та нар мэдэж байгаа шүү дээ. Энэ номын нэр юу билээ? гэх зэргээр хүүхдийг эхнээс нь татан оролцуулна.\nНомын зургуудыг тогтон харуулж ярилцана.\n- Шагай гэж юу вэ?\n- Цагаан сараар өвөө, эмээ нартайгаа юу хийдэг вэ?","Уншиж байхдаа":"Зургийг заан юу болж байгаа тухай асууна: «Энд өвөө юу зааж байна?», «Тэмүүлэн ямар сэтгэлтэй байна?», «Дараа нь юу болох вэ?» Учир шалтгааныг холбон тайлбарлахыг дэмжинэ: «Хүүхдүүд яагаад утсаа тавиад шагай тоглосон бэ?»","Уншиж дуусаад":"- Дүгнэн ярилцах: «Ардын тоглоом яагаад сайхан бэ?»\n- Шинэ сурсан үгсээр өгүүлбэр зохиолгох: шагай, харвах, түрүүлэх, удам, бэлэглэх\n- Бүтээл: Шагайн 4 талыг зурж будах, өөрийн «шагайн уут» хээгээр чимэглэх"},"text":"Хуудас 1. Шинийн нэгний өглөө Тэмүүлэн ээж, аав, ах дүү нартайгаа өвөө, эмээдээ золгохоор очив. Золгосны дараа ах дүү нар нь утсаараа тоглоод сууцгаалаа.\nХуудас 2. Өвөө нь шүүгээнээс улаан даавуун уут гаргаж ирээд «Хүүхдүүд ээ, ирээрэй. Би та нарт гоё юм үзүүлье» гэв. Уутанд олон шагай байлаа.\nХуудас 3. Өвөө нь шагай хаяад «Энэ морь, энэ тэмээ, энэ хонь, энэ ямаа» гэж заажээ. Хүүхдүүд утсаа тавиад шагайг тойрон суув.\nХуудас 4. Тэд «Морь уралдуулах» тоглоом тоглов. Хүн бүр морьдоо харваж, хэн нь түрүүлэхийг харцгаав. Эгч нь түрүүлж, бүгд алга ташлаа.\nХуудас 5. Тэмүүлэнгийн морь хамгийн сүүлд ирлээ. Тэр бага зэрэг гунигласан ч «Дахиад оролдоё» гээд дахин харвасаар байв.\nХуудас 6. Орой болоход өвөө нь шагайтай уутаа Тэмүүлэнд өгөөд «Энэ бол манай удмын тоглоом. Чи ч бас хүүхдүүддээ заагаарай» гэжээ. Тэмүүлэн маш их баярлав."},{"days":"02.09 (1-р уншлага), 02.10 (2-р уншлага), 02.12 (3-р уншлага)","book":"Бамбаруушийн нулимс","author":"Багшийн бэлтгэсэн өгүүлэг. Зураг: багшийн бэлтгэсэн зурагт карт (6 хуудас)","goals":"- Үгсийн сан болон ерөнхий мэдлэгийг тэлэх\n- Харилцан ярилцах, хүүрнэн өгүүлэх чадварыг хөгжүүлэх\n- Сонсож ойлгох чадварыг хөгжүүлэх\n- Сэтгэн бодох үйлийг чиглүүлэн дэмжих\n- Өөрийн болон бусдын сэтгэл хөдлөлийн таатай, таагүй байгааг илэрхийлэх, тайлбарлах (Нийгэм-сэтгэл хөдлөл)\n- Номын зургаас үйл явдлыг ойлгож ярих (Хэл яриа)\n- Үлгэрийн дүрийн онцлогийг хөдөлгөөн, дуу хоолойгоор илэрхийлж тоглох (Хөгжим)","summary":"Ойн амьтад хамтдаа тоглохоор цуглахад бамбарууш түрүүлж гүйхдээ туулайн цасан байшинг нураачихна. Туулай уйлж, бусад нь бамбарууштай тоглохоо болино. Бамбарууш ганцаараа үлдэж нулимс унагана. Хэрэм түүний гунигтай байгааг анзаарч учрыг асууна. Бамбарууш туулайгаас уучлалт гуйж, хамтдаа шинэ цасан байшин барина. Бүгд дахин баяртай тоглоно.","words":[["Бамбарууш – баавгайн зулзага","Нураах – унагаж эвдэх (х. 2)","Нулимс унагах – уйлах (х. 3, нүүрээрээ үзүүлэх)"],["Сэтгэл хөдлөл – баярлах, гунигтай байх, уурлах","Анзаарах – ажиглаж мэдэх (х. 4)","Тэврэх (х. 5, хосоороо үзүүлэх)"],["Хэрэм – урт сэвсгэр сүүлтэй жижиг амьтан (зураг дээр заах)","Уучлалт гуйх – «Уучлаарай» гэх (х. 5)","Бөхийх (х. 5, биеэр үзүүлэх)"]],"r1":{"Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Туулай яагаад уйлсан бэ?» (хуудас 2)\n«Бамбарууш ганцаараа ямар санагдаж байгаа бол?» (хуудас 3)\n«Бамбарууш одоо юу хийх бол?» (хуудас 5)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Нураах – унагаж эвдэх» (хуудас 2)\n«Анзаарах – ажиглаж мэдэх» (хуудас 4)\n«Уучлалт гуйх – «Уучлаарай» гэх» (хуудас 5)","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Бамбарууш яагаад гунигтай болсон бэ?»\n«Хэрэм яаж тусалсан бэ?»\nХүүхэд бүр сэтгэл хөдлөлийн картаас дүрүүдийн сэтгэлийг сонгох."},"r2":{"Номын тухай эргэн санах: Эхлэл, өрнөл, төгсгөл хэсгүүдтэй холбоотой энгийн асуултууд асуух":"«Номын эхэнд амьтад юу хийхээр цугларсан бэ?»\n«Дараа нь юу болсон бэ?»\n«Ном хэрхэн төгссөн бэ?»","Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Зураг дээр туулайн нүүр ямар байна вэ?» (хуудас 2)\n«Бусад амьтад яагаад бамбарууштай тоглохгүй болсон бэ?» (хуудас 3)\n«Хэрэм юуг анзаарсан бэ?» (хуудас 4)\n«Туулай уучлалт сонсоод ямар болсон бэ?» (хуудас 5)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Нулимс унагах» (хуудас 3) нүүрээрээ үзүүлэх\n«Бөхийх» (хуудас 5) биеэр үзүүлэх\n«Тэврэх» (хуудас 5) хосоороо үзүүлэх","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Хэрвээ чи хэрэм байсан бол бамбаруушид юу гэж хэлэх байсан бэ?»\nДүрд тоглох: бамбарууш, туулай, хэрэм – дүр бүрийн хөдөлгөөн, дуу хоолойг дуурайх.\nНомын 4 зургийг харж үйл явдлыг өөрийн үгээр ярих."},"r3":{"Уншихын өмнө":"Энэ номыг бид хамтдаа 2 удаа уншчихсан учраас номын нэрийг та нар мэдэж байгаа шүү дээ. Энэ номын нэр юу билээ? гэх зэргээр хүүхдийг эхнээс нь татан оролцуулна.\nНомын зургуудыг тогтон харуулж ярилцана.\n- Бамбарууш ямар сэтгэлтэй байсан бэ?\n- Найзаа гомдоосон бол юу хийх вэ?","Уншиж байхдаа":"Зургийг заан юу болж байгаа тухай асууна: «Энд хэн ямар сэтгэлтэй байна?», «Тэр юу хийж байна?», «Дараа нь юу болох вэ?» Учир шалтгааныг холбон тайлбарлахыг дэмжинэ: «Амьтад яагаад дахин баярласан бэ?»","Уншиж дуусаад":"- Дүгнэн ярилцах: «Уучлалт гуйх нь яагаад чухал вэ?»\n- Шинэ сурсан үгсээр өгүүлбэр зохиолгох: нураах, анзаарах, уучлалт гуйх, нулимс унагах\n- Бүтээл: Бамбарууш, туулай, хэрмийн хуруун хүүхэлдэй хийж, үлгэрийг тоглох"},"text":"Хуудас 1. Ойн захын цастай талбайд туулай, хэрэм, үнэг, бамбарууш хамтдаа тоглохоор цуглажээ. Туулай өглөөжингөө цасан байшин барьсан байв.\nХуудас 2. Бамбарууш «Би түрүүлнэ!» гээд хурдан гүйж, туулайн цасан байшинг мөргөж нураачихав. Туулай уйлж эхэллээ.\nХуудас 3. Бусад амьтад «Бамбарууш, чи болгоомжгүй юм» гээд түүнтэй тоглохоо болив. Бамбарууш ганцаараа хожуул дээр суугаад нулимс унагав.\nХуудас 4. Хэрэм бамбаруушийн гунигтай байгааг анзаарч, дэргэд нь очоод «Чи яагаад уйлж байгаа юм бэ?» гэж асуув. Бамбарууш болсон явдлыг ярьжээ.\nХуудас 5. Хэрэм «Туулайгаас уучлалт гуйгаад, хамтдаа байшингаа дахин барья» гэв. Бамбарууш туулай дээр очоод бөхийн «Уучлаарай» гэхэд туулай түүнийг тэврэв.\nХуудас 6. Тэд бүгд хамтдаа өмнөхөөсөө ч том цасан байшин барьжээ. Бамбарууш «Найзууд минь, баярлалаа» гээд инээмсэглэв."},{"days":"02.15 (1-р уншлага), 02.17 (2-р уншлага), 02.19 (3-р уншлага)","book":"Гэрээ хайсан бяцхан үнэг","author":"Багшийн бэлтгэсэн өгүүлэг. Зураг: багшийн бэлтгэсэн зурагт карт (6 хуудас)","goals":"- Үгсийн сан болон ерөнхий мэдлэгийг тэлэх\n- Харилцан ярилцах, хүүрнэн өгүүлэх чадварыг хөгжүүлэх\n- Сонсож ойлгох чадварыг хөгжүүлэх\n- Сэтгэн бодох үйлийг чиглүүлэн дэмжих\n- Амьтдын амьдрах орчныг ялган таньж, тэднийг хамгаалах аргыг нэрлэх (Байгаль, нийгмийн орчин)\n- Бусдын таагүй сэтгэлийн шалтгааныг ойлгож энэрэх (Нийгэм-сэтгэл хөдлөл)\n- Үйл явдлын эхлэл, өрнөл, төгсгөлийг дарааллаар ярих (Хэл яриа)","summary":"Цасан шуурганд бяцхан үнэг ээжээсээ төөрч, гэрээ хайна. Тэр хэрэмнээс асуухад хэрэм модны хонгилд, загаснаас асуухад загас мөсөн доорх усанд, тарвагаас асуухад тарвага газар доорх нүхэнд амьдардгаа хэлнэ. Үнэг гунигтай байхад шаазгай «Үнэг ойн захын нүхэнд амьдардаг» гэж туслана. Шаазгай үнэгийг дагуулж, ээжтэй нь уулзуулна.","words":[["Үүр, нүх, хонгил – амьтдын гэр","Төөрөх – замаа олохгүй болох (х. 1)","Шуурах – салхитай цас хийсэх (х. 1, гараараа үзүүлэх)"],["Ой, гол, тал – амьтдын амьдрах орчин","Хонгил – модны хөндий (х. 2)","Ухах – газар малтах (х. 4, үйлдлээр үзүүлэх)"],["Тарвага, хэрэм, шаазгай, загас","Зам заах – хаашаа явахыг хэлж өгөх (х. 5)","Дагуулах – араасаа дагуулж явах (х. 6, хосоороо үзүүлэх)"]],"r1":{"Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Бяцхан үнэг хаана амьдардаг бол?» (хуудас 2)\n«Загасны гэр хаана байх бол?» (хуудас 3)\n«Хэн үнэгэнд туслах бол?» (хуудас 5)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Төөрөх – замаа олохгүй болох» (хуудас 1)\n«Хонгил – модны хөндий» (хуудас 2)\n«Зам заах – хаашаа явахыг хэлж өгөх» (хуудас 5)","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Хэн хаана амьдардаг вэ? Дарааллаар нь хэлээрэй.»\n«Бяцхан үнэг яагаад гунигтай байсан бэ?»\nАмьтдын зургийг гэрийнх нь зурагтай тааруулах."},"r2":{"Номын тухай эргэн санах: Эхлэл, өрнөл, төгсгөл хэсгүүдтэй холбоотой энгийн асуултууд асуух":"«Номын эхэнд юу болсон бэ?»\n«Үнэг хэнээс хэнээс асуусан бэ?»\n«Эцэст нь юу болсон бэ?»","Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Хэрэм өвөл хонгилдоо юу иддэг вэ?» (хуудас 2)\n«Загас яагаад хөлддөггүй вэ?» (хуудас 3)\n«Тарвага өвөл юу хийдэг вэ?» (хуудас 4)\n«Шаазгай яагаад үнэгэнд тусалсан бэ?» (хуудас 5)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Шуурах» (хуудас 1) гараараа үзүүлэх\n«Ухах» (хуудас 4) үйлдлээр үзүүлэх\n«Дагуулах» (хуудас 6) хосоороо үзүүлэх","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Ойн амьтдын гэрийг хамгаалахын тулд бид юу хийх вэ?»\nДүрд тоглох: төөрсөн үнэг амьтдаас асуух.\nҮлгэрийн зургийг эхлэл, өрнөл, төгсгөлөөр дараалуулах."},"r3":{"Уншихын өмнө":"Энэ номыг бид хамтдаа 2 удаа уншчихсан учраас номын нэрийг та нар мэдэж байгаа шүү дээ. Энэ номын нэр юу билээ? гэх зэргээр хүүхдийг эхнээс нь татан оролцуулна.\nНомын зургуудыг тогтон харуулж ярилцана.\n- Амьтад хаана амьдардаг вэ?\n- Төөрсөн хүнд яаж туслах вэ?","Уншиж байхдаа":"Зургийг заан юу болж байгаа тухай асууна: «Энд үнэг хэнтэй уулзаж байна?», «Тэр амьтан хаана амьдардаг вэ?», «Дараа нь юу болох вэ?» Учир шалтгааныг холбон тайлбарлахыг дэмжинэ: «Үнэг яагаад баярласан бэ?»","Уншиж дуусаад":"- Дүгнэн ярилцах: «Амьтдын гэрийг яагаад эвдэж болохгүй вэ?»\n- Шинэ сурсан үгсээр өгүүлбэр зохиолгох: төөрөх, хонгил, ухах, дагуулах\n- Бүтээл: Гурилан зуурмагаар амьтан барьж, гэрт нь байрлуулах"},"text":"Хуудас 1. Нэгэн өдөр хүчтэй цасан шуурга болж, бяцхан үнэг ээжээсээ төөрчихөв. «Миний гэр хаана байна?» гээд тэр гүйсээр ой руу орлоо.\nХуудас 2. Модон дээр хэрэм суугаа харагдав. «Хэрэм ээ, миний гэр чинийхтэй адилхан уу?» Хэрэм «Үгүй ээ, би модны хонгилд самраа хураагаад амьдардаг» гэв.\nХуудас 3. Үнэг голын мөсөн дээр гарахад мөсний цоорхойгоор загас харагдав. «Би мөсөн доорх усанд амьдардаг. Чи усанд амьсгалж чадахгүй» гэж загас хэлэв.\nХуудас 4. Талд гараад үнэг тарвагын нүхийг олов. Тарвага «Би өвөлдөө газар доорх нүхэндээ унтдаг. Энэ чиний гэр биш» гэжээ. Үнэг гунигтай болов.\nХуудас 5. Модон дээрээс шаазгай нисэж ирээд «Битгий гуниглаарай. Үнэгнүүд ойн захын нүхэнд амьдардаг. Би чамд зам заая» гэв.\nХуудас 6. Шаазгай нисэж, үнэг араас нь дагасаар ойн захын нүхэнд хүрэв. Ээж нь үнэгээ тэвэрч, бяцхан үнэг шаазгайд «Баярлалаа» гэжээ."},{"days":"02.22 (1-р уншлага), 02.24 (2-р уншлага), 02.26 (3-р уншлага)","book":"Дөлгөөн ба шидэт таблет","author":"Багшийн бэлтгэсэн өгүүлэг. Зураг: багшийн бэлтгэсэн зурагт карт (6 хуудас)","goals":"- Үгсийн сан болон ерөнхий мэдлэгийг тэлэх\n- Харилцан ярилцах, хүүрнэн өгүүлэх чадварыг хөгжүүлэх\n- Сонсож ойлгох чадварыг хөгжүүлэх\n- Сэтгэн бодох үйлийг чиглүүлэн дэмжих\n- Ухаалаг төхөөрөмжийг таньж, зориулалтаар нь ялгаж нэрлэх (Математик)\n- Ухаалаг төхөөрөмжийн хэрэглээний эерэг, сөрөг нөлөөг мэдэж, өөрийгөө хамгаалах (Хөдөлгөөн, эрүүл мэнд)\n- Харилцан ярианд сонирхсон зүйлийн талаар асууж тодруулах (Хэл яриа)","summary":"Дөлгөөн таблетаар тоглох маш дуртай. Тэр өглөө, өдөр, орой ч таблетаа тавихгүй. Нэг өдөр нүд нь өвдөж, толгой нь эргэнэ. Ээж нь түүнийг эмчид үзүүлэхэд эмч «Дэлгэц удаан харвал нүд ядардаг. Өдөрт богино хугацаанд ашиглаж, гадаа тоглоорой» гэж зөвлөнө. Дөлгөөн цагийн хуваарь гаргаж, таблетаар зөвхөн 15 минут тоглож, үлдсэн цагт найзуудтайгаа гадаа тоглож, ном уншдаг болно.","words":[["Ухаалаг төхөөрөмж – утас, таблет, компьютер","Дэлгэц – төхөөрөмжийн гэрэлтдэг нүүр (х. 1)","Нүдээ нухлах (х. 2, үйлдлээр үзүүлэх)"],["Таблет – том дэлгэцтэй хавтгай төхөөрөмж (зураг дээр заах)","Ядрах – хүч дуусах, өвдөх (х. 3)","Унтраах – товч дарж зогсоох (х. 5, үйлдлээр үзүүлэх)"],["Хуваарь – юуг хэзээ хийхийг бичсэн хуудас","Зөвлөх – ухаантай санаа хэлж өгөх (х. 4)","Сунгаа хийх (х. 6, биеэр үзүүлэх)"]],"r1":{"Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Дөлгөөний нүдэнд юу болох бол?» (хуудас 2)\n«Эмч юу гэж зөвлөх бол?» (хуудас 4)\n«Дөлгөөн одоо юу хийх бол?» (хуудас 5)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Дэлгэц – гэрэлтдэг нүүр» (хуудас 1)\n«Ядрах – хүч дуусах, өвдөх» (хуудас 3)\n«Зөвлөх – ухаантай санаа хэлж өгөх» (хуудас 4)","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Дөлгөөн яагаад өвдсөн бэ?»\n«Та нарын гэрт ямар ухаалаг төхөөрөмж байдаг вэ?»\nТөхөөрөмжийн зургийг нэрлэж, юунд хэрэглэдгийг хэлэх."},"r2":{"Номын тухай эргэн санах: Эхлэл, өрнөл, төгсгөл хэсгүүдтэй холбоотой энгийн асуултууд асуух":"«Номын эхэнд Дөлгөөн юунд дуртай байсан бэ?»\n«Түүнд юу болсон бэ?»\n«Эцэст нь Дөлгөөн юу хийдэг болсон бэ?»","Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Таблет ямар сайн талтай вэ?» (хуудас 1)\n«Удаан тоглоход ямар муу зүйл болсон бэ?» (хуудас 3)\n«Чи эмчээс юу асуух байсан бэ?» (хуудас 4)\n«Дөлгөөн хуваарьдаа юу бичсэн бэ?» (хуудас 6)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Нүдээ нухлах» (хуудас 2) үйлдлээр үзүүлэх\n«Унтраах» (хуудас 5) тоглоомон таблетаар үзүүлэх\n«Сунгаа хийх» (хуудас 6) хамтдаа хийх","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Таблетаар хэр удаан тоглох нь зөв вэ?»\nДүрд тоглох: эмч, Дөлгөөн, ээж – эмчээс асуулт асуух.\nУхаалаг төхөөрөмжийн зургийг «сурах, ярих, тоглох» зориулалтаар ангилах."},"r3":{"Уншихын өмнө":"Энэ номыг бид хамтдаа 2 удаа уншчихсан учраас номын нэрийг та нар мэдэж байгаа шүү дээ. Энэ номын нэр юу билээ? гэх зэргээр хүүхдийг эхнээс нь татан оролцуулна.\nНомын зургуудыг тогтон харуулж ярилцана.\n- Ухаалаг төхөөрөмж гэж юу вэ?\n- Дэлгэц удаан харвал юу болдог вэ?","Уншиж байхдаа":"Зургийг заан юу болж байгаа тухай асууна: «Энд Дөлгөөн юу хийж байна?», «Эмч юу гэж хэлж байна?», «Дараа нь юу болох вэ?» Учир шалтгааныг холбон тайлбарлахыг дэмжинэ: «Дөлгөөн яагаад гадаа тоглодог болсон бэ?»","Уншиж дуусаад":"- Дүгнэн ярилцах: «Ухаалаг төхөөрөмжийг яаж зөв х
