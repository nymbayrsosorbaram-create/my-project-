<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цэцэрлэгийн төлөвлөгөө</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2b2140; --paper: #fffaf0; --sky: #bfe6ff; --muted: #6b5f80;
    --pink: #ff8fab; --yellow: #ffd23f; --mint: #7ee0b5; --lilac: #c3a6ff; --orange: #ffa45c; --sea: #5cc8ff;
    --blue: #B4C6E7; --green: #C5E0B3;           /* хэвлэх/Word-ийн албан өнгө */
    --u-ui: #9cc8ff; --d-ui: #b5eb8f;            /* дэлгэцийн cartoon өнгө */
    --line: #2b2140; --accent: #6c4cf5;
    --warn: #b54708; --warn-soft: #fff1d6;
    --r: 18px; --sh: 4px 4px 0 var(--ink); --sh-sm: 2px 2px 0 var(--ink);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink);
    font: 600 14px/1.5 "Nunito", "Comic Sans MS", "Segoe UI", system-ui, sans-serif;
    background-color: var(--sky);
    background-image:
      radial-gradient(circle at 20px 20px, rgba(255,255,255,.55) 3px, transparent 4px),
      radial-gradient(circle at 60px 50px, rgba(255,255,255,.35) 2px, transparent 3px);
    background-size: 80px 80px;
    min-height: 100vh;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  .btn {
    border: 2.5px solid var(--ink); background: #fff; border-radius: 999px; padding: 7px 16px;
    cursor: pointer; white-space: nowrap; box-shadow: var(--sh-sm); font-weight: 800;
    transition: transform .08s, box-shadow .08s;
  }
  .btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
  .btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  .btn.primary { background: var(--yellow); }
  .btn.pink { background: var(--pink); }
  .btn.mint { background: var(--mint); }
  .btn.lilac { background: var(--lilac); }
  .btn.danger { background: #ffd6d6; color: #a1121a; }
  .btn.small { padding: 2px 10px; font-size: 12px; }
  input, select, textarea { border: 2.5px solid var(--ink); border-radius: 12px; padding: 7px 10px; background: #fff; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: 3px solid var(--yellow); outline-offset: 1px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink); font-weight: 800; }

  /* Толгой: үүл, нар */
  header {
    position: relative; overflow: hidden;
    background: linear-gradient(180deg, #8fd3ff, var(--sky));
    border-bottom: 3px solid var(--ink); padding: 18px 16px 26px;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-right: 130px;
  }
  header::before { /* нар */
    content: ""; position: absolute; right: -30px; top: -40px; width: 130px; height: 130px; border-radius: 50%;
    background: var(--yellow); border: 3px solid var(--ink);
    box-shadow: 0 0 0 14px rgba(255,210,63,.35), 0 0 0 28px rgba(255,210,63,.18);
  }
  header::after { /* өвс */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 12px;
    background: radial-gradient(circle at 10px 12px, var(--mint) 9px, transparent 10px) 0 0 / 20px 12px repeat-x;
  }
  header > * { position: relative; z-index: 1; }
  header h1 { font-size: 24px; font-weight: 900; margin: 0 auto 0 0; letter-spacing: .2px; text-shadow: 2px 2px 0 #fff; display: flex; align-items: center; gap: 10px; }
  header h1 .logo { font-size: 38px; filter: drop-shadow(2px 2px 0 var(--ink)); animation: bob 3s ease-in-out infinite; }
  header .sub { font-size: 12px; color: var(--muted); font-weight: 700; display: block; text-shadow: none; }
  @keyframes bob { 50% { transform: translateY(-4px) rotate(-6deg); } }
  @media (prefers-reduced-motion: reduce) { header h1 .logo { animation: none; } .btn { transition: none; } }

  /* Бүлгийн таб */
  .groups { display: flex; gap: 12px; padding: 18px 16px 0; flex-wrap: wrap; }
  .groups button {
    display: flex; align-items: center; gap: 10px; text-align: left;
    border: 3px solid var(--ink); border-radius: 22px 22px 0 0; border-bottom: none;
    padding: 10px 18px 10px 12px; cursor: pointer; background: #fff; transform: translateY(6px);
    transition: transform .12s;
  }
  .groups button:hover { transform: translateY(2px); }
  .groups button .em { font-size: 30px; line-height: 1; filter: drop-shadow(1px 1px 0 var(--ink)); }
  .groups button b { display: block; font-size: 16px; font-weight: 900; }
  .groups button span.lv { font-size: 11px; color: var(--muted); }
  .groups button[data-g="0"] { background: #fff3b0; }
  .groups button[data-g="1"] { background: #ffd6e0; }
  .groups button[data-g="2"] { background: #d4f5e5; }
  .groups button[data-g="3"] { background: #e3d7ff; }
  .groups button.active { transform: translateY(0); padding-bottom: 16px; }

  .shell {
    background: var(--paper); border: 3px solid var(--ink); border-radius: 0 var(--r) var(--r) var(--r);
    margin: 0 16px 24px; display: grid; grid-template-columns: 240px 1fr; min-height: 72vh; box-shadow: var(--sh);
  }
  aside { border-right: 3px dashed #d9cfe8; padding: 14px 10px; display: flex; flex-direction: column; gap: 6px; }
  aside button {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    border: 2.5px solid transparent; background: none; padding: 8px 10px; border-radius: 14px; cursor: pointer; font-weight: 800;
  }
  aside button .ic { font-size: 20px; width: 26px; text-align: center; }
  aside button .nm { flex: 1; }
  aside button small { background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 0 7px; font-size: 11px; font-weight: 900; }
  aside button:hover { background: #fff; border-color: var(--ink); }
  aside button.active { background: var(--yellow); border-color: var(--ink); box-shadow: var(--sh-sm); }
  aside hr { border: none; border-top: 3px dotted #d9cfe8; margin: 6px 0; width: 100%; }
  .content { padding: 20px; min-width: 0; }
  .content h2 { font-size: 22px; font-weight: 900; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  .content h2 .ic { font-size: 30px; filter: drop-shadow(2px 2px 0 var(--ink)); }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 10px 0 14px; }
  .toolbar .grow { margin-right: auto; }
  .muted { color: var(--muted); font-size: 13px; font-weight: 700; }
  .scroll { overflow-x: auto; padding: 2px 6px 8px 2px; }
  a { color: var(--accent); font-weight: 900; }

  /* Төлөвлөгөөний хүснэгт — суурь (хэвлэхэд ашиглана) */
  table.plan { border-collapse: collapse; width: 100%; min-width: 980px; font-size: 13px; }
  .plan th, .plan td { border: 1px solid #9aa3b2; padding: 4px 6px; vertical-align: top; }
  .plan th { background: #eef1f6; text-align: center; font-weight: 700; }
  .plan td.m { text-align: center; vertical-align: middle; width: 58px; font-size: 12px; }
  .plan td.u { background: var(--blue); }
  .plan td.d { background: var(--green); }
  .plan td.num { text-align: center; vertical-align: middle; width: 56px; font-weight: 700; }
  .plan td.out { min-width: 300px; }
  .plan td.out .code { font-weight: 800; }
  .plan td.out ul { margin: 4px 0 0; padding-left: 16px; font-size: 12px; }
  .plan td.out .lnk-h { font-size: 12px; font-style: italic; margin-top: 4px; }
  .plan tfoot td { font-weight: 800; }

  /* Дэлгэц дээрх cartoon хүснэгт */
  .content table.plan { border-collapse: separate; border-spacing: 0; border: 3px solid var(--ink); border-radius: var(--r); overflow: hidden; background: #fff; box-shadow: var(--sh); font-weight: 600; }
  .content .plan th, .content .plan td { border: 0; border-right: 1.5px solid #cfc4e2; border-bottom: 1.5px solid #cfc4e2; }
  .content .plan th { background: var(--lilac); color: var(--ink); font-weight: 900; border-color: var(--ink); border-bottom-width: 2.5px; }
  .content .plan thead tr:first-child th:nth-child(4) { background: #ffe58a; }
  .content .plan thead tr:first-child th:nth-child(5) { background: #ffc2d1; }
  .content .plan thead tr:first-child th:nth-child(6) { background: #a8ecc9; }
  .content .plan td.m { cursor: pointer; transition: transform .1s; }
  .content .plan td.m:hover { box-shadow: inset 0 0 0 3px var(--ink); }
  .content .plan td.u { background: var(--u-ui); font-weight: 900; }
  .content .plan td.d { background: var(--d-ui); }
  .content .plan td.d::after { content: "★"; color: #4f9a2b; font-size: 13px; }
  .content .plan td.num { font-size: 16px; font-weight: 900; }
  .content .plan td.out { cursor: pointer; }
  .content .plan td.out .code { background: var(--yellow); border: 2px solid var(--ink); border-radius: 8px; padding: 0 5px; font-weight: 900; }
  .content .plan td.out .lnk-h { color: var(--muted); }
  .content .plan tr.row:hover td.out { background: #fff8db; }
  .content .plan tfoot td { background: #fff3b0; font-weight: 900; font-size: 15px; }
  .content .plan td.ar { background: #fff6e8; font-weight: 900; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; font-weight: 800; align-items: center; }
  .sw { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--ink); border-radius: 6px; vertical-align: -4px; margin-right: 5px; }
  .warn-box { background: var(--warn-soft); color: var(--warn); border: 3px solid var(--ink); border-radius: var(--r); padding: 10px 14px; margin: 12px 0; font-size: 13px; box-shadow: var(--sh-sm); }
  .warn-box ul { margin: 4px 0 0; padding-left: 18px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; margin: 14px 0 20px; }
  .card { border: 3px solid var(--ink); border-radius: var(--r); padding: 12px 14px; box-shadow: var(--sh); position: relative; }
  .card:nth-child(1) { background: #fff3b0; } .card:nth-child(2) { background: #ffd6e0; }
  .card:nth-child(3) { background: #d6e9ff; } .card:nth-child(4) { background: #dcf7c8; }
  .card .em { position: absolute; right: 10px; top: 8px; font-size: 30px; }
  .card .v { font-size: 34px; font-weight: 900; line-height: 1.1; }
  .card .l { font-size: 13px; font-weight: 800; }
  table.sum { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; border: 3px solid var(--ink); border-radius: var(--r); overflow: hidden; background: #fff; box-shadow: var(--sh); }
  .sum th, .sum td { border-bottom: 1.5px solid #e2d9f0; padding: 7px 8px; text-align: center; }
  .sum th { background: var(--lilac); font-weight: 900; border-bottom: 2.5px solid var(--ink); }
  .sum td:first-child, .sum th:first-child { text-align: left; }
  .sum tbody tr:nth-child(even) td { background: #fbf7ff; }
  .sum tfoot td { border-top: 2.5px solid var(--ink); border-bottom: 0; }
  .bar { display: inline-block; height: 10px; border: 2px solid var(--ink); border-radius: 999px; background: var(--pink); vertical-align: middle; }
  .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; max-width: 900px; margin-top: 12px; }

  dialog { border: 3px solid var(--ink); border-radius: 24px; padding: 0; width: min(580px, 94vw); box-shadow: 6px 6px 0 var(--ink); background: var(--paper); color: var(--ink); }
  dialog::backdrop { background: rgba(43, 33, 64, .45); }
  dialog form { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  dialog h3 { margin: 0; font-size: 18px; font-weight: 900; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg label { flex-direction: row; align-items: center; gap: 6px; border: 2.5px solid var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; background: #fff; }
  .seg label:has(input:checked) { background: var(--yellow); box-shadow: var(--sh-sm); }
  .seg input { width: auto; accent-color: var(--accent); }
  .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .dlg-actions .left { margin-right: auto; }
  .hint { font-size: 13px; background: #fff; border: 2px dashed var(--ink); border-radius: 12px; padding: 8px 10px; min-height: 34px; }

  /* Сарын төлөвлөлт */
  aside button.month-nav { background: #ffe0ec; border-color: var(--ink); }
  aside button.month-nav.active { background: var(--pink); }
  .mchips { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .mchips button { position: relative; width: 62px; border: 2.5px solid var(--ink); border-radius: 16px; background: #fff; padding: 6px 0; cursor: pointer; box-shadow: var(--sh-sm); line-height: 1.1; }
  .mchips button b { display: block; font-size: 18px; font-weight: 900; }
  .mchips button span { font-size: 11px; color: var(--muted); }
  .mchips button i { position: absolute; top: -9px; right: -8px; background: var(--pink); border: 2px solid var(--ink); border-radius: 999px; font-style: normal; font-size: 11px; font-weight: 900; padding: 0 6px; }
  .mchips button.active { background: var(--yellow); transform: translateY(-2px); }
  .subtabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; border-bottom: 3px solid var(--ink); padding-bottom: 8px; margin-bottom: 14px; }
  .subtabs button[data-t] { border: 2.5px solid var(--ink); background: #fff; border-radius: 14px; padding: 7px 14px; cursor: pointer; font-weight: 800; }
  .subtabs button[data-t] small { background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 0 6px; font-size: 11px; margin-left: 2px; }
  .subtabs button.active { background: var(--lilac); box-shadow: var(--sh-sm); }
  .subtabs .grow { flex: 1; }
  .mcard { border: 3px solid var(--ink); border-radius: var(--r); background: #fff; padding: 14px; box-shadow: var(--sh); margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
  .formgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-bottom: 4px; }
  .chk { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 800; font-size: 13px; }
  .chk label { flex-direction: row; align-items: center; gap: 5px; border: 2px solid var(--ink); border-radius: 999px; padding: 3px 10px; background: var(--paper); font-size: 12px; }
  .chk input { width: auto; }
  table.mt { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 760px; border: 3px solid var(--ink); border-radius: var(--r); overflow: hidden; background: #fff; box-shadow: var(--sh); font-size: 13px; }
  .mt th { background: var(--lilac); font-weight: 900; padding: 8px; border-bottom: 2.5px solid var(--ink); text-align: left; }
  .mt td { padding: 6px 8px; border-bottom: 1.5px solid #e2d9f0; vertical-align: top; }
  .mt td.c { text-align: center; vertical-align: middle; }
  .mt tbody tr:nth-child(even) td { background: #fbf7ff; }
  .mt td input, .mt td select, .mt td textarea { padding: 5px 7px; border-width: 2px; border-radius: 10px; font-size: 13px; }
  .mt .code { background: var(--yellow); border: 2px solid var(--ink); border-radius: 8px; padding: 0 5px; font-weight: 900; }
  .badge { display: inline-block; border: 2px solid var(--ink); border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 900; }
  .badge.u { background: var(--u-ui); } .badge.d { background: var(--d-ui); }
  .dates { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 4px; font-size: 12px; }
  .dates span { background: var(--sky); border: 2px solid var(--ink); border-radius: 8px; padding: 0 5px; font-weight: 900; }
  .dates em { color: var(--muted); }
  .act-layout { display: grid; grid-template-columns: 170px 1fr; gap: 16px; align-items: start; }
  .act-list { display: flex; flex-direction: column; gap: 5px; position: sticky; top: 8px; max-height: 80vh; overflow: auto; padding: 2px 6px 6px 2px; }
  .act-list button { display: grid; grid-template-columns: 22px 44px 1fr; grid-template-rows: auto auto; align-items: center; text-align: left; border: 2.5px solid var(--ink); border-radius: 14px; background: #fff; padding: 5px 8px; cursor: pointer; }
  .act-list button b { font-size: 15px; font-weight: 900; } .act-list button small { color: var(--muted); }
  .act-list button em { grid-column: 2 / 4; font-style: normal; font-size: 11px; color: var(--muted); font-weight: 800; }
  .act-list button.active { background: var(--yellow); box-shadow: var(--sh-sm); }
  .act-edit { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .act-head { display: flex; gap: 10px; flex-wrap: wrap; }
  .act-head > div { flex: 1; min-width: 140px; border: 3px solid var(--ink); border-radius: 16px; background: #fff3b0; padding: 8px 12px; box-shadow: var(--sh-sm); }
  .act-head > div:nth-child(2) { background: #d6e9ff; } .act-head > div:nth-child(3) { background: #ffd6e0; }
  .act-head small { display: block; font-size: 11px; color: var(--muted); font-weight: 800; }
  .ro { border: 2.5px dashed var(--ink); border-radius: 12px; padding: 7px 10px; background: #fff; font-weight: 700; color: var(--ink); font-size: 13px; }
  h3.sec { font-size: 16px; font-weight: 900; margin: 12px 0 4px; }
  textarea.ag { resize: vertical; overflow: hidden; min-height: 38px; }
  .mt.steps td { background: #fff !important; }
  #print-root { display: none; }
  @media (max-width: 760px) {
    .act-layout { grid-template-columns: 1fr; }
    .act-list { flex-direction: row; position: static; overflow-x: auto; max-height: none; }
    .act-list button { min-width: 120px; }
    header { padding-right: 16px; }
    header::before { width: 90px; height: 90px; right: -35px; top: -45px; }
    header h1 { font-size: 19px; width: 100%; padding-right: 50px; }
    .shell { grid-template-columns: 1fr; margin: 0 8px 16px; border-radius: 0 var(--r) var(--r) var(--r); }
    aside { border-right: none; border-bottom: 3px dashed #d9cfe8; flex-direction: row; overflow-x: auto; }
    aside button { width: auto; white-space: nowrap; }
    aside hr { display: none; }
    .groups { padding: 12px 8px 0; gap: 6px; }
    .groups button { padding: 8px 10px; }
    .groups button .lv { display: none; }
  }
  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    body { background: #fff; font-weight: 400; }
    header, .groups, .shell, dialog { display: none !important; }
    #print-root { display: block; }
    .pdoc { page-break-after: always; font-family: "Times New Roman", serif; font-size: 11pt; }
    .pdoc:last-child { page-break-after: auto; }
    .plan { min-width: 0; font-size: 9.5pt; }
    .plan th, .plan td { border: 1px solid #000; }
    .plan td.m { width: 34px; font-size: 8pt; padding: 2px; }
    .plan td.num { width: 40px; }
    .plan tfoot { display: table-row-group; }
    .plan td.u { background: var(--blue) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .plan td.d { background: var(--green) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    thead { display: table-header-group; }
  }
</style>
</head>
<body>
<header>
  <h1><span class="logo" aria-hidden="true">🧸</span><span>Цэцэрлэгийн жилийн төлөвлөгөө <span class="sub" id="hdr-sub"></span></span></h1>
  <button class="btn mint" id="btn-print">🖨️ Хэвлэх / PDF</button>
  <button class="btn primary" id="btn-word">📄 Word татах</button>
  <button class="btn pink" id="btn-json">💾 JSON хадгалах</button>
  <label class="btn lilac" style="flex-direction:row;color:inherit;font-size:14px">📂 JSON нээх<input type="file" id="file-json" accept=".json" hidden></label>
</header>

<div class="groups" id="groups"></div>

<div class="shell">
  <aside id="nav"></aside>
  <div class="content" id="content"></div>
</div>

<div id="print-root"></div>

<!-- Сарын нүд засах -->
<dialog id="dlg-cell">
  <form method="dialog">
    <h3 id="cell-title"></h3>
    <div class="seg">
      <label><input type="radio" name="t" value=""> Хэрэгжүүлэхгүй</label>
      <label><input type="radio" name="t" value="d"><span class="sw" style="background:var(--d-ui)"></span>Давтамж</label>
      <label><input type="radio" name="t" value="u"><span class="sw" style="background:var(--u-ui)"></span>Уялдаа</label>
    </div>
    <div id="cell-link">
      <label>Уялдах суралцахуйн үр дүн (бусад чиглэлээс)
        <select id="cell-code"></select>
      </label>
      <div class="hint" id="cell-hint"></div>
    </div>
    <div class="dlg-actions">
      <button class="btn" value="cancel" formnovalidate>Болих</button>
      <button class="btn primary" value="ok">Хадгалах</button>
    </div>
  </form>
</dialog>

<!-- Мөр засах -->
<dialog id="dlg-row">
  <form method="dialog">
    <h3 id="row-title">Суралцахуйн үр дүн</h3>
    <label>Ай<input id="row-area" list="dl-areas" required></label>
    <label>Дэд ай<input id="row-sub" list="dl-subs" required></label>
    <label>Код<input id="row-code" placeholder="ж: НСХ1.1а" required></label>

"Өдөр бүр","ХЭМ3.1з":"Өдөр бүр","ХЭМ3.2а":"01.21","ХЭМ3.2г":"01.11, 01.13","ХЭМ3.2д":"Өдөр бүр","ХЭМ3.2е":"01.26","ХЯ3.1а":"01.12, 01.15","ХЯ3.3б":"Өдөр бүр","БНО3.2б":"01.25","БНО3.2в":"Өдөр бүр","МАТ3.1б":"01.21","МАТ3.2а":"01.27, 01.28","МАТ3.3а":"Өдөр бүр","ЗУ3.1а":"Өдөр бүр","ЗУ3.2а":"01.11, 01.15, 01.26","ЗУ3.2в":"01.08, 01.29","ЗУ3.2г":"01.27","ЗУ3.2д":"01.14"},"schedule":[{"date":"2028-01-04","code":"НСХ3.3в","link":"ХӨГ3.1б"},{"date":"2028-01-05","code":"ХЭМ3.1г","link":"ХӨГ3.1в"},{"date":"2028-01-06","code":"ХЯ3.2в","link":"МАТ3.2а"},{"date":"2028-01-07","code":"ХЭМ3.1и","link":"МАТ3.1а"},{"date":"2028-01-08","code":"ЗУ3.2б","link":"НСХ3.1а"},{"date":"2028-01-11","code":"НСХ3.1в","link":"ЗУ3.2б"},{"date":"2028-01-12","code":"МАТ3.1а","link":"ХЭМ3.1и"},{"date":"2028-01-13","code":"ХЭМ3.2в","link":"ЗУ3.2г"},{"date":"2028-01-14","code":"МАТ3.3б","link":"ХЭМ3.1м"},{"date":"2028-01-15","code":"ХЯ3.3в","link":"МАТ3.3б"},{"date":"2028-01-18","code":"НСХ3.2в","link":"ХЭМ3.1д"},{"date":"2028-01-19","code":"ХЭМ3.1н","link":"НСХ3.2в"},{"date":"2028-01-20","code":"МАТ3.2б","link":"ХЯ3.2д"},{"date":"2028-01-21","code":"МАТ3.4б","link":"ЗУ3.2д"},{"date":"2028-01-22","code":"БНО3.1г","link":"ЗУ3.2а"},{"date":"2028-01-25","code":"БНО3.2д","link":"ХЯ3.2г"},{"date":"2028-01-26","code":"ХЭМ3.2ж","link":"БНО3.1г"},{"date":"2028-01-27","code":"НСХ3.2б","link":"ХЯ3.2а"},{"date":"2028-01-28","code":"БНО3.1в","link":"ХЯ3.2в"},{"date":"2028-01-29","code":"ЗУ3.2е","link":"БНО3.2д"}],"acts":{"2028-01-04":{"method":"Төсөлд суурилсан арга","link":"ХӨГ3.1б. Богино үгтэй дууг бусадтай хамтран дуулна.","competence":"Хамтран ажиллах (бүлгийн ажилд үүрэг хүлээх), хөгжмийн чадвар (богино дууг хамтран дуулах)","materials":"Үүргийн самбар, үүргийн карт (ширээ засагч, ургамал услагч, номын туслах, тоглоом хураагч, цаг агаарын хөтлөгч), хүүхдүүдийн зураг, «Бээлий» зурагт карт, хонх","criteria":"Бүлгийн өдөр тутмын ажилд тодорхой үүрэг сонгон хүлээж, түүнийгээ гүйцэтгэдэг. Богино үгтэй дууг найзуудтайгаа хамтран дуулдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Шинэ жилийн амралтаар юу хийсэн бэ?\" гэж асууж, \"Сайн уу, найз минь\" дууг хамтдаа дуулна.","learner":"- Багш, найзуудтайгаа \"Шинэ жилийн мэнд\" гэж мэндчилнэ.\n- Амралтаараа хийсэн нэг сонирхолтой зүйлээ 2-3 өгүүлбэрээр ярина.\n- \"Сайн уу, найз минь\" дууг найзуудтайгаа хамтдаа дуулж, хажуугийн найзтайгаа гар барина."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Ярилцлага: \"Манай бүлэгт өдөр бүр ямар ажил хийгддэг вэ?\" гэж асууж, хүүхдүүдийн санааг самбарт зургаар тэмдэглэнэ.\n- Үүрэг сонгох: Үүргийн картуудыг танилцуулж, хүүхэд бүрээр долоо хоногийн үүргээ сонгуулна.\n- Үүргийн самбар: Хүүхдийн зургийг сонгосон үүргийн хажууд байрлуулж, үүрэг бүрийг хэрхэн гүйцэтгэхийг хамтдаа ярилцана.\n- Туслагчдын дуу: \"Бид туслагчид\" гэсэн богино дууг хамтдаа сурч дуулна.\nБагшийн чиглүүлэх асуулт:\n1. Чи ямар үүрэг сонгосон бэ? Яагаад?\n2. Энэ үүргийг яаж гүйцэтгэх вэ?\n3. Хэрэв хэн нэгэн үүргээ мартвал юу болох вэ?","learner":"Ярилцлага:\n- Бүлэгт өдөр бүр хийх ажлыг (ширээ засах, ургамал услах, тоглоом хураах) санаачилгаараа нэрлэнэ.\nҮүрэг сонгох:\n- Үүргийн картуудыг харж, өөрт таалагдсаныг сонгоно.\n- \"Би ... хийнэ, учир нь ...\" гэж шалтгаантайгаар хэлнэ.\nҮүргийн самбар:\n- Өөрийн зургийг үүргийн хажууд наана.\n- Үүргээ хэрхэн гүйцэтгэхээ (\"Хоолны өмнө халбага тавина\") тайлбарлана.\nТуслагчдын дуу:\n- Дууны үгийг багштай мөр мөрөөр давтаж, найзуудтайгаа хамтран дуулна."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Тоглох үед үүрэг хүлээсэн хүүхдүүд (тоглоом хураагч) үүргээ хэрхэн гүйцэтгэж буйг ажиглаж урамшуулна.","learner":"- Найзуудтайгаа чөлөөтэй тоглоно.\n- Тоглоом хураагч хүүхэд тоглоомын төгсгөлд найзууддаа хураахыг сануулна.\n- Бүгд тоглоомоо байранд нь хураана."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – эхний уншлага (1): «Бээлий» (Чанга уншлагын төлөвлөгөөний хуудсыг үзнэ үү.)\n- Номын нэр, хавтас, зохиолч, зураачийг танилцуулж, хэмнэлийг алдагдуулахгүй уншина.\n- Түр зогсож асуух: «Бээлийд хэн орох бол?»\n- Шинэ үг: «Гээх – юмаа санамсаргүй унагаж орхих»\n- Уншсаны дараа: «Бээлийд ямар ямар амьтан орсон бэ? Дарааллаар нь хэлээрэй.»","learner":"- Номын хавтас дээрх бээлийг харж \"Энэ ном ... тухай байх\" гэж таамаглана.\n- Багшийн уншихыг анхааралтай, тайван сонсоно.\n- Түр зогсох үед бээлийд хэн орохыг таамаглаж хэлнэ.\n- «Гээх» гэдэг шинэ үгийг давтан хэлж, утгыг нь хэлнэ.\n- Бээлийд орсон амьтдыг дарааллаар нь нэрлэж, хуруугаараа тоолно."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: Үүргийн тэмдэг (услуур, халбага, шүүр, ном) зурах загвар, өнгийн харандаа бэлтгэнэ.\nХөгжмийн төв: Хонх, шажигнуур байрлуулж \"Бид туслагчид\" дууг дагуулан тоглуулна.\nДүрт тоглоомын төв: \"Манай гэр\" – гэрийн ажлыг хуваарилах орчин бүрдүүлнэ.","learner":"Урлагийн төв:\n- Өөрийн үүргийн тэмдгийг зурж будна.\n- Тэмдгээ энгэртээ зүүж, юу гэсэн утгатайг найздаа хэлнэ.\nХөгжмийн төв:\n- Хонх, шажигнуураар дууг дагуулан тоглож, найзуудтайгаа хамтран дуулна.\nДүрт тоглоомын төв:\n- Гэр бүлийн гишүүдийн дүрийг хуваарилж, \"Би аяга угаана\" гэх мэтээр үүргээ хэлж тоглоно."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 1 (1). Ажиглалт: Гацуур модыг ажиглах\nЗорилго: Гацуурын бүтэц, онцлог шинж чанар, бусад модноос ялгарах шинж тэмдгийг таньж мэдэх.\nЯвц:\n- Хүүхдүүдийг гацуур модны дэргэд аюулгүй зайтай зогсоож, мөчир, навч, их бие, боргоцойг ажиглуулна.\n- Багшийн мэдээлэл: Гацуур модны мөчир давхарлан ургадаг. Навч нь зүү шиг нарийхан, хатуу, үргэлж ногоон байдаг. Их бие нь шулуун, бор саарал өнгөтэй, үр нь боргоцой дотор байдаг. Гацуур мод өвөл ч, зун ч ногооноороо байдаг. Хүйтэнд тэсвэртэй тул хотын гудамж, цэцэрлэгт хүрээлэн, сургууль, цэцэрлэгийн хашаанд, ой модонд ч ургадаг.\n- Оньсого таалгана:\n1. «Өвөл зунгүй ногоон, Өндөр сайхан ургана. Шинэ жилээр гэрт ирж, Чимэг зүүлтээ зүүнэ. Тэр юу вэ?» /Гацуур/\n2. «Навч нь зүү шиг нарийхан, Ногоон өнгөө гээдэггүй. Цасан дунд зогссон ч Царайгаа ер хувиргадаггүй. Тэр юу вэ?» /Гацуур/\n3. «Од, бөмбөлөг зүүгээд, Олон гэрэл асаана. Хүүхэд багачууд тойроод, Хөөр баяраар дуулна. Тэр юу вэ?» /Шинэ жилийн гацуур мод/","learner":"- Багшийн хамт гацуур модны дэргэд аюулгүй зайтай зогсоно.\n- Мөчир нь давхарлан ургасныг харж, \"доороо урт, дээшээ богино\" гэж хэлнэ.\n- Бээлийтэй гараараа зүү шиг навчинд болгоомжтой хүрч \"нарийхан, хатуу\" гэж мэдрэмжээ хэлнэ.\n- Их биеийн өнгийг нэрлэж, боргоцой олж харуулна.\n- Гацуурыг навчгүй модтой харьцуулж \"Гацуур өвөл ч ногоон\" гэж ялгааг хэлнэ.\n- Оньсого бүрийг сонсоод хариуг нь таана."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Туслагч хэн бэ?»\nЗорилго: Үүргээ санаж, бусдын үүргийг мэдэх.\nЯвц:\n1. Багш үүргийн нэг картыг үзүүлнэ.\n2. Тэр үүргийг хүлээсэн хүүхэд босож, үүргээ үйлдлээр үзүүлнэ.\n3. Бусад нь алга ташиж, \"Баярлалаа, туслагч минь\" гэж хэлнэ.\nДүрэм: Ээлжээ хүлээнэ.\nДүгнэлт: Маргааш хэн юу хийхийг хамтдаа давтана.","learner":"- Багшийн үзүүлсэн картыг харж өөрийн үүрэг мөн эсэхийг таньна.\n- Өөрийн үүрэг бол босож, үйлдлээр үзүүлнэ.\n- Найздаа \"Баярлалаа, туслагч минь\" гэж хэлнэ.\n- Маргаашийн үүргээ давтан хэлнэ."}]},"2028-01-05":{"method":"Тоглоомонд суурилсан арга","link":"ХӨГ3.1в. Дуу, аялгууны хэмнэлийг ялгаж, дагаж тоглоно.","competence":"Биеийн хөдөлгөөний чадвар (алхалт, гүйлтийн чиглэл, хурдыг өөрчлөх), хэмнэл мэдрэх","materials":"Бөмбөр, хэнгэрэг, конус (6), өнгөт тууз, хөгжим (удаан, хурдан хэмнэлтэй), чиглэлийн сумтай карт","criteria":"Дохио, хэмнэлийн дагуу алхалт, гүйлтийн чиглэл (урагш, хойш, хажуу тийш), хурдыг өөрчлөн гүйцэтгэдэг. Хэмнэлийг ялгаж, түүнийг дагаж хөдөлдөг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, бөмбөрийг удаан ба хурдан цохиж \"Аль нь удаан, аль нь хурдан бэ?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Бөмбөрийн удаан, хурдан хэмнэлийг сонсож ялгана.\n- Алгаа ташиж хэмнэлийг дуурайна."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Зааж үзүүлэх: Бөмбөрийн удаан хэмнэлд аажуухан алхах, хурдан хэмнэлд гүйх, хэмнэл зогсоход зогсохыг үзүүлнэ.\n- Чиглэл өөрчлөх: Сумтай картыг (урагш, хойш, баруун, зүүн) үзүүлэхэд тэр чиглэлд алхуулна.\n- Конусын зам: Конусуудын хооронд могой мэт мушгиран алхаж, дараа нь гүйлгэнэ.\nБагшийн чиглүүлэх асуулт:\n1. Хэмнэл хурдсахад чи юу хийсэн бэ?\n2. Хойшоо алхахдаа юуг анхаарах вэ?\n3. Конусуудыг мөргөхгүй гүйхийн тулд яах вэ?","learner":"Зааж үзүүлэх:\n- Багшийг ажиглаад удаан хэмнэлд аажуухан алхана.\n- Хурдан хэмнэлд гүйж, хэмнэл зогсоход байрандаа зогсоно.\nЧиглэл өөрчлөх:\n- Сумтай картыг харж урагш, хойш, хажуу тийш алхана.\n- Хойшоо алхахдаа мөрөн дээгүүрээ харж болгоомжилно.\nКонусын зам:\n- Конусуудын хооронд мушгиран алхаж, дараа нь гүйнэ.\n- Конусыг мөргөхгүй байхыг хичээнэ.\nАсуултад хариулах:\n- \"Хэмнэл хурдсахад би гүйсэн\" гэж хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Хөдөлгөөний буланд конус, тууз байрлуулж, бие даан зам гаргаж тоглохыг ажиглана.","learner":"- Конус, туузаар өөрийн зам гаргана.\n- Найзаа замаараа алхуулж, \"Одоо хурдан!\" гэж дохио өгнө."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Хэмнэлтэй шүлэг (\"Тог тог тогшино\") уншиж, алга ташин хэмнэлийг дагуулна.","learner":"- Шүлгийг сонсож мөр мөрөөр давтана.\n- Алга ташиж шүлгийн хэмнэлийг дагана.\n- Хэмнэлийг удаан, хурдан болгон давтана."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Хөгжмийн төв: Бөмбөр, хэнгэрэг, шажигнуур бэлтгэж, хэмнэл дуурайх тоглоом санал болгоно.\nХөдөлгөөний төв: Шалан дээр сумтай зам наана.\nУрлагийн төв: \"Хурдан, удаан\" – хурдан ба удаан амьтдын зураг будах.","learner":"Хөгжмийн төв:\n- Найзынхаа цохисон хэмнэлийг сонсоод дуурайн цохино.\nХөдөлгөөний төв:\n- Шалан дээрх сумыг дагаж чиглэлээ өөрчлөн алхана.\nУрлагийн төв:\n- Хурдан (туулай) ба удаан (яст мэлхий) амьтдын зургийг будаж, ялгааг нь хэлнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 1 (2). Хөдөлгөөнт тоглоом: «Бөмбөгөө замаар өнхрүүлье»\nНас: 4–6 нас. Тоглох орчин: Спорт заал, анги доторх сул талбай, цэцэрлэгийн гадна талбай. Хугацаа: 8–10 минут\nЗорилго: Саваа модоор бөмбөгийг зөөлөн түлхэж өнхрүүлэх, бөмбөгийг шулуун болон муруй замаар чиглүүлэх, хөдөлгөөнөө хянах, хүчээ тохируулах, дүрэм баримтлах, хамтран тоглох чадварыг дэмжинэ.\nХэрэглэгдэхүүн: Хүүхдийн тоонд тохирсон 2–4 ширхэг жижиг бөмбөг; хүүхэд бүрт 1 ширхэг богино саваа мод; конус, тууз, шохой, цагираг зэрэг зам тэмдэглэх хэрэгсэл; барианы тэмдэг эсвэл жижиг сагс\nАнхаарах зүйл: Саваа нь хурц үзүүргүй, хөнгөн, хүүхдийн гарт тохирсон урттай байна.\nТоглоомын явц:\n- Хүүхдүүдийг 2–4 багт хуваана. Баг бүрийн өмнө эхлэх шугам, барианы цэгийг тэмдэглэж, конусоор жижиг зам гаргана: Эхлэл → конус тойрох → шулуун зам → цагирагт оруулах → бариа.\n- Баг бүрийн эхний хүүхэд бөмбөгөө саваагаар зөөлөн түлхэн өнхрүүлж, конус хооронд чиглүүлэн барианы цэгт хүргэнэ.\n- Дараа нь бөмбөгөө багийн дараагийн хүүхдэд дамжуулна. Багийн бүх хүүхэд ээлжээр өнхрүүлж дуусахад тоглоом өндөрлөнө.\nТоглоомын дүрэм:\n1. Бөмбөгийг гараар барьж болохгүй.\n2. Бөмбөгийг зөвхөн саваагаар зөөлөн түлхэнэ.\n3. Саваагаа савчихгүй, дээш өргөхгүй.\n4. Бөмбөг замаас гарвал хүүхэд буцааж зам дээр тавиад үргэлжлүүлнэ.","learner":"- Багтаа нэгдэж эхлэх шугамын ард ээлжээ хүлээн зогсоно.\n- Саваагаа хоёр гараараа барьж, бөмбөгийг зөөлөн түлхэнэ.\n- Бөмбөгийг конусыг тойруулан, шулуун замаар, цагирагт оруулан бариа хүртэл чиглүүлнэ.\n- Бөмбөг замаас гарвал буцааж тавиад үргэлжлүүлнэ.\n- Бариад хүрээд бөмбөгөө дараагийн найздаа дамжуулна.\n- Саваагаа дээш өргөхгүй, бөмбөгийг гараар барихгүй байх дүрмийг баримтална."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Хэмнэлээр алх»\nЗорилго: Хэмнэлийн өөрчлөлтөөр хөдөлгөөнөө өөрчлөх.\nЯвц:\n1. Багш хэнгэрэг удаан цохиход \"баавгай\" шиг аажуухан алхана.\n2. Хурдан цохиход \"туулай\" шиг хурдан гүйнэ.\n3. Хоёр удаа цохиход эргэж хойшоо алхана.\nДүрэм: Найзуудтайгаа мөргөлдөхгүй.\nДүгнэлт: Ямар хэмнэлд ямар амьтан болсноо ярилцана.","learner":"- Хэнгэрэгний хэмнэлийг сонсоно.\n- Удаан хэмнэлд баавгай шиг, хурдан хэмнэлд туулай шиг хөдөлнө.\n- Хоёр удаа цохиход эргэж хойшоо алхана.\n- Ямар хэмнэлд хэн болсноо хэлнэ."}]},"2028-01-06":{"method":"Шинжлэн судлах арга","link":"МАТ3.2а. Тоглоом юмсын урт, хүндийг харьцуулж, тайлбарлана.","competence":"Харилцах (юмсын шинж чанарыг илэрхийлсэн үгийг хэрэглэх), шүүн тунгаах (урт, хүндийг харьцуулах)","materials":"Янз бүрийн бээлий (ноосон, арьсан, хүүхдийн, том хүний), ороолт (урт, богино), дэнс, «Ид шидийн уут», шинж чанарын зурагт карт","criteria":"Юмсын шинж чанар, онцлогийг илэрхийлсэн үгийг (зөөлөн, ширүүн, урт, богино, хүнд, хөнгөн) яриандаа ашигладаг. Урт, хүндийг харьцуулж тайлбарладаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, өөрийн бээлийгээ гаргаж \"Чиний бээлий ямар байна?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Өөрийн бээлийг харж, \"Миний бээлий улаан, зөөлөн, дулаан\" гэж 2-3 шинжээр дүрсэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Мэдрэх, дүрслэх: Ноосон, арьсан, нэхмэл бээлийг ээлжлэн барьж \"Ямар байна?\" гэж асууж, шинж чанарын үгийг самбарт зургаар тэмдэглэнэ.\n- Урт харьцуулах: Хоёр ороолтыг нэг цэгээс эхлүүлэн зэрэгцүүлж \"Аль нь урт вэ?\" гэж асууна.\n- Хүнд харьцуулах: Том хүний арьсан бээлий, хүүхдийн ноосон бээлийг гартаа барьж, дэнсээр шалгуулна.\nБагшийн чиглүүлэх асуулт:\n1. Энэ бээлий ямар байна? Өөр ямар үгээр хэлэх вэ?\n2. Аль ороолт урт вэ? Яаж мэдсэн бэ?\n3. Аль бээлий хүнд вэ? Дэнс юу харуулж байна?","learner":"Мэдрэх, дүрслэх:\n- Бээлий бүрийг барьж мэдэрнэ.\n- \"Ноосон бээлий зөөлөн, сэвсгэр\", \"Арьсан бээлий гөлгөр, хатуу\" гэж шинж чанарын үгээр дүрсэлнэ.\nУрт харьцуулах:\n- Хоёр ороолтыг нэг цэгээс эхлүүлэн зэрэгцүүлж, \"Энэ нь урт, энэ нь богино\" гэж хэлнэ.\nХүнд харьцуулах:\n- Хоёр бээлийг хоёр гартаа барьж хүнд, хөнгөнийг таана.\n- Дэнсээр шалгаж, \"Хүнд нь доошилсон\" гэж хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Дүрт тоглоомын буланд \"Бээлийний дэлгүүр\" орчин бүрдүүлж, хүүхдүүд бараагаа хэрхэн дүрсэлж байгааг ажиглана.","learner":"- Худалдагч болж \"Энэ бээлий зөөлөн, дулаан, урт\" гэж бараагаа дүрсэлнэ.\n- Худалдан авагч болж хүссэн бээлийнхээ шинжийг хэлж худалдаж авна."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – хоёр дахь уншлага (2): «Бээлий» (Төлөвлөгөөний хуудсыг 01.04-ний төлөвлөлтийн дараа үзнэ үү.)\n- Номын тухай эргэн сануулах асуулт асууна: «Амьтад бээлийд орохдоо юу гэж асуусан бэ?»\n- Түр зогсож асуух: «Туулай ямар үстэй вэ?», «Чоно, үнэг хоёрын аль нь том бэ?»\n- Шинэ үг: «Даарах», «Шахах» – биеэр үзүүлэх\n- Уншсаны дараа: Амьтдын зургийг жижгээс том руу дараалуулах","learner":"- Номын эхлэлийг санаж, \"Өвгөн бээлийгээ гээсэн\" гэж ярина.\n- Туулайг \"сэвсгэр, цагаан\" гэж шинж чанарын үгээр дүрсэлнэ.\n- Амьтдыг хэмжээгээр нь харьцуулж \"Чоно үнэгнээс том\" гэж хэлнэ.\n- «Даарах», «Шахах» үгийг биеэрээ үзүүлнэ.\n- Амьтдын зургийг жижгээс том руу дараалуулна."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Хэл ярианы төв: \"Ид шидийн уут\" – уутнаас юм тэмтэрч, шинж чанарыг нь хэлэх.\nМатематикийн төв: Туузыг урт, дунд, богино гэж дараалуулах; дэнсээр 2 зүйлийг харьцуулах.\nУрлагийн төв: Цаасан бээлийг хээ угалзаар чимэглэх.","learner":"Хэл ярианы төв:\n- Нүдээ аниад уутнаас юм тэмтэрч, \"Энэ зөөлөн, дугуй, хөнгөн\" гэж дүрслээд нэрийг нь таана.\nМатематикийн төв:\n- Гурван туузыг урт, дунд, богино гэж дараалуулна.\n- Дэнсээр хоёр зүйлийг харьцуулж хүнд, хөнгөнийг хэлнэ.\nУрлагийн төв:\n- Цаасан бээлийгээ хээ угалзаар чимэглэж, хээгээ дүрсэлнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 2 (1). Ажиглалт: Өвлийн хус модыг ажиглах\nЗорилго: Өвлийн улирлын байгаль дахь модыг ажиглах, намрын улирлын модноос ялгарах онцлогийг ярилцах.\nАжиглалтын явц:\n- Багш хүүхдүүдийг хус модны дэргэд аюулгүй зайтай зогсоож, модыг хамтдаа ажиглуулна.\n- Багшийн яриа: «Хүүхдүүд ээ, бид өнөөдөр өвлийн улирлын хус мод ямар болсныг ажиглана. Зуны улиралд хус мод ногоон навчтай байдаг. Харин өвөл навч нь унаж, мөчир нь нүцгэрсэн байна. Гэхдээ хус мод үхээгүй, амьд хэвээрээ байдаг. Өвөл мод амарч, хавар дахин нахиалж, навчлана.»\n- Хүүхдийн анхаарлыг модны хэсгүүдэд чиглүүлнэ: «Их бие нь ямар өнгөтэй байна вэ?», «Мөчир нь ямар болсон байна вэ?», «Мөчир дээр цас тогтсон байна уу?», «Навч байна уу, эсвэл унасан байна уу?»\n- Багшийн мэдээлэл: Өвлийн улиралд модны мөчир, нахиа хүйтэнд эмзэг, хэврэг болдог. Тиймээс бид модны мөчрийг татаж, хугалж болохгүй. Мөчир дээр тогтсон цасыг хүчтэй сэгсэрч болохгүй.\n- Хүүхдээс асуух асуулт: «Хус мод өвөл ямар болсон байна вэ?», «Яагаад навчгүй болсон бэ?», «Мод өвөл амьд хэвээрээ байдаг уу?», «Мод өвөл яагаад \"амарч байна\" гэж хэлж болох вэ?», «Хүйтэнд модны мөчир, нахиа ямар болдог вэ?», «Бид модонд яаж гамтай хандах вэ?»","learner":"- Хус модны дэргэд аюулгүй зайтай зогсоно.\n- Их биеийн цагаан өнгийг нэрлэж, мөчир нь нүцгэн болсныг хэлнэ.\n- Мөчир дээр тогтсон цасыг ажиглана, газар унасан навч хайна.\n- Гацуур (өвөл ногоон), хус (навчгүй) хоёрыг харьцуулна.\n- \"Мод үхээгүй, амарч байна, хавар нахиална\" гэж тайлбарлана.\n- \"Мөчрийг татахгүй, хугалахгүй\" гэж модонд гамтай хандах дүрмийг хэлнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Би юу бодов?»\nЗорилго: Шинж чанарын үгээр юмыг дүрслэх, таах.\nЯвц:\n1. Багш \"Би цагаан, хүйтэн, зөөлөн юм бодлоо\" гэж дүрсэлнэ (цас).\n2. Хүүхдүүд таана.\n3. Дараа нь хүүхэд өөрөө юм бодож, 3 шинжээр дүрсэлнэ.\nДүрэм: Юмны нэрийг хэлэхгүй, зөвхөн шинжийг хэлнэ.\nДүгнэлт: Өнөөдөр сурсан шинж чанарын үгсээ давтана.","learner":"- Багшийн дүрслэлийг сонсож юуг бодсоныг таана.\n- Ээлжээр өөрөө юм бодож, нэрийг нь хэлэлгүй 3 шинжээр дүрсэлнэ.\n- Шинж чанарын үгсээ давтана."}]},"2028-01-07":{"method":"Тоглоомонд суурилсан арга","link":"МАТ3.1а. 10 хүртэлх тоог цээжээр тоолох, 5 хүртэлх тооны юмсыг оноож тоолох, өгсөн тооноос эхэлж 1-ээр нэмэгдүүлэн тоолох, тоог жишнэ (бодит юмсын олон, цөөнийг ялгаж жиших).","competence":"Биеийн хөдөлгөөний чадвар (хоёр хөлөөр зураас давж үсрэх), тоолох чадвар","materials":"Шалан дээр 60 см зайтай наасан 10 тууз, 1-10 тооны карт, дэвсгэр, конус, цаасан мэлхий","criteria":"Хоёр хөлөө нийлүүлэн 10 зураас давж тасралтгүй үсэрч, зөөлөн газарддаг. Үсрэлт бүрээ 10 хүртэл цээжээр тоолдог.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, биеэ халаах дасгал (өвдөг нугалах, байрандаа хөнгөн үсрэх) хийлгэнэ.","learner":"- Мэндчилж тойрогт зогсоно.\n- Өвдгөө нугалж, тэнийлгэж хөлөө халаана.\n- Байрандаа 5 удаа хөнгөн үсэрч тоолно."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Зааж үзүүлэх: Хоёр хөлөө нийлүүлэн, гараа хойш савлаж урагш үсрэх, өвдгөө нугалж зөөлөн газардахыг үзүүлнэ.\n- Зураас давах: 60 см зайтай 10 туузыг нэг нэгээр давж үсрүүлнэ. Удаа бүрийг хамтдаа тоолно.\n- \"Мэлхий тоолно\": Тууз бүрийн хажууд 1-10 тооны карт тавьж, үсэрсэн тоогоо картаар шалгуулна.\nБагшийн чиглүүлэх асуулт:\n1. Үсрэхдээ гараа яаж савлах вэ?\n2. Хэдэн зураас давсан бэ?\n3. Газардахдаа өвдгөө яах вэ?","learner":"Зааж үзүүлэх:\n- Багшийг ажиглаад хоёр хөлөө нийлүүлж, гараа хойш савлан урагш үсэрнэ.\n- Өвдгөө нугалж зөөлөн газардана.\nЗураас давах:\n- 10 туузыг нэг нэгээр давж үсэрнэ.\n- Үсрэлт бүрээ чангаар \"Нэг, хоёр, ... арав\" гэж тоолно.\n\"Мэлхий тоолно\":\n- Үсэрч дуусаад хамгийн сүүлийн туузны хажуух тооны картыг харж \"Би 10 зураас давлаа\" гэж хэлнэ.\nАсуултад хариулах:\n- Гараа хэрхэн савласнаа үзүүлж тайлбарлана."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Хөдөлгөөний буланд тууз, дэвсгэр байрлуулж, хүүхдүүдийн бие даан үсрэхийг ажиглана.","learner":"- Туузан дээгүүр үсэрч тоглоно.\n- Найзынхаа үсрэлтийг тоолж өгнө."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Мэлхийн тухай тоолох шүлэг (\"Таван мэлхий\") уншиж, хуруугаараа тоолуулна.","learner":"- Шүлгийг сонсож давтан хэлнэ.\n- Мэлхий нэг нэгээр үсрэх бүрт хуруугаа нэгээр нугалж тоолно."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Математикийн төв: 1-10 тооны карт, тоглоомон мэлхий бэлтгэж, карт бүр дээр харгалзах тооны мэлхий тавиулна.\nХөдөлгөөний төв: \"Үсрэх зам\" – тооны картын дээгүүр үсэрч тоолох.\nУрлагийн төв: Цаасан мэлхий эвхэх.","learner":"Математикийн төв:\n- Тооны картыг 1-ээс 10 хүртэл дараалуулна.\n- Карт бүр дээр тохирох тооны мэлхий оноож тавина.\nХөдөлгөөний төв:\n- Тооны картын дээгүүр үсэрч, гишгэсэн тоогоо чангаар хэлнэ.\nУрлагийн төв:\n- Цаасыг нугалж мэлхий эвхэнэ, мэлхийгээ үсрүүлж тоглоно."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 2 (2). Хөдөлмөрийн үйл ажиллагаа: Модны ёроолыг цасаар хучих\nЗорилго:\n- Модны ёроолыг цасаар хучих ажилд оролцох\n- Модны ойр орчмыг цэвэр байлгах, хог хаягдлыг ялгах, байгальд хайр халамжтай хандах\n- Багшийн зааварчилгааг дагаж хамтран ажиллах чадварт суралцах\nАжиллагааны явц:\n- Модны ойролцоох хог, цас байвал түүж зориулалтын саванд хийх\n- Модны ёроолыг цасаар хучих (цас авах жижиг хүрз, цас зөөх жижиг хувин хэрэгтэй)\n- Хүүхдүүд модны ойролцоох цасыг хувин, хүрз ашиглан зөөж модны доод ёроолд овоолуулна.\nБагшийн санамж:\n- Мөчир татах, хугалах үйлдэл хийлгэхгүй.\n- Хүйтэн үед хүүхдийн бээлий, хувцаслалт тохиромжтой эсэхийг анхаарна.","learner":"- Модны ойролцоох хогийг түүж, зориулалтын саванд хийнэ.\n- Жижиг хүрзээр цасыг хувинд хийнэ.\n- Хувинтай цасаа модны ёроолд зөөж овоолно.\n- Мөчрийг татахгүй, хугалахгүй болгоомжтой ажиллана.\n- \"Цас модны үндсийг хүйтнээс хамгаална\" гэж ажлынхаа утгыг хэлнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Мэлхий тоолно»\nЗорилго: Үсрэх хөдөлгөөн хийх, тоо тоолох.\nЯвц:\n1. Багш \"Мэлхий 3 удаа үсэрнэ!\" гэж хэлнэ.\n2. Хүүхдүүд мэлхий шиг суугаад 3 удаа үсэрч чангаар тоолно.\n3. Тоог өөрчилж (5, 7, 10) давтана.\nДүрэм: Хэлсэн тооноос илүү үсрэхгүй.\nДүгнэлт: Хамгийн олон хэдэн удаа үсэрсэнээ хэлнэ.","learner":"- Багшийн хэлсэн тоог сонсоно.\n- Мэлхий шиг суугаад тэр тооны удаа үсэрч чангаар тоолно.\n- Хэлсэн тоонд зогсоно.\n- Хамгийн олон үсэрсэн тоогоо хэлнэ."}]},"2028-01-08":{"method":"Бүтээлч үйл ажиллагаанд суурилсан арга","link":"НСХ3.1а. Сэтгэл хөдлөлөө таатай, таагүй байгааг илэрхийлдэг болно.","competence":"Бүтээлчээр сэтгэх (бүтээлдээ тохирох өнгө сонгох), сэтгэл хөдлөлөө өнгөөр илэрхийлэх","materials":"Будаг (гуаш), бийр, ус, цагаан цаас, сэтгэл хөдлөлийн нүүрний карт, «Өнгөний сэтгэл» үзүүлэн, бээлийний загвар цаас","criteria":"Бүтээлдээ тохирох өнгийг сонгож будаж, яагаад тэр өнгийг сонгосноо тайлбарладаг. Сэтгэл хөдлөлөө таатай, таагүй гэж илэрхийлдэг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Сэтгэл хөдлөлийн цаг\" самбарт өнөөдрийн сэтгэлээ байрлуулахыг урина.","learner":"- Мэндчилж тойрогт сууна.\n- Өнөөдрийн сэтгэлээ илэрхийлсэн нүүрний картыг сонгож самбарт байрлуулна.\n- \"Би өнөөдөр ... байна, учир нь ...\" гэж хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Өнгө ба сэтгэл: «Өнгөний сэтгэл» үзүүлэнгээр шар – баяртай, хөх – гунигтай, улаан – уурласан, ногоон – тайван гэх мэтээр танилцуулна.\n- Өнгө сонгох: \"Баяртай байхдаа чи ямар өнгө сонгох вэ?\" гэж асууж, өөрийн сонголтыг хийлгэнэ.\n- Будах: Бээлийний загварыг сэтгэлдээ тохирох өнгөөр будуулж, хүүхэд бүрээс \"Яагаад энэ өнгийг сонгосон бэ?\" гэж асууна.\nБагшийн чиглүүлэх асуулт:\n1. Энэ өнгө чамд ямар мэдрэмж төрүүлж байна?\n2. Гунигтай үед ямар өнгө тохирох вэ?\n3. Хоёр өнгө холивол юу болох вэ?","learner":"Өнгө ба сэтгэл:\n- Өнгө бүрийг нэрлэж, ямар сэтгэлийг илэрхийлж болохыг хэлнэ.\nӨнгө сонгох:\n- \"Би баяртай үедээ шар өнгө сонгоно\" гэж өөрийн сонголтоо хэлнэ.\nБудах:\n- Бээлийний загварыг өөрийн сэтгэлд тохирох өнгөөр будна.\n- Бийрээ усаар угааж, өнгө солихдоо цэвэрлэнэ.\n- \"Би ... өнгө сонгосон, учир нь ...\" гэж тайлбарлана.\nАсуултад хариулах:\n- Хоёр өнгө холиход шинэ өнгө гарахыг ажиглаж хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Урлагийн буланд будаг, өнгийн харандаа байрлуулж, хүүхдүүдийн өнгө сонголтыг ажиглана.","learner":"- Өөрийн санаагаар зурж будна.\n- Найздаа зургийнхаа өнгийг тайлбарлана."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – гурав дахь уншлага (3): «Бээлий» (Төлөвлөгөөний хуудсыг 01.04-ний төлөвлөлтийн дараа үзнэ үү.)\n- Номын үйл явдлыг хүүхдүүдээр түлхүү яриулна.\n- Дүгнэн ярилцах: «Амьтад бие биедээ байр тавьж өгсөн нь зөв үү? Яагаад?»\n- Шинэ үгсээр өгүүлбэр зохиох: гээх, сэвсгэр, багтах, шахах, урагдах\n- Бүтээл: Цаасан бээлий будаж, дотор нь амьтдын зургийг нааж тоолох","learner":"- Номын нэр, зохиолч, зураачийг санаж хэлнэ.\n- Номын зургийг харж үлгэрийг өөрийн үгээр ярина.\n- \"Байр тавьж өгөх нь зөв, учир нь ...\" гэж санал бодлоо хэлнэ.\n- Шинэ үгсээр өгүүлбэр зохионо.\n- Будсан бээлийнийхээ дотор амьтдын зургийг нааж, хэд байгааг тоолно."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: Хоёр өнгө холих туршилт (шар + хөх, улаан + шар).\nХэл ярианы төв: Сэтгэл хөдлөлийн карт ба өнгийн картыг тааруулах.\nДүрт тоглоомын төв: \"Зургийн үзэсгэлэн\" – бүтээлээ өлгөж танилцуулах.","learner":"Урлагийн төв:\n- Хоёр өнгийг холиж, ямар шинэ өнгө гарсныг нэрлэнэ.\nХэл ярианы төв:\n- Сэтгэл хөдлөлийн картыг өнгөтэй тааруулж, сонголтоо тайлбарлана.\nДүрт тоглоомын төв:\n- Будсан бээлийгээ өлгөж, үзэсгэлэнгийн хөтөч болж бусдад танилцуулна."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 2 (3). Хөдөлгөөнт тоглоом: «Туг хэнд очих вэ?»\nЗорилго:\n- Буухиа хэлбэрээр тоглох чадварыг хөгжүүлэх\n- Уртад үсрэх, цагираг дундуур мөлхөх хөдөлгөөнийг дэмжих\n- Авхаалж самбаа, шийдэмгий байдал, хурдан харьцах үйлдлийг хөгжүүлэх\n- Багаар хамтран тоглох, дүрэм баримтлах чадварыг төлөвшүүлэх\nХэрэглэгдэхүүн: Жижиг туг; 2–3 ширхэг цагираг; конус эсвэл тэмдэглэгээ; эхлэх ба дуусах шугам\nТоглоомын бэлтгэл: Хүүхдүүдийг 2 багт хуваана. Баг бүрийн өмнө нэг ижил зам байгуулна.\nТоглоомын явц: Багшийн дохиогоор баг бүрийн эхний хүүхэд туг авч уртаар үсрэн цагираг хүртэл явж, цагираг дундуур мөлхөж гараад буцаж гүйж ирнэ. Тугийг дараагийн хүүхдэд дамжуулна. Дараагийн хүүхэд мөн адил даалгаврыг гүйцэтгэнэ. Бүх хүүхэд ээлжээр оролцоно.\nДүрэм:\n1. Найзаа түлхэхгүй.\n2. Цагираг дундуур болгоомжтой мөлхөнө.\n3. Тугийг газарт унагахгүй, дараагийн хүүхдэд зөөлөн өгнө.\n4. Багшийн дохиогоор эхэлж, дохиогоор зогсоно.\n5. Хурдлахаас илүү зөв, аюулгүй гүйцэтгэхийг анхаарна.","learner":"- Багтаа нэгдэж эхлэх шугам дээр ээлжээ хүлээнэ.\n- Багшийн дохиогоор туг барин уртаар үсэрсээр цагираг хүртэл явна.\n- Цагираг дундуур болгоомжтой мөлхөж гарна.\n- Буцаж гүйж ирээд тугийг дараагийн найздаа зөөлөн өгнө.\n- Найзаа түлхэхгүй, тугаа унагахгүй байх дүрмийг баримтална.\n- Багийнхаа найзуудыг урамшуулна."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Өнгөө ол»\nЗорилго: Өнгийг хурдан таньж, сэтгэлээ илэрхийлэх.\nЯвц:\n1. Өрөөний янз бүрийн газар өнгөт цаас наана.\n2. Багш \"Баяртай өнгө!\" гэхэд хүүхдүүд өөрийн баяртай өнгө рүү гүйнэ.\n3. \"Яагаад энэ өнгө?\" гэж хэдэн хүүхдээс асууна.\nДүрэм: Гүйхгүй, алхаж очно.\nДүгнэлт: Өнөөдөр ямар өнгө хамгийн их таалагдсаныг ярилцана.","learner":"- Багшийн хэлсэн сэтгэлд тохирох өнгө рүү алхаж очно.\n- Сонголтынхоо шалтгааныг хэлнэ.\n- Өнөөдөр таалагдсан өнгөө нэрлэнэ."}]},"2028-01-11":{"method":"Зохиолд суурилсан арга","link":"ЗУ3.2б. Өөрийн бүтээлдээ тохирох өнгийг сонгож будна.","competence":"Нийгэм, сэтгэл хөдлөлийн хөгжил (бухимдсан үедээ тайвшрах арга сонгох), бүтээлчээр сэтгэх (тайвшруулах өнгө сонгох)","materials":"«Хүчтэй болохыг хүссэн Бат» зурагт карт, «Тайвшрах булан»-ы 4 аргын карт, хөөсөн бөмбөлөг үлээгч, мандал зураг (будах загвар), өнгийн харандаа","criteria":"Уурлаж тавгүйтсэн үедээ гүнзгий амьсгаа авах, тоолох, «Тайвшрах булан»-д очих зэргээр тайвширдаг. Тайвшруулах зурагт өөрт тохирох өнгийг сонгож буддаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Чамайг юу бухимдуулдаг вэ?\" гэж асууж, хүүхдүүдийн хариултыг сонсоно.","learner":"- Мэндчилж тойрогт сууна.\n- Өөрийг нь бухимдуулдаг нөхцөлийг (\"Тоглоомд ялагдахад\", \"Зургаа урахад\") хэлнэ.\n- Найзынхаа хариултыг сонсоод \"Би ч бас ...\" гэж нэмнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Тайвшрах аргаа сануулах: «Тайвшрах булан»-ы 4 аргыг (гүнзгий амьсгаа, 5 хүртэл тоолох, тайвшруулах лонх, ярилцах) давтана.\n- \"Бөмбөлөг үлээе\": Хөөсөн бөмбөлөг үлээж, аажуухан амьсгалах дасгал хийлгэнэ.\n- Нөхцөл байдал шийдэх: \"Найз чинь дараалалд чамайг түлхчихлээ\" зэрэг нөхцөлд юу хийхийг дүрд тоглуулна.\n- Тайвшруулах зураг: Мандал зургийг дуртай тайван өнгөөрөө будуулна.\nБагшийн чиглүүлэх асуулт:\n1. Уурласан үедээ биед чинь юу болдог вэ?\n2. Аль арга чамд илүү тусалдаг вэ?\n3. Ямар өнгө чамайг тайвшруулдаг вэ?","learner":"Тайвшрах аргаа сануулах:\n- 4 аргын картыг харж нэрлэж, тус бүрийг үйлдлээр үзүүлнэ.\n\"Бөмбөлөг үлээе\":\n- Хамраараа гүнзгий амьсгаа аваад, аажуухан үлээж хөөсөн бөмбөлөг гаргана.\n- Бөмбөлөг нисэхийг ажиглан тайвширна.\nНөхцөл байдал шийдэх:\n- Нөхцөлийг сонсоод \"Би эхлээд тав хүртэл тоолоод, дараа нь найздаа хэлнэ\" гэж шийдлээ хэлж, дүрд тоглоно.\nТайвшруулах зураг:\n- Мандал зургийг өөрт тайван санагддаг өнгөөр будна.\n- \"Хөх өнгө надад тайван санагддаг\" гэж сонголтоо тайлбарлана."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Тоглох үед маргааныг ажиглаж, хүүхдүүд тайвшрах аргаа хэрэглэж байгааг урамшуулна.","learner":"- Найзуудтайгаа тоглоно.\n- Бухимдвал «Тайвшрах булан»-д очиж аргаа сонгоно.\n- Тайвширсны дараа найздаа \"Би бухимдсан, учир нь ...\" гэж хэлнэ."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – эхний уншлага (1): «Хүчтэй болохыг хүссэн Бат» (Чанга уншлагын төлөвлөгөөний хуудсыг үзнэ үү.)\n- Номын нэр, хавтас, зохиолч, зураачийг танилцуулж, хэмнэлийг алдагдуулахгүй уншина.\n- Түр зогсож асуух: «Бат тайвшрахын тулд юу хийх бол?»\n- Шинэ үг: «Бухимдах – сэтгэл нь тавгүйтэх»\n- Уншсаны дараа: «Бат яаж хүчтэй болсон бэ?»","learner":"- Номын хавтсыг харж \"Энэ ном ... тухай байх\" гэж таамаглана.\n- Багшийн уншихыг анхааралтай сонсоно.\n- Түр зогсох үед Бат тайвшрахын тулд юу хийхийг таамаглана.\n- «Бухимдах» үгийг давтан хэлж, утгыг нь хэлнэ.\n- \"Бат эрүүл хоол идэж хүчтэй болсон\" гэж хариулна."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: Мандал, цасан ширхгийн будах загвар бэлтгэнэ.\nХэл ярианы төв: \"Би ... үед бухимддаг, тэгэхэд би ...\" өгүүлбэр зохиох карт.\nТайвшрах булан: Тайвшруулах лонх, зөөлөн дэр, амьсгалын карт байрлуулна.","learner":"Урлагийн төв:\n- Мандал, цасан ширхгийн загварыг өөрийн сонгосон өнгөөр будна.\nХэл ярианы төв:\n- Картыг харж \"Би ... үед бухимддаг, тэгэхэд би ...\" гэж өгүүлбэр зохионо.\nТайвшрах булан:\n- Тайвшруулах лонхыг сэгсэрч, гялтгануур буухыг ажиглан амьсгаагаа тохируулна."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 2 (4). Ганцаарчилсан үйл ажиллагаа (зугаалгын дараах үйл ажиллагаа): «Өвлийн модонд юу санагдаж байгаа бол?»\nЗорилго:\n- Хүүхдийн ажигласан зүйлээ өөрийн үгээр илэрхийлэх чадварыг дэмжих\n- Байгаль, модонд хайр халамжтай хандах сэтгэлийг хөгжүүлэх\n- Модны өвлийн байдлыг зургаар, наамлаар дүрслэх\n- Хүүхдийн бүтээлч сэтгэлгээ, ярих чадварыг дэмжих\nҮйл ажиллагааны хэлбэр: Хүүхэд бүр өөрийн сонгосон аргаар өвлийн модыг зурна эсвэл наамал бүтээл хийнэ.\nХэрэглэгдэхүүн: Цагаан болон өнгийн цаас; өнгийн харандаа, тосон харандаа; хөвөн, цагаан цаас, хөвсгөр материал; цавуу; навч, мөчир дүрслэх бэлдэц; цасан ширхгийн наамал\n- Багш хүүхэд бүртэй ганцаарчлан ярилцаж «Чиний мод өвөл юу бодож байгаа бол? Ямар санагдаж байгаа бол?» гэж асууна.\n«Байгалиа хайрлая, мод ургамлаа хамгаалъя!»","learner":"- Өвлийн модоо зурах эсвэл наамлаар хийхээ сонгоно.\n- Хус модны их бие, нүцгэн мөчрийг зурна, хөвөнгөөр мөчир дээрх цасыг наана.\n- Цасан ширхгийн наамлаар зургаа чимэглэнэ.\n- Багштай ярилцаж \"Миний мод даарч байгаа ч хаврыг хүлээж амарч байна\" гэх мэтээр модны \"санаа\"-г өөрийн үгээр хэлнэ.\n- Бүтээлээ найздаа танилцуулна."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Бөмбөлөг томорлоо»\nЗорилго: Амьсгалаа удирдах, тайван байх.\nЯвц:\n1. Хүүхдүүд гар гараасаа барьж жижиг тойрог үүсгэнэ.\n2. Амьсгаа авах бүрт ухарч тойргоо томруулна (\"бөмбөлөг томорч байна\").\n3. Багш \"Пүд!\" гэхэд бүгд аажуухан суугаад амьсгаагаа гаргана.\nДүрэм: Гараа салгахгүй; түлхэхгүй.\nДүгнэлт: \"Одоо ямар санагдаж байна?\" гэж ярилцана.","learner":"- Гар гараасаа барьж тойрог үүсгэнэ.\n- Гүнзгий амьсгаа авах бүрт нэг алхам ухарч тойргоо томруулна.\n- \"Пүд!\" гэхэд аажуухан суугаад амьсгаагаа гаргана.\n- Тоглоомын дараах мэдрэмжээ хэлнэ."}]},"2028-01-12":{"method":"Тоглоомонд суурилсан арга","link":"ХЭМ3.1и. Хоёр хөл дээр 10 зураас давж үсэрч бууна (зураас хоорондын зай 60 см).","competence":"Тоолох чадвар (10 хүртэл цээжээр тоолох, 5 хүртэл оноох, жиших), хөдөлгөөний чадвар","materials":"1-10 тооны карт, шоо, товч, аяга, шалан дээрх тууз, «Тооны шат» үзүүлэн","criteria":"10 хүртэл цээжээр тоолж, 5 хүртэлх тооны юмсыг оноож тоолдог. Өгсөн тооноос эхэлж 1-ээр нэмж тоолж, бодит юмсын олон, цөөнийг жишдэг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, хуруугаа тоолон 10 хүртэл, дараа нь 10-аас доош тоолох дуу дуулна.","learner":"- Мэндчилж тойрогт сууна.\n- Хуруугаа нэг нэгээр нь дэлгэн 10 хүртэл тоолно.\n- 10-аас 1 хүртэл буцаан тоолохыг оролдоно."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Цээжээр тоолох: Алга ташин 10 хүртэл, дараа нь багшийн хэлсэн тооноос (\"4-өөс эхэлье\") үргэлжлүүлэн тоолуулна.\n- Оноож тоолох: Хүүхэд бүрт 5 хүртэлх шоо өгч, нэг нэгээр нь хуруугаараа хүрч тоолуулна.\n- Жиших: Хоёр хүүхдийн шоог эгнүүлэн тавьж \"Хэнийх олон бэ? Хэнийх цөөн бэ?\" гэж асууна.\n- \"Тооны шат\": Шалан дээрх туузан шатаар үсэрч өгсөн тоо бүрийг хэлүүлнэ.\nБагшийн чиглүүлэх асуулт:\n1. 6-гийн дараа ямар тоо ирэх вэ?\n2. Чамд хэдэн шоо байна? Найзынхаас олон уу, цөөн үү?\n3. Хэдэн шат үсэрсэн бэ?","learner":"Цээжээр тоолох:\n- Алга ташингаа 10 хүртэл тоолно.\n- Багшийн хэлсэн тооноос (\"4\") эхэлж \"5, 6, 7...\" гэж үргэлжлүүлнэ.\nОноож тоолох:\n- Шоо бүрт хуруугаараа хүрч, нэг нэгээр нь тоолно.\n- \"Надад 5 шоо байна\" гэж нийт тоогоо хэлнэ.\nЖиших:\n- Найзынхаа шоотой эгнүүлэн тавьж харьцуулна.\n- \"Минийх олон, найзынх цөөн\" гэж хэлнэ.\n\"Тооны шат\":\n- Туузан шатаар хоёр хөлөөр үсэрч, тоо бүрийг чангаар хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Барилгын буланд шоо байрлуулж, хүүхдүүд хэдэн шоогоор цамхаг барьж байгааг тоолуулна.","learner":"- Шоогоор цамхаг барьж, хэдэн шоо хэрэглэснээ тоолно.\n- Найзынхаа цамхагтай өндрөөр нь харьцуулна."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Тоо тоолох зурагт ном (\"Нэгээс арав\") уншиж, хуудас бүрийн зургийг хүүхдүүдээр тоолуулна.","learner":"- Номын хуудас бүрийн зургийг хуруугаараа заан тоолно.\n- \"Энд 7 шувуу байна\" гэж бүтэн өгүүлбэрээр хэлнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Математикийн төв: Тооны карт (1-10) ба товч, аяга бэлтгэж, карт бүрт тохирох тооны товч хийлгэнэ.\nХөдөлгөөний төв: \"Тоо үсрэх\" – 1-10 картын дээгүүр үсрэх.\nУрлагийн төв: \"Миний тоо\" – тоог зурж, тэр тооны дугуй зурж будах.","learner":"Математикийн төв:\n- Тооны картыг харж, аяганд тохирох тооны товч хийнэ.\n- Хоёр аяганы товчийг харьцуулж олон, цөөнийг хэлнэ.\nХөдөлгөөний төв:\n- Тооны карт дээгүүр үсэрч, гишгэсэн тоогоо хэлнэ.\nУрлагийн төв:\n- Өөрийн дуртай тоог сонгож, тэр тооны дугуй зурж будна."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 3 (1). Ажиглалт: Өвөлждөг шувууг ажиглах\nЗорилго: Өвөлждөг шувуудын тухай ойлголтоо бататгах, шувуудыг ажиглах, харилцан ярилцах.\nЯвц:\n- Тэжээлийн савны ойролцоо ирсэн шувуудыг (хөхцөөхэй, бор шувуу) алсаас ажиглуулна.\n- Багшийн мэдээлэл: Тэд өвлийн улиралд ч хоол олж чаддаг. Нахиа, үр, жимс, нуугдсан шавж зэргээр хооллодог бөгөөд хүмүүсийн ойр орчимд хоол хайдаг. Өвлийн улиралд зарим шувууд хүйтнээс болж хоргодог. Хүмүүс өвөлждөг шувуудад туслахын тулд хөхцөөхэй шувуунд давсгүй өөх өгдөг, харин бор шувуудад шар будаа, наранцэцгийн үр өгдөг.\n- Хүүхдээс асуух асуулт: «Өвөлждөг шувууд гэж ямар шувуудыг хэлдэг вэ?», «Өвөлждөг шувууд юу иддэг вэ?», «Хүмүүс бид өвөлждөг шувуудад хэрхэн тусалж чадах вэ?»","learner":"- Шувууг үргээхгүйн тулд чимээгүй, алсаас ажиглана.\n- Ирсэн шувуудыг нэрлэж, өнгө, хэмжээг нь хэлнэ.\n- Шувуу юу идэж байгааг ажиглаж хэлнэ.\n- \"Өвөлждөг шувуу өвөл энд үлддэг\" гэж тайлбарлана.\n- Шувуунд тусалж болох аргыг (өөх, шар будаа, наранцэцгийн үр өгөх) нэрлэнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Тоо хэлэхэд алга таш»\nЗорилго: Тоог сонсож, тэр хэмжээгээр үйлдэл хийх.\nЯвц:\n1. Багш тооны карт үзүүлнэ.\n2. Хүүхдүүд тэр тооны удаа алга ташина.\n3. Дараа нь тэр тооны удаа үсэрнэ.\nДүрэм: Илүү, дутуу ташихгүй.\nДүгнэлт: Өнөөдөр хамгийн их хэдэн хүртэл тоолсноо хэлнэ.","learner":"- Тооны картыг харж нэрлэнэ.\n- Тэр тооны удаа алга ташиж, үсэрч тоолно.\n- Хамгийн их хэдэн хүртэл тоолсноо хэлнэ."}]},"2028-01-13":{"method":"Зохиолд суурилсан арга","link":"ЗУ3.2г. Баримлын шавар, элс, гурилан зуурмагаар хүн, амьтан, эд юмсыг зохиомжлон барина (гурав ба түүнээс дээш хэсгээс бүтсэн).","competence":"Эрүүл хооллолт (тустай хүнсийг ялгах), бүтээлчээр сэтгэх (гурилан зуурмагаар хүнсний дүрс барих)","materials":"«Хүчтэй болохыг хүссэн Бат» зурагт карт, хүнсний бүтээгдэхүүний загвар/карт, «тустай – тусгүй» гэсэн 2 сагс, гурилан зуурмаг, хуванцар хутга, цаасан таваг","criteria":"Хоол хүнсний бүтээгдэхүүнээс эрүүл мэндэд тустайг ялгаж нэрлэдэг. Гурилан зуурмагаар хүнсний дүрсийг гурав ба түүнээс дээш хэсгээс зохиомжлон барьдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Өнөөдөр өглөөний цайндаа юу идсэн бэ? Тэр нь биед тустай юу?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Өглөө идсэн хоолоо нэрлэнэ.\n- \"Сүү биед тустай, яс бэхжүүлдэг\" гэх мэтээр тустай эсэхийг хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Ангилах: Хүнсний картуудыг \"тустай\", \"тусгүй\" гэсэн 2 сагсанд ангилуулж, \"Яагаад?\" гэж асууна.\n- Батын таваг: Номын Батын идсэн хоолыг (сүү, мах, лууван, алим) санаж, эрүүл таваг бүрдүүлнэ.\n- Гурилан зуурмаг: Зуурмагаар алим, лууван, бууз зэрэг тустай хүнсийг хийж, цаасан таваг дээр байрлуулна.\nБагшийн чиглүүлэх асуулт:\n1. Аль хүнс биеийг хүчтэй болгодог вэ?\n2. Чихэр их идвэл юу болох вэ?\n3. Чиний таваг дээр ямар хүнс байна вэ?","learner":"Ангилах:\n- Хүнсний картыг харж нэрлэнэ.\n- \"Тустай\" эсвэл \"тусгүй\" сагсанд ангилж хийнэ.\n- \"Чихэр шүдийг гэмтээдэг тул тусгүй\" гэж шалтгааныг хэлнэ.\nБатын таваг:\n- Номын Батын идсэн хоолыг санаж нэрлэнэ.\n- Эрүүл таваг дээр тохирох хүнсний картуудыг байрлуулна.\nГурилан зуурмаг:\n- Зуурмагаар алим (бөмбөлөг + иш + навч), лууван, бууз зэрэг хүнсийг хэсгүүдээс нь нийлүүлж барина.\n- Цаасан таваг дээрээ байрлуулж, \"Миний эрүүл таваг\" гэж танилцуулна."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Дүрт тоглоомын буланд \"Гал тогоо\" орчин бүрдүүлж, хүүхдүүд ямар хоол \"хийж\" буйг ажиглана.","learner":"- Тогооч болж эрүүл хоол хийх дүр үзүүлнэ.\n- Найздаа \"Энэ хоол биед тустай, ид\" гэж санал болгоно."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – хоёр дахь уншлага (2): «Хүчтэй болохыг хүссэн Бат» (Төлөвлөгөөний хуудсыг 01.11-ний төлөвлөлтийн дараа үзнэ үү.)\n- Номын тухай эргэн сануулах асуулт асууна: «Ээж нь Батад юу гэж зөвлөсөн бэ?»\n- Түр зогсож асуух: «Таваг дээр ямар ямар хүнс байна вэ? Тоолоорой.»\n- Шинэ үг: «Чирэх», «Булчин чангалах» – үйлдлээр үзүүлэх\n- Уншсаны дараа: Хүнсний картыг «тустай – тусгүй» гэж ангилах","learner":"- Ээжийн зөвлөгөөг санаж ярина.\n- Номын зургаас таваг дээрх хүнсийг тоолж нэрлэнэ.\n- «Чирэх», «Булчин чангалах» үгийг үйлдлээр үзүүлнэ.\n- Хүнсний картыг «тустай – тусгүй» гэж ангилна."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: Гурилан зуурмаг, шавар бэлтгэж, жимс, ногоо барих.\nМатематикийн төв: Хүнсний картыг өнгөөр нь (улаан, шар, ногоон) ангилж тоолох.\nДүрт тоглоомын төв: \"Хүнсний дэлгүүр\" – тустай хүнс худалдах, худалдан авах.","learner":"Урлагийн төв:\n- Зуурмаг, шавраар жимс, ногоог гурав ба түүнээс дээш хэсгээс барина.\nМатематикийн төв:\n- Хүнсний картыг өнгөөр нь ангилж, бүлэг бүрийг тоолно.\nДүрт тоглоомын төв:\n- Худалдан авагч болж зөвхөн тустай хүнс сонгон \"худалдаж\" авна."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 3 (2). Хөдөлмөрийн ажиллагаа: «Цасан хотхон барихад зориулж цас цуглуулах»\nЗорилго: Хамтран ажиллах чадварт суралцах.\nТоглоомын хэлбэр: «Цасан хотын бяцхан барилгачид»\nЯвц:\n- Талбайг 3 тодорхой хэсэгт хуваана: цас цуглуулах бүс (ойролцоох аюулгүй хэсэг); зөөх зам (саваа/туузаар чиглэлийг тэмдэглэнэ); цасан хотхон барих бүс (өргөн, чөлөөтэй талбай).\n- Хүүхдүүдийг 3–4 хүүхэдтэй баг болгон хуваана. Хүүхдүүд хоорондоо 1–2 м зай барина.\n- Цас цуглуулах, зөөх, барих үүргийг ээлжлэн солино.\nБагш: Талбайг бүхэлд нь харах боломжтой байрлалд зогсоно; хөдөлгөөнийг удирдаж, аюулгүй байдлыг хянана; хүүхдүүдэд чиглэл өгч, урамшуулна.\nАнхаарах зүйлс: Хэт удаан гадаа байлгахгүй. Дулаан хувцас, бээлий заавал өмсгөнө. Гулгамтгай, аюултай газраас хол тоглуулна. Ачааллыг насанд тохируулж богино хугацаанд явуулна. Өрсөлдөөнөөс илүү хамтын ажиллагааг дэмжинэ.","learner":"- Багтаа нэгдэж, цас цуглуулагч, зөөгч, барилгачны үүргээ хуваарилна.\n- Цуглуулах бүсээс хүрзээр цас авч хувинд хийнэ.\n- Тэмдэглэсэн замаар цасаа барих бүс рүү зөөнө.\n- Цасаар хана, байшин барьж цасан хотхон босгоно.\n- Үүргээ ээлжлэн сольж, найзуудаасаа 1–2 м зай барина.\n- Багийнхаа ажлыг бусдад танилцуулна."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Тустай бол алга таш»\nЗорилго: Тустай, тусгүй хүнсийг хурдан ялгах.\nЯвц:\n1. Багш хүнсний нэр хэлнэ.\n2. Тустай бол хүүхдүүд алга ташина, тусгүй бол гараа хөндлөн тавина.\n3. Хүүхдүүд ээлжлэн хүнсний нэр хэлж тоглоомыг удирдана.\nДүрэм: Бусдын хариултыг шоолохгүй.\nДүгнэлт: Маргааш ямар тустай хоол идэхээ хэлнэ.","learner":"- Хүнсний нэрийг сонсоод тустай бол алга ташина, тусгүй бол гараа хөндлөн тавина.\n- Ээлжээр хүнсний нэр хэлж тоглоомыг удирдана.\n- Маргааш идэх тустай хоолоо нэрлэнэ."}]},"2028-01-14":{"method":"Шинжлэн судлах арга","link":"ХЭМ3.1м. Бөмбөгийг дээш шидээд газарт ойлгон барьж авна.","competence":"Шүүн тунгаах (дүрс, биетийг ялгах), биеийн хөдөлгөөний чадвар (бөмбөг шидэж барих)","materials":"Дугуй, гурвалжин, дөрвөлжин дүрс (картон), бөмбөг, шоо, конус, «Ид шидийн уут», бөмбөг (хүүхэд бүрт)","criteria":"Дугуй, гурвалжин, дөрвөлжин дүрсийг нэрлэж, хавтгай дүрс ба биетийг (бөмбөг, шоо) ялгадаг. Бөмбөгийг дээш шидээд газарт ойлгон барьж авдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, өрөөнд байгаа юмсаас дугуй, гурвалжин, дөрвөлжин хэлбэртэйг олуулна.","learner":"- Мэндчилж тойрогт сууна.\n- Өрөөнөөс цаг (дугуй), цонх (дөрвөлжин), гацуурын зураг (гурвалжин) зэргийг олж нэрлэнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Дүрстэй танилцах: Дугуй, гурвалжин, дөрвөлжин дүрсийг үзүүлж, өнцөг, талыг нь хуруугаараа дагуулж тоолуулна.\n- Дүрс ба биет: Дугуй (хавтгай) ба бөмбөг (биет), дөрвөлжин ба шоог харьцуулж \"Аль нь өнхөрдөг вэ?\" гэж туршуулна.\n- \"Ид шидийн уут\": Уутнаас дүрс, биет тэмтэрч, нэрийг нь хэлүүлнэ.\nБагшийн чиглүүлэх асуулт:\n1. Гурвалжин хэдэн өнцөгтэй вэ?\n2. Бөмбөг, дугуй хоёр юугаараа ялгаатай вэ?\n3. Аль нь өнхөрсөн бэ? Яагаад?","learner":"Дүрстэй танилцах:\n- Дүрс бүрийг нэрлэнэ.\n- Хуруугаараа талыг нь дагуулж, өнцгийг тоолно (\"Гурвалжин 3 өнцөгтэй\").\nДүрс ба биет:\n- Дугуй ба бөмбөг, дөрвөлжин ба шоог гартаа барьж харьцуулна.\n- Ширээн дээр өнхрүүлж үзээд \"Бөмбөг өнхөрдөг, шоо өнхөрдөггүй\" гэж хэлнэ.\n\"Ид шидийн уут\":\n- Уутанд гараа хийж тэмтрээд \"Энэ шоо, булантай\" гэж таана."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Барилгын буланд шоо, цилиндр, конус байрлуулж, хүүхдүүд ямар биет ашиглаж байгааг ажиглана.","learner":"- Биетүүдээр барилга барина.\n- Ашигласан биетийнхээ нэрийг хэлнэ."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Дүрсний тухай шүлэг (\"Дугуй нар\") уншиж, дүрс бүрийг гараараа агаарт зуруулна.","learner":"- Шүлгийг сонсож давтан хэлнэ.\n- Дүрс бүрийг гараараа агаарт зурна."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Математикийн төв: Дүрсүүдийг хэлбэрээр нь ангилах; дүрсээр байшин, машин бүтээх.\nУрлагийн төв: Дугуй, гурвалжин, дөрвөлжин өнгийн цаасаар \"Цасан хүн, гацуур, байшин\" наамал хийх.\nХөдөлгөөний төв: Бөмбөгийг дугуй цагираг руу шидэх.","learner":"Математикийн төв:\n- Дүрсүүдийг хэлбэрээр нь ангилж тоолно.\n- Дүрсүүдээр байшин, машин бүтээж, ямар дүрс хэрэглэснээ хэлнэ.\nУрлагийн төв:\n- Дүрсүүдийг нийлүүлж цасан хүн, гацуур, байшин наана.\nХөдөлгөөний төв:\n- Бөмбөгийг цагираг руу онилж шиднэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 3 (3). Хөдөлгөөнт тоглоом: «Зам дээр хэн илүү хурдан вэ?» («Өнгөт арал дээрх аялал»)\nЗорилго: Хоёр хөлөөр урагш үсрэх, тэнцвэрээ хадгалах, багаар тоглох.\nХэрэглэгдэхүүн: Өнгөт дугуй цаас (картон), цагираг, хальтардаггүй шал эсвэл талбай, шүгэл\nЯвц:\n- Өнгөт дугуй цаасыг \"арал\" болгон зам дагуу тодорхой зайтай байрлуулна.\n- Хүүхдүүдийг 3–4 хэсэгт хуваана.\n- Шүгэл дуугарахад хүүхдүүд арлаас арал руу хоёр хөлөөр үсэрч, замын төгсгөлийн цагирагт хүрнэ.\nАнхаарах зүйл: Арал хоорондын зайг насны онцлогт тохируулах; хэт хурдлуулахгүй, зөв техникээр хийлгэх.","learner":"- Багтаа нэгдэж эхлэх цэг дээр ээлжээ хүлээнэ.\n- Шүгэл дуугарахад арлаас арал руу хоёр хөлөөр үсэрнэ.\n- Арал дээр зөөлөн газардаж, тэнцвэрээ хадгална.\n- Цагирагт хүрээд буцаж ирэн дараагийн найздаа ээлж өгнө.\n- Арлын өнгийг нэрлэж үсэрнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Дүрсний байшин»\nЗорилго: Дүрсийг хурдан таньж ялгах, бөмбөг барих.\nЯвц:\n1. Шалан дээр дугуй, гурвалжин, дөрвөлжин \"байшин\" зурна.\n2. Багш бөмбөг шидээд дүрсний нэрийг хэлнэ.\n3. Бөмбөг барьсан хүүхэд тэр дүрсний байшин руу очно.\nДүрэм: Бөмбөгийг буулгавал дахин оролдоно.\nДүгнэлт: Байшин бүрт хэдэн хүүхэд байгааг тоолно.","learner":"- Багшийн шидсэн бөмбөгийг барина.\n- Сонссон дүрсний байшин руу очно.\n- Байшин бүрт байгаа хүүхдүүдийг тоолно."}]},"2028-01-15":{"method":"Тоглоомонд суурилсан арга","link":"МАТ3.3б. Дугуй, гурвалжин, дөрвөлжин дүрсүүдийг нэрлэж, дүрс, биетийг ялгана.","competence":"Бичих бэлтгэл (энгийн зураасыг дагуулж зурах), дүрс ялгах","materials":"Цэгэн зураастай ажлын хуудас (шулуун, тахир, долгионт зураас, дугуй, гурвалжин, дөрвөлжин), өнгийн харандаа, элсэн хайрцаг, тууз","criteria":"Энгийн зураас болон дүрсийг цэгийн дагуу тасралтгүй дагуулж зурдаг. Зурсан дүрсээ нэрлэж ялгадаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, хуруугаараа агаарт шулуун, долгионт зураас, дугуй, гурвалжин зуруулна.","learner":"- Мэндчилж тойрогт сууна.\n- Багшийг дуурайн агаарт зураас, дүрс зурна.\n- Зурсан зүйлийнхээ нэрийг хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Элсэн дээр: Элсэн хайрцагт хуруугаараа шулуун, тахир зураас, дугуй, гурвалжин зуруулна.\n- Харандаа барих: Гурван хуруугаар харандаа барих аргыг үзүүлж, хүүхэд бүрийг шалгана.\n- Цэгэн зураас дагуулах: Ажлын хуудсан дээрх цэгэн зураас, дүрсийг тасралтгүй дагуулж зуруулна.\n- Дүрс таних: Зурсан дүрсээ нэрлүүлж, өнгөөр будуулна.\nБагшийн чиглүүлэх асуулт:\n1. Энэ зураас ямар хэлбэртэй вэ?\n2. Гурвалжин зурахдаа хэдэн удаа эргэсэн бэ?\n3. Харандаагаа яаж барих вэ?","learner":"Элсэн дээр:\n- Элсэн хайрцагт хуруугаараа зураас, дүрс зурна.\nХарандаа барих:\n- Харандаагаа гурван хуруугаараа зөв барина.\nЦэгэн зураас дагуулах:\n- Цэгэн зураасыг зүүнээс баруун тийш тасралтгүй дагуулж зурна.\n- Дугуй, гурвалжин, дөрвөлжинг цэгийн дагуу зурна.\nДүрс таних:\n- Зурсан дүрсээ нэрлэж, гурвалжин 3, дөрвөлжин 4 өнцөгтэйг тоолж хэлнэ.\n- Дүрс бүрийг өөр өнгөөр будна."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Урлагийн буланд будаг, бийр, цаас байрлуулж, хүүхдүүдийн чөлөөт зургийг ажиглана.","learner":"- Өөрийн санаагаар зурна.\n- Зурагтаа ямар зураас, дүрс ашигласнаа хэлнэ."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – гурав дахь уншлага (3): «Хүчтэй болохыг хүссэн Бат» (Төлөвлөгөөний хуудсыг 01.11-ний төлөвлөлтийн дараа үзнэ үү.)\n- Номын үйл явдлыг хүүхдүүдээр түлхүү яриулна.\n- Дүгнэн ярилцах: «Батын хийсэн зүйлээс юу нь таалагдсан бэ? Яагаад?»\n- Шинэ үгсээр өгүүлбэр зохиох: ялагдах, бухимдах, тустай, чирэх\n- Бүтээл: Гурилан зуурмагаар «Батын эрүүл таваг» барих","learner":"- Номын нэр, зохиолч, зураачийг санаж хэлнэ.\n- Номын зургийг харж Батын түүхийг өөрийн үгээр ярина.\n- Батын таалагдсан үйлдлийг шалтгаантай нь хэлнэ.\n- Шинэ үгсээр өгүүлбэр зохионо.\n- Зуурмагаар эрүүл таваг барьж танилцуулна."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Бичих бэлтгэлийн төв: Цэгэн зураастай ажлын хуудас.\nМатематикийн төв: Дүрсийн хүрээг дагуулж зурах трафарет.\nХөдөлгөөний төв: Шалан дээр туузаар гаргасан тахир, долгионт замаар алхах.","learner":"Бичих бэлтгэлийн төв:\n- Ажлын хуудсан дээрх зураасыг дагуулж зурна.\nМатематикийн төв:\n- Трафаретын хүрээг дагуулж дүрс зурж, нэрлэнэ.\nХөдөлгөөний төв:\n- Туузан замаар тэнцвэрээ хадгалан алхана."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 3 (4). Ганцаарчилсан үйл ажиллагаа: Хэл ярианы хөгжлийг дэмжих ганцаарчилсан ярилцлага\nЗорилго:\n- Хүүхдийн ярианы чадварыг хөгжүүлэх\n- Шувууны талаарх мэдлэгийг бататгах\n- Бүтэн өгүүлбэрээр хариулах дадал суулгах\n- Логик сэтгэлгээг дэмжих\nЯрилцлагын жишээ асуулт:\n- «Энэ шувууг юу гэж нэрлэдэг вэ?»\n- «Шувуу ямар өнгөтэй вэ?»\n- «Тэр юу иддэг вэ?»\n- «Өвөл хоолоо яаж олдог бол?»\n- «Бид шувуудад яаж тусалж чадах вэ?»\n- «Чи шувуудыг яагаад хайрладаг вэ?»\n«Байгальдаа хайрлая – шувуудаа хамгаалъя!»","learner":"- Багштай ганцаарчлан ярилцана.\n- Шувууны нэр, өнгийг бүтэн өгүүлбэрээр хэлнэ (\"Энэ шувуу хөхцөөхэй, шар цээжтэй\").\n- Шувуу юу иддэг, өвөл хоолоо яаж олдгийг тайлбарлана.\n- Шувуунд хэрхэн туслахаа, яагаад хайрладгаа өөрийн үгээр хэлнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Замаа ол»\nЗорилго: Зураасыг дагаж хөдлөх, анхаарал төвлөрүүлэх.\nЯвц:\n1. Шалан дээр туузаар шулуун, долгионт, тахир зам гаргана.\n2. Хүүхдүүд аль замаар явахаа сонгож, туузаас гарахгүй алхана.\n3. Багш \"Долгионт зам!\" гэхэд тухайн замын хүүхдүүд хөдөлнө.\nДүрэм: Туузаас гарвал эхнээс нь эхэлнэ.\nДүгнэлт: Өнөөдөр ямар зураас зурснаа ярилцана.","learner":"- Замын хэлбэрийг нэрлэж сонгоно.\n- Туузаас гарахгүй алхана.\n- Багшийн тушаалыг сонсож хөдөлнө.\n- Өнөөдөр зурсан зураасуудаа нэрлэнэ."}]},"2028-01-18":{"method":"Зохиолд суурилсан арга","link":"ХЭМ3.1д. Алхалт, гүйлт бүхий хөдөлгөөнт тоглоомыг хамтран тоглоно.","competence":"Нийгэм, сэтгэл хөдлөлийн хөгжил (зан үйлийн тустай, тусгүйг тайлбарлах), хамтран тоглох","materials":"«Гурван торой» зурагт карт, зан үйлийн зурагт карт (хуваалцах, түлхэх, туслах, шоолох, ээлж хүлээх, тасалдуулах), ногоон ба улаан самбар, конус","criteria":"Зан үйлүүдийг яагаад тустай, тусгүй болохыг тайлбарладаг. Алхалт, гүйлт бүхий хөдөлгөөнт тоглоомыг дүрмийн дагуу хамтран тоглодог.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Амралтын өдрөөр хэнд тусалсан бэ?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Амралтын өдрөөр хэнд, яаж тусалснаа ярина.\n- \"Би тусалсан, тэгэхэд ээж баярласан\" гэж үр дүнг хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Зан үйлийн карт: Хуваалцах, түлхэх, туслах, шоолох, ээлж хүлээх, тасалдуулах картуудыг үзүүлж \"Энэ хүүхэд юу хийж байна?\" гэж асууна.\n- Ангилах: Картуудыг ногоон (тустай), улаан (тусгүй) самбарт ангилуулж, \"Яагаад?\" гэж асууна.\n- Дүрэм зохиох: Хамтдаа тоглохдоо мөрдөх 3 дүрмийг (ээлж хүлээх, түлхэхгүй, найзаа дэмжих) зохиож, зурагт картаар тэмдэглэнэ.\nБагшийн чиглүүлэх асуулт:\n1. Найзаа шоолвол түүнд ямар санагдах вэ?\n2. Ээлжээ хүлээх нь яагаад тустай вэ?\n3. Тоглоомд ялагдсан найздаа юу гэж хэлэх вэ?","learner":"Зан үйлийн карт:\n- Карт бүрийг харж хүүхэд юу хийж байгааг нэрлэнэ.\nАнгилах:\n- Картыг ногоон (тустай), улаан (тусгүй) самбарт ангилж тавина.\n- \"Түлхэх нь тусгүй, учир нь найз унаж өвдөнө\" гэж шалтгааныг тайлбарлана.\nДүрэм зохиох:\n- Хамтдаа тоглох дүрмийг санал болгоно.\n- Дүрэм бүрийн зургийг будаж самбарт наана.\nАсуултад хариулах:\n- Шоолуулсан найзын сэтгэлийг \"гунигтай болно\" гэж хэлнэ.\n- Ялагдсан найздаа хэлэх урамшуулах үгийг (\"Дараа чи чадна\") хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Хөдөлгөөний буланд хамтын тоглоомыг ажиглаж, шинэ дүрмийг мөрдөж буй хүүхдүүдийг урамшуулна.","learner":"- Найзуудтайгаа тоглохдоо ээлжээ хүлээнэ.\n- Шинэ дүрмүүдийг найздаа сануулна.\n- Найзаа \"Сайн байна!\" гэж урамшуулна."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – эхний уншлага (1): «Гурван торой» (Чанга уншлагын төлөвлөгөөний хуудсыг үзнэ үү.)\n- Номын нэр, хавтас, зохиолч, зураачийг танилцуулж, хэмнэлийг алдагдуулахгүй уншина.\n- Түр зогсож асуух: «Аль торойн байшин бат бөх байх бол?»\n- Шинэ үг: «Хичээнгүй – ажлаа сайн хийдэг»\n- Уншсаны дараа: «Аль торой зөв хийсэн бэ? Яагаад?»","learner":"- Номын хавтсыг харж \"Энэ ном ... тухай байх\" гэж таамаглана.\n- Багшийн уншихыг анхааралтай сонсоно.\n- Түр зогсох үед аль байшин бат бөх байхыг таамаглана.\n- «Хичээнгүй» үгийг давтан хэлж, утгыг нь хэлнэ.\n- \"Гурав дахь торой зөв хийсэн, учир нь ...\" гэж хариулна."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Барилгын төв: Шоо, банз, цаасаар гурван торойн байшинг барих.\nУрлагийн төв: \"Сайн үйлс\" – найздаа тусалж буй зураг зурах.\nДүрт тоглоомын төв: Торой, чонын баг бэлтгэнэ.","learner":"Барилгын төв:\n- Цаас, банз, шоогоор гурван байшин барина.\n- Аль байшин бат бөх болохыг үлээж шалгана.\nУрлагийн төв:\n- Найздаа тусалж буй зураг зурж тайлбарлана.\nДүрт тоглоомын төв:\n- Торой, чонын баг зүүж үлгэрийн хэсгийг дүрд тоглоно."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 4 (1). Ажиглалт: Нарыг ажиглах\nЗорилго: Байгалийн үзэгдэлтэй танилцах, асуултын дагуу харилцан ярилцах, багштай хамтран шүлэг унших.\nАжиглалтын явц:\n- Асуулт: «Өглөө нар аль зүгт байсан бэ? Хэн анзаарсан бэ?»\n- Нар хаана байгааг ажиглуулна (нүд рүү шууд харахгүй), нарны илч мэдрэгдэж байгаа эсэхийг ярилцана.\n- Шүлэг:\n«Нар минь гараад ирээч,\nНар минь, чи хаана байна вэ?\nНамайг жаахан дулаацуулаач.\nЧамгүй болохоор ус хөлдөж,\nЦас мөсөөр газар хучигдлаа.\nНар минь, нар минь гараад ир,\nНамайг дулаан илчээрээ тэтгээч.\nАлтан шаржан гэрлээ цацаж,\nАлив бүгдийг дулаацуулаач.»","learner":"- Өглөө нар хаана байсныг санаж хэлнэ.\n- Нар хаана байгааг гараараа заана, нүд рүү шууд харахгүй.\n- Нарны гэрэлд зогсож, сүүдэрт зогсоод ялгааг мэдэрнэ.\n- \"Нар дулаацуулдаг, нар байхгүй бол ус хөлддөг\" гэж хэлнэ.\n- Шүлгийг багштай хамт мөр мөрөөр уншина."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Тийм / Үгүй»\nЗорилго: Тустай, тусгүй зан үйлийг ялгах.\nЯвц:\n1. Багш \"Би найзынхаа тоглоомыг булааж авлаа\" гэх мэт нөхцөл хэлнэ.\n2. Тустай бол хүүхдүүд \"Тийм!\" гэж үсэрнэ, тусгүй бол \"Үгүй!\" гэж суугаад гараа хөндлөн тавина.\n3. Хэдэн хүүхдээс \"Яагаад?\" гэж асууна.\nДүрэм: Хариултаа хөдөлгөөнөөр үзүүлнэ.\nДүгнэлт: Өнөөдөр хийсэн сайн үйлсээ хуваалцана.","learner":"- Нөхцөлийг сонсоод тустай бол үсэрч \"Тийм!\", тусгүй бол суугаад \"Үгүй!\" гэнэ.\n- Хариултынхаа шалтгааныг хэлнэ.\n- Өнөөдөр хийсэн сайн үйлсээ хуваалцана."}]},"2028-01-19":{"method":"Тоглоомонд суурилсан арга","link":"НСХ3.2в. Зан үйлүүдийг яагаад тустай, тусгүй болохыг тайлбарладаг болно.","competence":"Биеийн хөдөлгөөний чадвар (хурдтай өнхөрч буй бөмбөг, цагирагнаас бултах), зан үйлийн дүрмийг баримтлах","materials":"Том зөөлөн бөмбөг (2), цагираг (3), конус, тэмдэглэсэн талбай, дүрмийн зурагт карт","criteria":"Хурдтай өнхөрч байгаа том бөмбөг, цагирагнаас бултаж, зугтдаг. Тоглоомын үеэр түлхэх, мөргөлдөх нь яагаад тусгүйг тайлбарладаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, өчигдөр зохиосон тоглоомын дүрмүүдийг зурагт картаар давтана.","learner":"- Мэндчилж тойрогт сууна.\n- Дүрмийн зургийг харж \"Ээлжээ хүлээнэ\", \"Түлхэхгүй\" гэж давтан хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Зааж үзүүлэх: Өнхөрч ирсэн бөмбөгнөөс хажуу тийш алхах, дээгүүр нь үсрэх аргыг үзүүлнэ.\n- Бултах дасгал: Багш бөмбөгийг аажуухан, дараа нь хурдан өнхрүүлж, хүүхдүүдээр бултуулна.\n- Цагирагнаас бултах: Өнхрүүлсэн цагирагнаас хажуу тийш зугтуулна.\n- Аюулгүй дүрэм: \"Бултахдаа найзаа түлхвэл юу болох вэ?\" гэж ярилцана.\nБагшийн чиглүүлэх асуулт:\n1. Бөмбөг ирэх
