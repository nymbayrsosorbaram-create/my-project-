лагаа-6","teacher":"Зугаалга 4 (4). Ганцаарчилсан үйл ажиллагаа: Аюултай ба аюулгүй газрыг ялгах дасгал\nЗорилго: Мөстэй, хальтиргаатай орчинд болгоомжтой алхах, «аюултай – аюулгүй» газрыг ялгах чадварыг дэмжих.\nЯвц:\n- Хүүхэд аюулгүй тэмдэг дээр зогсоно.\n- «Мөс хаана байна вэ?» гэж асууж ялгуулна.\n- «Аюулгүй замаар алхъя» гэж богино зайд алхуулна.\n- «Мөстэй хэсэг рүү орохгүй» гэж сануулна. Зөв алхсан үйлдэл бүрийг магтана.\n- «Оцон шувуу» дасгал: гараа хоёр тийш дэлгэн, жижиг алхмаар удаан алхана.\n- Анхаарах: хүүхдийг зөвхөн багшийн шууд хяналттай ажиллуулна; гол, мөс, усанд ойртуулахгүй.","learner":"- Аюулгүй тэмдэг дээр зогсож, мөстэй газрыг заан хэлнэ.\n- Аюулгүй замаар богино зайд болгоомжтой алхана.\n- Оцон шувуу шиг гараа дэлгэж, жижиг алхмаар тэнцвэрээ хадгалан алхана.\n- Аюултай, аюулгүй газрын ялгааг өөрийн үгээр тайлбарлана."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Замаа ол»\nЗорилго: Шулуун, долгионт, хугарсан замаар алхаж, зураасны хэлбэрийг таних.\nХэрэглэгдэхүүн: Шалан дээр туузаар гаргасан шулуун, долгионт, хугарсан зам; цаасан лабиринт.\nЯвц:\n1. Багш шалан дээр гурван төрлийн зам гаргана.\n2. Хүүхдүүд замын эхэнд жагсаж, «Шулуун зам», «Долгионт зам» гэж нэрлэсэн замаар тууз дээгүүр алхана.\n3. Замын төгсгөлд тоглоом (бэлэг) хүлээж байна.\n4. Дараа нь ширээн дээр цаасан лабиринтаар харандаагаар зам олно.\n5. «Аль зам хэцүү байсан бэ? Яагаад?» гэж асууна.\nДүрэм: Туузнаас гарахгүй алхана; өмнөх хүүхдээ түлхэхгүй.\nДүгнэлт: Долоо хоногийн дуртай ажлаа хуваалцаж дүгнэнэ.","learner":"- Замын хэлбэрийг нэрлэнэ.\n- Туузан замаар тэнцвэрээ хадгалан алхана.\n- Цаасан лабиринтаар харандаагаар зам дагуулж зурна.\n- Аль зам хэцүү байсныг тайлбарлана."}]},"2026-11-23":{"method":"Төсөлд суурилсан арга (давтамж)","link":"ХЭМ3.2г. Хооллох үеийн дүрмийг зохиож, мөрдөнө.","competence":"Бүтээлчээр сэтгэх (зан үйлүүдийн тустай, тусгүйг мэдэж, тустай үйлүүдийг хийх), иргэний ёс зүй (баатруудын зөв, буруу үйлдлийг харьцуулах), дүрэм зохиох, мөрдөх","materials":"Тустай, тусгүй үг, үйлдлийн зурган карт, богино үлгэр эсвэл хүүхэлдэйн кино (\"Эелдэг үг\"), \"Манай хоолны дүрэм\" том цаас, таваг, халбага","criteria":"Үлгэр зохиол, тоглоом, хүүхэлдэйн киноны үйл явдалд тулгуурлан зан үйлүүдийг яагаад тустай, тусгүй болохыг тайлбарлана.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Хоол идэхэд ямар байх ёстой вэ?\" гэж асууна.","learner":"- Хоол идэхэд ямар дүрэм баримтлах ёстойг өөрийн бодлоор хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Зурган карттай танилцах: Хооллох үеийн болон өдөр тутмын тустай, тусгүй үг, үйлдлийн картыг (гараа угаах, \"Баярлалаа\" гэх, хоол асгах, найзаа түлхэх, ширээн дээр гүйх г.м.) үзүүлж, бусдад хэрхэн нөлөөлөх талаар ярилцана.\n- Ангилж, учраа хэлэх: Картуудыг \"тустай\", \"тусгүй\" гэж ангилуулж, яагаад тэгж ангилснаа тайлбарлуулна.\n- Үлгэрийн баатар: Богино үлгэр эсвэл хүүхэлдэйн киноны баатрын үйлдэл яагаад тустай, тусгүй болохыг ярилцана.\n- Дүрэм зохиох: Тустай зан үйлд тулгуурлан бүлгийн хоолны 4-5 дүрмийг хамтдаа зохиож, зураг тэмдгээр самбарт тэмдэглэнэ.\nБагшийн чиглүүлэх асуулт:\n1. Энэ үйлдэл яагаад тустай (тусгүй) вэ?\n2. \"Баярлалаа\", \"Уучлаарай\" гэвэл бусад хүн ямар санагдах вэ?\n3. Хоол идэж байхдаа гүйвэл юу болох вэ?\n4. Манай бүлгийн хоолны дүрэмд юу оруулах вэ?","learner":"- Зурган картыг харж, үг, үйлдлийг нэрлэнэ.\n- Картыг \"тустай\", \"тусгүй\" гэж ангилж, \"... учраас тусгүй\" гэж учраа тайлбарлана.\n- Үлгэрийн баатрын үйлдэл бусдад хэрхэн нөлөөлснийг хэлнэ.\n- Бүлгийн хоолны дүрмийг санал болгож, тэмдгийг нь зурж самбарт наана."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Дүрт тоглоомын буланд \"Ресторан\" орчин бүрдүүлнэ.","learner":"- \"Ресторан\" дүрт тоглоомд зохиосон хоолны дүрмээ мөрдөж тоглоно."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – эхний уншлага (1): «Гурван тоорой» (Чанга уншлагын төлөвлөгөөний хуудсыг үзнэ үү.)\n- Номын нэр, хавтас, зохиолч, зураачийг танилцуулж, хэмнэлийг алдагдуулахгүй уншина.\n- Уншихын өмнө заах үг: тоорой – гахайн төл, мэгж – эх гахай; сүрэл, мод, тоосго – байшингийн материал; чоно.\n- Түр зогсож асуух: «Ах нар нь яагаад тусдаа явахыг хүссэн бол?» (х.4), «Чоно сүрлэн байшинг үлээвэл юу болох бол?» (х.9), «Чоно тоосгон байшинг хийсгэж чадах болов уу?» (х.13)\n- Шинэ үг: эсэргүүцэх (х.4), хэмнэлттэй (х.5), бат бөх (х.8).\n- Уншсаны дараа: «Аль тооройн байшин хамгийн бат бөх байсан бэ? Яагаад?»; гурван байшинг «эхний, хоёр дахь, гурав дахь» гэж дарааллаар нэрлүүлнэ.","learner":"- Номын нэр, хавтасны зургийг харж, ном юуны тухай байхыг таамаглаж хэлнэ.\n- Багшийн уншихыг анхааралтай, тайван сонсоно.\n- Түр зогсох үед \"Дараа нь юу болох бол?\" гэсэн асуултад өөрийн таамаглалыг хэлнэ.\n- Шинэ үгийн утгыг сонсож, багштай хамт давтан хэлнэ.\n- Гурван байшинг дарааллаар нь нэрлэж, 3 хүртэл тоолно."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: Хоолны дүрмийн тэмдэг (гар угаах, ярихгүй зажлах, баярлалаа гэх) зурах загвар.\nХэл ярианы төв: Тустай / тусгүй зан үйлийн карт.\nДүрт тоглоомын төв: \"Ресторан\": цэс, таваг, халбага, хоолны загвар байрлуулна.\n- Зочин, зөөгч болж хоолны дүрмийг мөрдөхийг чиглүүлнэ.\nМатематикийн төв: Таваг, халбага, аягыг тоолж хүн бүрт оноох.","learner":"Урлагийн төв: Дүрмийн тэмдэг зурж, бүлгийн самбарт наана.\nХэл ярианы төв: Картыг ялгаж, \"... нь тустай, учир нь ...\" гэж тайлбарлана.\nДүрт тоглоомын төв: Зөөгч, зочин болж тоглоно.\n- \"Баярлалаа\", \"Өгөөч\" гэх эелдэг үг хэрэглэнэ.\nМатематикийн төв: Ширээ засаж, хүн бүрт нэг таваг, нэг халбага оноон тавина."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 5 (1). Ажиглалт: Нохой ажиглах\nЗорилго: Нохойн тухай мэдлэг, түүний онцлог шинжүүд орчиндоо дасан зохицох чадварыг бататгах; гаршуулсан амьтдад хариуцлагатай хандах сэтгэлийг төлөвшүүлэх.\nЯвц:\n- Аюулгүй зайнаас нохойг ажиглуулна.\n- Оньсого: «Би эзэндээ үйлчилдэг. Гэр орноо хамгаалдаг. Би архирч чангаар хуцна. Гадны хүмүүс надаас айдаг. Би хэн бэ?» (Нохой)\n- Нохойн гадаад төрх, үс ноос, хөдөлгөөнийг ярилцана.","learner":"- Оньсогыг сонсож тааварлана.\n- Нохойг аюулгүй зайнаас ажиглаж, бие, чих, сүүл, үс ноосыг нэрлэнэ.\n- Нохой хэрхэн хөдөлж, ямар дуу гаргаж байгааг тайлбарлана.\n- Танихгүй нохойд гар хүргэхгүй байх дүрмийг хэлнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Тийм / Үгүй»\nЗорилго: Хооллох үеийн тустай, тусгүй зан үйлийг ялгах.\nХэрэглэгдэхүүн: Тустай, тусгүй зан үйлийн зурагт карт.\nЯвц:\n1. Багш зан үйлийг хэлнэ эсвэл картаар үзүүлнэ: «Хоолны өмнө гараа угаана».\n2. Тустай бол хүүхдүүд алга ташиж «Тийм!» гэнэ.\n3. Тусгүй бол («Ам дүүрэн ярина») хоёр гараа зөрүүлж «Үгүй!» гэнэ.\n4. «Үгүй» гэсэн үед «Оронд нь юу хийх вэ?» гэж зөв үйлдлийг хэлүүлнэ.\n5. Сүүлд хүүхдүүд өөрсдөө жишээ зохиож асууна.\nДүрэм: Хариугаа хамтдаа хэлнэ; бусдыг бүү таслан ярь.\nДүгнэлт: Бүлгийн хоолны дүрмийн самбарыг хамтдаа уншиж дүгнэнэ.","learner":"- Зан үйлийг сонсож, тустай, тусгүйг ялгана.\n- Тустай бол алга ташиж, тусгүй бол гараа зөрүүлнэ.\n- Тусгүй үйлдлийн оронд хийх зөв үйлдлийг хэлнэ.\n- Өөрөө жишээ зохиож найздаа асууна."}]},"2026-11-24":{"method":"Тоглоомонд суурилсан арга (давтамж)","link":"БНО3.1г. Цаг агаарын байдлыг зураг, тэмдэг ашиглан илэрхийлж, тохирсон хувцас болон хийх үйл ажиллагаагаа сонгож тайлбарлана.","competence":"Бие даах, улиралд тохирох хувцас сонгох, ариун цэвэр сахих","materials":"Өвлийн хувцас (малгай, ороолт, бээлий, куртик), хүүхэлдэй ба хүүхэлдэйн хувцас, цэвэр ба бохир хувцасны зураг, \"Бохир хувцас\" сагс, жижиг шүүгээ/тавиур, цаг агаарын тэмдэг","criteria":"Бохирдсон хувцсыг насанд хүрэгчдийн сануулгаар сольдог.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, цаг агаарын тэмдгийг байрлуулна.","learner":"- Цаг агаарыг хэлж, хуанлид тэмдэг байрлуулна."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Улиралд тохируулах: \"Өнөөдөр хүйтэн байна. Ямар хувцас өмсөх вэ?\" гэж асууж, хүүхэлдэйг өвлийн хувцсаар хувцаслуулна.\n- Ангилах тоглоом: Бохир хувцсыг сагсанд хийж, цэвэр хувцсыг эвхэж шүүгээнд хийх тоглоом тоглуулна.\n- Цэвэр байлгах: Цэвэр ба бохир хувцасны зургийг харьцуулж, бохирдвол томчуудад хэлж солих хэрэгтэйг ярилцана.\n- Бие даан хийх: Тодорхой хугацаа өгч куртикаа өмсөж, товч, цахилгаанаа хааж, тайлж эвхэхийг даалгана.\nБагшийн чиглүүлэх асуулт:\n1. Өнөөдөр гадаа хүйтэн үү, дулаан уу? Ямар хувцас өмсөх вэ?\n2. Хувцас бохирдвол яах вэ? Хэнд хэлэх вэ?\n3. Куртикаа өөрөө товчилж чадах уу?\n4. Малгай, бээлий өмсөхгүй гарвал юу болох вэ?","learner":"- Цаг агаарт тохирох хувцсыг сонгож, хүүхэлдэйг хувцаслана.\n- Бохир хувцсыг сагсанд хийж, цэвэр хувцсыг эвхэж шүүгээнд хийнэ.\n- Хувцас бохирдвол \"Багш аа, хувцас маань бохирдчихлоо\" гэж хэлж солино.\n- Куртикаа бие даан өмсөж, товчилж, тайлж эвхэнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Дүрт тоглоомын буланд хүүхэлдэйг хувцаслана.","learner":"- Хүүхэлдэйг цаг агаарт тохируулан хувцаслана."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Хувцасны тухай шүлэг уншина.","learner":"- Хувцасны тухай шүлгийг багштай хамт давтана."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Математикийн төв: Хувцас өмсөх дарааллын карт (өмд, цамц, куртик, малгай, бээлий).\nУрлагийн төв: Өвлийн хувцасны зурагт хуудас, будаг.\nДүрт тоглоомын төв: Хүүхэлдэй, улирлын хувцас.\nГарын нарийн хөдөлгөөний төв: Товч, цахилгаан, уяатай хувцасны самбар.","learner":"Математикийн төв: Картыг өмсөх дарааллаар байрлуулж, яагаад ингэж өмсөхийг хэлнэ.\nУрлагийн төв: Өвлийн хувцсыг будаж, нэрлэнэ.\nДүрт тоглоомын төв: Хүүхэлдэйг цаг агаарт тохируулан хувцаслана.\nГарын нарийн хөдөлгөөний төв: Товч товчлох, цахилгаан хаах дадлага хийнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 5 (2). Ажиглалтын ярилцлага: Багш хүүхдүүдээс асуулт асуух\nЗорилго: Нохойн тухай мэдлэгээ бататгах, гэрийн тэжээвэр амьтдад хариуцлагатай хандах сэтгэлийг төлөвшүүлэх.\nЯвц:\n- Асуулт: «Яагаад нохойг гэрийн тэжээвэр амьтан гэдэг вэ?», «Нохой юугаар хооллодог вэ?», «Нохойн үр төлийг юу гэж нэрлэдэг вэ?», «Нохой хүмүүст ямар ач тус хүргэдэг вэ?», «Та нар ямар үүлдрийн нохой мэдэх вэ?», «Гэртээ нохой тэжээдэг үү? Ямар нэртэй вэ?», «Нохой өвөлд хэрхэн бэлддэг вэ?»\n- Нохойн үүлдрийн зургийг (алтан ретривер, германы хоньч нохой, пудель, хаски, померан, корги, такса, зулзага) үзүүлнэ.\n- Тайлбар: Нохойн үс ноос өвөл болохоор илүү их ургаж түүнийг даарахаас хамгаалдаг. Зун болоход үс нь унаж шинэ үс ургадаг.","learner":"- Багшийн асуултад бүтэн өгүүлбэрээр хариулна.\n- Нохойн үр төлийг «гөлөг» гэж нэрлэнэ.\n- Зургаас мэддэг үүлдрийн нохойгоо заан нэрлэнэ.\n- Гэртээ тэжээдэг нохой, түүнийг хэрхэн асардгаа ярина."},{"time":"1630-1700","name":"Номын цаг\nНэмэлт уншлага","teacher":"Чанга уншлага – эхний уншлага (1): «Долоон дэлбээтэй цэцэг» (зохиолч В. Катаев) (Чанга уншлагын төлөвлөгөөний хуудсыг үзнэ үү.)\n- Номын нэр, хавтас, зохиолч, зураачийг танилцуулж, хэмнэлийг алдагдуулахгүй уншина.\n- Уншихын өмнө заах үг: дэлбээ – цэцгийн өнгөт хэсэг; хүсэл; солонгын өнгө (шар, улаан, ногоон, хөх, улбар шар, ягаан, цэнхэр).\n- Түр зогсож асуух: «Женягийн цагираган боовыг хэн идсэн бэ? Яагаад?» (х.2), «Эмгэн Женяд юу бэлэглэсэн бэ? Энэ цэцэг юу хийж чадах вэ?» (х.6), «Женя сүүлчийн дэлбээгээрээ юу хүсэх бол?» (х.24)\n- Шинэ үг: хайхрамжгүй (х.2), шившлэг (х.7, хамт хэлэх), доголон (х.24).\n- Уншсаны дараа: «Женягийн аль хүсэл хамгийн сайн хүсэл байсан бэ? Яагаад?», «Бусад дэлбээгээ юунд үрсэн бэ?»; долоон дэлбээний өнгийг нэрлэж, 1-ээс 7 хүртэл тоолуулна.","learner":"- Номын нэр, хавтасны зургийг харж, ном юуны тухай байхыг таамаглаж хэлнэ.\n- Багшийн уншихыг анхааралтай, тайван сонсоно.\n- Түр зогсох үед \"Дараа нь юу болох бол?\" гэсэн асуултад өөрийн таамаглалыг хэлнэ.\n- Шинэ үгийн утгыг сонсож, багштай хамт давтан хэлнэ.\n- Дэлбээний өнгийг нэрлэж, 7 хүртэл тоолно."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Хэн хурдан хувцаслах вэ?»\nЗорилго: Хувцсаа зөв дарааллаар бие даан өмсөх, цаг агаарт тохирох хувцас сонгох.\nХэрэглэгдэхүүн: Хүүхэд бүрийн өвлийн хувцас (малгай, ороолт, бээлий, куртик), хувцасны дарааллын карт.\nЯвц:\n1. Хувцсыг хүүхэд бүрийн өмнө холиж тавина.\n2. Багш «Эхлэлээ!» гэхэд хүүхдүүд дарааллын картыг харж хувцсаа өмсөнө.\n3. Товч, цахилгаанаа өөрөө хаана; хэцүү бол найзаасаа тусламж хүснэ.\n4. Бүрэн хувцасласан хүүхэд «Бэлэн!» гээд суугаад хүлээнэ.\n5. Сүүлд хувцсаа тайлж, эвхэж байранд нь тавина.\nДүрэм: Хурдан гэхээсээ зөв өмсөх нь чухал; найздаа тусалж болно.\nДүгнэлт: «Аль хувцсаа эхэлж өмсөх вэ?» гэж дарааллыг давтаж дүгнэнэ.","learner":"- Дарааллын картыг харж хувцсаа зөв дарааллаар өмсөнө.\n- Товч, цахилгаанаа бие даан хаана.\n- Хэцүү үед тусламж хүсэж, найздаа тусална.\n- Хувцсаа тайлж, эвхэж байранд нь тавина."}]},"2026-11-25":{"method":"Тоглоомонд суурилсан арга (давтамж)","link":"НСХ3.2в. Зан үйлүүдийг яагаад тустай, тусгүй болохыг тайлбарладаг болно.","competence":"Хамтран ажиллах (дүрэм баримтлах, багаар тоглох), үндэсний өв соёлоос суралцах (уламжлалт хөдөлгөөнт тоглоом), тустай зан үйл","materials":"Конус, бөмбөг, туг (буухиад), алчуур, бөмбөр, хөгжим, \"Тоглоомын дүрэм\" зурагт карт","criteria":"Алхах, гүйх техникээ зөв ашиглаж, буухиа, тоглоомын дүрэм баримталдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Хамтдаа тоглохдоо юуг анхаарах вэ?\" гэж асууна.","learner":"- Хамтдаа тоглоход юуг анхаарах ёстойг санал болгоно."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Дүрэм зохиох: Хүүхдүүдтэй хамт түлхэхгүй, ээлжээ хүлээх, найзаа дэмжих дүрмийг зохиож, зурагт картаар тэмдэглэнэ.\n- Хөгжимт гимнастик: Хөгжмийн хэмнэлд 6-8 тоот бэлтгэл дасгал хийлгэнэ.\n- Буухиа тоглоом: Хоёр баг болж конус тойрон алхах, гүйх буухиа тоглуулна.\n- Уламжлалт тоглоом: \"Алчуур хаях\" тоглоомыг тоглуулж, төгсгөлд дүгнэлт ярилцлага хийж урамшуулна.\nБагшийн чиглүүлэх асуулт:\n1. Хамтдаа тоглохдоо ямар дүрэм баримтлах вэ?\n2. Найзаа түлхэх нь яагаад тусгүй вэ?\n3. Буухиад баг маань хожихын тулд юу хийх вэ?\n4. Найз чинь унавал юу хийх вэ?","learner":"- Тоглоомын дүрэм зохиоход санал гаргаж, дүрмээ давтан хэлнэ.\n- Хөгжмийн хэмнэлд дасгалыг багшийг даган гүйцэтгэнэ.\n- Буухиад алхах, гүйх техникээ зөв ашиглаж, багаа дэмжинэ.\n- \"Алчуур хаях\" тоглоомыг дүрмийн дагуу тоглож, \"Түлхэх нь тусгүй, учир нь ...\" гэж тайлбарлана."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Хөдөлгөөний буланд хамтын тоглоомыг ажиглана.","learner":"- Хөдөлгөөний буланд найзуудтайгаа ээлжилж тоглоно."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – хоёр дахь уншлага (2): «Гурван тоорой» (Төлөвлөгөөний хуудсыг 11.23-ны төлөвлөлтийн дараа үзнэ үү.)\n- Эргэн санах: «Тэд юугаар байшингаа барьсан бэ?», «Чоно ирээд юу хийсэн бэ?», «Үлгэр хэрхэн төгссөн бэ?»\n- Түр зогсож асуух: «Хамгийн бага тоорой юу гэж хэлсэн бэ? Тэр зөв үү?» (х.4), «Аль байшинг хамгийн хурдан, аль нь удаан барьсан бэ?» (х.7–8), «Хоёрдугаар тоорой хаалгаа түгжсэн ч яагаад байшин нь хийссэн бэ?» (х.11), «Байшин дотор хэдэн тоорой байна вэ? Тоолоорой.» (х.13)\n- Шинэ үг: түгжих (х.10, үйлдлээр үзүүлэх), аргаа барах (х.14), яндан (х.14, зураг дээр заах).\n- Уншсаны дараа: «Хэрвээ чи тоорой байсан бол юугаар байшин барих байсан бэ? Яагаад?»; чоно үлээх, тоорой нар зугтах хэсгийг дүрд тоглуулна; сүрэл, мөчир, тоосго (шоо)-г хүрч мэдрэн хатуу, зөөлөн гэж харьцуулна.","learner":"- Номын эхлэл, өрнөл, төгсгөлд юу болсныг санаж хариулна.\n- Түр зогсох үед \"Би ... гэж бодож байна, учир нь ...\" гэж санал бодлоо илэрхийлнэ.\n- Байшин доторх тооройг тоолж хэлнэ.\n- Чоно, тоорой болж дүрд тоглоно.\n- Сүрэл, мөчир, тоосгыг хүрч мэдэрч, хатуу, зөөлөн гэж ялгана."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Хөдөлгөөний төв: Конус, туузан зам бэлтгэж, хос болж гүйх дүрмийг тайлбарлана.\nУрлагийн төв: \"Тоглоомын дүрэм\" зурагт самбар хийх.\nШирээний тоглоомын төв: Шоо, ээлжийн тоглоом (\"Шат могой\" гэх мэт).\nХэл ярианы төв: Тустай / тусгүй үйлдлийн карт.","learner":"Хөдөлгөөний төв: Найзтайгаа гар барилцан конусыг тойрон гүйнэ.\n- Түлхэхгүй, ээлжээ хүлээнэ.\nУрлагийн төв: Тоглоомын нэг дүрмийг зурж, самбарт наана.\nШирээний тоглоомын төв: Найзуудтайгаа ээлжээрээ шоо хаяж тоглоно.\n- Хожигдсон найздаа \"Дараа хожно\" гэж урам өгнө.\nХэл ярианы төв: Картыг ялгаж тайлбарлана."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 5 (3). Хөдөлмөрийн үйл ажиллагаа: Цэцгийн үр түүж бэлтгэх\nЗорилго: Даалгасан ажилд хариуцлагатай хандлагын төлөвшүүлэх; экологийн ухамсар төлөвшүүлэх.\nЯвц:\n- Цэцэрлэгийн гадна ургадаг цэцгийн үрийг түүж бэлтгэнэ.\n- Хуурай цэцгийн толгойг болгоомжтой тасдаж, сагсанд хийхийг үзүүлнэ.\n- Цуглуулсан үрийг ирэх хавар тарих тухай ярилцана.","learner":"- Хуурай цэцгийн толгойг болгоомжтой түүж сагсанд хийнэ.\n- Үрийг цаасан дугтуйд хийж хадгална.\n- Найзтайгаа хамтран ажиллаж, даалгасан ажлаа дуустал хийнэ.\n- Хавар эдгээр үрийг тарьж ургуулна гэдгийг ярина."},{"time":"1630-1700","name":"Номын цаг\nНэмэлт уншлага","teacher":"Чанга уншлага – хоёр дахь уншлага (2): «Долоон дэлбээтэй цэцэг» (Төлөвлөгөөний хуудсыг 11.23-ны төлөвлөлтийн дараа үзнэ үү.)\n- Эргэн санах: «Женя шидэт цэцгийг хэнээс авсан бэ?», «Женя хойд туйлд яагаад очсон бэ?», «Үлгэр хэрхэн төгссөн бэ?»\n- Түр зогсож асуух: «Женя хэдэн цагираган боов авсан бэ?» (х.1), «Цэцэг хэдэн дэлбээтэй вэ? Ямар өнгөтэй вэ?» (х.6), «Хэдэн хэрээ байна вэ? Тоолоорой.» (х.11), «Одоо хэдэн дэлбээ үлдсэн бэ?» (х.23)\n- Шинэ үг: атаархах (х.22), хойд туйл, мөс, цагаан баавгай (х.18–19, зураг дээр заах), хөөцөлдөж тоглох (х.26, биеэр үзүүлэх).\n- Уншсаны дараа: «Хэрвээ чамд долоон дэлбээтэй цэцэг байсан бол юу хүсэх байсан бэ?»; цаасан цэцгийн дэлбээг нэг нэгээр тасдаж, хэд үлдэхийг тоолох тоглоом; шившлэгийг хамтдаа хэлнэ.","learner":"- Номын эхлэл, өрнөл, төгсгөлд юу болсныг санаж хариулна.\n- Хуудас бүрийн асуултад тоолж хариулна.\n- Шинэ үгийн утгыг зураг, үйлдлээр таньж хэлнэ.\n- Өөрийн сайн хүслийг \"Би ... хүсэх байсан, учир нь ...\" гэж хэлнэ.\n- Дэлбээ тасдах тоглоомоор үлдсэн дэлбээг тоолно."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Хөлдсөн найзаа аврах»\nЗорилго: Хөдөлгөөнт тоглоомыг хамтран тоглох, найздаа туслах тустай зан үйлийг бататгах.\nХэрэглэгдэхүүн: Цасан ширхэгт хантааз (барагч), өргөн талбай.\nЯвц:\n1. Нэг хүүхэд «Өвлийн өвгөн» (барагч) болно.\n2. Барагч хүрсэн хүүхэд «хөлдөж» нэг байрандаа зогсоно.\n3. Бусад хүүхэд хөлдсөн найз дээрээ очиж мөрөнд нь зөөлөн хүрээд «Чамайг аварлаа!» гэвэл тэр дахин гүйнэ.\n4. 2–3 минутын дараа барагчийг солино.\n5. Хэн хэдэн найзаа аварсныг ярилцана.\nДүрэм: Зөвхөн мөрөнд зөөлөн хүрнэ, түлхэхгүй; хөлдсөн хүн хөдлөхгүй.\nДүгнэлт: «Найзаа аврахад ямар санагдсан бэ?» гэж асууж, тустай үйлдлийг магтаж дүгнэнэ.","learner":"- Барагчаас зугтаж гүйнэ.\n- Хүрэгдвэл «хөлдөж» зогсоно.\n- Хөлдсөн найз дээрээ очиж мөрөнд нь зөөлөн хүрч аварна.\n- Хэдэн найзаа аварснаа, ямар санагдсанаа хуваалцана."}]},"2026-11-27":{"method":"Тоглоомонд суурилсан арга (давтамж)","link":"БНО3.1а. Амьтдын амьдрах орчныг ялган таньж, тэднийг хамгаалах аргыг нэрлэнэ.","competence":"Тоолох, жиших, эдийн засаг, санхүүгийн боловсрол (тоогоор жишиж олон, цөөнийг харьцуулах), амьтдын өвөлжилт","materials":"Шалан дээр байрлуулах 1-10 тооны карт, өвөлждөг амьтдын зураг (баавгай, зараа, туулай), тоглоомон амьтад, \"Үүр\" хайрцаг, жимс/товч, зурагт карт","criteria":"10 хүртэл юмсыг дараалуулан тоолж, өгсөн тооноос эхлэн нэмэгдүүлэн, хоёр бүлэг юмсыг жишиж харьцуулж тайлбарладаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, 10 хүртэл цээжээр тоолох дуу дуулна.","learner":"- 10 хүртэл цээжээр тоолох дууг багштай хамт дуулна."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Цээжээр тоолох: Шалан дээр байрлуулсан 1-10 тооны карт дээгүүр үсэрч, алхаж тоолуулна.\n- Оноож тоолох: \"Баавгайн үүрэнд хэдэн жимс байна?\" гэж 5 хүртэл оноож тоолуулна; амьтдыг (1 баавгай, 2 зараа, 3 туулай) дарааллаар байрлуулж тоолуулна.\n- Нэмж тоолох: \"4-өөс эхлээд хуруугаа нэг нэгээр гаргаж тоолъё\" гэж тоолуулна.\n- Жиших: Хүүхэд бүр зурагт карт сонгож, \"Надад 5 жимс, чамд 2 жимс байна\" гэж олон, цөөнийг харьцуулна.\nБагшийн чиглүүлэх асуулт:\n1. Баавгайн үүрэнд хэдэн жимс байна? Оноож тоолоорой.\n2. 4-өөс эхлээд нэгээр нэмж тоолвол ямар тоо гарах вэ?\n3. Аль үүрэнд олон, аль нь цөөн байна вэ?\n4. Баавгай өвөл хаана амьдардаг вэ?","learner":"- Тооны карт дээгүүр үсэрч 10 хүртэл цээжээр тоолно.\n- Үүрэн дэх жимсийг 5 хүртэл оноож тоолж, амьтдыг дарааллаар нь тоолно.\n- Өгсөн тооноос эхэлж хуруугаараа нэгээр нэмэгдүүлэн тоолно.\n- Найзынхаа карттай жишиж, \"Надад олон, чамд цөөн байна\" гэж харьцуулна."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Барилгын буланд амьтдын үүр барих орчин бүрдүүлнэ.","learner":"- Барилгын буланд амьтдын үүр барьж, доторх амьтдыг тоолно."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – гурав дахь уншлага (3): «Гурван тоорой» (Төлөвлөгөөний хуудсыг 11.23-ны төлөвлөлтийн дараа үзнэ үү.)\n- Уншихын өмнө: номын нэрийг хүүхдүүдээр хэлүүлж, хавтас, ард талыг үзүүлж, зохиолч, зураачийг танилцуулна («Номын зохиолч, зураач юу хийдэг вэ?»).\n- Уншиж байхдаа: зургийг заан «Энд тоорой юу хийж байна?», «Дараа нь юу болох вэ?» гэж хүүхдээр яриулж, учир шалтгааныг холбоно («Тоосгон байшин яагаад хийсээгүй бэ?», «Бага тоорой яагаад удаан барьсан бэ?»).\n- Уншиж дуусаад: «Хурдан хийсэн ажил сайн уу, сайтар хийсэн ажил сайн уу?», «Ах дүү эвтэй байвал юу сайн бэ?»\n- Бат бөх, эсэргүүцэх, хэмнэлттэй, түгжих үгээр өгүүлбэр зохиолгоно.\n- Бүтээл: шоо эсвэл хайрцгаар гурван байшин барих; тоорой, чонын хуруун хүүхэлдэй хийх.","learner":"- Номын нэр, зураачийг өөрөө хэлнэ.\n- Зургийг харж, номын үйл явдлыг дарааллаар нь өөрийн үгээр ярина.\n- Тоосгон байшин яагаад хийсээгүйг учир шалтгаантай тайлбарлана.\n- Шинэ үгээр өгүүлбэр зохиож хэлнэ.\n- Шоо, хайрцгаар байшин барьж, хуруун хүүхэлдэйгээр үлгэрээ тоглоно."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Математикийн төв: 1-10 тооны карт, тоглоомон самар, аяга бэлтгэнэ.\n- \"Картанд байгаа тоогоор самар хий\" гэж даалгана.\nБайгаль шинжлэлийн төв: Өвөлждөг амьтдын зураг, амьдрах орчны дэвсгэр.\nБарилгын төв: Блок, амьтдын тоглоом.\nУрлагийн төв: \"Хэрэмний нөөц\" наамал.","learner":"Математикийн төв: Тооны картын дагуу самрыг оноож тоолно.\n- Хоёр аяганы самрыг жишиж, аль нь олон болохыг хэлнэ.\nБайгаль шинжлэлийн төв: Амьтдыг орчинд нь байрлуулж, хаана өвөлждөгийг хэлнэ.\nБарилгын төв: Амьтдын үүр барьж, доторх амьтдыг тоолно.\nУрлагийн төв: Хэрэм зурж, хажууд нь 5 самар нааж тоолно."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 5 (4). Хөдөлгөөнт тоглоом: «Найрсаг хосууд»\nЗорилго: Хүүхдүүдийг хамтран ажиллаж, бие биедээ анхаарах тавих чадвар сургах; алхалт, хөдөлгөөний зохицуулалт, тэнцвэрийг хөгжүүлэх; найрсаг харилцаа, эерэг хандлагыг төлөвшүүлэх.\nЯвц:\n- Хэрэглэгдэхүүн: энгийн тууз эсвэл алчуур (хос бүрийг ялгах), хөнгөн саад (конус, шугам, жижиг саадууд), хөгжим (хүсвэл).\n- Хүүхдүүдийг 2-2-оор нь хос болгоно. Хосууд гар гараасаа барина (холбож уяж болно).\n- Багш «аялал»-ыг эхлүүлнэ: шулуун алхах, үсрэх, гүйх; саадыг тойрон алхах, үсрэх, гүйх; зөөлөн гүйх; нэг хөлөө өргөх.\n- Хосууд бүх хөдөлгөөнийг хамтдаа, зохицож хийх ёстой. Хөгжим явж байхад хөдөлж, зогсоход нь зогсоно.\nДүрэм: гар тавихгүй, хосоороо хамт хөдөлнө; бие биеэ татахгүй, түлхэхгүй; унаж бэртэхээс сэргийлж зөөлөн, анхааралтай хөдөлнө; бусад хосуудтай мөргөлдөхгүй.","learner":"- Найзтайгаа хос болж гар гараасаа барина.\n- Хосоороо шулуун алхах, үсрэх, саадыг тойрон гүйх хөдөлгөөнийг зохицон хийнэ.\n- Хөгжим зогсоход хосоороо зогсож, тэнцвэрээ хадгална.\n- Найзаа татахгүй, түлхэхгүй, анхааран хөдөлнө."},{"time":"1630-1700","name":"Номын цаг\nНэмэлт уншлага","teacher":"Чанга уншлага – гурав дахь уншлага (3): «Долоон дэлбээтэй цэцэг» (Төлөвлөгөөний хуудсыг 11.23-ны төлөвлөлтийн дараа үзнэ үү.)\n- Уншихын өмнө: номын нэрийг хүүхдүүдээр хэлүүлж, хавтас, ард талыг үзүүлж, зохиолч В. Катаев, зураачийг танилцуулна.\n- Уншиж байхдаа: «Энд Женя юу хүсэж байна?», «Тэр ямар царайтай байна?», «Дараа нь юу болох вэ?» гэж хүүхдээр яриулж, учир шалтгааныг холбоно («Женя яагаад дэлбээгээ дэмий үрсэн бэ?», «Витяд туслахад яагаад баярласан бэ?»).\n- Уншиж дуусаад: «Хүсэл хүсэхдээ юуг бодох хэрэгтэй вэ?», «Бусдад тусалбал ямар сайхан санагддаг вэ?»\n- Хүсэл, хайхрамжгүй, атаархах, доголон үгээр өгүүлбэр зохиолгоно.\n- Бүтээл: өнгөт цаасаар долоон дэлбээтэй цэцэг хийж, дэлбээ бүр дээр нэг сайн хүсэл зурна.","learner":"- Номын нэр, зохиолчийг өөрөө хэлнэ.\n- Зургийг харж, номын үйл явдлыг дарааллаар нь өөрийн үгээр ярина.\n- Женя Витяд яагаад тусалсныг тайлбарлана.\n- Шинэ үгээр өгүүлбэр зохиож хэлнэ.\n- Долоон дэлбээтэй цэцэг урлаж, сайн хүслээ зурж танилцуулна."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Тоо хэлэхэд бүлэглэ»\nЗорилго: Тоог сонсож тоо хэмжээгээр бүлэглэх, 5 хүртэл тоолох, жиших.\nХэрэглэгдэхүүн: Хөгжим, тооны карт (1–5).\nЯвц:\n1. Хөгжим явж байхад хүүхдүүд чөлөөтэй алхана.\n2. Хөгжим зогсоход багш тооны картыг өргөж «Гурав!» гэнэ.\n3. Хүүхдүүд гурваараа нийлж гар барилцан зогсоно.\n4. Бүлэг бүр «Нэг, хоёр, гурав» гэж өөрсдийгөө тоолж шалгана.\n5. Илүү гарсан хүүхэд «Миний бүлэгт хэдэн хүн дутаж байна вэ?» гэж бодно.\nДүрэм: Найзаа татахгүй, түлхэхгүй; хэнийг ч бүлгээс хасахгүй.\nДүгнэлт: «Хамгийн том бүлэг хэд байсан бэ?» гэж асууж, долоо хоногийг дүгнэнэ.","learner":"- Хөгжмөөр чөлөөтэй алхана.\n- Тоог сонсож, тэр тооны хүүхэдтэй нийлж бүлэг болно.\n- Бүлгийнхнээ чангаар тоолж шалгана.\n- Олон, цөөн бүлгийг жишиж хэлнэ."}]},"2026-11-30":{"method":"Тоглоомонд суурилсан арга (давтамж)","link":"ХЯ3.2а. Харилцан ярианд өөрийн санаачилгаар оролцож, санал бодлоо илэрхийлнэ.","competence":"Нийгэм, сэтгэл хөдлөлийн хөгжил (өөрийгөө удирдах, тайвшрах), харилцах (санал бодлоо хуваалцах, бусдын яриаг таслахгүй сонсох)","materials":"\"Тайвшрах булан\", бодлын сандал, тайвшруулах лонх, сэтгэл хөдлөлийн зурган карт, бөмбөг, бөмбөлөг, ус","criteria":"Уурлаж бухимдвал яах билээ гэж асуухад бусадтай ярилцах, тайвшрах булан, бодлын сандал зэргийг дурдаж хэлдэг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Сэтгэл хөдлөлийн цаг\" самбарт сэтгэлээ байрлуулна.","learner":"- \"Сэтгэл хөдлөлийн цаг\" самбарт өнөөдрийн сэтгэлээ байрлуулна."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Дүрд тоглох: \"Тоглоомоо авахуулчихлаа\" нөхцөл байдлаар дүрд тоглуулж, дүрийн уурласан, бухимдсан мэдрэмжийг үг, нүүр, биеийн хөдөлгөөнөөр илэрхийлүүлнэ.\n- Тайвшрах дасгал: Ус уух, урт амьсгал авах, бөмбөг өнхрүүлэх, 5 хүртэл тоолох дасгалыг хамтдаа хийнэ.\n- \"Тайвшрах булан гэж юу вэ?\": Анги хамт олноороо ярилцаж, буланг хамтдаа тохижуулна; хэрэгцээтэй үедээ очиж болохыг тохиролцоно.\n- Ярилцаж шийдэх: Хосоороо асуудлаа ярилцаж шийдэх дадлага хийлгэнэ.\nБагшийн чиглүүлэх асуулт:\n1. Уурлаж бухимдвал яах билээ?\n2. Тоглоомоо авахуулчихвал найздаа юу гэж хэлэх вэ?\n3. Ямар тайвшрах аргыг сонгох вэ? Яагаад?\n4. Тайвшрах буланд хэзээ очих вэ, тэнд юу хийх вэ?","learner":"- Дүрд орж уурласан, бухимдсан мэдрэмжийг үг, нүүр, биеийн хөдөлгөөнөөр илэрхийлнэ.\n- Ус уух, урт амьсгал авах, бөмбөг өнхрүүлэх дасгалыг хийж, өөрт тохирох аргаа сонгоно.\n- Тайвшрах буланг тохижуулахад оролцож, \"Би уурласан үедээ ... хийнэ\" гэж хэлнэ.\n- Найзтайгаа асуудлаа ярилцаж, хэрхэн шийдэхийг санал болгоно."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Тоглох үед маргааныг ажиглаж чиглүүлнэ.","learner":"- Тоглох үед маргаан гарвал ярилцаж шийднэ."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – эхний уншлага (1): «Уурласан Тэргэл» (Чанга уншлагын төлөвлөгөөний хуудсыг үзнэ үү.)\n- Номын нэр, хавтас, зохиолч, зураачийг танилцуулж, хэмнэлийг алдагдуулахгүй уншина.\n- Түр зогсож асуух: «Цамхгаа нураахад Тэргэл ямар болох бол?»\n- Шинэ үг: «Нурах»\n- Уншсаны дараа: «Тэргэл яагаад уурласан бэ?»","learner":"- Номын нэр, хавтасны зургийг харж, ном юуны тухай байхыг таамаглаж хэлнэ.\n- Багшийн уншихыг анхааралтай, тайван сонсоно.\n- Түр зогсох үед \"Дараа нь юу болох бол?\" гэсэн асуултад өөрийн таамаглалыг хэлнэ.\n- Шинэ үгийн утгыг сонсож, багштай хамт давтан хэлнэ.\n- Уншсаны дараа номын гол дүрүүдийг нэрлэж, хуруугаараа тоолно."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Хэл ярианы төв: Сэтгэл хөдлөлийн карт бэлтгэж, \"Би ... үед уурладаг, тэгэхэд би ...\" өгүүлбэр зохиохыг дэмжинэ.\nУрлагийн төв: Тунгалаг сав, ус, гялтгануур бэлтгэж, тайвшруулах лонх хийх дарааллыг үзүүлнэ.\nТайвшрах булан: Зөөлөн дэр, сэтгэл хөдлөлийн карт, амьсгалын дасгалын карт байрлуулна.\nБарилгын төв: \"Тэргэлийн цамхаг\" – хамтдаа өндөр цамхаг барих.","learner":"Хэл ярианы төв: Уурласан үеийнхээ тухай ярьж, тайвшрах аргаа хэлнэ.\nУрлагийн төв: Тайвшруулах лонх хийж, сэгсрээд гялтганаа буухыг ажиглан тайвширна.\nТайвшрах булан: Тайвшрах буланд очиж, амьсгалын дасгал хийнэ.\nБарилгын төв: Найзтайгаа хамтран цамхаг барьж, нурвал тайван дахин барина."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалгын давтлага: Сарын хөдөлгөөнт тоглоомууд\nЗорилго: Сарын турш тоглосон хөдөлгөөнт тоглоомуудын дүрмийг бататгах, сонголт хийх, хамтран тоглох.\nЯвц:\n- Хүүхдүүдээр сард тоглосон тоглоомуудыг («Түргэн тусламж ирлээ», «Богжинд орлоо», «Бүү унага», «Мөсөн дээр бүү гар», «Найрсаг хосууд») нэрлүүлнэ.\n- Санал хураалтаар 1–2 тоглоомыг сонгож тоглуулна.\n- Тоглоом бүрийн дүрмийг хүүхдүүдээр сануулна.","learner":"- Сард тоглосон тоглоомуудаа нэрлэнэ.\n- Дуртай тоглоомоо санал болгож, яагаад дуртайгаа хэлнэ.\n- Тоглоомын дүрмийг өөрөө сануулж, дүрмээ баримтлан тоглоно."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Хөгжим зогсвол тайвшир»\nЗорилго: Хөдөлгөөний дараа тайвшрах, амьсгалаа удирдах аргыг бататгах.\nХэрэглэгдэхүүн: Хөгжим (хурдан ба удаан), тайвшруулах лонх.\nЯвц:\n1. Хурдан хөгжим явахад хүүхдүүд бүжиглэнэ.\n2. Хөгжим гэнэт зогсоход бүгд хөдөлгөөнгүй зогсоно.\n3. Багш тайвшруулах лонхыг сэгсрэхэд хүүхдүүд гялтганаа бүрэн буух хүртэл гүнзгий амьсгална («Цэцэг үнэрлээд – лаа үлээ»).\n4. Удаан хөгжим тавьж, хүүхдүүд аажуухан хөдөлнө.\n5. Давтан тоглоно.\nДүрэм: Хөгжим зогсоход хөдлөхгүй; бусадтай мөргөлдөхгүй.\nДүгнэлт: «Уурласан үедээ аль аргыг хэрэглэх вэ?» гэж асууж, сарын үйл ажиллагааг дүгнэнэ.","learner":"- Хурдан хөгжмөөр бүжиглэнэ.\n- Хөгжим зогсоход хөдөлгөөнгүй зогсож тайвширна.\n- Гүнзгий амьсгалын дасгал хийнэ.\n- Сарын турш сурсан тайвшрах аргаа хэлнэ."}]}},"readings":[{"days":"11.02 (1-р уншлага), 11.04 (2-р уншлага), 11.06 (3-р уншлага)","book":"Бяцхан туслагч Сараа","author":"Багшийн бэлтгэсэн өгүүлэг. Зураг: багшийн бэлтгэсэн зурагт карт (6 хуудас)","goals":"- Үгсийн сан болон ерөнхий мэдлэгийг тэлэх\n- Харилцан ярилцах, хүүрнэн өгүүлэх чадварыг хөгжүүлэх\n- Сонсож ойлгох чадварыг хөгжүүлэх\n- Сэтгэн бодох үйлийг чиглүүлэн дэмжих\n- Гэр бүлийн гишүүд, тэдний ажил мэргэжлийг ялган нэрлэх (Байгаль, нийгмийн орчин)\n- Өөрийн чадах зүйл, хэрэгцээгээ илэрхийлэх (Нийгэм-сэтгэл хөдлөл)\n- Гэр бүлийн гишүүдийг тав хүртэл тоолох (Математик)","summary":"Сараа аав, ээж, эмээ, ахтайгаа таван хүнтэй гэр бүлд амьдардаг. Аав нь жолооч, ээж нь эмч, эмээ нь тэтгэвэрт гарсан багш. Нэг орой бүгд ядарч ирэхэд Сараа туслахыг санал болгож, ширээ засан, халбага аягаа тоолж тавина. Хоолны дараа ахтайгаа аяга угааж арчина. Аав нь охиноо магтахад Сараа баярлаж, маргаашаас ургамлаа услах үүрэг хүлээнэ.","words":[["Гэр бүл – хамт амьдардаг ойр хүмүүс","Туслах – бусдын ажлыг хөнгөвчлөх (х. 3)","Ширээ засах – хоолны ширээнд аяга, халбага тавих (х. 4, үйлдлээр үзүүлэх)"],["Мэргэжил – хүний хийдэг ажил","Тэтгэвэр – насаар ажлаасаа гарч амрах (х. 1)","Арчих – алчуураар нойтныг хатаах (х. 5, үйлдлээр үзүүлэх)"],["Жолооч, эмч – номын зураг дээр заах","Ядрах – их ажил хийгээд хүч дуусах (х. 3)","Илэх – гараар зөөлөн хүрэх (х. 5, үйлдлээр үзүүлэх)"],["","Үүрэг – хариуцаж хийх ажил (х. 6)",""]],"r1":{"Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Бүгд ядарч ирэхэд Сараа юу хийх бол?» (хуудас 3)\n«Сараа халбагаа хэд хэдээр нь тавих бол?» (хуудас 4)\n«Аав нь Сараад юу гэж хэлэх бол?» (хуудас 5)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Тэтгэвэр – насаар ажлаасаа гарч амрах» (хуудас 1)\n«Туслах – бусдын ажлыг хөнгөвчлөх» (хуудас 3)\n«Үүрэг – хариуцаж хийх ажил» (хуудас 6)","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Сараагийнх хэдэн хүнтэй гэр бүл вэ? Хуруугаараа тоолоорой.»\n«Аав, ээж нь ямар ажил хийдэг вэ?»\nХүүхэд бүр гэрийнхээ гишүүдийг нэрлэх."},"r2":{"Номын тухай эргэн санах: Эхлэл, өрнөл, төгсгөл хэсгүүдтэй холбоотой энгийн асуултууд асуух":"«Номд Сараагийн гэр бүлийн тухай гардгийг санаж байгаа биз. Түүний гэрт хэн хэн байдаг вэ?»\n«Орой гэр бүлийнхэн нь ирэхэд ямар байсан бэ?»\n«Ном хэрхэн төгссөн бэ? Сараа ямар үүрэг хүлээсэн бэ?»","Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Эмээ нь гэртээ юу хийдэг вэ?» (хуудас 2)\n«Сараа яагаад туслахыг хүссэн бэ?» (хуудас 3)\n«Хоолны дараа хэн юу хийсэн бэ?» (хуудас 5)\n«Сараа ямар сэтгэлтэй болсон бэ? Яагаад?» (хуудас 6)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Ширээ засах» (хуудас 4) хүүхдээр үзүүлүүлэх\n«Арчих» (хуудас 5) алчуураар үзүүлэх\n«Илэх» (хуудас 5) биеэр үзүүлэх","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Хэрвээ чи Сараа байсан бол юугаар туслах байсан бэ?»\nДүрд тоглох: нэг хүүхэд Сараа болж ширээ засах, бусад нь гэр бүлийн гишүүд болох.\nТаваг, халбагыг тав хүртэл оноон тавьж тоолох."},"r3":{"Уншихын өмнө":"Энэ номыг бид хамтдаа 2 удаа уншчихсан учраас номын нэрийг та нар мэдэж байгаа шүү дээ. Энэ номын нэр юу билээ? гэх зэргээр хүүхдийг эхнээс нь татан оролцуулна.\nНомын зургуудыг тогтон харуулж ярилцана.\n- Гэр бүл гэж юу вэ?\n- Гэрийн ажилд хэн хэн оролцдог вэ?","Уншиж байхдаа":"Зургийг заан юу болж байгаа тухай асууна: «Энд Сараа юу хийж байна?», «Ах нь юу хийж байна?», «Дараа нь юу болох вэ?» Учир шалтгааныг холбон тайлбарлахыг дэмжинэ: «Аав нь яагаад Сараад баярласан бэ?»","Уншиж дуусаад":"- Дүгнэн ярилцах: «Сараагийн хийсэн зүйлээс юу нь таалагдсан бэ? Яагаад?»\n- Шинэ сурсан үгсээр өгүүлбэр зохиолгох: туслах, үүрэг, ширээ засах, арчих\n- Бүтээл: «Миний гэр бүл» зураг зурж, гишүүн бүрийн ажлыг ярих"},"text":"Хуудас 1. Сараагийнх аав, ээж, эмээ, ах, Сараа гээд таван хүнтэй гэр бүл. Аав нь жолооч, ээж нь эмч, эмээ нь тэтгэвэрт гарсан багш. Ах нь сургуульд сурдаг.\nХуудас 2. Өглөө бүр аав нь машинаа асааж, хүмүүсийг ажилд нь хүргэдэг. Ээж нь эмнэлэгт очиж өвчтэй хүмүүсийг эмчилдэг. Эмээ нь гэртээ боов хийж, ач нартаа үлгэр ярьдаг.\nХуудас 3. Нэг орой бүгд ядарч гэртээ ирэв. Сараа \"Би ч гэсэн туслах уу?\" гэж асуужээ.\nХуудас 4. Ээж нь \"Тэгье, хоолны ширээгээ засаад, халбагаа тавиад өгөөч\" гэв. Сараа халбага, аягаа нэг нэгээр нь тоолж, хүн бүрийн өмнө тавилаа.\nХуудас 5. Хоолны дараа ах нь аяга угааж, Сараа алчуураар арчив. Аав нь \"Манай охин жинхэнэ туслагч болжээ\" гээд толгойг нь илэв.\nХуудас 6. Сараа маш их баярлаж, \"Маргааш би ургамлаа усална, энэ бол миний үүрэг\" гэж хэлжээ."},{"days":"11.09 (1-р уншлага), 11.11 (2-р уншлага), 11.13 (3-р уншлага)","book":"Заан оготно хоёр","author":"Зохиолч: …………………………… Зураач: ……………………………","goals":"- Үгсийн сан болон ерөнхий мэдлэгийг тэлэх\n- Харилцан ярилцах, хүүрнэн өгүүлэх чадварыг хөгжүүлэх\n- Сонсож ойлгох чадварыг хөгжүүлэх\n- Сэтгэн бодох үйлийг чиглүүлэн дэмжих\n- Бусдын орон байр, үгийг хүндэтгэх, жижиг ч гэсэн хүнийг үл тоох ёсгүйг ойлгох (Байгаль, нийгмийн орчин)\n- Бусдын таагүй сэтгэл хөдлөлийн шалтгааныг тайлбарлах (Нийгэм-сэтгэл хөдлөл)\n- Сануулга, анхааруулгыг сонсож дагах нь аюулаас сэргийлдгийг ойлгох (Хөдөлгөөн, эрүүл мэнд)\n- Том, жижиг гэсэн хэмжээг харьцуулах; зурган дээрх хүмүүсийг тав хүртэл тоолох (Математик)","summary":"Голын эрэг дээр том заан, бяцхан оготно хоёр амьдардаг. Заан өдөр бүр ус уугаад оготны нүхийг усаар шүршиж, оготныг гэр оронгүй болгодог. Оготно олон удаа гуйж, сүүлдээ анхааруулсан ч заан түүнийг тоомсорлолгүй инээнэ. Оготно ойр орчмын ардуудад зааны аюулын тухай сануулахад баячууд итгэлгүй тоосонгүй, харин ядуу ардууд нүүж одно. Маргааш нь оготно зааны хамрын нүхээр орж, заан тэвчих аргагүй болж галзуурч, нүүгээгүй айлуудыг сүйтгэнэ. Эцэст нь оготно эрэг дээрх нүхэндээ буцаж ирээд амар сайхан жаргана. Үлгэр нь жижиг ч гэсэн хэнийг ч үл тоомсорлож болохгүй, бусдын үгийг сонсох хэрэгтэйг сургадаг. Ном нь 12 нүүр зурагтай.","words":[["Заан, оготно – номын гол дүрүүд (нүүрэн дээрх зургаар)","Тоомсорлохгүй – үгийг нь тоохгүй, үл хайхрах (х. 5)","Шүршиж – хоншоороор ус цацах (х. 3, гараараа үзүүлэх)"],["Голын эрэг – голын хажуу (х. 2-ын зураг)","Сүйтгэх – эвдэж, нурааж хаях (х. 4)","Нүх, орон байр – оготны гэр (х. 2, зураг дээр заах)"],["Баян, ядуу – ардуудын амьдрал","Нүүх – өөр газар очиж суурьших (х. 9)","Хамрын нүх – зааны урт хамар (х. 10, гараараа үзүүлэх)"],["","Цовхчих, туйлах – үсэрч дэвхрэх (х. 11)","Үнсэн товрог – бүх юм эвдэрч сүйдэх (х. 11, зураг дээр заах)"]],"r1":{"Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Заан нүхийг нь усаар шүршихэд оготны гэрт юу болсон бэ? Оготно ямар санагдсан бол?» (хуудас 3)\n«Оготно анхааруулахад заан яагаад инээсэн бэ? Заан оготныг юу гэж бодсон бол?» (хуудас 6)\n«Оготны сануулгыг хэн сонсож, хэн сонсоогүй вэ? Одоо юу болох бол?» (хуудас 9)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Шүршиж – хоншоороор ус цацах» (хуудас 3) гараараа үзүүлэх\n«Сүйтгэх – эвдэж, нурааж хаях» (хуудас 4)\n«Тоомсорлохгүй – үгийг нь тоохгүй» (хуудас 5)\n«Хамрын нүх – зааны урт хамрын үзүүр» (хуудас 10) зураг дээр заан үзүүлэх","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Оготно зааныг юу гэж гуйсан бэ? Заан түүний гуйлтыг сонссон уу?»\n«Аль айлууд аюулаас аврагдсан бэ? Яагаад?»\nЗургаас заан, оготно хоёрыг харьцуулж «Хэн том, хэн жижиг вэ? Жижигхэн оготно юу хийж чадсан бэ?» гэж ярилцах."},"r2":{"Номын тухай эргэн санах: Эхлэл, өрнөл, төгсгөл хэсгүүдтэй холбоотой энгийн асуултууд асуух":"(Эхлэл) «Үлгэрийн эхэнд заан өдөр бүр юу хийдэг байсан бэ?»\n(Өрнөл) «Оготно зааныг зогсоохын тулд эхлээд юу хийсэн бэ? Дараа нь юу хийсэн бэ?» (гуйсан → анхааруулсан → ардуудад сануулсан)\n(Төгсгөл) «Нүүсэн айлууд, нүүгээгүй айлуудад юу тохиолдсон бэ? Оготно эцэст нь хаана очсон бэ?»","Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Оготно „Миний орон байрыг битгий сүйтгээч“ гэж гуйсан. Хэн нэгэн чиний барьсан байшинг нураавал чи түүнд юу гэж хэлэх вэ?» (хуудас 4)\n«Зурагт хэдэн хүн байна вэ? Хуруугаараа заагаад тав хүртэл тоолоорой.» (хуудас 7)\n«Баячууд „Өчүүхэн оготно юу ч хийж чадахгүй“ гэж бодсон. Тэд зөв бодсон уу? Яагаад?» (хуудас 8)\n«Ядуу ардууд яагаад нүүсэн бэ? Сануулгыг сонсох нь яагаад чухал вэ?» (хуудас 9)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Нүүх – өөр газар очиж суурьших» (хуудас 9)\n«Цовхчих, туйлах – үсэрч дэвхрэх» (хуудас 11) биеэр үзүүлэх\n«Үнсэн товрог – бүх юм эвдэрч сүйдэх» (хуудас 11) зураг дээр заах","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Хэрвээ заан оготны гуйлтыг анх удаа сонссон бол үлгэр яаж төгсөх байсан бэ?»\nДүрд тоглох: нэг хүүхэд заан, нөгөө нь оготно болж, заан оготны гуйлтыг сонсож, уучлалт гуйн найзууд болох шинэ төгсгөлийг тоглох.\nТом, жижиг амьтдын зургийг хоёр бүлэгт ангилж, бүлэг бүрийг тав хүртэл тоолох."},"r3":{"Уншихын өмнө":"Энэ номыг бид хамтдаа 2 удаа уншчихсан учраас номын нэрийг та нар мэдэж байгаа шүү дээ. Энэ номын нэр юу билээ? гэх зэргээр хүүхдийг эхнээс нь татан оролцуулна.\nЭнэ удаа номын хавтас, ард талыг тогтон харуулж, зургийг заан ярилцана. Түүнчлэн ийм сонирхолтой номыг ……………… гэдэг зохиолч, ……………… гэдэг зураач нар бүтээсэн юм байна хэмээн зохиолч, зураачийг танилцуулна.\n- Номын зохиолч гэж юу хийдэг хүнийг хэлдэг вэ?\n- Номын зураач юу хийдэг вэ?","Уншиж байхдаа":"Зургийг заан хүүхдүүдээр яриулна: «Энд заан юу хийж байна?» (х. 3), «Оготно ямар байна? Нүүрийг нь хар даа» (х. 4), «Хэн нүүж байна, хэн үлдэж байна?» (х. 8–9), «Дараа нь юу болох вэ?» Хүүхдийн оролцоо, ойлголт хэр байгаагаас шалтгаалан хэр их хэсгийг өөрөө унших, хэчнээнийг нь хүүхдүүдээр яриулахыг шийднэ. Учир шалтгааныг холбон тайлбарлуулна: «Оготно яагаад уурласан бэ?», «Нүүсэн айлууд яагаад сүйдээгүй бэ?»","Уншиж дуусаад":"- Дүгнэн ярилцах нээлттэй асуулт: «Заан, оготно хоёрын алиных нь үйлдэл зөв байсан бэ? Яагаад?», «Бусдын гэр орныг сүйтгэвэл юу болдог вэ?», «Бяцхан ч гэсэн хүнийг тоохгүй байж болох уу?»\n- Шинэ сурсан үгсийн хэрэглээг дэмжих: шүршиж, сүйтгэх, тоомсорлох, нүүх үгсээр өгүүлбэр зохиолгох\n- Номтой холбоотой бүтээл: шавраар том заан, жижиг оготно барих; оготны шинэ гэр (нүх) зурах"},"text":"Хуудас 1. Эрт урьд цагт нэгэн бяцхан хотын захад нэг заан амьдардаг байжээ. Заан өдөр бүр голд очиж ус ууна.\nХуудас 2. Тэр голын эрэг дээр бас нэгэн оготно амьдарч байжээ.\nХуудас 3. Заан ус ууж ханаад оготны нүхийг усаар шүршиж усанд автуулдаг байжээ.\nХуудас 4. Ингээд оготныг тэсэхийн аргагүй зовлон зүдгүүрт унагахаар нь оготно «Миний өчүүхэн орон байрыг битгий сүйтгээч» гэж олон удаа гуйжээ.\nХуудас 5. Гэвч заан оготны үгийг тоомсорлохгүй урьдын адил сүйтгэж хөнөөсөөр байжээ.\nХуудас 6. Нэгэн өдөр зааныг ирэхэд оготно «Миний орон байрыг сүйтгэхээ зогсоохгүй бол танд дайн зарлана» гэжээ. Заан энэ үгийг сонсоод үл тоомсорлон хөх инээд нь хүрч гэнэ.\nХуудас 7. Оготно тэр хавийн ардуудад «Би заантай байлдана. Ийм учраас маргаашийн дотор та нар эндээс нүүж холдохгүй бол дайны хөлд үрэгдэнэ шүү» гэж зарлажээ.\nХуудас 8. Гэтэл баячууд оготны үгийг бас л тоохгүй, «Энэ өчүүхэн муу оготно заантай яаж байлдах юм бэ? Тэгээд бас улс амьтныг сүйтгэх нь ч гайгүй биз» гээд нүүсэнгүй.\nХуудас 9. Харин ядуу ардууд оготны үгийг сонсоод «Бидэнд аюул учирч магадгүй» гээд нүүцгээжээ.\nХуудас 10. Маргааш нь зааныг усанд ирэхэд оготно хамрын нүхээр нь орж, улаан хоолой, уушги зүрхийг урж гарчээ.\nХуудас 11. Заан амь нь тэмцэж, чарлан цовхчин туйлж, хавь ойрын айл амьтныг дайран сүйтгэж, нүүгээгүй үлдсэн айлуудыг үнсэн товрог болгожээ.\nХуудас 12. Заан галзуурч үхсэнд, оготно зааны хамрын нүхээр буцаж гараад голын эрэгтээ очиж амар сайхан жаргаж гэнэ."},{"days":"11.16 (1-р уншлага), 11.18 (2-р уншлага), 11.20 (3-р уншлага)","book":"Таван найз","author":"Багшийн бэлтгэсэн өгүүлэг. Зураг: багшийн бэлтгэсэн зурагт карт (7 хуудас)","goals":"- Үгсийн сан болон ерөнхий мэдлэгийг тэлэх\n- Харилцан ярилцах, хүүрнэн өгүүлэх чадварыг хөгжүүлэх\n- Сонсож ойлгох чадварыг хөгжүүлэх\n- Сэтгэн бодох үйлийг чиглүүлэн дэмжих\n- Мэдрэхүйн эрхтнүүдийг нэрлэж, тэдгээрийн тусламжтайгаар юмсын шинж чанарыг ялгах (Байгаль, нийгмийн орчин)\n- Өөрийн биеийг хайрлаж, хамгаалах (Хөдөлгөөн, эрүүл мэнд)\n- Таван найзыг тоолж, дарааллаар нэрлэх (Математик)","summary":"Бидний биед нүд, чих, хамар, хэл, гар гэсэн таван найз бий. Нүд өнгө харуулж, чих дуу сонсгож, хамар үнэр мэдрүүлж, хэл амт ялгаж, гар зөөлөн, хатуу, хүйтнийг тэмтэрч мэддэг. Таван найз хамтдаа бидэнд дэлхийг таньж мэдэхэд тусалдаг тул тэднийг арчилж, хамгаалах хэрэгтэй гэсэн санааг өгүүлнэ.","words":[["Мэдрэхүй – нүд, чих, хамар, хэл, гараар мэдрэх чадвар","Анхилуун – сайхан үнэртэй (х. 4)","Тэмтрэх – гараараа хүрч мэдрэх (х. 6, үйлдлээр үзүүлэх)"],["Нүд, чих, хамар, хэл, гар – номын «найзууд» (биеэрээ заах)","Исгэлэн – нимбэг шиг хачин амттай (х. 5)","Жиргээ – шувууны дуу (х. 3, дуурайх)"],["","Хамгаалах – гэмтээхгүй байлгах (х. 7)","Шаржигнах – хатуу юм хазахад гарах дуу (дуурайх)"]],"r1":{"Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Нүдээрээ бид юу хардаг бол?» (хуудас 2)\n«Хамар ямар үнэр мэдрэх бол?» (хуудас 4)\n«Тав дахь найз хэн бол?» (хуудас 6)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Мэдрэхүй» (хуудас 1)\n«Анхилуун – сайхан үнэртэй» (хуудас 4)\n«Исгэлэн» (хуудас 5)","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Бидэнд хэдэн найз байдаг вэ? Тоолоорой.»\n«Аль найз нь дуу сонсдог вэ?»\nТаван найзаа биеэрээ заан нэрлэх."},"r2":{"Номын тухай эргэн санах: Эхлэл, өрнөл, төгсгөл хэсгүүдтэй холбоотой энгийн асуултууд асуух":"«Номд бидний биеийн таван найзын тухай гардгийг санаж байгаа биз. Тэд хэн хэн бэ?»\n«Хэл юуг мэдэрдэг вэ?»\n«Ном хэрхэн төгссөн бэ? Найзуудаа яах хэрэгтэй гэсэн бэ?»","Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Цас ямар өнгөтэй вэ? Аль найз хэлж өгдөг вэ?» (хуудас 2)\n«Чи ямар дуу сонсох дуртай вэ?» (хуудас 3)\n«Ноос, чулуу хоёрыг тэмтрэхэд ямар ялгаатай вэ?» (хуудас 6)\n«Найзуудаа яаж хамгаалах вэ?» (хуудас 7)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Тэмтрэх» (хуудас 6) хүүхдээр үзүүлүүлэх\n«Жиргээ» (хуудас 3) дуурайх\n«Хамгаалах» (хуудас 7)","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Хэрвээ нэг найз маань ажиллахгүй бол бусад нь яаж туслах вэ?»\n«Ид шидийн уут»: нүдээ аниад эд зүйл тэмтэрч, шинжийг нь хэлэх.\nМэдрэхүйн 5 картыг дарааллаар нь тоолж байрлуулах."},"r3":{"Уншихын өмнө":"Энэ номыг бид хамтдаа 2 удаа уншчихсан учраас номын нэрийг та нар мэдэж байгаа шүү дээ. Энэ номын нэр юу билээ? гэх зэргээр хүүхдийг эхнээс нь татан оролцуулна.\nЗурагт картуудыг тогтон харуулж ярилцана.\n- Бидний бие ямар хэсгүүдтэй вэ?\n- Биеэ яаж хамгаалдаг вэ?","Уншиж байхдаа":"Зургийг заан хүүхдүүдээр яриулна: «Энэ найз юу хийдэг вэ?», «Дараагийн найз хэн бэ?» Учир шалтгааныг холбон тайлбарлахыг дэмжинэ: «Яагаад нүдээ хамгаалах хэрэгтэй вэ?»","Уншиж дуусаад":"- Дүгнэн ярилцах: «Аль найз чинь хамгийн их тусалдаг вэ? Яагаад?»\n- Шинэ сурсан үгсээр өгүүлбэр зохиолгох: мэдрэхүй, анхилуун, исгэлэн, тэмтрэх\n- Бүтээл: өөрийн дүрсийг зурж, таван мэдрэхүйн эрхтнийг тэмдэглэх"},"text":"Хуудас 1. Бидний биед таван найз бий. Тэд хамтдаа бидэнд эргэн тойрныхоо юмсыг таньж мэдэхэд тусалдаг.\nХуудас 2. Эхний найз бол нүд. Нүд бидэнд цас цагаан, нар шар, тэнгэр цэнхэр гэдгийг харуулдаг.\nХуудас 3. Хоёр дахь найз бол чих. Чих шувууны жиргээ, бөмбөрийн дуу, ээжийн дуу хоолойг сонсдог.\nХуудас 4. Гурав дахь найз бол хамар. Хамар цэцгийн анхилуун үнэр, ээжийн хийсэн боовны үнэрийг мэдэрдэг.\nХуудас 5. Дөрөв дэх найз бол хэл. Хэл нимбэг исгэлэн, чихэр амттай, давс давстай гэдгийг мэдэрдэг.\nХуудас 6. Тав дахь найз бол гар. Гар ноос зөөлөн, чулуу хатуу, мөс хүйтэн гэдгийг тэмтэрч мэддэг.\nХуудас 7. Таван найз маань хамтдаа байхад бид дэлхийг илүү сайн таньж мэддэг. Тэднийг бид арчилж, хамгаалах хэрэгтэй."},{"days":"11.23 (1-р уншлага), 11.25 (2-р уншлага), 11.27 (3-р уншлага) – 11⁰⁰-11³⁰","book":"Гурван тоорой","author":"Зохиолч: ……………………………   Зураач: ……………………………","goals":"Үгсийн сан болон ерөнхий мэдлэгийг тэлэх\nХарилцан ярилцах, хүүрнэн өгүүлэх чадварыг хөгжүүлэх\nСонсож ойлгох чадварыг хөгжүүлэх\nСэтгэн бодох үйлийг чиглүүлэн дэмжих\nХичээнгүй, ухаалаг байх, ах дүү эвтэй байхын ач холбогдлыг ойлгох (Байгаль, нийгмийн орчин)\nГурав хүртэл тоолох; эхний, хоёр дахь, гурав дахь гэж дарааллыг хэлэх; байшингийн материалыг хатуу, зөөлөн гэж харьцуулах (Математик)","summary":"Мэгж гурван тооройдоо мөнгө өгч, өөрсдийн байшинг барьж амьдрахыг захина. Хамгийн бага тоорой хамтдаа явахыг санал болгосон ч ах нар нь эсэргүүцэж, тус тусдаа байшин барина. Нэг дэх нь сүрлээр, хоёр дахь нь модоор хурдан барьж, гурав дахь нь удаан боловч тоосгоор бат бөх байшин барина. Чоно ирж сүрлэн, модон байшинг үлээж хийсгэхэд ах нар нь дүүгийнхээ гэрт зугтана. Чоно тоосгон байшинг хийсгэж чадалгүй яндангаар орох гэтэл галд унана. Ах нар нь дүүгээсээ сургамж авч, эвтэй найртай амьдарна. Ном нь 15 нүүртэй.","words":[["Тоорой – гахайн төл; мэгж – эх гахай","Хувь заяа – ирээдүйн амьдрал (х. 1)","Үлээх – амьсгаагаа хүчтэй гаргах (х. 9, 11, хүүхдээр үзүүлэх)"],["Сүрэл, мод, тоосго – байшингийн материал","Хэмнэлттэй – мөнгө бага зарцуулах (х. 5)","Сүрэл, тоосго (х. 5, 7, зураг дээр заах)"],["Чоно – номын муу дүр","Эсэргүүцэх – зөвшөөрөхгүй байх (х. 4)","Түгжих – хаалгаа цоожлох (х. 10, үйлдлээр үзүүлэх)"],["","Бат бөх – эвдрэхгүй, хүчтэй (х. 8)","Яндан – зуухны утаа гардаг хоолой (х. 14, зураг дээр заах)"]],"r1":{"Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Ах нар нь яагаад тусдаа явахыг хүссэн бол?» (хуудас 4)\n«Чоно сүрлэн байшинг үлээвэл юу болох бол?» (хуудас 9)\n«Чоно тоосгон байшинг хийсгэж чадах болов уу?» (хуудас 13)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Эсэргүүцэх – зөвшөөрөхгүй байх» (хуудас 4)\n«Хэмнэлттэй – мөнгө бага зарцуулах» (хуудас 5)\n«Бат бөх – эвдрэхгүй, хүчтэй» (хуудас 8) тоосгон байшингийн зургийг заах","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Аль тооройн байшин хамгийн бат бөх байсан бэ? Яагаад?»\n«Ах нар нь дүүгээсээ юу сурсан бэ?»\nГурван байшингийн зургийг «эхний, хоёр дахь, гурав дахь» гэж дарааллаар нь нэрлэх."},"r2":{"Номын тухай эргэн санах: Эхлэл, өрнөл, төгсгөл хэсгүүдтэй холбоотой энгийн асуултууд асуух":"«Номд гурван тоорой ээжийнхээ гэрээс гарч байшин барьсан тухай гардгийг санаж байгаа биз. Тэд юугаар байшингаа барьсан бэ?»\n«Чоно ирээд юу хийсэн бэ?»\n«Үлгэр хэрхэн төгссөн бэ?»","Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Хамгийн бага тоорой юу гэж хэлсэн бэ? Тэр зөв үү?» (хуудас 4)\n«Аль байшинг хамгийн хурдан барьсан бэ? Аль нь удаан?» (хуудас 7–8)\n«Хоёрдугаар тоорой хаалгаа түгжсэн ч яагаад байшин нь хийссэн бэ?» (хуудас 11)\n«Байшин дотор хэдэн тоорой байна вэ? Тоолоорой.» (хуудас 13)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Түгжих – хаалгаа цоожлох» (хуудас 10) үйлдлээр үзүүлэх\n«Аргаа барах – юу хийхээ мэдэхгүй болох» (хуудас 14)\n«Яндан – зуухны утаа гардаг хоолой» (хуудас 14) зураг дээр заах","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Хэрвээ чи тоорой байсан бол юугаар байшин барих байсан бэ? Яагаад?»\nДүрд тоглох: чоно үлээх, тоорой нар зугтах хэсгийг тоглох.\nСүрэл, мөчир, тоосго (эсвэл шоо) зэргийг хүрч мэдэрч, хатуу – зөөлөн гэж харьцуулах."},"r3":{"Уншихын өмнө":"Энэ номыг бид хамтдаа 2 удаа уншчихсан учраас номын нэрийг та нар мэдэж байгаа шүү дээ. Энэ номын нэр юу билээ? гэх зэргээр хүүхдийг эхнээс нь татан оролцуулна.\nЭнэ удаа номын хавтас, ард талыг тогтон харуулж, зургийг заан ярилцана. Түүнчлэн ийм сонирхолтой номыг ……………… гэдэг зохиолч, ……………… гэдэг зураач нар бүтээсэн юм байна хэмээн зохиолч, зураачийг танилцуулна.\nНомын зохиолч гэж юу хийдэг хүнийг хэлдэг вэ?\nНомын зураач юу хийдэг вэ?","Уншиж байхдаа":"Зургийг заан юу болж байгаа тухай асууна: «Энд тоорой юу хийж байна?», «Чоно юу хийх гэж байна?», «Дараа нь юу болох вэ?» Хүүхдийн оролцоо, ойлголт хэр байгаагаас шалтгаалан хэр их хэсгийг өөрөө унших, хэчнээнийг нь хүүхдүүдээр яриулахыг шийднэ. Зөвхөн болсон үйл явдлыг давтан яриулахаас илүүтэйгээр учир шалтгааныг нь холбон тайлбарлах («Тоосгон байшин яагаад хийсээгүй бэ?», «Бага тоорой яагаад удаан барьсан бэ?»), сэтгэн бодох үйлийг дэмжинэ.","Уншиж дуусаад":"Дүгнэн ярилцаж ойлголтыг бататгах үүднээс нээлттэй асуулт асуух: «Хурдан хийсэн ажил сайн уу, сайтар хийсэн ажил сайн уу?», «Ах дүү эвтэй байвал юу сайн бэ?»\nШинэ сурсан үгсийн хэрэглээг дэмжих: бат бөх, эсэргүүцэх, хэмнэлттэй, түгжих үгсээр өгүүлбэр зохиолгох\nНомтой холбоотой зураг зурах, бүтээл хийх: шоо эсвэл хайрцгаар гурван байшин барих; тоорой, чонын хуруун хүүхэлдэй хийх"},"text":"Хуудас 1. Эрт урьдын цагт гурван тооройтойгоо амьдардаг мэгж байжээ. Нэгэн өдөр мэгж тооройнуудаа хандан «Та нар минь одоо том боллоо, өөрсдийн хувь заяагаа хайж ол, та нарыг дахиж тэжээж чадахгүй» гэж хэлээд өөр хотод очиж байшин барь гээд мөнгө өгөн явууллаа.\nХуудас 2. Ингээд гурван тоорой ээжийнхээ гэрээс хамт явжээ. Явах замдаа тэр гурав том модон доор хоног төөрүүлэнгээ хэрхэх төлөвлөгөөгөө ярилцав.\nХуудас 3. Хамгийн эхний тоорой «Бидэнд одоо өөрсдийгөө батлах боломж олдлоо, гурван тусдаа замаар явж азаа сорьцгоовол ямар вэ?» гэхэд хоёр дахь тоорой ч мөн адил санал нийлж «Тиймээ бид өөрсдийн хүчээр амь зууж чадна» гэх мэт яриа өрнүүлсэнд\nХуудас 4. хамгийн ухаалаг гурав дахь тооройд салж явах санаа таалагдаагүй ба ах нар нь муу зүйлтэй тааралдана гэж санаа нь зовсон тул «Бид эвтэй байвал хүчтэй, тиймээс хамтдаа явцгаая» гэхэд хоёр ах нь эсэргүүцэж гэнэ. Тэгээд тэр гурав тус тусдаа байшингаа барьж амьдахаар болов.\nХуудас 5. Маргааш өглөө нь тэд тус тусын байшингаа барихаар болоход нэг дэх тоорой барихад хялбар, мөнгөнд ч хэмнэлттэй гэж сүрлээр байшин барьжээ.\nХуудас 6. Харин удаах тоорой үлдсэн мөнгөөрөө зөөлөн гудас авахын тулд модоор байшин барихыг сонгов.\nХуудас 7. Хоёр ахаасаа ухаалаг бага тоорой харин тоосгоор бат бөх байшин барихыг илүүд үзжээ. Нэгдүгээр тоорой ганцхан өдрийн дотор сүрлэн байшингаа барьж, хоёр дахь тоорой хоёр өдрийн дотор мөчрөөр байшингаа барьж дуусгав.\nХуудас 8. Харин гурав дахь тоорой байшингаа маш удаан барьж дуусгасан боловч олон жилийн турш бат бөх хэвээр байх байшин барьж гэнэ.\nХуудас 9. Гэнэт нэг өдөр чоно гурван тооройг идэхээр ирж гэнэ. Чоно нэгдүгээр тооройн хаалгыг нүдээд «Гарч ирэхгүй бол байшинг чинь үлээж хийсгэнэ» гэхэд нэгдүгээр тоорой «Миний байшин маш бат бөх чи хүссэнээ хий» хэмээн чонод хэлэхэд чоно цээж дүүрэн амьсгаа аваад тооройн байшинг үлээлээ.\nХуудас 10. Нэгдүгээр тоорой байшин нь хийссэн учир хоёрдугаар тооройн байшин луу зугтаж очоод «хаалгаа хаа» хэмээн хашхирав. Хоёрдугаар тоорой хаалгаа хааж бүх цоожоор нь маш сайн түгжив.\nХуудас 11. Гэтэл чоно хоёрдугаар тооройн байшин дээр ирээд бүүр хүчтэй үлээхэд хоёрдугаар тооройн байшин ч мөн адил хийсч орхив.\nХуудас 12. Айж сандарсан хоёр тоорой дүү тооройныхоо гэрлүү зугтаж очоод юу болсон талаар хэлэв.\nХуудас 13. Чоно мөн гуравдугаар тооройн байшингийн гадаа ирээд цээж дүүрэн амисгаа авч амьсгаагаа барагдтал үлээсэн боловч байшинг хийсгэж үл чадав. Байшин хийсгэж чадаагүй чоно уурсаж хаалгыг нь хүчтэй мөргөсөн боловч тусыг үл олов.\nХуудас 14. Аргаа барсан чоно дээвэрлүү авирч яндангаар орох гэтэл дүү тоорой зууханд гал ноцоож чоно гал дээр унаж үхэв.\nХуудас 15. Ингээд нэг, хоёрдугаар тоорой дүү тооройгоосоо маш том сургамжийг авч аз жаргалтай эвтэй найртай амьдарч гэнэ."},{"days":"11.24 (1-р уншлага), 11.25 (2-р уншлага), 11.27 (3-р уншлага) – 16³⁰-17⁰⁰","book":"Долоон дэлбээтэй цэцэг","author":"Зохиолч: В. Катаев. Зураач: ……………………………","goals":"Үгсийн сан болон ерөнхий мэдлэгийг тэлэх\nХарилцан ярилцах, хүүрнэн өгүүлэх чадварыг хөгжүүлэх\nСонсож ойлгох чадварыг хөгжүүлэх\nСэтгэн бодох үйлийг чиглүүлэн дэмжих\nХүслээ ухаалгаар сонгох, бусдад туслахын сайхныг ойлгох (Байгаль, нийгмийн орчин)\n7 хүртэл тоолох; өнгийг нэрлэх; дэлбээ хасагдах бүрт хэд үлдэхийг тоолох (Математик)","summary":"Женя охин дэлгүүрээс цагираган боов авч явахдаа хайхрамжгүй явсаар бүх боовоо нохойд идүүлж, төөрөөд уйлна. Нэгэн эмгэн түүнд хүсэл биелүүлдэг долоон өнгийн дэлбээтэй шидэт цэцэг бэлэглэнэ. Женя дэлбээ тасдах бүртээ хүсэл хүсэх ба гэртээ очих, хагарсан ваарыг бүтэн болгох, хойд туйлд очих, тэндээс буцах, бүх тоглоомыг өөрийнх болгох, буцаах гэх мэтээр зургаан дэлбээгээ дэмий үрнэ. Эцэст нь доголон хөвгүүн Витяг хараад сүүлчийн дэлбээгээрээ түүнийг эрүүл болгож, хамтдаа гүйж тоглоно. Ном нь 26 нүүртэй.","words":[["Дэлбээ – цэцгийн өнгөт хэсэг","Хайхрамжгүй – анхааралгүй (х. 2)","Дэлбээ тасдах, хийсгэх (х. 9, цаасан цэцгээр үзүүлэх)"],["Хүсэл – хийлгэмээр байгаа зүйл","Шившлэг – шидэт үг (х. 7)","Ваар хагарах (х. 12, зураг дээр заах)"],["Солонго өнгө: шар, улаан, ногоон, хөх, улбар шар, ягаан, цэнхэр","Атаархах – бусдын юманд дурлаж харамсах (х. 22)","Хойд туйл, мөс, цагаан баавгай (х. 18–19, зураг дээр заах)"],["","Доголон – хөлөө өвдсөн, сайн алхаж чаддаггүй (х. 24)","Хөөцөлдөж тоглох (х. 26, биеэр үзүүлэх)"]],"r1":{"Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Женягийн цагираган боовыг хэн идсэн бэ? Яагаад?» (хуудас 2)\n«Эмгэн Женяд юу бэлэглэсэн бэ? Энэ цэцэг юу хийж чадах вэ?» (хуудас 6)\n«Женя сүүлчийн дэлбээгээрээ юу хүсэх бол?» (хуудас 24)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Хайхрамжгүй – анхааралгүй» (хуудас 2)\n«Шившлэг – шидэт үг» (хуудас 7) шившлэгийг хамт хэлэх\n«Доголон» (хуудас 24)","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Женягийн аль хүсэл хамгийн сайн хүсэл байсан бэ? Яагаад?»\n«Бусад дэлбээгээ юунд үрсэн бэ?»\nДолоон дэлбээний өнгийг нэрлэж, 1-ээс 7 хүртэл тоолох."},"r2":{"Номын тухай эргэн санах: Эхлэл, өрнөл, төгсгөл хэсгүүдтэй холбоотой энгийн асуултууд асуух":"«Номд Женя шидэт цэцэг олсон тухай гардгийг санаж байгаа биз. Тэр цэцгийг хэнээс авсан бэ?»\n«Женя хойд туйлд яагаад очсон бэ?»\n«Үлгэр хэрхэн төгссөн бэ?»","Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Женя хэдэн цагираган боов авсан бэ? Хэнд хэдийг вэ?» (хуудас 1)\n«Цэцэг хэдэн дэлбээтэй вэ? Ямар өнгөтэй вэ?» (хуудас 6)\n«Хэдэн хэрээ байна вэ? Тоолоорой.» (хуудас 11)\n«Одоо хэдэн дэлбээ үлдсэн бэ?» (хуудас 23)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Атаархах» (хуудас 22)\n«Хойд туйл, мөс, цагаан баавгай» (хуудас 18–19) зураг дээр заах\n«Хөөцөлдөж тоглох» (хуудас 26) биеэр үзүүлэх","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Хэрвээ чамд долоон дэлбээтэй цэцэг байсан бол юу хүсэх байсан бэ?»\nЦаасан цэцгийн дэлбээг нэг нэгээр нь тасдаж, хэд үлдэж байгааг тоолох тоглоом.\nШившлэгийг хамтдаа цээжлэн хэлэх."},"r3":{"Уншихын өмнө":"Энэ номыг бид хамтдаа 2 удаа уншчихсан учраас номын нэрийг та нар мэдэж байгаа шүү дээ. Энэ номын нэр юу билээ? гэх зэргээр хүүхдийг эхнээс нь татан оролцуулна.\nЭнэ удаа номын хавтас, ард талыг тогтон харуулж, зургийг заан ярилцана. Түүнчлэн ийм сонирхолтой номыг ……………… гэдэг зохиолч, ……………… гэдэг зураач нар бүтээсэн юм байна хэмээн зохиолч, зураачийг танилцуулна.\nНомын зохиолч гэж юу хийдэг хүнийг хэлдэг вэ?\nНомын зураач юу хийдэг вэ?","Уншиж байхдаа":"Зургийг заан юу болж байгаа тухай асууна: «Энд Женя юу хүсэж байна?», «Тэр ямар царайтай байна?», «Дараа нь юу болох вэ?» Хүүхдийн оролцоо, ойлголт хэр байгаагаас шалтгаалан хэр их хэсгийг өөрөө унших, хэчнээнийг нь хүүхдүүдээр яриулахыг шийднэ. Зөвхөн болсон үйл явдлыг давтан яриулахаас илүүтэйгээр учир шалтгааныг нь холбон тайлбарлах («Женя яагаад дэлбээгээ дэмий үрсэн бэ?», «Витяд туслахад Женя яагаад баярласан бэ?»), сэтгэн бодох үйлийг дэмжинэ.","Уншиж дуусаад":"Дүгнэн ярилцаж ойлголтыг бататгах үүднээс нээлттэй асуулт асуух: «Хүсэл хүсэхдээ юуг бодох хэрэгтэй вэ?», «Бусдад тусалбал ямар сайхан санагддаг вэ?»\nШинэ сурсан үгсийн хэрэглээг дэмжих: хүсэл, хайхрамжгүй, атаархах, доголон үгсээр өгүүлбэр зохиолгох\nНомтой холбоотой зураг зурах, бүтээл хийх: өнгөт цаасаар долоон дэлбээтэй цэцэг хийж, дэлбээ бүр дээр нэг сайн хүсэл зурах"},"text":"Хуудас 1. Женя хэмээх охин байжээ. Нэгэн удаа ээж нь түүнийг дэлгүүр лүү цагираган боов авахуулахаар явуулжээ. Охин долоон цагираган боов: аавдаа хоёр гоньдтойг, ээждээ хоёр намуу цэцэгтэйг, өөртөө хоёр чихэртэйг, харин дүү Павликдаа нэг бяцхан ягаан өнгөтэйг авчээ.\nХуудас 2. Хэлхээтэй цагираган боовнуудаа аваад гэрийн зүг явлаа. Замдаа хаяг уншин, хэрээ тоолсон шиг хайхрамжгүй явж байв. Харин тэр хооронд нь нэг нохой араас нь даган бүх цагираган боовнуудыг нь нэг нэгээр нь идчихжээ. Эхлээд аавынх нь гоньдтойг, дараа нь ээжийнх нь намуу цэцгийн үртэйг, тэгээд Женягийн чихэртэйг.\nХуудас 3. Женяд цагираган боов нь нэг л хөнгөхөн болсон мэт санагдав. Эргээд хартал аль хэдийн оройтсон байлаа. Хэлхсэн утас нь хоосон санжигнаж, нохой хамгийн сүүлийн Павликийн ягааныг идэж дуусаад амаа долоож байв. «Аа, муу нохой!» гэж Женя орилоод барьж авахаар араас нь хөөв.\nХуудас 4. Гүйсээр гүйсээр гүйцсэн ч юмгүй өөрөө харин төөрч орхисон байв. Эргэн тойрноо харахад өндөр байшин байхгүй, дан жижиг байшинтай бүүр мэдэхгүй газар хүрээд иржээ. Женя айгаад уйлж гарав. Гэнэт хаанаас ч юм бүү мэд нэг эмгэн гараад ирэв. «Охин минь, охин минь, юунд уйлаав?» хэмээн асуув.\nХуудас 5. Женя эмээд бүгдийг ярьж өглөө. Эмгэн охиныг өрөвдөн цэцэрлэгтээ дагуулан ороод «Уйлах хэрэггүй дээ, би чамд туслая. Надад цагираган боов бас мөнгө байхгүй л дээ. Харин цэцэрлэгт маань хүсэл биелүүлдэг долоон дэлбээтэй нэгэн шидэт цэцэг ургадаг юм. Чамайг сайн охин гэдгийг би мэднэ. Чамд би долоон дэлбээт цэцгээ бэлэглэе, тэр чамд бүгдийг бүтээж өгнө» гэв.\nХуудас 6. Ингэж хэлээд эмгэн балжингарам цэцэгтэй тестэй гоёмсог цэцгийг тасдан авч Женя охинд өглөө. Тэр цэцэг шар, улаан, ногоон, хөх, улбар шар, ягаан, цэнхэр гээд өөр өөр өнгөтэй долоон тунгалаг дэлбээтэй аж. «Энэ цэцэг энгийн биш. Чиний хүссэн бүхнийг биелүүлнэ. Ингэхийн тулд аль нэг дэлбээг тасдан хийсгээд,\nХуудас 7. Нис нис дэлбээхэн, Өрнийг дамжин дорно хүртэл, Умардаар дамжин өмнөдөөр дамжин, Тойрон тойрон буцаад ир, Хөрст газар хүрмэгц, Хүслийг минь биелүүлээрэй, хүсэл минь биелэх болтугай гэж шившээрэй. Тэр дариуд л биелэх болно.\nХуудас 8. Женя эмгэнд элдэгээр талархан хаалгаар гармагцаа гэртээ хүрэх замаа мэдэхгүйгээ саналаа. Тэгээд цэцэрлэг рүү буцан очиж хамгийн ойрын цагдаагийн газар хүргэн өгөхийг гуйх гэтэл урьд нь байгаагүй юм шиг эмгэн ч байдаггүй, цэцэрлэг ч байдаггүй. Яана аа? Женя нөгөө л уйлдгаараа, бүр хамраа атиралдуулж ирээд уйлж гарав.\nХуудас 9. Гэнэт шидэт цэцгийг саналаа. Женя шар дэлбээг таслан хийсгээд: Нис нис дэлбээхэн, ... Хүслийг минь биелүүлээрэй, цагираган боовтой гэртээ очсон байх болтугай гэж амандаа шившив. Хэлж дуусав уу, үгүй юу л хэлхээтэй шүүшигнүүдээ барьчихсан гэртээ зогсож байх нь тэр.\nХуудас 10. Ээждээ цагираган боовоо өгчихөөд дотроо бодлоо: «Энэ үнэхээр гайхалтай цэцэг болохоор хамгийн гоё ваарранд л байх ёстой».\nХуудас 11. Тавиур дээр байгаа ээжийнхээ хайртай ваарранд хүрлээ. Яг тэр үед цонхны дэргэдүүр гай болж хэдэн хэрээ нисэж байв. Женя ч мэдээж долоо юу, найм уу, яг хэдэн хэрээ байгааг мэдмээр санагдаж хуруу даран тоолж эхлэлээ.\nХуудас 12. Харин ваар доошоо унаж жижиг хэсгүүд болон бяц үсрэв. «Чи дахиад л юм хагалчихаа юу? Арай миний хамгийн хайртай ваар биш биз?» гэж ээж нь галын өрөөнөөс хашгирах нь тэр. «Үгүй ээ, ээж ээ, үгүй, би юу ч хагалаагүй. Та л тэгж сонссон байх!» гээд Женя агшин зуур улаан дэлбээ таслан хийсгээд,\nХуудас 13. Нис нис дэлбээхэн, ... Хүслийг минь биелүүлээрэй, Ээжийн хайртай ваар бүтэн болтугай! хэмээн шившлээ.\nХуудас 14. Хэлж амжаагүй байтал л ваарны хэлтэрхийнүүд бие биетэйгээ нийлж бүтэн боллоо. Ээж нь галын өрөөнөөс гүйж иртэл хайртай ваар нь юу ч болоогүй мэт байрандаа л байж байв. Ямартаа ч ээж нь Женяг мэдээтэй байгаарай гэж хуруугаа занган зандраад гадаа гарч тогло гэв.\nХуудас 15. Гадагш гартал хөвгүүд элсэнд бургас хатгаж, хуучин банзан дээр суугаад тоглож байв. «Хөвгүүд ээ! Намайг тоглоомондоо оруулаач» гэтэл хөвгүүд «Чи яах гээв! Хойд туйл гэдгийг харахгүй байна уу? Хойд туйлд бид охидыг авахгүй ээ» гэцгээв.\nХуудас 16. «Ямар гээчийн хойд туйл вэ? Нэг муу банз л байна» гэж Женя хэлэв. Хөвгүүд «Банз бишээ, энэ чинь мөс байхгүй юу. Цаашаа яв, битгий саад болоод бай. Бид нар хүчтэй шахалтанд орчихоод байна!» гэлээ. «Тэгэхээр, авахгүй юм биз дээ?» гэхэд «Авахгүй ээ. Цаашаа яв!» гэв.\nХуудас 17. Женя «Тэгж л бай! Би та наргүйгээр яг одоо хойд туйл дээр очно доо. Харин та нарынх шиг ийм биш, яг жинхэнэ дээр нь очно. Таанусых чинь муурын сүүл, за юу.» гээд тэднээс бага зэрэг холдож хаалганы тэнд зогсоод ид шидийн долоон дэлбээт цэцгэнээсээ хөх дэлбээг таслан хийсгээд, шившлэгээ хийв.\nХуудас 18. Хэлж дуусаагүй байтал хаанаас ч юм бүү мэд хүй салхи гарч, нарыг халхлан шөнө болж, газар дэлхий хөл доор эргүүлэг мэт эргэлдэж гарав. Зуны даашинзтай хөл нүцгэн Женя хойд туйл дээр гав ганцаараа зогсож байв. Харин тэнд жавар тачигнаж 100 хэмийн хүйтэн байлаа. «Ээж ээ, хөлдөх нь ээ» гэж Женя хашгираад уйлж эхлэв, харин нулимс нь тэр дороо мөс болон хувирч цоргоноос гоожсон мэт хамарнаас нь унжин тогтжээ.\nХуудас 19. Ингэж байтал мөсөн уулнуудын цаанаас аймшигтай долоон цагаан баавгай гарч ирээд шууд охины чиглэн ирэв. Ухаан алдатлаа айсан Женя бээрсэн гараараа долоон дэлбээт цэцгээ авч ногоон дэлбээг таслан хийсгээд, Яг одоо хашаандаа эргэн очтугай хэмээн шившлэг хийв.\nХуудас 20. Яг тэр мөчид хашаандаа эргээд ирсэн байв. Гэтэл хөвгүүд түүнийг харж шоолон инээлдэж: – Чиний нөгөө хойд туйл чинь тэгээд хаана байна даа?\nХуудас 21. – Би тэнд байж байгаад ирлээ. – Бид нар хараагүй юм чинь батал л даа. – Хар л даа. Миний хамарнаас одоо хүртэл мөс унжиж байна. – Энэ чинь мөс биш гэхэд Женя гомдож хөвгүүдтэй тоглохоо болихоор шийдээд өөр хашаа уруу охидтой тоглохоор явлаа.\nХуудас 22. Тэнд ирээд хартал охид янз бүрийн тоглоомоор тоглож байв. Нэг нь хүүхэлдэйгээр, нөгөө нь бөмбөгөөр тоглоно. Женя атаархсандаа улбар шар дэлбээгээ таслан «Дэлхийн бүх тоглоом минийх болтугай» гэж хүсэв. Гэтэл асар олон тоглоом ирж хотыг дүүргэсэн тул Женя айж,\nХуудас 23. ягаан дэлбээгээ таслан «Тоглоомууд бушуухан дэлгүүртээ эргэн очтугай» хэмээн шившлээ. Тэр дариуд бүх тоглоом алга болов. Женя долоон дэлбээт цэцгээ хартал ердөө ганцхан дэлбээ үлдсэн байлаа. «Зургаан дэлбээгээ ямар ч хэрэггүй үржээ. Одоо болгоомжтойхон шиг байя даа» гээд алхаж явлаа.\nХуудас 24. Гэнэт нэг нүдэнд дулаахан хөвгүүн хаалганы дэргэд сандал дээр сууж харагдлаа. Женя түүнтэй танилцахаар дөхөж очлоо. – Чиний нэрийг хэн гэдэг вэ? – Витя. Харин чиний? – Женя. Хөөцөлдөж тоглох уу? – Чадахгүй нь ээ, би доголон шүү дээ.\nХуудас 25. Женя түүний хөл уруу хараад: «Би чамтай гүйж тогломоор байна» гэхэд Витя: «Би ч бас чамтай гүймээр байна, даан ч боломжгүй» гэв. Женя халааснаасаа хамгийн сүүлийн цэнхэр дэлбээг таслан хийсгээд: Витя эрүүл болох болтугай! хэмээн шившлэг хийв.\nХуудас 26. Яг тэр агшинд жаалхүү сандлаасаа үсрэн босож Женятай уралдан тоглож, охин хичнээн хичээгээд ч гүйцэхээргүй тийм сайн гүйж гарав."},{"days":"11.30 (1-р уншлага), 12.02 (2-р уншлага), 12.04 (3-р уншлага)","book":"Уурласан Тэргэл","author":"Багшийн бэлтгэсэн өгүүлэг. Зураг: багшийн бэлтгэсэн зурагт карт (6 хуудас)","goals":"- Үгсийн сан болон ерөнхий мэдлэгийг тэлэх\n- Харилцан ярилцах, хүүрнэн өгүүлэх чадварыг хөгжүүлэх\n- Сонсож ойлгох чадварыг хөгжүүлэх\n- Сэтгэн бодох үйлийг чиглүүлэн дэмжих\n- Уурласан үедээ тайвшрах аргуудыг нэрлэж хэрэглэх (Нийгэм-сэтгэл хөдлөл)\n- Харилцан ярианд санал бодлоо илэрхийлэх (Хэл яриа)\n- Тав хүртэл аажуухан тоолох (Математик)","summary":"Тэргэлийн барьсан цамхгийг Ганбаа санамсаргүй мөргөж нураана. Тэргэл уурлаж хашгирах гэснээ багшийн заасныг санаж, гүнзгий амьсгаа аваад тав хүртэл тоолж, «Тайвшрах булан»-д очно. Тайвширсны дараа Ганбаад сэтгэлээ хэлэхэд Ганбаа уучлалт гуйж, хоёулаа хамтдаа илүү өндөр цамхаг барина.","words":[["Уурлах – их дургүй болж, бухимдах","Нурах – унаж эвдрэх (х. 1)","Гараа зангидах – нударгаа чанга атгах (х. 2, үйлдлээр үзүүлэх)"],["Тайвшрах – сэтгэлээ намдаах","Санамсаргүй – санаатай биш (х. 1)","Гүнзгий амьсгаа – удаан, гүн амьсгалах (х. 3, хамт хийх)"],["","Уучлалт гуйх – буруугаа хүлээж, уучлаарай гэх (х. 5)","Сэгсрэх – хөдөлгөж доргиох (х. 3, лонхоор үзүүлэх)"]],"r1":{"Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Цамхгаа нураахад Тэргэл ямар болох бол?» (хуудас 2)\n«Тэргэл яаж тайвшрах бол?» (хуудас 3)\n«Ганбаа юу гэж хариулах бол?» (хуудас 5)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Нурах» (хуудас 1)\n«Санамсаргүй – санаатай биш» (хуудас 1)\n«Тайвшрах» (хуудас 3)","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Тэргэл яагаад уурласан бэ?»\n«Тэргэл ямар аргаар тайвширсан бэ?»\nХамтдаа гүнзгий амьсгаа аваад тав хүртэл аажуухан тоолох."},"r2":{"Номын тухай эргэн санах: Эхлэл, өрнөл, төгсгөл хэсгүүдтэй холбоотой энгийн асуултууд асуух":"«Номд Тэргэлийн цамхаг нурсан тухай гардгийг санаж байгаа биз. Хэн нураасан бэ?»\n«Тэргэл уурлахдаа юу хийх гэсэн бэ?»\n«Ном хэрхэн төгссөн бэ?»","Түр зогсож асуулт асуух хуудаснуудыг тэмдэглэн асуултыг бичих":"«Уурлахад бие ямар болдог вэ?» (хуудас 2)\n«Тайвшрах булан юунд хэрэгтэй вэ?» (хуудас 3)\n«Ганбаа санаатай нураасан уу?» (хуудас 5)","Уншиж байхдаа танилцуулах үгсийг хуудасны дугаарын хамт тэмдэглэх":"«Гараа зангидах» (хуудас 2) үзүүлэх\n«Гүнзгий амьсгаа» (хуудас 3) хамт хийх\n«Уучлалт гуйх» (хуудас 5)","Уншиж дуусаад асуух асуулт, ярилцах зүйлс, хийх бүтээл":"«Хэрвээ чи Тэргэл байсан бол яах байсан бэ?»\nДүрд тоглох: Тэргэл, Ганбаа болж ярилцах.\nТайвшруулах лонх сэгсэрч ажиглах."},"r3":{"Уншихын өмнө":"Энэ номыг бид хамтдаа 2 удаа уншчихсан учраас номын нэр юу билээ? гэх зэргээр хүүхдийг татан оролцуулна.","Уншиж байхдаа":"Зургийг заан хүүхдүүдээр яриулна: «Энд Тэргэл юу хийж байна?», «Дараа нь юу болох вэ?»","Уншиж дуусаад":"- Дүгнэн ярилцах: «Тэргэлийн хийсэн зүйлээс юу нь таалагдсан бэ?»\n- Шинэ үгсээр өгүүлбэр зохиох: тайвшрах, санамсаргүй, уучлалт гуйх\n- Бүтээл: «Миний тайвшрах арга» зураг"},"text":"Хуудас 1. Тэргэл блокоор өндөр цамхаг барьж байв. Тэгтэл Ганбаа гүйж ирээд санамсаргүй мөргөж, цамхаг нурчихжээ.\nХуудас 2. Тэргэлийн нүүр улайж, гараа зангидав. Тэр хашгирах гэж байснаа багшийн заасныг санав: \"Уурласан үедээ эхлээд тайвшир.\"\nХуудас 3. Тэргэл гүнзгий амьсгаа аваад \"Нэг, хоёр, гурав, дөрөв, тав\" гэж аажуухан тоолов. Дараа нь \"Тайвшрах булан\"-д очиж, тайвшруулах лонхоо сэгсрэн гялтганаа доош буухыг ажиглажээ.\nХуудас 4. Уур нь жаахан намдахад Тэргэл Ганбаа дээр очоод \"Чи миний цамхгийг нураахад би их уурласан\" гэж хэлэв.\nХуудас 5. Ганбаа \"Уучлаарай, би санаатай хийгээгүй. Хамтдаа дахиад барих уу?\" гэжээ.\nХуудас 6. Хоёр хүү хамтдаа бүр илүү өндөр цамхаг барьжээ. Тэргэл \"Уурласан үедээ тайвширч, ярилцвал бүх юм сайхан болдог юм байна\" гэж бодлоо."}]},"12":{"approverTitle":"АРГАЗҮЙЧ","approver":"Ц.ОДОНЧИМЭГ","exclude":["ХӨГЖИМ"],"links":{"НСХ3.3а":"БНО3.2г","ХЭМ3.1з":"ХӨГ3.1г","ХЭМ3.2е":"ХЯ3.3б","ХЯ3.2а":"НСХ3.3в","ХЯ3.2д":"МАТ3.2б","ХЯ3.3б":"ХЭМ3.2е","БНО3.1в":"ХЯ3.2в","БНО3.1г":"ЗУ3.2а","БНО3.2в":"ХЭМ3.2е","БНО3.2д":"ХЯ3.2г","МАТ3.2а":"БНО3.1в","МАТ3.3а":"ХЭМ3.2в","ЗУ3.1а":"ХЯ3.2г","ЗУ3.2е":"БНО3.2г","НСХ3.1а":"ХЯ3.2б","НСХ3.1б":"ХЭМ3 ,"link":"БНО3.2г"},{"date":"2026-12-23","code":"ЗУ3.1а","link":"ХЯ3.2г"},{"date":"2026-12-24","code":"БНО3.2д","link":"ХЯ3.2г"},{"date":"2026-12-25","code":"ХЯ3.3в","link":"ЗУ3.2б"},{"date":"2026-12-28","code":"НСХ3.3в","link":"ХӨГ3.1б"},{"date":"2026-12-30","code":"ХЭМ3.2ж","link":"БНО3.1г"},{"date":"2026-12-31","code":"НСХ3.3б","link":"БНО3.2а"}],"acts":{"2026-12-01":{"method":"Шинжлэн судлах арга","link":"ЗУ3.2а. Өөрийн бодол төсөөллөөр зохиомжлон зурна.","competence":"Шүүн тунгаах (ажигласан зүйлээ тэмдгээр илэрхийлэх, шалтгааныг тайлбарлах), бүтээлчээр сэтгэх (өвлийн байгалийг төсөөллөөрөө зурах)","materials":"Цаг агаарын хуанли, тэмдгийн карт (нар, үүл, цас, салхи), хүүхэлдэй ба өвлийн хувцас, хар/хөх өнгийн цаас, цагаан гуаш, хөвөн, томруулдаг шил","criteria":"Өнөөдрийн цаг агаарыг тэмдгээр илэрхийлж, тохирох хувцсаа сонгон тайлбарладаг. Өвлийн байгалийн зургийг өөрийн санаагаар зохиомжлон зурдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, цонхоор харуулан \"Өнөөдөр гадаа ямар байна вэ?\" гэж асууж, хуанлид тэмдгийг байрлуулна.","learner":"- Багш, найзуудтайгаа \"Өглөөний мэнд\" гэж мэндчилж, тойрогт сууна.\n- Цонхоор харж тэнгэр, газар, модыг ажиглана.\n- \"Өнөөдөр гадаа цас орж байна / үүлтэй байна / салхитай байна\" гэж бүтэн өгүүлбэрээр хэлнэ.\n- Тэмдгийн картуудаас өнөөдрийн цаг агаарт тохирохыг сонгож, хуанлийн өнөөдрийн нүдэнд байрлуулна.\n- Найзынхаа сонгосон тэмдэг зөв эсэхийг шалгаж, санал нэмнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Ажиглаж ярилцах: Өглөөний цасыг аяганд авчирч, томруулдаг шилээр цасан ширхгийг ажиглуулна.\n- Тэмдгээр илэрхийлэх: \"Цас орж байна\", \"Салхитай байна\" гэх мэт цаг агаарыг тэмдгийн картаар илэрхийлүүлнэ.\n- Хувцас сонгох: Хүүхэлдэйд өнөөдрийн цаг агаарт тохирох хувцас сонгуулж, \"Яагаад энэ хувцсыг сонгосон бэ?\" гэж асууна.\nБагшийн чиглүүлэх асуулт:\n1. Өнөөдөр цаг агаар ямар байна вэ? Аль тэмдгийг тавих вэ?\n2. Цас ороход бид ямар хувцас өмсөх вэ? Яагаад?\n3. Цасан дээр гадаа юу хийж тоглож болох вэ?\n4. Өвлийн өдрийг зурвал чи юу зурах вэ?","learner":"Ажиглаж ярилцах:\n- Аяган дахь цасыг томруулдаг шилээр ээлжлэн ажиглана.\n- Цасан ширхгийн хэлбэрийг (\"од шиг\", \"зургаан салаатай\") өөрийн үгээр дүрсэлнэ.\n- Цасанд хуруугаараа хүрч \"хүйтэн, зөөлөн, нойтон\" гэж мэдрэмжээ хэлнэ.\nТэмдгээр илэрхийлэх:\n- Багшийн хэлсэн цаг агаарыг сонсоод тохирох тэмдгийн картыг өргөж үзүүлнэ.\n- Өөрөө нэг тэмдэг сонгоод \"Энэ ... гэсэн тэмдэг\" гэж тайлбарлана.\nХувцас сонгох:\n- Хүүхэлдэйд малгай, ороолт, бээлий, куртик, гутлыг сонгон өмсгөнө.\n- \"Гадаа хүйтэн учраас малгай өмсгөсөн\" гэх мэтээр сонголтынхоо шалтгааныг хэлнэ.\n- Зуны хувцсыг тусад нь ялгаж тавина.\nАсуултад хариулах:\n- Багшийн асуулт бүрт гараа өргөж ээлжээ авна.\n- Цасан дээр хийх дуртай тоглоомоо нэрлэж, өвлийн өдрийг юу зурахаа хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Дүрт тоглоомын буланд өвлийн хувцас, хүүхэлдэй байрлуулж, хүүхдүүдийн хувцаслалтыг ажиглана.","learner":"- Дүрт тоглоомын буланд очиж хүүхэлдэйгээ сонгоно.\n- Хүүхэлдэйгээ өвлийн хувцсаар дарааллын дагуу (өмд, цамц, куртик, малгай, бээлий) хувцаслана.\n- Найздаа \"Гадаа хүйтэн байна, малгайгаа өмс\" гэж зөвлөж дүрд тоглоно.\n- Тоглож дуусаад хувцсыг эвхэж, байранд нь тавина."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Цаг агаарын тухай шүлэг (\"Цас\") уншиж, цээжлүүлнэ.\n- Шүлгийн мөр бүрийн дараа хүүхдүүдээр давтуулна.\n- \"Шүлэгт цас ямар байна гэж хэлсэн бэ?\" гэж асууна.","learner":"- Шүлгийн нэрийг сонсож, \"Цас\" гэдэг үгийг давтан хэлнэ.\n- Багшийн уншихыг анхааралтай сонсоод мөр бүрийг дагаж хэлнэ.\n- Шүлэгт гарсан цасыг илэрхийлсэн үгсийг (цагаан, зөөлөн, хүйтэн) нэрлэнэ.\n- Шүлгийг цас бууж буй мэт гараа доош хөдөлгөн дагуулж уншина.\n- Хамгийн таалагдсан мөрөө хэлнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: \"Өвлийн өдөр\" сэдвээр хөх цаасан дээр цагаан гуашаар цас, цасан хүн зурах. Хөвөн, бийр бэлтгэнэ.\n- Хүүхэд бүрээс \"Чиний зурагт юу болж байна вэ?\" гэж асууна.\nБайгаль шинжлэлийн төв: Аяганд цас хийж, хэд хэдэн цагийн дараа юу болохыг ажиглах.\nДүрт тоглоомын төв: \"Цаг агаарын мэдээ\" – тэмдгийн картыг ашиглан хөтлөгч болох.","learner":"Урлагийн төв:\n- Хөх цаасан дээр цагаан гуашаар цас, цасан хүн, мод зурна.\n- Хөвөнгөөр дарж цасан ширхгийн дардас хийнэ.\n- Зурсан зургаа \"Миний зурагт ... байна\" гэж найздаа тайлбарлана.\nБайгаль шинжлэлийн төв:\n- Аяганд цас хийж, хэдэн цагийн дараа дахин очиж харна.\n- \"Цас хайлж ус болжээ\" гэж ажигласнаа хэлнэ.\nДүрт тоглоомын төв:\n- Цаг агаарын мэдээний хөтлөгч болж тэмдгийн картыг заан \"Маргааш цас орно, дулаан хувцаслаарай\" гэж мэдээ хэлнэ.\n- Бусад нь үзэгч болж хөтлөгчөөс асуулт асууна."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 1 (1). Ажиглалт: Өвлийн эхэн үеийн байгалийг ажиглах\nЗорилго: Өвлийн эхэн үед байгальд гарч буй өөрчлөлтийг ажиглуулах, цас, хяруу, мөс, хүйтэн агаар, модны төрх, хүмүүсийн хувцаслалт зэрэг шинжээр өвлийн улирлыг ялгах чадварыг хөгжүүлэх.\nЯвц:\n- Хүүхдүүдийг зугаалгын талбайд гаргаж, орчныг хамтдаа ажиглуулна. Аюулгүй, халтиргаагүй хэсэгт зогсоож ярилцана.\n- Багшийн яриа: «Хүүхдүүд ээ, өнөөдөр бид өвлийн эхэн үеийн байгалийг ажиглана. Гадаа юу өөрчлөгдсөн байна вэ? Газар ямар өнгөтэй болсон байна вэ? Мод, байшин, тоглоомын талбай дээр юу тогтсон байна вэ?»\n- Багшийн мэдээлэл: Өвөл болохоор цаг агаар хүйтэрнэ, тэнгэр ихэвчлэн бүрхэг байна. Бороо орох нь багасаж, оронд нь цас орно. Гол, нуур, шалбааг хөлдөж мөс болно. Өдөр богино болж, шөнө уртасна. Модод навчгүй болсон ч амьд хэвээрээ байдаг. Цас модны үндсийг хүйтнээс хамгаалдаг.\n- Шүлэг: «Цагаан цасхан»\n- Асуулт: «Одоо ямар улирал болж байгаа вэ?», «Намартай харьцуулахад гадаа ямар өөрчлөлт орсон байна вэ?», «Цас модны үндэст ямар хэрэгтэй вэ?», «Өвлийн улиралд хүмүүс ямар хувцас өмсдөг вэ?», «Цаг агаарын хувьд намраас ямар ялгаатай байна вэ?», «Дулаан хувцас өмсөхгүй бол юу болох вэ?»","learner":"- Багшийн дагуу талбайд гарч, халтиргаагүй хэсэгт зогсоно.\n- Газар, мод, байшин, тоглоомын талбай дээрх цас, хяруу, мөсийг ажиглаж нэрлэнэ.\n- Намар ба өвлийг харьцуулж \"Намар навч байсан, одоо цас орсон\" гэж хэлнэ.\n- Багшийн мэдээллийг сонсоод \"Цас модны үндсийг хүйтнээс хамгаална\" гэж давтан хэлнэ.\n- Хүмүүсийн өвлийн хувцаслалтыг ажиглаж нэрлэнэ.\n- «Цагаан цасхан» шүлгийг багштай хамт мөр мөрөөр давтан хэлнэ.\n- Багшийн асуулт бүрт өөрийн үгээр хариулна."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Цаг агаар таа»\nЗорилго: Цаг агаарын байдлыг хөдөлгөөн, тэмдгээр илэрхийлэх.\nЯвц:\n1. Багш тэмдгийн карт үзүүлэхэд хүүхдүүд хөдөлгөөнөөр илэрхийлнэ (нар – гараа дэлгэх, цас – хуруугаа хөдөлгөн доош буулгах, салхи – ганхах).\n2. Дараа нь нэг хүүхэд хөдөлгөөн хийж, бусад нь цаг агаарыг таана.\nДүрэм: Ээлжээ хүлээнэ; зөв таасан хүүхэд дараагийн ээлжийг авна.\nДүгнэлт: Өнөөдөр цас ямар байсныг хамтдаа ярина.","learner":"- Тойрогт зогсож багшийн үзүүлсэн тэмдгийн картыг харна.\n- Нар – гараа дэлгэх, цас – хуруугаа хөдөлгөн доош буулгах, салхи – ганхах хөдөлгөөн хийнэ.\n- Ээлжээрээ голд гарч цаг агаарыг хөдөлгөөнөөр үзүүлж, бусад нь таана.\n- Зөв таасан бол дараагийн ээлжийг авна.\n- Өнөөдөр юу сурснаа \"Өнөөдөр би ... сурсан\" гэж хуваалцана."}]},"2026-12-02":{"method":"Зохиолд суурилсан арга (давтамж)","link":"ХЯ3.2б. Харилцан ярианд сонирхсон зүйлийн тухай асууж, тодруулна.","competence":"Нийгэм, сэтгэл хөдлөлийн хөгжил (уурласан үедээ тайвшрах арга сонгох), харилцах (асууж тодруулах)","materials":"«Уурласан Тэргэл» зурагт карт, тайвшруулах лонх, «Тайвшрах булан»-ы зурагт карт (амьсгаа авах, тоолох, тэврэх, ярилцах), сэтгэл хөдлөлийн нүүрний карт","criteria":"Уурласан, бухимдсан үедээ амьсгаа авах, тоолох, «Тайвшрах булан»-д очих зэргээр тайвширдаг. Найзаасаа юу болсныг асууж тодруулдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Сэтгэл хөдлөлийн цаг\" самбарт өнөөдрийн сэтгэлээ байрлуулахыг урина.","learner":"- Багш, найзуудтайгаа мэндчилж, тойрогт сууна.\n- Сэтгэл хөдлөлийн нүүрний картуудыг (баяртай, гунигтай, уурласан, айсан) харж нэрлэнэ.\n- Өнөөдрийн сэтгэлээ илэрхийлсэн картыг сонгож, самбарт нэрийнхээ хажууд байрлуулна.\n- \"Би өнөөдөр ... байна, учир нь ...\" гэж шалтгаантай нь хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Тайвшрах аргатай танилцах: \"Тайвшрах булан\"-ы 4 аргын картыг (гүнзгий амьсгаа, 5 хүртэл тоолох, тайвшруулах лонх ажиглах, ярилцах) үзүүлж, хамтдаа дасгал хийнэ.\n- \"Цэцэг үнэрлээд лаа үлээе\": Гүнзгий амьсгаа авах дасгалыг хамтдаа хийнэ.\n- Нөхцөл байдал шийдэх: \"Найз чинь зургийг чинь урчихвал яах вэ?\" гэх мэт 3 нөхцөлийг ярилцуулж, хүүхдээр найзаасаа \"Яагаад ингэсэн бэ?\" гэж асууж тодруулахыг дэмжинэ.\nБагшийн чиглүүлэх асуулт:\n1. Чи ямар үед уурладаг вэ?\n2. Уурласан үедээ биед чинь юу болдог вэ?\n3. Тайвшрахын тулд юу хийж болох вэ?\n4. Найздаа юу болсныг яаж асуух вэ?","learner":"Тайвшрах аргатай танилцах:\n- \"Тайвшрах булан\"-ы 4 картыг харж, арга бүрийг нэрлэнэ.\n- Арга бүрийг багштай хамт үзүүлж давтана.\n\"Цэцэг үнэрлээд лаа үлээе\":\n- Хамраараа гүнзгий амьсгаа авч (\"цэцэг үнэрлэх\"), амаараа аажуухан гаргана (\"лаа үлээх\").\n- Дасгалыг 3 удаа хийж, \"Одоо ямар санагдаж байна?\" гэсэн асуултад хариулна.\n- 5 хүртэл аажуухан тоолж үзнэ.\nНөхцөл байдал шийдэх:\n- Нөхцөл бүрийг сонсоод \"Би эхлээд тайвширна, дараа нь ярилцана\" гэж шийдлээ хэлнэ.\n- Хосоороо дүрд тоглож, найзаасаа \"Чи яагаад ингэсэн бэ?\" гэж асууж тодруулна.\n- Найзынхаа хариултыг сонсоод \"Ойлголоо\" гэж хэлнэ.\nАсуултад хариулах:\n- Өөрөө ямар үед уурладгаа, тэр үед биед нь юу болдгийг (нүүр улайх, гар зангидах) хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Тоглох үед хүүхдүүдийн маргааныг ажиглаж, тайвшрах аргыг санал болгоно.","learner":"- Найзуудтайгаа тоглоомоо х
