уваалцаж тоглоно.\n- Тоглоом авах гэж байгаа бол \"Би авч болох уу?\" гэж асууна.\n- Бухимдсан үедээ \"Тайвшрах булан\"-д очиж амьсгалын дасгал хийнэ.\n- Тайвширсныхаа дараа найз руугаа буцаж очиж ярилцана."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – хоёр дахь уншлага (2): «Уурласан Тэргэл» (Төлөвлөгөөний хуудсыг 11 дүгээр сарын төлөвлөлтийн 11.30-ны хэсгээс үзнэ үү.)\n- Номын тухай эргэн сануулах асуулт асууна.\n- Түр зогсож асуух: «Тэргэл яагаад уурласан бэ?», «Тэргэл тайвшрахын тулд юу хийсэн бэ?»\n- Уншсаны дараа: «Хэрвээ чи Тэргэл байсан бол яах байсан бэ?»","learner":"- Номын хавтсыг харж нэрийг нь хэлнэ.\n- Багшийн эргэн сануулах асуултад номын эхлэлийг ярина.\n- Түр зогсох үед \"Тэргэл ... болохоор уурласан\", \"Тэргэл тоолоод тайвширсан\" гэж хариулна.\n- Номын шинэ үгсийг (тайвшрах, санамсаргүй, уучлалт гуйх) багштай давтан хэлнэ.\n- \"Хэрвээ би Тэргэл байсан бол ...\" гэж өөрийн тайвшрах аргаа хуваалцана."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: \"Миний тайвшруулах лонх\" – хуванцар сав, ус, гялтгануур, өнгөт сувс бэлтгэнэ.\n- \"Лонхоо сэгсрээд гялтганаа буухыг хүлээвэл сэтгэл ямар болох вэ?\" гэж асууна.\nХэл ярианы төв: Сэтгэл хөдлөлийн карт сугалж, \"Яагаад ийм нүүртэй байна?\" гэж хосоороо асууж тодруулах.\nНомын төв: Сэтгэл хөдлөлийн тухай зурагт номууд байрлуулна.","learner":"Урлагийн төв:\n- Хуванцар саванд ус хийж, гялтгануур, өнгөт сувс нэмж, тагийг нь сайн хаана.\n- Лонхоо сэгсрээд гялтгануур буухыг ажиглана.\n- Лонх ажиглахад ямар санагдсанаа (\"тайван\", \"сайхан\") хэлнэ.\nХэл ярианы төв:\n- Сэтгэл хөдлөлийн карт сугалж, дүрийн сэтгэлийг нэрлэнэ.\n- Найзаасаа \"Энэ хүүхэд яагаад ийм нүүртэй байгаа бол?\" гэж асууж тодруулна.\nНомын төв:\n- Сэтгэл хөдлөлийн тухай зурагт номыг үзэж, дүрүүдийн сэтгэлийг нэрлэнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 1 (2). Хөдөлмөрийн үйл ажиллагаа: Модны үндсийг цасаар хучих\nЗорилго: Хүүхдэд амьд байгальд туслах, ургамлыг хамгаалах, хамтран ажиллах энгийн хөдөлмөрийн дадал эзэмшүүлэх.\nХэрэглэгдэхүүн: Жижиг хүрз, хувин, бээлий, мод, бутны орчмын аюулгүй талбай\nЯвц:\n- Хүүхдүүд өөрт тохирсон жижиг хувин, хүрз, малтуур зэргийг авч цэцэрлэгийн гадна талбайн цасыг цуглуулж хувингаар зөөн модны ёроолд асгана.\n1. Малтуур, шүүр зэргээр цасыг цуглуулах\n2. Хүрзээр цасыг хувинд хийх\n3. Хувинтай цасыг модны ёроолд асгах\n- Асуулт: «Бид яагаад модны үндсийг цасаар хучиж байна вэ?»","learner":"- Багаж хэрэгслээ (жижиг хүрз, хувин, бээлий) сонгон авч, ажлын дарааллыг сонсоно.\n- Малтуур, шүүрээр цасыг нэг газар цуглуулна.\n- Хүрзээр цасыг хувинд хийж, хувинтай цасаа модны ёроолд зөөж асгана.\n- Найзтайгаа хамтран нэг нь хийж, нөгөө нь зөөнө.\n- \"Цас модыг хүйтнээс хамгаална\" гэж ажлынхаа ач холбогдлыг хэлнэ.\n- Ажлаа дуусгаад багажаа цэвэрлэж байранд нь тавина."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Хөгжим зогсвол тайвшир»\nЗорилго: Хөдөлгөөнийг зогсоож тайвшрах дадал суулгах.\nЯвц:\n1. Хөгжим эгшиглэхэд хүүхдүүд чөлөөтэй бүжиглэнэ.\n2. Хөгжим зогсоход байрандаа зогсоод гүнзгий амьсгаа авч 5 хүртэл тоолно.\n3. Багш \"Одоо ямар санагдаж байна?\" гэж асууна.\nДүрэм: Хөгжим зогсоход хөдлөхгүй; чимээгүй тоолно.\nДүгнэлт: Тайвшрах ямар арга сурснаа хамтдаа санана.","learner":"- Хөгжмийн аянд чөлөөтэй бүжиглэнэ.\n- Хөгжим зогсоход байрандаа хөдлөхгүй зогсоно.\n- Гүнзгий амьсгаа аваад 5 хүртэл чимээгүй тоолно.\n- Багшийн \"Одоо ямар санагдаж байна?\" асуултад хариулна.\n- Өнөөдөр сурсан тайвшрах аргаа нэрлэнэ."}]},"2026-12-03":{"method":"Тоглоомонд суурилсан арга","link":"ХӨГ3.1г. Аялгууны өөрчлөлтийг мэдэрч хөдөлгөөнөөр илэрхийлнэ.","competence":"Биеийн хөдөлгөөний чадвар (тэнцвэр хадгалан үсрэх, эргэх), хөгжмийн аялгууг мэдрэх","materials":"Цагираг, дэвсгэр, хөгжим (удаан, хурдан аялгуу), өнгөт тууз, бөмбөр, цасан ширхгийн зурагт карт","criteria":"Байрандаа хоёр хөлөөрөө хөнгөн үсэрч, хагас ба бүтэн эргэдэг. Аялгуу хурдсах, удаашрахыг мэдэрч хөдөлгөөнөө өөрчилдөг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, биеэ халаах дасгал (хөлийн үзүүр дээр өндийх, өвдгөө нугалах) хийлгэнэ.","learner":"- Мэндчилж тойрогт зогсоно.\n- Багшийг дуурайн гар, хөл, хүзүүгээ эргүүлж биеэ халаана.\n- Хөлийн үзүүр дээр өндийж 5 тоолох хугацаанд тэнцвэрээ хадгална.\n- Өвдгөө нугалж, эргүүлж хөлөө халаана."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Зааж үзүүлэх: Хоёр хөлөө нийлүүлэн байрандаа хөнгөн үсэрч, газардахдаа өвдгөө бага зэрэг нугалахыг үзүүлнэ.\n- \"Цасан ширхэг эргэлээ\": Цагираг дотор үсэрч хагас эргэх (урагш – хойш харах), дараа нь бүтэн эргэхийг дасгалжуулна.\n- Хөгжимтэй уялдуулах: Удаан аялгуунд аажуухан, хурдан аялгуунд хурдан үсэрч эргэнэ. Бөмбөр цохиход зогсоно.\nБагшийн чиглүүлэх асуулт:\n1. Үсэрч газардахдаа өвдгөө яах вэ?\n2. Эргэхдээ гараа хаана байлгавал унахгүй вэ?\n3. Хөгжим хурдсахад чи яаж хөдөлсөн бэ?","learner":"Зааж үзүүлэх:\n- Багшийн үзүүлэхийг ажиглаад хоёр хөлөө нийлүүлэн байрандаа хөнгөн үсэрнэ.\n- Газардахдаа өвдгөө бага зэрэг нугалж зөөлөн буухыг оролдоно.\n\"Цасан ширхэг эргэлээ\":\n- Цагираг дотор зогсоод үсэрч хагас эргэнэ (урагш харж байснаа хойш харна).\n- Чадвал бүтэн эргэж, гараа хоёр тийш дэлгэн тэнцвэрээ хадгална.\nХөгжимтэй уялдуулах:\n- Удаан аялгуунд аажуухан, хурдан аялгуунд хурдан үсэрч эргэнэ.\n- Бөмбөр цохиход байрандаа зогсоно.\nАсуултад хариулах:\n- \"Газардахдаа өвдгөө нугална\", \"Гараа дэлгэвэл унахгүй\" гэж хариулна."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Хөдөлгөөний буланд цагираг, дэвсгэр байрлуулж, хүүхдүүдийн бие даан үсрэх, эргэхийг ажиглана.","learner":"- Хөдөлгөөний буланд цагираг дотор бие даан үсэрч тоглоно.\n- Найзтайгаа ээлжлэн \"Хэн олон удаа эргэх вэ?\" тоглоом тоглож, эргэлтээ тоолно.\n- Бусдаас зай авч, аюулгүй тоглоно."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Цасан ширхгийн тухай дуу, шүлэг уншиж, хөдөлгөөнөөр дагуулна.\n- \"Цасан ширхэг хэрхэн бууж байна вэ?\" гэж асууж, хөдөлгөөнөөр үзүүлүүлнэ.","learner":"- Цасан ширхгийн тухай шүлгийг сонсоно.\n- Шүлгийн үгийг багштай мөр мөрөөр давтан хэлнэ.\n- Цасан ширхэг шиг эргэлдэн, аажуухан бууж хөдөлгөөнөөр үзүүлнэ.\n- \"Цасан ширхэг эргэлдэж бууж байна\" гэж хэлнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Хөгжмийн төв: Хонх, бөмбөр, шажигнуур байрлуулж, удаан/хурдан цохиулна.\nХөдөлгөөний төв: Шалан дээр наасан цасан ширхгийн зураг дээгүүр үсэрч эргэх зам.\nУрлагийн төв: Цаасан цасан ширхгийг өнгөт туузаар чимэглэх.","learner":"Хөгжмийн төв:\n- Хонх, бөмбөр, шажигнуураас сонгож, удаан болон хурдан хэмнэлээр цохино.\n- Найзынхаа цохисон хэмнэлийг дуурайна.\nХөдөлгөөний төв:\n- Шалан дээр наасан цасан ширхгийн зураг бүр дээр үсэрч, эргэж замыг туулна.\nУрлалийн төв:\n- Цаасан цасан ширхгээ өнгөт туузаар чимэглэнэ.\n- Туузаа барьж хөгжмийн аянд эргэлдэн хөдөлнө."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 1 (3). Хөдөлгөөнт тоглоом: «Бөгжинд орлоо»\nЗорилго: Хүүхдийг хосоороо хамтран гүйх, чиг баримжаатай хөдөлгөөн хийх, дохиогоор хөдөлгөөнөө өөрчлөх, цасан бөмбөгийг бай руу онилж шидэх чадварт суралцуулах.\nХэрэглэгдэхүүн: Жижиг бөмбөг (цасан, даавуун), цагираг, сагс/хайрцаг\nАргачлал: Багшийн дохиогоор хосууд гараасаа хөтлөлцөн гүйж өөрт ойр байгаа цагирагт орно. Цагиргийн хажууд байгаа сагстай жижиг бөмбөгийг бай руу ээлжлэн шиднэ. Багшийн дараагийн дохиогоор өөр цагираг руу гүйж очин тоглоомыг үргэлжлүүлнэ.\nДүрэм:\n1. Хосууд гар гараасаа салахгүй.\n2. Найзыгаа чирэхгүй, түлхэхгүй.\n3. Бөмбөгийг зөвхөн заасан бай руу шиднэ.\n4. Бөмбөгийг ээлжлэн шиднэ.\n5. Цагирагт орохдоо бусад хүүхдүүдтэй мөргөлдөхгүй байх, болгоомжтой байх.","learner":"- Найзтайгаа хос болж гар гараасаа хөтлөлцөнө.\n- Багшийн дохиогоор хамт гүйж, ойр байгаа цагирагт орно.\n- Сагснаас жижиг бөмбөг авч бай руу онилон ээлжлэн шиднэ.\n- Дараагийн дохиогоор өөр цагираг руу гүйнэ.\n- Найзаа чирэхгүй, түлхэхгүй, бусадтай мөргөлдөхгүй байх дүрмийг баримтална."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Аялгуу өөрчлөгдлөө»\nЗорилго: Аялгууны өөрчлөлтийг мэдэрч хөдөлгөөнөөр илэрхийлэх.\nЯвц:\n1. Багш удаан аялгуу тоглоход хүүхдүүд аажуухан алхана.\n2. Хурдан аялгуунд байрандаа хөнгөн үсэрнэ.\n3. Өндөр аялгуунд хөлийн үзүүр дээр өндийж эргэнэ.\nДүрэм: Хөгжим зогсоход хөшөө болно.\nДүгнэлт: \"Өнөөдөр бид юу сурсан бэ?\" гэж ярилцана.","learner":"- Удаан аялгуу сонсоод аажуухан алхана.\n- Хурдан аялгуунд байрандаа хөнгөн үсэрнэ.\n- Өндөр аялгуунд хөлийн үзүүр дээр өндийж эргэнэ.\n- Хөгжим зогсоход хөшөө болж хөдлөхгүй зогсоно.\n- Өнөөдөр юу сурснаа хуваалцана."}]},"2026-12-04":{"method":"Зохиолд суурилсан арга","link":"НСХ3.3в. Үйл ажиллагаанд тодорхой үүрэг хүлээж оролцдог болно.","competence":"Харилцах (санал бодлоо чөлөөтэй илэрхийлэх), хамтран ажиллах (бүлгийн ажилд үүрэг хүлээх)","materials":"«Уурласан Тэргэл» зурагт карт, «Ярианы чулуу», үүргийн карт (ширээ засагч, ургамал услагч, номын туслах, тоглоом хураагч), тоглоомон микрофон","criteria":"Харилцан ярианд өөрийн санаачилгаар оролцож, санал бодлоо 3-4 үгтэй өгүүлбэрээр илэрхийлдэг. Бүлгийн ажилд өөрт оногдсон үүргийг хүлээн гүйцэтгэдэг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Ярианы чулуу\" дамжуулан \"Өчигдөр гэртээ юу хийсэн бэ?\" гэж асууна.","learner":"- Тойрогт сууж мэндчилнэ.\n- \"Ярианы чулуу\" ирэхэд түүнийг барьж, өчигдөр гэртээ юу хийснээ 2-3 өгүүлбэрээр ярина.\n- Чулууг дараагийн найздаа дамжуулна.\n- Найзыгаа ярихад чимээгүй, анхааралтай сонсоно."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Ярилцлага: \"Манай бүлгийн туслагчид\" сэдвээр бүлэгт ямар ажил хийх хэрэгтэйг хүүхдүүдээс асууж, санаагаа чөлөөтэй хэлэхийг урина.\n- Үүрэг сонгох: Үүргийн картуудыг үзүүлж, хүүхэд бүр сонгосон үүргээ \"Би ... хийнэ, учир нь ...\" гэж тайлбарлана.\n- Үүргийн самбар: Хүүхдүүдийн зургийг үүргийн самбарт байрлуулж, долоо хоногийн туслагчдыг тохирно.\nБагшийн чиглүүлэх асуулт:\n1. Манай бүлэгт өдөр бүр ямар ажил хийх хэрэгтэй вэ?\n2. Чи ямар үүрэг хүлээх вэ? Яагаад?\n3. Хүн бүр үүргээ биелүүлбэл бүлэг маань ямар болох вэ?","learner":"Ярилцлага:\n- \"Манай бүлгийн туслагчид\" сэдвээр бүлэгт өдөр бүр хийх ажлыг (ширээ засах, ургамал услах, тоглоом хураах) санаачилгаараа нэрлэнэ.\n- Найзынхаа санааг сонсоод \"Би ч бас ...\" гэж нэмж ярина.\nҮүрэг сонгох:\n- Үүргийн картуудаас өөрт таалагдсаныг сонгоно.\n- \"Би ... хийнэ, учир нь ...\" гэж шалтгаантайгаар хэлнэ.\nҮүргийн самбар:\n- Өөрийн зургийг үүргийн самбарт сонгосон үүргийнхээ хажууд байрлуулна.\n- Долоо хоногийн туслагчдыг хамтдаа тохирно.\nАсуултад хариулах:\n- \"Хүн бүр үүргээ хийвэл бүлэг маань цэвэрхэн, сайхан болно\" гэж дүгнэнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Тоглох үед хүүхдүүдийн харилцан яриаг ажиглаж, санаачилгатай ярьж буйг урамшуулна.","learner":"- Найзуудтайгаа юугаар тоглохоо тохиролцоно.\n- Санал бодлоо хэлж, найзынхаа саналыг сонсоно.\n- Хамтдаа тоглоомын дүрмээ гаргаж тоглоно."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – гурав дахь уншлага (3): «Уурласан Тэргэл» (Төлөвлөгөөний хуудсыг 11 дүгээр сарын төлөвлөлтийн 11.30-ны хэсгээс үзнэ үү.)\n- Номын үйл явдлыг хүүхдүүдээр түлхүү яриулна.\n- Дүгнэн ярилцах: «Тэргэлийн хийсэн зүйлээс юу нь таалагдсан бэ?»\n- Шинэ үгсээр өгүүлбэр зохиох: тайвшрах, санамсаргүй, уучлалт гуйх","learner":"- Номын нэрийг санаж хэлнэ.\n- Номын зургийг харж \"Энд Тэргэл ... хийж байна\" гэж үйл явдлыг өөрийн үгээр ярина.\n- \"Хэрвээ би Тэргэл байсан бол ...\" гэж санал бодлоо хэлнэ.\n- Шинэ үгсээр (тайвшрах, санамсаргүй, уучлалт гуйх) өгүүлбэр зохионо.\n- «Миний тайвшрах арга» зургийг зурж, найздаа тайлбарлана."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Хэл ярианы төв: \"Сурвалжлагч\" – тоглоомон микрофоноор найзаасаа \"Чи ямар үүрэг хүлээсэн бэ?\" гэж ярилцлага авах.\nДүрт тоглоомын төв: \"Манай гэр\" – гэр бүлийн гишүүд болж гэрийн ажлаа хуваарилах.\nУрлагийн төв: Өөрийн үүргийн тэмдгийг зурж, будах.","learner":"Хэл ярианы төв:\n- Сурвалжлагч болж тоглоомон микрофоноор найзаасаа \"Чи ямар үүрэг хүлээсэн бэ?\", \"Яагаад?\" гэж асууна.\n- Ярилцлага өгөгч болж бүтэн өгүүлбэрээр хариулна.\nДүрт тоглоомын төв:\n- Гэр бүлийн гишүүдийн дүрийг хуваарилна.\n- \"Би аяга угаана\", \"Би шал шүүрдэнэ\" гэж гэрийн ажлаа хуваарилж үзүүлнэ.\nУрлагийн төв:\n- Өөрийн үүргийн тэмдгийг (услуур, халбага, шүүр) зурж будна.\n- Зурсан тэмдгээ найздаа тайлбарлана."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 1 (4). Ганцаарчилсан үйл ажиллагаа: Мөстэй зам дээр болгоомжтой гулгах дасгал\nЗорилго: Тэнцвэр хадгалах, богино зайд гулгах чадварыг сайжруулах.\nАнхаарах зүйл: Энэ дасгалыг багшийн шууд удирдлага дор хийж гүйцэтгэх бөгөөд тэгш, аюулгүй, нимгэн мөстэй талбайг ашиглана. Хэрэв гадаргуу овон товонтой бол тэгш газар цасан дээр гулгах, алхалт, тэнцвэрийн дасгалаар сольж болно.\nДасгалын явц:\n1. Гарааны шугамаар гараа алдлан алхана.\n2. Багшийн гараас барьж зөөлөн гулгана.\n3. 1-3 удаа давтана.\n«Мөсөн дээрх оцон шувуу» дасгал: Хүүхэд гараа хоёр тийш дэлгэн, жижиг алхмаар удаан алхана. Гүйхгүй, үсрэхгүй. Энэ нь мөстэй зам дээр болгоомжтой алхах дадлыг тоглоомын хэлбэрээр эзэмшүүлнэ.","learner":"- Гарааны шугам дээр зогсож, гараа хоёр тийш алдлан алхана.\n- Багшийн гараас барьж мөстэй зам дээр богино зайд зөөлөн гулгана.\n- Дасгалыг 1-3 удаа давтана.\n- «Мөсөн дээрх оцон шувуу» шиг гараа дэлгэн, жижиг алхмаар удаан алхана.\n- \"Мөсөн дээр гүйхгүй, үсрэхгүй\" гэсэн дүрмийг хэлнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Санал хураалт»\nЗорилго: Санал бодлоо илэрхийлэх, олонхын саналыг хүндэтгэх.\nЯвц:\n1. Багш \"Маргааш ямар тоглоом тоглох вэ?\" гэж 2 сонголт санал болгоно.\n2. Хүүхэд бүр сонголтынхоо зураг дээр шоо тавьж санал өгнө.\n3. Шоог тоолж, олон саналтайг сонгоно.\nДүрэм: Хүн бүр нэг санал өгнө; бусдын саналыг шоолохгүй.\nДүгнэлт: Хүн бүрийн санаа чухал болохыг ярилцана.","learner":"- Багшийн санал болгосон 2 тоглоомын зургийг харна.\n- Өөрийн сонголтын зураг дээр шоо тавьж санал өгнө.\n- \"Би ... -г сонгосон, учир нь ...\" гэж шалтгаанаа хэлнэ.\n- Шоонуудыг хамтдаа тоолж, аль нь олон, цөөн болохыг жишнэ.\n- Олонхын шийдвэрийг хүлээн зөвшөөрнө."}]},"2026-12-07":{"method":"Төсөлд суурилсан арга","link":"ХЭМ3.2е. Хүрээлэн байгаа орчин дахь анхааруулах, болгоомжлох тэмдэг, тэмдэглэгээг таньж, дагаж мөрдөнө.","competence":"Харилцах (үйлчилгээний газрын дүрмийг мөрдөх), нийгмийн орчны мэдлэг, өөрийгөө хамгаалах (анхааруулах тэмдгийг ялгах)","materials":"Дэлгүүр, эмийн сан, эмнэлэг, номын сангийн зурагт үзүүлэн, мэргэжлийн хувцас, тоглоомон мөнгө, бараа, эмийн хайрцаг (хоосон), ном, тэмдгийн карт","criteria":"Ойр орчны үйлчилгээний газрыг нэрлэж, тэнд хүмүүс юу хийдэг, ямар зориулалттайг ялгадаг. Тухайн газрын дүрмийг (чимээгүй байх, дугаараа хүлээх) баримталдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Амралтын өдрөөр гэр бүлээрээ хаашаа явсан бэ?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Амралтын өдрөөр гэр бүлээрээ очсон газраа (дэлгүүр, эмнэлэг, цэцэрлэгт хүрээлэн) нэрлэнэ.\n- Тэнд юу хийснээ, хэнтэй уулзсанаа 2-3 өгүүлбэрээр ярина."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Зурагт үзүүлэн: Дэлгүүр, эмийн сан, эмнэлэг, номын сангийн зургийг үзүүлж, \"Энэ ямар газар вэ? Тэнд хэн ажилладаг вэ?\" гэж ярилцана.\n- Тэмдгээр таних: Ногоон загалмай (эмийн сан), улаан загалмай (эмнэлэг), номын тэмдэг зэргийг тухайн газрын зурагтай тааруулна.\n- Төслийн эхлэл: \"Манай бүлгийн жижиг хот\" төсөл – хүүхдүүд аль газрыг байгуулахаа сонгож, багаараа хуваарилагдана.\nБагшийн чиглүүлэх асуулт:\n1. Эмийн сан, эмнэлэг хоёр юугаараа ялгаатай вэ?\n2. Номын санд яаж байх ёстой вэ?\n3. Дэлгүүрт дугаараа яагаад хүлээх вэ?\n4. Эмийг хэн өгөх ёстой вэ? Яагаад хүүхэд өөрөө авч болохгүй вэ?","learner":"Зурагт үзүүлэн:\n- Дэлгүүр, эмийн сан, эмнэлэг, номын сангийн зургийг харж нэрлэнэ.\n- Тэнд ажилладаг хүмүүсийг (худалдагч, эмзүйч, эмч, номын санч) нэрлэж, юу хийдгийг хэлнэ.\nТэмдгээр таних:\n- Ногоон загалмай, улаан загалмай, номын тэмдгийг тухайн газрын зурагтай тааруулж тавина.\n- \"Ногоон загалмайтай бол эмийн сан\" гэж тайлбарлана.\nТөслийн эхлэл:\n- \"Манай бүлгийн жижиг хот\" төсөлд аль газрыг байгуулахаа сонгож, багтаа нэгдэнэ.\nАсуултад хариулах:\n- Эмийн сан, эмнэлгийн ялгааг хэлнэ.\n- \"Номын санд чимээгүй байна\", \"Дэлгүүрт дугаараа хүлээнэ\" гэж дүрмийг хэлнэ.\n- \"Эмийг зөвхөн томчууд өгнө\" гэж тайлбарлана."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Дүрт тоглоомын буланд \"Дэлгүүр\" орчин бүрдүүлж (бараа, мөнгө, касс), хүүхдүүдийн харилцааг ажиглана.","learner":"- \"Дэлгүүр\" буланд худалдагч, худалдан авагчийн дүрийг хуваарилна.\n- \"Сайн байна уу? Надад ... өгөөч\", \"Баярлалаа\" гэж эелдэг харилцана.\n- Тоглоомон мөнгөөр төлбөрөө төлж, бараагаа авна.\n- Дугаараа хүлээж зогсоно."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – эхний уншлага (1): «Маша ба баавгай» (Чанга уншлагын төлөвлөгөөний хуудсыг үзнэ үү.)\n- Номын нэр, хавтас, зохиолч, зураачийг танилцуулж, хэмнэлийг алдагдуулахгүй уншина.\n- Түр зогсож асуух: «Эмээ өвөө нь Машад юу гэж захисан бэ? Яагаад?»\n- Шинэ үг: «Төөрөх – замаа олохгүй болох»\n- Уншсаны дараа: «Маша яаж гэртээ буцаж ирсэн бэ?»","learner":"- Номын нэр, хавтасны зургийг харж, \"Энэ ном ... тухай байх\" гэж таамаглана.\n- Багшийн уншихыг анхааралтай, тайван сонсоно.\n- Түр зогсох үед \"Эмээ, өвөө нь ... гэж захисан\" гэх мэтээр хариулна.\n- «Төөрөх» гэдэг шинэ үгийг багштай давтан хэлж, утгыг нь өөрийн үгээр хэлнэ.\n- \"Маша ... гэж гэртээ ирсэн\" гэж уншсаны дараах асуултад хариулна."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Барилгын төв: Шоо, хайрцгаар \"Жижиг хот\" – дэлгүүр, эмийн сан, номын сангийн байшин барих.\nУрлагийн төв: Үйлчилгээний газрын хаягийн тэмдэг (загалмай, ном, сагс) зурах.\nМатематикийн төв: Тоглоомон мөнгө, барааг тоолох (5 хүртэл).\nДүрт тоглоомын төв: \"Эмийн сан\" – эмзүйч, үйлчлүүлэгч.","learner":"Барилгын төв:\n- Шоо, хайрцгаар дэлгүүр, эмийн сан, номын сангийн байшин барина.\n- Барьсан байшингаа \"Энэ ... газар\" гэж тайлбарлана.\nУрлагийн төв:\n- Үйлчилгээний газрын хаягийн тэмдгийг (загалмай, ном, сагс) зурж, байшиндаа наана.\nМатематикийн төв:\n- Тоглоомон мөнгө, барааг 5 хүртэл оноож тоолно.\nДүрт тоглоомын төв:\n- \"Эмийн сан\"-д эмзүйч, үйлчлүүлэгч болж тоглоно.\n- \"Эмийг зөвхөн томчууд өгнө\" гэдгийг дүрээрээ илэрхийлнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 2 (1). Ажиглалт: Цас орохыг ажиглах\nЗорилго: Цасны шинж чанарын талаарх ойлголтыг төлөвшүүлэх; улирлын чанартай үзэгдэл болох цас оролтын талаарх мэдлэгийг бататгах.\nЯвц:\n- Багш цас орж буй өдрийг сонгон гадаа гарч цас орж буйг ажиглуулна. Бээлийтэй гар дээр цас буухад ямар байгааг ажиглаад цасан ширхгийн хэлбэр, хэмжээг харьцуулна. Дараа нь бээлийгүй гар дээр цас буухад ямар байгаа, мөн цас хайлах үйл явцын талаар ярилцана.\n- Бээлийтэй гараа сунгаж, хэд хэдэн цасан ширхэг барьж аваад тэдгээрийн хэлбэрийг ажиглана (хэмжээ, ижилхэн нь олох).\n- Асуулт: «Цас яагаад шаржигнадаг вэ?», «Цасан ширхгүүд хаана үүсдэг вэ? Яагаад?», «Цас хүрэхэд ямар мэдрэмж төрүүлдэг вэ?», «Цас хэзээ нойтон, хэзээ хуурай байдаг вэ?», «Цасан ширхгүүд юутай адилхан байна вэ?», «Хэрэв цасан ширхэг нүцгэн алган дээр буувал юу болох вэ? Яагаад?»","learner":"- Багштай хамт гадаа гарч, цас орж байгааг ажиглана.\n- Бээлийтэй гараа сунгаж цасан ширхэг барьж аваад хэлбэр, хэмжээг нь харьцуулна.\n- Ижилхэн хоёр цасан ширхэг хайж олохыг оролдоно.\n- Нүцгэн алган дээр цас тавьж хайлахыг ажиглаад \"Гар дулаан учраас хайлсан\" гэж тайлбарлана.\n- Цасыг гишгэж шаржигнахыг сонсоно.\n- Багшийн асуулт бүрт өөрийн үгээр хариулна."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Хаана байна вэ?»\nЗорилго: Үйлчилгээний газрыг зориулалтаар нь ялгах.\nЯвц:\n1. Багш \"Би ханиад хүрчихлээ. Хаашаа явах вэ?\" гэх мэт нөхцөл хэлнэ.\n2. Хүүхдүүд тухайн газрын зурагтай булан руу гүйж очно.\n3. \"Яагаад энд ирсэн бэ?\" гэж асууна.\nДүрэм: Түлхэлцэхгүй, алхаж очно.\nДүгнэлт: Өнөөдөр сурсан газруудаа нэрлэнэ.","learner":"- Багшийн хэлсэн нөхцөлийг (\"Би ханиад хүрчихлээ\") анхааралтай сонсоно.\n- Тухайн газрын зурагтай булан руу алхаж очно.\n- \"Би эмнэлэг рүү ирсэн, учир нь ...\" гэж сонголтынхоо шалтгааныг хэлнэ.\n- Өнөөдөр сурсан үйлчилгээний газруудаа нэрлэнэ."}]},"2026-12-08":{"method":"Тоглоомонд суурилсан арга","link":"ХЭМ3.2е. Хүрээлэн байгаа орчин дахь анхааруулах, болгоомжлох тэмдэг, тэмдэглэгээг таньж, дагаж мөрдөнө.","competence":"Харилцах (тэмдэг, тэмдэглэгээний утгыг ойлгож хэлэх), өөрийгөө хамгаалах (аюулыг анхааруулах тэмдгийг ялгах)","materials":"Олон нийтийн газрын тэмдгийн карт (гэрлэн дохио, явган хүний гарц, бие засах газар, гарц, «Чимээгүй», «Гар бүү хүр», «Галын аюул», «Цахилгааны аюул»), хайрцаг, сугалаа, зураг","criteria":"Олон нийтийн газар хэрэглэгддэг тэмдгийг ялгаж нэрлэж, утгыг нь тайлбарладаг. Асуултад ойлгож хариулдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Ирэх замдаа ямар тэмдэг харсан бэ?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Ирэх замдаа харсан тэмдгээ (гэрлэн дохио, гарц, дэлгүүрийн хаяг) нэрлэнэ.\n- Багшийн асуултад бүтэн өгүүлбэрээр хариулна."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Тэмдэгтэй танилцах: Тэмдгийн картыг нэг нэгээр үзүүлж, \"Энэ тэмдэг бидэнд юу хэлж байна вэ?\" гэж асууна.\n- Ангилах: Тэмдгүүдийг \"Мэдээлдэг тэмдэг\" (бие засах газар, гарц) ба \"Анхааруулдаг тэмдэг\" (галын аюул, цахилгааны аюул) гэж хоёр бүлэгт ангилуулна.\n- Тэмдэг хайх: Бүлгийн өрөө, коридорт наасан тэмдгүүдийг хайж олуулна.\nБагшийн чиглүүлэх асуулт:\n1. Энэ тэмдгийг хаана харж байсан бэ?\n2. Энэ тэмдэг юу гэсэн утгатай вэ?\n3. Улаан өнгөтэй тэмдэг юуг анхааруулдаг вэ?\n4. Тэмдгийг дагахгүй бол юу болох вэ?","learner":"Тэмдэгтэй танилцах:\n- Тэмдгийн карт бүрийг харж нэрийг нь хэлнэ.\n- \"Энэ тэмдэг бидэнд ... гэж хэлж байна\" гэж утгыг нь тайлбарлана.\n- Тэмдгийг хаана харж байснаа ярина.\nАнгилах:\n- Тэмдгүүдийг \"Мэдээлдэг тэмдэг\" ба \"Анхааруулдаг тэмдэг\" гэсэн хоёр бүлэгт ангилж тавина.\n- Улаан, шар өнгөтэй тэмдэг аюулыг анхааруулдаг болохыг хэлнэ.\nТэмдэг хайх:\n- Бүлгийн өрөө, коридороос наасан тэмдгүүдийг хайж олно.\n- Олсон тэмдгийнхээ утгыг найздаа хэлнэ.\nАсуултад хариулах:\n- \"Тэмдгийг дагахгүй бол ... болно\" гэж үр дагаврыг тайлбарлана."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Машины замын тоглоомд гэрлэн дохио, явган хүний гарцын тэмдгийг байрлуулж ажиглана.","learner":"- Машины замын тоглоомд тоглоомон машинаа гэрлэн дохиогоор зогсоож, явуулна.\n- Тоглоомон хүнээ явган хүний гарцаар гаргана.\n- Найздаа \"Улаан гэрэл асаж байна, зогс!\" гэж дүрмийг сануулна."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Тэмдэг, тэмдэглэгээтэй зурагт ном үзүүлж, \"Номд ямар тэмдэг гарсан бэ?\" гэж асууна.\n- Хүүхдүүдээр номын зургаас тэмдэг хайлгана.","learner":"- Номын зургаас тэмдэг, тэмдэглэгээ хайж олно.\n- Олсон тэмдгээ хуруугаараа зааж нэрлэнэ.\n- Тэмдгийн утгыг өөрийн үгээр хэлнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Хэл ярианы төв: \"Сугалаа\" – хайрцагнаас тэмдэг сугалж, утгыг нь хэлэх.\nУрлагийн төв: \"Манай бүлгийн тэмдэг\" – бие засах газар, гар угаах газрын тэмдгийг зурах.\nМатематикийн төв: Тэмдгийг хэлбэрээр нь (дугуй, гурвалжин, дөрвөлжин) ангилах.","learner":"Хэл ярианы төв:\n- Хайрцагнаас тэмдэг сугалж, нэрийг нь хэлнэ.\n- \"Энэ тэмдэг ... гэсэн утгатай\" гэж тайлбарлана.\nУрлагийн төв:\n- Бие засах газар, гар угаах газрын тэмдгийг зурна.\n- Зурсан тэмдгээ тохирох хаалган дээр наана.\nМатематикийн төв:\n- Тэмдгүүдийг хэлбэрээр нь (дугуй, гурвалжин, дөрвөлжин) ангилж, хэлбэр бүрийн тэмдгийг тоолно."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 2 (2). Хөдөлмөрийн үйл ажиллагаа: Талбайн цасыг цэвэрлэх\nЗорилго: Цасыг дамнуурга дээр цуглуулж, тодорхой газар асгаж сурах; үүрэг хуваарилж хамтран ажиллах.\nҮүрэг хуваарилах: Хүүхдүүдийг 3–4 хүний баг болгон хуваана.\n- Хүрзэчин: цасыг хүрзээр дамнуурга дээр тавих\n- Зөөгч: дамнуургыг хоёр талаас барьж заасан газар руу зөөх\nХэрэглэгдэхүүн: Хүүхдийн хэмжээнд тохирсон хүрз (хүүхэд тус бүрт 1), цас хураах том сав эсвэл тэрэг, хүүхдийн гар бээлий, гутал\nТехник, аргачлал:\n- Дамнуурга дээр цасыг хэт их овоолохгүй (асгарахаас сэргийлэх).\n- Зөөхдөө бие биенийхээ алхааг тааруулж, «Нэг, хоёр гээд» гэж хэмнэлтэй алхана.","learner":"- 3-4 хүний багт нэгдэж, хүрзэчин эсвэл зөөгчийн үүрэг сонгоно.\n- Хүрзэчид цасыг хүрзээр дамнуурга дээр тавина.\n- Зөөгчид дамнуургыг хоёр талаас барьж, \"Нэг, хоёр\" гэж алхаагаа тааруулан заасан газар руу зөөнө.\n- Дамнуурга дээр цасыг хэт их овоолохгүй байхыг анхаарна.\n- Ажлаа дуусгаад багажаа цэвэрлэж, байранд нь тавина."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Тэмдгийг дага»\nЗорилго: Тэмдгийн утгыг ойлгож дагах.\nЯвц:\n1. Багш тэмдгийн карт үзүүлнэ: улаан гэрэл – зогсох, ногоон гэрэл – алхах, «Чимээгүй» – хуруугаа уруулдаа тавих, «Аюул» – ухрах.\n2. Хүүхдүүд картын дагуу хөдөлнө.\n3. Дараа нь нэг хүүхэд багшийн үүрэг гүйцэтгэнэ.\nДүрэм: Буруу хөдөлсөн хүүхэд нэг ээлж амарна.\nДүгнэлт: Тэмдгийг дагах нь яагаад чухал болохыг ярилцана.","learner":"- Багшийн үзүүлсэн тэмдгийн картыг харна.\n- Улаан гэрэл – зогсох, ногоон гэрэл – алхах, «Чимээгүй» – хуруугаа уруулдаа тавих, «Аюул» – ухрах хөдөлгөөн хийнэ.\n- Буруу хөдөлсөн бол нэг ээлж амарна.\n- Ээлжээр багшийн үүрэг гүйцэтгэж тэмдэг үзүүлнэ.\n- \"Тэмдгийг дагавал бид аюулгүй байна\" гэж дүгнэнэ."}]},"2026-12-09":{"method":"Шинжлэн судлах арга","link":"ХЯ3.3б. Олон нийтийн газар хэрэглэгддэг тэмдэг, тэмдэглэгээг ялгаж нэрлэнэ.","competence":"Өөрийгөө хамгаалах (аюулыг анхааруулах тэмдгийг дагах), шүүн тунгаах (аюултай, аюулгүй нөхцөлийг ялгах)","materials":"«Галын аюул», «Цахилгааны аюул», «Хортой», «Гар бүү хүр», «Халуун» тэмдгийн карт, аюултай ба аюулгүй нөхцөлийн зурагт карт, улаан/ногоон дугуй","criteria":"Хүрээлэн буй орчин дахь анхааруулах, болгоомжлох тэмдэг, тэмдэглэгээг ялгаж, түүнийг мөрдөн өөрийгөө хамгаалдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Манай гэрт, цэцэрлэгт аюултай зүйл юу байдаг вэ?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Гэрт, цэцэрлэгт байдаг аюултай зүйлсийг (залгуур, халуун ус, эм, хурц хутга) нэрлэнэ.\n- Тэдгээрээс хэрхэн болгоомжлохоо \"Би ... -д хүрэхгүй\" гэж хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Тэмдгийг судлах: Анхааруулах тэмдгийн картыг үзүүлж, өнгө, дүрсийг нь ажиглуулна (\"Шар гурвалжин, улаан дугуй юу хэлдэг вэ?\").\n- Аюултай уу, аюулгүй юу?: Нөхцөл байдлын зургийг улаан (аюултай), ногоон (аюулгүй) дугуйд ангилуулна.\n- Тэмдэг хаана байдаг вэ?: Цахилгааны самбар, гал тогоо, ариутгалын бодисын сав дээрх тэмдгийг үзүүлнэ.\nБагшийн чиглүүлэх асуулт:\n1. Энэ тэмдгийг хараад яах ёстой вэ?\n2. Залгуурт яагаад хүрч болохгүй вэ?\n3. Аюултай зүйл харвал хэнд хэлэх вэ?","learner":"Тэмдгийг судлах:\n- Анхааруулах тэмдгийн карт бүрийн өнгө, дүрсийг ажиглаж нэрлэнэ.\n- \"Шар гурвалжин – болгоомжил\", \"Улаан дугуй – болохгүй\" гэж утгыг нь хэлнэ.\nАюултай уу, аюулгүй юу?:\n- Нөхцөл байдлын зургийг харж улаан (аюултай), ногоон (аюулгүй) дугуйд ангилж тавина.\n- Сонголтоо \"Энэ аюултай, учир нь ...\" гэж тайлбарлана.\nТэмдэг хаана байдаг вэ?:\n- Цахилгааны самбар, гал тогоо, ариутгалын бодисын сав дээрх тэмдгийг хуруугаараа заан нэрлэнэ.\nАсуултад хариулах:\n- \"Энэ тэмдгийг хараад би хүрэхгүй, томчуудад хэлнэ\" гэж хэлнэ.\n- Залгуурт яагаад хүрч болохгүйг тайлбарлана."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Дүрт тоглоомын буланд \"Гал тогоо\" орчин бүрдүүлж, халуун, хурц эд зүйлийн тэмдэг байрлуулж ажиглана.","learner":"- \"Гал тогоо\" буланд тогоочийн дүрд тоглоно.\n- \"Халуун!\" тэмдгийг хараад тогоонд болгоомжтой хандана.\n- Найздаа \"Болгоомжтой, халуун байна\" гэж сануулна."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – хоёр дахь уншлага (2): «Маша ба баавгай» (Төлөвлөгөөний хуудсыг 12.07-ны төлөвлөлтийн дараа үзнэ үү.)\n- Номын тухай эргэн сануулах асуулт асууна: «Маша яаж зугтахаар шийдсэн бэ?»\n- Түр зогсож асуух: «Маша торхонд яагаад нуугдсан бэ?», «Баавгай яагаад айгаад зугтсан бэ?»\n- Шинэ үг: «Үүрэх» – үйлдлээр, «Хожуул» – зураг дээр заах\n- Уншсаны дараа: «Хэрвээ чи ойд төөрвөл юу хийх вэ?»","learner":"- Номын тухай эргэн сануулах асуултад \"Маша ... гэж зугтахаар шийдсэн\" гэж хариулна.\n- Түр зогсох үед Маша яагаад торхонд нуугдсан, баавгай яагаад айж зугтсаныг шалтгаантай нь хэлнэ.\n- «Үүрэх» гэдэг үгийг нуруундаа юм үүрч үзүүлнэ.\n- «Хожуул»-ыг номын зураг дээр хуруугаараа заана.\n- \"Хэрвээ би ойд төөрвөл ...\" гэж өөрийн хийх зүйлийг хэлнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: \"Анхаар!\" тэмдгийн загварыг будаж, гэртээ аваачих.\nХэл ярианы төв: Аюултай нөхцөлийн зургийг харж \"Энд юу болох вэ?\" гэж ярих.\nДүрт тоглоомын төв: \"Гал сөнөөгч\" – хувцас, хоолой бэлтгэх.","learner":"Урлагийн төв:\n- \"Анхаар!\" тэмдгийн загварыг шар, улаан өнгөөр будна.\n- Тэмдгээ гэртээ хаана наахаа (залгуурын дэргэд, эмийн шүүгээн дээр) хэлнэ.\nХэл ярианы төв:\n- Аюултай нөхцөлийн зургийг харж \"Энд ... болох гэж байна\" гэж ярина.\n- \"Тэгвэл ... болно\" гэж үр дагаврыг хэлнэ.\nДүрт тоглоомын төв:\n- Гал сөнөөгчийн хувцас өмсөж, хоолойгоор \"гал унтраана\".\n- \"101\" дугаарыг хэлж, түүнд хэзээ залгахыг тайлбарлана."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 2 (3). Хөдөлгөөнт тоглоом: «Галуу-хун, хэн нь илүү өндөр харайх вэ?»\nЗорилго: Өөрийн үйлдлийг тоглоомын бусад оролцогчдын үйлдэлтэй уялдуулж сурах, харайх чадварыг бататгах.\nТоглох явц:\n1. Хүүхдүүд (галуу-хун) гэрээсээ гарч талбай дээгүүр «нисэж» (гараа дэвүүлэн гүйж) явна.\n2. Багш: «Галуу-хунгууд аа, гэр рүүгээ нисээрэй, саарал чоно ирж байна!» гэж дуудна.\n3. Хүүхдүүд нэг зэрэг гэр рүүгээ гүйх бөгөөд энэ үед бусадтайгаа мөргөлдөхгүй, нэг нэгнээ хамгаалж гүйхийг хичээнэ.\nАнхаарах зүйл: Бүдэрч унахгүй, түлхэлцэхгүй байхыг сануулах.\nДүгнэлт, ярилцлага: «Бид өнөөдөр юу ажиглав?», «Цасны ямар шинж чанарыг олж харсан бэ?», «Бид цасыг яаж зөөж цэвэрлэв?», «Энэ ажил хэнд тустай вэ?»\nДүгнэлт: Цас бол өвлийн гайхамшигт үзэгдэл. Бид цасны шинжийг ажиглаж, талбайгаа цэвэрлэн, гэрийн тэжээвэр амьтдад тусалж, байгалиараа бахархаж байна!","learner":"- \"Галуу-хун\" болж гараа дэвүүлэн талбай дээгүүр \"нисэж\" гүйнэ.\n- Багшийн \"Саарал чоно ирж байна!\" гэсэн дохиог сонсоод гэр рүүгээ хурдан гүйнэ.\n- Гэрийн шугам дээр ирэхдээ өндөр харайна.\n- Бусадтай мөргөлдөхгүй, түлхэлцэхгүй, бүдэрч унахгүй болгоомжтой гүйнэ.\n- Дүгнэлтийн асуултад \"Бид цасыг ажиглаж, талбайгаа цэвэрлэсэн\" гэж хариулна."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Аюултай юу, аюулгүй юу?»\nЗорилго: Аюултай нөхцөлийг ялгаж, зөв шийдвэр гаргах.\nЯвц:\n1. Багш нөхцөл хэлнэ: \"Ширээн дээр эм байна\", \"Ээж цай хийж байна\".\n2. Аюултай бол хүүхдүүд гараа хөндлөн тавьж \"Үгүй!\", аюулгүй бол алгаа ташина.\n3. \"Яах ёстой вэ?\" гэж асууна.\nДүрэм: Хариултаа хөдөлгөөнөөр үзүүлнэ.\nДүгнэлт: Аюулгүй байх дүрмээ хамтдаа давтана.","learner":"- Багшийн хэлсэн нөхцөлийг сонсоно.\n- Аюултай бол гараа хөндлөн тавьж \"Үгүй!\" гэж хэлнэ.\n- Аюулгүй бол алгаа ташина.\n- \"Яах ёстой вэ?\" асуултад \"Томчуудад хэлнэ\", \"Хүрэхгүй\" гэж хариулна.\n- Аюулгүй байх дүрмээ хамтдаа давтана."}]},"2026-12-10":{"method":"Тоглоомонд суурилсан арга (давтамж)","link":"МАТ3.1а. 10 хүртэлх тоог цээжээр тоолох, 5 хүртэлх тооны юмсыг оноож тоолох, өгсөн тооноос эхэлж 1-ээр нэмэгдүүлэн тоолох, тоог жишнэ (бодит юмсын олон, цөөнийг ялгаж жиших).","competence":"Биеийн хөдөлгөөний чадвар (нүд, гарын зохицол), тоолох чадвар","materials":"Дунд хэмжээний бөмбөг (хүүхэд бүрт), 1-10 тооны карт, сагс, тэнцвэрийн самбар","criteria":"Бөмбөгийг дээш шидээд газарт ойлгон барьж авдаг. Шидэлт бүрээ 10 хүртэл цээжээр тоолдог.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, хуруугаа тоолуулан \"10 хүртэл тоолох\" дуу дуулна.","learner":"- Мэндчилж тойрогт сууна.\n- Хуруугаа нэг нэгээр нь дэлгэж 10 хүртэл тоолон дуулна.\n- Буцаагаад 10-аас доош тоолохыг оролдоно."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Зааж үзүүлэх: Бөмбөгийг хоёр гараараа дээш (толгойноос өндөр) шидээд, газарт нэг ойлгосны дараа барьж авахыг үзүүлнэ.\n- Дасгал хийх: Хүүхэд бүр бөмбөг авч 5 удаа шидэж, ойлгон барина. Удаа бүрийг чангаар тоолно.\n- Хосоор: Хосоороо нэг нь шидэж, нөгөө нь тоолох. 10 хүрээд солигдоно.\nБагшийн чиглүүлэх асуулт:\n1. Бөмбөгийг барихдаа гараа яаж байлгах вэ?\n2. Чи хэдэн удаа барьж чадсан бэ?\n3. Найз чинь чамаас олон уу, цөөн үү?","learner":"Зааж үзүүлэх:\n- Багшийн үзүүлэхийг ажиглана.\n- Бөмбөгийг хоёр гараараа толгойноосоо өндөр дээш шиднэ.\n- Бөмбөг газарт нэг ойлгосны дараа хоёр гараараа барьж авна.\nДасгал хийх:\n- Бөмбөгөө 5 удаа шидэж, ойлгон барьж, удаа бүрийг чангаар тоолно.\nХосоор:\n- Нэг нь шидэж, нөгөө нь \"Нэг, хоёр, гурав...\" гэж 10 хүртэл тоолно.\n- 10 хүрээд үүргээ солино.\nАсуултад хариулах:\n- \"Гараа дэлгээд, цээж рүүгээ татна\" гэж барих аргаа хэлнэ.\n- Хэдэн удаа барьснаа хэлж, найзынхаатай \"олон – цөөн\" гэж жишнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Хөдөлгөөний буланд бөмбөг, сагс байрлуулж, хүүхдүүд бөмбөгөөр тоглохыг ажиглана.","learner":"- Хөдөлгөөний буланд бөмбөгийг сагсанд шидэж тоглоно.\n- Сагсанд орсон бөмбөгөө тоолно.\n- Найзтайгаа ээлжлэн шиднэ."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Тоо тоолсон шүлэг, дуу (\"Нэг, хоёр, гурав, дөрөв, тав...\") уншиж, хүүхдүүдээр давтуулна.","learner":"- Тоо тоолсон шүлгийг сонсоно.\n- Шүлгийг мөр мөрөөр давтан хэлнэ.\n- Хуруугаараа тоолж дагана."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Математикийн төв: Тооны карт (1-10) дээр харгалзах тооны бөмбөлөг (цаасан) тавих.\nХөдөлгөөний төв: Тэнцвэрийн самбар дээр гараа дээш өргөж, нэг хөл дээр (дэглий) 5 тоолох хугацаанд зогсох.\nУрлагийн төв: Бөмбөг зурж, өнгөөр будах.","learner":"Математикийн төв:\n- Тооны карт (1-10)-ыг дарааллаар нь өрнө.\n- Карт бүр дээр харгалзах тооны цаасан бөмбөлөг оноож тавина.\nХөдөлгөөний төв:\n- Тэнцвэрийн самбар дээр гараа дээш өргөн алгаа хавсарна.\n- Нэг хөлөө нөгөө хөлийн өвдгөнд нааж (дэглий) 5 тоолох хугацаанд зогсоно.\nУрлагийн төв:\n- Бөмбөг зурж, өнгө өнгийн хээгээр чимэглэнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 2 (4). Ганцаарчилсан үйл ажиллагаа: Бөмбөг шидэж барих\nЗорилго: Бөмбөг барих чадвар сул хүүхдүүдтэй ганцаарчлан ажиллах.\nЯвц:\n- Хүүхэдтэй ойроос (1 м) бөмбөг шидэлцэж, барих арга (гараа дэлгэх, цээж рүүгээ татах)-ыг зааж өгнө.\n- Аажмаар зайг холдуулна.\n- Бусад хүүхдүүд цасан дээр чөлөөтэй тоглоно.","learner":"- Багштай 1 метрийн зайнаас бөмбөг шидэлцэнэ.\n- Гараа дэлгэж, бөмбөгийг цээж рүүгээ татан барьж сурна.\n- Зай холдох тусам дахин оролдоно.\n- Барьсан тоогоо тоолж, амжилтандаа баярлана.\n- Бусад хүүхдүүд цасан дээр чөлөөтэй тоглоно."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Тоо хэлэхэд бүлэглэ»\nЗорилго: Тоог сонсож, тэр тооны хүүхэдтэй бүлэг болох.\nЯвц:\n1. Хөгжим эгшиглэхэд хүүхдүүд чөлөөтэй алхана.\n2. Багш \"Гурав!\" гэхэд гурав гурваараа нийлж бүлэглэнэ.\n3. Бүлгийнхэн бие биеэ тоолж шалгана.\nДүрэм: Түлхэлцэхгүй; бүлэгт ороогүй хүүхдийг урина.\nДүгнэлт: \"Хэдэн хүүхэдтэй бүлэг хамгийн их байсан бэ?\" гэж ярилцана.","learner":"- Хөгжим эгшиглэхэд чөлөөтэй алхана.\n- Багшийн хэлсэн тоог (\"Гурав!\") сонсоод тэр тооны найзтай нийлнэ.\n- Бүлгийнхнээ тоолж шалгана.\n- Бүлэгт ороогүй найзаа урина.\n- Хамгийн том бүлэг хэдэн хүүхэдтэй байсныг хэлнэ."}]},"2026-12-11":{"method":"Төсөлд суурилсан арга (давтамж)","link":"МАТ3.3б. Дугуй, гурвалжин, дөрвөлжин дүрсүүдийг нэрлэж, дүрс, биетийг ялгана.","competence":"Бүтээлчээр сэтгэх (нугалах, эвхэх, хайчлах аргаар бүтээл хийх), дүрс ялгах","materials":"Цагаан цаас (дугуй, дөрвөлжин, гурвалжин хэлбэртэй), хүүхдийн хайч, цавуу, хөх картон, гацуурын зурагт үзүүлэн","criteria":"Цаасыг нугалж, эвхэж, хайчлах аргаар цасан ширхэг, гацуур зэрэг хавтгай болон биет наамал урладаг. Дугуй, гурвалжин, дөрвөлжин дүрсийг нэрлэж ялгадаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, гацуурын зургийг үзүүлэн \"Энэ мод ямар дүрстэй харагдаж байна вэ?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Гацуурын зургийг харж \"Гурвалжин шиг\" гэж хэлбэрийг нь адилтгана.\n- Өрөөнөөс дугуй, дөрвөлжин, гурвалжин хэлбэртэй эд зүйл олж нэрлэнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Зааж үзүүлэх: Дугуй цаасыг хоёр, дөрөв нугалж, ирмэгээр нь жижиг хэсэг хайчлаад дэлгэхэд цасан ширхэг гарахыг үзүүлнэ.\n- Гацуур эвхэх: 3 өөр хэмжээний ногоон гурвалжныг том, дунд, жижиг гэж дараалан наан гацуур хийнэ.\n- Хайчны аюулгүй дүрэм: Хайчийг үзүүрээр нь доош барих, хайчилж байхдаа гүйхгүй байхыг сануулна.\nБагшийн чиглүүлэх асуулт:\n1. Энэ цаас ямар дүрстэй вэ?\n2. Нугалаад хайчилбал юу болох бол?\n3. Гацуураа хийхэд хэдэн гурвалжин хэрэгтэй вэ?","learner":"Зааж үзүүлэх:\n- Дугуй цаасаа хоёр, дөрөв нугална.\n- Ирмэгээр нь жижиг хэсгүүд хайчилж, дэлгээд цасан ширхэг гарсныг харна.\nГацуур эвхэх:\n- Том, дунд, жижиг ногоон гурвалжныг хэмжээгээр нь дараалуулна.\n- Доороос нь эхлэн дараалан нааж гацуур хийнэ.\nХайчны аюулгүй дүрэм:\n- Хайчийг үзүүрээр нь доош барьж зөөнө, хайчилж байхдаа суусан байна.\nАсуултад хариулах:\n- Цаасныхаа дүрсийг нэрлэнэ.\n- Гацуур хийхэд хэдэн гурвалжин хэрэглэснээ тоолж хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Урлагийн буланд өнгийн цаас, хайч байрлуулж, бие даан бүтээл хийхийг ажиглана.","learner":"- Урлагийн буланд өөрийн санаагаар цаас нугалж, эвхэж бүтээл хийнэ.\n- Хаягдал цаасаа саванд хийж, ширээгээ цэвэрлэнэ."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – гурав дахь уншлага (3): «Маша ба баавгай» (Төлөвлөгөөний хуудсыг 12.07-ны төлөвлөлтийн дараа үзнэ үү.)\n- Номын үйл явдлыг хүүхдүүдээр түлхүү яриулна.\n- Дүгнэн ярилцах: «Эмээ өвөөгийнхөө захиасыг сонсох нь яагаад чухал вэ?»\n- Шинэ үгсээр өгүүлбэр зохиох: төөрөх, жигнэх, торх, хожуул, үүрэх\n- Бүтээл: цаасан сагс хийж мөөг, жимсний зураг будах","learner":"- Номын нэр, зохиолч, зураачийг санаж хэлнэ.\n- Номын зургийг харж Машагийн үйл явдлыг өөрийн үгээр ярина.\n- \"Эмээ өвөөгийнхөө захиасыг сонсох нь чухал, учир нь ...\" гэж дүгнэнэ.\n- Төөрөх, жигнэх, торх, хожуул, үүрэх үгсээр өгүүлбэр зохионо.\n- Цаасан сагс хийж, мөөг жимсний зураг будаж сагсандаа хийнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: Цасан ширхгүүдээ хөх картон дээр нааж \"Өвлийн цонх\" бүтээл хийх.\nМатематикийн төв: Дүрсүүдийг (дугуй, гурвалжин, дөрвөлжин) ангилж, тус бүрийг тоолох.\nБарилгын төв: Шоо, цилиндр, конус ашиглан цасан байшин барих.","learner":"Урлагийн төв:\n- Хайчилсан цасан ширхгүүдээ хөх картон дээр зохиомжлон нааж \"Өвлийн цонх\" бүтээл хийнэ.\nМатематикийн төв:\n- Дүрсүүдийг дугуй, гурвалжин, дөрвөлжин гэж ангилна.\n- Бүлэг тус бүрийн дүрсийг тоолж хэлнэ.\nБарилгын төв:\n- Шоо, цилиндр, конус ашиглан цасан байшин барина.\n- Ямар биет хэрэглэснээ нэрлэнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 3 (1). Ажиглалт: Цонхны цан ажиглах\nЗорилго:\n- Байгалийн сайхныг олж харах, өвлийн онцлог шинжийг ялгаж таних, уран зохиолын эх болон шүлгүүдээс танин мэдэхэд сургах\n- Цонхон дээр тогтсон цан ажиглах\n- Хээ угалзтай харьцуулан ажиглах\nЯвц:\n- Багш 12 дугаар сарын жавар багатай дулаан нэг өдрийг сонгож хүүхдүүдийг дулаан хувцаслан цэцэрлэгийн гадаах талбайд гаргана. Цонхон дээр тогтсон цанг ажиглуулж, ямар хээ, дүрс харагдаж байгааг ярилцана.\n- Шүлэг: «Гайхамшигт зураач» /Ж.Тэгшжаргал/ – «Гайхамшигт зураач цонхон дээр иржээ, Гоёмсог зургаар цонхыг чимжээ...»\n- Асуулт: «Цонхон дээр ямар зураг гарсан бэ?», «Энэ зургийг хэн зурсан бэ?», «Цан ямар хээтэй адилхан байна вэ?»","learner":"- Дулаан хувцсаа зөв өмсөж, багштай хамт гадаа гарна.\n- Цонхон дээр тогтсон цанг ойроос ажиглана.\n- Цангийн хээ, дүрсийг (гацуур, ой, од) нэрлэнэ.\n- Цангийн хээг монгол хээ угалзтай харьцуулж адил төстэйг хэлнэ.\n- «Гайхамшигт зураач» шүлгийг сонсож, мөр мөрөөр давтан хэлнэ.\n- \"Цонхон дээрх зургийг хүйтэн зурсан\" гэж таамаглалаа хэлнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Дүрсээ ол»\nЗорилго: Дүрсийг хурдан таньж ялгах.\nЯвц:\n1. Шалан дээр дугуй, гурвалжин, дөрвөлжин дүрс байрлуулна.\n2. Багш \"Гурвалжин!\" гэхэд хүүхдүүд гурвалжин дээр очиж зогсоно.\n3. Дүрс бүр дээр хэдэн хүүхэд зогссоныг тоолно.\nДүрэм: Түлхэлцэхгүй, ээлжээ хүлээнэ.\nДүгнэлт: Өнөөдөр хийсэн бүтээлээ үзэж ярилцана.","learner":"- Шалан дээрх дугуй, гурвалжин, дөрвөлжин дүрсийг харна.\n- Багшийн хэлсэн дүрсний нэрийг сонсоод тэр дүрс дээр очиж зогсоно.\n- Дүрс бүр дээр хэдэн хүүхэд зогссоныг тоолно.\n- Өнөөдөр хийсэн бүтээлээ найзуудадаа танилцуулна."}]},"2026-12-14":{"method":"Шинжлэн судлах арга","link":"ХЯ3.2в. Юмсын шинж чанар, онцлог илэрхийлсэн үгийг яриандаа ашиглана.","competence":"Шүүн тунгаах (мэдрэхүйгээр ажиглаж харьцуулах), харилцах (шинж чанарыг илэрхийлсэн үг хэрэглэх)","materials":"Сав дахь цас, мөс, бүлээн ус, ноос, чулуу, хөвөн, «Ид шидийн уут», томруулдаг шил, гурилан зуурмаг","criteria":"Мэдрэхүйн тусламжтайгаар юмсын шинж чанарыг (хүйтэн-дулаан, хатуу-зөөлөн, хөнгөн-хүнд) ялгаж харьцуулдаг. Шинж чанарыг илэрхийлсэн үгийг яриандаа ашигладаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, сав дахь цасыг харуулан \"Цасанд хүрвэл ямар санагдах бол?\" гэж таалгана.","learner":"- Мэндчилж тойрогт сууна.\n- Сав дахь цасыг харж \"Хүрвэл ... санагдах байх\" гэж таамаглана.\n- Цасанд хүрч \"хүйтэн, нойтон, зөөлөн\" гэж мэдрэмжээ хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Мэдрэх, харьцуулах: Цас, мөс, ноос, чулууг ээлжлэн барьж \"Хүйтэн үү, дулаан уу? Хатуу юу, зөөлөн үү?\" гэж асууна.\n- Туршилт: Цас, мөсийг бүлээн усанд хийж аль нь хурдан хайлахыг ажиглуулна.\n- Үгээр илэрхийлэх: Хүүхдүүдийн хэлсэн шинж чанарын үгийг (хүйтэн, гөлгөр, сэвсгэр, нойтон, хатуу) самбарт зургаар тэмдэглэнэ.\nБагшийн чиглүүлэх асуулт:\n1. Цас, мөс хоёр юугаараа адилхан, юугаараа ялгаатай вэ?\n2. Ноос яагаад дулаан санагдаж байна вэ?\n3. Аль нь хурдан хайлсан бэ? Яагаад?","learner":"Мэдрэх, харьцуулах:\n- Цас, мөс, ноос, чулууг ээлжлэн барьж мэдэрнэ.\n- \"Мөс хатуу, гөлгөр, хүйтэн\", \"Ноос зөөлөн, дулаан\" гэж шинж чанарыг нь хэлнэ.\n- Цас, мөс хоёрын адил, ялгаатайг тайлбарлана.\nТуршилт:\n- Цас, мөсийг бүлээн усанд хийж ажиглана.\n- Аль нь хурдан хайлсныг хэлж, яагаад гэдгийг таамаглана.\nҮгээр илэрхийлэх:\n- Шинж чанарын үгсийг (хүйтэн, гөлгөр, сэвсгэр, нойтон, хатуу) давтан хэлж, самбарт тэмдэглэхэд оролцоно."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Байгаль шинжлэлийн буланд мөс, цас, томруулдаг шил байрлуулж ажиглана.","learner":"- Байгаль шинжлэлийн буланд томруулдаг шилээр мөс, цасыг ажиглана.\n- Ажигласан зүйлээ найздаа ярина."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – эхний уншлага (1): «Нугасны муухай дэгдээхэй» (Чанга уншлагын төлөвлөгөөний хуудсыг үзнэ үү.)\n- Номын нэр, хавтас, зохиолч, зураачийг танилцуулж, хэмнэлийг алдагдуулахгүй уншина.\n- Түр зогсож асуух: «Бусад шувууд яагаад дэгдээхэйд дургүй байсан бэ? Дэгдээхэй ямар санагдаж байгаа бол?»\n- Шинэ үг: «Тэнүүчлэх – гэр оронгүй хэсэх»\n- Уншсаны дараа: «Муухай дэгдээхэй эцэст нь хэн болсон бэ?»","learner":"- Номын нэр, хавтасны зургийг харж \"Энэ ном ... тухай байх\" гэж таамаглана.\n- Багшийн уншихыг анхааралтай, тайван сонсоно.\n- Түр зогсох үед дэгдээхэйн сэтгэлийг \"гунигтай байгаа\" гэж хэлнэ.\n- «Тэнүүчлэх» гэдэг шинэ үгийг давтан хэлж, утгыг нь хэлнэ.\n- \"Муухай дэгдээхэй эцэст нь хун болсон\" гэж хариулна."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Байгаль шинжлэлийн төв: \"Ид шидийн уут\" – уутанд гараа хийж эд зүйлийг тэмтэрч таах.\nУрлагийн төв: Гурилан зуурмагаар том, дунд, жижиг гурван бөмбөлөг хийж цасан хүн барих.\nХэл ярианы төв: Шинж чанарын картаар \"Энэ юу вэ? Ямар вэ?\" тоглоом.","learner":"Байгаль шинжлэлийн төв:\n- Нүдээ аниад \"Ид шидийн уут\"-анд гараа хийж эд зүйлийг тэмтэрнэ.\n- \"Хатуу, дугуй, гөлгөр\" гэж шинжийг нь хэлээд нэрийг нь таана.\nУрлагийн төв:\n- Гурилан зуурмагаар том, дунд, жижиг гурван бөмбөлөг хийнэ.\n- Бөмбөлгүүдийг хэмжээгээр нь дараалан нийлүүлж, нүд, хамар нэмж цасан хүн барина.\nХэл ярианы төв:\n- Шинж чанарын карт сугалж, \"Энэ юу вэ? Ямар вэ?\" гэж эд зүйлийг дүрсэлнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 3 (2). Хөдөлмөрийн үйл ажиллагаа: Өнгөт мөсөөр чимэглэх\nХэрэглэгдэхүүн: Бүлгийн хүүхдүүдэд хүрэлцэхүйц өнгө өнгийн уснуудыг жижиг саванд хийж бэлдэнэ. Эсвэл өнгийн усаа шинэ жилийн холбогдолтой хэлбэр дүрсэд хөлдөөж бэлдэнэ.\nЯвц:\n- Хэрэв зөвхөн өнгө өнгийн ус бэлдсэн бол: Цэцэрлэгийн гаднах талбайд нэгэн байгууламжийг (цасан овоо) өнгөт усаар бүрхэнэ.\n- Хэрэв шинэ жилийн хэлбэр дүрсэд усаа хөлдөөж бэлдсэн бол: Цэцэрлэгийн гаднах талбайд хүүхдүүдийн өндөрт таарсан модыг байрлуулж (эсвэл гадаах жижиг моднууд), бэлдсэн хэрэглэгдэхүүнээрээ тухайн модыг чимэглэнэ.\n- Багш: «Улаан, шар, хөх, ногоон өнгө урсаж байна. Хүүхдүүд ээ, хар даа усны өнгө хоорондоо уусаж байна уу? Өнгөнүүд нийлээд шинэ өнгө болон хувирч байна уу?» гэх мэтээр асуулт асууж хүүхдүүдийн сонирхлыг өдөөнө.","learner":"- Өнгө өнгийн устай саваа сонгож авна.\n- Цасан овоо дээр өнгөт усаа асгаж бүрхэнэ, эсвэл өнгөт мөсөн дүрсээр модыг чимэглэнэ.\n- Өнгө бүрийг нэрлэж, хоёр өнгө нийлэхэд шинэ өнгө гарахыг ажиглана.\n- \"Шар, хөх нийлээд ногоон болсон\" гэх мэтээр ажигласнаа хэлнэ.\n- Ажлаа дуусгаад саваа цуглуулж, байранд нь тавина."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Ид шидийн уут»\nЗорилго: Хүрэлцэх мэдрэхүйгээр эд зүйлийг таних.\nЯвц:\n1. Уутанд янз бүрийн эд зүйл (бөмбөг, ноос, халбага, шоо) хийнэ.\n2. Хүүхэд нүдээ аниад гараа хийж нэг зүйлийг тэмтэрнэ.\n3. \"Ямар байна? Хатуу юу, зөөлөн үү?\" гэж тайлбарлаад нэрийг нь таана.\nДүрэм: Харж болохгүй; ээлжээ хүлээнэ.\nДүгнэлт: Өнөөдөр сурсан шинж чанарын үгсээ давтана.","learner":"- Нүдээ аниад уутанд гараа хийж нэг зүйлийг тэмтэрнэ.\n- \"Хатуу юу, зөөлөн үү? Ямар хэлбэртэй вэ?\" гэж шинжийг нь хэлнэ.\n- Эд зүйлийн нэрийг таана.\n- Ээлжээ хүлээж, найзынхаа таахыг сонсоно.\n- Өнөөдөр сурсан шинж чанарын үгсээ давтана."}]},"2026-12-15":{"method":"Шинжлэн судлах арга","link":"БНО3.1в. Мэдрэхүйн тусламжтайгаар юмсын шинж чанарыг ялгаж харьцуулна.","competence":"Шүүн тунгаах (урт, хүндийг харьцуулах), мэдрэхүйгээр ажиглах","materials":"Өөр өөр урттай тууз, мод, харандаа; дэнс (тэнцүүлэгч), хөнгөн ба хүнд эд зүйл (хөвөн, чулуу, шоо, ном), цасаар дүүргэсэн 2 сав","criteria":"Тоглоом, юмсын урт, хүндийг харьцуулж, «урт – богино», «хүнд – хөнгөн» гэж тайлбарладаг. Мэдрэхүйгээрээ шинжийг ялгадаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, хоёр хүүхдийг зэрэгцүүлэн зогсоож \"Хэн нь өндөр вэ?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Зэрэгцэж зогссон хоёр найзыгаа харьцуулж \"... нь өндөр, ... нь намхан\" гэж хэлнэ.\n- Өөрөө найзтайгаа зэрэгцэж зогсоод харьцуулна."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Урт харьцуулах: Хоёр туузыг нэг цэгээс эхлүүлэн зэрэгцүүлж \"Аль нь урт вэ?\" гэж асууна. Дараа нь 3 туузыг урт, дунд, богино гэж дараалуулна.\n- Хүнд харьцуулах: Хоёр гартаа хөвөн, чулуу барьж \"Аль нь хүнд вэ?\" гэж мэдрүүлээд дэнсээр шалгуулна.\n- Цас ба мөс: Ижил хэмжээний савтай цас, мөсийг гартаа барьж аль нь хүнд болохыг таалгаад дэнсээр шалгана.\nБагшийн чиглүүлэх асуулт:\n1. Аль нь урт вэ? Яаж мэдсэн бэ?\n2. Аль нь хүнд вэ? Гараараа мэдрэхэд ямар байсан бэ?\n3. Дэнсний аль тал доошилсон бэ? Яагаад?","learner":"Урт харьцуулах:\n- Хоёр туузыг нэг цэгээс эхлүүлэн зэрэгцүүлж тавина.\n- \"Энэ нь урт, энэ нь богино\" гэж хэлнэ.\n- Гурван туузыг урт, дунд, богино гэж дараалуулна.\nХүнд харьцуулах:\n- Хоёр гартаа хөвөн, чулуу барьж аль нь хүнд болохыг мэдэрнэ.\n- Дэнсээр шалгаж \"Хүнд нь доошилсон\" гэж хэлнэ.\nЦас ба мөс:\n- Ижил хэмжээний савтай цас, мөсийг гартаа барьж аль нь хүнд болохыг таана.\n- Дэнсээр шалгаж таамаглалаа зөв эсэхийг хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Барилгын буланд өөр өөр урттай банз, шоо байрлуулж, хүүхдүүд зам барихыг ажиглана.","learner":"- Барилгын буланд урт, богино банзаар зам барина.\n- \"Миний зам урт, чиний зам богино\" гэж найзтайгаа харьцуулна."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Том, жижиг амьтдын тухай ном уншиж, \"Аль нь том, аль нь жижиг вэ?\" гэж харьцуулуулна.","learner":"- Том, жижиг амьтдын тухай номыг сонсоно.\n- Номын зургаас амьтдыг хэмжээгээр нь харьцуулна.\n- \"Заан хулганаас том, хүнд\" гэх мэт өгүүлбэр зохионо."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Математикийн төв: Дэнсээр 2 зүйлийг харьцуулж, хүнд нь доошилдогийг ажиглах.\nХэмжих төв: Туузаар ширээ, ном, тоглоомын уртыг хэмжиж харьцуулах.\nБайгаль шинжлэлийн төв: Цас ба мөсийг ижил саванд хийж хайлахыг ажиглах.","learner":"Математикийн төв:\n- Дэнсний хоёр талд 2 зүйл тавьж харьцуулна.\n- \"Хүнд нь доошилсон\" гэж хэлээд хүнд, хөнгөнийг нэрлэнэ.\nХэмжих төв:\n- Туузаар ширээ, ном, тоглоомын уртыг хэмжиж харьцуулна.\nБайгаль шинжлэлийн төв:\n- Цас, мөсийг ижил саванд хийж, аль нь хурдан хайлахыг ажиглана.\n- Хайлсан усны хэмжээг харьцуулж хэлнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 3 (3). Зугаалгын дараах үйл ажиллагаа: «Өндөгний баяр»\nЗорилго: Багаар ажиллах чадварыг төлөвшүүлэх.\nХэрэглэгдэхүүн: Чанасан цагаан өнгөтэй өндөг, өнгө өнгийн харандаа, бал\nАргачлал: Багш хүүхдүүдэд «Гайхамшигт зураач» шүлгийг уншиж өгсний дараа хүүхдүүдийг багт хуваана. Хэрэглэгдэхүүнүүдийг баг бүрт сонголтоор өгч цан хээ, өвлийн дүрс (гацуур, цасан ширхэг) зурахыг хэлж өгнө.\nСанамж:\n- Бие биедээ тусалж, хамтран ажиллана.\n- Ажлаа дуусгаад цэвэрхэн байгаарай.\n- Бүтээл бүр чамин бөгөөд гайхалтай!","learner":"- Зугаалгаас ирээд багшийн уншиж өгөх «Гайхамшигт зураач» шүлгийг сонсоно.\n- 3-4 хүний багт нэгдэнэ.\n- Чанасан цагаан өндөг дээр өнгийн харандаа, балаар цан хээ, цасан ширхэг, гацуур зурна.\n- Харандаагаа найзуудтайгаа хуваалцаж, бие биедээ тусална.\n- Багийнхаа бүтээлийг бусдад танилцуулж, ажлын байраа цэвэрлэнэ."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Урт ба богино»\nЗорилго: Уртыг биеийн хөдөлгөөнөөр илэрхийлэх.\nЯвц:\n1. Багш \"Урт!\" гэхэд хүүхдүүд гараа хоёр тийш дэлгэнэ, \"Богино!\" гэхэд алгаа ойртуулна.\n2. \"Хүнд!\" гэхэд хүнд юм өргөж буй мэт, \"Хөнгөн!\" гэхэд хөвөн шиг хөөрнө.\n3. Хурдыг аажмаар нэмнэ.\nДүрэм: Буруу хөдөлсөн хүүхэд дараагийн тушаалыг өгнө.\nДүгнэлт: Өнөөдөр юуг харьцуулснаа ярилцана.","learner":"- Багш \"Урт!\" гэхэд гараа хоёр тийш дэлгэнэ.\n- \"Богино!\" гэхэд алгаа ойртуулна.\n- \"Хүнд!\" гэхэд хүнд юм өргөж буй дүр, \"Хөнгөн!\" гэхэд хөвөн шиг хөөрөх дүр үзүүлнэ.\n- Буруу хөдөлсөн бол дараагийн тушаалыг өгнө.\n- Өнөөдөр юуг харьцуулснаа нэрлэнэ."}]},"2026-12-16":{"method":"Зохиолд суурилсан арга (давтамж)","link":"ХЯ3.3а. Номын зургаас үйл явдлыг ойлгож ярина.","competence":"Нийгэм, сэтгэл хөдлөлийн хөгжил (бусдын таагүй сэтгэлийн шалтгааныг ойлгох, энэрэх), харилцах (номын зургаас үйл явдлыг ярих)","materials":"«Нугасны муухай дэгдээхэй» ном, сэтгэл хөдлөлийн нүүрний карт, «Энэрлийн зүрх» (улаан цаасан зүрх), нөхцөл байдлын зурагт карт","criteria":"Бусдын таагүй сэтгэл хөдлөлийн шалтгааныг энгийнээр тайлбарлаж, тайвшруулах, тэврэх, туслах зэрэг энэрэх үйлдэл үзүүлдэг. Номын зургаас үйл явдлыг ойлгож ярьдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, сэтгэл хөдлөлийн картыг үзүүлэн \"Энэ хүүхэд ямар сэтгэлтэй байна вэ?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Сэтгэл хөдлөлийн картыг харж \"Энэ хүүхэд ... байна\" гэж нэрлэнэ.\n- \"Яагаад тийм байгаа бол?\" гэсэн асуултад таамаглалаа хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Нөхцөл байдлын карт: \"Унаж өвдгөө шалбалсан\", \"Тоглоом нь эвдэрсэн\", \"Ээжийгээ санасан\" зэрэг зургийг үзүүлж, дүрийн сэтгэл, шалтгааныг ярилцуулна.\n- \"Би яаж туслах вэ?\": Нөхцөл бүрт хүүхдүүд тусламжийн үйлдэл (тэврэх, тоглоомоо хуваалцах, багшид хэлэх)-ийг дүрд тоглож үзүүлнэ.\n- Энэрлийн зүрх: Найздаа тусалсан хүүхдийг \"Энэрлийн зүрх\"-ээр урамшуулах дүрмийг танилцуулна.\nБагшийн чиглүүлэх асуулт:\n1. Энэ хүүхэд яагаад гунигтай байна вэ?\n2. Чи түүний оронд байсан бол ямар санагдах байсан бэ?\n3. Түүнд яаж туслах вэ?","learner":"Нөхцөл байдлын карт:\n- Зураг бүрийг харж дүрийн сэтгэлийг (гунигтай, өвдсөн, санасан) нэрлэнэ.\n- \"Тэр ... болохоор гунигтай байна\" гэж шалтгааныг тайлбарлана.\n\"Би яаж туслах вэ?\":\n- Нөхцөл бүрт тусламжийн үйлдлийг (тэврэх, тоглоомоо хуваалцах, багшид хэлэх) дүрд тоглож үзүүлнэ.\n- \"Чи зүгээр үү? Би тусалъя\" гэж хэлнэ.\nЭнэрлийн зүрх:\n- Найздаа тусалбал \"Энэрлийн зүрх\" авах дүрмийг сонсож, давтан хэлнэ.\nАсуултад хариулах:\n- \"Хэрвээ би түүний оронд байсан бол ... санагдах байсан\" гэж хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Тоглох үед хүүхдүүд бие биедээ хэрхэн тусалж буйг ажиглаж, \"Энэрлийн зүрх\" өгнө.","learner":"- Тусламж хэрэгтэй найзыгаа анзаарч тусална.\n- Тоглоомоо хуваалцана.\n- Тусалсныхаа төлөө \"Энэрлийн зүрх\" авна."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – хоёр дахь уншлага (2): «Нугасны муухай дэгдээхэй» (Төлөвлөгөөний хуудсыг 12.14-ний төлөвлөлтийн дараа үзнэ үү.)\n- Номын тухай эргэн сануулах асуулт асууна: «Дэгдээхэй хаа хаана очсон бэ?»\n- Түр зогсож асуух: «Өвөл болоход юу болсон бэ? Хэн тусалсан бэ?», «Дэгдээхэй яагаад хүүхдүүдээс айсан бэ?»\n- Шинэ үг: «Гологдох», «Сүрэг»\n- Уншсаны дараа: «Хэрвээ чи тэр хашаанд байсан бол дэгдээхэйтэй яаж харьцах байсан бэ?»","learner":"- Номын тухай эргэн сануулах асуултад дэгдээхэйн очсон газруудыг дарааллаар нь ярина.\n- Номын зургаас үйл явдлыг ойлгож ярина.\n- Дэгдээхэйн гунигласан, ганцаарласан шалтгааныг тайлбарлана.\n- «Гологдох», «Сүрэг» үгийн утгыг давтан хэлнэ.\n- \"Хэрвээ би тэр хашаанд байсан бол дэгдээхэйтэй ... харьцах байсан\" гэж хэлнэ.\n- «Дэгдээхэй» болж далавчаа дэвж нисэх хөдөлгөөн хийнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: \"Найздаа зориулсан зүрх\" – улаан цаасан зүрхийг чимэглэж, найздаа бэлэглэх.\nХэл ярианы төв: Сэтгэл хөдлөлийн карт ба шалтгааны картыг тааруулах.\nНомын төв: Зурагт номын дүрүүдийн сэтгэл хөдлөлийг ярих.","learner":"Урлагийн төв:\n- Улаан цаасан зүрхийг будаж, наалтаар чимэглэнэ.\n- Найздаа \"Чамдаа зориулав\" гэж бэлэглэнэ.\nХэл ярианы төв:\n- Сэтгэл хөдлөлийн карт ба шалтгааны картыг тааруулж тавина.\n- \"Тэр ... болохоор ... байна\" гэж тайлбарлана.\nНомын төв:\n- Зурагт номын дүрүүдийн сэтгэлийг нэрлэнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 3 (4). Ганцаарчилсан үйл ажиллагаа: Шугамаар алхах\nЗорилго: Тэнцвэр, анхаарал сул хүүхдүүдтэй цасан дээрх шугамаар алхах дасгал хийх.\nЯвц:\n- Цасан дээр шугам татаж, хүүхдийг шугамаар хөлийн өсгий, хуруугаа залган алхуулна.\n- Гараа хоёр тийш дэлгэж тэнцвэрээ хадгалахыг дэмжинэ.\n- Бусад хүүхдүүд өнгөт мөсөөр чимэглэсэн модоо ажиглана.","learner":"- Цасан дээр татсан шугам дээр зогсоно.\n- Хөлийн өсгий, хуруугаа залган шугамаар алхана.\n- Гараа хоёр тийш дэлгэж тэнцвэрээ хадгална.\n- Багшийн дэмжлэгтэйгээр дахин оролдож, амжилтаа найздаа хэлнэ.\n- Бусад хүүхдүүд өнгөт мөсөөр чимэглэсэн модоо ажиглана."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Найзаа баярлуул»\nЗорилго: Бусдын сэтгэлийг ойлгож, энэрэх үйлдэл хийх.\nЯвц:\n1. Нэг хүүхэд гунигтай дүр үзүүлж тойргийн голд сууна.\n2. Бусад хүүхдүүд ээлжлэн түүнийг баярлуулах үг хэлж, үйлдэл хийнэ.\n3. \"Гунигтай\" хүүхэд инээмсэглэвэл дараагийн хүүхэд солигдоно.\nДүрэм: Эелдэг үг хэлнэ; шоолохгүй.\nДүгнэлт: \"Хүнийг юу баярлуулдаг вэ?\" гэж ярилцана.","learner":"- Ээлжээр \"гунигтай\" дүр үзүүлж тойргийн голд сууна.\n- Бусад нь \"гунигтай\" найзыгаа баярлуулах эелдэг үг хэлж, үйлдэл хийнэ.\n- \"Гунигтай\" хүүхэд инээмсэглэвэл дараагийн хүүхэд солигдоно.\n- \"Хүнийг ... баярлуулдаг\" гэж дүгнэнэ."}]},"2026-12-17":{"method":"Зохиолд суурилсан арга","link":"МАТ3.2б. Өдөр тутмын хийдэг үйлийг дараалуулна.","competence":"Харилцах (үйл явдлыг эхлэл, өрнөл, төгсгөлийн дарааллаар ярих), шүүн тунгаах (үйлийг дараалуулах)","materials":"Дараалсан 4 зурагт карт («Цасан хүн хийх», «Өглөөний дэглэм»), өдөр тутмын үйлийн карт (босох, угаах, цай уух, цэцэрлэгт ирэх), тоглоомон микрофон","criteria":"Үйл явдлын эхлэл, өрнөл, төгсгөлийг дарааллын дагуу ярьдаг. Өдөр тутмын үйлийг зөв дараалуулдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Өнөө өглөө босоод юу юу хийсэн бэ?\" гэж дарааллаар нь яриулна.","learner":"- Мэндчилж тойрогт сууна.\n- Өнөө өглөө босоод хийсэн үйлээ \"Эхлээд би боссон, дараа нь нүүрээ угаасан, эцэст нь цэцэрлэгт ирсэн\" гэж дарааллаар нь ярина.\n- Найзынхаа ярианаас ижил үйлийг олж хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Дараалсан зураг: «Цасан хүн хийх» 4 зурагт картыг холиод хүүхдүүдээр зөв дараалуулна.\n- Эхлэл, өрнөл, төгсгөл: Дараалуулсан зургаар \"Эхлээд юу болсон бэ? Дараа нь? Эцэст нь?\" гэж түүх яриулна.\n- Өдрийн дэглэм: Өдөр тутмын үйлийн картыг (босох, нүүрээ угаах, цай уух, цэцэрлэгт ирэх) дараалуулж тайлбарлуулна.\nБагшийн чиглүүлэх асуулт:\n1. Түүх юунаас эхэлсэн бэ?\n2. Дараа нь юу болсон бэ?\n3. Түүх яаж төгссөн бэ?\n4. Цай уухаасаа өмнө юу хийдэг вэ?","learner":"Дараалсан зураг:\n- Холилдсон «Цасан хүн хийх» 4 картыг харж, үйл явдлын дарааллаар зөв байрлуулна.\n- Буруу байрлуулсан бол найзтайгаа ярилцаж засна.\nЭхлэл, өрнөл, төгсгөл:\n- Дараалуулсан зургаар \"Эхлээд ..., дараа нь ..., эцэст нь ...\" гэсэн үгийг ашиглан түүх ярина.\n- Найзынхаа ярианд нэмэлт оруулна.\nӨдрийн дэглэм:\n- Босох, нүүрээ угаах, цай уух, цэцэрлэгт ирэх картуудыг зөв дараалуулна.\n- \"Цай уухаасаа өмнө гараа угаана\" гэж тайлбарлана."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Номын буланд дараалсан зурагт картууд байрлуулж, хүүхдүүд бие даан түүх зохиохыг ажиглана.","learner":"- Номын буланд дараалсан зурагт картыг өөрөө дараалуулна.\n- Картаар найздаа түүх ярьж, найзынхаа түүхийг сонсоно."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Богино үлгэр (\"Манжин\") уншиж, үлгэрийн эхлэл, өрнөл, төгсгөлийг хүүхдүүдээр яриулна.\n- \"Хэн хэн манжин сугалахад туслав? Дарааллаар нь хэлээрэй\" гэж асууна.","learner":"- \"Манжин\" үлгэрийг анхааралтай сонсоно.\n- Манжин сугалахад туслах дүрүүдийг дарааллаар нь (өвөө, эмээ, ач охин, нохой, муур, хулгана) нэрлэнэ.\n- Үлгэрийн эхлэл, өрнөл, төгсгөлийг өөрийн үгээр ярина."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Хэл ярианы төв: \"Сурвалжлагч\" – микрофоноор \"Чи өчигдөр орой юу юу хийсэн бэ?\" гэж асууж дарааллаар яриулах.\nМатематикийн төв: Өдрийн дэглэмийн картаар \"Өглөө – өдөр – орой\" гэж ангилж дараалуулах.\nУрлагийн төв: \"Миний өглөө\" сэдвээр 3 хэсэгт хуваасан цаасан дээр зураг зурах.","learner":"Хэл ярианы төв:\n- Сурвалжлагчийн асуултад өчигдөр орой хийсэн зүйлээ \"Эхлээд..., дараа нь...\" гэж дарааллаар ярина.\nМатематикийн төв:\n- Өдрийн дэглэмийн картуудыг \"өглөө – өдөр – орой\" гэж ангилж дараалуулна.\nУрлагийн төв:\n- 3 хэсэгт хуваасан цаасан дээр өглөөний 3 үйлээ дарааллаар зурна.\n- Зургаа дарааллаар нь тайлбарлана."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 4 (1). Ажиглалт: Улиас модыг ажиглах\nЯвц: Багш хүүхдүүдтэй ярилцаж, дараах асуултуудыг асууна:\n- «Өвлийн улиралд модод юу хийдэг вэ?»\n- «Өвөл модонд таатай юу, эсвэл хэцүү юу?»\n- «Бид мод ургамалд өвлийн давжааг туулахад нь хэрхэн тусалж чадах вэ?»\n- «Өвөл мод ямар байдалтай болдог вэ?»\nТайлбар (хүүхдүүдэд ойлгуулах хэсэг):\n- Өвөл бол ургамлын хувьд хүнд улирал юм. Учир нь хөрс хөлддөг тул үндэс нь ус бараг авч чаддаггүй.\n- Харин навч байвал усыг ууршуулсаар байдаг тул ургамал усны дутагдалд орж болзошгүй.\n- Тиймээс намар модод навчаа гөвдөг. Энэ нь амьд үлдэх чухал арга юм.\n- Навчаа унагаасны дараа мод «өвлийн нойр» буюу амралтын байдалд ордог. Энэ үед өсөлт бараг зогсож, энергиэ хэмнэдэг.","learner":"- Улиас модыг ойроос ажиглаж, навчгүй, мөчир нь нүцгэн болсныг хэлнэ.\n- Багшийн асуултад \"Өвөл модонд хэцүү, учир нь хөрс хөлддөг\" гэж хариулна.\n- Мод яагаад намар навчаа гөвдгийг өөрийн үгээр тайлбарлана.\n- «Өвлийн нойр» гэдэг үгийг давтан хэлнэ.\n- Модонд хэрхэн туслахаа (\"Үндсийг нь цасаар хучна\") санал болгоно."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Түүх үргэлжлүүлье»\nЗорилго: Түүхийг дараалан зохиож ярих.\nЯвц:\n1. Багш \"Нэг өглөө цасан хүн нүдээ нээв...\" гэж эхлүүлнэ.\n2. Бөмбөг дамжуулахад хүүхэд бүр нэг өгүүлбэр нэмнэ.\n3. Сүүлийн хүүхэд түүхийг төгсгөнө.\nДүрэм: Бөмбөг барьсан хүн ярина; өмнөх өгүүлбэрийг анхааралтай сонсоно.\nДүгнэлт: Хамтдаа зохиосон түүхийг багш дахин ярьж өгнө.","learner":"- Багшийн эхлүүлсэн түүхийг (\"Нэг өглөө цасан хүн нүдээ нээв...\") анхааралтай сонсоно.\n- Бөмбөг ирэхэд түүхэнд нэг өгүүлбэр нэмнэ.\n- Өмнөх найзынхаа өгүүлбэрийг үргэлжлүүлж ярина.\n- Сүүлийн хүүхэд түүхийг төгсгөнө.\n- Хамтдаа зохиосон түүхээ эргэн ярина."}]},"2026-12-18":{"method":"Тоглоомонд суурилсан арга","link":"ХЭМ3.2в. Хоол, хүнсний бүтээгдэхүүнээс эрүүл мэндэд тустай хүнсийг ялгаж, хэрэглэнэ.","competence":"Шүүн тунгаах (нэг шинжээр ангилах), эрүүл хооллолт (тустай хүнсийг ялгах)","materials":"Хүнсний бүтээгдэхүүний загвар/зурагт карт (жимс, ногоо, сүү цагаан идээ, мах), 4 сагс, өнгөт товч, 4 аяга, «Эрүүл таваг» үзүүлэн","criteria":"Тоглоом, юмсыг нэг шинжээр (төрөл, өнгө, хэлбэр) 4 хүртэлх хэсэгт ангилж байрлуулдаг. Эрүүл мэндэд тустай хүнсийг ялгаж нэрлэдэг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Өглөөний цайндаа юу идсэн бэ? Тэр нь биед тустай юу?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Өглөөний цайндаа юу идсэнээ нэрлэнэ.\n- \"Тэр биед тустай, учир нь ...\" гэж хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Ангилах: Хүнсний картуудыг холиод \"Жимс\", \"Ногоо\", \"Сүү, цагаан идээ\", \"Мах\" гэсэн 4 сагсанд ангилуулна.\n- Эрүүл таваг: Ангилсан хүнснээс \"Эрүүл таваг\" үзүүлэн дээр нэг өдрийн хоол бүрдүүлнэ.\n- Тустай ба тусгүй: Чихэр, хийжүүлсэн ундаа, чипсний картыг үзүүлж \"Үүнийг өдөр бүр идвэл яах вэ?\" гэж ярилцана.\nБагшийн чиглүүлэх асуулт:\n1. Энэ хүнсийг аль сагсанд хийх вэ? Яагаад?\n2. Аль сагсанд хамгийн олон карт байна вэ?\n3. Ямар хүнс биеийг хүчтэй болгодог вэ?","learner":"Ангилах:\n- Хүнсний картыг харж нэрлэнэ.\n- Картыг \"Жимс\", \"Ногоо\", \"Сүү, цагаан идээ\", \"Мах\" гэсэн 4 сагсанд ангилж хийнэ.\n- Сагс бүрийн картыг тоолж \"Аль сагсанд олон байна\" гэж жишнэ.\nЭрүүл таваг:\n- Ангилсан хүнснээс \"Эрүүл таваг\" дээр нэг өдрийн хоол бүрдүүлнэ.\n- \"Миний таваг дээр ... байна\" гэж тайлбарлана.\nТустай ба тусгүй:\n- Чихэр, хийжүүлсэн ундаа, чипсийг тусад нь ялгана.\n- \"Өдөр бүр идвэл шүд өвдөнө\" гэх мэт үр дагаврыг хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Дүрт тоглоомын буланд \"Ресторан\" орчин бүрдүүлж, хүүхдүүдийн хооллох үеийн дүрмийг мөрдөж буйг ажиглана.","learner":"- \"Ресторан\" буланд тогооч, үйлчлэгч, зочин болж тоглоно.\n- Хооллохын өмнө гараа угаах дүрмийг дүрээрээ үзүүлнэ.\n- Хоолоо авахдаа \"Баярлалаа\" гэж эелдэг хэлнэ."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – гурав дахь уншлага (3): «Нугасны муухай дэгдээхэй» (Төлөвлөгөөний хуудсыг 12.14-ний төлөвлөлтийн дараа үзнэ үү.)\n- Номын үйл явдлыг хүүхдүүдээр түлхүү яриулна.\n- Дүгнэн ярилцах: «Бусдыг гадаад төрхөөр нь шүүж болох уу?»\n- Шинэ үгсээр өгүүлбэр зохиох: доромжлол, тэнүүчлэх, тусгал, сүрэг\n- Бүтээл: цаасан хун хийх; «Миний найз» зураг","learner":"- Номын нэр, зохиолч, зураачийг санаж хэлнэ.\n- Номын зургийг харж дэгдээхэйн түүхийг өөрийн үгээр ярина.\n- \"Бусдыг гадаад төрхөөр нь шүүж болохгүй, учир нь ...\" гэж дүгнэнэ.\n- Доромжлол, тэнүүчлэх, тусгал, сүрэг үгсээр өгүүлбэр зохионо.\n- Цаасан хун хийж, эсвэл «Миний найз» зураг зурж танилцуулна."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Математикийн төв: Өнгөт товчийг өнгөөр нь 4 аяганд ангилах, аяга бүрийг тоолох.\nУрлагийн төв: \"Миний эрүүл таваг\" – цаасан таваг дээр тустай хүнс зурах.\nДүрт тоглоомын төв: \"Хүнсний дэлгүүр\" – барааг төрлөөр нь тавиурт өрөх.","learner":"Математикийн төв:\n- Өнгөт товчийг өнгөөр нь 4 аяганд ангилна.\n- Аяга бүрийн товчийг тоолж, аль нь олон болохыг хэлнэ.\nУрлагийн төв:\n- Цаасан таваг дээр тустай хүнс зурж, нэрлэнэ.\nДүрт тоглоомын төв:\n- \"Хүнсний дэлгүүр\"-т барааг төрлөөр нь тавиурт өрнө."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 4 (2). Хөдөлмөрийн үйл ажиллагаа: Модыг арчлах\nЗорилго: Хүүхдэд байгаль, ургамлыг хайрлах, арчлах дадал суулгах.\nХүүхдүүд дараах ажлыг хийж болно:\n- Мод руу очих замыг цэвэрлэх\n- Модыг чимэглэх (жишээ нь: байгалийн хоргүй зүйлсээр)\n- Модны үндэс орчимд цас овоолж, дулаалах\n- Асуулт: «Бидний ажил модонд ямар тус болох вэ?»","learner":"- Улиас мод руу очих замыг хүрзээр цэвэрлэнэ.\n- Модыг байгалийн хоргүй зүйлсээр (боргоцой, мөчир) чимэглэнэ.\n- Модны үндэс орчимд цас овоолж дулаална.\n- \"Бидний ажил модыг хүйтнээс хамгаална\" гэж ажлынхаа ач холбогдлыг хэлнэ.\n- Ажлаа дуусгаад багажаа байранд нь тавина."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Сагсаа ол»\nЗорилго: Хүнсийг төрлөөр нь хурдан ангилах.\nЯвц:\n1. Хүүхэд бүрт нэг хүнсний карт өгнө.\n2. Хөгжим зогсоход хүүхдүүд картандаа тохирох сагсны дэргэд очно.\n3. Бүлэг бүрийн хүүхдүүдийг тоолно.\nДүрэм: Гүйхгүй, алхаж очно; буруу очсон найздаа тусална.\nДүгнэлт: \"Өнөөдөр ямар тустай хүнс идэх вэ?\" гэж ярилцана.","learner":"- Өөрт өгсөн хүнсний картыг харж аль төрөлд хамаарахыг хэлнэ.\n- Хөгжим зогсоход картандаа тохирох сагсны дэргэд алхаж очно.\n- Буруу очсон найздаа тусалж, зөв сагсыг зааж өгнө.\n- Бүлгийнхнээ тоолно.\n- \"Өнөөдөр би ... гэсэн тустай хүнс идэнэ\" гэж хэлнэ."}]},"2026-12-21":{"method":"Зохиолд суурилсан арга","link":"БНО3.2г. Орчны эд зүйлсийг зориулалтын дагуу ашиглаж, ус хэмнэх, хог хаягдал ялгаж хаях үйлийг бие даан хийнэ.","competence":"Нийгэм, сэтгэл хөдлөлийн хөгжил (өөрийн үйлдлийн бусдад үзүүлэх нөлөөг ойлгох), байгаль орчинд ээлтэй дадал (хог ангилах, ус хэмнэх)","materials":"«Ус, цэцэг хоёр» ном, цэнхэр, шар, ногоон хогийн сав, цэвэр хог хаягдал (цаас, хуванцар сав, жимсний хальсны загвар), «Үйлдэл – үр дагавар» зурагт карт","criteria":"Өөрийнх нь үйлдэл бусдад хэрхэн нөлөөлдгийг (хог хаях, ус урсгах) ойлгож тайлбарладаг. Хог хаягдлыг ангилж хаях, ус хэмнэх үйлийг бие даан хийдэг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, \"Чамд хэн нэгэн тусалбал ямар санагддаг вэ?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Хэн нэгэн тусалсан үеийн мэдрэмжээ \"Надад ... тусалсан, би баярласан\" гэж хэлнэ.\n- Өөрөө бусдад тусалсан жишээгээ ярина."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Үйлдэл – үр дагавар: \"Хогоо газар хаясан\", \"Цоргоо нээлттэй орхисон\", \"Найздаа тоглоомоо өгсөн\" зурагт картыг үзүүлж, үр дагаврын картыг тааруулна.\n- Хог ангилах: Гурван өнгийн савыг танилцуулж, хог хаягдлыг ангилж хийлгэнэ.\n- Ус хэмнэх: Гар угаахдаа цоргыг хааж саван түрхэх дадлыг хамтдаа хийнэ.\nБагшийн чиглүүлэх асуулт:\n1. Хогоо газар хаявал хэнд, юунд хор болох вэ?\n2. Ус урсгавал юу болох вэ?\n3. Чиний сайн үйлдэл бусдыг яаж баярлуулдаг вэ?","learner":"Үйлдэл – үр дагавар:\n- Үйлдлийн зургийг харж юу болж байгааг хэлнэ.\n- Тохирох үр дагаврын картыг сонгож тааруулна.\n- \"Хогоо газар хаявал ... болно\" гэж тайлбарлана.\nХог ангилах:\n- Гурван өнгийн савыг харж, аль саванд юу хийхийг давтан хэлнэ.\n- Цаас, хуванцар, хүнсний хаягдлыг ангилж зөв саванд хийнэ.\nУс хэмнэх:\n- Гар угаахдаа цоргоо хааж саван түрхэнэ, дараа нь цоргоо нээж зайлна.\n- \"Би усаа хэмнэвэл ... болно\" гэж хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Тоглосны дараа тоглоомоо хураахад хүүхдүүд бие биедээ хэрхэн тусалж буйг ажиглана.","learner":"- Тоглосны дараа тоглоомоо байранд нь хураана.\n- Найздаа тоглоом хураахад тусална."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – эхний уншлага (1): «Ус, цэцэг хоёр» (Чанга уншлагын төлөвлөгөөний хуудсыг үзнэ үү.)\n- Номын нэр, хавтас, зохиолч, зураачийг танилцуулж, хэмнэлийг алдагдуулахгүй уншина.\n- Түр зогсож асуух: «Цэцэг яагаад өвдөөд байна вэ?»\n- Шинэ үг: «Халамжлах – анхаарч, тусалж байх»\n- Уншсаны дараа: «Ус юуг ойлгосон бэ?», «Цэцэг ургахад юу хэрэгтэй вэ?»","learner":"- Номын нэр, хавтасны зургийг харж \"Энэ ном ... тухай байх\" гэж таамаглана.\n- Багшийн уншихыг анхааралтай, тайван сонсоно.\n- Түр зогсох үед \"Цэцэг ... болохоор өвдсөн\" гэж таамаглана.\n- «Халамжлах» гэдэг шинэ үгийг давтан хэлж, утгыг нь хэлнэ.\n- \"Цэцэг ургахад ус, нар, хөрс хэрэгтэй\" гэж хариулна."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Байгаль шинжлэлийн төв: Хог ангилах тоглоом – зурагт хогийг 3 савны зурагтай тааруулах.\nУрлагийн төв: \"Цэвэр цэцэрлэг\" зураг зурах.\nДүрт тоглоомын төв: \"Хог цэвэрлэгч\" – мэргэжлийн хувцас, бээлий, жижиг сав бэлтгэх.","learner":"Байгаль шинжлэлийн төв:\n- Зурагт хогийг 3 савны зурагтай тааруулж ангилна.\nУрлагийн төв:\n- \"Цэвэр цэцэрлэг\" зураг зурж тайлбарлана.\nДүрт тоглоомын төв:\n- Хог цэвэрлэгчийн хувцас, бээлий өмсөж тоглоно.\n- \"Хог цэвэрлэгч бидэнд ... тусалдаг\" гэж ярина."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 4 (3). Хөдөлгөөнт тоглоом: «Бөмбөг дамжуулаарай»\nЗорилго: Нийгэмшлийн чадвар, хэл яриа, хамтын ажиллагаа болон хөдөлгөөний эвсэл, анхаарлыг хөгжүүлэх; тоглоомын дагуу хөдөлгөөн хийх чадвар эзэмшүүлэх; авхаалж самбаа, хурд, биеийн идэвхийг хөгжүүлэх.\nЗохион байгуулах хэлбэр: Багаар\nХэрэглэгдэхүүн: Бага насны хүүхдэд зориулсан дунд зэргийн хэмжээтэй хөнгөн бөмбөг, хөгжим\nТоглоомын заавар: Хүүхдүүд тойрог болон сууна. Хөгжим эгшиглэхэд бөмбөгийг бие биедээ дамжуулна. Хөгжим зогсох үед бөмбөг хэний гар дээр байна, тэр хүүхэд өөрийгөө танилцуулах эсвэл хамгийн дуртай дуугаа хэлнэ.\nБагшийн санамж: Хүүхдүүдийг дулаан хувцаслаж, аюулгүй орчинд үйл ажиллагаа явуулахыг анхаарна уу.","learner":"- Тойрог болж сууна.\n- Хөгжим эгшиглэхэд бөмбөгийг хажуугийн найздаа дамжуулна.\n- Хөгжим зогсоход бөмбөг барьсан бол өөрийгөө танилцуулж, эсвэл хамгийн дуртай дуугаа хэлнэ.\n- Найзынхаа ярихыг анхааралтай сонсоно."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Хэрвээ ... бол»\nЗорилго: Үйлдлийн үр дагаврыг таамаглах.\nЯвц:\n1. Багш \"Хэрвээ би найзынхаа зургийг урвал...\" гэж эхлүүлнэ.\n2. Хүүхдүүд \"...найз маань гуниглана\" гэж үргэлжлүүлнэ.\n3. Сайн, муу үйлдлийн жишээг ээлжлэн хэлнэ.\nДүрэм: Гараа өргөж ээлжээ авна.\nДүгнэлт: \"Өнөөдөр хэнийг баярлуулсан бэ?\" гэж ярилцана.","learner":"- Багшийн эхлүүлсэн нөхцөлийг (\"Хэрвээ би найзынхаа зургийг урвал...\") сонсоно.\n- \"...найз маань гуниглана\" гэж үр дагаврыг үргэлжлүүлнэ.\n- Сайн, муу үйлдлийн жишээ гаргана.\n- Гараа өргөж ээлжээ авна.\n- Өнөөдөр хийсэн сайн үйлсээ хуваалцана."}]},"2026-12-22":{"method":"Төсөлд суурилсан арга","link":"БНО3.2г. Орчны эд зүйлсийг зориулалтын дагуу ашиглаж, ус хэмнэх, хог хаягдал ялгаж хаях үйлийг бие даан хийнэ.","competence":"Бүтээлчээр сэтгэх (дахин ашиглах материалаар соёлын бүтээл хийх), байгаль орчинд ээлтэй хандлага","materials":"Цэвэрлэсэн хуванцар сав, тагнууд, картон хайрцаг, ороосон цаасны цилиндр, байгалийн материал (нарсны боргоцой, мөчир), цавуу, будаг, хөөсөн дардас","criteria":"Тоглоом болон байгалийн материал, дахин ашиглах материалаас санаагаа илэрхийлсэн бүтээл (шинэ жилийн чимэглэл, тоглоом) урладаг. Бүтээлээ толбо, дардсаар чимэглэдэг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, гэрээс авчирсан хуванцар сав, хайрцгийг үзүүлэн \"Үүнийг хаявал юу болох вэ? Өөр юу хийж болох вэ?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Гэрээс авчирсан хуванцар сав, хайрцгаа нэрлэнэ.\n- \"Үүгээр ... хийж болно\" гэж санаагаа хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Санаа олох: Дахин ашигласан материалаар хийсэн бүтээлийн (сав – гацуурын хонх, хайрцаг – машин, боргоцой – гацуурын тоглоом) жишээг үзүүлнэ.\n- Төлөвлөх: Хүүхэд бүр юу хийхээ сонгож, хэрэгтэй материалаа цуглуулна.\n- Бүтээх: Хайчлах, наах, будах ажлыг хийж, бүтээлээ хөөсөн дардсаар чимэглэнэ.\nБагшийн чиглүүлэх асуулт:\n1. Чи юу хийхээр шийдсэн бэ?\n2. Үүнд ямар материал хэрэгтэй вэ?\n3. Хогоо дахин ашиглавал байгальд ямар тус болох вэ?","learner":"Санаа олох:\n- Дахин ашигласан материалаар хийсэн бүтээлүүдийг харж юугаар хийснийг таана.\nТөлөвлөх:\n- Юу хийхээ сонгож, \"Би ... хийнэ\" гэж хэлнэ.\n- Хэрэгтэй материалаа (сав, таг, хайрцаг, боргоцой) цуглуулна.\nБүтээх:\n- Хайчилж, нааж, будаж бүтээлээ хийнэ.\n- Хөөсөн дардсаар толбо, дардас үүсгэн чимэглэнэ.\nТанилцуулах:\n- Бүтээлээ найздаа танилцуулж, \"Хогоо дахин ашигласан тул байгаль цэвэр байна\" гэж хэлнэ."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Барилгын буланд хайрцаг, цилиндр байрлуулж, хүүхдүүдийн бүтээлч тоглоомыг ажиглана.","learner":"- Хайрцаг, цилиндрээр барилга барина.\n- Найзтайгаа хамтран санаагаа хэрэгжүүлнэ."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Байгалийг хамгаалах тухай шүлэг уншиж, \"Бид байгальд яаж тусалж чадах вэ?\" гэж асууна.","learner":"- Байгалийг хамгаалах шүлгийг сонсож мөр мөрөөр давтана.\n- Байгальд туслах аргаа (хог хаяхгүй, мод тарих, ус хэмнэх) нэрлэнэ."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Урлагийн төв: Нарсны боргоцойг будаж, гацуурын тоглоом хийх.\nБайгаль шинжлэлийн төв: Хог хаягдлыг материалаар нь (цаас, хуванцар, шил) ангилах.\nМатематикийн төв: Таг, товчоор зүй тогтол үүсгэх (улаан-цагаан-улаан-цагаан).","learner":"Урлагийн төв:\n- Нарсны боргоцойг будаж, гялтгануураар чимэглэн гацуурын тоглоом хийнэ.\nБайгаль шинжлэлийн төв:\n- Хог хаягдлыг цаас, хуванцар, шил гэж материалаар нь ангилна.\nМатематикийн төв:\n- Таг, товчоор \"улаан-цагаан-улаан-цагаан\" зүй тогтол үүсгэж үргэлжлүүлнэ."},{"time":"1140-1200","name":"Зугаалга\nҮйл ажиллагаа-6","teacher":"Зугаалга 4 (4). Ганцаарчилсан үйл ажиллагаа: Мөлхөх дасгал\nЗорилго: Мөлхөх хөдөлгөөн сул хүүхдүүдтэй өвдөг, тохойны тусламжтай мөлхөх дасгал хийх.\nЯвц:\n- Цасан дээр дэвсгэр дэвсэж, нуман хаалга доогуур мөлхүүлнэ.\n- Бөгсөөрөө гулсах дасгалыг налуу толгод дээр хийлгэнэ.\n- Бусад хүүхдүүд улиас модны орчимд чөлөөт тоглоом тоглоно.","learner":"- Цасан дээр дэвссэн дэвсгэр дээр өвдөг, тохойгоороо нуман хаалга доогуур мөлхөнө.\n- Налуу толгодоос бөгсөөрөө гулсана.\n- Багшийн дэмжлэгтэйгээр дасгалаа давтана.\n- Бусад хүүхдүүд улиас модны орчимд чөлөөт тоглоом тоглоно."},{"time":"1700-1730","name":"Хөгжөөн баясах\nҮйл ажиллагаа-7","teacher":"Тоглоом: «Хог ангилагч баатрууд»\nЗорилго: Хог хаягдлыг хурдан ангилах, багаар ажиллах.\nЯвц:\n1. Хүүхдүүдийг 3 багт хуваана (цаас, хуванцар, хүнсний хаягдал).\n2. Шалан дээр тараасан хогийн загварыг баг бүр өөрийн төрлөөр цуглуулна.\n3. Цуглуулсан хогоо тоолно.\nДүрэм: Зөвхөн өөрийн төрлийг цуглуулна; түлхэлцэхгүй.\nДүгнэлт: \"Өнөөдөр бид байгальд яаж тусалсан бэ?\" гэж ярилцана.","learner":"- Цаас, хуванцар, хүнсний хаягдлын гэсэн 3 багт хуваагдана.\n- Шалан дээр тараасан хогийн загвараас зөвхөн өөрийн багийн төрлийг цуглуулна.\n- Цуглуулсан хогоо тоолж, бусад багийнхтай харьцуулна.\n- \"Өнөөдөр бид байгальд ... тусалсан\" гэж ярина."}]},"2026-12-23":{"method":"Шинжлэн судлах арга","link":"ХЯ3.2г. Үгийг оновчтой сонгож, дэлгэрэнгүй өгүүлбэрээр ярина.","competence":"Харилцах (бүтээлийн талаарх сэтгэгдлээ дэлгэрэнгүй өгүүлбэрээр илэрхийлэх), гоо зүйн мэдрэмж","materials":"Монгол зураачдын өвлийн сэдэвтэй уран зургийн хуулбар (өвлийн бэлчээр, цагаан сар, хүүхдийн тоглоом), жижиг баримлын бүтээл, «Үзэсгэлэн» тавцан","criteria":"Уран зураг, баримлын бүтээлийг ажиглаж, өөрт төрсөн сэтгэгдлээ илэрхийлдэг. Үгийг оновчтой сонгож, дэлгэрэнгүй өгүүлбэрээр ярьдаг.","steps":[{"time":"1000-1020","name":"Тойргийн цаг\nҮйл ажиллагаа-1","teacher":"Мэндчилж, бүлгийн өрөөнд \"Үзэсгэлэн\" байгуулсныг зарлаж, \"Үзэсгэлэнд юу хийдэг вэ?\" гэж асууна.","learner":"- Мэндчилж тойрогт сууна.\n- Үзэсгэлэнд очиж байсан туршлагаа ярина.\n- \"Гар хүрэхгүй, чимээгүй үзнэ\" гэж үзэсгэлэнгийн дүрмийг хэлнэ."},{"time":"1020-1045","name":"Чиглүүлэгтэй үйл ажиллагаа\nҮйл ажиллагаа-2","teacher":"Бүтээл ажиглах: Өвлийн сэдэвтэй уран зургийг нэг нэгээр үзүүлж, \"Юу харагдаж байна? Ямар өнгө ашигласан бэ? Ямар санагдаж байна?\" гэж асууна.\n- Сэтгэгдэл хуваалцах: Хүүхэд бүр хамгийн их таалагдсан зургаа сонгож, \"Надад энэ зураг ... учраас таалагдсан\" гэж дэлгэрэнгүй ярина.\n- Баримал ажиглах: Баримлын бүтээлийг янз бүрийн талаас нь харж, ямар материалаар хийснийг ярилцана.\nБагшийн чиглүүлэх асуулт:\n1. Энэ зурагт юу болж байна вэ?\n2. Зураач ямар өнгө ашигласан бэ? Яагаад?\n3. Энэ зургийг хараад чамд ямар мэдрэмж төрсөн бэ?","learner":"Бүтээл ажиглах:\n- Уран зураг бүрийг анхааралтай ажиглана.\n- Зурагт юу харагдаж байгааг, ямар өнгө ашигласныг нэрлэнэ.\nСэтгэгдэл хуваалцах:\n- Хамгийн их таалагдсан зургаа сонгоно.\n- \"Надад энэ зураг ... учраас таалагдсан\" гэж дэлгэрэнгүй өгүүлбэрээр хэлнэ.\nБаримал ажиглах:\n- Барималыг янз бүрийн талаас нь харна.\n- Ямар материалаар (шавар, мод, чулуу) хийснийг таана."},{"time":"1045-1100","name":"Чөлөөт тоглоом\nҮйл ажиллагаа-3","teacher":"Урлагийн буланд уран зургийн хуулбар, өнгөт харандаа байрлуулж, хүүхдүүд дуурайн зурахыг ажиглана.","learner":"- Урлагийн буланд таалагдсан уран зургийг дуурайн зурна.\n- Зургаа найздаа үзүүлж тайлбарлана."},{"time":"1100-1130","name":"Номын цаг\nҮйл ажиллагаа-4","teacher":"Чанга уншлага – хоёр дахь уншлага (2): «Ус, цэцэг хоёр» (Төлөвлөгөөний хуудсыг 12.21-ний төлөвлөлтийн дараа үзнэ үү.)\n- Номын тухай эргэн сануулах асуулт асууна: «Ус цэцэгт юу гэж хэлдэг байсан бэ?»\n- Түр зогсож асуух: «Эмч юу гэж хэлсэн бэ?», «Ус юу хийх ёстой байсан бэ?»\n- Шинэ үг: «Шарлах, хатах» – зураг дээр, «Услах» – усалгуураар үзүүлэх\n- Уншсаны дараа: Анги дахь цэцгийг хамтдаа услах, өдөр бүр хэн услахыг хуваарилах","learner":"- Номын тухай эргэн сануулах асуултад \"Ус цэцэгт ... гэж хэлдэг байсан\" гэж хариулна.\n- Түр зогсох үед эмчийн хэлсэн үгийг давтаж, \"Ус цэцгээ услах ёстой байсан\" гэж хэлнэ.\n- «Шарлах, хатах»-ыг зураг дээр заана.\n- «Услах»-ыг усалгуураар үзүүлнэ.\n- Анги дахь цэцгийг хамтдаа услах хуваарь гаргахад оролцоно."},{"time":"1130-1140","name":"Төвийн үйл ажиллагаа\nҮйл ажиллагаа-5","teacher":"Хэл ярианы төв: \"Үзэсгэлэнгийн хөтөч\" – зураг заан, бусдад тайлба
